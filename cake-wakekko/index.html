<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ケーキ わけっこ</title>
<meta name="description" content="ケーキを きって どうぶつたちに おなじだけ くばろう。わりざん と ぶんすうの はじめの いっぽ。">
<meta name="theme-color" content="#e05a8a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<link rel="stylesheet" href="style.css?v=2ad293b">
</head>
<body>

<header class="top">
  <button class="pill back" id="backBtn" hidden aria-label="メニューに もどる">‹ <span class="long">もどる</span></button>
  <h1 class="title"><span aria-hidden="true">🍰</span><span id="titleText">ケーキ わけっこ</span></h1>
  <span class="stars-total" id="starsTotal" aria-label="あつめた ほし">⭐ <b id="starCount">0</b></span>
  <button class="pill round" id="soundBtn" aria-pressed="true" aria-label="おと オン／オフ">🔊</button>
</header>

<!-- ホーム -->
<main class="view scroll" id="home">
  <div class="wrap">
    <p class="lead">ケーキを きって、どうぶつたちに <b>おなじだけ</b> くばろう！</p>
    <section class="mode-box">
      <span class="label">モード</span>
      <div class="seg" role="group" aria-label="モード">
        <button id="modeEasy" aria-pressed="true">かんたん<small>せんが ぴたっと あう・ずれ 10%まで</small></button>
        <button id="modeNormal" aria-pressed="false">ふつう<small>じぶんで まっすぐ・ずれ 5%まで</small></button>
      </div>
    </section>
    <section>
      <h2>ステージ</h2>
      <div class="grid" id="stageGrid"></div>
    </section>
    <section class="howto">
      <h2>あそびかた</h2>
      <ol>
        <li>🔪 で たべものの うえを まっすぐ なぞると きれるよ。</li>
        <li>✋ で きれた かけらを どうぶつの おさらへ はこぼう。</li>
        <li>ぜんぶ くばったら「どうぞ！」。みんな おなじなら にっこり！</li>
        <li>🍓 いちごも おなじ かず ずつ に できたら ★ ボーナス。</li>
      </ol>
    </section>
  </div>
</main>

<!-- あそぶ がめん -->
<main class="view" id="play" hidden>
  <div class="hint" id="hint"></div>
  <div class="stage" id="stageBox">
    <canvas id="cv" aria-label="テーブルと おさら"></canvas>
  </div>
  <nav class="tools" aria-label="どうぐ">
    <div class="seg tool-seg" role="group" aria-label="どうぐ">
      <button id="toolKnife" aria-pressed="true"><span class="ic">🔪</span>きる</button>
      <button id="toolHand" aria-pressed="false"><span class="ic">✋</span>はこぶ</button>
    </div>
    <button class="tbtn" id="undoBtn" aria-label="ひとつ もどす"><span class="ic">↩</span>もどす</button>
    <button class="tbtn" id="resetBtn" aria-label="さいしょから"><span class="ic">🔄</span><span class="long">さいしょ</span></button>
    <button class="tbtn go" id="giveBtn"><span class="ic">🎁</span>どうぞ！</button>
  </nav>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- けっか -->
<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="m-btns" id="mBtns"></div>
  </div>
</div>

<script src="geom.js?v=2ad293b"></script>
<script src="stages.js?v=2ad293b"></script>
<script src="app.js?v=2ad293b"></script>
</body>
</html>
