<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ケーキ わけっこ</title>
<meta name="description" content="ケーキを きって どうぶつたちに おなじだけ くばろう。わりざん と ぶんすうの はじめの いっぽ。">
<meta name="theme-color" content="#e05a8a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="top">
  <button class="pill back" id="backBtn" hidden aria-label="メニューに もどる">‹ <span class="long">もどる</span></button>
  <h1 class="title"><span aria-hidden="true">🍰</span><span id="titleText">ケーキ わけっこ</span></h1>
  <span class="stars-total" id="starsTotal" aria-label="あつめた ほし">⭐ <b id="starCount">0</b></span>
  <button class="pill round" id="soundBtn" aria-pressed="true" aria-label="おと オン／オフ">🔊</button>
</header>

<!-- ホーム -->
<main class="view scroll" id="home">
  <div class="wrap">
    <p class="lead">ケーキを きって、どうぶつたちに <b>おなじだけ</b> くばろう！</p>
    <section class="mode-box">
      <span class="label">モード</span>
      <div class="seg" role="group" aria-label="モード">
        <button id="modeEasy" aria-pressed="true">かんたん<small>せんが ぴたっと あう・ずれ 10%まで</small></button>
        <button id="modeNormal" aria-pressed="false">ふつう<small>じぶんで まっすぐ・ずれ 5%まで</small></button>
      </div>
    </section>
    <section>
      <h2>ステージ</h2>
      <div class="grid" id="stageGrid"></div>
    </section>
    <section class="howto">
      <h2>あそびかた</h2>
      <ol>
        <li>🔪 で たべものの うえを まっすぐ なぞると きれるよ。</li>
        <li>✋ で きれた かけらを どうぶつの おさらへ はこぼう。</li>
        <li>ぜんぶ くばったら「どうぞ！」。みんな おなじなら にっこり！</li>
        <li>🍓 いちごも おなじ かず ずつ に できたら ★ ボーナス。</li>
      </ol>
    </section>
  </div>
</main>

<!-- あそぶ がめん -->
<main class="view" id="play" hidden>
  <div class="hint" id="hint"></div>
  <div class="stage" id="stageBox">
    <canvas id="cv" aria-label="テーブルと おさら"></canvas>
  </div>
  <nav class="tools" aria-label="どうぐ">
    <div class="seg tool-seg" role="group" aria-label="どうぐ">
      <button id="toolKnife" aria-pressed="true"><span class="ic">🔪</span>きる</button>
      <button id="toolHand" aria-pressed="false"><span class="ic">✋</span>はこぶ</button>
    </div>
    <button class="tbtn" id="undoBtn" aria-label="ひとつ もどす"><span class="ic">↩</span>もどす</button>
    <button class="tbtn" id="resetBtn" aria-label="さいしょから"><span class="ic">🔄</span><span class="long">さいしょ</span></button>
    <button class="tbtn go" id="giveBtn"><span class="ic">🎁</span>どうぞ！</button>
  </nav>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- けっか -->
<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="m-btns" id="mBtns"></div>
  </div>
</div>

<script src="geom.js?v=4c5eb3f"></script>
<script src="stages.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
