<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #cfe6f5; color: #1d2b3a;
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "游ゴシック体", "Meiryo", system-ui, sans-serif;

  .hbtn {

  }
  #sndBtn { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); z-index: 30; }

  #hud {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));

  .pill {
    background: rgba(255,255,255,.92); border-radius: 99px; padding: 6px 14px; font-weight: bold;

    display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #d9342b;

  }
  #dots i.on { background: #d9342b; }
  #next { font-size: 15px; }
  #next ruby { font-size: 17px; }

  #toast {
    position: fixed; left: 50%; top: calc(124px + env(safe-area-inset-top)); transform: translateX(-50%);
    width: max-content; max-width: min(92vw, 560px); padding: 12px 20px; border-radius: 20px;
    background: rgba(255,255,255,.96); border: 3px solid #ffd43b; font-size: 19px; font-weight: bold;

  #ptBtn {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);

  .screen {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch;

  .panel {
    max-width: 560px; margin: 0 auto; background: rgba(255,255,255,.95); border-radius: 26px;

  }
  h1 { margin: 0 0 6px; font-size: clamp(26px, 7vw, 38px); line-height: 1.3; color: #b02a20; letter-spacing: .04em; }
  h2 { font-size: 18px; margin: 16px 0 8px; color: #4a5f75; }
  .lead { font-size: 17px; line-height: 1.9; margin: 6px 0; }
  .how { text-align: left; background: #fff8e1; border-radius: 16px; padding: 10px 14px; font-size: 16px; line-height: 1.9; }
  .opts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .big {

  .row { display: flex; gap: 10px; margin-top: 14px; }

  .sub {

<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

<body>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------------- ほぞん ---------------- */
const KEY = 'hakone-switchback:v1';
const S = { sound: true, speed: 'slow', season: 'ajisai', cards: {}, best: {}, clears: 0 };
try {
  const d = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (d && typeof d === 'object') Object.assign(S, d);
} catch (e) { }
if (!S.cards || typeof S.cards !== 'object') S.cards = {};
if (!S.best || typeof S.best !== 'object') S.best = {};
if (!['ajisai', 'koyo', 'yuki'].includes(S.season)) S.season = 'ajisai';
if (!['slow', 'normal'].includes(S.speed)) S.speed = 'slow';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };

/* ---------------- おと（WebAudio の ごうせいおん だけ） ---------------- */
let AC = null, MG = null, NB = null;
function A() {
  if (!S.sound) return null;
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C(); MG = AC.createGain(); MG.gain.value = .55; MG.connect(AC.destination);
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e) { return null; }
}
function tone(f, d, o = {}) {
  const a = A(); if (!a) return;
  const t = a.currentTime + (o.at || 0), os = a.createOscillator(), g = a.createGain();
  os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t);
  if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .2, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  os.connect(g); g.connect(MG); os.start(t); os.stop(t + d + .03);
}
function hiss(d, o = {}) {
  const a = A(); if (!a) return;
  const t = a.currentTime + (o.at || 0), src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  src.buffer = NB; fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 2000, t);
  if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + d);
  fl.Q.value = o.q || 1;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .15, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(fl); fl.connect(g); g.connect(MG); src.start(t, Math.random() * .4); src.stop(t + d + .05);
}
const sfx = {
  tap() { tone(660, .08, { type: 'triangle', vol: .14 }); },
  click() { hiss(.05, { f: 3200, vol: .3 }); tone(420, .06, { type: 'square', vol: .07, at: .02 }); hiss(.06, { f: 2200, vol: .3, at: .13 }); tone(300, .08, { type: 'square', vol: .07, at: .14 }); },
  bell() { tone(1175, .45, { type: 'triangle', vol: .15 }); tone(1175, .6, { type: 'triangle', vol: .15, at: .26 }); },
  boing() { tone(330, .45, { to: 110, vol: .25 }); tone(520, .25, { type: 'triangle', to: 260, vol: .1, at: .06 }); },
  early() { tone(330, .14, { type: 'triangle', vol: .14 }); tone(262, .2, { type: 'triangle', vol: .14, at: .14 }); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, { type: 'triangle', vol: .15, at: i * .1 })); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? .7 : .2, { type: 'triangle', vol: .16, at: i * .14 })); },
  brake() { hiss(.5, { f: 5000, to: 1500, vol: .07, type: 'highpass' }); },
  sneeze1() { hiss(.15, { f: 1200, vol: .1 }); tone(400, .15, { to: 520, vol: .06, type: 'triangle' }); },
  sneeze2() { hiss(.35, { f: 3500, to: 700, vol: .32 }); tone(520, .22, { to: 180, vol: .12 }); },
  water() { hiss(.4, { f: 6000, vol: .05, type: 'highpass' }); },
  joint() { tone(95, .06, { vol: .1 }); tone(82, .06, { vol: .08, at: .11 }); },
  step() { tone(170 + Math.random() * 50, .05, { type: 'square', vol: .035 }); },
};

/* ---------------- はこね とざん てつどうの データ（しらべた もの。README を さんしょう） ---------------- */
// スイッチバック: 出山信号場・大平台駅・上大平台信号場 の 3かしょ
// いちばん きゅうな さか 80パーミル（1000m で 80m＝100m で 8m）、いちばん きつい カーブ はんけい 30m
// 箱根湯本〜強羅 8.9km・やく 40ぷん、ひょうこう やく 96m → やく 541m（さ やく 445m）
const SW_NAME = [
  { kanji: '出山信号場', kana: 'でやま しんごうじょう' },
  { kanji: '大平台', kana: 'おおひらだい' },
  { kanji: '上大平台信号場', kana: 'かみおおひらだい しんごうじょう' },
];

/* ---------------- せんろの かたち（せかい ざひょう、y は した むきが ＋） ---------------- */
const P1 = { x: 760, y: -290 }, P2 = { x: 240, y: -600 }, P3 = { x: 760, y: -910 };
const D1 = { x: 1010, y: -330 }, D2 = { x: -10, y: -640 }, D3 = { x: 1010, y: -950 };
const LEG4 = [P3, { x: 560, y: -1010 }, { x: 330, y: -1110 }, { x: 130, y: -1200 }, { x: 30, y: -1240 }, { x: -100, y: -1240 }];
const TRACKS = [[{ x: -110, y: 0 }, { x: 200, y: 0 }, P1], [P1, D1], [P1, P2], [P2, D2], [P2, P3], [P3, D3], LEG4];
const PT = [null, P1, P2, P3];
const ARR = [null, { x: 200, y: 0 }, P1, P2];           // ポイントに くる がわ
const DEP = [null, P2, P3, LEG4[1]];                     // ポイントから でる がわ
const BUF = [D1, D2, D3, LEG4[5]];

function mkRun(pts) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  return { pts, L, len: L[L.length - 1], stops: [], spr: [] };
}
function at(r, s) {

  for (let i = PTS.length - 1; i >= 0; i--) {
    const p = PTS[i];
    p.life -= dt; p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 'leaf' || p.k === 'conf') { p.a += dt * 3; p.x += Math.sin(G.t * 2 + p.r * 3) * 18 * dt; }
    if (p.life <= 0) { if (p.amb) ambN--; PTS.splice(i, 1); }
  }
  // きせつの ふるもの
  if (S.season !== 'ajisai') {
    const vw = cw / sc, vh = ch / sc, want = 40;
    if (ambN < want && Math.random() < .5) {
      ambN++;
      const yuki = S.season === 'yuki';
      addP({ amb: 1, k: yuki ? 'snow' : 'leaf', x: cam.x + (Math.random() - .5) * vw * 1.2, y: cam.y - vh / 2 - 20, vx: (Math.random() - .5) * 20, vy: (yuki ? 30 : 40) + Math.random() * 30, g: 0, life: vh / 40 + 3, r: yuki ? 2 + Math.random() * 2.5 : 4 + Math.random() * 3, c: SP.tree[(Math.random() * SP.tree.length) | 0], a: Math.random() * 6 });
    }
  }
  updCam(dt);
  updHud();
}

function updCam(dt) {
  const r = runs[T.run];
  let m = at(r, T.s - TL / 2);
  const tx = m.x, ty = m.y - (ch / sc) * .06;
  const e = G.zoom < .5 ? 2 * G.zoom * G.zoom : 1 - Math.pow(-2 * G.zoom + 2, 2) / 2;
  sc = baseSc + (fullSc() - baseSc) * e;
  cam.x += (tx - cam.x) * Math.min(1, dt * 3); cam.y += (ty - cam.y) * Math.min(1, dt * 3);
  const vw = cw / sc, vh = ch / sc;
  cam.x = vw >= 1520 ? 500 : Math.max(-260 + vw / 2, Math.min(1260 - vw / 2, cam.x));
  cam.y = vh >= 2080 ? -660 : Math.max(-1700 + vh / 2, Math.min(380 - vh / 2, cam.y));
  if (e > 0) {
    cam.x += (500 - cam.x) * e; cam.y += (-660 - cam.y) * e;
    const g = goalRect();
    OFF.x = (g.x + g.w / 2 - cw / 2) * e; OFF.y = (g.y + g.h / 2 - ch / 2) * e;
  } else { OFF.x = 0; OFF.y = 0; }
}

let hudCache = {};
function setHud(id, v, prop = 'textContent') { if (hudCache[id] !== v) { hudCache[id] = v; $(id)[prop] = v; } }

  setHud('hint', hint);
}

/* ---------------- えを かく ---------------- */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); }
function toScr(p) { return { x: (p.x - cam.x) * sc + cw / 2 + OFF.x, y: (p.y - cam.y) * sc + ch / 2 + OFF.y }; }
let V = { x0: 0, x1: 0, y0: 0, y1: 0 };
const vis = (x, y, m = 60) => x > V.x0 - m && x < V.x1 + m && y > V.y0 - m && y < V.y1 + m;

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!skyG) { skyG = ctx.createLinearGradient(0, 0, 0, ch); skyG.addColorStop(0, SP.sky[0]); skyG.addColorStop(1, SP.sky[1]); }
  ctx.fillStyle = skyG; ctx.fillRect(0, 0, cw, ch);
  const vw = cw / sc, vh = ch / sc, ox = OFF.x / sc, oy = OFF.y / sc;
  V = { x0: cam.x - vw / 2 - ox, x1: cam.x + vw / 2 - ox, y0: cam.y - vh / 2 - oy, y1: cam.y + vh / 2 - oy };
  ctx.setTransform(sc * dpr, 0, 0, sc * dpr, (cw / 2 + OFF.x - cam.x * sc) * dpr, (ch / 2 + OFF.y - cam.y * sc) * dpr);

  // とおくの やま
  ctx.fillStyle = SP.far; poly([{ x: -3000, y: 200 }, ...FAR_TOP, { x: 3600, y: 200 }]); ctx.fill();
  // やま
  ctx.fillStyle = SP.mt; poly([{ x: -1700, y: 20 }, ...MT_TOP, { x: 2700, y: 20 }]); ctx.fill();
  ctx.fillStyle = SP.mt2; poly([{ x: -1700, y: 20 }, { x: -1700, y: -300 }, { x: -600, y: -620 }, { x: 200, y: -380 }, { x: 900, y: -560 }, { x: 1600, y: -400 }, { x: 2700, y: -260 }, { x: 2700, y: 20 }]); ctx.fill();
  if (S.season === 'yuki') { ctx.fillStyle = '#fff'; poly([{ x: -150, y: -1450 }, { x: 150, y: -1560 }, { x: 450, y: -1620 }, { x: 750, y: -1520 }, { x: 1050, y: -1350 }, { x: 800, y: -1430 }, { x: 450, y: -1540 }, { x: 100, y: -1480 }]); ctx.fill(); }
  drawValley();
  drawTrees();
  drawBridge();
  drawPlatforms();
  drawTracks();
  if (S.season === 'ajisai') drawBushes();
  drawPosts();

function drawValley() {
  ctx.fillStyle = SP.ground; ctx.fillRect(-3000, 14, 6600, 900);

  ctx.strokeStyle = SP.river; ctx.lineWidth = 34; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2000, 180);
  for (let x = -2000; x <= 2600; x += 200) ctx.quadraticCurveTo(x + 100, 160 + ((x / 200) % 2 ? 30 : -10), x + 200, 180);
  ctx.stroke();
  const roofs = ['#c0392b', '#495057', '#1971c2', '#8d5524'];
  for (const h of HOUSES) {
    if (!vis(h.x, h.y, 80)) continue;
    ctx.fillStyle = '#fff8e7'; ctx.fillRect(h.x, h.y - h.h, h.w, h.h);
    ctx.fillStyle = '#74a9cf'; ctx.fillRect(h.x + h.w * .2, h.y - h.h * .7, h.w * .22, h.h * .35);
    ctx.fillStyle = S.season === 'yuki' ? '#fff' : roofs[h.c];

function drawTrees() {

function drawBridge() {
  // 塔ノ沢と 出山信号場の あいだの てっきょう（たにを わたる）
  const a = { x: 200 + 560 * .66, y: -290 * .66 }, b = { x: 200 + 560 * .82, y: -290 * .82 };
  if (!vis(a.x, a.y, 200)) return;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  ctx.fillStyle = 'rgba(40,70,90,.45)';
  poly([{ x: a.x - 20, y: a.y + 4 }, { x: b.x + 20, y: b.y + 4 }, { x: mx + 10, y: my + 120 }, { x: mx - 10, y: my + 120 }]); ctx.fill();
  ctx.strokeStyle = SP.river; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(mx - 10, my + 112); ctx.lineTo(mx + 10, my + 112); ctx.stroke();
  ctx.strokeStyle = '#c92a2a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(a.x, a.y + 4); ctx.quadraticCurveTo(mx, my + 70, b.x, b.y + 4); ctx.stroke();
  ctx.lineWidth = 2.5;
  for (let i = 1; i < 6; i++) {
    const t = i / 6, x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t + 4;
    const yy = (1 - t) * (1 - t) * (a.y + 4) + 2 * t * (1 - t) * (my + 70) + t * t * (b.y + 4);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, yy); ctx.stroke();
  }
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(a.x, a.y + 5); ctx.lineTo(b.x, b.y + 5); ctx.stroke();

function drawPlatforms() {

function drawTracks() {
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(80,64,48,.35)'; ctx.lineWidth = 20;
  for (const tr of TRACKS) { poly(tr); ctx.stroke(); }
  ctx.lineCap = 'butt'; ctx.strokeStyle = '#7a5a3c'; ctx.lineWidth = 14; ctx.setLineDash([3.5, 5]);
  for (const tr of TRACKS) { poly(tr); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.strokeStyle = '#4f5763'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const tr of TRACKS) for (let i = 1; i < tr.length; i++) {
    const a = tr[i - 1], b = tr[i], L = Math.hypot(b.x - a.x, b.y - a.y), nx = -(b.y - a.y) / L, ny = (b.x - a.x) / L;

  }

  for (let i = 0; i < BUF.length; i++) {
    const d = BUF[i], prev = i < 3 ? PT[i + 1] : LEG4[4];
    const L = Math.hypot(d.x - prev.x, d.y - prev.y), ux = (d.x - prev.x) / L, uy = (d.y - prev.y) / L;
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(Math.atan2(uy, ux));

    ctx.fillStyle = '#212529'; for (let j = 0; j < 3; j++) ctx.fillRect(-2, -16 + j * 6, 8, 3);

}

function drawBushes() {

    ctx.fillStyle = cols[(b.c + 1) % 4]; circle(b.x, b.y - 9 * s, 6 * s);

function drawPosts() {

function drawPoints() {
  const z = G.state === 'play' ? swInfo() : null;
  for (let k = 1; k <= 3; k++) {
    const p = PT[k];
    if (!vis(p.x, p.y, 120)) continue;
    const e = pointAnim[k];
    const va = Math.atan2(ARR[k].y - p.y, ARR[k].x - p.x), vb = Math.atan2(DEP[k].y - p.y, DEP[k].x - p.x);
    let da = vb - va; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
    const ang = va + da * e;
    const cur = z && T.run === k - 1;
    if (cur && T.s > z.zs - 600) {
      const pul = .5 + .5 * Math.sin(G.t * 8);
      const hot = T.mode === 'run' && T.s >= z.zs - 280;
      ctx.fillStyle = `rgba(255,212,59,${hot ? .45 + .35 * pul : .3})`; circle(p.x, p.y, 22 + pul * 6);
      // とまる ところ
      const r = runs[T.run], a = at(r, z.zs), b = at(r, z.ze);
      ctx.strokeStyle = `rgba(255,200,40,${.45 + .3 * pul})`; ctx.lineWidth = 30; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.strokeStyle = '#212529'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(ang) * 36, p.y + Math.sin(ang) * 36); ctx.stroke();
    ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 4.5; ctx.stroke();
    ctx.fillStyle = '#fff'; circle(p.x, p.y, 5.5); ctx.fillStyle = '#e8590c'; circle(p.x, p.y, 3.5);
  }
}

function drawTrain() {
  const r = runs[T.run];
  const sx = T.shake > 0 ? Math.sin(G.t * 70) * 1.8 : 0;
  const sneezeBack = T.face === 'sneeze' ? -Math.max(0, T.shake) * 8 : 0;
  const cars = [];
  for (let i = 0; i < 2; i++) {
    const sF = T.s + sneezeBack - i * (CAR + GAP), sB = sF - CAR;
    const a = at(r, sF), b = at(r, sB);
    const dx = a.x - b.x, f = dx >= 0 ? 1 : -1;
    const ang = Math.atan2((a.y - b.y) * f, dx * f);
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    cars.push({ i, f, ang, x: cx + Math.sin(ang) * 17 + sx, y: cy - Math.cos(ang) * 17 });
  }
  if (!vis(cars[0].x, cars[0].y, 200)) return;
  for (const c of cars) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.ang); drawCar(c.i, c.f, c.ang); ctx.restore();
  }
  // いれかわる うんてんしさん・しゃしょうさん
  if (T.mode === 'switch' && T.drv > 0 || T.mode === 'swwait') {
    const p = T.mode === 'swwait' ? 1 : T.drv;
    const sd = T.s - 6 - p * (TL - 12), sc2 = T.s - TL + 6 + p * (TL - 12);
    crewWalk(r, sd, true, p);
    crewWalk(r, sc2, false, p);
  }
}

function crewWalk(r, s, isDriver, p) {
  const q = at(r, s), u = upAt(r, s), bob = (p < 1 ? Math.abs(Math.sin(G.t * 16)) : 0) * 1.2;
  const x = q.x + u.x * (11 + bob), y = q.y + u.y * (11 + bob);
  ctx.save(); ctx.translate(x, y); ctx.rotate(u.ang);
  ctx.fillStyle = '#1d3557'; rr(-3.5, -1, 7, 7, 2); ctx.fill();
  ctx.fillStyle = '#ffd8b1'; circle(0, -5, 3.6);
  ctx.fillStyle = '#1d3557'; ctx.beginPath(); ctx.arc(0, -6.2, 3.8, Math.PI, 0); ctx.fill(); ctx.fillRect(-4.8, -6.6, 9.6, 1.4);
  ctx.fillStyle = '#ffd43b'; ctx.fillRect(-1, -9, 2, 1.6);
  if (isDriver) {
    ctx.fillStyle = '#4dabf7';
    const n = T.run + 1;
    for (let j = 0; j < n; j++) { const dx = 5 + j * 2.6, dy = -9 + j * 2.2; ctx.beginPath(); ctx.moveTo(dx, dy - 2.5); ctx.quadraticCurveTo(dx + 1.8, dy + .5, dx, dy + 1.2); ctx.quadraticCurveTo(dx - 1.8, dy + .5, dx, dy - 2.5); ctx.fill(); }
  }
  ctx.restore();
}

const SHIRT = ['#f06595', '#339af0', '#51cf66', '#fcc419', '#845ef7', '#ff922b'];
const HAIR = ['#343a40', '#5c3d24', '#868e96', '#212529'];
function drawCar(i, f, ang) {
  const isHead = i === 0, outer = isHead ? f : -f, id = isHead ? T.headCar : 3 - T.headCar;
  const walking = T.mode === 'switch' && T.drv > 0 || T.mode === 'swwait';
  // しゃりん
  ctx.fillStyle = '#343a40'; circle(-22, 14, 5.5); circle(22, 14, 5.5);
  ctx.fillStyle = '#868e96'; circle(-22, 14, 2); circle(22, 14, 2);
  // からだ
  ctx.fillStyle = '#d9342b'; rr(-35, -15, 70, 29, 7); ctx.fill();
  ctx.fillStyle = '#8f1f17'; ctx.fillRect(-34, 9, 68, 4.5);
  ctx.fillStyle = '#fff3d6'; ctx.fillRect(-35, 2, 70, 3);
  ctx.fillStyle = '#a8261d'; rr(-32, -18.5, 64, 4.5, 2); ctx.fill();
  if (S.season === 'yuki') { ctx.fillStyle = '#fff'; rr(-30, -22, 60, 5, 2.5); ctx.fill(); }
  if (id === 1) {
    ctx.strokeStyle = '#343a40'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-6, -18.5); ctx.lineTo(1, -28); ctx.lineTo(6, -18.5); ctx.moveTo(-8, -28); ctx.lineTo(9, -28); ctx.stroke();
  }
  // まど
  const WX = [-24, -8, 8, 24];
  for (let w = 0; w < 4; w++) { ctx.fillStyle = '#d0ebff'; rr(WX[w] - 5.5, -11.5, 11, 10, 2); ctx.fill(); }
  // ひと
  const th = ang * 1.4 + T.lean * .06 * f;
  for (let w = 0; w < 4; w++) {
    const wx = WX[w];
    if (wx === outer * 24) {
      if (!walking) crewSit(wx, outer);
      continue;
    }
    const k = (id * 4 + w) % 6;
    const lx = Math.sin(th), ly = -Math.cos(th);
    ctx.strokeStyle = SHIRT[k]; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(wx, -1.5); ctx.lineTo(wx + lx * 3.5, -1.5 + ly * 3.5); ctx.stroke();
    ctx.fillStyle = '#ffd8b1'; circle(wx + lx * 6.5, -1.5 + ly * 6.5, 2.8);
    ctx.fillStyle = HAIR[k % 4]; ctx.beginPath(); ctx.arc(wx + lx * 6.8, -1.5 + ly * 6.8, 2.9, th - Math.PI, th); ctx.fill();
  }
  // かお（せんとうの はなさき）
  const fx = outer * 32;
  if (isHead) {
    if (T.face === 'sneeze' || T.face === 'happy') {
      ctx.strokeStyle = '#212529'; ctx.lineWidth = 1.2; ctx.beginPath();
      ctx.moveTo(fx - 2, -5); ctx.lineTo(fx + 1.5 * outer, -3.6); ctx.lineTo(fx - 2, -2.4); ctx.stroke();
    } else {
      const big = T.face === 'wow' ? 3.2 : 2.5;
      ctx.fillStyle = '#fff'; circle(fx, -4, big);
      ctx.fillStyle = '#212529'; circle(fx + outer * .9, -4, big * .55);
    }
    ctx.fillStyle = 'rgba(255,135,135,.8)'; circle(fx - outer * 1.5, 1, 1.6);
    ctx.strokeStyle = '#212529'; ctx.lineWidth = 1;
    ctx.beginPath();
    if (T.face === 'sneeze' || T.face === 'wow') ctx.arc(fx, 6.5, 1.6, 0, Math.PI * 2);
    else ctx.arc(fx, 5.2, 1.8, .2, Math.PI - .2);
    ctx.stroke();
    ctx.fillStyle = '#fff59d'; circle(outer * 34.2, 10, 1.6);
  } else {
    ctx.fillStyle = '#ff6b6b'; circle(outer * 34.2, 10, 1.5);
  }
}

function crewSit(wx, outer) {
  ctx.fillStyle = '#1d3557'; ctx.fillRect(wx - 3, -5, 6, 4);
  ctx.fillStyle = '#ffd8b1'; circle(wx, -6.5, 2.8);
  ctx.fillStyle = '#1d3557'; ctx.beginPath(); ctx.arc(wx, -7.5, 3, Math.PI, 0); ctx.fill();
  ctx.fillRect(outer > 0 ? wx : wx - 4.6, -7.9, 4.6, 1.2);
}

function drawParticles() {
  for (const p of PTS) {
    if (!vis(p.x, p.y, 20)) continue;
    if (p.k === 'snow') { ctx.fillStyle = 'rgba(255,255,255,.92)'; circle(p.x, p.y, p.r); }
    else if (p.k === 'drop') { ctx.fillStyle = 'rgba(77,171,247,.85)'; circle(p.x, p.y, p.r); }
    else if (p.k === 'petal') { ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.c; circle(p.x, p.y, p.r); ctx.globalAlpha = 1; }
    else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.k === 'leaf') { ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .5, 0, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      ctx.restore();
    }
  }
}

function signBoard(x, y, kanji, kana, sig) {
  ctx.font = 'bold 17px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  const w1 = ctx.measureText(kanji).width;
  ctx.font = 'bold 11px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  const w2 = ctx.measureText(kana).width;
  const w = Math.max(w1, w2) + 18, h = 44;
  ctx.fillStyle = sig ? '#fff4c2' : '#fff';
  ctx.strokeStyle = sig ? '#e67700' : '#1d3557'; ctx.lineWidth = 2.5;
  rr(x - w / 2, y - h, w, h, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#d9342b'; ctx.fillRect(x - w / 2 + 4, y - 6, w - 8, 3);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#495057'; ctx.fillText(kana, x, y - h + 15);
  ctx.font = 'bold 17px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  ctx.fillStyle = '#1d2b3a'; ctx.fillText(kanji, x, y - 11);
}

function drawLabels() {
  const small = sc < .5;
  for (const s of SIGNS) {
    if (small && !s.major) continue;
    const q = toScr({ x: s.p.x, y: s.p.y - 62 });
    if (s.sig) q.y = toScr({ x: s.p.x, y: s.p.y + 34 }).y + 44;
    if (q.x < -120 || q.x > cw + 120 || q.y < -20 || q.y > ch + 60) continue;
    signBoard(q.x, q.y, s.kanji, s.kana, s.sig);
  }
  if (!small) {
    for (const p of SPR_SIGNS) {
      const q = toScr({ x: p.x, y: p.y + 30 }); q.y += 34;
      if (q.x < -60 || q.x > cw + 60 || q.y < -20 || q.y > ch + 60) continue;
      ctx.fillStyle = '#e7f5ff'; ctx.strokeStyle = '#1c7ed6'; ctx.lineWidth = 2;
      rr(q.x - 22, q.y - 34, 44, 34, 6); ctx.fill(); ctx.stroke();
      ctx.textAlign = 'center'; ctx.fillStyle = '#1c7ed6';
      ctx.font = 'bold 9px sans-serif'; ctx.fillText('さんすい', q.x, q.y - 23);
      ctx.font = 'bold 15px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif'; ctx.fillText('散水', q.x, q.y - 6);
    }
    const z = G.state === 'play' ? swInfo() : null;
    if (z && T.s > z.zs - 600 && (T.mode === 'run' || T.mode === 'back')) {
      const r = runs[T.run], m = at(r, (z.zs + z.ze) / 2), q = toScr({ x: m.x, y: m.y - 46 });
      const bob = Math.sin(G.t * 6) * 4;
      ctx.font = 'bold 18px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText('ここで とまる', q.x, q.y - 30 + bob);
      ctx.fillStyle = '#e8590c'; ctx.fillText('ここで とまる', q.x, q.y - 30 + bob);
      ctx.font = 'bold 24px sans-serif'; ctx.strokeText('▼', q.x, q.y - 6 + bob); ctx.fillText('▼', q.x, q.y - 6 + bob);
      const pq = toScr(PT[T.run + 1]);
      ctx.font = 'bold 14px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
      ctx.lineWidth = 4; ctx.strokeText('ポイント', pq.x, pq.y - 34); ctx.fillStyle = '#5c3d00'; ctx.fillText('ポイント', pq.x, pq.y - 34);
    }
  } else {
    const q = toScr({ x: 520, y: 330 });
    ctx.font = 'bold 18px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText('したの まち（おんせんの まち）', q.x, q.y);
    ctx.fillStyle = '#1d3557'; ctx.fillText('したの まち（おんせんの まち）', q.x, q.y);
  }
}

function drawBubble() {
  const b = T.bubble; if (!b || G.state !== 'play') return;
  const r = runs[T.run];
  let s = T.s - 8;
  if (b.who === 'driver' && T.mode === 'switch') s = T.s - 6 - T.drv * (TL - 12);
  const p = at(r, s), q = toScr({ x: p.x, y: p.y - 40 });
  ctx.font = 'bold 18px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  const w = ctx.measureText(b.text).width + 24, h = 38;
  let x = Math.max(w / 2 + 6, Math.min(cw - w / 2 - 6, q.x)), y = Math.max(h + 70, q.y - 14);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1d3557'; ctx.lineWidth = 2.5;
  rr(x - w / 2, y - h, w, h, 14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(q.x - 7, y - 1); ctx.lineTo(q.x, y + 12); ctx.lineTo(q.x + 7, y - 1); ctx.fill();
  ctx.fillStyle = '#1d2b3a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.text, x, y - h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

const CARD_ORDER = ['sb', 'saka', 'mizu', 'tozan'];
let cardCb = null;
function openCard(id, cb) {
  G.paused = true; cardCb = cb;
  $('cardBody').innerHTML = `<div class="card-t">${CARDS[id].t}</div><div class="card-b">${CARDS[id].b()}</div>`;
  show('cardModal', true);
  sfx.yay();
}
$('cardOk').addEventListener('click', () => {
  show('cardModal', false); G.paused = false;
  const cb = cardCb; cardCb = null; if (cb) cb();
});
function renderCardList() {
  $('cardList').innerHTML = CARD_ORDER.map(id => S.cards[id]
    ? `<div class="mini"><div class="card-t" style="font-size:21px">${CARDS[id].t}</div><div class="card-b" style="font-size:16px">${CARDS[id].b()}</div></div>`
    : `<div class="mini locked">❓ まだ ないしょ</div>`).join('');
}

/* ---------------- がめんの きりかえ ---------------- */
function show(id, on) { $(id).classList.toggle('hide', !on); }
function fmt(t) { return `${Math.floor(t / 60)}ぷん ${String(t % 60).padStart(2, '0')}びょう`; }
function refreshTitle() {
  for (const b of $('optSeason').children) b.setAttribute('aria-pressed', b.dataset.v === S.season);
  for (const b of $('optSpeed').children) b.setAttribute('aria-pressed', b.dataset.v === S.speed);
  const n = CARD_ORDER.filter(id => S.cards[id]).length;
  $('cardCount').textContent = `${n}/${CARD_ORDER.length}`;
  const parts = [];
  if (S.best.slow) parts.push(`🐢 ${fmt(S.best.slow)}`);
  if (S.best.normal) parts.push(`🐇 ${fmt(S.best.normal)}`);
  $('bestLine').innerHTML = (S.clears ? `🏔️ ${rb('強羅', 'ごうら')}に ついた かず: ${S.clears}かい<br>` : '') + (parts.length ? `⏱ ベスト（きろくだけ）: ${parts.join('　')}` : '');
}
function toTitle() {
  G.state = 'title';
  show('hud', false); show('ptBtn', false); show('goal', false); show('cardsView', false); show('cardModal', false);
  $('hint').textContent = ''; $('toast').classList.remove('show');
  resetTrain();
  refreshTitle(); show('title', true);
}
function showGoal() {
  G.state = 'goal';
  show('ptBtn', false); show('hud', false); $('hint').textContent = '';
  const t = Math.round(G.time);
  $('gPraise').innerHTML = G.oops === 0 ? '🌟 おっとっと 0かい！ うんてんの めいじん！' : `🌟 ${G.oops}かい おっとっと しても、さいごまで がんばったね！`;
  $('gStat').innerHTML = `⏱ ${fmt(t)}${G.newBest ? '　🆕 ベスト！' : ''}<br>🔀 スイッチバック 3かい せいこう<br>🧑‍✈️ うんてんしさんは へとへと… でも にっこり！${G.newCard ? '<br>📗 あたらしい まなびカード ゲット！' : ''}`;
  const st = [
    ['箱根湯本', 'はこねゆもと'], ['塔ノ沢', 'とうのさわ'], ['出山信号場', 'でやま しんごうじょう', 1], ['大平台', 'おおひらだい'],
    ['上大平台信号場', 'かみおおひらだい しんごうじょう', 1], ['仙人台信号場', 'せんにんだい しんごうじょう', 1],
    ['宮ノ下', 'みやのした'], ['小涌谷', 'こわきだに'], ['彫刻の森', 'ちょうこくのもり'], ['強羅', 'ごうら'],
  ];
  $('gStations').innerHTML = 'とおった ところ<br>' + st.map(s => s[2] ? `<span class="sig">${rb(s[0], s[1])}</span>` : rb(s[0], s[1])).join(' → ');
  show('goal', true);
  $('goal').scrollTop = 0;
}

/* ---------------- そうさ ---------------- */
$('ptBtn').addEventListener('pointerdown', e => { e.preventDefault(); tapPoint(); });
$('ptBtn').addEventListener('click', e => e.preventDefault());
cv.addEventListener('pointerdown', e => { e.preventDefault(); A(); tapPoint(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { if (G.state === 'play') { e.preventDefault(); tapPoint(); } } });
$('startBtn').addEventListener('click', () => { A(); sfx.bell(); startGame(); });
$('againBtn').addEventListener('click', () => { A(); startGame(); });
$('toTitle').addEventListener('click', toTitle);
$('homeBtn').addEventListener('click', toTitle);
$('cardsBtn').addEventListener('click', () => { renderCardList(); show('cardsView', true); $('cardsView').scrollTop = 0; });
$('gCards').addEventListener('click', () => { renderCardList(); show('cardsView', true); $('cardsView').scrollTop = 0; });
$('cardsClose').addEventListener('click', () => show('cardsView', false));
for (const b of $('optSeason').children) b.addEventListener('click', () => {
  S.season = b.dataset.v; SP = SEASONS[S.season]; skyG = null; save(); refreshTitle(); sfx.tap();
  for (let i = PTS.length - 1; i >= 0; i--) if (PTS[i].amb) PTS.splice(i, 1);
  ambN = 0;
});
for (const b of $('optSpeed').children) b.addEventListener('click', () => { S.speed = b.dataset.v; save(); refreshTitle(); sfx.tap(); });
function refreshSnd() { $('sndBtn').textContent = S.sound ? '🔊' : '🔇'; }
$('sndBtn').addEventListener('click', () => { S.sound = !S.sound; save(); refreshSnd(); if (S.sound) sfx.tap(); });
refreshSnd(); refreshTitle();

// テスト用（Playwright から じょうたいを みる）
window.__hs = { G, T, S, runs, swInfo, tapPoint };

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
