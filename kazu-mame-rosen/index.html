<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かず まめ ろせんず</title>
<meta name="description" content="ろせんずの えきを まわって、かずの まめちしきを あつめよう。でんしゃ・ろせんずの ふしぎを さんすうで たしかめる アプリ。">
<meta name="theme-color" content="#e0483e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #1d2b3a;
    --ink-soft: #55697e;
    --paper: #ffffff;
    --bg: #f3f7fb;
    --line: #d8e3ee;
    --R: #e0483e; --R-t: #fdecea;
    --K: #2f7fd8; --K-t: #e8f1fc;
    --C: #23a05a; --C-t: #e6f6ec;
    --ok: #1f9d55; --ng: #d9463b; --gold: #f2b01e;
  }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "游ゴシック体", "Meiryo", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  ruby rt { font-size: .5em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ---------- あたま ---------- */
  header.top { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
  .back { text-decoration: none; color: var(--ink-soft); font-size: 15px; padding: 10px 6px; }
  .title { flex: 1; text-align: center; margin: 0; font-size: clamp(20px, 5.4vw, 32px); letter-spacing: .02em; white-space: nowrap; }
  .title small { display: block; font-size: 13px; color: var(--ink-soft); letter-spacing: 0; margin-top: 2px; font-weight: normal; }
  .iconbtn { min-width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); font-size: 22px; }

  .progress { display: flex; align-items: center; gap: 10px; margin: 8px 0 14px; font-size: 15px; color: var(--ink-soft); }
  .bar { flex: 1; height: 12px; border-radius: 99px; background: #e2eaf2; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--R), var(--gold), var(--C)); transition: width .4s; }

  /* ---------- ろせん タブ ---------- */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .tab {
    border: 3px solid var(--line); background: var(--paper); border-radius: 16px;
    padding: 10px 4px 8px; min-height: 70px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: clamp(13px, 3.6vw, 16px); font-weight: bold;
  }
  .tab .mark { width: 30px; height: 30px; border-radius: 50%; border: 5px solid var(--c); background: #fff;
    display: grid; place-items: center; font-size: 13px; color: var(--c); font-weight: 900; }
  .tab .cnt { font-size: 12px; font-weight: normal; color: var(--ink-soft); }
  .tab[aria-pressed="true"] { border-color: var(--c); background: var(--t); }

  .lineinfo { margin: 0 0 10px; font-size: 15px; color: var(--ink-soft); line-height: 1.6; }

  .tools { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pill { border: 2px solid var(--line); background: var(--paper); border-radius: 99px; padding: 10px 16px; min-height: 48px; font-size: 15px; }

  /* ---------- えき の ならび（たての ろせんず） ---------- */
  .strip { position: relative; list-style: none; margin: 0; padding: 0; }
  .strip::before {
    content: ""; position: absolute; left: 33px; top: 30px; bottom: 30px; width: 12px; border-radius: 6px; background: var(--c);
  }
  .strip li { position: relative; margin: 0 0 8px; }
  .st {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    background: transparent; border: 0; padding: 6px 8px 6px 8px; min-height: 64px; border-radius: 16px;
  }
  .st:active { background: rgba(0,0,0,.04); }
  .st .dot {
    flex: none; width: 62px; height: 62px; border-radius: 50%; background: #fff; border: 6px solid var(--c);
    display: grid; place-items: center; position: relative; z-index: 1; font-weight: 900; font-size: 15px; color: var(--c);
  }
  .st.done .dot { background: var(--c); color: #fff; }
  .st .nm { flex: 1; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: clamp(15px, 4.2vw, 18px); line-height: 1.5; font-weight: bold; }
  .st .nm small { display: block; font-weight: normal; font-size: 13px; color: var(--ink-soft); }
  .st .stamp { flex: none; width: 34px; font-size: 26px; text-align: center; }

  /* ---------- カード（まめちしき） ---------- */
  .modal { position: fixed; inset: 0; background: rgba(20, 30, 45, .45); display: none; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal.open { display: block; }
  .card {
    max-width: 640px; margin: calc(12px + env(safe-area-inset-top)) auto 40px; background: var(--paper); border-radius: 24px;
    border-top: 14px solid var(--c); padding: 16px 16px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.2);
    width: calc(100% - 24px);
  }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .card-head .dot { width: 52px; height: 52px; border-radius: 50%; border: 6px solid var(--c); display: grid; place-items: center; color: var(--c); font-weight: 900; font-size: 14px; flex: none; }
  .card-head h2 { flex: 1; margin: 0; font-size: clamp(17px, 4.6vw, 21px); line-height: 1.5; }
  .close { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 22px; flex: none; }
  .big { font-size: 64px; text-align: center; margin: 10px 0 4px; }
  .q { font-size: clamp(18px, 5vw, 23px); line-height: 1.8; margin: 4px 0 14px; font-weight: bold; }
  .choices { display: grid; gap: 10px; }
  .ch {
    min-height: 60px; border-radius: 16px; border: 3px solid var(--line); background: #fff; font-size: clamp(17px, 4.8vw, 21px);
    font-weight: bold; padding: 10px 14px; text-align: left; line-height: 1.5;
  }
  .ch.ok { border-color: var(--ok); background: #e5f6ec; }
  .ch.ng { border-color: var(--ng); background: #fdecea; opacity: .6; }
  .ch:disabled { cursor: default; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
  .hint { margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: #fff7e0; font-size: 16px; line-height: 1.7; display: none; }
  .hint.show { display: block; }

  .result { display: none; margin-top: 16px; }
  .result.show { display: block; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .yay { text-align: center; font-size: clamp(24px, 7vw, 32px); font-weight: 900; color: var(--ok); margin: 0 0 8px; }
  .yay .stampmark { display: inline-block; animation: stamp .5s cubic-bezier(.2,1.8,.4,1); }
  @keyframes stamp { from { transform: scale(2.4) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .ex { font-size: 17px; line-height: 1.9; margin: 0 0 12px; }
  .ex b { color: var(--c); }
  .math { border: 3px dashed var(--c); background: var(--t); border-radius: 16px; padding: 12px 14px; margin: 0 0 14px; }
  .math h3 { margin: 0 0 6px; font-size: 15px; color: var(--c); }
  .math p { margin: 0; font-size: clamp(17px, 4.8vw, 21px); line-height: 1.8; font-weight: bold; }
  .widget { border: 2px solid var(--line); border-radius: 18px; padding: 12px; margin: 0 0 14px; background: #fbfdff; }
  .widget h3 { margin: 0 0 8px; font-size: 16px; }
  .widget svg { display: block; width: 100%; height: auto; max-height: 340px; touch-action: manipulation; }
  .wrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 0; }
  .wbtn { min-width: 56px; min-height: 52px; border-radius: 14px; border: 2px solid var(--c); background: #fff; font-size: 18px; font-weight: bold; padding: 6px 12px; color: var(--c); }
  .wbtn[aria-pressed="true"] { background: var(--c); color: #fff; }
  .wout { text-align: center; font-size: clamp(16px, 4.6vw, 20px); font-weight: bold; line-height: 1.7; margin: 8px 0 0; min-height: 1.7em; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .navbtn { min-height: 58px; border-radius: 16px; border: 0; font-size: 18px; font-weight: bold; background: #e9eef4; }
  .navbtn.go { background: var(--c); color: #fff; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1d2b3a; color: #fff; padding: 12px 20px; border-radius: 99px; font-size: 16px; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s; white-space: nowrap; }
  .toast.show { opacity: 1; }

  @media (min-width: 700px) {
    .choices { grid-template-columns: 1fr 1fr 1fr; }
    .ch { text-align: center; }
  }
</style>

<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../">← メニュー</a>
    <h1 class="title">かず まめ ろせんず<small>えきを まわって かずの まめちしきを あつめよう</small></h1>
    <button class="iconbtn" id="sndBtn" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>

  <div class="progress"><span>🎫</span><div class="bar"><i id="barFill"></i></div><span id="progText">0 / 0</span></div>

  <div class="tabs" id="tabs"></div>
  <p class="lineinfo" id="lineInfo"></p>
  <div class="tools">
    <button class="pill" id="randBtn" type="button">🎲 どこかの えきへ</button>
    <button class="pill" id="nextBtn" type="button">🚃 まだの えきへ</button>
  </div>
  <ol class="strip" id="strip"></ol>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card" id="card"></div>
</div>
<div class="toast" id="toast"></div>

<script>

var cur = null, tried = 0;
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function idxOf(id) { for (var i = 0; i < FACTS.length; i++) if (FACTS[i].id === id) return i; return -1; }

function openFact(id) {
  var f = FACTS[idxOf(id)]; if (!f) return;
  cur = f; tried = 0;
  var card = $("card"); cvars(card, f.line);
  card.innerHTML =
    '<div class="card-head"><span class="dot">' + f.id + '</span><h2>' + fmt(f.name) + '</h2>' +
    '<button class="close" type="button" id="closeBtn" aria-label="とじる">✕</button></div>' +
    '<div class="big" aria-hidden="true">' + f.big + '</div>' +
    '<p class="q">' + fmt(f.q) + '</p>' +
    '<div class="choices" id="choices"></div>' +
    '<p class="hint" id="hint">💡 ' + fmt(f.hint) + '</p>' +
    '<div class="result" id="result">' +
      '<p class="yay"><span class="stampmark">💮</span> せいかい！</p>' +
      '<p class="ex">' + fmt(f.ex) + '</p>' +
      '<div class="math"><h3>🧮 さんすうで みてみよう</h3><p>' + fmt(f.math) + '</p></div>' +
      (f.widget ? '<div class="widget" id="widget"></div>' : '') +
      '<div class="nav"><button class="navbtn" type="button" id="homeBtn">🗺️ ろせんずへ</button>' +
      '<button class="navbtn go" type="button" id="goBtn">つぎの えき ▶</button></div>' +
    '</div>';
  var box = $("choices");
  shuffle(f.choices.map(function (c, i) { return { c: c, ok: i === 0 }; })).forEach(function (o) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "ch"; b.innerHTML = fmt(o.c);
    b.addEventListener("click", function () { answer(b, o.ok); });
    box.appendChild(b);
  });
  $("closeBtn").addEventListener("click", closeFact);
  $("homeBtn").addEventListener("click", closeFact);
  $("goBtn").addEventListener("click", function () {
    var i = idxOf(f.id), n = FACTS[(i + 1) % FACTS.length];
    if (n.line !== state.line) { state.line = n.line; save(); }
    openFact(n.id);
  });
  $("modal").classList.add("open");
  $("modal").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function answer(btn, ok) {
  if (ok) {
    var all = document.querySelectorAll(".ch");
    for (var i = 0; i < all.length; i++) all[i].disabled = true;
    btn.classList.add("ok");
    var first = !state.done[cur.id];
    state.done[cur.id] = 1; save();
    SND.ok(); setTimeout(SND.stamp, 450);
    $("result").classList.add("show");
    if (cur.widget && WIDGETS[cur.widget]) WIDGETS[cur.widget]($("widget"));
    setTimeout(function () { $("result").scrollIntoView({ behavior: "smooth", block: "start" }); }, 250);
    if (first) checkLineClear(cur.line);
  } else {
    tried++;

  }
}
function checkLineClear(line) {
  var all = FACTS.filter(function (f) { return f.line === line; });
  if (all.every(function (f) { return state.done[f.id]; })) {
    setTimeout(function () { toast("🎉 " + lineOf(line).name + " ぜんえき せいは！"); }, 900);
  }
}

}

        var g = svgEl("g", { style: "cursor:pointer" }, svg);
        var odd = deg(P, v) % 2 === 1;
        svgEl("circle", { cx: n[0], cy: n[1], r: 26, fill: "transparent" }, g);
        svgEl("circle", { cx: n[0], cy: n[1], r: 17, fill: v === curN ? "#e0483e" : (showDeg && odd ? "#ffe2a8" : "#fff"),
          stroke: showDeg && odd ? "#e08a00" : "#1d2b3a", "stroke-width": 4 }, g);
        if (showDeg) { var t = svgEl("text", { x: n[0], y: n[1] + 6, "text-anchor": "middle", "font-size": 17, "font-weight": "bold", fill: v === curN ? "#fff" : "#1d2b3a" }, g); t.textContent = deg(P, v); }
        g.addEventListener("click", function () { tapNode(v); });
      });
    }
    function tapNode(v) {
      var P = PUZ[pi];
      if (curN < 0) { curN = v; SND.step(0); draw(); out.textContent = "つぎの まるを タップ"; return; }
      var hit = -1;
      for (var i = 0; i < P.edges.length; i++) {
        var e = P.edges[i];
        if (!used[i] && ((e[0] === curN && e[1] === v) || (e[1] === curN && e[0] === v))) { hit = i; break; }
      }
      if (hit < 0) { SND.ng(); out.textContent = "そこへの せんは もう ないよ"; return; }
      used[hit] = true; curN = v; SND.step(used.filter(Boolean).length); draw();
      var left = used.filter(function (u) { return !u; }).length;
      if (left === 0) { SND.stamp(); out.innerHTML = "🎉 できた！ ひとふでがき せいこう！"; return; }
      var canMove = P.edges.some(function (e, i) { return !used[i] && (e[0] === curN || e[1] === curN); });
      if (!canMove) {
        out.innerHTML = "つまっちゃった（のこり " + left + "ほん）。↺ で やりなおそう" + (pi === 2 ? "<br>じつは これは だれにも できない！ 🔍で かずを みてみよう" : "");
      } else {
        out.textContent = "のこり " + left + "ほん";
      }
    }
    var row = document.createElement("div"); row.className = "wrow"; box.appendChild(row);
    var pbs = PUZ.map(function (P, i) {
      return btn(P.name, function () { pi = i; pbs.forEach(function (b, j) { b.setAttribute("aria-pressed", j === i ? "true" : "false"); }); SND.tap(); reset(); }, row);
    });
    pbs[0].setAttribute("aria-pressed", "true");
    var row2 = document.createElement("div"); row2.className = "wrow"; box.appendChild(row2);
    btn("↺ やりなおす", function () { SND.tap(); reset(); }, row2);
    var db = btn("🔍 せんの かず", function () {
      showDeg = !showDeg; db.setAttribute("aria-pressed", showDeg ? "true" : "false"); SND.tap(); draw();
      if (showDeg) {
        var P = PUZ[pi], odd = P.nodes.filter(function (_, v) { return deg(P, v) % 2; }).length;
        out.innerHTML = "きすう（オレンジ）の まるは <b>" + odd + "こ</b> → " + (odd === 0 ? "どこからでも できる！" : odd === 2 ? "オレンジから スタートすれば できる！" : "ひとふでがきは できない！");
      }
    }, row2);
    box.appendChild(out);
    reset();
  }
};

/* ========== ボタン ========== */
function soundBtn() { $("sndBtn").textContent = state.sound ? "🔊" : "🔇"; }
$("sndBtn").addEventListener("click", function () { state.sound = !state.sound; save(); soundBtn(); SND.tap(); });
$("randBtn").addEventListener("click", function () {
  SND.tap(); var f = FACTS[Math.floor(Math.random() * FACTS.length)]; state.line = f.line; save(); renderHome(); openFact(f.id);
});
$("nextBtn").addEventListener("click", function () {
  SND.tap();
  var rest = FACTS.filter(function (f) { return !state.done[f.id]; });
  if (!rest.length) { toast("🎉 ぜんぶの えきを まわったよ！"); return; }
  var mine = rest.filter(function (f) { return f.line === state.line; });
  var f = (mine.length ? mine : rest)[0]; state.line = f.line; save(); renderHome(); openFact(f.id);
});

soundBtn();
renderHome();
})();
</script>
</body>
</html>
