<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ebfbee">
<title>うんとこしょ！ おおきなかぶ ― ゆびで ひっぱる えほん</title>
<link rel="stylesheet" href="style.css?v=24c1b95">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- ============================ ひょうし ============================ -->
<section id="screen-title" class="screen is-on">
  <div class="cover">
    <div class="cover-art" id="coverArt"></div>
    <div class="cover-text">
      <h1 class="title"><span class="t1">うんとこしょ！</span><span class="t2">おおきなかぶ</span></h1>
      <p class="subtitle">ゆびで ひっぱる えほん</p>
      <div class="modes">
        <button class="big-btn" id="btn-start">📖 よみはじめる</button>
        <button class="ghost-btn is-hidden" id="btn-continue">🔖 つづき から</button>
      </div>
      <p class="family">👆👆👆 <ruby>指<rt>ゆび</rt></ruby>は <ruby>何本<rt>なんぼん</rt></ruby> つかっても いいよ。<br><ruby>家族<rt>かぞく</rt></ruby> みんなで いっしょに <ruby>引<rt>ひ</rt></ruby>っぱろう！</p>
      <div class="settings">
        <button class="toggle" data-toggle="sound" aria-pressed="true">🎵 おと <b>オン</b></button>
        <button class="toggle" data-toggle="voice" aria-pressed="true">🗣 よみあげ <b>オン</b></button>
        <button class="toggle lang" data-lang-btn>🇬🇧 <span>English</span></button>
      </div>
      <a class="back-menu" href="../">← あそびメニュー</a>
    </div>
  </div>
</section>

<!-- ============================ ほん ============================ -->
<section id="screen-book" class="screen">
  <header class="topbar">
    <button class="icon-btn" id="btn-home" aria-label="ひょうし へ">🏠</button>
    <div class="where"><span>おおきなかぶ</span><small id="pageNo"></small></div>
    <button class="icon-btn toggle-mini" data-toggle="sound" aria-label="おと">🎵<b></b></button>
    <button class="icon-btn toggle-mini" data-toggle="voice" aria-label="よみあげ">🗣<b></b></button>
  </header>
  <div class="book">
    <div class="leaf leaf-art" id="leafArt">
      <div class="art" id="art">
        <div class="art-svg" id="artSvg"></div>
        <div class="art-ui" id="artUi">
          <div class="ring is-hidden" id="ring"></div>
          <div class="hand is-hidden" id="hand">👉</div>
          <div class="meter is-hidden" id="meter"></div>
          <div class="badge is-hidden" id="badge"></div>
        </div>
      </div>
    </div>
    <div class="leaf leaf-text">
      <div class="words" id="words"></div>
      <p class="hint is-hidden" id="hint"></p>
      <div class="controls">
        <button class="nav-btn prev" id="btn-prev" aria-label="まえ の ページ">◀</button>
        <button class="nav-btn reread" id="btn-reread" aria-label="もういちど よむ">🔁</button>
        <button class="nav-btn lang" id="btn-lang" data-lang-btn>🇬🇧 <span>English</span></button>
        <button class="nav-btn next" id="btn-next">つぎ ▶</button>
      </div>
    </div>
  </div>
</section>

<!-- ============================ おしまい ============================ -->
<section id="screen-end" class="screen">
  <div class="end-card">
    <div class="end-art" id="endArt"></div>
    <h2 class="end-big">おしまい</h2>
    <p class="end-sub">みんなで <ruby>力<rt>ちから</rt></ruby>を あわせたら、 <ruby>大<rt>おお</rt></ruby>きな かぶが <ruby>抜<rt>ぬ</rt></ruby>けたね。</p>
    <p class="end-count">かぶを <ruby>抜<rt>ぬ</rt></ruby>いた <ruby>数<rt>かず</rt></ruby> <b id="endCount">1</b> <ruby>回<rt>かい</rt></ruby></p>
    <div class="end-btns">
      <button class="big-btn" id="btn-end-again">📖 もういちど よむ</button>
      <button class="ghost-btn" id="btn-end-home">🏠 ひょうし</button>
    </div>
  </div>
</section>
