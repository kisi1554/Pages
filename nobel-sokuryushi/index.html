// 受賞年ごとの解説
const EX = {
  1927: "水蒸気を過飽和にした容器を急に膨張させると、荷電粒子が通った跡にそって霧の粒ができ、飛跡が白い線として見えます（1911年頃に完成）。磁場をかければ曲がり方から電荷や運動量がわかり、のちの陽電子やミュー粒子の発見を支えた「素粒子を目で見る」最初の道具です。",

  1935: "1932年、ベリリウムにα線を当てると出る透過力の強い放射線が、陽子とほぼ同じ質量で電荷をもたない粒子であることを示しました。原子核は陽子と中性子でできているという描像が確立し、核力・核分裂の研究の出発点になりました。",

  1945: "1925年に示された「同じ量子状態に2つの電子は入れない」という原理です。周期表の構造を説明し、のちにスピンが半整数の粒子（フェルミオン：電子・クォークなど）すべてに成り立つことがわかりました。物質が押しつぶされずに大きさを保つ根本的な理由でもあります。",
  1948: "霧箱にガイガー計数管を組み合わせ、粒子が通ったときだけ霧箱を作動させる「計数管制御霧箱」を開発し、宇宙線の観測効率を大きく高めました。1933年にはこれで陽電子を確認し、光から電子と陽電子が対になって生まれる現象（対生成）もとらえました。",
  1949: "1935年、陽子と中性子を結びつける核力は、電子の約200倍の質量をもつ未知の粒子（中間子）をやりとりすることで生じると予言しました。「力の届く距離が短いほど、媒介する粒子は重い」という考え方は、「力は粒子の交換で伝わる」という現代の素粒子論の基本になっています。",
  1950: "写真乾板に荷電粒子の飛跡を記録する「原子核乾板法」を改良し、1947年に高山で宇宙線を観測して、パイ中間子がミュー粒子に崩壊する様子をとらえました。それまで湯川の中間子と思われていたミュー粒子（1937年発見）は別物で、パイ中間子こそが湯川の予言した粒子だとわかりました。",
  1951: "1932年、電圧を何段にも積み上げる回路で約70万ボルトに加速した陽子をリチウムに当て、2個のヘリウム原子核に壊すことに成功しました。加速器による初めての人工的な原子核変換で、E=mc² を実験で確かめた例にもなりました。",

  1968: "大型の液体水素泡箱と、膨大な写真を半自動で測定してコンピューターで解析する方法を開発しました。寿命が10⁻²³秒ほどしかない短命な粒子（共鳴状態）を次々に発見し、粒子の数が爆発的に増える「粒子の動物園」状態を生み、ゲルマンの分類理論につながりました。",
  1969: "増え続けたハドロン（陽子や中間子の仲間）を、SU(3)という対称性で8個・10個のグループに整理する「八道説」を1961年に提唱しました（ネーマンも独立に）。この分類からΩ⁻粒子を予言し、1964年に発見されました。同じ年、ハドロンはより基本的な「クォーク」（u・d・s）からできているという模型も提唱しています（ツワイクも独立に）。",
  1976: "1974年11月、SLAC（リヒター）とブルックヘブン（ティン）の2つのグループが、約3.1 GeVの、質量のわりに非常に寿命の長い新粒子を同時に発見しました。両者の命名を合わせてJ/ψと呼ばれます。チャームクォークと反チャームクォークが結びついた状態で、クォーク模型が現実であることを決定づけ、「11月革命」と呼ばれます。",
  1979: "電磁気力と弱い力を、ひとつのゲージ理論（SU(2)×U(1)）で統一しました。ヒッグス機構によって、弱い力を伝えるW・Zボソンだけが重くなると説明します。中性カレント（1973年にCERNで発見）とW・Zボソンの存在を予言し、標準模型の柱になりました。",
  1980: "1964年、ブルックヘブンの実験で、寿命の長い中性K中間子が、CP対称性が保たれていれば起こらない「2つのパイ中間子への崩壊」をごくまれに起こすことを発見しました。粒子と反粒子のふるまいがわずかに違うことを示し、宇宙に物質だけが残った理由を考える重要な手がかりになりました。",
  1984: "ルビアは CERN の SPS 加速器を陽子・反陽子の衝突型に改造する計画を提案し、ファン・デル・メールは反陽子ビームをぎゅっと集める「確率冷却」を開発しました。1983年、UA1・UA2実験で、電弱理論の予言どおりの質量（約80 GeV・91 GeV）で W・Zボソンが見つかり、発見から1年あまりで受賞しました。",
  1988: "1962年、ブルックヘブンの加速器で作ったパイ中間子の崩壊からニュートリノのビームを作り、そのニュートリノが反応すると電子ではなくミュー粒子だけが出ることを示しました。ニュートリノに電子型とミュー型の2種類があることを証明し、レプトンが「世代」の構造をもつことを明らかにしました。",
  1990: "1967〜73年、SLACの線形加速器で高エネルギーの電子を陽子や中性子に当てたところ、大きな角度にはね返される電子が予想よりずっと多いことを発見しました。陽子の中に点のような粒子（パートン）があることを示し、クォークが計算上の道具ではなく実在する粒子であることを裏付けました。",
  1992: "1968年、細いワイヤーをたくさん張ったガス検出器を発明しました。粒子が通った位置を電気信号として高速に読み出せるので、写真に頼る泡箱から電子的な検出器への転換をもたらしました。1秒間に大量の事象を記録でき、W・Zボソンの発見を含む現代の実験の基礎となり、医療画像にも応用されています。",
  1995: "ライネスは共同研究者のコーワンと1956年、原子炉から出る反ニュートリノを検出し、パウリの提唱から26年目に存在を実証しました（コーワンは受賞前に死去）。パールは1975年、SLACで電子の約3500倍重いタウ粒子を発見し、第3世代のレプトンがあることを示しました。",
  1999: "W・Zボソンのような質量をもつゲージ粒子を含む理論でも「くりこみ」ができる（計算結果が有限になる）ことを1971年に証明しました。これで電弱理論が実際に計算できる理論になり、LEP実験の精密測定からトップクォークやヒッグス粒子の質量を前もって見積もることができるようになりました。",
  2002: "デイビスは1960年代から米国ホームステーク鉱山で約615トンの洗浄液を使って太陽ニュートリノを数え続け、予想の約3分の1しか来ないこと（太陽ニュートリノ問題）を示しました。小柴は岐阜県神岡のカミオカンデで1987年、超新星1987Aからのニュートリノ11個をとらえ、ニュートリノで宇宙を観る「ニュートリノ天文学」を切り開きました。",
  2004: "1973年、強い力を伝えるグルーオンの理論（量子色力学, QCD）では、クォークどうしが近づくほど力が弱くなる「漸近的自由性」を示しました。高エネルギーではクォークがほぼ自由にふるまうこと（深非弾性散乱の結果）と、離れると強く引き合いクォークを単独で取り出せないこと（閉じ込め）を説明し、QCDを強い力の理論として確立しました。",
  2008: "南部は1960年、超伝導の理論をヒントに、法則がもつ対称性が実際の真空では破れて見える「自発的対称性の破れ」を素粒子に持ちこみ、陽子などの質量の起源やパイ中間子が軽い理由を説明しました。小林・益川は1973年、当時3種類しか知られていなかったクォークが6種類（3世代）あればCP対称性の破れが自然に説明できることを示し、その後のボトム・トップクォークの発見や、2001年のBファクトリー実験（KEKのBelle、SLACのBaBar）で確かめられました。",
  2013: "1964年、対称性が自発的に破れるとゲージ粒子が質量を得るしくみ（ブラウト・アングレール・ヒッグス機構）を提唱しました。宇宙を満たすヒッグス場との相互作用で、W・Zボソンや電子・クォークが質量をもちます。予言されたヒッグス粒子は2012年、CERNのLHC（ATLAS・CMS実験）で約125 GeVに発見されました。共同提唱者のブラウトは2011年に亡くなっています。",
  2015: "梶田らのスーパーカミオカンデは1998年、大気中で生まれるミューニュートリノが、地球の裏側から来る（長い距離を飛んだ）ものほど減っていることを示し、別の種類に変わる「ニュートリノ振動」を発見しました。カナダのSNO（マクドナルド）は2001年、太陽の電子ニュートリノが他の種類に変わっていることを示し、太陽ニュートリノ問題を解決しました。振動はニュートリノに質量があることを意味し、標準模型を超える最初の確かな証拠です。",
  2026: "南極点の厚い氷の中に約1立方キロメートルにわたって5000個以上の光センサーを埋め込んだアイスキューブ観測所を構想し、実現しました。ニュートリノが氷の中で起こすチェレンコフ光をとらえ、2013年に太陽系の外から来る高エネルギーニュートリノを発見、2018年にはブレーザー「TXS 0506+056」を発生源の一つとして特定しました。ニュートリノ天文学を超高エネルギーの世界へ広げた業績です。"
};

const ERAS = [
  { from: 1900, to: 1945, label: "1920〜40年代 — 粒子の発見と量子論の始まり" },
  { from: 1946, to: 1969, label: "1940〜60年代 — 中間子・加速器・パリティの時代" },
  { from: 1970, to: 1999, label: "1970〜90年代 — 標準模型の完成" },
  { from: 2000, to: 2100, label: "2000年代〜 — ニュートリノとヒッグス" }
];
let allOpen = false;
const TYPE_LABEL ={ theory: "理論", exp: "実験・発見", tool: "装置・加速器" };

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render(filter) {
  const hit = PRIZES.filter(p => filter === "all" || (filter === "jp" ? p.jp : p.type === filter));
  let html = "";
  for (const era of ERAS) {
    const rows = hit.filter(p => p.y >= era.from && p.y <= era.to);
    if (!rows.length) continue;
    html += `<h2 class="era">${esc(era.label)}</h2><ol class="tl">`;
    for (const p of rows) {
      html += `<li class="item${p.jp ? " jp" : ""}"><div class="box">
        <div class="head"><span class="year">${p.y}</span><span class="who">${esc(p.who)}</span></div>
        <p class="what">${esc(p.what)}</p>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
        <div class="tags"><span class="tag t-${p.type}">${TYPE_LABEL[p.type]}</span>${p.jp ? '<span class="tag t-jp">日本人受賞</span>' : ""}</div>
        ${EX[p.y] ? `<details class="ex"${allOpen ? " open" : ""}><summary>解説を読む</summary><p>${esc(EX[p.y])}</p></details>` : ""}
      </div></li>`;
    }
    html += "</ol>";
  }
  document.getElementById("list").innerHTML = html || '<p class="empty">該当なし</p>';
}

function renderStats() {
  const jpPeople = ["湯川", "朝永", "小柴", "南部", "小林", "益川", "梶田"];
  const items = [
    [PRIZES.length, "掲載した受賞年"],
    [PRIZES.filter(p => p.type === "theory").length, "理論"],
    [PRIZES.filter(p => p.type !== "theory").length, "実験・装置"],
    [jpPeople.length, "日本人受賞者（人）"]
  ];
  document.getElementById("stats").innerHTML = items
    .map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
}

const KEY = "nobel-sokuryushi-filter";
let saved = "all";
try { saved = localStorage.getItem(KEY) || "all"; } catch (e) {}
const buttons = document.querySelectorAll(".filters button");
function select(f) {
  if (![...buttons].some(b => b.dataset.f === f)) f = "all";
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
  render(f);
  try { localStorage.setItem(KEY, f); } catch (e) {}
}
buttons.forEach(b => b.addEventListener("click", () => select(b.dataset.f)));
const toggleBtn = document.getElementById("toggleAll");
toggleBtn.addEventListener("click", () => {
  allOpen = !allOpen;
  document.querySelectorAll("details.ex").forEach(d => { d.open = allOpen; });
  toggleBtn.textContent = allOpen ? "📕 解説をすべて閉じる" : "📖 解説をすべて開く";
});
renderStats();
select(saved);
</script>
</body>
</html>
