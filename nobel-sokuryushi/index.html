<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>素粒子ノーベル賞年表</title>
<meta name="description" content="素粒子物理学に関わるノーベル物理学賞（1927〜2026年）を年表にまとめたページです。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f6f7fb; --card: #ffffff; --ink: #1c2433; --soft: #5a6577; --line: #dde2ec;
    --theory: #6a4fd1; --exp: #0f8a6c; --tool: #c9661a; --jp: #d63b3b; --dot: #1a6fb5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1b202a; --ink: #e8ecf3; --soft: #a3adbd; --line: #2d3442;
      --theory: #a38cff; --exp: #3fcfa6; --tool: #f0a35e; --jp: #ff7b7b; --dot: #6fb1ef;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --card: #1b202a; --ink: #e8ecf3; --soft: #a3adbd; --line: #2d3442;
    --theory: #a38cff; --exp: #3fcfa6; --tool: #f0a35e; --jp: #ff7b7b; --dot: #6fb1ef;
  }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    line-height: 1.6; padding: 24px 16px 48px; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: clamp(1.5rem, 4.5vw, 2.1rem); margin: 0 0 4px; }
  .lead { color: var(--soft); margin: 0 0 20px; font-size: .95rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .stat b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--soft); font-size: .82rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; position: sticky; top: 0; padding: 10px 0; background: var(--bg); z-index: 2; }
  .filters button {
    font: inherit; font-size: .9rem; min-height: 40px; padding: 6px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .filters button[aria-pressed="true"] { border-color: var(--dot); background: var(--dot); color: #fff; }
  .era { margin: 28px 0 8px; font-size: 1.05rem; color: var(--soft); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  ol.tl { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 3px solid var(--line); }
  .item { position: relative; margin: 0 0 14px; }
  .item::before {
    content: ""; position: absolute; left: -31px; top: 18px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--dot); border: 3px solid var(--bg);
  }
  .item.jp::before { background: var(--jp); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .year { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .who { font-weight: 600; }
  .what { margin: 6px 0 4px; }
  .note { color: var(--soft); font-size: .86rem; margin: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: .75rem; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; }
  .t-theory { color: var(--theory); } .t-exp { color: var(--exp); } .t-tool { color: var(--tool); } .t-jp { color: var(--jp); }
  footer { margin-top: 36px; color: var(--soft); font-size: .82rem; }
  footer a { color: var(--dot); }
  .empty { color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚛️ 素粒子ノーベル賞年表</h1>
  <p class="lead">素粒子物理学（粒子の発見・理論・検出装置・加速器）に関わるノーベル物理学賞を、1927年から2026年まで年代順にまとめました。</p>

  <div class="stats" id="stats"></div>

  <div class="filters" role="group" aria-label="しぼりこみ">
    <button type="button" data-f="all" aria-pressed="true">すべて</button>
    <button type="button" data-f="theory" aria-pressed="false">理論</button>
    <button type="button" data-f="exp" aria-pressed="false">実験・発見</button>
    <button type="button" data-f="tool" aria-pressed="false">装置・加速器</button>
    <button type="button" data-f="jp" aria-pressed="false">🇯🇵 日本人受賞</button>
  </div>

  <div id="list"></div>

  <footer>
    ※ 物理学賞のうち素粒子・高エネルギー物理に関係する受賞のみを掲載しています（同じ年の別分野の共同受賞者は備考に記載）。<br>
    出典: <a href="https://www.nobelprize.org/prizes/lists/all-nobel-prizes-in-physics/">The Nobel Prize — All Nobel Prizes in Physics</a>（2026年10月時点）
  </footer>
</div>

<script>
// type: theory=理論 / exp=実験・発見 / tool=装置・加速器、jp=日本人受賞者を含む
const PRIZES = [
  { y: 1927, who: "C. T. R. ウィルソン", what: "霧箱の発明 — 荷電粒子の飛跡を目で見られるようにした", type: "tool", note: "同年、A. H. コンプトンが「コンプトン効果」で共同受賞" },
  { y: 1933, who: "P. A. M. ディラック、E. シュレーディンガー", what: "原子理論の新しい形式の発見 — ディラック方程式は反粒子（陽電子）の存在を予言", type: "theory" },
  { y: 1935, who: "J. チャドウィック", what: "中性子の発見", type: "exp" },
  { y: 1936, who: "C. D. アンダーソン", what: "陽電子の発見 — 初めて見つかった反粒子", type: "exp", note: "同年、V. F. ヘスが「宇宙線の発見」で共同受賞" },
  { y: 1939, who: "E. O. ローレンス", what: "サイクロトロンの発明 — 円形加速器の始まり", type: "tool" },
  { y: 1945, who: "W. パウリ", what: "排他原理（パウリの原理）の発見 — フェルミ粒子の基本性質", type: "theory", note: "パウリは1930年にニュートリノの存在も提唱" },
  { y: 1948, who: "P. M. S. ブラケット", what: "ウィルソン霧箱の改良と、それによる原子核物理・宇宙線の発見", type: "tool" },
  { y: 1949, who: "湯川 秀樹", what: "核力の理論にもとづく中間子の存在の予言", type: "theory", jp: true, note: "日本人初のノーベル賞" },
  { y: 1950, who: "C. F. パウエル", what: "原子核乾板（写真乳剤）法の開発と、それによるパイ中間子の発見", type: "exp", note: "湯川の予言した中間子を実験で確認" },
  { y: 1951, who: "J. コッククロフト、E. ウォルトン", what: "人工的に加速した粒子による原子核変換の研究", type: "tool" },
  { y: 1955, who: "W. ラム、P. クッシュ", what: "水素原子スペクトルの微細構造（ラムシフト）と電子の磁気モーメントの精密測定", type: "exp", note: "量子電磁力学（QED）を生むきっかけとなった実験" },
  { y: 1957, who: "楊 振寧（C. N. ヤン）、李 政道（T. D. リー）", what: "パリティ（空間反転対称性）の破れの理論的研究 — 弱い相互作用で左右対称性が破れる", type: "theory" },
  { y: 1958, who: "P. チェレンコフ、I. フランク、I. タム", what: "チェレンコフ効果の発見と解釈 — 現在のニュートリノ検出器の基本原理", type: "exp" },
  { y: 1959, who: "E. セグレ、O. チェンバレン", what: "反陽子の発見", type: "exp" },
  { y: 1960, who: "D. A. グレーザー", what: "泡箱の発明", type: "tool" },
  { y: 1961, who: "R. ホフスタッター", what: "電子散乱による原子核・核子（陽子・中性子）の構造の研究", type: "exp", note: "同年、R. メスバウアーがメスバウアー効果で共同受賞" },
  { y: 1965, who: "朝永 振一郎、J. シュウィンガー、R. P. ファインマン", what: "量子電磁力学（QED）の基礎研究と素粒子物理学への貢献 — くりこみ理論", type: "theory", jp: true },
  { y: 1968, who: "L. W. アルバレ", what: "液体水素泡箱の開発と、多数の共鳴状態（短寿命粒子）の発見", type: "exp" },
  { y: 1969, who: "M. ゲルマン", what: "素粒子の分類と相互作用の研究 — 八道説、のちのクォーク模型", type: "theory" },
  { y: 1976, who: "B. リヒター、S. C. C. ティン（丁肇中）", what: "新しい重い素粒子 J/ψ の発見 — チャームクォークの存在を確定（「11月革命」）", type: "exp" },
  { y: 1979, who: "S. グラショー、A. サラム、S. ワインバーグ", what: "電磁相互作用と弱い相互作用の統一理論（電弱理論）", type: "theory" },
  { y: 1980, who: "J. クローニン、V. フィッチ", what: "中性K中間子の崩壊における CP 対称性の破れの発見", type: "exp" },
  { y: 1984, who: "C. ルビア、S. ファン・デル・メール", what: "弱い力を伝える W・Z ボソンの発見につながった大型計画への貢献（確率冷却など）", type: "exp" },
  { y: 1988, who: "L. レーダーマン、M. シュワルツ、J. シュタインバーガー", what: "ニュートリノビーム法と、ミューニュートリノの発見によるレプトンの二重構造の実証", type: "exp" },
  { y: 1990, who: "J. フリードマン、H. ケンドール、R. テイラー", what: "電子の深非弾性散乱の研究 — 陽子の中のクォークを実験的に確認", type: "exp" },
  { y: 1992, who: "G. シャルパック", what: "多線式比例計数管（MWPC）の発明 — 粒子検出器の電子化", type: "tool" },
  { y: 1995, who: "M. L. パール、F. ライネス", what: "タウ粒子の発見（パール）、ニュートリノの初検出（ライネス）", type: "exp" },
  { y: 1999, who: "G. トフーフト、M. フェルトマン", what: "電弱相互作用の量子構造の解明 — ゲージ理論のくりこみ可能性", type: "theory" },
  { y: 2002, who: "R. デイビス Jr.、小柴 昌俊", what: "宇宙ニュートリノの検出 — 太陽ニュートリノ、超新星1987Aのニュートリノ（カミオカンデ）", type: "exp", jp: true, note: "同年、R. ジャコーニが X 線天文学で共同受賞" },
  { y: 2004, who: "D. グロス、D. ポリツァー、F. ウィルチェック", what: "強い相互作用の理論における漸近的自由性の発見 — 量子色力学（QCD）", type: "theory" },
  { y: 2008, who: "南部 陽一郎、小林 誠、益川 敏英", what: "素粒子物理における自発的対称性の破れの発見（南部）／クォークが3世代以上あることを予言した CP 対称性の破れの起源の発見（小林・益川）", type: "theory", jp: true },
  { y: 2013, who: "F. アングレール、P. ヒッグス", what: "素粒子の質量の起源を説明するヒッグス機構の理論 — 2012年に LHC でヒッグス粒子を発見", type: "theory" },
  { y: 2015, who: "梶田 隆章、A. B. マクドナルド", what: "ニュートリノ振動の発見 — ニュートリノに質量があることを示した（スーパーカミオカンデ、SNO）", type: "exp", jp: true },
  { y: 2026, who: "F. ハルツェン", what: "アイスキューブ・ニュートリノ観測所の実現と、天体起源の高エネルギーニュートリノの発見", type: "exp", note: "単独受賞" }
];

const ERAS = [
  { from: 1900, to: 1945, label: "1920〜40年代 — 粒子の発見と量子論の始まり" },
  { from: 1946, to: 1969, label: "1940〜60年代 — 中間子・加速器・パリティの時代" },
  { from: 1970, to: 1999, label: "1970〜90年代 — 標準模型の完成" },
  { from: 2000, to: 2100, label: "2000年代〜 — ニュートリノとヒッグス" }
];
const TYPE_LABEL = { theory: "理論", exp: "実験・発見", tool: "装置・加速器" };

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render(filter) {
  const hit = PRIZES.filter(p => filter === "all" || (filter === "jp" ? p.jp : p.type === filter));
  let html = "";
  for (const era of ERAS) {
    const rows = hit.filter(p => p.y >= era.from && p.y <= era.to);
    if (!rows.length) continue;
    html += `<h2 class="era">${esc(era.label)}</h2><ol class="tl">`;
    for (const p of rows) {
      html += `<li class="item${p.jp ? " jp" : ""}"><div class="box">
        <div class="head"><span class="year">${p.y}</span><span class="who">${esc(p.who)}</span></div>
        <p class="what">${esc(p.what)}</p>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
        <div class="tags"><span class="tag t-${p.type}">${TYPE_LABEL[p.type]}</span>${p.jp ? '<span class="tag t-jp">日本人受賞</span>' : ""}</div>
      </div></li>`;
    }
    html += "</ol>";
  }
  document.getElementById("list").innerHTML = html || '<p class="empty">該当なし</p>';
}

function renderStats() {
  const jpPeople = ["湯川", "朝永", "小柴", "南部", "小林", "益川", "梶田"];
  const items = [
    [PRIZES.length, "掲載した受賞年"],
    [PRIZES.filter(p => p.type === "theory").length, "理論"],
    [PRIZES.filter(p => p.type !== "theory").length, "実験・装置"],
    [jpPeople.length, "日本人受賞者（人）"]
  ];
  document.getElementById("stats").innerHTML = items
    .map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
}

const KEY = "nobel-sokuryushi-filter";
let saved = "all";
try { saved = localStorage.getItem(KEY) || "all"; } catch (e) {}
const buttons = document.querySelectorAll(".filters button");
function select(f) {
  if (![...buttons].some(b => b.dataset.f === f)) f = "all";
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
  render(f);
  try { localStorage.setItem(KEY, f); } catch (e) {}
}
buttons.forEach(b => b.addEventListener("click", () => select(b.dataset.f)));
renderStats();
select(saved);
</script>
</body>
</html>
