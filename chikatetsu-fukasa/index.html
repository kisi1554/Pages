<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ちかてつ ふかさ くらべ</title>
<meta name="description" content="もぐらの ほりほりくんと じめんを ほって、ちかてつの ホームが どれくらい ふかいか ビルの かいすうで くらべる ゲーム。">
<meta name="theme-color" content="#8a5a2b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<style>
*,*::before,*::after{ box-sizing:border-box; }
:root{
  --ink:#2e2216; --soft:#7b6450; --bg1:#fff4dc; --bg2:#e8f4ff;
  --card:#fff; --line:#ecd3ad; --accent:#b8692a; --accent-dk:#8a4a17;
  --ok:#2f9e44; --ng:#e8590c; --shadow:rgba(120,70,20,.22);
}
html,body{ margin:0; padding:0; height:100%; }
body{
  color:var(--ink);
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%); background-attachment:fixed;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic","游ゴシック体","Meiryo",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  -webkit-user-select:none; user-select:none;
}
rt{ font-size:.5em; font-weight:400; color:var(--soft); letter-spacing:0; }
button{ font:inherit; color:inherit; }
.app{ max-width:1100px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
  padding:4px 12px calc(10px + env(safe-area-inset-bottom)); }

.bar{ display:flex; align-items:center; gap:8px; min-height:58px; }
.bar .sp{ flex:1; }
.bar .ttl{ font-weight:800; font-size:clamp(15px,4vw,19px); color:var(--accent-dk); }
.iconBtn{
  min-width:52px; min-height:52px; padding:6px 12px; border:3px solid var(--line); border-radius:16px;
  background:var(--card); font-size:clamp(15px,4vw,18px); font-weight:700; cursor:pointer;
  box-shadow:0 4px 0 var(--shadow); text-decoration:none; color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center;
}
.iconBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
.dots{ display:flex; gap:5px; }
.dots i{ width:14px; height:14px; border-radius:50%; background:#e3d2b8; display:block; }
.dots i.done{ background:var(--ok); }
.dots i.now{ background:var(--accent); box-shadow:0 0 0 3px #f5d7b5; }

.screen{ display:none; flex:1; }
.screen.on{ display:flex; flex-direction:column; animation:fadeIn .25s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.big{
  display:block; width:100%; min-height:70px; margin:10px 0 0; padding:12px 18px;
  border:none; border-radius:22px; background:var(--accent); color:#fff;
  font-size:clamp(20px,5.6vw,26px); font-weight:800; letter-spacing:.06em; cursor:pointer;
  box-shadow:0 6px 0 var(--accent-dk);
}
.big:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--accent-dk); }
.big.sub{ background:#fff; color:var(--accent-dk); border:3px solid var(--line); box-shadow:0 6px 0 var(--shadow); }
.big[hidden]{ display:none; }

/* ---------- タイトル ---------- */
.hero{ text-align:center; padding:4px 0 8px; max-width:620px; margin:0 auto; width:100%; }
.hero h1{ margin:4px 0 0; font-size:clamp(30px,8.6vw,48px); line-height:1.25; letter-spacing:.04em; }
.hero h1 small{ display:block; font-size:.4em; color:var(--soft); letter-spacing:.1em; }
.hero p{ margin:10px 0 0; font-size:clamp(16px,4.3vw,19px); line-height:1.85; }
.hero .note{ color:var(--soft); font-size:clamp(13px,3.5vw,15px); }
.heroArt{ width:min(78vw,340px); height:auto; display:block; margin:8px auto 0; }
.stat{ text-align:center; margin-top:12px; color:var(--soft); font-size:clamp(14px,3.8vw,16px); }

/* ---------- ゲーム ---------- */
.game{ flex:1; display:flex; flex-direction:column; gap:10px; min-height:0; }
.stageWrap{ position:relative; flex:1; min-height:300px; border-radius:22px; overflow:hidden;
  border:3px solid var(--line); background:#a9d8ff; box-shadow:0 6px 0 var(--shadow); }
#cv{ position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
.say{
  position:absolute; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none;
  background:#fff; border:3px solid var(--ink); border-radius:18px; padding:6px 12px;
  font-weight:800; font-size:clamp(15px,4.2vw,19px); white-space:nowrap; opacity:0; transition:opacity .2s;
}
.say::after{ content:""; position:absolute; left:50%; bottom:-11px; margin-left:-8px;
  border:8px solid transparent; border-top-color:var(--ink); border-bottom:0; }
.say.on{ opacity:1; }
.swipeHint{
  position:absolute; right:12px; top:12px; pointer-events:none; background:rgba(255,255,255,.88);
  border-radius:14px; padding:6px 10px; font-weight:800; font-size:clamp(13px,3.6vw,16px); color:var(--accent-dk);
  animation:hintBob 1.2s ease-in-out infinite;
}
.swipeHint[hidden]{ display:none; }
@keyframes hintBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }

.panel{
  background:var(--card); border:3px solid var(--line); border-radius:22px; padding:12px 14px 14px;
  box-shadow:0 6px 0 var(--shadow); min-height:150px;
}
.msg{ font-size:clamp(17px,4.6vw,21px); font-weight:800; line-height:1.7; text-align:center; }
.msg .s{ display:block; font-size:.8em; font-weight:700; color:var(--soft); }
.stName{ text-align:center; font-size:clamp(24px,6.8vw,32px); font-weight:900; line-height:1.5; margin:2px 0; }
.stName .ln{ display:inline-block; font-size:.55em; padding:2px 10px; border-radius:999px; color:#fff; vertical-align:middle; margin-left:6px; }
.choices{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
.choice{
  min-height:84px; border:3px solid var(--line); border-radius:18px; background:#fffaf2; cursor:pointer;
  font-size:clamp(18px,5vw,24px); font-weight:900; line-height:1.25; box-shadow:0 5px 0 var(--shadow); padding:6px 4px;
}
.choice .e{ display:block; font-size:1.2em; }
.choice:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--shadow); }
.choice.out{ opacity:.35; pointer-events:none; }
.choice.good{ background:#d3f9d8; border-color:var(--ok); }
.facts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.fact{ background:#fff7ea; border-radius:14px; padding:8px 10px; text-align:center; font-weight:800; font-size:clamp(16px,4.4vw,20px); line-height:1.5; }
.fact b{ font-size:1.35em; color:var(--accent-dk); }
.fact .e{ font-size:1.3em; }
.meter{ text-align:center; color:var(--soft); font-size:13px; margin-top:6px; }
.why{ margin-top:10px; background:#eef6ff; border:2px dashed #8cb8e6; border-radius:16px; padding:8px 12px;
  font-size:clamp(15px,4.1vw,18px); line-height:1.8; font-weight:700; }
.why b{ color:#1c64b0; }

.wrongShake{ animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:none;} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

/* ---------- けっか ---------- */
.result{ max-width:760px; margin:0 auto; width:100%; text-align:center; }
.result h2{ font-size:clamp(26px,7vw,38px); margin:6px 0 0; }
.stars{ font-size:clamp(40px,12vw,64px); letter-spacing:.1em; }
.chartBox{ background:#fff; border:3px solid var(--line); border-radius:22px; padding:10px; margin-top:10px; box-shadow:0 6px 0 var(--shadow); }
.chartBox svg{ width:100%; height:auto; display:block; }
.chartBox .cap{ font-weight:800; font-size:clamp(16px,4.4vw,20px); line-height:1.7; }
.fine{ margin-top:12px; color:var(--soft); font-size:12px; line-height:1.7; text-align:left; }
.btnRow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btnRow .big{ font-size:clamp(17px,4.6vw,24px); letter-spacing:.02em; }
.confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:10; }
.confetti i{ position:absolute; top:-20px; width:10px; height:16px; border-radius:3px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); } }

/* よこもち（タブレット） */
@media (orientation:landscape) and (min-width:700px){
  .game{ flex-direction:row; }
  .stageWrap{ flex:1.35; min-height:0; }
  .panel{ flex:1; display:flex; flex-direction:column; justify-content:center; overflow:auto; }
  .app{ height:100vh; height:100dvh; }
  #gameScreen.on{ min-height:0; }
}
@media (orientation:portrait){
  #gameScreen.on{ height:calc(100vh - 76px); height:calc(100dvh - 76px); min-height:520px; }
  .stageWrap{ flex:1 1 auto; min-height:210px; }
  .panel{ flex:0 1 auto; overflow:auto; max-height:62%; min-height:0; }
}
@media (max-width:620px){ .bar .ttl{ display:none; } }
</style>

<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>

      <div style="max-width:480px;margin:0 auto;">

<script>
'use strict';
/* =====================================================================
   データ（まちがいは いちばん 大事な バグ。出典は README.md）
   depth: 地表から の ふかさ（m）。
     東京メトロ … 駅の中心で 地表 → レール面
     都営地下鉄 … 駅の中心で 地表 → ホーム面
   year: その ホームが できた とし
   ===================================================================== */
const FLOOR_M = 3;    // ビル（マンション）1かい ぶん ≒ 3m
const GIRAFFE_M = 5;  // おとなの キリン ≒ 5m
const STATIONS = [
  { id:'omotesando-g', name:'<ruby>表参道<rt>おもてさんどう</rt></ruby>', kana:'おもてさんどう',
    line:'<ruby>銀座線<rt>ぎんざせん</rt></ruby>', lineKana:'ぎんざせん', color:'#e8913a',
    depth:8.4, year:1938, floor:'ちか 1かい',
    why:'<b>ぎんざせん</b>は とうきょうで いちばん はじめに できた ちかてつの なかま。じめんを うえから ほって つくったので <b>あさい</b>んだ。' },
  { id:'omotesando-c', name:'<ruby>表参道<rt>おもてさんどう</rt></ruby>', kana:'おもてさんどう',
    line:'<ruby>千代田線<rt>ちよだせん</rt></ruby>', lineKana:'ちよだせん', color:'#2f9e6a',
    depth:18.8, year:1972, floor:'ちか 3かい',
    why:'おなじ えきなのに、<b>あとから できた</b> ちよだせんは ぎんざせんより ずっと ふかい！' },
  { id:'nagatacho-y', name:'<ruby>永田町<rt>ながたちょう</rt></ruby>', kana:'ながたちょう',
    line:'<ruby>有楽町線<rt>ゆうらくちょうせん</rt></ruby>', lineKana:'ゆうらくちょうせん', color:'#c9a227',
    depth:23.7, year:1974, floor:'ちか 4かい',
    why:'じめんの したには <b>すいどうかん・でんきの せん・さきに できた ちかてつ</b>が いっぱい。よけて とおるので ふかく なるよ。' },
  { id:'nagatacho-h', name:'<ruby>永田町<rt>ながたちょう</rt></ruby>', kana:'ながたちょう',
    line:'<ruby>半蔵門線<rt>はんぞうもんせん</rt></ruby>', lineKana:'はんぞうもんせん', color:'#8f5bd6',
    depth:36.0, year:1979, floor:'ちか 6かい',
    why:'ながたちょうは 3つの せんが あつまる えき。この ホームは その なかで <b>いちばん ふかい</b>よ。' },
  { id:'korakuen-n', name:'<ruby>後楽園<rt>こうらくえん</rt></ruby>', kana:'こうらくえん',
    line:'<ruby>南北線<rt>なんぼくせん</rt></ruby>', lineKana:'なんぼくせん', color:'#14a3a3',
    depth:37.5, year:1996, floor:'ちか 6かい',
    why:'うえには <b>おおきな ドームや ビル</b>。その たてものを ささえる「くい」を よける ために ふかく つくったんだ。' },
  { id:'roppongi-o', name:'<ruby>六本木<rt>ろっぽんぎ</rt></ruby>', kana:'ろっぽんぎ',
    line:'<ruby>大江戸線<rt>おおえどせん</rt></ruby>', lineKana:'おおえどせん', color:'#d6336c',
    depth:42.3, year:2000, floor:'ちか 7かい',
    why:'ここが <b>にっぽんで いちばん ふかい</b> ちかてつの ホーム！ あとから できた せんは、ほかの ちかてつの したを くぐるんだ。' },
];
// とちゅうの できごと（わらい どころ）
const EVENTS = [
  { depth:1.5, kind:'water', say:'ごつん！ すいどうかん だ', after:'おじゃましました〜' },
  { depth:3.2, kind:'elec',  say:'びりっ？ でんきの せん だ', after:'そーっと… おじゃましました〜' },
  { depth:29,  kind:'hungry', say:'おなか ぺこぺこ…', after:'おにぎりで げんき もりもり！' },
];
const SIDES = ['R','L','R','L','R','L'];   // ホームを だんめんずの みぎ/ひだり どちらに かくか

/* ---------- ほぞん ---------- */
const KEY = 'chikatetsu-fukasa:v1';
let save = { plays:0, best:0, sound:true };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
function store(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- おと（WebAudio の 合成音のみ） ---------- */
let AC = null;
function ac(){
  if (!save.sound) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f, t0, dur, type, vol, f2){
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; const st = a.currentTime + (t0||0);
  o.frequency.setValueAtTime(f, st); if (f2) o.frequency.exponentialRampToValueAtTime(f2, st + dur);
  g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol||0.2, st + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
  o.connect(g).connect(a.destination); o.start(st); o.stop(st + dur + 0.05);
}
function noise(dur, vol, freq){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = a.createBufferSource(); s.buffer = b;

/* ---------- エスカレーター ---------- */
function escPath(){
  const D = STATIONS[STATIONS.length-1].depth;
  // ホーム → みぎへ あるく → ジグザグに 3かい のりつぐ → ちじょう
  const pts = [[0,D],[17,D],[27,D-14.1],[18,D-14.1],[27,D-28.2],[18,D-28.2],[27,0],[30,0]];
  return pts;
}
function startEscalator(){
  G.mode = 'esc'; G.esc = { t:performance.now(), slept:false, woke:false };
  panel.innerHTML = `<div class="msg">🛗 ながーい エスカレーターで ちじょうへ！<span class="s">なんかいも のりついで のぼるよ</span></div>`;

function escUpdate(now){
  const E = G.esc, T = 11000, p = Math.min(1, (now - E.t) / T);
  const pts = escPath();
  let L = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); seg.push(l); L += l; }
  let d = p * L, k = 0;
  while (k < seg.length - 1 && d > seg[k]) { d -= seg[k]; k++; }
  const a = pts[k], b = pts[k+1], f = Math.min(1, d / seg[k]);
  G.moleX = a[0] + (b[0]-a[0]) * f; G.mole = a[1] + (b[1]-a[1]) * f;
  if (p > 0.33 && !E.slept) { E.slept = true; G.moleState = 'sleep'; say('ながい… すやぁ… Zzz', 2600); SFX.snore();
    panel.innerHTML = `<div class="msg">😴 ながすぎて ほりほりくん… ねちゃった！</div>`; }
  if (p > 0.55 && E.slept && !E.snore2) { E.snore2 = true; SFX.snore(); }
  if (p > 0.84 && !E.woke) { E.woke = true; G.moleState = 'surprise'; say('はっ！ もう つく？', 1600);
    panel.innerHTML = `<div class="msg">😳 はっ！ おきた！ もうすぐ ちじょうだよ</div>`; }
  if (p >= 1 && G.mode === 'esc') { G.mode = 'done'; G.moleState = 'happy'; say('ただいま〜！', 1600); SFX.fanfare(); setTimeout(finish, 1700); }
}

  cx.fillStyle = '#3d2a1a'; cx.fillRect(sx(-1.3), sy(0), 2.6*s, holeBot*s + 0.8*s);
  cx.strokeStyle = 'rgba(255,220,160,.35)'; cx.lineWidth = Math.max(1, 0.12*s);
  for (let y = 0.8; y < holeBot; y += 1.2) { cx.beginPath(); cx.moveTo(sx(-0.8), sy(y)); cx.lineTo(sx(0.8), sy(y)); cx.stroke(); }

  // すいどうかん・でんきの せん
  cx.fillStyle = '#4c8fd6'; cx.fillRect(0, sy(EVENTS[0].depth - 0.75), W, 0.55*s);
  cx.fillStyle = 'rgba(255,255,255,.4)'; cx.fillRect(0, sy(EVENTS[0].depth - 0.7), W, 0.12*s);
  if (s > 9) txt('すいどうかん', sx(8), sy(EVENTS[0].depth - 0.48), Math.min(14, s*0.5), '#fff');
  cx.fillStyle = '#f2c230'; cx.fillRect(0, sy(EVENTS[1].depth - 0.7), W, 0.35*s);
  cx.fillStyle = '#e09a12'; cx.fillRect(0, sy(EVENTS[1].depth - 0.42), W, 0.12*s);
  if (s > 9) txt('⚡ でんきの せん', sx(-9), sy(EVENTS[1].depth - 1.2), Math.min(14, s*0.5), '#fff6c2');

  // ホーム
  STATIONS.forEach((st, i) => drawStation(st, i, now));

  // ビルを さかさに した ものさし（こたえあわせ）
  if (G.reveal && (G.mode === 'reveal' || G.mode === 'info')) drawRuler(now);

  // エスカレーター
  if (G.mode === 'esc' || G.mode === 'done' || G.mode === 'info' && G.reveal && G.reveal.i === STATIONS.length-1) drawEscalator();

  // つちの つぶ
  G.parts = G.parts.filter(p => (p.life -= 1/60) > 0);
  G.parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.02; cx.fillStyle = `rgba(120,80,40,${p.life})`; cx.beginPath(); cx.arc(sx(p.x), sy(p.y), Math.max(2, 0.22*s), 0, 7); cx.fill(); });

  drawMole(sx(G.moleX), sy(G.mole), s, now);
}

function drawPerson(X, Y, s){
  const h = 1.7*s;
  cx.fillStyle = '#ff8787'; rr(X - 0.3*s, Y - h*0.72, 0.6*s, h*0.45, 0.2*s); cx.fill();
  cx.fillStyle = '#495057'; cx.fillRect(X - 0.25*s, Y - h*0.3, 0.2*s, h*0.3); cx.fillRect(X + 0.05*s, Y - h*0.3, 0.2*s, h*0.3);
  cx.fillStyle = '#ffd8a8'; cx.beginPath(); cx.arc(X, Y - h*0.84, 0.22*s, 0, 7); cx.fill();
}
function drawGiraffe(X, Y, s){
  cx.fillStyle = '#f4b942';
  cx.fillRect(X - 0.9*s, Y - 3.0*s, 2.2*s, 1.0*s);            // からだ
  [-0.8, -0.3, 0.6, 1.1].forEach(dx => cx.fillRect(X + dx*s, Y - 2.1*s, 0.2*s, 2.1*s)); // あし
  cx.save(); cx.translate(X + 1.0*s, Y - 2.9*s); cx.rotate(0.18); cx.fillRect(-0.2*s, -1.8*s, 0.45*s, 1.9*s); cx.restore(); // くび
  cx.beginPath(); cx.ellipse(X + 1.55*s, Y - 4.75*s, 0.6*s, 0.32*s, 0.2, 0, 7); cx.fill(); // あたま
  cx.fillStyle = '#b5651d';
  [[-0.5,-2.7],[0.2,-2.5],[0.8,-2.8],[1.1,-3.8]].forEach(([dx,dy]) => { cx.beginPath(); cx.arc(X+dx*s, Y+dy*s, 0.16*s, 0, 7); cx.fill(); });
  cx.fillStyle = '#222'; cx.beginPath(); cx.arc(X + 1.7*s, Y - 4.82*s, 0.07*s + 0.5, 0, 7); cx.fill();
  cx.fillStyle = '#b5651d'; cx.fillRect(X + 1.2*s, Y - 5.05*s, 0.1*s, 0.3*s);
  if (s > 7) txt('キリン', X + 0.2*s, Y - 5.6*s, Math.min(15, s*0.7), '#7a4a00');
}

function drawStation(st, i, now){
  const s = G.cam.s, side = SIDES[i], d = st.depth;
  const x0 = side === 'R' ? 1.3 : -16, x1 = side === 'R' ? 16 : -1.3;
  const vis = G.revealed[i];
  const near = !vis && i === G.next && G.mole > d - 7 && (G.mode === 'dig' || G.mode === 'event');
  if (!vis && !near) return;
  if (near) {   // なにか ある…
    cx.fillStyle = 'rgba(255,255,255,.18)'; rr(sx(x0), sy(d - 4.5), (x1-x0)*s, 5*s, 0.8*s); cx.fill();
    txt('？', sx((x0+x1)/2), sy(d - 2), Math.max(16, s*2), 'rgba(255,255,255,.75)');
    return;
  }
  // トンネル
  cx.fillStyle = '#3a3a44'; rr(sx(x0), sy(d - 4.7), (x1-x0)*s, 5.4*s, 1.2*s); cx.fill();
  cx.fillStyle = '#fff6dc'; rr(sx(x0 + 0.3), sy(d - 4.4), (x1-x0-0.6)*s, 4.4*s, 1*s); cx.fill();
  // ホームの ゆか
  cx.fillStyle = '#c8c2b3'; cx.fillRect(sx(x0 + 0.3), sy(d - 0.1), (x1-x0-0.6)*s, 0.6*s);
  cx.fillStyle = '#f5d33a'; cx.fillRect(sx(x0 + 0.3), sy(d - 0.1), (x1-x0-0.6)*s, 0.12*s);
  // でんしゃ（オリジナルの え）
  const tx0 = side === 'R' ? 7.2 : -15.2, tx1 = side === 'R' ? 15.2 : -7.2;
  const bob = Math.sin(now/300 + i) * 0.03 * s;
  cx.fillStyle = '#f1f3f5'; rr(sx(tx0), sy(d - 3.2) + bob, (tx1-tx0)*s, 2.9*s, 0.6*s); cx.fill();
  cx.fillStyle = st.color; cx.fillRect(sx(tx0), sy(d - 1.4) + bob, (tx1-tx0)*s, 0.45*s);
  cx.fillStyle = '#8ecaf0';
  for (let k = 0; k < 3; k++) { rr(sx(tx0 + 0.8 + k*2.9), sy(d - 2.8) + bob, 1.9*s, 1.1*s, 0.25*s); cx.fill(); }
  // えきめいの かんばん（ひらがな）
  const signX = side === 'R' ? 4.3 : -4.3;
  cx.fillStyle = '#fff'; rr(sx(signX - 2.6), sy(d - 4.1), 5.2*s, 1.35*s, 0.3*s); cx.fill();
  cx.strokeStyle = st.color; cx.lineWidth = Math.max(1.5, 0.15*s); cx.stroke();
  if (s >= 8) {
    txt(st.kana, sx(signX), sy(d - 3.43), Math.min(18, s*0.62), '#2e2216');
    txt(st.lineKana, sx(signX), sy(d - 1.9), Math.min(14, s*0.45), st.color);
  }
  // こたえた ホームには ビルの かいすう
  if (G.answered[i] && !(G.reveal && G.reveal.i === i && G.mode === 'reveal')) {
    const lx = side === 'R' ? x1 + 0.6 : x0 - 0.6;
    txt(`🏢${floorsOf(d)}かい`, sx(lx), sy(d - 2.2), Math.max(11, Math.min(18, s*0.9)), '#fff', side === 'R' ? 'left' : 'right');
  }
}

function drawRuler(now){
  const R = G.reveal, st = STATIONS[R.i], s = G.cam.s;
  const n = R.n, per = 420;
  const shown = Math.min(n, Math.floor((now - R.t) / per) + 1);
  if (shown > R.ticked && G.mode === 'reveal') { R.ticked = shown; SFX.tick(shown); }
  const side = SIDES[R.i] === 'R' ? -1 : 1;     // ホームの はんたいがわ
  const xa = side > 0 ? 1.6 : -6.6, w = 5;
  for (let f = 0; f < shown; f++) {
    const y = f * FLOOR_M;
    cx.fillStyle = 'rgba(143,163,191,.92)'; cx.fillRect(sx(xa), sy(y), w*s, FLOOR_M*s - 1);
    cx.fillStyle = '#dff1ff'; cx.fillRect(sx(xa + 0.8), sy(y + 0.8), 1.2*s, 1.4*s); cx.fillRect(sx(xa + 3), sy(y + 0.8), 1.2*s, 1.4*s);
    txt(String(f+1), sx(xa + w/2), sy(y + FLOOR_M/2), Math.max(12, Math.min(22, s*FLOOR_M*0.6)), '#1f2d44');
  }
  if (shown >= n) {
    cx.setLineDash([6, 5]); cx.strokeStyle = '#fff'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(sx(-16), sy(st.depth)); cx.lineTo(sx(16), sy(st.depth)); cx.stroke(); cx.setLineDash([]);
    if (G.mode === 'reveal' && now - R.t > n*per + 700) {
      showInfo(R.i);
      say(R.i === STATIONS.length-1 ? 'にっぽんいち ふかい！' : ['ふかーい！','やったね！','すごい ふかさ！','ひゃ〜 ふかい！','まだまだ ほるぞ！'][R.i % 5], 1800);
    }
  }
}

function drawEscalator(){
  const pts = escPath(), s = G.cam.s;
  cx.strokeStyle = '#555'; cx.lineWidth = Math.max(4, 0.9*s); cx.lineCap = 'round';
  cx.fillStyle = '#4b3a2a';
  // とおりみち
  for (let i = 1; i < pts.length; i++) {
    const [a,b] = [pts[i-1], pts[i]];
    cx.strokeStyle = a[1] !== b[1] ? '#9aa0a6' : '#e9dcc4';
    cx.lineWidth = Math.max(5, (a[1] !== b[1] ? 1.0 : 1.4)*s);
    cx.beginPath(); cx.moveTo(sx(a[0]), sy(a[1])); cx.lineTo(sx(b[0]), sy(b[1])); cx.stroke();
    if (a[1] !== b[1]) {   // ステップ
      cx.strokeStyle = '#5f666d'; cx.lineWidth = Math.max(1, 0.12*s);
      for (let k = 0.05; k < 1; k += 0.07) { const X = sx(a[0] + (b[0]-a[0])*k), Y = sy(a[1] + (b[1]-a[1])*k); cx.beginPath(); cx.moveTo(X - 0.4*s, Y); cx.lineTo(X + 0.4*s, Y); cx.stroke(); }
    }
  }
  cx.lineCap = 'butt';
}

function drawMole(X, Y, s, now){
  const st = G.moleState, size = Math.max(26, Math.min(64, s*2.4));
  const k = size / 40;
  const moving = G.mode === 'dig' && G.target - G.mole > 0.02;
  cx.save(); cx.translate(X, Y - size*0.45);
  let rot = 0, dy = 0;
  if (moving) rot = Math.sin(now/60) * 0.12;
  if (st === 'bonk') { rot = Math.sin(now/40) * 0.2; }
  if (st === 'happy') dy = -Math.abs(Math.sin(now/160)) * 8;
  if (st === 'sleep') rot = 0.25;
  cx.translate(0, dy); cx.rotate(rot); cx.scale(k, k);
  // からだ
  cx.fillStyle = '#7a5230'; cx.beginPath(); cx.ellipse(0, 4, 18, 16, 0, 0, 7); cx.fill();
  cx.fillStyle = '#c49a6c'; cx.beginPath(); cx.ellipse(0, 9, 11, 9, 0, 0, 7); cx.fill();
  // て（シャベルの つめ）
  cx.fillStyle = '#f2c9a0';
  const paw = moving ? Math.sin(now/70) * 4 : 0;
  cx.beginPath(); cx.ellipse(-17, 10 + paw, 6, 4, -0.5, 0, 7); cx.fill();
  cx.beginPath(); cx.ellipse(17, 10 - paw, 6, 4, 0.5, 0, 7); cx.fill();
  // ヘルメット
  cx.fillStyle = '#ffd43b'; cx.beginPath(); cx.moveTo(-15, -4); cx.quadraticCurveTo(0, -26, 15, -4); cx.closePath(); cx.fill();
  cx.fillStyle = '#f59f00'; cx.fillRect(-16, -5, 32, 3);
  cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(0, -14, 3.6, 0, 7); cx.fill();
  if (G.mode === 'dig' || G.mode === 'event') { cx.fillStyle = 'rgba(255,250,200,.35)'; cx.beginPath(); cx.moveTo(0,-14); cx.lineTo(-10, 40); cx.lineTo(10, 40); cx.closePath(); cx.fill(); }
  // かお
  cx.fillStyle = '#222'; cx.strokeStyle = '#222'; cx.lineWidth = 1.6;
  if (st === 'sleep') { cx.beginPath(); cx.moveTo(-8, 1); cx.lineTo(-3, 1); cx.moveTo(3, 1); cx.lineTo(8, 1); cx.stroke(); }
  else if (st === 'bonk') { cx.beginPath(); cx.moveTo(-8,-2); cx.lineTo(-4,2); cx.moveTo(-8,2); cx.lineTo(-4,-2); cx.moveTo(4,-2); cx.lineTo(8,2); cx.moveTo(4,2); cx.lineTo(8,-2); cx.stroke(); }
  else { const r = st === 'surprise' ? 3.2 : 2.3; cx.beginPath(); cx.arc(-6, 0, r, 0, 7); cx.arc(6, 0, r, 0, 7); cx.fill(); }
  cx.fillStyle = '#f783ac'; cx.beginPath(); cx.ellipse(0, 6, 4.2, 3.2, 0, 0, 7); cx.fill();
  if (st === 'happy' || st === 'eat' || st === 'sorry') { cx.strokeStyle = '#4a2c14'; cx.beginPath(); cx.arc(0, 9, 4, 0.2, Math.PI-0.2); cx.stroke(); }
  if (st === 'hungry') { cx.strokeStyle = '#4a2c14'; cx.beginPath(); cx.moveTo(-3, 12); cx.quadraticCurveTo(0, 10, 3, 12); cx.stroke(); }
  // おにぎり
  if (st === 'eat') {
    cx.fillStyle = '#fff'; cx.beginPath(); cx.moveTo(12, 0); cx.lineTo(22, 16); cx.lineTo(2, 16); cx.closePath(); cx.fill();
    cx.fillStyle = '#2b3a2b'; cx.fillRect(7, 10, 10, 6);
  }
  // ほし（ごつん）
  if (st === 'bonk') { cx.fillStyle = '#ffe066'; for (let j = 0; j < 3; j++) { const a = now/200 + j*2.1; cx.font = '10px sans-serif'; cx.fillText('★', Math.cos(a)*20 - 4, -24 + Math.sin(a)*5); } }
  if (st === 'sleep') { cx.fillStyle = '#fff'; cx.font = 'bold 12px sans-serif'; cx.fillText('Z', 16, -18 - (now/150 % 6)); cx.font = 'bold 9px sans-serif'; cx.fillText('z', 24, -26 - (now/200 % 5)); }
  cx.restore();
  // ふきだし
  if (G.sayText && performance.now() < G.sayUntil) {
    sayEl.textContent = G.sayText; sayEl.classList.add('on');
    const bx = Math.max(90, Math.min(W - 90, X)), by = Math.max(46, Y - size*1.05);
    sayEl.style.left = bx + 'px'; sayEl.style.top = by + 'px';
  } else sayEl.classList.remove('on');
}

/* ---------- ループ ---------- */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!G || !$('gameScreen').classList.contains('on')) return;
  // もぐらの いどう
  if (G.mode === 'dig') {
    const gap = G.target - G.mole;
    if (gap > 0.001) {
      const step = Math.min(gap, 7 * dt);
      G.mole += step; G.dugSound += step;
      if (G.dugSound > 0.6) { G.dugSound = 0; SFX.dig(); }
      for (let i = 0; i < 2; i++) G.parts.push({ x:(Math.random()-0.5)*1.6, y:G.mole + 0.6, vx:(Math.random()-0.5)*0.15, vy:-Math.random()*0.12, life:0.6 });
    }
    const ns = nextStop();
    if (G.mole >= ns.d - 0.0005 && ns.what) {
      G.mole = ns.d;
      if (ns.what.ev !== undefined) runEvent(ns.what.ev); else startQuiz(ns.what.st);
    }
  }
  if (G.mode === 'esc') escUpdate(now);
  // カメラ
  const t = camTarget(now), k = 1 - Math.pow(0.002, dt);
  G.cam.x += (t.x - G.cam.x) * k; G.cam.y += (t.y - G.cam.y) * k; G.cam.s += (t.s - G.cam.s) * k;
  drawWorld(now);
}
requestAnimationFrame(loop);

/* ---------- はじめる ---------- */
function begin(){
  ac(); newGame(); show('gameScreen'); resize();
  G.cam = camTarget(performance.now()); G.cam = { ...G.cam };
  say('ほりほり するぞ〜！', 1800);
}
$('startBtn').addEventListener('click', begin);

// テストよう（Playwright から つかう）
window.__cf = { STATIONS, get G(){ return G; }, dig, floorsOf };
</script>
