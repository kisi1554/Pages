<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ピクニック まもりたい</title>
<meta name="description" content="こうえん の ピクニック に アリ・ハト・カラス・リス が おべんとう を ねらって やって くる！ うちわ・かさ・ふえ・パンくず を ならべて、やさしく おいかえす まもり ゲーム。">
<meta name="theme-color" content="#2b8a3e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="stylesheet" href="style.css?v=c962a0b">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- タイトル -->
<section id="vTitle" class="view">
  <div class="tbox">
    <div class="hero" aria-hidden="true"><span class="h1">🐜</span><span class="h2">🧺</span><span class="h3">🐿️</span></div>
    <h1>ピクニック<br>まもりたい</h1>
    <p class="lead">おべんとう を ねらって いきもの が やって くる！<br>どうぐ を ならべて <b>やさしく おいかえそう</b>。</p>
    <div class="tbtns">
      <button type="button" id="bPlay" class="big primary">🧺 あそぶ<span class="sub">こうえん を えらぶ</span></button>
      <button type="button" id="bFree" class="big">🌼 じゆう モード<span class="sub">すきな いきもの を よんで ためす</span></button>
      <div class="row">
        <button type="button" id="bHelp" class="mid">❓ あそびかた</button>
        <button type="button" id="bZukan" class="mid">📖 ずかん</button>
      </div>
      <div class="row">
        <button type="button" class="mid bSnd" aria-pressed="true">🔊 こうかおん</button>
        <button type="button" class="mid bBgm" aria-pressed="true">🎵 おんがく</button>
      </div>
    </div>
    <p class="rec" id="tRec"></p>
    <p class="back"><a href="../">← あそびメニュー</a></p>
  </div>
</section>

<!-- こうえん えらび -->
<section id="vSelect" class="view" hidden>
  <div class="sbox">
    <header class="shead">
      <button type="button" class="hb bBack" aria-label="もどる">⬅️</button>
      <h2>こうえん を えらぼう</h2>
      <span class="sstar" id="sTotal">⭐ 0</span>
    </header>
    <div id="sList" class="slist"></div>
  </div>
</section>

<!-- じゆう モード の せってい -->
<section id="vFree" class="view" hidden>
  <div class="sbox">
    <header class="shead">
      <button type="button" class="hb bBack" aria-label="もどる">⬅️</button>
      <h2>じゆう モード</h2>
      <span></span>
    </header>
    <p class="fnote">コイン は たっぷり。すきな いきもの を よんで、どうぐ の ききめ を ためそう。</p>
    <h3 class="fh">きせつ</h3>
    <div class="frow" id="fSeason">
      <button type="button" class="chip on" data-v="spring">🌸 はる</button>
      <button type="button" class="chip" data-v="summer">🌻 なつ</button>
      <button type="button" class="chip" data-v="autumn">🍁 あき</button>
      <button type="button" class="chip" data-v="winter">⛄ ふゆ</button>
    </div>
    <h3 class="fh">みち の かず</h3>
    <div class="frow" id="fPaths">
      <button type="button" class="chip" data-v="1">1ぽん</button>
      <button type="button" class="chip on" data-v="2">2ほん</button>
      <button type="button" class="chip" data-v="3">3ぼん</button>
    </div>
    <button type="button" id="bFreeGo" class="big primary">🌼 はじめる</button>
  </div>
</section>

<!-- ゲーム -->
<section id="vGame" class="view" hidden>
  <header class="hud">
    <button type="button" id="bHome" class="hb" aria-label="こうえん えらび へ">🏠</button>
    <div class="hinfo">
      <span id="hName" class="hname"></span>
      <span class="hstat"><span id="hBento" class="pill bento">🍙 10</span><span id="hCoin" class="pill coin">🌰 0</span><span id="hWave" class="pill wave">1/3</span></span>
    </div>
    <button type="button" id="bSpeed" class="hb" aria-label="はやさ">▶️×1</button>
    <button type="button" id="bPause" class="hb" aria-label="とめる">⏸️</button>
    <button type="button" class="hb bSnd" aria-pressed="true" aria-label="こうかおん">🔊</button>
    <button type="button" class="hb bBgm" aria-pressed="true" aria-label="おんがく">🎵</button>
  </header>
  <main class="gmain">
    <div id="boardWrap" class="boardWrap">
      <canvas id="cv" aria-label="こうえん。どうぐ を えらんで しばふ を タップ すると おける"></canvas>
      <div id="banner" class="banner" hidden></div>
      <div id="tInfo" class="tinfo" hidden>
        <div id="tiText"></div>
        <div class="tibtns"><button type="button" id="tiDel" class="small warn">かたづける</button><button type="button" id="tiClose" class="small">とじる</button></div>
      </div>
    </div>
    <aside class="side">
      <p id="msg" class="msg" aria-live="polite"></p>
      <div id="tools" class="tools" aria-label="どうぐ"></div>
      <div id="spawns" class="spawns" hidden></div>
      <button type="button" id="bGo" class="go">▶️ スタート</button>
    </aside>
  </main>
  <div id="ghost" class="ghost" hidden></div>
</section>

<!-- まど（ずかん・あそびかた・カード・けっか） -->
<div id="modal" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true">
    <div id="mBody"></div>
    <div id="mBtns" class="mbtns"></div>
  </div>
</div>

<script src="parks.js?v=c962a0b"></script>
<script src="defense.js?v=c962a0b"></script>
<script src="audio.js?v=c962a0b"></script>
<script src="app.js?v=c962a0b"></script>
</body>
</html>
