<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141018">
<meta name="robots" content="noindex">
<title>横浜グルメマップ</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🏮</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar__row">
    <h1 class="brand"><span class="brand__mark">🏮</span>横浜グルメマップ</h1>
    <div class="counts" id="counts" aria-live="polite"></div>
    <button type="button" class="iconbtn" id="btnData" title="データの書き出し／読み込み" aria-label="データの書き出し／読み込み">💾</button>
  </div>
  <nav class="areas" id="areas" aria-label="エリア"></nav>
</header>

<div class="toolbar">
  <div class="toolbar__row">
    <label class="search">
      <span class="search__icon" aria-hidden="true">🔍</span>
      <input type="search" id="q" placeholder="店名・メモで検索" autocomplete="off">
    </label>
    <select id="sort" class="select" aria-label="並びかた">
      <option value="default">標準の順</option>
      <option value="star">★が高い順</option>
      <option value="near">地図の中心から近い順</option>
      <option value="name">名前順</option>
    </select>
  </div>
  <div class="chips" id="statusFilter" role="group" aria-label="状態でしぼりこみ"></div>
  <div class="chips chips--scroll" id="genreFilter" role="group" aria-label="ジャンルでしぼりこみ"></div>
</div>

<main class="layout">
  <section class="mapwrap" aria-label="地図">
    <div id="map" class="map">
      <div class="map__tiles" id="tiles"></div>
      <div class="map__pins" id="pins"></div>
      <div class="map__me" id="me" hidden></div>
    </div>
    <div class="mapctl">
      <button type="button" id="zin"  aria-label="拡大">＋</button>
      <button type="button" id="zout" aria-label="縮小">−</button>
      <button type="button" id="loc"  aria-label="現在地">◎</button>
    </div>
    <div class="attrib">地図 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
    <p class="maphint" id="maphint" hidden>地図タイルを読み込めませんでした（オフラインかもしれません）。リストは使えます。</p>
  </section>

  <section class="listwrap" aria-label="お店リスト">
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>条件に合うお店がありません。</p>
  </section>
</main>

<!-- お店の詳細 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <button type="button" class="sheet__close" data-close aria-label="とじる">✕</button>
    <p class="sheet__genre" id="sheetGenre"></p>
    <h2 class="sheet__name" id="sheetName"></h2>
    <p class="sheet__note" id="sheetNote"></p>

    <div class="field">
      <span class="field__label">いく・いった</span>
      <div class="seg" id="fStatus" role="group" aria-label="状態">
        <button type="button" data-v="">未設定</button>
        <button type="button" data-v="want">行きたい</button>
        <button type="button" data-v="been">行った</button>
        <button type="button" data-v="skip">興味なし</button>
      </div>
    </div>

    <div class="field">
      <span class="field__label">評価</span>
      <div class="stars" id="fStars" role="group" aria-label="評価">
        <button type="button" data-v="1" aria-label="星1">★</button>
        <button type="button" data-v="2" aria-label="星2">★</button>
        <button type="button" data-v="3" aria-label="星3">★</button>
        <button type="button" data-v="4" aria-label="星4">★</button>
        <button type="button" data-v="5" aria-label="星5">★</button>
        <button type="button" class="stars__clear" data-v="0">消す</button>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="fDate">訪問日</label>
      <input type="date" id="fDate">
    </div>

    <div class="field">
      <label class="field__label" for="fMemo">ひとことメモ</label>
      <textarea id="fMemo" rows="3" placeholder="ハムカツが神。17時前なら並ばない…"></textarea>
    </div>

    <div class="sheet__links">
      <a class="btn btn--primary" id="gmapName" target="_blank" rel="noopener">Googleマップで開く</a>
      <a class="btn" id="gmapPin" target="_blank" rel="noopener">この地点を開く</a>
    </div>
    <p class="sheet__saved" id="saved" hidden>保存しました</p>
  </div>
</div>

<!-- データの書き出し／読み込み -->
<div class="sheet" id="dataDlg" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
    <button type="button" class="sheet__close" data-close aria-label="とじる">✕</button>
    <h2 class="sheet__name" id="dataTitle">記録のバックアップ</h2>
    <p class="sheet__note">記録はこの端末のブラウザに保存されています。ブラウザのデータを消すと消えるので、ときどき書き出しておくと安心です。</p>

    <div class="field">
      <span class="field__label">書き出す</span>
      <div class="sheet__links">
        <button type="button" class="btn btn--primary" id="dlJson">JSONファイルを保存</button>
        <button type="button" class="btn" id="copyJson">テキストをコピー</button>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="ioText">読み込む（このJSONで置きかえます）</label>
      <textarea id="ioText" rows="6" spellcheck="false" placeholder="ここにJSONを貼りつける"></textarea>
      <div class="sheet__links">
        <label class="btn">ファイルを選ぶ<input type="file" id="ioFile" accept="application/json,.json" hidden></label>
        <button type="button" class="btn btn--primary" id="doImport">読み込む</button>
      </div>
    </div>
    <p class="sheet__saved" id="ioMsg" hidden></p>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
