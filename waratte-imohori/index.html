<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>わらって いもほり</title>
<meta name="description" content="もんだいに こたえて、へんてこな いもを ほりだす いもほりゲーム。">
<meta name="theme-color" content="#8a4b2a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍠</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="bar">
  <a class="barbtn" href="../" aria-label="あそびメニューへ">🏠</a>
  <button class="barbtn" id="homeBtn" type="button" aria-label="タイトルへ">🍠</button>
  <div class="bartitle" id="barTitle">わらって いもほり</div>
  <div class="barcount" id="barCount" aria-live="polite"></div>
  <button class="barbtn" id="voiceBtn" type="button" aria-label="にょこすけの こえ オン/オフ">🗣️</button>
  <button class="barbtn" id="soundBtn" type="button" aria-label="おと オン/オフ">🔊</button>
</header>

<!-- タイトル -->
<section class="screen" id="title">
  <div class="title-hero" id="titleHero" aria-hidden="true"></div>
  <h1 class="logo"><span>わらって</span> <span>いもほり</span></h1>
  <p class="lead">もんだいに こたえて、にょこすけと<br>へんてこな いもを ほりだそう！</p>

  <div class="modes" id="modes"></div>

  <div class="title-foot">
    <button class="pill" id="zukanBtn" type="button">📖 いもずかん <b id="zukanCount">0/0</b></button>
    <span class="lifetime" id="lifetime"></span>
  </div>
</section>

<!-- はたけ -->
<section class="screen field" id="field" hidden>
  <div class="sky" aria-hidden="true">
    <div class="sun">🌞</div>
    <div class="cloud c1">☁️</div>
    <div class="cloud c2">☁️</div>
  </div>
  <div class="field-info">
    <span id="fieldNo">はたけ 1</span>
    <span id="fieldLeft">のこり 6ぽん</span>
  </div>
  <p class="field-help">つるを タッチして もんだいに こたえよう！</p>
  <div class="plots" id="plots"></div>
</section>

<!-- けっか -->
<section class="screen result" id="result" hidden>
  <h2 class="result-title">🎉 しゅうかく おわり！</h2>
  <p class="result-sum" id="resultSum"></p>
  <div class="result-grid" id="resultGrid"></div>
  <p class="result-best" id="resultBest"></p>
  <div class="result-btns">
    <button class="big green" id="nextFieldBtn" type="button">つぎの はたけへ ▶</button>
    <button class="big ghost" id="backTitleBtn" type="button">もんだいを かえる</button>
  </div>
</section>

<!-- ずかん -->
<section class="screen zukan" id="zukan" hidden>
  <h2 class="zukan-title">📖 いもずかん</h2>
  <p class="zukan-sub" id="zukanSub"></p>
  <div class="zukan-detail" id="zukanDetail">みつけた いもを タッチすると しょうかい するよ</div>
  <div class="zukan-grid" id="zukanGrid"></div>
  <button class="big ghost" id="zukanBack" type="button">もどる</button>
</section>

<!-- もんだい -->
<div class="overlay" id="quiz" hidden>
  <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quizQ">
    <div class="quiz-tag" id="quizTag"></div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-hint" id="quizHint"></div>
    <div class="choices" id="choices"></div>
    <div class="quiz-msg" id="quizMsg" aria-live="polite"></div>
  </div>
</div>

<!-- ひっぱる -->
<div class="overlay pull" id="pull" hidden>
  <p class="pull-msg" id="pullMsg">ひっぱれ！</p>
  <div class="pull-stage" id="pullStage">
    <div class="pull-kid" id="pullKid"></div>
    <div class="pull-vine" id="pullVine"></div>
    <div class="pull-soil"><div class="pull-bump" id="pullBump"></div></div>
    <div class="pull-shout" id="pullShout"></div>
  </div>
  <div class="gauge"><i id="gauge"></i></div>
  <button class="big orange pull-btn" id="pullBtn" type="button">🙌 ひっぱる！</button>
</div>

<!-- ほれた！ -->
<div class="overlay reveal" id="reveal" hidden>
  <div class="reveal-stage" id="revealStage">
    <div class="reveal-hero" id="revealHero"></div>
    <div class="reveal-kid" id="revealKid"></div>
    <div class="fx" id="fx"></div>
    <div class="reveal-ground"></div>
  </div>
  <div class="reveal-card" id="revealCard">
    <span class="newbadge" id="newBadge">NEW!</span>
    <div class="reveal-name" id="revealName"></div>
    <div class="reveal-serif" id="revealSerif"></div>
    <div class="reveal-desc" id="revealDesc"></div>
    <button class="big green" id="revealNext" type="button">あははは！ つぎへ ▶</button>
  </div>
</div>

<script src="game.js?v=4c5eb3f"></script>
</body>
</html>
