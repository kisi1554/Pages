<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>からだ たんけん</title>
<meta name="description" content="ちいさく なって からだの なかを たんけんしよう。しょうか・しんぞうと はい・ほねと きんにく の 3コース。">
<meta name="theme-color" content="#c92a2a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍙</text></svg>">
<link rel="stylesheet" href="style.css?v=8fb818a">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="top">
  <button class="pill back" id="backBtn" hidden aria-label="もどる">‹ <span class="long">もどる</span></button>
  <h1 class="title"><span aria-hidden="true" id="titleEmoji">🔬</span><span id="titleText">からだ たんけん</span></h1>
  <button class="pill" id="zukanBtn" aria-label="ずかん">📖 <span class="long">ずかん</span> <b id="wordCount">0</b></button>
  <button class="pill round" id="soundBtn" aria-pressed="true" aria-label="おと オン／オフ">🔊</button>
</header>

<!-- ホーム -->
<main class="view" id="home">
  <div class="home-wrap">
    <div class="body-box">
      <div class="body-svg" id="bodySvg"></div>
      <p class="hint">からだの ひかって いる ところを タップ しても はじまるよ</p>
    </div>
    <div class="home-side">
      <p class="lead" id="homeLead">ちいさく なって、からだの <b>なか</b> を たんけん しよう！</p>
      <div class="courses" id="courseList"></div>
      <div class="badges" id="badgeRow" aria-label="からだ はかせ バッジ"></div>
    </div>
  </div>
</main>

<!-- コース（ばめん） -->
<main class="view" id="course" hidden>
  <div class="scene-wrap">
    <div class="where" id="where">
      <button class="wmap" id="wmap" aria-label="からだの ちずを おおきく みる"></button>
      <div class="winfo">
        <div class="wnow">📍 いま ここ： <b id="wplace"></b></div>
        <ol class="prog" id="prog" aria-label="すすみぐあい"></ol>
      </div>
    </div>
    <section class="stage" id="stage">
      <div class="stage-svg" id="stageSvg"></div>
      <div class="bubble" id="bubble" aria-live="polite" hidden></div>
      <div class="travel" id="travel" hidden>
        <div class="tmap" id="tmap"></div>
        <p class="tcap" id="tcap"></p>
      </div>
      <div class="ctl" id="ctl"></div>
    </section>
    <section class="talk" id="talk">
      <div class="talk-head">
        <span class="picon" id="picon" aria-hidden="true"></span>
        <h2 class="place" id="place"></h2>
        <div class="vbtns">
          <button class="vbtn" id="replayBtn" aria-label="もういちど よむ">🔁 よむ</button>
          <button class="vbtn" id="voiceBtn" aria-pressed="true" aria-label="よみあげ オン">🗣️ オン</button>
        </div>
      </div>
      <div class="talk-body" id="talkBody">
        <p class="intro" id="intro"></p>
        <div class="choices" id="choices"></div>
        <p class="result" id="result" hidden></p>
        <ul class="facts" id="facts" hidden></ul>
        <div class="newwords" id="newWords" hidden></div>
      </div>
      <button class="next" id="nextBtn" hidden>つぎへ ▶</button>
    </section>
  </div>
</main>

<!-- ずかん -->
<main class="view scroll" id="zukan" hidden>
  <div class="wrap">
    <p class="lead">たんけんで おぼえた ことば。<b id="zukanCount"></b></p>
    <div id="zukanList"></div>
  </div>
</main>

<!-- ちいさく なあれ -->
<div class="shrink" id="shrink" hidden aria-hidden="true">
  <div class="shrink-kid">🧒</div>
  <p>ちいさく なあれ！</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- けっか -->
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="m-btns" id="mBtns"></div>
  </div>
</div>

<script src="data.js?v=8fb818a"></script>
<script src="art.js?v=8fb818a"></script>
<script src="app.js?v=8fb818a"></script>
</body>
</html>
