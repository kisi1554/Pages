<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d9452b">
<title>よーいドン ピストル</title>
<style>
  :root {
    --bg: #fff7ec;
    --ink: #3b2a1e;
    --sub: #8a6a55;
    --card: #ffffff;
    --line: #f0d9c2;
    --accent: #d9452b;
    --accent2: #ffb703;
    --track: #c8553d;
    --ok: #2a9d4b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  ruby rt { font-size: .5em; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header .sp { flex: 1; }
  header h1 { order: 2; flex-basis: 100%; margin: 4px 4px 0; font-size: clamp(24px, 6vw, 34px); letter-spacing: .02em; }
  header h1 small { display: block; font-size: 14px; color: var(--sub); font-weight: normal; margin-top: 2px; }
  .back { text-decoration: none; color: var(--sub); font-size: 15px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); }
  .toggle {
    min-width: 92px; min-height: 52px; padding: 6px 12px; border-radius: 16px;
    border: 3px solid var(--line); background: var(--card); font-size: 17px; font-weight: bold;
  }
  .toggle[aria-pressed="false"] { opacity: .55; }

  h2 { font-size: 19px; margin: 18px 4px 8px; }
  h2 .hint { font-size: 14px; font-weight: normal; color: var(--sub); margin-left: 6px; }

  /* おとの しゅるい */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .snd {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; min-height: 100px; padding: 10px 6px 8px; border-radius: 20px;
    border: 3px solid var(--line); background: var(--card); box-shadow: 0 5px 0 var(--line);
    transition: transform .08s;
  }
  .snd:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  .snd .em { font-size: 36px; line-height: 1.1; }
  .grp { grid-column: 1 / -1; font-weight: bold; font-size: 16px; color: var(--sub); margin: 8px 4px 0; padding-bottom: 4px; border-bottom: 3px dotted var(--line); }
  .grp:first-child { margin-top: 0; }
  .snd .nm { font-size: 17px; font-weight: bold; }
  .snd .fire { font-size: 12px; letter-spacing: -1px; min-height: 16px; }
  .snd .try {
    position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--line); background: #fff; font-size: 15px; display: grid; place-items: center;
  }
  .snd[aria-checked="true"] { border-color: var(--accent); background: #fff1ea; box-shadow: 0 5px 0 #f3b2a2; }
  .snd[aria-checked="true"]::after {
    content: "✔"; position: absolute; top: 6px; left: 8px; color: var(--accent); font-weight: bold; font-size: 20px;
  }

  /* スタート */
  .startRow { display: flex; justify-content: center; margin: 22px 0 6px; }
  #startBtn {
    display: flex; align-items: center; gap: 14px; padding: 18px 34px 18px 26px; min-height: 110px;
    border-radius: 999px; border: none; color: #fff; font-size: clamp(28px, 7vw, 40px); font-weight: bold;
    background: radial-gradient(circle at 30% 25%, #ff7a5c, var(--accent) 60%, #a92e17);
    box-shadow: 0 9px 0 #8c2512, 0 14px 24px rgba(140, 37, 18, .3);
    transition: transform .08s;
  }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 3px 0 #8c2512; }
  #startBtn svg { width: 86px; height: 70px; flex: none; }
  .chosen { text-align: center; color: var(--sub); font-size: 16px; margin-top: 10px; }

  /* せってい */
  .opts { display: grid; gap: 10px; }
  .opt { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 10px 12px; }
  .opt .lbl { font-weight: bold; font-size: 16px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 50px; min-width: 76px; padding: 6px 14px; border-radius: 14px;
    border: 3px solid var(--line); background: #fffaf4; font-size: 17px; font-weight: bold;
  }
  .chip[aria-checked="true"] { border-color: var(--accent); background: #ffe6dc; color: #9b2c15; }

  /* きろく */
  .rec { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 6px 12px; }
  .rec ul { list-style: none; margin: 0; padding: 0; }
  .rec li { display: flex; gap: 10px; align-items: baseline; padding: 9px 2px; border-bottom: 2px dashed var(--line); font-size: 17px; }
  .rec li:last-child { border-bottom: none; }
  .rec .d { color: var(--sub); font-size: 14px; min-width: 92px; }
  .rec .s { flex: 1; }
  .rec .t { font-weight: bold; font-variant-numeric: tabular-nums; }
  .rec .empty { color: var(--sub); padding: 12px 2px; }
  .recFoot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .small { min-height: 44px; padding: 4px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--sub); font-size: 15px; }

  /* ===== ステージ（ぜんがめん） ===== */
  #stage {
    position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden;
    background:
      repeating-linear-gradient(90deg, transparent 0 calc(16.66% - 3px), rgba(255,255,255,.85) calc(16.66% - 3px) 16.66%),
      linear-gradient(#7cc7f2 0 34%, #9fd86b 34% 40%, var(--track) 40% 100%);
  }
  #stage.on { display: block; }
  #stage::before { /* スタートライン */
    content: ""; position: absolute; left: 0; right: 0; bottom: 18%; height: 10px; background: #fff;
  }
  #shaker { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #cue {
    font-size: clamp(54px, 15vw, 130px); font-weight: 900; color: #fff; text-align: center; line-height: 1.15;
    text-shadow: 0 5px 0 rgba(0,0,0,.25), 0 0 24px rgba(0,0,0,.25);
    -webkit-text-stroke: 3px #3b2a1e; paint-order: stroke fill; white-space: nowrap;
  }
  #cue.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
  #cue.big { font-size: clamp(64px, 19vw, 170px); color: #ffe14d; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #runner { font-size: clamp(60px, 16vw, 120px); margin-top: 10px; transition: transform .5s; }
  #runner.crouch { transform: translateY(14px) scaleY(.82); }
  #runner.set { transform: translateY(-6px) rotate(-8deg); }
  #runner.go { animation: dash 1.1s ease-in forwards; }
  @keyframes dash { to { transform: translateX(120vw); } }

  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #flash.go { animation: flash .7s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .shake1 { animation: shake .35s linear; --amp: 6px; }
  .shake2 { animation: shake .6s linear; --amp: 14px; }
  .shake3 { animation: shake 1.3s linear; --amp: 30px; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(calc(var(--amp) * -1), calc(var(--amp) * .6)); }
    20% { transform: translate(var(--amp), calc(var(--amp) * -.8)); }
    30% { transform: translate(calc(var(--amp) * -.8), calc(var(--amp) * -.4)); }
    40% { transform: translate(calc(var(--amp) * .7), var(--amp)); }
    55% { transform: translate(calc(var(--amp) * -.5), calc(var(--amp) * -.5)); }
    70% { transform: translate(calc(var(--amp) * .3), calc(var(--amp) * .3)); }
    85% { transform: translate(calc(var(--amp) * -.15), 0); }
  }

  .stageBtns { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 14px; padding: 0 16px; }
  .sbtn {
    min-height: 64px; min-width: 130px; padding: 8px 22px; border-radius: 20px; border: 3px solid #fff;
    background: rgba(59, 42, 30, .55); color: #fff; font-size: 20px; font-weight: bold;
  }

  /* タイマー */
  #timerBox {
    display: none; flex-direction: column; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, .93); border-radius: 30px; padding: 18px 26px 22px; border: 4px solid #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: 94vw;
  }
  #timerBox.on { display: flex; }
  #timerSub { font-size: 20px; font-weight: bold; color: var(--sub); }
  #timer { font-size: clamp(64px, 20vw, 150px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  #doneBtn {
    margin-top: 6px; min-height: 92px; padding: 10px 40px; border-radius: 999px; border: none; color: #fff;
    font-size: clamp(28px, 7vw, 40px); font-weight: bold; background: var(--ok); box-shadow: 0 8px 0 #1c6e33;
  }
  #doneBtn:active { transform: translateY(5px); box-shadow: 0 3px 0 #1c6e33; }
  #doneBtn:disabled, .sbtn:disabled { opacity: .55; filter: grayscale(.6); transform: none; cursor: not-allowed; }
  #doneBtn:disabled { box-shadow: 0 8px 0 #555; background: #7d8a80; }
  #resultMsg { font-size: clamp(22px, 5.6vw, 34px); font-weight: bold; text-align: center; }
  #resultMsg .best { display: block; color: var(--accent); font-size: .85em; margin-top: 4px; }
  #resultMsg .stamp { display: block; font-size: clamp(64px, 18vw, 110px); line-height: 1.1; animation: stamp .6s cubic-bezier(.2, 1.8, .4, 1); }
  #resultMsg .again { display: inline-block; margin-top: 10px; min-height: 52px; padding: 6px 18px; border-radius: 16px; border: 3px solid var(--line); background: #fff; font-size: 18px; font-weight: bold; }
  #resultMsg .praise { display: block; color: #9b2c15; font-size: clamp(22px, 6vw, 34px); line-height: 1.45; margin-top: 6px; max-width: 80vw; }
  @keyframes stamp { from { transform: scale(3) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

  @media (min-width: 700px) {
    .opts { grid-template-columns: 1fr 1fr; }
    .opts .opt.wide { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shake1, .shake2, .shake3 { animation: none; }
  }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">← メニュー</a>
    <span class="sp"></span>
    <h1>よーいドン ピストル<small>「いちについて、よーい…ドン！」で しゅくだい スタート</small></h1>
    <button class="toggle" id="sndBtn" aria-pressed="true">🔊 おと</button>
    <button class="toggle" id="voiceBtn" aria-pressed="true">🗣️ こえ</button>
  </header>

  <h2>どの おとで スタート？<span class="hint">🔈で ためしぎき</span></h2>
  <div class="grid" id="grid" role="radiogroup" aria-label="おとの しゅるい"></div>

  <div class="startRow">
    <button id="startBtn" aria-label="スタート">
      <svg viewBox="0 0 120 96" aria-hidden="true">
        <g stroke="#3b2a1e" stroke-width="4" stroke-linejoin="round">
          <rect x="22" y="22" width="88" height="20" rx="5" fill="#ffd23f"/>
          <rect x="100" y="16" width="10" height="8" rx="2" fill="#3b2a1e"/>
          <path d="M30 40 L58 40 L50 88 L22 88 Z" fill="#ffd23f"/>
          <path d="M58 42 Q74 44 70 62 Q64 70 54 66" fill="none"/>
          <path d="M60 44 L60 56" stroke-linecap="round"/>
          <circle cx="40" cy="31" r="5" fill="#fff"/>
        </g>
        <g fill="#fff" opacity=".95">
          <circle cx="8" cy="18" r="6"/><circle cx="16" cy="9" r="5"/><circle cx="4" cy="6" r="3"/>
        </g>
      </svg>
      <span>スタート</span>
    </button>
  </div>
  <div class="chosen" id="chosen"></div>

  <h2>せってい</h2>
  <div class="opts">
    <div class="opt">
      <div class="lbl">⏱️ 「よーい」から「ドン」まで</div>
      <div class="chips" role="radiogroup" id="paceChips"></div>
    </div>
    <div class="opt">
      <div class="lbl">⌛ ドンの あとに タイマー</div>
      <div class="chips" role="radiogroup" id="timerChips"></div>
    </div>
    <div class="opt wide">
      <div class="lbl">📚 なにを する？（きろくに のこるよ）</div>
      <div class="chips" role="radiogroup" id="subjChips"></div>
    </div>
  </div>

  <h2>📒 きろく<span class="hint">あたらしい じゅん</span></h2>
  <div class="rec"><ul id="recList"></ul></div>
  <div class="recFoot"><button class="small" id="clearBtn">きろくを けす</button></div>
</div>

<div id="stage" aria-live="assertive">
  <div id="flash"></div>
  <canvas id="fx"></canvas>
  <div id="shaker">
    <div id="cue"></div>
    <div id="runner" aria-hidden="true">🏃</div>
    <div id="timerBox">
      <div id="timerSub"></div>
      <div id="timer">0:00</div>
      <div id="resultMsg"></div>
      <button id="doneBtn">おわった！</button>
    </div>
  </div>
  <div class="stageBtns">
    <button class="sbtn" id="stopBtn">✖ やめる</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- ほぞん ---------- */
  var KEY = 'yoidon-pistol-v1';
  var st = { sound: 'pistol', snd: true, voice: true, pace: 'normal', timer: true, subj: 'sansu', recs: [], running: null, lockUntil: 0 };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') for (var k in st) if (k in saved) st[k] = saved[k];
  } catch (e) {}
  if (!Array.isArray(st.recs)) st.recs = [];
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  /* ---------- おと（WebAudio の ごうせいおん だけ） ---------- */
  var ac = null, master = null, verbIn = null, noiseBuf = null, shaper = null;
  // iPhone は マナーモード（消音スイッチ）だと WebAudio が なりません。
  // 「メディアの おと」として あつかって もらうため、むおんの <audio> を ながしておく ＋ audioSession を playback に。
  var unlockEl = null;
  function silentWavUrl() {
    var sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function w(o, str) { for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function mediaMode(on) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {
      if (on) {
        if (!unlockEl) {
          unlockEl = document.createElement('audio');
          unlockEl.setAttribute('playsinline', ''); unlockEl.setAttribute('webkit-playsinline', '');
          unlockEl.loop = true; unlockEl.preload = 'auto'; unlockEl.src = silentWavUrl();
        }
        var pr = unlockEl.play(); if (pr && pr.catch) pr.catch(function () {});
      } else if (unlockEl) unlockEl.pause();
    } catch (e) {}
  }
  function ensureAudio() {
    mediaMode(true);
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      // おおきく: コンプで そろえて もちあげる（さいごに リミッター）
      var comp = ac.createDynamicsCompressor();
      comp.threshold.value = -24; comp.knee.value = 4; comp.ratio.value = 12;
      comp.attack.value = 0.001; comp.release.value = 0.2;
      var makeup = ac.createGain(); makeup.gain.value = 3.4;
      var lim = ac.createDynamicsCompressor();
      lim.threshold.value = -1; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.1;
      master = ac.createGain(); master.gain.value = 1.0;
      master.connect(comp); comp.connect(makeup); makeup.connect(lim); lim.connect(ac.destination);
      // ノイズ
      var len = ac.sampleRate * 4;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // こだま（そとの グラウンドの ひびき）
      var irLen = Math.floor(ac.sampleRate * 2.6);
      var ir = ac.createBuffer(2, irLen, ac.sampleRate);
      for (var c = 0; c < 2; c++) {
        var ch = ir.getChannelData(c);
        for (var j = 0; j < irLen; j++) ch[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / irLen, 3.2);
      }
      var verb = ac.createConvolver(); verb.buffer = ir;
      verbIn = ac.createGain(); verbIn.gain.value = 0.55;
      verbIn.connect(verb); verb.connect(master);
      // ひずみ（バクダン よう）
      shaper = ac.createWaveShaper();
      var curve = new Float32Array(1024);
      for (var n = 0; n < 1024; n++) { var x = n / 512 - 1; curve[n] = Math.tanh(x * 3.5); }
      shaper.curve = curve;
      var sg = ac.createGain(); sg.gain.value = 0.8;
      shaper.connect(sg); sg.connect(master); sg.connect(verbIn);
    }
    if (ac.state !== 'running') { try { ac.resume(); } catch (e) {} }
    return ac;
  }

  function outTo(node, rev, dist) {
    if (dist) { node.connect(shaper); return; }
    node.connect(master);
    if (rev) { var s = ac.createGain(); s.gain.value = rev; node.connect(s); s.connect(verbIn); }
  }

  // ノイズの「バン」
  function burst(t, o) {
    var src = ac.createBufferSource(); src.buffer = noiseBuf;
    var f = ac.createBiquadFilter(); f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.f || 2000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + (o.sweep || o.dur));
    f.Q.value = o.q || 0.7;
    var g = ac.createGain();

      for (i = 0; i < 40; i++) add({ t: 'spark', x: ox, y: H * 0.85, vx: rnd(-3, 3), vy: rnd(2, 7), r: rnd(2, 5), life: rnd(20, 40), c: '#ff9f1c', delay: i });
    } else if (kind === 'siren') {
      for (i = 0; i < 6; i++) add({ t: 'glow', x: i % 2 ? W * 0.85 : W * 0.15, y: H * 0.18, r: 120, life: 14, c: i % 2 ? '60,120,255' : '255,40,40', delay: i * 12 });
    } else if (kind === 'pops') {
      for (var b2 = 0; b2 < 12; b2++) {
        var px = rnd(W * 0.1, W * 0.9), py = rnd(H * 0.15, H * 0.7), c2 = CONF[b2 % 6], d2 = b2 * 7;
        for (i = 0; i < 14; i++) { a = i / 14 * Math.PI * 2; v = rnd(2, 5);
          add({ t: 'spark', x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(2, 4), life: rnd(18, 30), c: c2, delay: d2, drag: 0.92 }); }
      }
    } else if (kind === 'bolt') {
      for (i = 0; i < 2; i++) add({ t: 'bolt', x: W * (0.35 + i * 0.3), life: 16, delay: i * 6, pts: null });
    }
    if (!looping) { looping = true; requestAnimationFrame(loop); }
  }
  function loop() {
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.clearRect(0, 0, W, H);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      if (p.delay > 0) { p.delay--; continue; }
      p.age++;
      if (p.age > p.life) { parts.splice(i, 1); continue; }
      var k = 1 - p.age / p.life;
      if (p.vx !== undefined) { p.x += p.vx; p.y += p.vy || 0; }
      if (p.g) p.vy += p.g;
      if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
      cx.save();
      if (p.t === 'smoke') {
        p.r *= 1.012; p.vx *= 0.96; p.vy *= 0.96;
        cx.fillStyle = 'rgba(' + p.c + ',' + (0.55 * k) + ')';
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
      } else if (p.t === 'spark') {
        cx.globalAlpha = k; cx.fillStyle = p.c; cx.shadowColor = p.c; cx.shadowBlur = 10;
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
      } else if (p.t === 'conf' || p.t === 'rock') {
        p.rot += p.vr; p.vx *= 0.985;
        cx.globalAlpha = Math.min(1, k * 2); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
        if (p.t === 'conf') cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        else { cx.beginPath(); cx.moveTo(-p.r, 0); cx.lineTo(0, -p.r * 0.8); cx.lineTo(p.r, -p.r * 0.2); cx.lineTo(p.r * 0.4, p.r); cx.closePath(); cx.fill(); }
      } else if (p.t === 'fire') {
        var hue = 50 * k; // きいろ → あか
        var gr = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        gr.addColorStop(0, 'hsla(' + (hue + 10) + ',100%,70%,' + k + ')');
        gr.addColorStop(1, 'hsla(' + hue + ',100%,45%,0)');
        cx.fillStyle = gr; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
        p.r *= 1.02;
      } else if (p.t === 'ring') {
        p.r += p.vr; p.vr *= 0.95;
        cx.strokeStyle = 'rgba(' + p.c + ',' + k + ')'; cx.lineWidth = (p.w || 18) * k + 1;
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.stroke();
      } else if (p.t === 'txt') {
        if (p.grow) p.r *= p.grow;
        cx.globalAlpha = Math.min(1, k * 2.5); cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.font = 'bold ' + p.r + 'px sans-serif';
        cx.translate(p.x, p.y); if (p.flip) cx.scale(-1, 1); if (p.rot0) cx.rotate(p.rot0);
        if (!p.plain) { cx.fillStyle = p.c; cx.strokeStyle = '#3b2a1e'; cx.lineWidth = 4; cx.strokeText(p.s, 0, 0); }
        cx.fillText(p.s, 0, 0);
      } else if (p.t === 'glow') {
        var gg = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        gg.addColorStop(0, 'rgba(' + p.c + ',' + (0.9 * k) + ')'); gg.addColorStop(1, 'rgba(' + p.c + ',0)');
        cx.fillStyle = gg; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
      } else if (p.t === 'beam') {
        cx.globalAlpha = k; cx.strokeStyle = p.c; cx.shadowColor = p.c; cx.shadowBlur = 18; cx.lineWidth = 10; cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(p.x - W * 0.35, p.y); cx.lineTo(p.x, p.y); cx.stroke();
      } else if (p.t === 'bolt') {
        if (!p.pts) { p.pts = []; var x = p.x, y = 0; while (y < H * 0.75) { p.pts.push([x, y]); x += rnd(-40, 40); y += rnd(25, 55); } p.pts.push([x, y]); }
        cx.globalAlpha = p.age % 4 < 2 ? 1 : 0.4; cx.strokeStyle = '#fffbd0'; cx.shadowColor = '#9ad0ff'; cx.shadowBlur = 25; cx.lineWidth = 7; cx.lineJoin = 'round';
        cx.beginPath(); p.pts.forEach(function (q, j) { if (j) cx.lineTo(q[0], q[1]); else cx.moveTo(q[0], q[1]); }); cx.stroke();
      }
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(loop);
    else { looping = false; cx.clearRect(0, 0, W, H); }
  }

  /* ---------- はじめ ---------- */
  renderSel(); paintToggles(); renderRecs();
  // とちゅうで とじても タイマーを つづける
  if (st.running && st.running.t0 && Date.now() - st.running.t0 < 6 * 3600 * 1000) startTimer(st.running.t0, st.running.subj);
  else if (st.running) { st.running = null; save(); }
  else if (lockLeft() > 0) { if (st.lockUntil - Date.now() > LOCK_MS + 10000) st.lockUntil = Date.now() + LOCK_MS; showStudy(); }
  else if (st.lockUntil) { st.lockUntil = 0; save(); }
})();
</script>
