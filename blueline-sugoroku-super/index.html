<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0089CF">
<title>ブルーライン すごろく スーパー：しょうなんだい〜ちゅうおうりんかん</title>
<style>
  :root{
    --blue:#0089CF; --blue-deep:#005D96; --blue-tint:#E3F3FC;
    --green:#1F9E7A; --green-deep:#14735A; --green-tint:#E2F5EE;
    --paper:#FFFDF6; --paper-2:#EEF6FC; --card:#FFFFFF;
    --ink:#182430; --ink-soft:#5B6B78;
    --amber:#FFB100; --amber-deep:#D98600;
    --atk:#D8452F; --item:#E08A00; --chance:#6C4FC9; --event:#D9408C;
    --shadow:0 4px 12px rgba(14,40,60,.14);
    --gap:8px; --rgap:26px;
    color-scheme: light;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"UD デジタル教科書体 N-B","UDデジタル教科書体N-B","BIZ UDGothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    background:var(--paper); color:var(--ink);
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  button{ font-family:inherit; color:inherit; cursor:pointer; }
  button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
  ruby{ ruby-align:center; }
  rt{ font-size:.5em; font-weight:700; color:var(--ink-soft); }

  /* ---------- ゲーム画面 ---------- */
  #game{
    height:100vh; height:100dvh;
    display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"top" "bar" "board" "panel";
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #top{ grid-area:top; display:flex; align-items:center; gap:6px; padding:6px 8px 2px; }
  #top .ttl{ flex:1; min-width:0; font-weight:900; font-size:.95rem; color:var(--blue-deep); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ib{
    flex:none; width:42px; height:42px; border-radius:50%; border:none;
    background:var(--paper-2); font-size:1.15rem; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .ib.off{ opacity:.5; }
  @media (max-width:520px){ #top .ttl{ font-size:.8rem; } .ib{ width:40px; height:40px; } #top{ gap:4px; } }
  @media (max-width:400px){ #top .ttl{ visibility:hidden; } }
  .ib:active{ transform:translateY(2px); }

  #lineBar{ grid-area:bar; position:relative; height:44px; margin:0 26px; }
  .lb-track{ position:absolute; left:0; right:0; top:22px; height:7px; border-radius:4px; }
  .lb-dot{ position:absolute; top:19px; width:13px; height:13px; margin-left:-6.5px; border-radius:50%; background:#fff; border:3px solid var(--ink); }
  .lb-lab{ position:absolute; top:33px; font-size:.56rem; font-weight:800; color:var(--ink-soft); white-space:nowrap; transform:translateX(-50%); }
  @media (max-width:520px){ .lb-t{ display:none; } #diceLbl{ font-size:.9rem; } }
  #diceLbl{ white-space:nowrap; }
  .lb-lab.l{ transform:none; left:-18px; } .lb-lab.r{ transform:none; right:-18px; }
  .lb-mk{
    position:absolute; top:0; width:24px; height:24px; margin-left:-12px; border-radius:50%;
    background:var(--c); border:2px solid #fff; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:.8rem;
    transition:left .25s ease; z-index:1;
  }
  .lb-mk.act{ z-index:2; transform:scale(1.15); }

  #boardWrap{ grid-area:board; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; background:var(--paper-2); border-radius:18px; margin:2px 8px 0; }
  #board{ position:relative; display:grid; column-gap:var(--gap); row-gap:var(--rgap); padding:30px 10px 34px; }
  .tile{ position:relative; min-width:0; display:flex; min-height:98px; }
  .tile::before{ content:""; position:absolute; background:var(--blue); z-index:0; border-radius:5px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.16); }
  .tile.sg::before{ background:var(--green); }
  .tile.nx-r::before{ left:50%; width:calc(100% + var(--gap)); top:50%; height:10px; margin-top:-5px; }
  .tile.nx-l::before{ right:50%; width:calc(100% + var(--gap)); top:50%; height:10px; margin-top:-5px; }
  .tile.nx-d::before{ top:50%; height:calc(100% + var(--rgap)); left:50%; width:10px; margin-left:-5px; }
  .tile.nx-0::before{ display:none; }
  .face{
    position:relative; z-index:1; flex:1; min-width:0;
    background:var(--card); border-radius:14px; border:3px solid var(--edge,#C9DCEA);
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    padding:15px 2px 4px; text-align:center;
  }
  .tile.here .face{ box-shadow:0 0 0 4px var(--amber), var(--shadow); }
  .tile .num{
    position:absolute; top:-9px; left:-5px; min-width:32px; height:19px; padding:0 5px; border-radius:10px;
    background:var(--blue); color:#fff; font-weight:900; font-size:.62rem; line-height:19px;
    font-variant-numeric:tabular-nums; box-shadow:var(--shadow);
  }
  .tile.lg .num{ background:var(--green); }
  .tile .rap{ position:absolute; top:-9px; right:-5px; height:19px; padding:0 5px; border-radius:10px; background:var(--amber); color:#3A2200; font-weight:900; font-size:.58rem; line-height:19px; box-shadow:var(--shadow); }
  .tile .kj{ font-weight:900; font-size:1rem; line-height:1.12; overflow-wrap:anywhere; }
  .tile .kj.l5{ font-size:.84rem; } .tile .kj.l7{ font-size:.7rem; } .tile .kj.l12{ font-size:.6rem; }
  .tile .kn{ font-weight:700; font-size:.58rem; line-height:1.15; color:var(--ink-soft); overflow-wrap:anywhere; line-break:anywhere; }
  .tile .chip{ margin-top:2px; font-size:.58rem; font-weight:900; border-radius:999px; padding:2px 5px; background:var(--tint,#EEF2F5); color:var(--edge-deep,var(--ink-soft)); max-width:100%; white-space:nowrap; }
  .k-a{ --edge:#F0B3A8; --tint:#FBE4DF; --edge-deep:#B5341F; }
  .k-i{ --edge:#F5CE7A; --tint:#FFF1CF; --edge-deep:#9A5E00; }
  .k-c{ --edge:#C5B8F2; --tint:#ECE7FB; --edge-deep:#5237B0; }
  .k-e{ --edge:#F3B1D2; --tint:#FCE4F0; --edge-deep:#B02A6C; }
  .k-t{ --edge:var(--green); --tint:var(--green-tint); --edge-deep:var(--green-deep); }
  .k-s{ --edge:var(--blue); --tint:var(--blue-tint); --edge-deep:var(--blue-deep); }
  .k-g{ --edge:var(--amber); --tint:#FFF1CF; --edge-deep:#9A5E00; }
  .k-g .face{ background:linear-gradient(180deg,#fff,#FFF3D1); }

  .tok{
    position:absolute; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%;
    background:var(--c); border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; font-size:1.15rem; z-index:5;
    transition:left .22s ease, top .22s ease; pointer-events:none;
  }
  .tok.snap{ transition:none; }
  .tok.act{ z-index:6; box-shadow:0 0 0 4px var(--amber), 0 3px 8px rgba(0,0,0,.3); }
  .tok.zz::after{ content:"💤"; position:absolute; right:-12px; top:-12px; font-size:.8rem; }
  @keyframes hop{ 0%{ transform:translateY(0) scale(1);} 45%{ transform:translateY(-16px) scale(1.18);} 100%{ transform:translateY(0) scale(1);} }
  @keyframes shake{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-12deg) scale(1.06);} 75%{ transform:rotate(12deg) scale(1.06);} }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
  @keyframes pop{ 0%{ transform:scale(.7); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  @keyframes fall{ 0%{ opacity:1; transform:translateY(0) rotate(0);} 100%{ opacity:1; transform:translateY(105vh) rotate(360deg);} }
  @media (prefers-reduced-motion: no-preference){
    .tok.hop{ animation:hop .22s ease; }
    .rolling .die{ animation:shake .13s linear infinite; }
    #diceBtn.ready{ animation:pulse 1.3s ease-in-out infinite; }
    .mcard{ animation:pop .18s ease-out; }
  }

  #panel{ grid-area:panel; padding:6px 8px 8px; display:flex; flex-direction:column; gap:6px; }
  #plist{ display:grid; gap:6px; grid-template-columns:repeat(var(--n,2),minmax(0,1fr)); }
  .pc{
    background:var(--card); border-radius:14px; padding:5px 7px; min-width:0;
    display:flex; align-items:center; gap:6px; border:3px solid transparent; box-shadow:var(--shadow);
  }
  .pc.act{ border-color:var(--c); }
  .pc .av{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--c); display:flex; align-items:center; justify-content:center; font-size:1rem; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); }
  .pc .tx{ min-width:0; flex:1; }
  .pc .nm{ font-weight:900; font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc .wh{ font-weight:700; font-size:.62rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc .cd{ font-size:.7rem; white-space:nowrap; }
  #plist.many .pc{ flex-direction:column; gap:1px; text-align:center; padding:4px 3px; }
  #plist.many .pc .tx{ width:100%; }
  #msg{
    background:var(--card); border-radius:14px; padding:8px 12px; min-height:3.1em;
    font-weight:800; font-size:.95rem; line-height:1.4; text-align:center; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
  }
  #ctrl{ display:flex; align-items:stretch; gap:8px; }
  #diceBtn{
    flex:1.2; min-height:76px; border:none; border-radius:20px; padding:8px 10px;
    background:linear-gradient(180deg,var(--amber),var(--amber-deep)); color:#2B1600;
    box-shadow:0 5px 0 #A86500, var(--shadow);
    display:flex; align-items:center; justify-content:center; gap:8px; font-weight:900; font-size:1rem;
  }
  #diceBtn:active:not(:disabled){ transform:translateY(4px); box-shadow:0 1px 0 #A86500; }
  #diceBtn:disabled{ filter:saturate(.5); opacity:.75; cursor:default; }
  .die{ flex:none; width:54px; height:54px; border-radius:13px; background:#fff; box-shadow:inset 0 -4px 0 rgba(0,0,0,.14), 0 2px 4px rgba(0,0,0,.2); display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:8px; gap:2px; }
  .die i{ border-radius:50%; margin:1px; }
  .die i.on{ background:var(--blue-deep); }
  .die.one i.on{ background:var(--atk); transform:scale(1.5); }
  #cards{ flex:1; display:flex; gap:6px; }
  .cbtn{
    flex:1; min-width:0; border:3px solid var(--edge,#ccc); background:var(--card); border-radius:16px; padding:4px 2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-weight:900; font-size:.58rem; line-height:1.15; box-shadow:var(--shadow);
  }
  .cbtn b{ font-size:1.5rem; line-height:1.1; }
  .cbtn:disabled{ opacity:.6; cursor:default; }
  .cbtn.empty{ border-style:dashed; border-color:#C9D5DE; box-shadow:none; background:transparent; color:#9AA9B5; }
  .c-rapid{ --edge:var(--blue); } .c-double{ --edge:var(--amber-deep); } .c-shield{ --edge:var(--green); } .c-swap{ --edge:var(--chance); }

  @media (orientation:landscape) and (min-width:600px){
    #game{
      grid-template-columns:minmax(0,1fr) clamp(264px,36vw,380px);
      grid-template-rows:auto auto minmax(0,1fr);
      grid-template-areas:"top panel" "bar panel" "board panel";
    }
    #panel{ overflow-y:auto; justify-content:center; gap:10px; padding:10px; }
    #boardWrap{ margin-bottom:8px; }
    #plist{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    #plist.many .pc{ flex-direction:row; text-align:left; padding:5px 7px; }
    #ctrl{ flex-direction:column; }
    #cards{ min-height:66px; }
  }
  @media (min-width:900px) and (min-height:600px){
    #msg{ font-size:1.1rem; } #diceBtn{ min-height:110px; font-size:1.15rem; } .die{ width:72px; height:72px; padding:11px; }
    .pc .nm{ font-size:.95rem; } .pc .wh{ font-size:.72rem; } .cbtn{ font-size:.7rem; } #cards{ min-height:84px; }
    .tile{ min-height:108px; } .tile .kj{ font-size:1.1rem; } .tile .kj.l5{ font-size:.95rem; } .tile .kj.l7{ font-size:.8rem; } .tile .kj.l12{ font-size:.68rem; }
    .tile .kn{ font-size:.66rem; } .tile .chip{ font-size:.66rem; }
  }

  /* ---------- モーダル ---------- */
  .ov{ position:fixed; inset:0; background:rgba(10,20,30,.55); display:flex; align-items:center; justify-content:center; padding:14px; z-index:60; }
  #sheet{ z-index:80; }
  .mcard{
    background:var(--card); border-radius:24px; padding:18px 16px; width:100%; max-width:440px; max-height:100%;
    overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.35); text-align:center;
    display:flex; flex-direction:column; gap:10px;
  }
  .mcard.wide{ max-width:640px; }
  .mhead{ font-weight:900; font-size:1.1rem; color:var(--hc,var(--blue-deep)); }
  .who{ display:inline-flex; align-items:center; gap:8px; align-self:center; background:color-mix(in srgb,var(--c) 16%,#fff); border-radius:999px; padding:5px 14px 5px 5px; font-weight:900; font-size:1.05rem; }
  .who .av{ width:34px; height:34px; border-radius:50%; background:var(--c); display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
  .stn{ border-radius:18px; padding:10px 8px 8px; background:var(--blue-tint); border:4px solid var(--blue); }
  .stn.lg{ background:var(--green-tint); border-color:var(--green); }
  .stn .no{ display:inline-block; background:var(--blue); color:#fff; font-weight:900; font-size:.8rem; padding:2px 10px; border-radius:999px; }
  .stn.lg .no{ background:var(--green); }
  .stn .nm{ font-weight:900; font-size:clamp(1.5rem,7vw,2.2rem); line-height:1.9; overflow-wrap:anywhere; }
  .stn .nm.long{ font-size:clamp(1.05rem,5vw,1.5rem); }
  .tip{ font-weight:700; font-size:.9rem; line-height:1.55; color:var(--ink-soft); }
  .newst{ align-self:center; background:var(--atk); color:#fff; font-weight:900; font-size:.8rem; border-radius:999px; padding:3px 12px; transform:rotate(-3deg); }
  .fx{ border-radius:16px; padding:10px; background:var(--tint,#EEF2F5); color:var(--edge-deep,var(--ink)); font-weight:900; font-size:1.05rem; line-height:1.5; }
  .fx b{ display:block; font-size:2rem; line-height:1.2; }
  .big{
    border:none; border-radius:999px; padding:14px 22px; min-height:54px; font-weight:900; font-size:1.1rem;
    background:linear-gradient(180deg,var(--blue),var(--blue-deep)); color:#fff; box-shadow:0 5px 0 #00406A;
  }
  .big:active{ transform:translateY(3px); box-shadow:0 2px 0 #00406A; }
  .big.sub{ background:var(--paper-2); color:var(--ink); box-shadow:0 5px 0 #C5D6E2; }
  .big.amber{ background:linear-gradient(180deg,var(--amber),var(--amber-deep)); color:#2B1600; box-shadow:0 5px 0 #A86500; }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; } .btnrow > *{ flex:1 1 130px; }
  .qbig{ font-size:clamp(3rem,16vw,4.6rem); font-weight:900; line-height:1.2; color:var(--blue-deep); overflow-wrap:anywhere; }
  .qbig.wd{ font-size:clamp(2rem,10vw,3rem); } .qbig.st{ font-size:clamp(1.5rem,7.5vw,2.3rem); line-height:1.5; }
  .qq{ font-weight:900; font-size:1.05rem; }
  .qsub{ font-weight:800; font-size:.85rem; color:var(--atk); }
  .qch{ display:grid; gap:8px; grid-template-columns:1fr 1fr; }
  .qch.one{ grid-template-columns:1fr; }
  .qb{ min-height:58px; border-radius:16px; border:3px solid #D5E3EE; background:var(--paper-2); font-weight:900; font-size:1.15rem; padding:8px 6px; line-height:1.6; overflow-wrap:anywhere; }
  .qb:disabled{ cursor:default; }
  .qb.ok{ background:#CFF1DD; border-color:#2E9E5B; } .qb.ng{ background:#FBD9D3; border-color:var(--atk); }
  .qres{ font-weight:900; font-size:1.05rem; min-height:1.6em; }
  .rank{ display:flex; align-items:center; gap:10px; background:var(--paper-2); border-radius:16px; padding:8px 12px; text-align:left; font-weight:900; }
  .rank.w{ background:#FFF1CF; border:3px solid var(--amber); font-size:1.15rem; }
  .rank .md{ font-size:1.5rem; } .rank .av{ width:34px; height:34px; border-radius:50%; background:var(--c); display:flex; align-items:center; justify-content:center; }
  .rank small{ display:block; font-size:.7rem; color:var(--ink-soft); }
  .stgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:8px; }
  .stp{ aspect-ratio:1; border-radius:50%; border:3px dashed #C9D5DE; background:transparent; color:#9AA9B5; font-weight:900; font-size:.62rem; line-height:1.15; padding:3px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .stp b{ font-size:.72rem; }
  .stp.got{ border:4px double var(--blue); color:var(--blue-deep); background:var(--blue-tint); transform:rotate(-5deg); }
  .stp.got.lg{ border-color:var(--green); color:var(--green-deep); background:var(--green-tint); }
  .stp.sel{ box-shadow:0 0 0 4px var(--amber); }
  .help{ text-align:left; font-weight:700; font-size:.92rem; line-height:1.7; }
  .help h3{ margin:8px 0 2px; font-size:1rem; color:var(--blue-deep); }
  .help ul{ margin:0; padding-left:1.2em; }
  #toast{ position:fixed; left:50%; bottom:22%; transform:translateX(-50%); background:rgba(24,36,48,.92); color:#fff; font-weight:800; font-size:.95rem; padding:10px 18px; border-radius:16px; z-index:90; max-width:88vw; text-align:center; pointer-events:none; }
  .confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:95; }
  .confetti span{ position:absolute; top:-30px; animation:fall linear forwards; }

  /* ---------- タイトル ---------- */
  #title{ position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,#D9F0FC 0%,var(--paper) 46%); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 12px 28px; }
  .tw{ max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  #title h1{ margin:0; text-align:center; font-size:clamp(1.5rem,7vw,2.4rem); font-weight:900; color:var(--blue-deep); line-height:1.25; }
  #title h1 span{ display:inline-block; background:var(--amber); color:#2B1600; border-radius:12px; padding:0 10px; transform:rotate(-3deg); }
  .route{ text-align:center; font-weight:800; font-size:.86rem; color:var(--ink-soft); line-height:1.6; }
  .route b{ color:var(--blue-deep); } .route i{ font-style:normal; color:var(--green-deep); font-weight:900; }
  .hero{ width:100%; max-width:420px; align-self:center; display:block; }
  .box{ background:var(--card); border-radius:20px; padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; }
  .box h2{ margin:0; font-size:.95rem; color:var(--ink-soft); }
  .seg{ display:flex; gap:8px; }
  .seg button{ flex:1; min-height:56px; border-radius:16px; border:3px solid #D5E3EE; background:var(--paper-2); font-weight:900; font-size:.95rem; line-height:1.3; padding:6px; }
  .seg button small{ display:block; font-size:.68rem; color:var(--ink-soft); }
  .seg button[aria-pressed="true"]{ border-color:var(--blue); background:var(--blue-tint); color:var(--blue-deep); }
  .slot{ display:flex; align-items:center; gap:6px; }
  .slot .av{ flex:none; width:44px; height:44px; border-radius:50%; background:var(--c); display:flex; align-items:center; justify-content:center; font-size:1.4rem; box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); }
  .slot.off .av{ filter:grayscale(1); opacity:.4; }
  .slot button{ min-height:48px; border-radius:14px; border:3px solid #D5E3EE; background:var(--paper-2); font-weight:900; font-size:.9rem; padding:4px 2px; min-width:0; white-space:nowrap; }
  @media (max-width:480px){ .slot button{ font-size:.74rem; } .slot .av{ width:38px; height:38px; font-size:1.2rem; } }
  .slot .b-name{ flex:1.3; } .slot .b-type{ flex:1; } .slot .b-lv{ flex:1.25; }
  .slot button:disabled{ opacity:.45; cursor:default; }
  .note{ font-weight:700; font-size:.75rem; color:var(--ink-soft); line-height:1.5; }
  .stat{ text-align:center; font-weight:800; font-size:.85rem; color:var(--ink-soft); }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>

<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

  if(c === "rapid") extra = "つぎの かいそく えきは「" + ST[nextRapid(p.pos)].h + "」。";
  openSheet(h("div", {class:"mcard"},
    h("div", {class:"fx c-" + c, style:"--tint:var(--paper-2)"}, h("b", null, info.ic), info.nm),
    h("div", {class:"tip"}, info.ds + (extra ? " " + extra : "")),
    h("div", {class:"btnrow"},
      can ? h("button", {class:"big amber", onclick:function(){
        closeSheet();
        if(!pendingAction || G.players[G.turn] !== p || p.cards[s] !== c) return;
        var r = pendingAction; pendingAction = null; r({t:"card", i:s});
      }}, "つかう！") : null,
      h("button", {class:"big sub", onclick:closeSheet}, can ? "やめる" : "とじる"))));
}
diceBtn.addEventListener("click", function(){
  ac();
  if(!pendingAction) return;
  var r = pendingAction; pendingAction = null; r({t:"roll"});
});
function waitAction(){ return new Promise(function(res){ pendingAction = res; renderPanel(); }); }
function cpuAct(p){
  var i, lead = leaderAhead(p), toStop = (p.pos >= TRANSFER ? GOAL : TRANSFER) - p.pos;
  if((i = p.cards.indexOf("swap")) >= 0 && lead && lead.pos - p.pos >= 8) return {t:"card", i:i};
  if((i = p.cards.indexOf("rapid")) >= 0 && nextRapid(p.pos) - p.pos >= 4) return {t:"card", i:i};
  if((i = p.cards.indexOf("double")) >= 0 && toStop > 6) return {t:"card", i:i};
  return {t:"roll"};
}
async function rollDice(n){
  die2.hidden = n < 2;
  diceBtn.classList.add("rolling");
  var v = [1, 1];
  for(var t = 0; t < 11; t++){
    v = [1 + rnd(6), 1 + rnd(6)];
    drawDie(die1, v[0]); if(n > 1) drawDie(die2, v[1]);
    sfx.tick();
    await w(sleep(65));
  }
  if(FORCE.length){ v[0] = FORCE.shift(); drawDie(die1, v[0]); }
  diceBtn.classList.remove("rolling");
  sfx.land();
  await w(sleep(420));
  return v.slice(0, n);
}
async function moveSteps(p, n){
  var dir = n > 0 ? 1 : -1, left = Math.abs(n), k = 0, idx = G.players.indexOf(p), forced = false;
  while(left > 0){
    var np = p.pos + dir;
    if(np < G.start || np > GOAL) break;
    p.pos = np; left--; k++;
    placeTokens(); hop(idx); follow(np); sfx.step(k);
    await w(sleep(dir > 0 ? 270 : 210));
    if(dir > 0 && (np === GOAL || np === TRANSFER)){ forced = left > 0; break; }
  }
  renderPanel();
  return forced;
}
async function giveCard(p){
  if(p.cards.length >= 3){
    say("カードは 3まい まで。かわりに 1つ すすむ！");
    sfx.good();
    await w(sleep(900));
    await moveSteps(p, 1);
    return arrive(p, false);
  }
  var c = randomCard();
  p.cards.push(c);
  sfx.item(); renderPanel();
  say("🎁 " + p.name + "は「" + CARD[c].ic + " " + CARD[c].nm + "」を ゲット！");
  if(!isCpu(p)) toast(CARD[c].ic + " " + CARD[c].nm + "：" + CARD[c].ds);
  await w(sleep(1300));
  return false;
}
// えきに ついた あとの できごと。もどりち true = もう1かい サイコロ
async function arrive(p, effects, forced){
  var st = ST[p.pos], t = st.tile, isNew = !p.cpu && !AUTO && addStamp(p.pos);
  if(p.pos === GOAL){ finish(p); return false; }
  if(p.pos === TRANSFER){
    var bonus = !G.firstTr; G.firstTr = true;
    sfx.transfer();
    say("🔀 " + p.name + "は あざみの えきで のりかえ！");
    await w(stationCard(p, {isNew:isNew, cls:"k-t", icon:"🔀", title:"のりかえ！ でんえんとしせん へ",
      text:(forced ? "のりかえ えきは かならず とまるよ。" : "ぴったり とうちゃく！") + (bonus ? " いちばんのり ボーナスで カード 1まい！" : "")}));
    if(bonus) return giveCard(p);
    return false;
  }
  if(!effects){
    say(p.name + "は " + st.h + " えきに とうちゃく！");
    sfx.chime();
    await w(sleep(900));
    return false;
  }
  sfx.chime();
  if(t.t === "I"){
    await w(stationCard(p, {isNew:isNew, cls:"k-i", icon:"🎁", title:"カード マス！", text:"カードを 1まい もらえるよ。"}));
    return giveCard(p);
  }
  if(t.t === "C"){
    await w(stationCard(p, {isNew:isNew, cls:"k-c", icon:"🧠", title:"チャンス マス！", text:"クイズに せいかい すると、もう 1かい サイコロを ふれる！", btn:"クイズに ちょうせん！"}));
    var ok = await w(quiz(p, {head:"🧠 チャンス クイズ！", sub:"せいかいで もう 1かい サイコロ！", color:"var(--chance)"}));
    if(ok){ say("🎉 せいかい！ " + p.name + "は もう 1かい サイコロを ふれる！"); sfx.good(); await w(sleep(900)); return true; }
    say("ざんねん… つぎ がんばろう！");
    await w(sleep(900));
    return false;
  }
  if(t.t === "E"){
    var ev = t.ev, good = !ev.z && ev.d > 0;
    var eff = ev.z ? "💤 1かい やすみ" : ev.d > 0 ? "⏩ " + ev.d + "つ すすむ！" : "🔙 " + (-ev.d) + "つ もどる";
    await w(stationCard(p, {isNew:isNew, cls:"k-e", icon:good ? "✨" : "😵", title:ev.m, text:eff}));
    if(good) sfx.good(); else sfx.bad();
    say(p.name + "：" + ev.m + " " + eff);
    if(ev.z){ p.skip = true; renderAll(); await w(sleep(1000)); return false; }
    await w(sleep(500));
    var f2 = await moveSteps(p, ev.d);
    return arrive(p, false, f2);
  }
  if(t.t === "A"){
    var others = G.players.filter(function(o){ return o !== p; }), target;
    await w(stationCard(p, {isNew:isNew, cls:"k-a", icon:"⚔️", title:"こうげき マス！", text:"あいてに クイズ！ まちがえたら " + atkLabel(t), btn:"こうげき かいし！"}));
    if(others.length === 1) target = others[0];
    else if(isCpu(p)) target = others.slice().sort(function(a, b){ return b.pos - a.pos; })[0];
    else target = await w(chooseTarget(p, others, t));
    say("⚔️ " + p.name + "の こうげき！ " + target.name + "に クイズ！");
    var def = await w(quiz(target, {head:"⚔️ " + p.name + "の こうげき！", sub:"まちがえると " + atkLabel(t), color:"var(--atk)"}));
    if(def){
      say("🎉 " + target.name + "は せいかい！ こうげきを ふせいだ！");
      await w(sleep(1000));
    } else if(target.cards.indexOf("shield") >= 0){
      target.cards.splice(target.cards.indexOf("shield"), 1);
      sfx.shield(); renderPanel();
      say("🛡️ " + target.name + "の バリア！ こうげきを はねかえした！");
      await w(sleep(1400));
    } else if(t.a === "skip"){
      target.skip = true; sfx.skip(); renderAll();
      say("💤 " + target.name + "は つぎ 1かい やすみ！");
      await w(sleep(1300));
    } else {
      sfx.attack();
      say("💥 " + target.name + "は " + t.n + "つ もどる！");
      await w(sleep(600));
      follow(target.pos);
      await moveSteps(target, -t.n);
      await w(sleep(500));
      follow(p.pos);
    }
    return false;
  }
  await w(stationCard(p, {isNew:isNew}));
  return false;
}
async function doSwap(p){
  var o = leaderAhead(p);
  if(!o) return;
  say("🔄 " + p.name + "と " + o.name + "の ばしょを いれかえ！");
  sfx.swap();
  var a = p.pos; p.pos = o.pos; o.pos = a;
  renderAll(); follow(p.pos);
  if(!p.cpu && !AUTO) addStamp(p.pos);
  await w(sleep(1500));
}
async function takeTurn(p){
  var cpu = isCpu(p), act, steps, v;
  say(p.emoji + " " + p.name + "の ばん！" + (cpu ? "" : " サイコロを ふってね"));
  die2.hidden = true;
  if(cpu){ await w(sleep(800)); act = cpuAct(p); }
  else act = await w(waitAction());
  renderPanel();
  if(act.t === "card"){
    var c = p.cards.splice(act.i, 1)[0];
    renderPanel();
    if(c === "swap"){ await doSwap(p); return false; }
    if(c === "rapid"){
      steps = nextRapid(p.pos) - p.pos;
      sfx.rapid();
      say("🎫 かいそく きっぷ！ " + ST[p.pos + steps].h + " まで いっきに すすむ！");
      await w(sleep(900));
    } else {
      say("🎲🎲 ダブル サイコロ！");
      v = await rollDice(2); steps = v[0] + v[1];
      say(v[0] + " と " + v[1] + " で… " + steps + " すすむ！");
      await w(sleep(500));
    }
  } else {
    v = await rollDice(1); steps = v[0];
    say(p.name + "は " + steps + " が でた！");
  }
  var forced = await moveSteps(p, steps);
  return arrive(p, true, forced);
}
async function gameLoop(){
  try{
    while(G && !G.over){
      var p = G.players[G.turn];
      snapshot(); renderAll(); follow(p.pos);
      if(p.skip){
        p.skip = false;
        say("💤 " + p.name + "は おやすみ… ばんを とばすよ");
        await w(sleep(1400));
        renderAll();
      } else {
        var again = true;
        while(again && !G.over){ again = await takeTurn(p); if(again){ renderAll(); } }
      }
      if(G.over) return;
      G.turn = (G.turn + 1) % G.players.length;
    }
  }catch(e){ if(e !== ABORT) throw e; }
}
function finish(p){
  G.over = true; pendingAction = null;
  S.game = null; S.plays++; S.wins[p.name] = (S.wins[p.name] || 0) + 1; save();
  renderAll(); stopBgm(); sfx.fanfare(); confetti();
  say("🎉 " + p.name + "が ちゅうおうりんかん えきに ゴール！");
  var rank = G.players.slice().sort(function(a, b){ return b.pos - a.pos; });
  var medals = ["🥇", "🥈", "🥉", "🎖️"];
  openModal(h("div", {class:"mcard"},
    h("div", {class:"mhead", style:"font-size:1.5rem"}, "🏁 ゴール！"),
    rank.map(function(r, i){
      return h("div", {class:"rank" + (i === 0 ? " w" : ""), style:"--c:" + r.color},
        h("span", {class:"md"}, medals[i]), h("span", {class:"av"}, r.emoji),
        h("span", null, r.name + (i === 0 ? " の かち！" : ""), h("small", null, i === 0 ? "ちゅうおうりんかん に とうちゃく" : ST[r.pos].h + "（あと " + (GOAL - r.pos) + "えき）")));
    }),
    h("div", {class:"tip"}, "📕 スタンプ " + Object.keys(S.stamps).length + " / " + ST.length + " えき"),
    h("div", {class:"btnrow"},
      h("button", {class:"big amber", onclick:function(){ startGame(null); }}, "もういちど！"),
      h("button", {class:"big sub", onclick:goTitle}, "タイトルへ"))));
}
function confetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var wrap = h("div", {class:"confetti"}), em = ["🎉", "🚃", "🚋", "🎊", "⭐"];
  for(var i = 0; i < 30; i++){
    wrap.append(h("span", {style:"left:" + rnd(100) + "vw;animation-duration:" + (2 + Math.random() * 1.8) + "s;animation-delay:" + (Math.random() * 0.6) + "s;font-size:" + (1 + Math.random() * 1.2) + "rem"}, em[rnd(em.length)]));
  }
  document.body.append(wrap);
  setTimeout(function(){ wrap.remove(); }, 4600);
}

function buildPlayers(){
  var list = [], robo = 0, nRobo = S.slots.filter(function(s){ return s.on === "c"; }).length;
  S.slots.forEach(function(s, i){
    if(s.on === "x") return;
    var cpu = s.on === "c";
    if(cpu) robo++;
    list.push({slot:i, name:cpu ? "ロボ" + (nRobo > 1 ? robo : "") : NAMES[s.name], cpu:cpu, lv:s.lv, pos:S.course, skip:false, cards:[]});
  });
  return list;
}
function startGame(saved){
  gen++; pendingAction = null; closeModal(); closeSheet();
  bags = {};
  if(saved){
    G = {start:saved.start === 19 ? 19 : 0, turn:saved.turn || 0, firstTr:!!saved.firstTr, over:false,
      players:saved.players.slice(0, 4).map(function(p){
        var st = saved.start === 19 ? 19 : 0;
        return {slot:p.slot & 3, name:String(p.name).slice(0, 12), cpu:!!p.cpu, lv:LV[p.lv] ? p.lv : 2,
          pos:Math.max(st, Math.min(GOAL - 1, p.pos | 0)), skip:!!p.skip,
          cards:(Array.isArray(p.cards) ? p.cards : []).filter(function(c){ return CARD[c]; }).slice(0, 3)};
      })};
    if(G.turn >= G.players.length) G.turn = 0;
  } else {
    G = {start:S.course, turn:0, firstTr:false, over:false, players:buildPlayers()};
  }
  G.players.forEach(function(p){ p.color = COLORS[p.slot]; p.emoji = p.cpu ? "🤖" : EMOJI[p.slot]; });
  SPD = S.fast ? 1.8 : 1;
  titleEl.hidden = true;
  drawDie(die1, 1); drawDie(die2, 1); die2.hidden = true;
  buildBoard(); renderAll(); follow(G.players[G.turn].pos, true);
  ac(); startBgm();
  gameLoop();
}
function goTitle(){
  gen++; pendingAction = null; closeModal(); closeSheet(); stopBgm();
  G = null;
  renderTitle(); titleEl.hidden = false; titleEl.scrollTop = 0;
}

/* ================= タイトル・シート ================= */
function renderTitle(){
  Array.prototype.forEach.call($("segCourse").children, function(b){ b.setAttribute("aria-pressed", String(+b.dataset.v === S.course)); });
  var box = $("slots"); box.textContent = "";
  var tLab = {h:"🙂 ひと", c:"🤖 ロボ", x:"💤 おやすみ"};
  S.slots.forEach(function(s, i){
    var off = s.on === "x", cpu = s.on === "c";
    box.append(h("div", {class:"slot" + (off ? " off" : ""), style:"--c:" + COLORS[i] + ";margin-bottom:6px"},
      h("div", {class:"av"}, cpu ? "🤖" : EMOJI[i]),
      h("button", {class:"b-name", disabled:off || cpu, "aria-label":"なまえを かえる", onclick:function(){
        var taken = S.slots.filter(function(o, k){ return k !== i && o.on === "h"; }).map(function(o){ return o.name; });
        do{ s.name = (s.name + 1) % NAMES.length; }while(taken.indexOf(s.name) >= 0);
        save(); renderTitle();
      }}, cpu ? "ロボ" : NAMES[s.name]),
      h("button", {class:"b-type", disabled:i === 0, "aria-label":"ひと・ロボを かえる", onclick:function(){
        var order = i === 1 ? ["h", "c"] : ["x", "h", "c"];
        s.on = order[(order.indexOf(s.on) + 1) % order.length];
        if(s.on === "h"){
          var taken = S.slots.filter(function(o, k){ return k !== i && o.on === "h"; }).map(function(o){ return o.name; });
          while(taken.indexOf(s.name) >= 0) s.name = (s.name + 1) % NAMES.length;
        }
        save(); renderTitle();
      }}, tLab[s.on]),
      h("button", {class:"b-lv", disabled:off || cpu, "aria-label":"クイズの むずかしさ", onclick:function(){ s.lv = s.lv % 3 + 1; save(); renderTitle(); }}, cpu || off ? "—" : LV[s.lv])));
  });
  $("bResume").hidden = !S.game;
  var wins = Object.keys(S.wins).map(function(k){ return k + " " + S.wins[k] + "しょう"; }).join("・");
  $("stat").textContent = "📕 スタンプ " + Object.keys(S.stamps).length + " / " + ST.length + " えき" + (S.plays ? "　🎲 " + S.plays + "かい あそんだ" : "") + (wins ? "　🏆 " + wins : "");
  syncButtons();
}
function syncButtons(){
  $("bSound").textContent = S.sound ? "🔊" : "🔇"; $("bSound").classList.toggle("off", !S.sound);
  $("bMusic").classList.toggle("off", !S.music);
  $("bFast").classList.toggle("off", !S.fast);
}
function stampSheet(){
  var detail = h("div", {class:"tip", style:"min-height:4.6em"}, "スタンプを タッチ すると、えきの まめちしきが みられるよ。");
  var grid = h("div", {class:"stgrid"});
  ST.forEach(function(st, i){
    var got = !!S.stamps[i];
    var b = h("button", {class:"stp" + (got ? " got" : "") + (st.lg ? " lg" : ""), onclick:function(){
      Array.prototype.forEach.call(grid.children, function(x){ x.classList.remove("sel"); });
      b.classList.add("sel");
      detail.textContent = "";
      if(got) detail.append(h("b", {style:"color:var(--ink);font-size:1.1rem"}, rubyName(st), " えき"), h("div", null, "💡 " + st.tip), h("div", null, "とまった かず：" + S.stamps[i] + "かい"));
      else detail.append(st.num + " は まだ とまって いないよ。すごろくで とまると スタンプが おされる！");
    }}, h("b", null, st.num), got ? st.h : "？");
    grid.append(b);
  });
  openSheet(h("div", {class:"mcard wide"},
    h("div", {class:"mhead"}, "📕 えきスタンプちょう（" + Object.keys(S.stamps).length + " / " + ST.length + "）"),
    detail, grid, h("button", {class:"big sub", onclick:closeSheet}, "とじる")));
}
function helpSheet(){
  var d = h("div", {class:"help"});
  d.innerHTML =
    "<h3>🎲 あそびかた</h3><ul><li>じゅんばんに サイコロを ふって、さきに <b>ちゅうおうりんかん</b> に ついた ひとの かち！</li>" +
    "<li><b>あざみの</b> は のりかえ えき。かならず とまるよ（いちばんのりは カードが もらえる）。</li></ul>" +
    "<h3>🟦 マスの しゅるい</h3><ul>" +
    "<li>⚔️ <b>こうげき</b>：あいてに クイズ。まちがえると マスに かいてある ぶんだけ もどる／1かい やすみ。</li>" +
    "<li>🧠 <b>チャンス</b>：じぶんが クイズ。せいかいで もう 1かい サイコロ。</li>" +
    "<li>🎁 <b>カード</b>：カードを 1まい（3まい まで）。</li>" +
    "<li>✨ <b>なにかな？</b>：えきの できごと。すすんだり もどったり。</li></ul>" +
    "<h3>🃏 カード</h3><ul>" +
    "<li>🎫 <b>かいそく きっぷ</b>：つぎの「かいそく」マークの えきまで いっきに すすむ。</li>" +
    "<li>🎲 <b>ダブル サイコロ</b>：サイコロ 2こ。</li>" +
    "<li>🛡️ <b>バリア</b>：こうげきを 1かい ふせぐ（じどう）。</li>" +
    "<li>🔄 <b>ばしょ いれかえ</b>：いちばん まえの ひとと いれかえ。</li></ul>" +
    "<h3>🔘 うえの ボタン</h3><ul><li>🏠 メニュー　⏩ はやおくり　📕 スタンプちょう　🎵 おんがく　🔊 おと</li></ul>";
  openSheet(h("div", {class:"mcard wide"}, h("div", {class:"mhead"}, "❓ あそびかた"), d, h("button", {class:"big sub", onclick:closeSheet}, "とじる")));
}
function homeSheet(){
  openSheet(h("div", {class:"mcard"},
    h("div", {class:"mhead"}, "🏠 メニュー"),
    h("div", {class:"tip"}, "タイトルに もどっても、「つづきから あそぶ」で この ばんの はじめから つづけられるよ。"),
    h("button", {class:"big", onclick:closeSheet}, "ゲームに もどる"),
    h("button", {class:"big sub", onclick:goTitle}, "タイトルに もどる")));
}

$("segCourse").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  S.course = +b.dataset.v; save(); renderTitle();
});
$("bStart").addEventListener("click", function(){ S.game = null; startGame(null); });
$("bResume").addEventListener("click", function(){ if(S.game) startGame(S.game); });
$("bStamp").addEventListener("click", stampSheet); $("bStamp2").addEventListener("click", stampSheet);
$("bHelp").addEventListener("click", helpSheet); $("bHelp2").addEventListener("click", helpSheet);
$("bHome").addEventListener("click", homeSheet);
$("bSound").addEventListener("click", function(){ S.sound = !S.sound; save(); syncButtons(); if(S.sound){ ac(); sfx.land(); } });
$("bMusic").addEventListener("click", function(){ S.music = !S.music; save(); syncButtons(); if(S.music) ac(); toast(S.music ? "🎵 おんがく オン" : "🎵 おんがく オフ"); });
$("bFast").addEventListener("click", function(){ S.fast = !S.fast; SPD = S.fast ? 1.8 : 1; save(); syncButtons(); toast(S.fast ? "⏩ はやおくり オン" : "⏩ はやおくり オフ"); });

if(window.ResizeObserver) new ResizeObserver(function(){ if(G) layout(); }).observe(wrapEl);
else window.addEventListener("resize", function(){ if(G) layout(); });

load();
drawDie(die1, 1); drawDie(die2, 1);
renderTitle();

if(location.hash === "#debug"){
  window.__sugo = {
    S:S, G:function(){ return G; },
    spd:function(v){ SPD = v; }, auto:function(v){ AUTO = !!v; if(AUTO && pendingAction){ var r = pendingAction; pendingAction = null; r({t:"roll"}); } },
    force:function(a){ FORCE = a.slice(); }, start:function(){ startGame(null); }
  };
}
})();
