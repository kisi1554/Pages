<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcf33">
<title>ルディと おしゃべり ｜ ことばが ふえる ねこ</title>
<meta name="description" content="ちょっと いじわるな きいろい ねこ ルディと おしゃべり するだけで、ことばが ふえていく アプリです。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">

<body>

        <g class="eye"><ellipse cx="152" cy="106" rx="14" ry="18" class="eye-w"/><ellipse cx="151" cy="108" rx="9" ry="13" class="iris"/><ellipse cx="151" cy="108" rx="4" ry="10" class="pupil"/><circle cx="147" cy="101" r="3.5" class="hl"/></g>

        <path d="M84 126 q-4 10 0 14 q4 -4 0 -14" class="tear"/>
      </g>
      <g class="eyes eyes-up">

      <g class="eyes eyes-shy"><path d="M76 104 q12 10 24 0 M140 104 q12 10 24 0" class="line"/></g>
      <g class="eyes eyes-sleepy"><path d="M76 108 h24 M140 108 h24" class="line"/></g>

        <circle cx="88" cy="106" r="17" class="eye-w"/><circle cx="88" cy="106" r="5" class="pupil"/>
        <circle cx="152" cy="106" r="17" class="eye-w"/><circle cx="152" cy="106" r="5" class="pupil"/>
      </g>
      <g class="eyes eyes-angry">
        <ellipse cx="88" cy="108" rx="14" ry="15" class="eye-w"/><ellipse cx="90" cy="110" rx="8" ry="10" class="iris"/><ellipse cx="90" cy="110" rx="3.5" ry="8" class="pupil"/>

      <g class="mouths">

      </g>
    </g>
    <!-- くびわ -->
    <g class="collar">
      <path d="M62 166 q58 28 116 0 l2 10 q-60 30 -120 0 Z" class="band"/>
      <circle cx="120" cy="188" r="10" class="bell"/>
      <path d="M113 188 h14 M120 190 v6" class="bell-line"/>
    </g>
    <!-- Zzz -->
    <g class="zzz"><text x="186" y="58">z</text><text x="200" y="40">z</text><text x="214" y="22">Z</text></g>
  </svg>
</template>

<div id="app">

  <!-- ======================= はじめの がめん ======================= -->
  <section class="screen is-active" id="screen-start">
    <div class="start-wrap">
      <div class="start-rudy" id="start-rudy"></div>
      <h1 class="start-title">ルディと<br>おしゃべり</h1>
      <p class="start-sub">ちょっと いじわるな きいろい ねこ。<br>はなすだけで ことばが ふえるよ</p>

      <label class="field">
        <span>きみの なまえ(いれないと「あお」に なるよ)</span>
        <input id="in-name" type="text" maxlength="8" placeholder="ひらがなで OK" autocomplete="off">
      </label>

      <div class="field">
        <span>ことばの むずかしさ</span>
        <div class="seg" id="seg-level">
          <button type="button" data-level="1">やさしい</button>
          <button type="button" data-level="2">ふつう</button>
          <button type="button" data-level="3">むずかしい</button>
        </div>
      </div>

      <button type="button" class="btn-big" id="btn-start">🐾 はなしに いく</button>

      <p class="start-note">
        おうちのかたへ: 会話は すべて この端末の ブラウザの中で つくっています。
        インターネットには なにも おくりません。
      </p>
    </div>
  </section>

  <!-- ======================= おしゃべり ======================= -->
  <section class="screen" id="screen-talk">
    <header class="bar">
      <button type="button" class="icon-btn" id="btn-home" aria-label="はじめの がめん">🏠</button>
      <div class="bar-title">
        <strong>ルディ</strong>
        <span class="rank" id="rank-badge">🐱 こねこ</span>
      </div>
      <div class="bar-right">
        <button type="button" class="icon-btn" id="btn-book" aria-label="ことばちょう">📕<span class="badge" id="book-count">0</span></button>
        <button type="button" class="icon-btn" id="btn-sound" aria-label="おと オン/オフ">🔊</button>
      </div>
    </header>

    <div class="talk">
      <div class="stage">
        <div class="rudy-box" id="rudy-box" role="button" tabindex="0" aria-label="ルディを タップ"></div>
        <div class="mitome" id="mitome" aria-label="ルディの みとめど">
          <span class="mitome-label">みとめど</span>
          <span class="fish" id="fish"></span>
        </div>
      </div>

      <div class="side">
        <div class="log" id="log" aria-live="polite"></div>
        <div class="choices" id="choices"></div>
        <div class="chips" id="chips"></div>
        <form class="inputbar" id="form" autocomplete="off">
          <button type="button" class="mic" id="btn-mic" aria-label="こえで はなす">🎤</button>
          <input id="in-text" type="text" placeholder="ルディに はなしかけよう" enterkeyhint="send">
          <button type="submit" class="send" aria-label="おくる">➤</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ======================= ことばちょう ======================= -->
  <div class="modal" id="modal-book" hidden>
    <div class="sheet">
      <header class="sheet-head">
        <h2>📕 ことばちょう</h2>
        <button type="button" class="close" data-close aria-label="とじる">✕</button>
      </header>
      <div class="book-rank" id="book-rank"></div>
      <p class="legend">🐾 であった　⭐ いみが わかった　👑 じぶんで つかえた</p>
      <div class="book-list" id="book-list"></div>
      <div class="book-foot">
        <span>むずかしさ</span>
        <div class="seg seg-small" id="seg-level2">
          <button type="button" data-level="1">やさしい</button>
          <button type="button" data-level="2">ふつう</button>
          <button type="button" data-level="3">むずかしい</button>
        </div>
      </div>
      <button type="button" class="reset" id="btn-reset">きろくを ぜんぶ けす</button>
    </div>
  </div>

  <!-- ======================= ことばカード ======================= -->
  <div class="modal" id="modal-word" hidden>
    <div class="sheet sheet-word">
      <header class="sheet-head">
        <span class="word-status" id="word-status"></span>
        <button type="button" class="close" data-close aria-label="とじる">✕</button>
      </header>
      <div class="word-big" id="word-big"></div>
      <p class="word-mean" id="word-mean"></p>
      <p class="word-ex" id="word-ex"></p>
      <button type="button" class="btn-big btn-read" id="btn-read">🔊 よんで</button>
    </div>
  </div>
</div>

</body>
</html>
