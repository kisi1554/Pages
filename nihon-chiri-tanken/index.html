<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12406b">
<title>日本地理たんけん</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ========================= タイトル ========================= -->
  <section class="screen is-active" id="sc-title">
    <div class="hero">
      <h1 class="hero-title">日本地理<span>たんけん</span></h1>
      <p class="hero-sub">47の 都道府県を しらべて、カードを あつめよう</p>
      <div class="hero-stat" id="heroStat"></div>
    </div>
    <div class="scroll">
      <div class="buddy-head">🚃 たんけんの あいぼう <span>タップで えらべるよ</span></div>
      <div class="buddy-strip" id="buddyStrip"></div>
      <div class="buddy-say" id="buddySay"></div>
      <div class="menu-grid" id="menuGrid"></div>
      <div class="menu-row">
        <button class="btn btn-sub" data-go="zukan">📔 47けん<span class="rt-inline">図鑑</span></button>
        <button class="btn btn-sub" data-go="map">🗺️ ちずをみる</button>
        <button class="btn btn-sub" data-go="settings">⚙️ せってい</button>
      </div>
      <p class="credit">都道府県の 形は 国土数値情報(国土交通省)の 行政区域データを もとに つくっています。</p>
    </div>
  </section>

  <!-- ========================= クイズ ========================= -->
  <section class="screen" id="sc-quiz">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title" id="quizTitle">クイズ</div>
      <div class="bar-right" id="quizScore"></div>
    </header>

    <div class="qbox">
      <div class="qbox-char" id="qChar"></div>
      <div class="qbox-text" id="qText"></div>
      <button class="speak-btn" id="qSpeak" title="よみあげ">🔊</button>
    </div>

    <div class="mapwrap" id="quizMapWrap">
      <div class="map-tools">
        <button class="tool-btn" data-zoom="in">＋</button>
        <button class="tool-btn" data-zoom="out">－</button>
        <button class="tool-btn" data-zoom="reset">⤢</button>
      </div>
      <div class="char-pop" id="charPop"></div>
    </div>

    <div class="answers" id="answers"></div>

    <footer class="qfoot">
      <button class="btn btn-hint" id="btnHint">ヒント 💡</button>
      <button class="btn btn-skip" id="btnSkip">とばす ⏭</button>
      <button class="btn btn-next" id="btnNext">つぎへ ▶</button>
    </footer>

    <div class="judge" id="judge"></div>
  </section>

  <!-- ========================= 図鑑 ========================= -->
  <section class="screen" id="sc-zukan">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title">47けん<ruby>図鑑<rt>ずかん</rt></ruby></div>
      <div class="bar-right" id="zukanCount"></div>
    </header>
    <div class="scroll" id="zukanBody"></div>
  </section>

  <!-- ========================= ちずをみる ========================= -->
  <section class="screen" id="sc-map">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title">ちずをみる</div>
      <div class="bar-right"></div>
    </header>

    <div class="layerbar" id="layerBar"></div>

    <div class="mapwrap" id="browseMapWrap">
      <div class="map-tools">
        <button class="tool-btn" data-zoom="in">＋</button>
        <button class="tool-btn" data-zoom="out">－</button>
        <button class="tool-btn" data-zoom="reset">⤢</button>
      </div>
    </div>

    <div class="infobar" id="infoBar">
      <span class="infobar-hint">県や 地形を タップすると せつめいが 出ます</span>
    </div>
  </section>

  <!-- ========================= せってい ========================= -->
  <section class="screen" id="sc-settings">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title">せってい</div>
      <div class="bar-right"></div>
    </header>
    <div class="scroll" id="settingsBody"></div>
  </section>

  <!-- 県カード(モーダル) -->
  <div class="modal" id="cardModal">
    <div class="modal-inner" id="cardBody"></div>
  </div>

</div>

<script src="map-data.js"></script>
<script src="data.js"></script>
<script src="characters.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
