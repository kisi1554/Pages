<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12406b">
<title>日本地理たんけん</title>
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<div id="app">

  <!-- ========================= タイトル ========================= -->
  <section class="screen is-active" id="sc-title">
    <div class="hero">
      <h1 class="hero-title">日本地理<span>たんけん</span></h1>
      <p class="hero-sub">47の 都道府県を しらべて、カードを あつめよう</p>
      <div class="hero-stat" id="heroStat"></div>
    </div>
    <div class="scroll">
      <div class="buddy-head">🚃 たんけんの あいぼう <span>タップで えらべるよ</span></div>
      <div class="buddy-strip" id="buddyStrip"></div>
      <div class="buddy-say" id="buddySay"></div>
      <div class="menu-grid" id="menuGrid"></div>
      <div class="menu-row">
        <button class="btn btn-sub" data-go="zukan">📔 47けん<span class="rt-inline">図鑑</span></button>
        <button class="btn btn-sub" data-go="map">🗺️ ちずをみる</button>
        <button class="btn btn-sub" data-go="settings">⚙️ せってい</button>
      </div>
      <p class="credit">都道府県の 形は 国土数値情報(国土交通省)の 行政区域データを もとに つくっています。</p>
    </div>
  </section>

  <!-- ========================= クイズ ========================= -->
  <section class="screen" id="sc-quiz">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title" id="quizTitle">クイズ</div>
      <div class="bar-right" id="quizScore"></div>
    </header>

    <div class="qbox">
      <div class="qbox-char" id="qChar"></div>
      <div class="qbox-text" id="qText"></div>
      <button class="speak-btn" id="qSpeak" title="よみあげ">🔊</button>
    </div>

    <div class="mapwrap" id="quizMapWrap">
      <div class="map-tools">
        <button class="tool-btn" data-zoom="in">＋</button>
        <button class="tool-btn" data-zoom="out">－</button>
        <button class="tool-btn" data-zoom="reset">⤢</button>
      </div>
      <div class="char-pop" id="charPop"></div>
    </div>

    <div class="answers" id="answers"></div>

    <footer class="qfoot">
      <button class="btn btn-hint" id="btnHint">ヒント 💡</button>
      <button class="btn btn-skip" id="btnSkip">とばす ⏭</button>
      <button class="btn btn-next" id="btnNext">つぎへ ▶</button>
    </footer>

    <div class="judge" id="judge"></div>
  </section>

  <!-- ========================= 図鑑 ========================= -->
  <section class="screen" id="sc-zukan">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title">47けん<ruby>図鑑<rt>ずかん</rt></ruby></div>
      <div class="bar-right" id="zukanCount"></div>
    </header>
    <div class="scroll" id="zukanBody"></div>
  </section>

  <!-- ========================= ちずをみる ========================= -->
  <section class="screen" id="sc-map">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title">ちずをみる</div>
      <div class="bar-right"></div>
    </header>

    <div class="layerbar" id="layerBar"></div>

    <div class="mapwrap" id="browseMapWrap">
      <div class="map-tools">
        <button class="tool-btn" data-zoom="in">＋</button>
        <button class="tool-btn" data-zoom="out">－</button>
        <button class="tool-btn" data-zoom="reset">⤢</button>
      </div>
    </div>

    <div class="infobar" id="infoBar">
      <span class="infobar-hint">県や 地形を タップすると せつめいが 出ます</span>
    </div>
  </section>

  <!-- ========================= せってい ========================= -->
  <section class="screen" id="sc-settings">
    <header class="bar">
      <button class="icon-btn" data-back="title">◀</button>
      <div class="bar-title">せってい</div>
      <div class="bar-right"></div>
    </header>
    <div class="scroll" id="settingsBody"></div>
  </section>

  <!-- 県カード(モーダル) -->
  <div class="modal" id="cardModal">
    <div class="modal-inner" id="cardBody"></div>
  </div>

</div>

<script src="map-data.js?v=4c5eb3f"></script>
<script src="data.js?v=4c5eb3f"></script>
<script src="characters.js?v=4c5eb3f"></script>
<script src="audio.js?v=4c5eb3f"></script>
<script src="game.js?v=4c5eb3f"></script>
</body>
</html>
