<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東急線すごろく</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>🚃 東急線すごろく 🚃</h1>
  <p class="subtitle">渋谷から新横浜まで、東急線の駅をめぐる旅へ出発!クイズにも挑戦しよう。</p>
</header>

<!-- 設定画面 -->
<section id="setup-screen" class="screen">
  <h2>プレイヤー人数を選んでね</h2>
  <div id="player-count-buttons" class="button-row"></div>

  <div id="player-form" class="hidden">
    <h2>プレイヤー情報</h2>
    <div id="player-inputs"></div>
    <button id="start-game-btn" class="primary-btn">すごろくスタート!</button>
  </div>
</section>

<!-- ゲーム画面 -->
<section id="game-screen" class="screen hidden">
  <div class="game-layout">
    <div id="board" class="board"></div>

    <aside class="side-panel">
      <div id="turn-indicator" class="turn-indicator"></div>

      <button id="dice-btn" class="primary-btn">🎲 さいころをふる</button>
      <div id="dice-result" class="dice-result"></div>

      <h3>プレイヤー</h3>
      <ul id="player-status" class="player-status"></ul>

      <h3>できごとログ</h3>
      <ul id="log-list" class="log-list"></ul>

      <button id="restart-btn" class="secondary-btn">最初からやり直す</button>
    </aside>
  </div>
</section>

<!-- モーダル(マスの効果・クイズ表示) -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div id="modal-choices" class="modal-choices"></div>
    <p id="modal-note" class="modal-note hidden"></p>
    <button id="modal-ok-btn" class="primary-btn hidden">OK</button>
  </div>
</div>

<!-- ゴール画面 -->
<div id="victory-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h3>🎉 ゴール! 🎉</h3>
    <p id="victory-body"></p>
    <ol id="ranking-list" class="ranking-list"></ol>
    <button id="play-again-btn" class="primary-btn">もう一度遊ぶ</button>
  </div>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
