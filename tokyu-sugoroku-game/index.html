<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>東急線すごろく</title>
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="app-header">
  <h1>🚃 東急線すごろく 🚃</h1>
  <p class="subtitle">渋谷から新横浜まで、東急線の駅をめぐる旅へ出発!クイズにも挑戦しよう。</p>
</header>

<!-- 設定画面 -->
<section id="setup-screen" class="screen">
  <h2>プレイヤー人数を選んでね</h2>
  <div id="player-count-buttons" class="button-row"></div>

  <div id="player-form" class="hidden">
    <h2>プレイヤー情報</h2>
    <div id="player-inputs"></div>
    <button id="start-game-btn" class="primary-btn">すごろくスタート!</button>
  </div>
</section>

<!-- ゲーム画面 -->
<section id="game-screen" class="screen hidden">
  <div class="game-layout">
    <div id="board" class="board"></div>

    <aside class="side-panel">
      <div id="turn-indicator" class="turn-indicator"></div>

      <button id="dice-btn" class="primary-btn">🎲 さいころをふる</button>
      <div id="dice-result" class="dice-result"></div>

      <h3>プレイヤー</h3>
      <ul id="player-status" class="player-status"></ul>

      <h3>できごとログ</h3>
      <ul id="log-list" class="log-list"></ul>

      <button id="restart-btn" class="secondary-btn">最初からやり直す</button>
    </aside>
  </div>
</section>

<!-- モーダル(マスの効果・クイズ表示) -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div id="modal-choices" class="modal-choices"></div>
    <p id="modal-note" class="modal-note hidden"></p>
    <button id="modal-ok-btn" class="primary-btn hidden">OK</button>
  </div>
</div>

<!-- ゴール画面 -->
<div id="victory-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h3>🎉 ゴール! 🎉</h3>
    <p id="victory-body"></p>
    <ol id="ranking-list" class="ranking-list"></ol>
    <button id="play-again-btn" class="primary-btn">もう一度遊ぶ</button>
  </div>
</div>

<script src="data.js?v=4c5eb3f"></script>
<script src="game.js?v=4c5eb3f"></script>
</body>
</html>
