<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いろまぜ ラボ</title>
<meta name="description" content="えのぐを まぜて たのまれた いろを つくろう">
<meta name="theme-color" content="#c2410c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<link rel="stylesheet" href="style.css?v=39a98df">
</head>
<body>

<header class="top">
  <button id="backBtn" class="pill round" type="button" aria-label="もどる" hidden>←</button>
  <h1 class="title" id="title">🎨 いろまぜ ラボ</h1>
  <span id="starsTotal" class="stars-total" hidden></span>
  <button id="soundBtn" class="pill round" type="button" aria-label="おと" aria-pressed="true">🔊</button>
</header>

<!-- ========== メニュー ========== -->
<main id="vMenu" class="view scroll">
  <div class="wrap">
    <p class="lead">えのぐを まぜると どんな いろに なるかな？</p>
    <div class="menu-grid">
      <button class="menu-card" type="button" data-go="stages" style="--c:#c2410c">
        <span class="em">🐰</span><b>おきゃくさん</b><small>たのまれた いろを つくろう</small>
      </button>
      <button class="menu-card" type="button" data-go="free" style="--c:#7c3aed">
        <span class="em">🧪</span><b>じゆうに まぜる</b><small>いろ ずかんに のこそう</small>
      </button>
      <button class="menu-card" type="button" data-go="nurie" style="--c:#0f766e">
        <span class="em">🖍️</span><b>ぬりえ</b><small>ずかんの いろで ぬろう</small>
      </button>
      <button class="menu-card" type="button" data-go="light" style="--c:#1d4ed8">
        <span class="em">🔦</span><b>ひかりの いろ</b><small>おまけ</small>
      </button>
      <button class="menu-card" type="button" data-go="zukan" style="--c:#b45309">
        <span class="em">📖</span><b>いろ ずかん</b><small>つくった いろを みる</small>
      </button>
    </div>
  </div>
</main>

<!-- ========== ステージ えらび ========== -->
<main id="vStages" class="view scroll" hidden>
  <div class="wrap">
    <p class="lead">おきゃくさんを えらんでね</p>
    <div id="stageGrid" class="stage-grid"></div>
  </div>
</main>

<!-- ========== ラボ（おきゃくさん / じゆう） ========== -->
<main id="vLab" class="view lab" hidden>
  <div class="lab-a">
    <div id="order" class="order">
      <span id="animal" class="animal" aria-hidden="true">🐰</span>
      <div class="bubble">
        <span id="orderText" class="order-text">この いろを つくって！</span>
        <span class="sample-row"><span id="sample" class="sample"></span><b id="sampleName"></b></span>
      </div>
    </div>
    <div id="freeTop" class="free-top" hidden>
      <span class="now-chip"><span id="nowSwatch" class="sample small"></span><b id="nowHex">からっぽ</b></span>
      <button id="saveBtn" class="act save" type="button">📖 ずかんに のこす</button>
    </div>

    <div class="plate-wrap">
      <div id="plate" class="plate" role="img" aria-label="おさら">
        <div id="mixLayer" class="mix-layer"></div>
        <div id="blobs" class="blobs"></div>
        <div id="plateMsg" class="plate-msg">えのぐを いれてね</div>
      </div>
    </div>
    <div id="dots" class="dots" aria-label="いれた てきすう"></div>
  </div>

  <div class="lab-b">
    <div id="tubes" class="tubes"></div>
    <div class="actions">
      <button id="undoBtn" class="act sq" type="button" aria-label="ひとつ もどす">↩<small>もどす</small></button>
      <button id="washBtn" class="act sq" type="button" aria-label="あらう">🗑<small>あらう</small></button>
      <button id="mixBtn" class="act mix" type="button">🌀 まぜる</button>
      <button id="doneBtn" class="act done" type="button">✨ できた！</button>
    </div>
    <p id="hintText" class="hint" aria-live="polite"></p>
  </div>
</main>

<!-- ========== いろ ずかん ========== -->
<main id="vZukan" class="view scroll" hidden>
  <div class="wrap">
    <p class="lead">いろ ずかん <span id="zukanCount"></span></p>
    <div id="zukanGrid" class="zukan-grid"></div>
    <p id="zukanEmpty" class="empty" hidden>まだ ないよ。「じゆうに まぜる」で つくって のこそう！</p>
  </div>
</main>

<!-- ========== ぬりえ ========== -->
<main id="vNurie" class="view nurie" hidden>
  <div class="nurie-tabs" id="nurieTabs"></div>
  <div class="nurie-body">
    <div class="canvas-wrap"><svg id="nurieSvg" viewBox="0 0 400 300" aria-label="ぬりえ"></svg></div>
    <div class="nurie-side">
      <div id="palette" class="palette"></div>
      <p class="tip">いろを えらんで えを タップ！</p>
      <button id="nurieClear" class="act sq wide" type="button">🧽 ぜんぶ けす</button>
    </div>
  </div>
</main>

<!-- ========== ひかりの いろ ========== -->
<main id="vLight" class="view light" hidden>
  <div class="light-body">
    <canvas id="lightCanvas" width="600" height="460" aria-label="ひかりの いろ"></canvas>
    <div class="light-side">
      <div class="light-btns" id="lightBtns"></div>
      <p class="light-note">
        <b>ひかり</b>は かさねると <b>あかるく</b> なって、3つ ぜんぶで <b class="w">しろ</b>！<br>
        <b>えのぐ</b>は まぜると ひかりを すいとって <b>くらく</b> なるよ。
      </p>
      <p class="tip">まるを ゆびで うごかして みよう</p>
    </div>
  </div>
</main>

<!-- ========== けっか ========== -->
<div id="result" class="modal" hidden>
  <div class="sheet">
    <div id="resAnimal" class="res-animal"></div>
    <div class="cmp">
      <div><span id="resSample" class="sample big"></span><small>みほん</small></div>
      <div><span id="resMine" class="sample big"></span><small>きみの いろ</small></div>
    </div>
    <div id="resStars" class="res-stars"></div>
    <p id="resText" class="res-text"></p>
    <div class="sheet-btns">
      <button id="resRetry" class="act sq wide" type="button">🔁 もういちど</button>
      <button id="resNext" class="act done wide" type="button">つぎへ ▶</button>
    </div>
  </div>
</div>

<!-- ========== なまえ つけ ========== -->
<div id="nameModal" class="modal" hidden>
  <div class="sheet">
    <span id="nameSwatch" class="sample big"></span>
    <label class="name-label" for="nameInput">いろの なまえを つけよう</label>
    <input id="nameInput" class="name-input" type="text" maxlength="10" autocomplete="off">
    <div id="nameIdeas" class="name-ideas"></div>
    <p id="nameFull" class="hint" hidden>ずかんが いっぱい（12こ）。ずかんで ひとつ けしてから のこしてね。</p>
    <div class="sheet-btns">
      <button id="nameCancel" class="act sq wide" type="button">やめる</button>
      <button id="nameOk" class="act done wide" type="button">📖 のこす</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="color.js?v=39a98df"></script>
<script src="pictures.js?v=39a98df"></script>
<script src="app.js?v=39a98df"></script>
</body>
</html>
