<!DOCTYPE html>
<html lang="ja">
<head>

<title>よこはま のりかえ めいろ</title>
<style>
  :root {
    --bg: #eef7ff;
    --ink: #1f2a44;
    --sub: #5a6b8a;
    --mc: #1c7ed6;
    --mc2: #1864ab;
    --ok: #2f9e44;
    --ng: #e03131;
    --stamp: #e8590c;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }

  button { font: inherit; color: inherit; cursor: pointer; border: none; }
  ruby rt { font-size: .5em; font-weight: normal; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;

  .screen.on { display: flex; }
  .ibtn { min-width: 54px; height: 54px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow);
    font-size: 26px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; flex: none; }
  .ibtn:active, .big:active, .mcard:active, .route:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.16); }

  #title { overflow-y: auto; justify-content: flex-start; }
  #title > * { flex: none; }
  .tbar { width: 100%; max-width: 900px; display: flex; justify-content: flex-end; gap: 8px; }
  .logo { font-size: clamp(28px, 7.5vw, 48px); margin: 0; color: var(--mc2); text-align: center; letter-spacing: .04em;

  .lead { margin: 6px 0 4px; font-size: 18px; color: var(--sub); text-align: center; line-height: 1.8; max-width: 640px; }
  .hero { display: flex; align-items: flex-end; gap: 6px; margin: 4px 0 6px; }
  .hero svg { width: 92px; height: 92px; }
  .hero .tr { font-size: 46px; }
  .lvtabs { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
  .lvtab { padding: 10px 16px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
    font-size: 18px; font-weight: bold; color: var(--sub); border: 3px solid transparent; min-height: 52px; }
  .lvtab.on { border-color: var(--lc); color: var(--lc); }
  .lvnote { font-size: 16px; color: var(--sub); margin: 0 0 8px; text-align: center; }
  .mgrid { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px; padding-bottom: 20px; }
  .mcard { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 12px 14px;

  .pwrap { width: 100%; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;

  .bar { display: flex; align-items: center; gap: 8px; }
  .bar .sp { flex: 1; }
  .order { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 8px 12px; display: flex; gap: 10px;

  .count { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: bold; }
  .pill { background: var(--card); border-radius: 999px; box-shadow: var(--shadow); padding: 4px 14px; border: 3px solid var(--stamp);
    color: var(--stamp); white-space: nowrap; }

  .big { flex: 1; min-height: 56px; white-space: nowrap; border-radius: 18px; background: var(--card); box-shadow: var(--shadow);

  .big:disabled { opacity: .45; animation: none; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .routes { display: flex; gap: 8px; }
  .route { flex: 1; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 8px 10px;
    border: 4px solid transparent; text-align: left; min-height: 52px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .route.on { border-color: var(--rc); }
  .route .rn { font-size: 17px; font-weight: bold; color: var(--rc); }
  .route .chips { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .chip { display: inline-block; min-width: 26px; height: 14px; border-radius: 7px; }
  .chip.stamp { min-width: 0; height: auto; font-size: 14px; }

  /* 横持ち（タブレット）: 左に カード、右に ちず */
  @media (orientation: landscape) and (min-width: 700px) {
    .pwrap { grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;

    .side { overflow-y: auto; }
    #btns { flex-wrap: wrap; }
    #btns .big { flex: 1 1 140px; }
    .order .em { font-size: 40px; } .order .tx { font-size: 18px; }
    .routes { flex-direction: column; }
  }
  @media (orientation: landscape) and (max-height: 520px) {
    .order .em { font-size: 30px; }
    .order .tx { font-size: 16px; }

  /* ---- けっか ---- */
  .ov { position: fixed; inset: 0; background: rgba(20,30,50,.45); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 10; }
  .ov.on { display: flex; }
  .res { background: var(--card); border-radius: 26px; box-shadow: 0 8px 0 rgba(0,0,0,.2); padding: 16px 18px; width: min(520px, 100%);

  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .stars { font-size: 52px; letter-spacing: 6px; }
  .stars span { display: inline-block; animation: starIn .4s backwards; }
  .stars span.off { filter: grayscale(1); opacity: .3; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
  .rmsg { font-size: 22px; font-weight: bold; margin: 4px 0; line-height: 1.7; }
  .rsub { font-size: 17px; color: var(--sub); line-height: 1.8; }

  .rbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

// 駅の ならび → いちばん のりかえが すくない 線の わりあて
function assign(path) {
  const k = path.length - 1;
  if (k < 1) return { lines: [], transfers: [], throughs: [], count: 0 };
  const opts = []; for (let i = 0; i < k; i++) opts.push(linesBetween(path[i], path[i + 1]));
  const dp = [Object.fromEntries(opts[0].map(l => [l, { c: 0, p: null }]))];
  for (let i = 1; i < k; i++) {
    const row = {};
    for (const l2 of opts[i]) {
      let best = null;
      for (const l1 of opts[i - 1]) {
        const cost = dp[i - 1][l1].c + ((l1 === l2 || isThrough(path[i - 1], path[i], path[i + 1], l1, l2)) ? 0 : 1);
        if (!best || cost < best.c) best = { c: cost, p: l1 };
      }
      row[l2] = best;
    }
    dp.push(row);
  }
  let last = null;
  for (const l in dp[k - 1]) if (!last || dp[k - 1][l].c < dp[k - 1][last].c) last = l;
  const lines = new Array(k); lines[k - 1] = last;
  for (let i = k - 1; i > 0; i--) lines[i - 1] = dp[i][lines[i]].p;
  const transfers = [], throughs = [];
  for (let i = 1; i < k; i++) {
    if (lines[i] === lines[i - 1]) continue;
    if (isThrough(path[i - 1], path[i], path[i + 1], lines[i - 1], lines[i])) throughs.push(i); else transfers.push(i);
  }
  return { lines, transfers, throughs, count: transfers.length };
}

function bestRoute(from, to) {
  let best = null;
  const path = [from], seen = new Set([from]);
  (function dfs(s) {
    if (s === to) {
      const a = assign(path);
      if (!best || a.count < best.count || (a.count === best.count && path.length < best.path.length)) best = { count: a.count, path: path.slice() };
      return;
    }
    for (const n of neighbors(s)) if (!seen.has(n)) { seen.add(n); path.push(n); dfs(n); path.pop(); seen.delete(n); }
  })(from);
  return best;
}

  for (const id in ST) {
    const s = ST[id], [dx, dy, anc] = s.l;
    const t = el("text", { x: s.x + dx, y: s.y + dy, "font-size": 22, "font-weight": "bold", fill: "#1f2a44", "text-anchor": anc, class: "halo", "data-lb": id }, svg);
    t.textContent = s.r;
    if (s.k !== s.r) {
      const t2 = el("text", { x: s.x + dx, y: s.y + dy + 19, "font-size": 16, fill: "#5a6b8a", "text-anchor": anc, class: "halo" }, svg);
      t2.textContent = s.k;
    }
  }
  L_stamp = el("g", {}, svg);
  L_train = el("g", {}, svg);
}
// テキストの ふちどり
const st = document.createElement("style");
st.textContent = "#map .halo{paint-order:stroke;stroke:#fbfdff;stroke-width:6px;stroke-linejoin:round}";
document.head.appendChild(st);

/* ---------- ゲーム ---------- */
let M = null, path = [], busy = false, lvShown = 1, l3pick = 0, best = null;
const $ = id => document.getElementById(id);
function rb(id) { const s = ST[id]; return s.k === s.r ? s.k : "<ruby>" + s.k + "<rt>" + s.r + "</rt></ruby>"; }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

function buildTitle() {
  $("heroChar").innerHTML = charSVG("happy");
  const tabs = $("lvtabs"); tabs.innerHTML = "";
  for (const k of [1, 2, 3]) {
    const b = document.createElement("button"); b.className = "lvtab" + (k === lvShown ? " on" : "");
    b.style.setProperty("--lc", LV[k].c); b.innerHTML = LV[k].name + "<br><small>" + LV[k].sub + "</small>";
    b.onclick = () => { SFX.tap(); lvShown = k; buildTitle(); };
    tabs.appendChild(b);
  }
  $("lvnote").textContent = LV[lvShown].note;
  const g = $("mgrid"); g.innerHTML = "";
  for (const m of MISSIONS.filter(m => m.lv === lvShown)) {
    const n = save.stars[m.id] || 0;
    const b = document.createElement("button"); b.className = "mcard"; b.style.setProperty("--lc", LV[m.lv].c);
    b.innerHTML = '<span class="em">' + m.em + '</span><span><span class="mt">' + m.place + '</span><br>' +
      '<span class="ms">' + rb(m.from) + ' → ' + rb(m.to) + '</span><br><span class="st">' + "⭐".repeat(n) + '<span style="opacity:.25">' + "⭐".repeat(3 - n) + '</span></span></span>';
    b.onclick = () => { SFX.tap(); start(m); };
    g.appendChild(b);
  }
}

function start(m) {
  M = m; path = [m.from]; busy = false; l3pick = 0;
  best = bestRoute(m.from, m.to);
  show("play"); drawMap();
  $("oEm").textContent = m.em;
  $("oTx").innerHTML = m.place + "で " + m.ask + '<br><span class="fr">いまいる えき: ' + rb(m.from) + " ／ いきさき: " + rb(m.to) + "</span>";
  const isL3 = m.lv === 3;
  $("routes").hidden = !isL3;
  $("undo").hidden = isL3; $("clear").hidden = isL3;
  $("go").innerHTML = isL3 ? "👉 こっちに する！" : "🚃 しゅっぱつ！";
  if (isL3) {
    path = m.routes[0].slice();
    buildRoutes();
    say("🔴（のりかえ）が すくない みちは どっち？");
  } else {
    say("🙂 の えきから、ひかる えきを じゅんばんに なぞってね");
  }
  render();
  setTimeout(() => speak(plain(m.place) + "で、" + m.ask), 300);
}
function plain(html) { return html.replace(/<rt>.*?<\/rt>/g, "").replace(/<[^>]+>/g, ""); }
function kana(html) { return html.replace(/<ruby>.*?<rt>(.*?)<\/rt><\/ruby>/g, "$1").replace(/<[^>]+>/g, ""); }
function say(t) { $("say").textContent = t; }

function buildRoutes() {
  const box = $("routes"); box.innerHTML = "";
  const cols = ["#e8590c", "#2f9e44"], names = ["みち あ", "みち い"];
  M.routes.forEach((r, i) => {
    const a = assign(r);
    const b = document.createElement("button"); b.className = "route" + (i === l3pick ? " on" : "");
    b.style.setProperty("--rc", cols[i]);
    let chips = "";
    a.lines.forEach((l, j) => {
      if (j > 0 && a.lines[j - 1] !== l) chips += a.transfers.includes(j) ? '<span class="chip stamp">🔴</span>' : '<span class="chip stamp">➡️</span>';
      if (j === 0 || a.lines[j - 1] !== l) chips += '<span class="chip" style="background:' + LINES[l].c + '"></span>';
    });
    b.innerHTML = '<span class="rn">' + names[i] + '</span><span class="chips">' + chips + "</span>";
    b.onclick = () => { if (busy) return; SFX.tap(); l3pick = i; path = r.slice(); buildRoutes(); render(); };
    box.appendChild(b);
  });
}

function render() {
  const a = assign(path);
  L_path.innerHTML = ""; L_stamp.innerHTML = ""; L_nb.innerHTML = ""; L_hl.innerHTML = "";
  for (let i = 0; i + 1 < path.length; i++) {
    const [x1, y1, x2, y2] = segPts(path[i], path[i + 1], a.lines[i]);
    el("line", { x1, y1, x2, y2, stroke: "#fff", "stroke-width": 26, "stroke-linecap": "round", opacity: .95 }, L_path);
    el("line", { x1, y1, x2, y2, stroke: M.lv === 3 ? (l3pick ? "#2f9e44" : "#e8590c") : "#ffd43b", "stroke-width": 22, "stroke-linecap": "round", opacity: .55 }, L_path);
    el("line", { x1, y1, x2, y2, stroke: LINES[a.lines[i]].c, "stroke-width": 12, "stroke-linecap": "round" }, L_path);
  }
  for (const i of a.transfers) stampAt(path[i], false);
  for (const i of a.throughs) { const s = ST[path[i]]; const t = el("text", { x: s.x + 2, y: s.y - 22, "font-size": 15, "font-weight": "bold", fill: "#2f9e44", "text-anchor": "middle", class: "halo" }, L_stamp); t.textContent = "そのまま！"; }
  // スタート・ゴール
  const S = ST[M.from], G = ST[M.to];
  el("circle", { cx: S.x, cy: S.y, r: 24, fill: "#fff", stroke: "#1c7ed6", "stroke-width": 4 }, L_stamp);
  const sc = el("g", { transform: `translate(${S.x - 22},${S.y - 24})` }, L_stamp); sc.innerHTML = charSVG("normal").replace("<svg", '<svg width="44" height="44"');
  el("text", { x: G.x, y: G.y - 22, "font-size": 34, "text-anchor": "middle" }, L_stamp).textContent = "🏁";
  // つぎに いける 駅
  const end = path[path.length - 1];
  if (M.lv !== 3 && end !== M.to && !busy) {
    for (const n of neighbors(end)) if (!path.includes(n)) {
      const s = ST[n]; el("circle", { cx: s.x, cy: s.y, r: 22, fill: "#ffd43b", opacity: .7, class: "nbpulse" }, L_nb);
    }
  }
  $("tcount").textContent = a.count;
  const done = path[path.length - 1] === M.to;
  $("go").disabled = !(done || M.lv === 3) || busy;
  $("go").classList.toggle("ready", (done || M.lv === 3) && !busy);
  $("undo").disabled = path.length < 2 || busy; $("clear").disabled = path.length < 2 || busy;
  return a;
}
function stampAt(id, fx) {
  const s = ST[id];
  const g = el("g", { class: fx ? "stampfx" : "" }, L_stamp);
  el("circle", { cx: s.x + 24, cy: s.y + 22, r: 19, fill: "#fff", stroke: "#e8590c", "stroke-width": 3.5, opacity: .95 }, g);
  const t1 = el("text", { x: s.x + 24, y: s.y + 20, "font-size": 10.5, "font-weight": "bold", fill: "#e8590c", "text-anchor": "middle" }, g); t1.textContent = "のり";
  const t2 = el("text", { x: s.x + 24, y: s.y + 32, "font-size": 10.5, "font-weight": "bold", fill: "#e8590c", "text-anchor": "middle" }, g); t2.textContent = "かえ";
}

/* ---------- なぞる ---------- */
function svgPt(ev) {
  const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function nearest(pt, R = 44) {
  let bid = null, bd = R;
  for (const id in ST) { const d = Math.hypot(ST[id].x - pt.x, ST[id].y - pt.y); if (d < bd) { bd = d; bid = id; } }
  return bid;
}
let dragging = false;
function touchStation(id, tap) {
  if (!id || busy || !M || M.lv === 3) return;
  const end = path[path.length - 1];
  if (id === end) return;
  const before = assign(path).count;
  if (path.length > 1 && id === path[path.length - 2]) { path.pop(); SFX.back(); render(); return; }
  if (path.includes(id)) { if (tap) { path = path.slice(0, path.indexOf(id) + 1); SFX.back(); render(); } return; }
  if (end === M.to) { if (tap) say("もう ついてるよ。「しゅっぱつ！」を おしてね"); return; }
  if (!neighbors(end).includes(id)) { if (tap) { say("ひかって いる となりの えきから じゅんばんに すすもう"); SFX.ng(); } return; }
  path.push(id); SFX.step(path.length);
  const a = render();
  if (a.count > before) { SFX.stamp(); $("pill").classList.remove("bump"); void $("pill").offsetWidth; $("pill").classList.add("bump"); stampAt(path[a.transfers[a.transfers.length - 1]], true); say("ぽん！ ここで のりかえ"); }
  else if (id === M.to) { SFX.arrive(); say("ついた！「しゅっぱつ！」で でんしゃを はしらせよう"); }
  else say(ST[id].r + "（" + ST[id].k + "）");
}
svg.addEventListener("pointerdown", ev => { ev.preventDefault(); dragging = true; try { svg.setPointerCapture(ev.pointerId); } catch (e) {} touchStation(nearest(svgPt(ev)), true); });
svg.addEventListener("pointermove", ev => { if (!dragging) return; touchStation(nearest(svgPt(ev), 34), false); });
const endDrag = () => { dragging = false; };
svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);

$("undo").onclick = () => { if (busy || path.length < 2) return; path.pop(); SFX.back(); render(); };
$("clear").onclick = () => { if (busy) return; path = [M.from]; SFX.back(); render(); say("さいしょから。🙂 の えきから なぞってね"); };
$("back").onclick = () => { if (busy) return; SFX.tap(); try { speechSynthesis.cancel(); } catch (e) {} show("title"); buildTitle(); };
$("speak").onclick = () => { SFX.tap(); speak(kana(M.place) + "で、" + M.ask + "。いまいる えきは " + ST[M.from].r + "。いきさきは " + ST[M.to].r + "。"); };
$("hint").onclick = () => {
  if (busy) return; SFX.tap();
  if (M.lv === 3) { say("🔴 の スタンプを かぞえて みて。すくない ほうが らく だよ"); return; }
  const n = best.count;
  say(n === 0 ? "のりかえ なしで いけるよ。おなじ いろの せんを たどろう" : "のりかえ " + n + "かいで いけるよ");
  // いちばん よい みちを すこしだけ ひからせる
  const a = assign(best.path);
  for (let i = 0; i + 1 < best.path.length; i++) {
    const [x1, y1, x2, y2] = segPts(best.path[i], best.path[i + 1], a.lines[i]);
    el("line", { x1, y1, x2, y2, stroke: "#ffd43b", "stroke-width": 30, "stroke-linecap": "round", opacity: .5 }, L_hl);
  }
  setTimeout(() => { if (L_hl) L_hl.innerHTML = ""; }, 1800);
};

/* ---------- しゅっぱつ ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
function trainSVG(color) {
  return `<rect x="-26" y="-15" width="52" height="28" rx="9" fill="${color}" stroke="#1f2a44" stroke-width="2.5"/>` +
    `<rect x="-20" y="-10" width="11" height="9" rx="2" fill="#e7f5ff"/><rect x="-6" y="-10" width="11" height="9" rx="2" fill="#e7f5ff"/><rect x="8" y="-10" width="11" height="9" rx="2" fill="#e7f5ff"/>` +
    `<circle cx="-14" cy="15" r="4.5" fill="#1f2a44"/><circle cx="14" cy="15" r="4.5" fill="#1f2a44"/>`;
}
function animate(dur, fn) {
  return new Promise(res => {
    const t0 = performance.now();
    (function f(t) { const k = Math.min(1, (t - t0) / dur); fn(k); if (k < 1) requestAnimationFrame(f); else res(); })(t0);
  });
}
async function run() {
  if (busy) return;
  busy = true; const a = render();
  L_nb.innerHTML = "";
  const tr = el("g", {}, L_train);
  let made = 0;
  for (let i = 0; i + 1 < path.length; i++) {
    const lid = a.lines[i];
    if (i > 0 && a.transfers.includes(i)) {
      // のりかえ: はしって ホームを うつる
      const s = ST[path[i]]; tr.innerHTML = "";
      SFX.run(); say("のりかえ！ はしれ〜 🏃");
      const ru = el("g", {}, L_train); ru.innerHTML = charSVG("normal").replace("<svg", '<svg x="-20" y="-20" width="40" height="40"');
      await animate(1100, k => { const ang = k * Math.PI * 2; ru.setAttribute("transform", `translate(${s.x + Math.cos(ang) * 26},${s.y - 26 + Math.sin(ang) * 14 - Math.abs(Math.sin(k * Math.PI * 8)) * 8})`); });
      ru.remove(); stampAt(path[i], true); SFX.stamp(); await wait(350);
    } else if (i > 0 && a.throughs.includes(i)) {
      SFX.thru(); say("そのまま すすむよ（ちょくつう）");
    }
    tr.innerHTML = trainSVG(LINES[lid].c);
    const [x1, y1, x2, y2] = segPts(path[i], path[i + 1], lid);
    const g = gapsBetween(path[i], path[i + 1]);
    let lastStop = 0;
    await animate(650 + g * 260, k => {
      tr.setAttribute("transform", `translate(${x1 + (x2 - x1) * k},${y1 + (y2 - y1) * k})`);
      const stop = Math.floor(k * (g + 1)); if (stop > lastStop) { lastStop = stop; SFX.clack(); }
    });
    made++;
    if (i + 2 < path.length && !a.transfers.includes(i + 1)) say(ST[path[i + 1]].r);
  }
  SFX.arrive();
  await wait(500);
  tr.remove();
  result(a.count);
}
$("go").onclick = () => { if (!$("go").disabled) run(); };

/* ---------- けっか ---------- */
function result(cnt) {
  const opt = best.count;
  let stars, msg, sub;
  if (M.lv === 3) {
    const other = assign(M.routes[1 - l3pick]).count;
    const ok = cnt <= other;
    stars = ok ? 3 : 1;
    msg = ok ? "せいかい！ すくない ほうを えらべたね" : "ついたよ！ でも…";
    sub = "えらんだ みち: のりかえ " + cnt + "かい ／ もう1つの みち: のりかえ " + other + "かい" +
      (ok ? "" : "<br>もう1つの みちの ほうが のりかえが すくなかったよ。もういちど くらべて みよう");
    if (!ok) SFX.ng();
  } else {
    stars = cnt <= opt ? 3 : cnt === opt + 1 ? 2 : 1;
    msg = stars === 3 ? (opt === 0 ? "すごい！ のりかえ なしで ついた！" : "すごい！ いちばん すくない のりかえ！") : stars === 2 ? "ついたね！ おしい！" : "ついたね！ がんばった！";
    sub = "のりかえ " + cnt + "かい" + (stars === 3 ? "" : "<br>じつは のりかえ " + opt + "かいで いける みちが あるよ");
  }
  if (stars > (save.stars[M.id] || 0)) { save.stars[M.id] = stars; store(); }
  $("rStars").innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? "" : "off"}" style="animation-delay:${i * .18}s">⭐</span>`).join("");
  $("rMsg").textContent = msg; $("rSub").innerHTML = sub;
  if (stars === 3) SFX.fan();
  const idx = MISSIONS.indexOf(M);
  $("rNext").hidden = idx === MISSIONS.length - 1;
  $("omake").classList.remove("on");
  $("ov").classList.add("on");
  speak(msg);
  // わらいの おまけ（こたえあわせの あと）
  const transYoko = path.some((s, i) => s === "yokohama" && assign(path).transfers.includes(i));
  let mode = "happy", text = M.funny, cls = "", pile = "";
  if (cnt >= 2) { mode = "messy"; text = "はしりすぎて へとへと… かみのけが ぼさぼさ！"; cls = "wobble"; if (cnt >= 3) mode = "tired"; }
  else if (transYoko && Math.random() < .5) { mode = "normal"; text = "よこはまえきは ひろいね。おなじ ところを ぐるぐる… まいごに なりかけた！"; cls = "spin"; }
  else { pile = '<span class="pile">' + M.em.repeat(stars === 3 ? 8 : 4) + "</span>"; }
  setTimeout(() => {
    $("oChar").innerHTML = charSVG(mode); const sv = $("oChar").firstChild; if (cls) sv.classList.add(cls);
    $("oText").innerHTML = pile + text;
    $("omake").classList.add("on"); SFX.silly();
  }, 1300);
}
$("rRetry").onclick = () => { SFX.tap(); $("ov").classList.remove("on"); start(M); };
$("rNext").onclick = () => { SFX.tap(); $("ov").classList.remove("on"); const n = MISSIONS[MISSIONS.indexOf(M) + 1]; lvShown = n.lv; start(n); };
$("rMenu").onclick = () => { SFX.tap(); $("ov").classList.remove("on"); lvShown = M.lv; show("title"); buildTitle(); };

refreshSnd();
buildTitle();
</script>
</body>
</html>
