<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>はぐるま とけいだい</title>
<meta name="description" content="はぐるまを ならべて とまった とけいを うごかそう。むき・はやさ・2だん はぐるまで ちょうしんと たんしんを つくる パズル。">
<meta name="theme-color" content="#868e96">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link rel="stylesheet" href="style.css?v=887244e">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- タイトル -->
<section id="title" class="screen">
  <div class="titleBox">
    <svg class="tower" viewBox="0 0 200 260" aria-hidden="true">
      <path d="M100 8 L150 60 H50 Z" fill="#a33d3d"/>
      <rect x="56" y="60" width="88" height="190" rx="4" fill="#d9c7a7" stroke="#8a6d4b" stroke-width="3"/>
      <rect x="86" y="200" width="28" height="50" rx="14" fill="#6b4f33"/>
      <g id="titleBell" class="bellSwing"><path d="M92 26 Q100 14 108 26 L112 44 H88 Z" fill="#f2c94c" stroke="#b7892a" stroke-width="2"/><circle cx="100" cy="47" r="3" fill="#b7892a"/></g>
      <circle cx="100" cy="122" r="34" fill="#fffdf6" stroke="#6b4f33" stroke-width="5"/>
      <g stroke="#6b4f33" stroke-width="3" stroke-linecap="round">
        <line x1="100" y1="94" x2="100" y2="100"/><line x1="128" y1="122" x2="122" y2="122"/><line x1="100" y1="150" x2="100" y2="144"/><line x1="72" y1="122" x2="78" y2="122"/>
      </g>
      <line class="tHand tMin" x1="100" y1="122" x2="100" y2="98" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <line class="tHand tHour" x1="100" y1="122" x2="116" y2="122" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="122" r="4" fill="#333"/>
      <g class="titleGear g1"><circle cx="60" cy="190" r="22" fill="none" stroke="#868e96" stroke-width="9" stroke-dasharray="6 5"/></g>
      <g class="titleGear g2"><circle cx="140" cy="176" r="14" fill="none" stroke="#adb5bd" stroke-width="8" stroke-dasharray="5 4"/></g>
    </svg>
    <h1>はぐるま<br>とけいだい</h1>
    <p class="lead">まちの とけいだいが とまっちゃった！<br>はぐるまを ならべて、<br>とけいを うごかそう。</p>
    <button id="btnStart" class="big">はじめる ▶</button>
    <div class="titleFoot">
      <button class="btnSound pill" type="button" aria-label="おと">🔊 おと</button>
      <a class="pill" href="../">🏠 メニュー</a>
    </div>
  </div>
</section>

<!-- ステージ えらび -->
<section id="select" class="screen hidden">
  <header class="bar">
    <button id="btnSelBack" class="icon" aria-label="もどる">←</button>
    <div class="barTitle">ステージを えらぼう</div>
    <button class="btnSound icon" aria-label="おと">🔊</button>
  </header>
  <div id="chapters"></div>
</section>

<!-- あそぶ -->
<section id="play" class="screen hidden">
  <header class="bar">
    <button id="btnBack" class="icon" aria-label="ステージ えらび">←</button>
    <div class="barTitle" id="stTitle"></div>
    <button id="btnHint" class="icon" aria-label="ヒント">💡</button>
    <button id="btnReset" class="icon" aria-label="やりなおし">↺</button>
    <button class="btnSound icon" aria-label="おと">🔊</button>
  </header>
  <div class="playMain">
    <div class="goalBox">
      <svg id="face" viewBox="-62 -62 124 124" aria-hidden="true"></svg>
      <div class="goalTexts">
        <div id="goalText" class="goalText"></div>
        <div id="status" class="status"></div>
      </div>
    </div>
    <div class="boardWrap">
      <svg id="board" aria-label="はぐるまの ばん"></svg>
      <div id="toast" class="toast"></div>
    </div>
    <div id="shelf" class="shelf" aria-label="はぐるまの たな"></div>
    <div id="quizBox" class="quizBox hidden">
      <div id="quizText" class="quizText"></div>
      <div class="quizBtns">
        <button id="qMinus" class="pill" aria-label="5ふん もどす">↺5ふん</button>
        <button id="qPlus" class="pill" aria-label="5ふん すすめる">5ふん↻</button>
        <button id="qOk" class="pill okBtn">できた！</button>
      </div>
    </div>
    <div class="crankRow">
      <div id="crank" class="crank" role="button" aria-label="ハンドル（ぐるぐる なぞって まわす）">
        <svg viewBox="-50 -50 100 100" aria-hidden="true">
          <circle r="46" class="crankBase"/>
          <circle r="34" class="crankTrack"/>
          <g id="crankArm"><line x1="0" y1="0" x2="0" y2="-34" class="crankBar"/><circle cy="-34" r="11" class="crankKnob"/></g>
          <circle r="8" class="crankHub"/>
        </svg>
      </div>
      <div class="crankSide">
        <div class="crankHelp">ハンドルを ぐるぐる<br>みぎに なぞって まわす</div>
        <button id="btnGo" class="go">▶ まわす</button>
      </div>
    </div>
  </div>
  <div id="ghost" class="ghost hidden"></div>
</section>

<!-- エンディング -->
<section id="ending" class="screen hidden">
  <div class="endBox">
    <svg class="tower towerBig" viewBox="0 0 200 260" aria-hidden="true">
      <path d="M100 8 L150 60 H50 Z" fill="#a33d3d"/>
      <rect x="56" y="60" width="88" height="190" rx="4" fill="#d9c7a7" stroke="#8a6d4b" stroke-width="3"/>
      <rect x="86" y="200" width="28" height="50" rx="14" fill="#6b4f33"/>
      <g class="bellSwing ring"><path d="M92 26 Q100 14 108 26 L112 44 H88 Z" fill="#f2c94c" stroke="#b7892a" stroke-width="2"/><circle cx="100" cy="47" r="3" fill="#b7892a"/></g>
      <circle cx="100" cy="122" r="34" fill="#fffdf6" stroke="#6b4f33" stroke-width="5"/>
      <line x1="100" y1="122" x2="100" y2="94" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <line x1="100" y1="122" x2="100" y2="104" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="122" r="4" fill="#333"/>
    </svg>
    <div class="gong">ごーん… ごーん…</div>
    <h2>とけいだいが なおった！</h2>
    <p>まちの みんなが <ruby>大<rt>おお</rt></ruby>よろこび。<br>「これで まちあわせに おくれないね！」</p>
    <div class="people" aria-hidden="true"><span>🙌</span><span>🧒</span><span>👵</span><span>🐶</span><span>👨‍🍳</span><span>🎉</span></div>
    <button id="btnEndBack" class="big">ステージ えらびへ</button>
  </div>
</section>

<!-- まど（クリア・クイズ） -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalCard">
    <div id="mIcon" class="mIcon"></div>
    <h2 id="mTitle"></h2>
    <div id="mBody" class="mBody"></div>
    <div id="mBtns" class="mBtns"></div>
  </div>
</div>

<script src="stages.js?v=887244e"></script>
<script src="audio.js?v=887244e"></script>
<script src="app.js?v=887244e"></script>
</body>
</html>
