<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ほしくず ダンジョン</title>
<meta name="description" content="まいかい かたち が かわる ふしぎ な ちか めいきゅう で ほしくず あつめ。かわりばんこ の ぼうけん で、まもの の うごき を よんで よけたり、なかよく なったり しよう。">
<meta name="theme-color" content="#2b1d6b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>">
<link rel="stylesheet" href="style.css?v=b33eb55">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- タイトル -->
<section id="vTitle" class="view">
  <div class="tbox">
    <div class="sky" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span><span>⋆</span><span>✧</span><span>✦</span></div>
    <img id="tHero" class="thero" alt="">
    <h1>ほしくず<br>ダンジョン</h1>
    <p class="lead">よぞら から おちた ほしくず を あつめに、<br>まいかい かたち が かわる ちか めいきゅう へ！</p>
    <div class="tmons" id="tMons" aria-hidden="true"></div>
    <div class="tbtns">
      <button type="button" id="bNew" class="big primary">🌟 はじめる<span class="sub">あたらしい めいきゅう</span></button>
      <button type="button" id="bCont" class="big" hidden>▶️ つづきから<span class="sub"></span></button>
      <div class="row">
        <button type="button" id="bHelp" class="mid">❓ あそびかた</button>
        <button type="button" id="bZukan" class="mid">📖 ずかん</button>
      </div>
      <div class="row">
        <button type="button" class="mid bSnd">🔊</button>
        <button type="button" class="mid bBgm">🎵</button>
      </div>
    </div>
    <p class="rec" id="tRec"></p>
    <p class="back"><a href="../">← あそびメニュー</a></p>
  </div>
</section>

<!-- ゲーム -->
<section id="vGame" class="view" hidden>
  <header class="hud">
    <button type="button" id="bHome" class="hb" aria-label="タイトル へ">🏠</button>
    <div class="hinfo">
      <span id="hFloor" class="floor">ちか 1かい</span>
      <span id="hHearts" class="hearts">❤️❤️❤️</span>
      <span id="hStars" class="stars">⭐ 0</span>
      <span id="hLeft" class="remain">のこり ✨0</span>
    </div>
    <button type="button" id="bZukan2" class="hb" aria-label="ずかん">📖</button>
    <button type="button" id="bHelp2" class="hb" aria-label="あそびかた">❓</button>
    <button type="button" class="hb bSnd">🔊</button>
    <button type="button" class="hb bBgm">🎵</button>
  </header>
  <div id="stage">
    <canvas id="cv" aria-label="めいきゅう の がめん。スワイプ で すすむ、タップ で その マス へ、ながおし で まつ"></canvas>
    <canvas id="mini" aria-label="ちず（タップ で おおきく）"></canvas>
    <div id="toast" class="toast" hidden></div>
    <div id="banner" class="banner" hidden></div>
  </div>
  <p id="msg" class="msg" aria-live="polite"></p>
  <div class="ctrl">
    <div class="inv">
      <div id="bag" class="bag" aria-label="もちもの"></div>
      <div class="palrow"><div id="pals" class="pals" aria-label="なかま"></div><button type="button" id="bRock" class="rockbtn" hidden>🔄 いわ</button></div>
    </div>
    <div id="pad" class="pad">
      <button type="button" class="pb up" data-dir="up" aria-label="うえ">▲</button>
      <button type="button" class="pb left" data-dir="left" aria-label="ひだり">◀</button>
      <button type="button" class="pb wait" data-dir="wait" aria-label="まつ">まつ</button>
      <button type="button" class="pb right" data-dir="right" aria-label="みぎ">▶</button>
      <button type="button" class="pb down" data-dir="down" aria-label="した">▼</button>
    </div>
  </div>
</section>

<!-- クリア -->
<section id="vClear" class="view" hidden>
  <div class="tbox clear">
    <div class="fly" aria-hidden="true">🌠</div>
    <h1>そら へ かえった！</h1>
    <p class="lead">おおきな ながれぼし が よぞら に もどって、<br>きらきら ひかって いる よ。ありがとう！</p>
    <dl class="res">
      <div><dt>あつめた ほしくず</dt><dd>⭐ <span id="cStars">0</span></dd></div>
      <div><dt>なかよく なった まもの</dt><dd>💕 <span id="cFriends">0</span></dd></div>
      <div><dt>かかった て</dt><dd>👣 <span id="cTurns">0</span></dd></div>
      <div><dt>びっくり</dt><dd>😲 <span id="cBikkuri">0</span></dd></div>
    </dl>
    <p class="rec">めいきゅう の ばんごう <span id="cSeed"></span> ／ いちばん おおい ほしくず ⭐<span id="cBest"></span></p>
    <div class="tbtns">
      <button type="button" id="bAgain" class="big primary">🌟 もういちど（あたらしい めいきゅう）</button>
      <button type="button" id="bToTitle" class="mid">🏠 タイトル へ</button>
    </div>
  </div>
</section>

<div id="ovl" class="ovl" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button type="button" id="ovlClose" class="close" aria-label="とじる">✕</button>
    <div id="ovlBody"></div>
  </div>
</div>

<script src="dungeon.js?v=b33eb55"></script>
<script src="audio.js?v=b33eb55"></script>
<script src="app.js?v=b33eb55"></script>
</body>
</html>
