<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>しきの ことば</title>
<meta name="theme-color" content="#c2185b">
<link rel="stylesheet" href="style.css?v=0ff6f5f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- うえの バー（どの がめん でも おなじ） -->
<header class="bar">
  <button class="iconbtn" id="backBtn" aria-label="もどる" hidden>←</button>
  <h1 id="barTitle">しきの ことば</h1>
  <button class="iconbtn" id="voiceBtn" aria-label="よみあげ オン/オフ">🗣️</button>
  <button class="iconbtn" id="soundBtn" aria-label="おと オン/オフ">🔊</button>
</header>

<main>
  <!-- ======== メニュー ======== -->
  <section class="screen" id="home">
    <div class="hero">
      <div class="hero-art" aria-hidden="true">🌸🌻🍁⛄</div>
      <p class="hero-sub">はる なつ あき ふゆ の ことばを あつめて、<ruby>俳句<rt>はいく</rt></ruby>も つくろう</p>
    </div>
    <div class="menu">
      <button class="tile" data-go="box" style="--c:#e8590c">
        <span class="t-emo">📦</span><span class="t-name">きせつの はこ</span>
        <span class="t-star">★</span><span class="t-desc">ことばを 4つの はこに いれよう</span>
      </button>
      <button class="tile" data-go="karuta" style="--c:#c2185b">
        <span class="t-emo">🎴</span><span class="t-name">きせつ カルタ</span>
        <span class="t-star">★</span><span class="t-desc">よみふだを きいて えふだを とろう</span>
      </button>
      <button class="tile" data-go="quiz" style="--c:#5f3dc4">
        <span class="t-emo">📜</span><span class="t-name">はいくの きせつ</span>
        <span class="t-star">★★</span><span class="t-desc">くらし と はいく で きせつが ちがう？</span>
      </button>
      <button class="tile" data-go="haiku" style="--c:#2b8a3e">
        <span class="t-emo">✍️</span><span class="t-name">はいく を つくろう</span>
        <span class="t-star">★★</span><span class="t-desc">5・7・5 に ことばを はめよう</span>
      </button>
      <button class="tile wide" data-go="zukan" style="--c:#1971c2">
        <span class="t-emo">📖</span><span class="t-name">ことば ずかん</span>
        <span class="t-desc" id="zukanCount">であった ことば 0</span>
      </button>
    </div>
  </section>

  <!-- ======== きせつの はこ ======== -->
  <section class="screen" id="box" hidden>
    <div class="seg" id="boxRule" role="radiogroup" aria-label="きせつの きめかた">
      <button data-rule="life" class="on">くらしの きせつ</button>
      <button data-rule="kigo">はいくの きせつ</button>
    </div>
    <div class="box-play">
      <div class="box-top">
        <div class="progress" id="boxProg"></div>
        <p class="ask" id="boxAsk">どの きせつ の ことば かな？</p>
        <div class="card-slot" id="cardSlot"></div>
        <p class="feedback" id="boxFeed" aria-live="polite"></p>
      </div>
      <div class="boxes" id="boxes"></div>
    </div>
  </section>

  <!-- ======== きせつ カルタ ======== -->
  <section class="screen" id="karuta" hidden>
    <div class="setup" id="karutaSetup">
      <h2>きせつ カルタ</h2>
      <p>よみふだを きいて、その えふだを はやく タップ しよう。</p>
      <div class="opt"><span class="opt-l">きせつ</span>
        <div class="seg" id="kSeason">
          <button data-v="all" class="on">ぜんぶ</button><button data-v="h">はる</button><button data-v="n">なつ</button><button data-v="a">あき</button><button data-v="f">ふゆ</button>
        </div>
      </div>
      <div class="opt"><span class="opt-l">あいて</span>
        <div class="seg" id="kCpu">
          <button data-v="0" class="on">ひとりで</button><button data-v="1">🐢 ゆっくり</button><button data-v="2">🐇 はやい</button>
        </div>
      </div>
      <button class="big" id="kStart">はじめる</button>
    </div>
    <div class="karuta-play" id="karutaPlay" hidden>
      <div class="yomi-row">
        <div class="score" id="kScore"></div>
        <div class="yomifuda" id="yomifuda"></div>
        <button class="iconbtn round" id="kAgain" aria-label="もういちど よむ">🔁</button>
      </div>
      <div class="table" id="kTable"></div>
    </div>
  </section>

  <!-- ======== はいくの きせつ ======== -->
  <section class="screen" id="quiz" hidden>
    <div class="quiz-play">
      <div class="progress" id="qProg"></div>
      <div class="q-card" id="qCard"></div>
      <div class="q-choices" id="qChoices"></div>
      <div class="q-explain" id="qExplain" hidden></div>
    </div>
  </section>

  <!-- ======== はいく を つくろう ======== -->
  <section class="screen" id="haiku" hidden>
    <div class="haiku-play">
      <div class="haiku-left">
        <div class="lines" id="hLines"></div>
        <p class="h-msg" id="hMsg" aria-live="polite"></p>
        <div class="h-btns">
          <button id="hUndo">↩︎ もどす</button>
          <button id="hClear">🧹 ぜんぶ けす</button>
          <button id="hRead">🗣️ よむ</button>
          <button id="hSave" class="primary">💾 ほぞん</button>
          <button id="hList">📚 <span id="hCount">0</span>/10</button>
        </div>
      </div>
      <div class="palette">
        <div class="seg small" id="hTab">
          <button data-v="kigo" class="on">きご</button><button data-v="word">ほかの ことば</button>
        </div>
        <div class="seg small" id="hSeason">
          <button data-v="h" class="on">はる</button><button data-v="n">なつ</button><button data-v="a">あき</button><button data-v="f">ふゆ</button><button data-v="s">しんねん</button>
        </div>
        <div class="pieces" id="hPieces"></div>
      </div>
    </div>
  </section>

  <!-- ======== ずかん ======== -->
  <section class="screen" id="zukan" hidden>
    <div class="seg" id="zTab"></div>
    <p class="z-note">🔁 は くらし と はいく で きせつが ちがう ことば</p>
    <div class="z-grid" id="zGrid"></div>
  </section>
</main>

<!-- まんなかに でる まど -->
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="modalBody"></div>
    <button class="big" id="modalClose">とじる</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="data.js?v=0ff6f5f"></script>
<script src="art.js?v=0ff6f5f"></script>
<script src="mora.js?v=0ff6f5f"></script>
<script src="sound.js?v=0ff6f5f"></script>
<script src="app.js?v=0ff6f5f"></script>
</body>
</html>
