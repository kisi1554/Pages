<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かんじすたんしょん｜えきめいで かんじの よみを おぼえよう</title>
<meta name="description" content="首都圏の駅名から、同じ漢字のべつの読み方を学べる漢字学習ゲーム。正解すると漢字のキャラクターが仲間になります。">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div class="wrap">

  <!-- ============ ホーム ============ -->
  <section id="home">
    <div class="topbar">
      <h1>🚃 かんじすたんしょん</h1>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnZukan">📕 ずかん</button>
      <button class="iconbtn" id="btnSound">🔊 おと</button>
    </div>
    <p class="lead">えきの なまえは よめるかな？ おなじ かんじの <b>べつの よみかた</b> も おぼえて、かんじの なかまを あつめよう。</p>

    <div class="card">
      <div class="sectitle" style="margin-top:0">むずかしさを えらぶ</div>
      <div class="seg" id="segLevel">
        <button data-lv="1">やさしい<small>1・2年生くらい</small></button>
        <button data-lv="2">ふつう<small>3〜6年生くらい</small></button>
        <button data-lv="3">ちゅうじゅ<small>中学受験レベル</small></button>
      </div>
      <div class="lead" style="margin:0" id="progressAll"></div>
    </div>

    <div class="sectitle">ろせんを えらぶ</div>
    <div class="lines" id="lineList"></div>
  </section>

  <!-- ============ プレイ ============ -->
  <section id="play" class="hidden">
    <div class="playhead">
      <button class="iconbtn" id="btnBack">← もどる</button>
      <span class="ln" id="playLineName"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnRestart" title="はじめから">⟲</button>
    </div>
    <div class="track" id="track"></div>
    <div class="card qcard" id="qcard"></div>
  </section>

  <!-- ============ けっか ============ -->
  <section id="result" class="hidden">
    <div class="card result" id="resultCard"></div>
  </section>

  <!-- ============ ずかん ============ -->
  <section id="zukan" class="hidden">
    <div class="topbar">
      <button class="iconbtn" id="btnZBack">← もどる</button>
      <h1 style="font-size:clamp(16px,4.4vw,22px)">📕 かんじ ずかん</h1>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnReset">🗑 きろくを けす</button>
    </div>
    <div class="lead" id="zukanCount"></div>
    <div class="zfilter" id="zFilter"></div>
    <div class="zgrid" id="zGrid"></div>
  </section>

</div>

<div id="modalHost"></div>

<script src="data.js?v=4c5eb3f"></script>
<script src="chara.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
