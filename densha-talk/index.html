<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12294d">
<title>でんしゃトーク ｜ でんしゃの ともだちと おはなし</title>
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<div id="app">

  <!-- ======================= タイトル / キャラえらび ======================= -->
  <section class="screen is-active" id="screen-title">
    <div class="title-wrap">
      <div class="title-train">🚃</div>
      <h1 class="title-main">でんしゃ<br>トーク</h1>
      <p class="title-sub">でんしゃの ともだちと おはなし しよう!</p>

      <div class="name-box">
        <label for="child-name">きみの なまえ(なくても いいよ)</label>
        <input id="child-name" type="text" maxlength="8" placeholder="ひらがなで OK" autocomplete="off">
      </div>

      <div class="level-box">
        <span class="level-label">ことばの むずかしさ</span>
        <div class="level-btns" id="level-btns">
          <button data-level="1">やさしい</button>
          <button data-level="2">ふつう</button>
          <button data-level="3" class="is-on">ぜんぶ</button>
        </div>
      </div>

      <p class="pick-label">だれと はなす?</p>
      <div class="char-list" id="char-list"></div>

      <p class="title-note">
        おうちのかたへ: このアプリは インターネットに なにも おくりません。
        会話も 音声も すべて ブラウザの中だけで うごきます。
      </p>
    </div>
  </section>

  <!-- ======================= おはなし ======================= -->
  <section class="screen" id="screen-talk">
    <header class="bar">
      <button class="bar-back" id="btn-back">◀ もどる</button>
      <div class="bar-title">
        <span id="talk-char-name">やまのてん</span>
        <small id="talk-line-name">山手線</small>
      </div>
      <div class="bar-right">
        <button class="icon-btn" id="btn-voice" title="こえの おんおふ">🔊</button>
        <button class="icon-btn" id="btn-map" title="ろせんず">🗺️</button>
        <button class="icon-btn" id="btn-words" title="ことばちょう">📕</button>
        <button class="icon-btn" id="btn-dex" title="えきずかん">📖</button>
      </div>
    </header>

    <!-- キャラクター -->
    <div class="stage" id="stage">
      <div class="train" id="train">
        <div class="train-hat" id="train-hat">🔁</div>
        <div class="train-panta"></div>
        <div class="train-roof"></div>
        <div class="train-body">
          <div class="train-dest" id="train-dest">山手線</div>
          <div class="train-face">
            <div class="brow brow-l"></div>
            <div class="brow brow-r"></div>
            <div class="eye eye-l"><i></i></div>
            <div class="eye eye-r"><i></i></div>
            <div class="cheek cheek-l"></div>
            <div class="cheek cheek-r"></div>
            <div class="mouth"><span class="tooth"></span></div>
          </div>
          <div class="train-lights"><span></span><span></span></div>
        </div>
        <div class="train-skirt"></div>
        <div class="train-aura" id="train-aura"><span></span><span></span><span></span></div>
      </div>
      <!-- らんにゅうしてくる ほかの キャラ(ふだんは がめんの そとに いる) -->
      <div class="guest-wrap" id="guest-wrap" hidden>
        <div class="guest-pop" id="guest-pop"></div>
        <div class="train is-happy" id="guest-train"></div>
      </div>

      <div class="rail"><div class="rail-move"></div></div>
    </div>

    <!-- ろせんず -->
    <div class="map-panel" id="map-panel">
      <div class="map-lines" id="map-lines"></div>
      <div class="map-strip-wrap">
        <div class="map-strip" id="map-strip"></div>
      </div>
      <p class="map-note">えきを タップすると おはなし するよ</p>
    </div>

    <!-- ことばちょう -->
    <div class="word-panel" id="word-panel">
      <div class="word-head">
        <span>📕 ことばちょう</span>
        <span class="word-count" id="word-count">0 / 0</span>
      </div>
      <div class="word-list" id="word-list"></div>
      <p class="word-note">ことばを タップすると、もういちど いみを おしえるよ</p>
    </div>

    <!-- えきずかん -->
    <div class="dex-panel" id="dex-panel">
      <div class="dex-head">
        <span>📖 えきずかん</span>
        <span class="dex-count" id="dex-count">0 / 0</span>
      </div>
      <div class="dex-list" id="dex-list"></div>
      <p class="dex-note">おはなしした えきが、ここに たまっていくよ</p>
    </div>

    <!-- ふきだし -->
    <div class="log" id="log"></div>

    <!-- おすすめの ことば -->
    <div class="chips" id="chips"></div>

    <!-- はなしかける -->
    <div class="inputbar">
      <button class="mic" id="btn-mic" title="おして はなす">
        <span class="mic-icon">🎤</span>
        <span class="mic-label" id="mic-label">はなす</span>
      </button>
      <input id="text-input" type="text" placeholder="もじで うつ ばあいは ここ" autocomplete="off">
      <button class="send" id="btn-send" title="おくる">➤</button>
    </div>
  </section>

</div>

<script src="data.js?v=4c5eb3f"></script>
<script src="knowledge.js?v=4c5eb3f"></script>
<script src="words.js?v=4c5eb3f"></script>
<script src="talk.js?v=4c5eb3f"></script>
<script src="brain.js?v=4c5eb3f"></script>
<script src="speech.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
