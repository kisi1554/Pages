<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きょうふの エレベーター</title>
<meta name="description" content="よるの ホテルの エレベーターが ストーン！と おちる。ドキドキ たいけん アトラクション。">
<meta name="theme-color" content="#140c24">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛗</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg:    #140c24;
    --ink:   #f6efe2;
    --soft:  #c9b8e0;
    --gold:  #e8b84a;
    --card:  rgba(255, 255, 255, .07);
    --line:  rgba(232, 184, 74, .35);
  }

  html, body { margin: 0; height: 100%; }

  body {
    background: radial-gradient(120% 70% at 50% 0%, #3a1f5c 0%, var(--bg) 62%) fixed, var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "游ゴシック体",
                 "Meiryo", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  rt { font-size: .5em; }
  .screen[hidden], [hidden] { display: none !important; }

  /* ---------- タイトル ---------- */
  #title { min-height: 100%; padding: calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .topbar .right { display: flex; gap: 8px; }
  .back {
    text-decoration: none; color: var(--soft); font-size: 15px;
    padding: 10px 14px; border-radius: 99px; background: var(--card);
  }
  .toggle {
    min-height: 44px; padding: 8px 14px; border-radius: 99px;
    border: 2px solid var(--line); background: var(--card); font-size: 15px;
  }

  .hero { text-align: center; margin: 6px 0 4px; }
  .hero svg { width: min(230px, 58vw); height: auto; display: block; margin: 0 auto; overflow: visible; }
  .bolt { opacity: 0; animation: bolt 5.5s infinite; }
  @keyframes bolt { 0%, 86%, 100% { opacity: 0; } 88% { opacity: 1; } 90% { opacity: .15; } 92% { opacity: 1; } 95% { opacity: 0; } }
  h1 {
    margin: 2px 0 0; font-size: clamp(30px, 8.6vw, 48px); letter-spacing: .06em; line-height: 1.25;
    color: var(--gold); text-shadow: 0 3px 0 #5a2a00, 0 0 24px rgba(232, 184, 74, .35);
  }
  .lead { margin: 8px 0 0; color: var(--soft); font-size: clamp(15px, 4vw, 18px); line-height: 1.7; }

  h2 { font-size: 18px; margin: 22px 0 10px; color: var(--gold); letter-spacing: .04em; }

  .avatars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .avatars button {
    aspect-ratio: 1; min-height: 48px; font-size: clamp(28px, 8vw, 40px); line-height: 1;
    border-radius: 16px; border: 3px solid transparent; background: var(--card);
  }
  .avatars button[aria-pressed="true"] { border-color: var(--gold); background: rgba(232, 184, 74, .18); }

  .levels { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .levels { grid-template-columns: repeat(3, 1fr); } }
  .lv {
    display: flex; align-items: center; gap: 12px; text-align: left;
    min-height: 78px; padding: 12px 14px; border-radius: 18px;
    border: 3px solid transparent; background: var(--card);
  }
  .lv[aria-pressed="true"] { border-color: var(--gold); background: rgba(232, 184, 74, .15); }
  .lv .e { font-size: 34px; flex: none; }
  .lv b { display: block; font-size: 20px; }
  .lv small { display: block; color: var(--soft); font-size: 13px; line-height: 1.45; margin-top: 2px; }
  .lv .st { margin-left: auto; color: var(--gold); font-size: 15px; letter-spacing: 1px; white-space: nowrap; flex: none; }
  @media (min-width: 620px) {
    .lv { flex-direction: column; text-align: center; padding: 14px 10px; }
    .lv .st { margin: 0; }
  }

  .go {
    display: block; width: 100%; margin: 22px 0 0; padding: 18px;
    border: 0; border-radius: 22px; font-size: clamp(24px, 6.5vw, 32px); font-weight: bold; letter-spacing: .08em;
    background: linear-gradient(#f3cb63, #c98d22); color: #3a1d00; box-shadow: 0 6px 0 #7a4a0a;
  }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a4a0a; }
  .subrow { display: flex; gap: 10px; margin-top: 14px; }
  .subrow button {
    flex: 1; min-height: 54px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--card); font-size: 17px;
  }
  .stats { text-align: center; color: var(--soft); margin-top: 14px; font-size: 15px; }
  .note { margin-top: 18px; font-size: 12px; color: #a796c0; line-height: 1.7; text-align: center; }

  /* ---------- のりもの ---------- */
  #ride {
    position: fixed; inset: 0; background: #000; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud-top {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .hud-top button {
    pointer-events: auto; min-height: 48px; padding: 8px 16px; border-radius: 99px;
    border: 2px solid rgba(255, 255, 255, .35); background: rgba(0, 0, 0, .55); font-size: 16px;
  }
  #narr {
    position: absolute; left: 50%; bottom: calc(124px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: max-content; max-width: min(92%, 640px); padding: 10px 18px; border-radius: 16px;
    background: rgba(10, 4, 20, .74); color: #fff; font-size: clamp(18px, 4.8vw, 26px); line-height: 1.5;
    text-align: center; pointer-events: none; transition: opacity .3s;
  }
  #narr:empty { opacity: 0; }
  .hud-bottom {
    position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 14px; pointer-events: none;
  }
  #me {
    position: relative; width: 70px; height: 70px; flex: none;
    display: grid; place-items: center; font-size: 42px; line-height: 1;
    background: rgba(0, 0, 0, .55); border-radius: 50%; border: 2px solid rgba(255, 255, 255, .3);
  }
  #me .hands { position: absolute; top: -26px; font-size: 30px; opacity: 0; transition: .15s; }
  #me.up .hands { opacity: 1; transform: translateY(-4px); }
  #handsBtn {
    pointer-events: auto; touch-action: none; min-height: 84px; min-width: 190px; padding: 8px 22px;
    border: 0; border-radius: 24px; font-size: clamp(20px, 5.5vw, 26px); font-weight: bold; color: #fff;
    background: linear-gradient(#ff8fa0, #d9405a); box-shadow: 0 6px 0 #7a1628;
    -webkit-touch-callout: none;
  }
  #handsBtn small { display: block; font-size: 13px; font-weight: normal; opacity: .9; }
  #handsBtn.on { transform: translateY(4px); box-shadow: 0 2px 0 #7a1628; background: linear-gradient(#ffd36a, #f08a1c); }

  #result {
    position: absolute; inset: 0; padding: 16px; overflow: auto; touch-action: auto;
    display: flex; align-items: center; justify-content: center; background: rgba(10, 4, 20, .86);
  }
  .res { width: min(100%, 540px); text-align: center; margin: auto; }
  .res .film { font-size: 15px; color: var(--soft); margin: 0 0 8px; }
  .res canvas {
    width: 100%; height: auto; display: block; border-radius: 6px; border: 7px solid #f4ead2;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .6); transform: rotate(-1.5deg); background: #222;
  }
  .res h2 { font-size: clamp(22px, 6vw, 30px); margin: 18px 0 2px; color: var(--ink); }
  .stars { font-size: 40px; color: var(--gold); letter-spacing: 6px; }
  .res p { color: var(--soft); margin: 4px 0 14px; line-height: 1.6; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btns button { flex: 1 1 160px; min-height: 58px; border-radius: 18px; font-size: 19px; font-weight: bold; }
  .b1 { border: 0; background: linear-gradient(#f3cb63, #c98d22); color: #3a1d00; }
  .b2 { border: 2px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); color: #fff; }

  /* ---------- アルバム ---------- */
  #album { min-height: 100%; padding: calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 16px; }
  .grid figure { margin: 0; }
  .grid canvas { width: 100%; height: auto; display: block; border: 5px solid #f4ead2; border-radius: 4px; }
  .grid figcaption { font-size: 13px; color: var(--soft); text-align: center; margin-top: 6px; }
  .empty { text-align: center; color: var(--soft); margin-top: 40px; line-height: 1.8; }

  @media (prefers-reduced-motion: reduce) { .bolt { animation: none; } }
</style>
</head>
<body>

<!-- ===== タイトル ===== -->
<section id="title" class="screen">
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="../">← メニュー</a>
      <div class="right">
        <button class="toggle" id="calmBtn" type="button"></button>
        <button class="toggle" id="soundBtn" type="button"></button>
      </div>
    </div>

    <div class="hero">
      <svg viewBox="0 0 200 175" aria-hidden="true">
        <circle cx="165" cy="28" r="26" fill="rgba(248,237,194,.12)"/>
        <circle cx="165" cy="28" r="15" fill="#f8edc2"/>
        <path class="bolt" d="M34 6 L20 46 H33 L22 82 L50 34 H36 L46 6Z" fill="#fff6a8"/>
        <g id="tower">
          <path d="M58 172 V66 L72 50 V30 L100 8 L128 30 V50 L142 66 V172Z" fill="#2b1838" stroke="#e8b84a" stroke-width="2"/>
          <path d="M100 8 V0" stroke="#e8b84a" stroke-width="2"/>
          <rect x="82" y="150" width="36" height="22" rx="3" fill="#6b3a12" stroke="#e8b84a" stroke-width="1.5"/>
        </g>
      </svg>
      <h1>きょうふの<br>エレベーター</h1>
      <p class="lead">よるの ホテル「よぞら」。<br>てっぺんまで のぼった エレベーターが…<br>とつぜん ストーン！</p>
    </div>

    <h2>だれが のる？</h2>
    <div class="avatars" id="avatars"></div>

    <h2>こわさを えらぼう</h2>
    <div class="levels" id="levels"></div>

    <button class="go" id="goBtn" type="button">🛗 のる！</button>

    <div class="subrow">
      <button type="button" id="albumBtn">📷 しゃしん アルバム</button>
    </div>

    <p class="stats" id="stats"></p>
    <p class="note">おうちの方へ: 画面のゆれ・暗転・振動（対応端末）の演出があります。「ゆれ ひかえめ」で弱められます。<br>
      こわくなったら のっている あいだ いつでも「🛑 おりる」で ゆっくり おりられます。</p>
  </div>
</section>

<!-- ===== のりもの ===== -->
<section id="ride" class="screen" hidden>
  <canvas id="cv"></canvas>
  <div class="hud-top">
    <button type="button" id="stopBtn">🛑 おりる</button>
    <button type="button" id="soundBtn2"></button>
  </div>
  <div id="narr" aria-live="polite"></div>
  <div class="hud-bottom" id="handsWrap">
    <div id="me"><span class="hands">🙌</span><span id="meFace">🐻</span></div>
    <button type="button" id="handsBtn">🙌 ばんざい<small>おして いる あいだ</small></button>
  </div>

  <div id="result" hidden>
    <div class="res">
      <p class="film">📸 ライド フォト</p>
      <canvas id="photo" width="640" height="480"></canvas>
      <h2 id="resTitle"></h2>
      <div class="stars" id="resStars"></div>
      <p id="resMsg"></p>
      <div class="btns">
        <button type="button" class="b1" id="againBtn">🛗 もういちど</button>
        <button type="button" class="b2" id="menuBtn">🏨 もどる</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== アルバム ===== -->
<section id="album" class="screen" hidden>
  <div class="wrap">
    <div class="topbar">
      <button class="toggle" id="albumBack" type="button">← もどる</button>
    </div>
    <h2>📷 しゃしん アルバム</h2>
    <p class="lead" style="margin:0">おちる しゅんかんの しゃしん。あたらしい じゅんに 12まい まで のこるよ。</p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="albumEmpty" hidden>まだ しゃしんが ないよ。<br>エレベーターに のってみよう！</p>
  </div>
</section>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const FLOOR_H = 4.5;                 // 1かいぶんの たかさ（m）
const STOP = Symbol('stop');
const AVATARS = ['🐻', '🐰', '🐱', '🐶', '🐼', '🦊'];
const NPCS = ['🐷', '🐸', '🐵', '🐨', '🐯', '🐭', '🐹', '🦁', '🐮', '🐔'];
const LEVELS = {
  easy:   { name: 'やさしい', emoji: '🌙', desc: '7かいから ふわっと 1かい',  top: 7,  g: 8,  brake: 12, up: 11, upDec: 7  },
  normal: { name: 'ふつう',   emoji: '👻', desc: '13かいから ストーン！ 3かい', top: 13, g: 12, brake: 20, up: 16, upDec: 10 },
  hard:   { name: 'こわい',   emoji: '💀', desc: 'なんども おちる。ゆうきの ある こ だけ', top: 13, g: 16, brake: 28, up: 22, upDec: 13 },
};
const DROP_LINES = ['きゃーーっ！', 'おちるーーっ！', 'うわああーっ！', 'ひゅーーん！'];
const UP_LINES = ['こんどは うえへ！？', 'ぐいーーん！', 'あがって いくーー！'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- ほぞん ---------- */
const LS_KEY = 'kyofu-elevator-v1';
function defaults() {
  let calm = false;
  try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  return { sound: true, calm, avatar: '🐻', level: 'normal', rides: 0, best: { easy: 0, normal: 0, hard: 0 }, photos: [] };
}
function load() {
  const d = defaults();
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && typeof s === 'object') {
      if (typeof s.sound === 'boolean') d.sound = s.sound;
      if (typeof s.calm === 'boolean') d.calm = s.calm;
      if (AVATARS.includes(s.avatar)) d.avatar = s.avatar;
      if (LEVELS[s.level]) d.level = s.level;
      if (Number.isFinite(s.rides)) d.rides = s.rides;
      if (s.best) for (const k in d.best) if (Number.isFinite(s.best[k])) d.best[k] = s.best[k];
      if (Array.isArray(s.photos)) d.photos = s.photos.filter(p => p && LEVELS[p.lv]).slice(0, 12);
    }
  } catch (e) {}
  return d;
}
const save = load();
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(save)); } catch (e) {} }

const vibrate = p => { if (save.calm) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

/* ---------- おと（WebAudio の ごうせいおん だけ） ---------- */
const SND = {
  ctx: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = this.ctx = new AC();
      this.out = c.createGain(); this.out.gain.value = save.sound ? .8 : 0; this.out.connect(c.destination);
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      // かぜ
      const ws = c.createBufferSource(); ws.buffer = buf; ws.loop = true;
      this.windF = c.createBiquadFilter(); this.windF.type = 'bandpass'; this.windF.frequency.value = 500; this.windF.Q.value = .8;
      this.windG = c.createGain(); this.windG.gain.value = 0;
      ws.connect(this.windF).connect(this.windG).connect(this.out); ws.start();
      // モーター
      this.motorO = c.createOscillator(); this.motorO.type = 'sawtooth'; this.motorO.frequency.value = 45;
      const mf = c.createBiquadFilter(); mf.type = 'lowpass'; mf.frequency.value = 220;
      this.motorG = c.createGain(); this.motorG.gain.value = 0;
      this.motorO.connect(mf).connect(this.motorG).connect(this.out); this.motorO.start();
      // ぶきみな ひくい おと
      this.droneG = c.createGain(); this.droneG.gain.value = 0; this.droneG.connect(this.out);
      [55, 55.7, 82.4].forEach(f => { const o = c.createOscillator(); o.frequency.value = f; o.connect(this.droneG); o.start(); });
    } catch (e) { this.ctx = null; }
  },
  setOn(on) { if (this.ctx) this.out.gain.setTargetAtTime(on ? .8 : 0, this.ctx.currentTime, .05); },
  update() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, v = Math.abs(S.vel);
    this.windG.gain.setTargetAtTime(Math.min(.45, v / 22 * .45), t, .08);
    this.windF.frequency.setTargetAtTime(350 + v * 70, t, .1);
    this.motorG.gain.setTargetAtTime(S.motor ? Math.min(.12, .03 + v * .015) : 0, t, .15);
    this.motorO.frequency.setTargetAtTime(40 + v * 4, t, .1);
    this.droneG.gain.setTargetAtTime(S.drone * .09, t, .5);
  },
  silence() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [this.windG, this.motorG, this.droneG].forEach(g => g.gain.setTargetAtTime(0, t, .1));
  },
  tone(f, dur, type = 'sine', vol = .3, delay = 0, f2 = null, vib = 0) {
    if (!this.ctx || !save.sound) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    if (vib) {
      const l = c.createOscillator(), lg = c.createGain();
      l.frequency.value = 7; lg.gain.value = vib; l.connect(lg).connect(o.frequency);
      l.start(t); l.stop(t + dur + .05);
    }
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  hiss(dur, vol = .3, type = 'lowpass', f = 800, delay = 0, f2 = null, attack = .01) {
    if (!this.ctx || !save.sound) return;
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl).connect(g).connect(this.out); s.start(t, Math.random()); s.stop(t + dur + .05);
  },
  ding()    { this.tone(1318, 1.4, 'sine', .22); this.tone(1046, 1.6, 'sine', .22, .4); },
  door()    { this.hiss(1.4, .12, 'bandpass', 450, 0, 900, .3); this.tone(70, 1.2, 'triangle', .08); },
  clunk()   { this.hiss(.35, .5, 'lowpass', 260); this.tone(95, .4, 'sine', .5, 0, 35); },
  click()   { this.tone(2200, .05, 'square', .1); this.tone(1400, .05, 'square', .08, .07); },
  thunder() { this.hiss(.25, .35, 'highpass', 1500, .35); this.hiss(3, .7, 'lowpass', 240, .4, 60, .08); },
  creak()   { this.tone(170, 1.5, 'triangle', .14, 0, 110, 14); this.tone(230, 1, 'triangle', .08, .9, 160, 10); },
  laugh()   { [620, 590, 550, 480].forEach((f, i) => this.tone(f, .24, 'sine', .2, i * .24, f * .85, 25)); },
  shutter() { this.hiss(.06, .45, 'highpass', 3000); this.tone(1800, .04, 'square', .08, .07); },
  heart()   { this.tone(65, .16, 'sine', .55, 0, 45); this.tone(60, .16, 'sine', .38, .2, 42); },
  whoosh()  { this.hiss(1.3, .35, 'bandpass', 300, 0, 2400, .15); },
  buzz()    { this.tone(120, .5, 'square', .035); },
  power()   { this.tone(220, .9, 'sawtooth', .06, 0, 40); },
  wow()     { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 1.2, 'triangle', .1, i * .12)); },

const S = {};

function resetScene() {
  rideTok++;
  if (motion) { const r = motion.res; motion = null; r(); }
  while (tweens.length) tweens.pop().res();
  Object.assign(S, {
    alt: 0, vel: 0, acc: 0, door: 1, light: 1, shake: 0, ghost: 0, ghostOut: 0, flash: 0, lightning: 0,
    motor: false, drone: 0, music: false, musT: 0, musI: 0, heart: false, heartT: 0,
    photoAt: null, photo: null, dropT: 0, upT: 0, flickUntil: 0, time: S.time || 0,
    top: LEVELS[save.level].top, riding: false, returning: false,
  });
  ITEMS.forEach(it => { it.lift = 0; it.v = 0; it.rot = 0; });
  setHands(false);
}

function runMotion(fn, dur) {
  return new Promise(res => {
    if (motion) motion.res();
    motion = { fn, dur, start: null, res };
  });
}
// ゆっくり うごく
function cruise(to, vmax) {
  const a0 = S.alt, d = to - a0, dur = Math.max(.3, Math.abs(d) / vmax * 1.5);
  return runMotion(t => a0 + d * (1 - Math.cos(Math.PI * Math.min(1, t / dur))) / 2, dur);
}
// a1 で かそく → a2 で げんそく（おちる: a1=じゅうりょく / あがる: a2=じゅうりょく）
function burst(to, a1, a2) {
  const a0 = S.alt, sg = Math.sign(to - a0), D = Math.abs(to - a0);
  const v = Math.sqrt(2 * D / (1 / a1 + 1 / a2)), t1 = v / a1, t2 = v / a2, d1 = v * v / (2 * a1);
  return runMotion(t => t < t1 ? a0 + sg * .5 * a1 * t * t
                               : a0 + sg * (d1 + v * (t - t1) - .5 * a2 * (t - t1) ** 2), t1 + t2);
}
function tween(obj, key, to, ms) {
  return new Promise(res => {
    for (let i = tweens.length - 1; i >= 0; i--) {
      if (tweens[i].obj === obj && tweens[i].key === key) { tweens[i].res(); tweens.splice(i, 1); }
    }
    tweens.push({ obj, key, from: obj[key], to, dur: ms / 1000, start: null, res });
  });
}
function lightning() { S.lightning = 1; SND.thunder(); }
function flicker(sec) { S.flickUntil = S.time + sec; SND.buzz(); }

function drawOutside(R, t) {

function drawItems(R, dt) {
  const yB = R.y + R.h, fh = H - yB;
  const size = Math.max(22, Math.min(48, fh * .32, W * .09));

  ITEMS.forEach((it, i) => {
    const target = wl > .45 ? -H * .28 * wl * (.7 + i * .12) : 0;
    it.v += ((target - it.lift) * 18 - it.v * (wl > .45 ? 4 : 9)) * dt;
    it.lift = Math.min(0, it.lift + it.v * dt);
    if (it.lift === 0 && it.v > 0) it.v = 0;
    it.rot += (wl > .45 ? (i % 2 ? 2 : -2) : -it.rot * 6) * dt;
    ctx.save();
    ctx.translate(W * it.x, yB + fh * .55 + it.lift);
    ctx.rotate(it.rot);
    ctx.fillText(it.e, 0, 0);
    ctx.restore();

function drawGhost(x, y, s, a, t) {

  }

  ctx.fillStyle = '#1d1630';
  ctx.beginPath(); ctx.ellipse(-s * .14, -s * .14, s * .06, s * .09, 0, 0, 7); ctx.ellipse(s * .14, -s * .14, s * .06, s * .09, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, s * .08, s * .07, s * .09, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,140,170,.6)';
  ctx.beginPath(); ctx.arc(-s * .26, -s * .02, s * .05, 0, 7); ctx.arc(s * .26, -s * .02, s * .05, 0, 7); ctx.fill();
  ctx.restore();
}

function draw(t, dt) {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) {
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  }
  W = r.width; H = r.height;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const R = doorRect();
  let light = S.light;
  if (S.time < S.flickUntil && Math.random() < .35) light *= .25;

  ctx.save();
  let amt = S.shake * 12 + Math.min(3, Math.abs(S.vel) * .12) + Math.max(0, S.acc - 12) * .25;
  if (save.calm) amt *= .25;
  ctx.translate((Math.random() - .5) * amt, (Math.random() - .5) * amt);

  ctx.save(); ctx.beginPath(); ctx.rect(R.x, R.y, R.w, R.h); ctx.clip(); drawOutside(R, t); ctx.restore();
  drawDoors(R);
  drawWall(R, t, light);
  drawItems(R, dt);

  // くらさ
  const dark = 1 - light;
  if (dark > .01) {
    ctx.fillStyle = `rgba(6,3,14,${dark * .9})`;
    ctx.beginPath(); ctx.rect(-20, -20, W + 40, H + 40); ctx.rect(R.x, R.y, R.w, R.h); ctx.fill('evenodd');
    ctx.fillStyle = `rgba(6,3,14,${dark * Math.max(0, .9 - .72 * S.door)})`;
    ctx.fillRect(R.x, R.y, R.w, R.h);
  }
  // ひじょうとう
  if (light < .6) {
    const ex = R.x + R.w + (W - R.x - R.w) * .5, ey = R.y * .55 + 10, p = .6 + .4 * Math.sin(t * 4);
    const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, 46);
    eg.addColorStop(0, `rgba(255,40,40,${.8 * p})`); eg.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = eg; ctx.fillRect(ex - 46, ey - 46, 92, 92);
    ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, 7); ctx.fill();
  }
  drawGhost(W / 2, R.y + R.h * .4, R.w * .62, S.ghost, t);
  if (S.lightning > 0) { ctx.fillStyle = `rgba(220,210,255,${S.lightning * .18})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();

  if (S.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${S.flash})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ---------- まいフレーム ---------- */
let raf = 0, last = 0;
function loop(ts) {
  raf = requestAnimationFrame(loop);
  const now = ts / 1000, dt = last ? Math.min(.05, Math.max(.001, now - last)) : .016;
  last = now; S.time = now;

  const prev = S.alt;
  if (motion) {
    if (motion.start === null) motion.start = now - dt;
    const t = now - motion.start;
    if (t >= motion.dur) { S.alt = motion.fn(motion.dur); const r = motion.res; motion = null; r(); }
    else S.alt = motion.fn(t);
  }
  const v = (S.alt - prev) / dt;
  S.acc += ((v - S.vel) / dt - S.acc) * Math.min(1, dt * 10);
  S.vel = v;
  if (!motion && Math.abs(S.vel) < .01) S.acc *= .8;

  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    if (tw.start === null) tw.start = now;
    const p = tw.dur > 0 ? Math.min(1, (now - tw.start) / tw.dur) : 1;
    tw.obj[tw.key] = tw.from + (tw.to - tw.from) * (1 - Math.cos(Math.PI * p)) / 2;
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }

  const wl = -S.acc / 9.8;
  if (S.riding && wl > .5) { S.dropT += dt; if (hands) S.upT += dt; }
  if (S.photoAt !== null && S.vel < 0 && S.alt <= S.photoAt) {
    S.photoAt = null; S.flash = 1; S.photo = { up: hands }; SND.shutter();
  }

  S.shake = Math.max(0, S.shake - dt * 2.2);
  S.flash = Math.max(0, S.flash - dt * 2.2);
  if (S.lightning > 0) {
    S.lightning = Math.max(0, S.lightning - dt * 2.5);
    if (S.lightning > .3 && S.lightning < .36 && Math.random() < .5) S.lightning = .9;
  }
  if (S.heart) { S.heartT -= dt; if (S.heartT <= 0) { SND.heart(); S.heartT = .8; } }
  if (S.music) { S.musT -= dt; if (S.musT <= 0) { SND.note(S.musI++); S.musT = .42; } }

  SND.update();
  draw(now, dt);
}
function startLoop() { if (!raf) { last = 0; raf = requestAnimationFrame(loop); } }
function stopLoop() { cancelAnimationFrame(raf); raf = 0; SND.silence(); }

/* ---------- のりものの すすみかた ---------- */
function makePlan(lv) {
  if (lv === 'easy') return [{ t: 'drop', to: rand(11, 14), photo: true }, { t: 'up', to: rand(19, 23) }, { t: 'drop', to: 0 }];
  if (lv === 'normal') return [
    { t: 'drop', to: rand(18, 24), photo: true }, { t: 'up', to: rand(42, 48) },
    { t: 'drop', to: rand(8, 13) }, { t: 'up', to: rand(28, 36) }, { t: 'drop', to: 0 },
  ];
  return [
    { t: 'fake' }, { t: 'drop', to: rand(14, 20), photo: true }, { t: 'up', to: rand(48, 52), ghost: true },
    { t: 'drop', to: rand(4, 8) }, { t: 'up', to: rand(36, 44) }, { t: 'fake' },
    { t: 'drop', to: rand(16, 22) }, { t: 'up', to: rand(28, 36) }, { t: 'drop', to: 0 },
  ];
}

async function ride() {
  const lvKey = save.level, L = LEVELS[lvKey], top = (L.top - 1) * FLOOR_H;
  resetScene();
  const tok = rideTok;
  const w = async p => { await p; if (tok !== rideTok) throw STOP; };
  S.riding = true;
  $('#meFace').textContent = save.avatar;
  $('#result').hidden = true; $('#stopBtn').hidden = false; $('#handsWrap').hidden = false;
  show('ride'); startLoop();
  const plan = makePlan(lvKey);
  try {
    narr('ようこそ、ホテル「よぞら」へ。'); await w(sleep(2000));
    narr(`${L.top}かいの てんぼうしつへ<br>ごあんない します。`); await w(sleep(2300));
    narr('ベルトを しめてね。…カチッ！'); SND.click(); await w(sleep(1500));
    SND.door(); await w(tween(S, 'door', 0, 1500));
    SND.clunk(); S.shake = .35;
    narr('うえへ まいります…'); S.motor = true; S.drone = 1; S.music = true; S.musI = 0;
    const asc = cruise(top, L.top > 10 ? 6 : 4.5);
    await w(sleep(2200)); flicker(1.2);
    narr('この ホテルには<br>ふしぎな うわさが あるんだって…');
    await w(sleep(3000)); lightning();
    narr('よるに なると<br>おばけが エレベーターを うごかす らしい…');
    await w(asc);
    S.music = false; S.motor = false; SND.clunk(); S.shake = .6; vibrate(60);
    narr('ガコン！　…とまった？'); await w(sleep(1300));
    SND.power(); await w(tween(S, 'light', 0, 250)); S.drone = 1.6;
    await w(sleep(800));
    SND.laugh(); tween(S, 'ghost', 1, 700); narr('うふふふ…　ようこそ…'); await w(sleep(2100));
    await w(tween(S, 'ghost', 0, 500));
    narr('き、きえた…？'); await w(sleep(1000));
    SND.door(); tween(S, 'light', .3, 900); await w(tween(S, 'door', 1, 1800));
    SND.wow(); narr('わあ…！ まちが ぜんぶ みえる！'); await w(sleep(2600));
    narr('おちる ときに しゃしんを とるよ。<br>🙌 ばんざい してね！'); await w(sleep(2800));
    narr('…あれ？　なにか おとが…'); SND.creak(); S.heart = true; S.heartT = 0;
    await w(sleep(rand(1500, 3600)));

    for (const st of plan) {
      if (st.t === 'fake') {
        S.heart = false; narr('ガタッ！？'); SND.clunk();
        await w(burst(S.alt - 1.2, L.g, L.brake)); S.shake = .8; vibrate(80);
        await w(sleep(500)); narr('…い、いまのは なに？'); S.heart = true; S.heartT = 0;
        await w(sleep(rand(1400, 3000)));
      } else if (st.t === 'drop') {
        S.heart = false; narr(pick(DROP_LINES)); SND.whoosh(); vibrate([200, 60, 200]);
        if (st.photo) S.photoAt = (S.alt + st.to) / 2;
        await w(burst(st.to, L.g, L.brake));
        SND.clunk(); S.shake = 1; vibrate(120);
        if (st.to > 0) await w(sleep(rand(250, 900)));
      } else {
        narr(pick(UP_LINES)); SND.whoosh(); S.motor = true;
        await w(burst(st.to, L.up, L.upDec)); S.motor = false;
        if (st.ghost) { tween(S, 'ghostOut', 1, 300); SND.laugh(); narr('ばあっ！'); }
        await w(sleep(rand(200, 1000)));
        if (st.ghost) tween(S, 'ghostOut', 0, 400);
      }
    }
    S.drone = 0; await w(sleep(700));
    tween(S, 'light', 1, 900); SND.ding(); narr('おかえりなさい！<br>よく がんばったね！');
    await w(sleep(1300)); SND.happy(); await w(sleep(1500));
    finish(lvKey);
  } catch (e) {
    if (e !== STOP) console.error(e);
  }
}

// こわくなったら ゆっくり おりる
async function stopRide() {
  if (!S.riding || S.returning) return;
  rideTok++;
  const tok = rideTok;
  if (motion) { const r = motion.res; motion = null; r(); }
  S.returning = true; S.heart = false; S.music = false; S.drone = 0; S.photoAt = null;
  setHands(false); $('#stopBtn').hidden = true; $('#handsWrap').hidden = true;
  tween(S, 'ghost', 0, 300); tween(S, 'ghostOut', 0, 300); tween(S, 'light', 1, 600);
  narr('だいじょうぶ。<br>ゆっくり おりるよ。');
  S.motor = true;
  await cruise(0, 4);
  if (tok !== rideTok) return;
  S.motor = false; SND.clunk(); SND.ding();
  narr('ついたよ。<br>また こんど ちょうせん しよう！');
  await sleep(2200);
  if (tok !== rideTok) return;
  S.riding = false;
  goTitle();
}

/* ---------- ライドフォト ---------- */
function renderPhoto(c, p) {
  const x = c.getContext('2d'), Wp = c.width, Hp = c.height, r = mulberry32(p.seed || 1);
  const bg = x.createRadialGradient(Wp / 2, Hp * .45, Wp * .1, Wp / 2, Hp * .5, Wp * .75);
  bg.addColorStop(0, '#7a3c24'); bg.addColorStop(1, '#1a0a06');
  x.fillStyle = bg; x.fillRect(0, 0, Wp, Hp);
  x.strokeStyle = 'rgba(232,184,74,.4)'; x.lineWidth = Hp * .006;
  for (let i = 0; i < 4; i++) x.strokeRect(Wp * (.03 + i * .245), Hp * .05, Wp * .2, Hp * .55);

  x.textAlign = 'center'; x.textBaseline = 'middle';
  const stuff = ['🧸', '🎩', '🍬', '🧳', '👟', '🍭'];
  for (let i = 0; i < 5; i++) {
    x.save(); x.translate(Wp * (.08 + r() * .84), Hp * (.06 + r() * .16)); x.rotate((r() - .5) * 1.6);
    x.font = emojiFont(Hp * .07); x.fillText(stuff[i], 0, 0); x.restore();
  }

  const people = [p.npcs[0], p.av, p.npcs[1], p.npcs[2]];
  const cols = ['#3b6fd1', '#e0464a', '#2e9b6a', '#9b59d0'];
  const say = ['きゃー！', 'ひゃあ！', 'わあー！', 'たすけてー', '！？'];
  people.forEach((e, i) => {
    const me = i === 1, cxp = Wp * (.14 + i * .24), hy = Hp * .44;
    const up = me ? p.up : r() < .4;
    const bw = Hp * .2, col = me ? '#e8b84a' : cols[i];
    x.fillStyle = col;
    x.beginPath(); x.roundRect ? x.roundRect(cxp - bw / 2, Hp * .54, bw, Hp * .3, bw * .3) : x.rect(cxp - bw / 2, Hp * .54, bw, Hp * .3); x.fill();
    x.strokeStyle = col; x.lineWidth = Hp * .035; x.lineCap = 'round';
    for (const sd of [-1, 1]) {
      x.beginPath(); x.moveTo(cxp + sd * bw * .4, Hp * .6);
      if (up) x.lineTo(cxp + sd * bw * .62, Hp * .22); else x.lineTo(cxp + sd * bw * .3, Hp * .73);
      x.stroke();
      x.fillStyle = '#f2c9a0';
      x.beginPath(); x.arc(up ? cxp + sd * bw * .62 : cxp + sd * bw * .3, up ? Hp * .2 : Hp * .74, Hp * .026, 0, 7); x.fill();
      x.fillStyle = col;
    }
    x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = Hp * .006;
    for (let k = -1; k <= 1; k++) {
      x.beginPath(); x.moveTo(cxp + k * bw * .25, hy - Hp * .14); x.lineTo(cxp + k * bw * .3, hy - Hp * .2); x.stroke();
    }
    x.font = emojiFont(Hp * .17); x.fillText(e, cxp, hy);
    const text = me ? (p.up ? 'わーい！' : 'きゃー！') : (r() < .7 ? say[r() * say.length | 0] : '');
    if (text) {
      x.font = `bold ${Hp * .045}px sans-serif`;
      const tw = x.measureText(text).width + Hp * .04, by = Hp * (me ? .1 : .32 + (i % 2) * .04);
      const bx = Math.min(Wp - tw / 2 - 4, Math.max(tw / 2 + 4, cxp + (i % 2 ? -1 : 1) * bw * .1));
      x.fillStyle = me ? '#fff6c8' : 'rgba(255,255,255,.9)';
      x.beginPath(); x.ellipse(bx, by, tw / 2, Hp * .045, 0, 0, 7); x.fill();
      x.fillStyle = '#3a1d0a'; x.fillText(text, bx, by);
    }
    if (me) {
      x.font = `bold ${Hp * .04}px sans-serif`;
      x.fillStyle = '#e8b84a'; x.fillText('▲ あなた', cxp, Hp * .855);
    }
  });
  const bar = x.createLinearGradient(0, Hp * .7, 0, Hp * .74);
  bar.addColorStop(0, '#f3d27a'); bar.addColorStop(1, '#8a5a14');
  x.fillStyle = bar; x.fillRect(Wp * .03, Hp * .7, Wp * .94, Hp * .035);

  const fl = x.createRadialGradient(Wp / 2, Hp * .45, 0, Wp / 2, Hp * .45, Wp * .5);
  fl.addColorStop(0, 'rgba(255,255,255,.14)'); fl.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = fl; x.fillRect(0, 0, Wp, Hp);

  x.fillStyle = '#0d0710'; x.fillRect(0, Hp * .89, Wp, Hp * .11);
  x.fillStyle = '#e8b84a'; x.font = `bold ${Hp * .042}px sans-serif`;
  x.textAlign = 'left'; x.fillText('🛗 ホテル よぞら', Wp * .03, Hp * .945);
  x.textAlign = 'right'; x.fillText(`${p.d} ・ ${LEVELS[p.lv].name}`, Wp * .97, Hp * .945);
}

function finish(lv) {
  const frac = S.dropT > 0 ? S.upT / S.dropT : 0;
  const stars = frac >= .6 ? 3 : frac >= .3 ? 2 : 1;
  const d = new Date();
  const others = NPCS.slice().sort(() => Math.random() - .5).slice(0, 3);
  const p = {
    d: `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`, lv, av: save.avatar, npcs: others,
    up: S.photo ? S.photo.up : false, seed: Math.floor(Math.random() * 1e9),
  };
  save.rides++;
  save.best[lv] = Math.max(save.best[lv] || 0, stars);
  save.photos.unshift(p); save.photos = save.photos.slice(0, 12);
  persist();

  S.riding = false;
  setHands(false);
  $('#stopBtn').hidden = true; $('#handsWrap').hidden = true; narr('');
  renderPhoto($('#photo'), p);
  $('#resTitle').textContent = `「${LEVELS[lv].name}」 クリア！`;
  $('#resStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  $('#resMsg').innerHTML = [
    '',
    'さいごまで のれたね！<br>つぎは おちる ときに 🙌 ばんざい してみよう',
    'なかなかの ゆうき！<br>もっと ばんざい できるかな？',
    'ずっと ばんざい！<br>ゆうき まんてん！',
  ][stars];
  $('#result').hidden = false;
}

/* ---------- がめん ---------- */
function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
  window.scrollTo(0, 0);
}
function goTitle() {
  resetScene(); stopLoop(); renderTitle(); show('title');
}

function soundLabel() { return save.sound ? '🔊 おと オン' : '🔈 おと オフ'; }
function renderTitle() {
  const av = $('#avatars'); av.innerHTML = '';
  for (const e of AVATARS) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = e; b.setAttribute('aria-pressed', String(e === save.avatar));
    b.addEventListener('click', () => { save.avatar = e; persist(); renderTitle(); });
    av.append(b);
  }
  const lv = $('#levels'); lv.innerHTML = '';
  for (const k in LEVELS) {
    const L = LEVELS[k], best = save.best[k] || 0;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lv'; b.setAttribute('aria-pressed', String(k === save.level));
    b.innerHTML = `<span class="e">${L.emoji}</span><span><b>${L.name}</b><small>${L.desc}</small></span>` +
      `<span class="st">${best ? '★'.repeat(best) + '☆'.repeat(3 - best) : 'まだ'}</span>`;
    b.addEventListener('click', () => { save.level = k; persist(); renderTitle(); });
    lv.append(b);
  }
  $('#soundBtn').textContent = soundLabel();
  $('#soundBtn2').textContent = soundLabel();
  $('#calmBtn').textContent = save.calm ? '🫨 ゆれ ひかえめ' : '🫨 ゆれ ふつう';
  $('#stats').textContent = save.rides ? `のった かいすう: ${save.rides}かい` : '';
}

function showAlbum() {
  const g = $('#grid'); g.innerHTML = '';
  $('#albumEmpty').hidden = save.photos.length > 0;
  for (const p of save.photos) {
    const fig = document.createElement('figure');
    const c = document.createElement('canvas'); c.width = 480; c.height = 360;
    renderPhoto(c, p);
    const cap = document.createElement('figcaption');
    cap.textContent = `${p.d} ・ ${LEVELS[p.lv].name}${p.up ? ' ・ 🙌' : ''}`;
    fig.append(c, cap); g.append(fig);
  }
  show('album');
}

function toggleSound() {
  save.sound = !save.sound; persist(); SND.init(); SND.setOn(save.sound);
  $('#soundBtn').textContent = soundLabel(); $('#soundBtn2').textContent = soundLabel();
}

$('#goBtn').addEventListener('click', () => { SND.init(); ride(); });
$('#againBtn').addEventListener('click', () => { SND.init(); ride(); });
$('#menuBtn').addEventListener('click', goTitle);
$('#stopBtn').addEventListener('click', stopRide);
$('#soundBtn').addEventListener('click', toggleSound);
$('#soundBtn2').addEventListener('click', toggleSound);
$('#calmBtn').addEventListener('click', () => { save.calm = !save.calm; persist(); renderTitle(); });
$('#albumBtn').addEventListener('click', showAlbum);
$('#albumBack').addEventListener('click', () => { renderTitle(); show('title'); });

const hb = $('#handsBtn');
hb.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { hb.setPointerCapture(e.pointerId); } catch (_) {}
  setHands(true);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => hb.addEventListener(ev, () => setHands(false)));
hb.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !$('#ride').hidden && !$('#handsWrap').hidden) { e.preventDefault(); setHands(true); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') setHands(false); });

document.addEventListener('visibilitychange', () => {
  if (!SND.ctx) return;
  if (document.hidden) SND.ctx.suspend().catch(() => {});
  else if (!$('#ride').hidden) SND.ctx.resume().catch(() => {});
});

// タイトルの とうの まど
(() => {
  const g = document.getElementById('tower'), ns = 'http://www.w3.org/2000/svg', r = mulberry32(7);
  for (let y = 60; y < 140; y += 13) for (let x = 66; x < 134; x += 12) {
    if (y < 72 && (x < 78 || x > 120)) continue;
    const el = document.createElementNS(ns, 'rect');
    el.setAttribute('x', x); el.setAttribute('y', y); el.setAttribute('width', 6); el.setAttribute('height', 8);
    el.setAttribute('fill', r() < .3 ? '#ffd86b' : '#140c24');
    g.append(el);
  }
})();

resetScene();
renderTitle();
})();
</script>
