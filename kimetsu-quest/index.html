<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>きめつクエスト だい1わ</title>
<meta name="description" content="すみやきの たんじろうが ぼうけんする、ドラクエふうの コマンドRPG（ファンメイド）。">
<meta name="theme-color" content="#141a2c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="stylesheet" href="style.css?v=3b3a949">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div id="app">
  <header id="bar">
    <span class="ttl">きめつクエスト</span>
    <span id="goal"></span>
    <button type="button" id="sndBtn" aria-label="おと">🔊</button>
    <button type="button" id="menuBtn">メニュー</button>
  </header>
  <main id="mid">
    <div id="stage">
      <canvas id="cv" width="240" height="176"></canvas>
      <div id="battle" hidden>
        <div id="bstat" class="win"></div>
        <canvas id="bcv" width="64" height="48"></canvas>
      </div>
      <div id="info" class="win" hidden></div>
      <div id="msg" class="win" hidden><div id="msgText"></div><span id="msgNext">▼</span></div>
      <div id="choice" class="win" hidden></div>
      <div id="title">
        <div class="tbox">
          <div class="tsub">ファンメイド コマンドRPG</div>
          <h1>きめつクエスト</h1>
          <div class="tep" id="tep">だい1わ　はじまりの ゆき</div>
        </div>
      </div>
      <div id="fade"></div>
    </div>
    <div id="padL" class="pad">
      <div class="dpad">
        <button type="button" class="dir up" data-k="up" aria-label="うえ">▲</button>
        <button type="button" class="dir left" data-k="left" aria-label="ひだり">◀</button>
        <button type="button" class="dir right" data-k="right" aria-label="みぎ">▶</button>
        <button type="button" class="dir down" data-k="down" aria-label="した">▼</button>
      </div>
    </div>
    <div id="padR" class="pad">
      <div class="abpad">
        <button type="button" class="ab b" data-k="b">B<small>もどる</small></button>
        <button type="button" class="ab a" data-k="a">A<small>けってい</small></button>
      </div>
    </div>
  </main>
</div>
<script src="data.js?v=3b3a949"></script>
<script src="engine.js?v=3b3a949"></script>
<script src="ep1.js?v=3b3a949"></script>
</body>
</html>
