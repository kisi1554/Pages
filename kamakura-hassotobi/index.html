<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>よしつね はっそうとび</title>
<style>
  :root { --main:#1c5d99; --deep:#0b3a66; --paper:#fdf6e3; --ink:#2b1d14; --gold:#f59f00; --red:#c92a2a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Noto Sans JP", sans-serif;
    color: var(--ink); background: #dbeefc; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  rt { font-size: .5em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

  #bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--main); color: #fff; }
  #barTitle { flex: 1; font-weight: 800; font-size: clamp(15px, 4.2vw, 22px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn { flex: none; min-width: 52px; height: 48px; border: 0; border-radius: 14px; background: rgba(255,255,255,.25); color: #fff; font-size: 24px; }
  .ibtn:active { transform: scale(.94); }

  #main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .screen { position: absolute; inset: 0; overflow-y: auto; }
  .center { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; text-align: center; gap: 10px; }
  .big { min-height: 64px; min-width: 200px; padding: 10px 22px; border: 0; border-radius: 20px; background: var(--red); color: #fff; font-size: clamp(20px, 5.5vw, 26px); font-weight: 800; box-shadow: 0 5px 0 #8a1c1c; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a1c1c; }
  .big.sub { background: var(--main); box-shadow: 0 5px 0 var(--deep); }
  .big.sub:active { box-shadow: 0 2px 0 var(--deep); }

  /* タイトル */
  #title { background: linear-gradient(#bfe3ff 0%, #e8f6ff 55%, #5aa9e6 56%, #2f7fc1 100%); }
  #titleArt { width: min(92vw, 460px); height: auto; }
  #title h1 { margin: 0; font-size: clamp(30px, 9vw, 46px); color: var(--deep); text-shadow: 0 3px 0 #fff; }
  #title .lead { margin: 0; font-size: clamp(15px, 4vw, 19px); line-height: 1.7; background: rgba(255,255,255,.85); border-radius: 14px; padding: 6px 12px; }
  #stageSel { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #stageSel button { min-height: 56px; min-width: 96px; border: 3px solid #fff; border-radius: 16px; background: #fff; font-size: 15px; font-weight: 700; padding: 4px 10px; box-shadow: 0 3px 0 #9cc3e4; }
  #stageSel button:disabled { opacity: .45; }
  #stageSel button .m { display: block; font-size: 22px; }
  .menuLink { display: inline-block; margin-top: 4px; color: #fff; background: rgba(11,58,102,.75); border-radius: 12px; padding: 10px 16px; text-decoration: none; font-weight: 700; }

  /* てがみ */
  #letter { background: #efe2c6; }
  #paper { width: min(94vw, 560px); background: var(--paper); border: 3px solid #c9a96e; border-radius: 10px; padding: 14px 16px 12px; box-shadow: 0 6px 0 #c9a96e; position: relative; text-align: left; }
  #paper h2 { margin: 0 0 6px; font-size: clamp(18px, 5vw, 24px); color: #6b3e12; text-align: center; }
  #yoriWrap { display: flex; align-items: flex-end; gap: 10px; }
  #yoriSvg { width: 92px; height: 104px; flex: none; }
  #letterText { flex: 1; font-size: clamp(16px, 4.4vw, 20px); line-height: 1.85; margin: 0; }
  #letterNote { font-size: 11px; color: #6c5a4a; line-height: 1.6; margin-top: 8px; border-top: 1px dashed #c9b28d; padding-top: 6px; }
  #stamps { position: absolute; inset: 0; pointer-events: none; }
  .hanko { position: absolute; width: 54px; height: 54px; border: 3px solid #d6336c; color: #d6336c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; line-height: 1.1; text-align: center; background: rgba(255,255,255,.3); animation: pon .35s ease-out backwards; }
  @keyframes pon { from { transform: scale(2.4) rotate(-20deg); opacity: 0; } to { opacity: .9; } }
  #hankoArm { transform-origin: 70px 60px; }
  .stamping #hankoArm { animation: arm .5s ease-in-out 2; }
  @keyframes arm { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-35deg); } }
  #letterGag { min-height: 1.4em; font-size: clamp(14px, 3.8vw, 17px); color: #9c3b00; font-weight: 700; }

  /* ゲーム */
  #game { overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(255,255,255,.95); border-radius: 18px; padding: 8px 16px; font-size: clamp(18px, 5vw, 24px); font-weight: 800; color: var(--deep); box-shadow: 0 4px 0 rgba(0,0,0,.15); pointer-events: none; text-align: center; max-width: 92%; }
  #hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(11,58,102,.8); color: #fff; border-radius: 14px; padding: 6px 14px; font-size: clamp(14px, 3.8vw, 18px); pointer-events: none; white-space: nowrap; }

  /* クリア */
  #clear { background: radial-gradient(circle at 50% 30%, #fff9db, #ffe066 60%, #fab005); }
  #clear h2 { margin: 0; font-size: clamp(30px, 9vw, 46px); color: #a61e4d; text-shadow: 0 3px 0 #fff; }
  #clearMsg { font-size: clamp(16px, 4.4vw, 20px); line-height: 1.7; background: rgba(255,255,255,.85); border-radius: 16px; padding: 8px 14px; max-width: 560px; }
  #newCards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #newCards button { min-height: 56px; border: 3px solid #ffa8a8; border-radius: 14px; background: #fff; font-size: 16px; font-weight: 700; padding: 4px 12px; }
  #medals { font-size: clamp(34px, 10vw, 52px); letter-spacing: 6px; }
  #nextEra { max-width: 560px; background: #fff; border-radius: 16px; padding: 10px 12px; font-size: clamp(14px, 3.8vw, 17px); line-height: 1.7; border: 2px dashed #f59f00; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .confetti { position: absolute; top: -20px; width: 10px; height: 16px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* じだいの ものさし */
  #ruler { flex: none; background: #4a3728; color: #e9dcc3; padding: 4px 6px 6px; }
  #ruler .rl { display: block; font-size: 10px; text-align: center; opacity: .8; }
  #ruler ol { list-style: none; margin: 2px 0 0; padding: 0; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  #ruler li { min-height: 26px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; line-height: 1.15; border-radius: 6px; background: #5f4937; border-left: 3px solid #8a6f55; padding: 2px; }
  #ruler li.now { background: #ffd43b; color: #3b2a1a; font-weight: 800; font-size: 12px; border-left-color: var(--main); animation: glow 1.4s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 0 rgba(255,212,59,0); } to { box-shadow: 0 0 10px rgba(255,212,59,.9); } }
  @media (orientation: landscape) and (max-height: 520px) {
    #ruler .rl { display: none; } #ruler li { min-height: 20px; }
    #titleArt { width: min(60vw, 340px); } .big { min-height: 54px; }
    #yoriSvg { width: 70px; height: 80px; }
  }

  /* まなび カード */
  #modal { position: fixed; inset: 0; background: rgba(43,29,20,.45); display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 20; }
  #sheet { background: var(--paper); border-radius: 22px; padding: 14px 16px; width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; }
  #sheet h2 { margin: 2px 0 10px; text-align: center; color: var(--deep); }
  #cardList { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .card { min-height: 92px; border: 3px solid #a5d8ff; border-radius: 16px; background: #fff; padding: 8px; text-align: center; }
  .card .e { font-size: 34px; display: block; }
  .card .n { font-weight: 800; font-size: 15px; display: block; }
  .card .h { font-size: 11px; color: #7c6650; display: block; }
  .card.lock { background: #f1f3f5; color: #adb5bd; border-color: #dee2e6; }
  .ce { font-size: 60px; text-align: center; }
  .ct { font-size: clamp(15px, 4vw, 18px); line-height: 1.9; }
  .cp { font-size: 11px; color: #6c5a4a; line-height: 1.6; margin-top: 10px; border-top: 1px dashed #c9b28d; padding-top: 6px; }
  .mrow { text-align: center; margin-top: 10px; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div id="app">
  <header id="bar">
    <button class="ibtn" id="homeBtn" aria-label="さいしょの がめん">🏠</button>
    <div id="barTitle">🏹 よしつね はっそうとび</div>
    <button class="ibtn" id="sndBtn" aria-label="おと">🔊</button>
    <button class="ibtn" id="cardBtn" aria-label="まなび カード">📖</button>

          <path d="M22 70 h24 v14 h-24z" fill="#fff" stroke="#ccc"/><path d="M162 62 h24 v14 h-24z" fill="#e03131"/><path d="M302 70 h24 v14 h-24z" fill="#e03131"/>

            <path d="M-9 14 l-12 -10 M9 14 l12 -12 M-5 30 l-8 10 M5 30 l10 6" stroke="#ffe3c2" stroke-width="4" stroke-linecap="round"/>
          </g>
          <g transform="translate(40 86)"><rect x="-14" y="0" width="28" height="26" rx="8" fill="#343a40"/><circle cx="0" cy="-8" r="13" fill="#ffe3c2"/><path d="M-14 -10 Q0 -30 14 -10 v4 h-28z" fill="#f8f9fa"/><circle cx="4" cy="-7" r="1.6" fill="#222"/><path d="M-1 -1 q4 3 8 0" stroke="#222" fill="none"/></g>
        </svg>

      </div>

    <section class="screen" id="letter" hidden>
      <div class="center">

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }

  /* ---------- データ ---------- */
  var CARDS = [
    { id: 'bushi', e: '🏹', n: 'ぶし', h: 'さむらい',
      t: 'ゆみや や うまを つかって、じぶんたちの とちを まもる ひとたち。へいあん じだいの おわりに どんどん つよく なり、かまくら じだいからは ぶしが せいじを する ように なったよ。',
      p: '武士。平安時代の後期に力をのばし、平氏（平清盛ら）と源氏が争った。源氏が勝って鎌倉幕府を開き、「貴族の世」から「武士の世」へと移った。' },
    { id: 'yoshitsune', e: '⛵', n: 'よしつね と はっそうとび', h: 'いいつたえ',
      t: 'みなもとの よしつねは、よりともの おとうと。うみの うえの たたかい「だんのうら」で、ふねから ふねへ 8そうも とびうつった と いう いいつたえが あるよ。',
      p: '源義経（1159〜1189）。1185年、壇ノ浦の戦いで平氏が滅びた。「八艘飛び」は『平家物語』などに語られる伝説。のちに義経は兄・頼朝と対立した。弁慶（武蔵坊弁慶）も伝説の多い人物。' },
    { id: 'bakufu', e: '🏯', n: 'よりとも と かまくら ばくふ', h: 'ぶしの せいふ',
      t: 'みなもとの よりともは、かまくらに「ばくふ」（ぶしが せいじを する ところ）を ひらいた。かまくらは うしろと よこが やま、まえが うみで、まもりやすい まち なんだ。',
      p: '源頼朝（1147〜1199）。1185年に守護・地頭を置き、1192年に征夷大将軍となる。幕府の始まりは1185年とする説・1192年とする説などがある。' },
    { id: 'goon', e: '🤝', n: 'ごおん と ほうこう', h: 'まもる ⇔ はたらく',
      t: 'しょうぐんは ぶしたちの とちを まもって あげる（ごおん）。そのかわり ぶしたちは、なにか あったら すぐ かまくらへ かけつけて はたらく（ほうこう）。この ぶしたちを「ごけにん」と いうよ。',
      p: '御恩と奉公。将軍と御家人の主従関係。「いざ鎌倉」は、のちの時代の謡曲（能）『鉢木』の話から広まった言葉とされる。' },
    { id: 'masako', e: '👘', n: 'ほうじょう まさこ', h: 'よりともの つま',
      t: 'よりともの おくさん。よりともが なくなった あとも ばくふを ささえた。ぶしたちの まえで こころに ひびく はなしを して、みんなを ひとつに まとめたと いわれて いるよ。',
      p: '北条政子（1157〜1225）。1221年の承久の乱で御家人に頼朝の恩を説いたと伝わる（『吾妻鏡』など）。「尼将軍」と呼ばれた。' },
    { id: 'daibutsu', e: '🧘', n: 'かまくらの だいぶつ', h: 'おおきな ほとけさま',
      t: 'かまくらに ある、とても おおきな ほとけさま。たかさは やく 11メートル。むかしは たてものの なかに いたけれど、いまは おそとに すわって いるよ。',
      p: '高徳院の阿弥陀如来坐像（国宝）。1252年に造り始めたと伝わる（頼朝の死後）。像高は約11.3m。大仏殿は室町時代に失われ、以後は露座。' }
  ];
  var STAGES = [
    { name: 'はっそうとび', icon: '⛵', cards: ['bushi', 'yoshitsune'] },
    { name: 'いざ かまくら！', icon: '🐎', cards: ['bakufu', 'goon'] },
    { name: 'だいぶつ おさんぽ', icon: '🧘', cards: ['masako', 'daibutsu'] }

      ctx.fillStyle = '#a0522d'; var hy = G.done ? -30 - Math.abs(Math.sin(G.doneT * 6)) * 14 : -30; ctx.fillRect(gx2 + 124, hy - 10, 10, 14); ctx.fillStyle = '#d6336c'; ctx.fillRect(gx2 + 124, hy + 4, 10, 3);
    } else {
      drawDaibutsu(G.goal + 210);
    }
    if (k2) G.items.forEach(function (it) { if (it.got) return; ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.e, it.x, it.y + Math.sin(t * 3 + it.x) * 4); });
    G.obs.forEach(function (o) { if (o.x > G.cam - 80 && o.x < G.cam + VW + 80) drawObs(o, t); });
    var air = G.py < -1, bumping = G.slowT > 0.2;
    if (G.kind === 1) {
      drawHorse(G.px, G.py, t, air);
      drawPerson(G.px - 2, G.py - 44, { k: 0.85, body: '#2f9e44', belt: '#f59f00', band: '#ffd43b', air: air, face: bumping ? 'wow' : '' });
    } else {
      drawPerson(G.px, G.py, { k: 1, body: '#2f9e44', belt: '#f59f00', band: '#ffd43b', air: air, walk: !G.done && !air, t: t, face: (bumping || G.done) ? 'wow' : '' });
    }
    drawParts();
    G.says.forEach(function (s) {
      if (s.who === 'p') bubble(G.px, G.py - (G.kind === 1 ? 110 : 76), s.text);
      else if (s.who === 'yr') bubble(G.goal + 230, -84, s.text);
      else if (s.who === 'gd') bubble(G.goal + 210, -260, s.text);
      else if (s.who.charAt(0) === 'a') bubble(+s.who.slice(1) + 10, -34, s.text);
    });
    screenTx();
    var frac = Math.min(1, G.px / G.goal);
    hud((G.kind === 1 ? '🐎 かまくらまで' : '🧘 だいぶつまで') + (k2 ? '　🍁' + G.got : ''), frac);
  }

  /* ---------- ゲーム ループ ---------- */
  function startStage(i) {
    curStage = i; parts = []; paused = false;
    G = i === 0 ? initBoat() : initRun(i);
    show('game'); resize();
    G.cam = i === 0 ? -VW * 0.3 : -VW * 0.28;
    toast(i === 0 ? '⛵ はっそうとび！ 8そう とぼう' : (i === 1 ? '🐎 いざ かまくら！' : '🧘 だいぶつまで おさんぽ'), 1800);
    lastT = performance.now();
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }
  function loop(now) {
    raf = requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (paused || !G) return;
    G.t += dt; stepParts(dt);
    if (G.kind === 0) { stepBoat(dt); drawBoatScene(); } else { stepRun(dt); drawRunScene(); }
  }
  function down(e) {
    if (!G || paused) return; if (e && e.cancelable) e.preventDefault();
    ac();
    if (G.kind === 0) boatDown(); else runTap();
  }
  function up(e) { if (!G || paused) return; if (e && e.cancelable) e.preventDefault(); if (G.kind === 0) boatUp(); }
  cv.addEventListener('pointerdown', function (e) { try { cv.setPointerCapture(e.pointerId); } catch (x) {} down(e); });
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  var keyHeld = false;
  window.addEventListener('keydown', function (e) { if ((e.code === 'Space' || e.code === 'ArrowUp') && !$('game').hidden) { e.preventDefault(); if (!keyHeld) { keyHeld = true; down(); } } });
  window.addEventListener('keyup', function (e) { if ((e.code === 'Space' || e.code === 'ArrowUp') && !$('game').hidden) { keyHeld = false; up(); } });

  /* ---------- クリア ---------- */
  function confetti() {
    var cols = ['#ff6b6b', '#ffd43b', '#51cf66', '#339af0', '#cc5de8'], host = $('clear');
    for (var i = 0; i < 30; i++) {
      var c = document.createElement('div'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%'; c.style.background = cols[i % 5];
      c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; c.style.animationDelay = Math.random() * 0.6 + 's';
      host.appendChild(c); setTimeout(function (el) { return function () { el.remove(); }; }(c), 4000);
    }
  }
  function stageClear() {
    var i = curStage, st = STAGES[i];
    var first = !save.clear[i]; save.clear[i] = true;
    var newly = [];
    st.cards.forEach(function (id) { if (!save.cards[id]) newly.push(id); save.cards[id] = true; });
    if (i === 2) save.plays++;
    store();
    var praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    var msg;
    if (i === 0) msg = praise + '<br>8そう ぜんぶ とびこえた！' + (G.misses ? '（おちても ' + G.misses + 'かい やりなおして がんばったね）' : '（いちども おちなかった！ てんさい！）') + '<br>べんけいも ぶじ ついてきたよ。';
    else if (i === 1) msg = praise + '<br>ぶじに かまくらに とうちゃく！' + (G.bumps ? '' : '<br>いちども ぶつからなかった！ すごい ごけにん！') + '<br>よりともは まじめな かおで ハンコを ぽん。';
    else msg = praise + '<br>だいぶつさまに あえたね。' + (G.got ? 'はっぱを ' + G.got + 'まい あつめたよ！' : 'つぎは とんでる はっぱも とってみよう！');
    $('clearMsg').innerHTML = msg;
    $('clearHead').textContent = i === 2 ? '🎊 ぜんぶ クリア！' : '🎉 クリア！';
    $('medals').textContent = STAGES.map(function (s, k) { return save.clear[k] ? '⭐' : '☆'; }).join('');
    var nc = $('newCards'); nc.innerHTML = '';
    st.cards.forEach(function (id) {
      var c = cardById(id), b = document.createElement('button');
      b.textContent = (newly.indexOf(id) >= 0 ? '🆕 ' : '') + c.e + ' ' + c.n;
      b.onclick = function () { sfx.tap(); cardFromClear = true; viewCard(c); };
      nc.appendChild(b);
    });
    var ne = $('nextEra');
    if (i === 2) { ne.hidden = false; ne.innerHTML = '🔭 つぎは どんな じだい？<br>つぎは「むろまち じだい」。きんぴかの「きんかく」が たてられ、おちゃや のうが さかえる じだいだよ！'; }
    else ne.hidden = true;
    $('clearNext').textContent = i === 2 ? '🏠 さいしょへ' : 'つぎへ ▶';
    show('clear'); sfx.fanfare(); confetti();
  }
  $('clearNext').onclick = function () { sfx.tap(); if (curStage < 2) openLetter(curStage + 1); else renderTitle(); };
  $('clearRetry').onclick = function () { sfx.tap(); startStage(curStage); };

  renderTitle();
  window.__kh = { get G() { return G; }, startStage: startStage, stageClear: stageClear };
})();
</script>
