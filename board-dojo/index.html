<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かんがえる ボードゲーム</title>
<meta name="description" content="リバーシや ごもくならべを かぞくや CPUと。ヒントと ふりかえりで つよく なろう">
<meta name="theme-color" content="#2b8a3e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟️</text></svg>">
<link rel="stylesheet" href="style.css?v=a801527">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<header class="bar">
  <button class="icon" id="back" aria-label="もどる" hidden>←</button>
  <h1 id="title">♟️ かんがえる ボードゲーム</h1>
  <button class="icon" id="sound" aria-label="おと">🔊</button>
  <button class="icon" id="gear" aria-label="せってい">⚙️</button>
</header>

<!-- ホーム -->
<main class="view" id="v-home">
  <section class="hero">
    <p>むかし から ある <b>ばん の ゲーム</b> で あそぼう。<br>かぞく と たいせん、または CPU と しょうぶ！ ヒント と ふりかえり で つよく なろう。</p>
    <p class="mybelt" id="mybelt"></p>
  </section>
  <button class="resume" id="resume" hidden></button>
  <h2>🎲 ゲーム を えらぶ</h2>
  <div class="grid" id="games"></div>
  <h2>🥋 きろく</h2>
  <div class="grid">
    <button class="card mode" id="go-stats"><span class="em">📊</span><b>せんせき と おび</b><small>ゲーム ごと・あいて ごと の かち まけ。つよい CPU に かつ と <b>くろおび</b>！</small></button>
  </div>
</main>

<!-- じゅんび -->
<main class="view" id="v-setup" hidden>
  <section class="hero rules" id="rules"></section>
  <div class="opts" id="opts"></div>
  <div class="btns"><button class="btn main big" id="start">はじめる ▶</button></div>
</main>

<!-- たいきょく -->
<main class="view play" id="v-play" hidden>
  <div class="side top" id="side2" hidden>
    <p class="coach" data-coach></p>
    <div class="pbtns" data-btns></div>
  </div>
  <div class="status" id="status"></div>
  <div class="playgrid">
    <div class="boardwrap" id="bwrap">
      <svg id="board" class="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ばん"></svg>
      <div class="think" id="think" hidden><span>🤔</span> うーん…</div>
      <div class="zoomnav" id="zoomnav" hidden></div>
    </div>
    <div class="side" id="side1">
      <p class="coach" data-coach></p>
      <div class="pbtns" data-btns></div>
    </div>
  </div>
</main>

<!-- けっか -->
<div class="overlay" id="result" hidden>
  <div class="resbox">
    <div class="resem" id="res-em">🎉</div>
    <h2 id="res-title"></h2>
    <p id="res-sub"></p>
    <p class="belt-get" id="res-belt" hidden></p>
    <div class="btns">
      <button class="btn" id="res-review">🔍 ふりかえり</button>
      <button class="btn" id="res-board">ばん を みる</button>
      <button class="btn main" id="res-again">もういちど</button>
      <button class="btn" id="res-menu">メニュー へ</button>
    </div>
  </div>
</div>

<!-- ふりかえり -->
<main class="view play" id="v-review" hidden>
  <div class="status" id="rv-status"></div>
  <div class="playgrid">
    <div class="boardwrap" id="rv-wrap">
      <svg id="rv-board" class="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ふりかえり の ばん"></svg>
    </div>
    <div class="side">
      <div class="teacher" id="rv-talk"><span class="who">🦉</span><div class="say" id="rv-say">かんがえちゅう…</div></div>
      <div class="points" id="rv-points"></div>
      <input type="range" id="rv-slider" min="0" max="0" value="0" aria-label="なんて め">
      <div class="pbtns">
        <button class="btn small" id="rv-first" aria-label="さいしょ">⏮</button>
        <button class="btn small" id="rv-prev" aria-label="1て もどる">◀</button>
        <button class="btn small" id="rv-play" aria-label="さいせい">▶ さいせい</button>
        <button class="btn small" id="rv-next" aria-label="1て すすむ">▶</button>
        <button class="btn small" id="rv-last" aria-label="さいご">⏭</button>
      </div>
    </div>
  </div>
</main>

<!-- せんせき -->
<main class="view" id="v-stats" hidden>
  <div id="stats"></div>
</main>

<!-- せってい -->
<dialog id="dlg">
  <form method="dialog" class="set">
    <h3>⚙️ せってい</h3>
    <label><input type="checkbox" data-set="sound"> おと（パチッ・くるっ・ファンファーレ）</label>
    <label><input type="checkbox" data-set="undo"> 「まった」（1て もどす）を つかう</label>
    <label><input type="checkbox" data-set="hint"> ヒント ボタン を つかう</label>
    <label><input type="checkbox" data-set="legal"> おける ところ を しるし で みせる</label>
    <label><input type="checkbox" data-set="confirm"> ちいさい ます は 2かい タップ で おく</label>
    <div class="row"><button type="button" class="btn small" id="reset">きろく を けす</button><button class="btn main small">とじる</button></div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="games/reversi.js?v=a801527"></script>
<script src="games/gomoku.js?v=a801527"></script>
<script src="games/marubatsu.js?v=a801527"></script>
<script src="games/yonnarabe.js?v=a801527"></script>
<script src="games/hakotori.js?v=a801527"></script>
<script src="ai.js?v=a801527"></script>
<script src="audio.js?v=a801527"></script>
<script src="view.js?v=a801527"></script>
<script src="ui.js?v=a801527"></script>
</body>
</html>
