<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かんじカード 1ねんせい</title>
<meta name="description" content="1ねんせいの かんじ80じを、いろいろな よみかたと ことばで おぼえる でんしゃの カードアプリ。">
<meta name="theme-color" content="#0b78be">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎴</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="top">
  <a class="back" href="../" aria-label="あそびメニューへ">‹</a>
  <h1 id="title">かんじカード <small>1ねんせい</small></h1>
  <button id="soundBtn" class="icon-btn" aria-label="おと">🔊</button>
</header>

<main>

  <!-- ===== ホーム ===== -->
  <section id="home" class="screen">
    <div class="stats">
      <div class="stat" id="stStreak"></div>
      <div class="stat lv" id="stLevel"></div>
      <div class="stat" id="stStamp"></div>
    </div>

    <div class="mascot">
      <div class="mascot-face" aria-hidden="true">🚃</div>
      <div class="bubble" id="bubble"></div>
    </div>

    <div class="goal panel">
      <div class="ring" id="goalRing"></div>
      <div class="goal-body">
        <div class="goal-title">きょうの めあて</div>
        <div class="goal-sub" id="goalSub"></div>
        <button id="startBtn" class="big-btn">しゅっぱつ！</button>
      </div>
    </div>

    <div class="week panel" id="week"></div>

    <div class="menu">
      <button class="menu-btn" data-go="map"><span>🗺️</span>かんじ ろせんず<small id="mapSub"></small></button>
      <button class="menu-btn" data-go="stamps"><span>🎫</span>えきスタンプ<small id="stampSub"></small></button>
      <button class="menu-btn" data-go="badges"><span>🏅</span>くんしょう<small id="badgeSub"></small></button>
      <button class="menu-btn" data-go="settings"><span>⚙️</span>せってい<small>&nbsp;</small></button>
    </div>
  </section>

  <!-- ===== れんしゅう ===== -->
  <section id="study" class="screen" hidden>
    <div class="track" id="track"></div>
    <div class="combo" id="combo"></div>
    <div id="cardBox"></div>
  </section>

  <!-- ===== けっか ===== -->
  <section id="result" class="screen" hidden></section>

  <!-- ===== ろせんず ===== -->
  <section id="map" class="screen" hidden>
    <h2 class="screen-title">🗺️ かんじ ろせんず</h2>
    <p class="note">えき（かんじ）を おすと、その かんじの ことばが ぜんぶ <ruby>見<rt>み</rt></ruby>られるよ。</p>
    <div class="legend">
      <span><i class="st s0"></i>まだ</span><span><i class="st s1"></i>しゅっぱつ</span>
      <span><i class="st s2"></i>はんぶん</span><span><i class="st s3"></i>マスター</span>
    </div>
    <div id="lines"></div>
  </section>

  <!-- ===== かんじの くわしく ===== -->
  <section id="detail" class="screen" hidden></section>

  <!-- ===== えきスタンプ ===== -->
  <section id="stamps" class="screen" hidden>
    <h2 class="screen-title">🎫 えきスタンプちょう</h2>
    <p class="note">きょうの めあてを クリアすると、スタンプが 1こ もらえるよ。</p>
    <div class="stamp-grid" id="stampGrid"></div>
  </section>

  <!-- ===== くんしょう ===== -->
  <section id="badges" class="screen" hidden>
    <h2 class="screen-title">🏅 くんしょう</h2>
    <div class="badge-list" id="badgeList"></div>
  </section>

  <!-- ===== せってい ===== -->
  <section id="settings" class="screen" hidden>
    <h2 class="screen-title">⚙️ せってい</h2>
    <div class="panel set-row">
      <div>1かいの カードの かず（めあて）</div>
      <div class="seg" id="goalSeg">
        <button data-goal="5">5まい</button><button data-goal="10">10まい</button><button data-goal="15">15まい</button>
      </div>
    </div>
    <div class="panel set-row">
      <div>よみあげ（こえ）</div>
      <div class="seg" id="voiceSeg">
        <button data-voice="1">あり</button><button data-voice="0">なし</button>
      </div>
    </div>
    <div class="panel set-row">
      <div>きろくを ぜんぶ けす</div>
      <button class="danger" id="resetBtn">けす</button>
    </div>
  </section>

</main>

<nav class="bottom" id="bottomNav" hidden>
  <button class="nav-home" data-go="home">🏠 ホームへ</button>
</nav>

<div id="toasts" aria-live="polite"></div>
<div id="overlay" hidden></div>

<script src="data.js?v=4c5eb3f"></script>
<script src="lib.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
