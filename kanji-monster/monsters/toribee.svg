        <rect x="0" y="0" width="512" height="512" filter="url(#pore)" opacity=".2"/>
        <ellipse cx="210" cy="190" rx="110" ry="60" fill="url(#sheen)"/>
        <ellipse cx="330" cy="330" rx="90" ry="70" fill="url(#sheen)" opacity=".55"/>
        <g fill="none" stroke="#08152c" stroke-opacity=".45" stroke-width="2">
          <path d="M362 300 C 380 322 390 348 392 376"/>
          <path d="M376 296 C 392 318 400 344 402 370"/>
        </g>
        <!-- 左上から光が当たっているように、右下を暗くする -->
        <rect x="0" y="0" width="512" height="512" fill="url(#ambient)"/>
        <path d="M216.81 135.19Q225.97 116.53 230.04 98.38L258.88 104.65Q250.74 123.83 243.27 135.19H359.33V232.25H164.38V251.25H410.40V270.76H164.38V290.10H395.81Q392.08 365.78 385.80 387.83Q378.50 412.44 344.74 412.44Q325.73 412.44 304.87 410.06L299.27 383.25Q323.87 387.83 342.36 387.83Q359.50 387.83 362.04 373.24Q367.30 350.17 369.34 309.28H139.78V135.19ZM164.38 154.03V173.71H335.07V154.03ZM164.38 192.20V213.07H335.07V192.20ZM97.36 389.19Q119.24 361.71 130.78 319.80L155.38 328.11Q142.83 373.58 120.60 405.48ZM185.93 399.71Q184.40 363.91 176.59 329.13L200.52 324.89Q209.51 353.73 214.09 393.43ZM255.49 389.53Q245.14 351.52 230.72 325.90L252.27 318.95Q270.25 346.94 280.43 380.20ZM321.15 373.24Q308.60 346.60 287.73 322.17L307.58 311.65Q326.58 331.67 342.70 359.33Z" fill="none" stroke="#dfeeff" stroke-opacity=".5" stroke-width="6"
              transform="translate(-3,-3.5)" filter="url(#soft2)"/>
      </g>
    </g>
    <path d="M216.81 135.19Q225.97 116.53 230.04 98.38L258.88 104.65Q250.74 123.83 243.27 135.19H359.33V232.25H164.38V251.25H410.40V270.76H164.38V290.10H395.81Q392.08 365.78 385.80 387.83Q378.50 412.44 344.74 412.44Q325.73 412.44 304.87 410.06L299.27 383.25Q323.87 387.83 342.36 387.83Q359.50 387.83 362.04 373.24Q367.30 350.17 369.34 309.28H139.78V135.19ZM164.38 154.03V173.71H335.07V154.03ZM164.38 192.20V213.07H335.07V192.20ZM97.36 389.19Q119.24 361.71 130.78 319.80L155.38 328.11Q142.83 373.58 120.60 405.48ZM185.93 399.71Q184.40 363.91 176.59 329.13L200.52 324.89Q209.51 353.73 214.09 393.43ZM255.49 389.53Q245.14 351.52 230.72 325.90L252.27 318.95Q270.25 346.94 280.43 380.20ZM321.15 373.24Q308.60 346.60 287.73 322.17L307.58 311.65Q326.58 331.67 342.70 359.33Z" fill="none" stroke="#0a1428" stroke-opacity=".55" stroke-width="2"/>
