<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mtitle mdesc">
<title id="mtitle">トリベエ（鳥）</title>
<desc id="mdesc">鳥の字が体になった藍色のとり。左上にくちばし、下の「灬」が足と尾ばね。</desc>
<defs>
<linearGradient id="body" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#8fb6e6"/><stop offset=".3" stop-color="#4a72ac"/>
      <stop offset=".68" stop-color="#27436f"/><stop offset="1" stop-color="#141f38"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ffd07a"/><stop offset=".5" stop-color="#eb9a2a"/><stop offset="1" stop-color="#a35d0d"/>
    </linearGradient>
    <radialGradient id="sheen" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity=".5"/><stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="feather" width="16" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <g fill="none" stroke="#08152c" stroke-opacity=".55" stroke-width="1.2">
        <path d="M-8 11 Q0 -1 8 11"/><path d="M8 11 Q16 -1 24 11"/>
        <path d="M-16 5.5 Q-8 -6.5 0 5.5"/><path d="M0 5.5 Q8 -6.5 16 5.5"/><path d="M16 5.5 Q24 -6.5 32 5.5"/>
      </g>
      <g fill="none" stroke="#d9ecff" stroke-opacity=".3" stroke-width=".9">
        <path d="M-8 12.6 Q0 .6 8 12.6"/><path d="M0 7.1 Q8 -4.9 16 7.1"/><path d="M16 7.1 Q24 -4.9 32 7.1"/>
      </g>
    </pattern>
    <filter id="pore" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="4" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.35"/></feComponentTransfer>
    </filter>
    <radialGradient id="e1ball" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fff6e0"/><stop offset="1" stop-color="#7a4f10"/>
    </radialGradient>
    <radialGradient id="e1iris" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffe6a4"/><stop offset=".58" stop-color="#c47a12"/><stop offset="1" stop-color="#1d0e00"/>
    </radialGradient>
<filter id="vol" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="9" result="ib"/>
      <feOffset in="ib" dx="-6" dy="-7" result="dsh"/>
      <feFlood flood-color="#050b18" flood-opacity="0.78" result="dcol"/>
      <feComposite in="dcol" in2="dsh" operator="in" result="d0"/>
      <feComposite in="d0" in2="SourceAlpha" operator="in" result="dark"/>
      <feOffset in="ib" dx="7" dy="8" result="lsh"/>
      <feFlood flood-color="#dfeeff" flood-opacity="0.5" result="lcol"/>
      <feComposite in="lcol" in2="lsh" operator="in" result="l0"/>
      <feComposite in="l0" in2="SourceAlpha" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
<filter id="organic" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="3" seed="27" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
<filter id="drop" x="-25%" y="-25%" width="155%" height="155%" color-interpolation-filters="sRGB"><feDropShadow dx="7" dy="12" stdDeviation="9" flood-color="#1b1408" flood-opacity="0.35"/></filter>
<clipPath id="bodyclip"><path d="M216.81 135.19Q225.97 116.53 230.04 98.38L258.88 104.65Q250.74 123.83 243.27 135.19H359.33V232.25H164.38V251.25H410.40V270.76H164.38V290.10H395.81Q392.08 365.78 385.80 387.83Q378.50 412.44 344.74 412.44Q325.73 412.44 304.87 410.06L299.27 383.25Q323.87 387.83 342.36 387.83Q359.50 387.83 362.04 373.24Q367.30 350.17 369.34 309.28H139.78V135.19ZM164.38 154.03V173.71H335.07V154.03ZM164.38 192.20V213.07H335.07V192.20ZM97.36 389.19Q119.24 361.71 130.78 319.80L155.38 328.11Q142.83 373.58 120.60 405.48ZM185.93 399.71Q184.40 363.91 176.59 329.13L200.52 324.89Q209.51 353.73 214.09 393.43ZM255.49 389.53Q245.14 351.52 230.72 325.90L252.27 318.95Q270.25 346.94 280.43 380.20ZM321.15 373.24Q308.60 346.60 287.73 322.17L307.58 311.65Q326.58 331.67 342.70 359.33Z"/></clipPath>
<linearGradient id="ambient" x1="0" y1="0" x2=".85" y2="1">
  <stop offset="0" stop-color="#050b18" stop-opacity="0"/>
  <stop offset=".55" stop-color="#050b18" stop-opacity=".18"/>
  <stop offset="1" stop-color="#050b18" stop-opacity=".62"/>
</linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>

<g filter="url(#drop)">
  <!-- からだの後ろ -->
  <g filter="url(#vol)" stroke="#0a1428" stroke-opacity=".45" stroke-width="1.5">
    <g fill="#3b5f96">
      <path d="M236 118 C 220 96 216 68 228 44 C 240 62 242 92 246 116 Z"/>
      <path d="M244 112 C 240 84 250 58 270 40 C 272 64 262 92 254 114 Z"/>
      <path d="M252 112 C 256 88 272 66 296 54 C 288 78 272 98 258 116 Z"/>
