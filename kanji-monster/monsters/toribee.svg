      <circle r="11.2" fill="url(#e1iris)"/>
      <g stroke="#000000" stroke-opacity=".35" stroke-width=".7"><line x1="3.4" y1="0.0" x2="10.2" y2="0.0"/><line x1="3.1" y1="1.5" x2="9.2" y2="4.4"/><line x1="2.1" y1="2.7" x2="6.4" y2="8.0"/><line x1="0.8" y1="3.3" x2="2.3" y2="9.9"/><line x1="-0.8" y1="3.3" x2="-2.3" y2="9.9"/><line x1="-2.1" y1="2.7" x2="-6.4" y2="8.0"/><line x1="-3.1" y1="1.5" x2="-9.2" y2="4.4"/><line x1="-3.4" y1="0.0" x2="-10.2" y2="0.0"/><line x1="-3.1" y1="-1.5" x2="-9.2" y2="-4.4"/><line x1="-2.1" y1="-2.7" x2="-6.4" y2="-8.0"/><line x1="-0.8" y1="-3.3" x2="-2.3" y2="-9.9"/><line x1="0.8" y1="-3.3" x2="2.3" y2="-9.9"/><line x1="2.1" y1="-2.7" x2="6.4" y2="-8.0"/><line x1="3.1" y1="-1.5" x2="9.2" y2="-4.4"/></g>
