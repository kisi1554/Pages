      <ellipse cx="-5.1" cy="-5.8" rx="3.7" ry="2.4" fill="#ffffff" opacity=".92" transform="rotate(-28)"/><circle cx="4.8" cy="5.1" r="1.5" fill="#ffffff" opacity=".45"/>
