<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mtitle mdesc">
<title id="mtitle">オニマロ（鬼）</title>
<desc id="mdesc">鬼の字が体になった、一本角の赤おに。上の「田」が顔、右下の「厶」が金棒。</desc>
<defs>
<linearGradient id="body" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#f08662"/><stop offset=".3" stop-color="#d4482c"/>
      <stop offset=".7" stop-color="#9e2417"/><stop offset="1" stop-color="#5f120c"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2=".4" y2="0">
      <stop offset="0" stop-color="#a8916a"/><stop offset="1" stop-color="#fffbee"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#9aa3ad"/><stop offset=".45" stop-color="#5b636d"/>
      <stop offset="1" stop-color="#2c3239"/>
    </linearGradient>
    <radialGradient id="stud" cx="34%" cy="30%" r="70%">
      <stop offset="0" stop-color="#dfe7ee"/><stop offset=".55" stop-color="#7d858f"/><stop offset="1" stop-color="#333940"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9d7a" stop-opacity=".65"/><stop offset="1" stop-color="#ff9d7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="pore" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="4" seed="6"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.5"/></feComponentTransfer>
    </filter>
    <radialGradient id="e1ball" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fff3d2"/><stop offset="1" stop-color="#8a5a12"/>
    </radialGradient>
    <radialGradient id="e1iris" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset=".58" stop-color="#e0a11c"/><stop offset="1" stop-color="#1d0e00"/>
    </radialGradient>
<filter id="vol" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="9" result="ib"/>
      <feOffset in="ib" dx="-6" dy="-7" result="dsh"/>
      <feFlood flood-color="#2a0704" flood-opacity="0.78" result="dcol"/>
      <feComposite in="dcol" in2="dsh" operator="in" result="d0"/>
      <feComposite in="d0" in2="SourceAlpha" operator="in" result="dark"/>
      <feOffset in="ib" dx="7" dy="8" result="lsh"/>
      <feFlood flood-color="#ffdcc8" flood-opacity="0.42" result="lcol"/>
      <feComposite in="lcol" in2="lsh" operator="in" result="l0"/>
      <feComposite in="l0" in2="SourceAlpha" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
<filter id="organic" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
<filter id="drop" x="-25%" y="-25%" width="155%" height="155%" color-interpolation-filters="sRGB"><feDropShadow dx="7" dy="12" stdDeviation="9" flood-color="#1b1408" flood-opacity="0.35"/></filter>
