<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mtitle mdesc">
<title id="mtitle">タツノスケ（竜）</title>
<desc id="mdesc">竜の字がそのまま体になった、うろこのこりゅう。上の「立」が顔、下の「乚」がしっぽ。</desc>
<defs>
<linearGradient id="body" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#63b98c"/><stop offset=".35" stop-color="#2c8a63"/>
      <stop offset=".72" stop-color="#15613f"/><stop offset="1" stop-color="#0a3826"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff6dc"/><stop offset=".5" stop-color="#dcc28a"/><stop offset="1" stop-color="#8f7340"/>
    </linearGradient>
    <radialGradient id="belly" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b7ffd8" stop-opacity=".55"/><stop offset="1" stop-color="#b7ffd8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scales" width="15" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(4)">
      <g fill="none" stroke="#04241a" stroke-opacity=".55" stroke-width="1.2">
        <path d="M-7.5 9 Q0 .5 7.5 9"/><path d="M7.5 9 Q15 .5 22.5 9"/>
        <path d="M-15 4.5 Q-7.5 -4 0 4.5"/><path d="M0 4.5 Q7.5 -4 15 4.5"/><path d="M15 4.5 Q22.5 -4 30 4.5"/>
      </g>
      <g fill="none" stroke="#d6ffe9" stroke-opacity=".3" stroke-width=".9">
        <path d="M-7.5 10.4 Q0 1.9 7.5 10.4"/><path d="M7.5 10.4 Q15 1.9 22.5 10.4"/>
        <path d="M-15 5.9 Q-7.5 -2.6 0 5.9"/><path d="M0 5.9 Q7.5 -2.6 15 5.9"/><path d="M15 5.9 Q22.5 -2.6 30 5.9"/>
      </g>
    </pattern>
    <filter id="pore" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.4"/></feComponentTransfer>
    </filter>
    <radialGradient id="e1ball" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fbf4e2"/><stop offset="1" stop-color="#7a5a2d"/>
    </radialGradient>
    <radialGradient id="e1iris" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".58" stop-color="#d1861c"/><stop offset="1" stop-color="#1d0e00"/>
    </radialGradient>
<filter id="vol" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="9" result="ib"/>
      <feOffset in="ib" dx="-6" dy="-7" result="dsh"/>
      <feFlood flood-color="#03150f" flood-opacity="0.8" result="dcol"/>
      <feComposite in="dcol" in2="dsh" operator="in" result="d0"/>
      <feComposite in="d0" in2="SourceAlpha" operator="in" result="dark"/>
      <feOffset in="ib" dx="7" dy="8" result="lsh"/>
      <feFlood flood-color="#d8ffe9" flood-opacity="0.5" result="lcol"/>
      <feComposite in="lcol" in2="lsh" operator="in" result="l0"/>
      <feComposite in="l0" in2="SourceAlpha" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
<filter id="organic" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="9" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
<filter id="drop" x="-25%" y="-25%" width="155%" height="155%" color-interpolation-filters="sRGB"><feDropShadow dx="7" dy="12" stdDeviation="9" flood-color="#1b1408" flood-opacity="0.35"/></filter>
