  <stop offset=".55" stop-color="#03150f" stop-opacity=".18"/>
  <stop offset="1" stop-color="#03150f" stop-opacity=".62"/>
</linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
