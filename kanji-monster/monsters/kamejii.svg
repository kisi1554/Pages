<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mtitle mdesc">
<title id="mtitle">カメじい（亀）</title>
<desc id="mdesc">亀の字が体になった長老がめ。左上のはらいが首と頭、下の四角が甲羅。こけが生えている。</desc>
<defs>
<linearGradient id="body" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#b39a5e"/><stop offset=".32" stop-color="#8a7238"/>
      <stop offset=".68" stop-color="#5d4a1e"/><stop offset="1" stop-color="#372a10"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbf46"/><stop offset="1" stop-color="#3f6b22"/>
    </linearGradient>
    <radialGradient id="plate" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity=".38"/><stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shellclip"><rect x="120" y="248" width="292" height="170"/></clipPath>
    <pattern id="hex" width="24.2" height="42" patternUnits="userSpaceOnUse">
      <g fill="url(#plate)" stroke="#241a06" stroke-opacity=".75" stroke-width="2.2">
