        <path d="M24.2 28 L36.3 35 L36.3 49 L24.2 56 L12.1 49 L12.1 35 Z"/>
      </g>
      <g fill="none" stroke="#fff0c8" stroke-opacity=".35" stroke-width="1.4">
        <path d="M-12.1 -7 L0 -14 L12.1 -7"/><path d="M12.1 -7 L24.2 -14 L36.3 -7"/>
        <path d="M0 14 L12.1 7 L24.2 14"/><path d="M-12.1 35 L0 28 L12.1 35"/><path d="M12.1 35 L24.2 28 L36.3 35"/>
      </g>
    </pattern>
    <filter id="pore" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="21"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.45"/></feComponentTransfer>
    </filter>
    <radialGradient id="e1ball" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f4ecd6"/><stop offset="1" stop-color="#6b5a33"/>
    </radialGradient>
    <radialGradient id="e1iris" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f6d78a"/><stop offset=".58" stop-color="#8a6a1e"/><stop offset="1" stop-color="#1d0e00"/>
    </radialGradient>
<filter id="vol" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="10" result="ib"/>
      <feOffset in="ib" dx="-7" dy="-8" result="dsh"/>
      <feFlood flood-color="#171003" flood-opacity="0.75" result="dcol"/>
      <feComposite in="dcol" in2="dsh" operator="in" result="d0"/>
      <feComposite in="d0" in2="SourceAlpha" operator="in" result="dark"/>
      <feOffset in="ib" dx="8" dy="9" result="lsh"/>
      <feFlood flood-color="#fff4cf" flood-opacity="0.45" result="lcol"/>
      <feComposite in="lcol" in2="lsh" operator="in" result="l0"/>
      <feComposite in="l0" in2="SourceAlpha" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
<filter id="organic" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="15" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
<filter id="drop" x="-25%" y="-25%" width="155%" height="155%" color-interpolation-filters="sRGB"><feDropShadow dx="7" dy="12" stdDeviation="9" flood-color="#1b1408" flood-opacity="0.35"/></filter>
