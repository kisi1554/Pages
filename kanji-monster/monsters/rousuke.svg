<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mtitle mdesc">
<title id="mtitle">ロウすけ（狼）</title>
<desc id="mdesc">狼の字が体になったおおかみ。左の「けものへん」が顔と前あし、右の「良」がどうたいと後ろあし。</desc>
<defs>
<linearGradient id="body" x1="0" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#a9bdd6"/><stop offset=".3" stop-color="#6b809b"/>
      <stop offset=".68" stop-color="#3c4c64"/><stop offset="1" stop-color="#1e2836"/>
    </linearGradient>
    <radialGradient id="moon" cx="45%" cy="35%" r="60%">
      <stop offset="0" stop-color="#dbeaff" stop-opacity=".5"/><stop offset="1" stop-color="#dbeaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="innerear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a7a0"/><stop offset="1" stop-color="#8c4c4a"/>
    </linearGradient>
    <pattern id="fur" width="14" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <g fill="none" stroke-linecap="round">
        <g stroke="#0c1626" stroke-opacity=".5" stroke-width="1.3">
          <path d="M2 15 C 3.5 10 4.5 6 4 1"/><path d="M8 17 C 9.5 12 10.5 7 10 2"/><path d="M13 14 C 14 9 14.5 5 14 0"/>
        </g>
        <g stroke="#e2eeff" stroke-opacity=".26" stroke-width=".9">
          <path d="M4 16 C 5.5 11 6.5 7 6 2"/><path d="M11 18 C 12 13 13 8 12.5 3"/>
        </g>
      </g>
    </pattern>
    <filter id="pore" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="4" seed="53"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.4"/></feComponentTransfer>
    </filter>
    <radialGradient id="e1ball" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f7f1e4"/><stop offset="1" stop-color="#6a5433"/>
    </radialGradient>
    <radialGradient id="e1iris" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffe3a0"/><stop offset=".58" stop-color="#d08c14"/><stop offset="1" stop-color="#1d0e00"/>
    </radialGradient>
<filter id="vol" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="9" result="ib"/>
      <feOffset in="ib" dx="-6" dy="-7" result="dsh"/>
      <feFlood flood-color="#050a12" flood-opacity="0.8" result="dcol"/>
      <feComposite in="dcol" in2="dsh" operator="in" result="d0"/>
      <feComposite in="d0" in2="SourceAlpha" operator="in" result="dark"/>
      <feOffset in="ib" dx="7" dy="8" result="lsh"/>
      <feFlood flood-color="#e6f1ff" flood-opacity="0.55" result="lcol"/>
      <feComposite in="lcol" in2="lsh" operator="in" result="l0"/>
      <feComposite in="l0" in2="SourceAlpha" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
<filter id="organic" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="41" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
<filter id="drop" x="-25%" y="-25%" width="155%" height="155%" color-interpolation-filters="sRGB"><feDropShadow dx="7" dy="12" stdDeviation="9" flood-color="#1b1408" flood-opacity="0.35"/></filter>
