<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんじモンスター ずかん</title>
<meta name="description" content="かんじの かたちが そのまま いきものに なった、5ひきの かんじモンスターの ずかんです。">
<meta name="theme-color" content="#2c8a63">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --paper:   #f7f1e3;
    --paper2:  #efe6d2;
    --card:    #fffdf7;
    --ink:     #2a2318;
    --ink-soft:#6b5f4a;
    --line:    #d9cbac;
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 4vh 16px calc(40px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 80% at 50% 0%, #fffaf0 0%, transparent 60%),
      linear-gradient(170deg, var(--paper) 0%, var(--paper2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "游ゴシック体",
                 "Meiryo", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 900px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 26px; }

  h1 {
    margin: 0;
    font-size: clamp(26px, 7vw, 42px);
    letter-spacing: .08em;
    line-height: 1.3;
  }

  .rail {
    width: 140px; height: 8px; margin: 14px auto 0; border-radius: 99px;
    background: repeating-linear-gradient(90deg, #2c8a63 0 16px, transparent 16px 24px);
  }

  .sub { margin: 14px 0 0; font-size: clamp(14px, 4vw, 17px); color: var(--ink-soft); line-height: 1.7; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
    margin-top: 28px;
  }

  /* 1ひき = このブロック1つ */
  .card {
    appearance: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px 16px 20px;
    min-height: 300px;
    border: 3px solid var(--line);
    border-left: 10px solid var(--accent);
    border-radius: 22px;
    background: var(--card);
    color: inherit;
    font: inherit;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.06), 0 10px 24px rgba(80,60,20,.10);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0,0,0,.06), 0 14px 30px rgba(80,60,20,.16); }
  .card:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,.06); }
  .card:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

  .card img { width: 100%; max-width: 210px; height: auto; aspect-ratio: 1 / 1; }

  .name { font-size: clamp(20px, 5.5vw, 26px); font-weight: 700; letter-spacing: .04em; }

  .kanji {
    display: inline-block;
    margin-top: 2px;
    padding: 3px 12px;
    border-radius: 99px;
    background: var(--tint);
    color: #3a3120;
    font-size: 15px;
  }

  ruby rt { font-size: .5em; letter-spacing: .04em; }

  /* くわしく見る画面 */
  dialog {
    width: min(560px, 92vw);
    padding: 0;
    border: 3px solid var(--line);
    border-radius: 24px;
    background: var(--card);
    color: var(--ink);
  }
  dialog::backdrop { background: rgba(40, 32, 18, .55); }

  .sheet { padding: 20px 20px 24px; text-align: center; }
  .sheet img { width: min(300px, 70vw); height: auto; aspect-ratio: 1 / 1; }
  .sheet h2 { margin: 6px 0 0; font-size: clamp(22px, 6vw, 30px); letter-spacing: .04em; }
  .sheet .kanji { font-size: 16px; }
  .sheet p { margin: 14px 4px 0; font-size: clamp(15px, 4vw, 17px); line-height: 1.9; text-align: left; }

  .close {
    margin-top: 20px;
    padding: 14px 40px;
    min-height: 56px;
    border: none;
    border-radius: 99px;
    background: var(--accent, #2c8a63);
    color: #fff;
    font: inherit;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .08em;
    cursor: pointer;
  }
  .close:active { transform: translateY(2px); }

  .note { margin-top: 30px; font-size: 13px; color: var(--ink-soft); line-height: 1.9; text-align: center; }
  .note a { color: #2c6f8a; }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>かんじモンスター ずかん</h1>
    <div class="rail"></div>
    <p class="sub">
      かんじの かたちが、そのまま いきものに なりました。<br>
      さわると くわしく みられるよ。
    </p>
  </header>

  <div class="grid" id="grid"></div>

  <p class="note">
    5ひきとも、<ruby>字<rt>じ</rt></ruby>の かたちは そのままです。<br>
    おとなの方へ：各モンスターは単体の SVG ファイル（<code>monsters/*.svg</code>）です。
  </p>
</div>

<dialog id="sheet">
  <div class="sheet" id="sheetBody"></div>
</dialog>

<script>
"use strict";

// 1ひき = この配列の1つ。ふやすときは まるごと コピーする
const MONSTERS = [
  {
    file: "tatsunosuke", name: "タツノスケ", kanji: "竜", yomi: "りゅう",
    accent: "#2c8a63", tint: "#e2f3ea",
    about: "「竜」の うえの ぶぶんが かお、したの まがった せんが しっぽ。" +
           "こけみたいな みどりの うろこと、ながい ひげが じまん。" +
           "おこると しっぽで じめんを たたくけれど、すぐに ごきげんが なおる。"
  },
  {
    file: "onimaro", name: "オニマロ", kanji: "鬼", yomi: "おに",
    accent: "#c04529", tint: "#fbe6df",
    about: "「鬼」の うえの しかくが かお。てっぺんの はらいが、いっぽんの つの。" +
           "みぎしたの 「厶」は、じつは かなぼう。" +
           "こわい かおを しているけど、ほんとうは ないてる こが きらい。"
  },
  {
    file: "kamejii", name: "カメじい", kanji: "亀", yomi: "かめ",
    accent: "#8a7238", tint: "#f1ead6",
    about: "「亀」の ひだりうえの はらいが くびと あたま、したの しかくが こうら。" +
           "こうらは ろっかくの いたが ならんでいて、こけまで はえている。" +
           "ひゃくねん いきていて、みんなの はなしを ゆっくり きいてくれる。"
  },
  {
    file: "toribee", name: "トリベエ", kanji: "鳥", yomi: "とり",
    accent: "#3b5f96", tint: "#e4ecf8",
    about: "「鳥」の ひだりに くちばし、あたまに とさか。" +
           "したの てんてん（灬）が あしと おばね。" +
           "あさ いちばんに おきて、みんなを おこしに くる はやおきの とり。"
  },
  {
    file: "rousuke", name: "ロウすけ", kanji: "狼", yomi: "おおかみ",
    accent: "#4a5d78", tint: "#e6ebf3",
    about: "ひだりの けものへんが かお。うえの とがった ところが みみ。" +
           "みぎの 「良」が からだと うしろあしで、しっぽは ふさふさ。" +
           "つきの よるは とおくを みて、しずかに とおぼえする。"
  }
];

const grid = document.getElementById("grid");
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");

for (const m of MONSTERS) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card";
  card.style.setProperty("--accent", m.accent);
  card.style.setProperty("--tint", m.tint);
  card.innerHTML =
    '<img src="monsters/' + m.file + '.svg" alt="' + m.name + '" width="512" height="512" loading="lazy">' +
    '<span class="name">' + m.name + '</span>' +
    '<span class="kanji"><ruby>' + m.kanji + '<rt>' + m.yomi + '</rt></ruby> の モンスター</span>';
  card.addEventListener("click", () => openSheet(m));
  grid.appendChild(card);
}

function openSheet(m) {
  sheet.style.setProperty("--accent", m.accent);
  sheetBody.innerHTML =
    '<img src="monsters/' + m.file + '.svg" alt="' + m.name + '" width="512" height="512">' +
    '<h2>' + m.name + '</h2>' +
    '<span class="kanji" style="background:' + m.tint + '"><ruby>' + m.kanji + '<rt>' + m.yomi + '</rt></ruby> の モンスター</span>' +
    '<p>' + m.about + '</p>' +
    '<button type="button" class="close">とじる</button>';
  sheetBody.querySelector(".close").addEventListener("click", () => sheet.close());
  if (typeof sheet.showModal === "function") { sheet.showModal(); } else { sheet.setAttribute("open", ""); }
}

// せなかを さわっても とじる
sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
</script>
</body>
</html>
