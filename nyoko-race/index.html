<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>にょこすけ レース</title>
<meta name="description" content="いもむしの にょこすけと おともだちが かけっこ！ れんだで すすんで、いしを ジャンプ、🍠で おならダッシュ。">
<meta name="theme-color" content="#3f7f25">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<link rel="stylesheet" href="style.css?v=ba97f93">
</head>
<body>
<div id="app">

  <header class="bar">
    <a class="barbtn" id="homeBtn" href="../" aria-label="あそびメニューへ">🏠</a>
    <button class="barbtn" id="quitBtn" type="button" aria-label="レースを やめる" hidden>⬅</button>
    <div class="bartitle" id="barTitle">にょこすけ レース</div>
    <div class="prog" id="prog" hidden aria-hidden="true">
      <div class="prog-track" id="progTrack"><span class="prog-goal">🏁</span></div>
    </div>
    <div class="rank" id="rankBadge" hidden aria-live="polite"></div>
    <button class="barbtn" id="soundBtn" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="count" id="count" aria-live="assertive"></div>
  </div>

  <div class="controls" id="controls">
    <div class="lpad">
      <button class="ctl jump" id="jumpBtn" type="button"><span class="ic">⤴️</span><span>ジャンプ</span></button>
      <button class="ctl fart" id="fartBtn" type="button" disabled><span class="ic">🍠</span><span>ぷっ！</span><b id="imoNum">0</b></button>
    </div>
    <div class="rpad">
      <button class="ctl step" id="stepBtn" type="button"><span class="ic">🐛</span><span>にょこ<br>にょこ</span></button>
    </div>
  </div>

  <!-- タイトル -->
  <section class="screen" id="title">
    <div class="sheet">
      <h1 class="logo"><span class="l1">にょこすけ</span><span class="l2">レース</span><span class="flag">🏁</span></h1>
      <p class="lead">にょこすけと おともだちの かけっこ！<br>いちばんに ゴール できるかな？</p>

      <h2 class="h2">でる こ</h2>
      <div class="chars" id="chars"></div>

      <h2 class="h2">はやさ</h2>
      <div class="diffs" id="diffs"></div>

      <h2 class="h2">コースを えらんで スタート！</h2>
      <div class="courses" id="courses"></div>

      <details class="howto">
        <summary>あそびかた</summary>
        <ul>
          <li><b>にょこにょこ</b> ボタンを おすと すすむ。<b>れんだ</b> すると もっと はやい！</li>
          <li>いしが きたら <b>ジャンプ</b>。ぶつかると くらくら…</li>
          <li><b>🍠</b> を ひろったら <b>ぷっ！</b> で おならダッシュ！</li>
          <li>🍄 に のると ぼよーんと とぶ。💧 みずたまりは のろのろ。</li>
          <li>キーボード: スペース・→ で すすむ ／ ↑ で ジャンプ ／ F で ぷっ！</li>
        </ul>
      </details>
      <p class="stats" id="stats"></p>
    </div>
  </section>

  <!-- けっか -->
  <section class="screen" id="result" hidden>
    <div class="sheet">
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="result-sub" id="resultSub"></p>
      <ol class="podium" id="podium"></ol>
      <div class="result-btns">
        <button class="big go" id="againBtn" type="button">🔁 もういちど</button>
        <button class="big ghost" id="backBtn" type="button">コースを えらぶ</button>
      </div>
    </div>
  </section>

</div>
<script src="game.js?v=ba97f93"></script>
</body>
</html>
