<style>

<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

function tone(f, t0, dur, type = 'sine', vol = .18, f2) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(t0, dur, vol = .12, f1 = 400, f2 = 1600) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + t0, n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; fl.type = 'bandpass'; fl.Q.value = 1.2; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur * .5);
  fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .3); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(fl).connect(g).connect(a.destination); s.start(t); s.stop(t + dur);
}

function buildRoute(course) {
  const nodes = [];
  course.legs.forEach(([lid, from, to], li) => {
    const s = LINES[lid].stops, a = s.indexOf(from), b = s.indexOf(to);
    const seg = a < b ? s.slice(a, b + 1) : s.slice(b, a + 1).reverse();
    seg.forEach((n, i) => { if (li > 0 && i === 0) { nodes[nodes.length - 1].next = lid; return; } nodes.push({ n, leg: li, line: lid, next: lid }); });
  });
  const names = course.stops || nodes.map(x => x.n);
  let from = 0;
  const stops = names.map(n => { const i = nodes.findIndex((x, j) => j >= from && x.n === n); from = i; return i; });
  return { nodes, stops };
}

  let extra = '';

    <path d="M${40 - w} 60 l-12 -8 M${40 + w} 60 l12 -8" stroke="#8d5524" stroke-width="2.5"/>`;
  else extra = `<rect x="${40 - w * .5}" y="56" width="${w}" height="5" rx="2" fill="#f2c94c"/><circle cx="40" cy="70" r="2" fill="#f2c94c"/>`;
  if (mode === 'sweat') extra += `<path class="sweat" d="M17 22 q-4 6 0 8 q4 -2 0 -8z" fill="#4dabf7"/><path class="sweat" style="animation-delay:.5s" d="M63 26 q-4 6 0 8 q4 -2 0 -8z" fill="#4dabf7"/>
    <circle cx="30" cy="38" r="4" fill="#ff8787" opacity=".7"/><circle cx="50" cy="38" r="4" fill="#ff8787" opacity=".7"/>`;
  const mouth = mode === 'sweat' ? '<ellipse cx="40" cy="41" rx="4" ry="3" fill="#c92a2a"/>' : '<path d="M34 39 q6 6 12 0" stroke="#5c3b1e" stroke-width="2" fill="none"/>';
  return `<svg viewBox="0 0 80 88">
    <ellipse cx="40" cy="84" rx="${w + 4}" ry="3.5" fill="#000" opacity=".12"/>
    <ellipse cx="40" cy="64" rx="${w}" ry="21" fill="${body}" stroke="${st}" stroke-width="2"/>
    <circle cx="40" cy="33" r="15" fill="${face}" stroke="${snow ? '#9fb7cc' : '#d8a27a'}" stroke-width="2"/>
    <circle cx="34" cy="31" r="2.2" fill="#222"/><circle cx="46" cy="31" r="2.2" fill="#222"/>${mouth}

function trainSVG(color, w = 46) {

    <path d="M-22 -6 h24 q14 0 20 6 q-6 6 -20 6 h-24 q-2 0 -2 -2 v-8 q0 -2 2 -2z" fill="#fff" stroke="#34495e" stroke-width="1.4"/>
    <path d="M-24 1 h28 q10 0 16 1 q-6 4 -18 4 h-24 q-2 0 -2 -2z" fill="${color}"/>

}

/* ---- ちず ---- */
let G = null, CAM = null;
function setupMap() {
  const gp = $('gPref'); gp.innerHTML = '';
  for (const p of PREFECTURES) {
    if (p.code === 47) continue;
    const e = document.createElementNS(SVGNS, 'path'); e.setAttribute('d', p.path); e.setAttribute('class', 'pref'); e.id = 'pf' + p.code;
    gp.appendChild(e);
  }
  const gl = $('gLines'); gl.innerHTML = '';
  for (const [id, l] of Object.entries(LINES)) {
    const e = document.createElementNS(SVGNS, 'polyline');
    e.setAttribute('points', l.stops.map(n => ST[n].xy.join(',')).join(' '));
    Object.entries({ fill: 'none', stroke: l.color, 'stroke-width': 3, 'stroke-opacity': .28, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' })
      .forEach(([k, v]) => e.setAttribute(k, v));

}
function el(tag, attrs, parent, text) {

}
function drawRoute() {
  const g = $('gRoute'); g.innerHTML = '';
  G.course.legs.forEach((leg, li) => {
    const i0 = G.nodes.findIndex(x => x.leg === li), i1 = G.nodes.length - 1 - [...G.nodes].reverse().findIndex(x => x.leg === li);
    const pts = G.nodes.slice(Math.max(0, i0 - (li > 0 ? 1 : 0)), i1 + 1);
    el('polyline', { points: pts.map(x => ST[x.n].xy.join(',')).join(' '), fill: 'none', stroke: LINES[leg[0]].color, 'stroke-width': 5,
      'stroke-dasharray': '2 7', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .8 }, g);
  });
  G.done = el('polyline', { points: '', fill: 'none', stroke: '#c0392b', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .85 }, g);
  G.detourLine = el('polyline', { points: '', fill: 'none', stroke: '#868e96', 'stroke-width': 4, 'stroke-dasharray': '6 5', 'stroke-linecap': 'round' }, g);
}
function drawDots() {
  const g = $('gDots'); g.innerHTML = '';
  G.stops.forEach((ni, k) => {
    const s = ST[G.nodes[ni].n], [x, y] = s.xy;
    const passed = k <= G.k, next = k === G.k + 1 && G.phase !== 'goal';
    const big = k === 0 || k === G.stops.length - 1 || G.course.kind === 'main';
    el('circle', { cx: x, cy: y, r: big ? 6 : 4.5, fill: passed ? '#fff' : '#e9eef3', stroke: passed ? '#c0392b' : '#7b8a99', 'stroke-width': 2.5 }, g);
    if (next) {

      el('text', { x, y: y - 13, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 900, fill: '#fff' }, q, '？');
    } else if (passed && (k === G.k || big || k === 0)) {

      el('text', { x, y: y + 29, 'font-size': 13, 'text-anchor': 'middle', class: 'lbl' }, g, s.n);

}
function drawPrefNames() {
  const g = $('gPrefName'); g.innerHTML = '';
  for (const p of PREFECTURES) {
    if (p.code === 47) continue;

}
function colorPref(code, color) {
  const e = $('pf' + code); if (!e) return;
  e.classList.add('got'); e.style.fill = color;
}
function setBlink(code) {
  document.querySelectorAll('.pref.blink').forEach(e => e.classList.remove('blink'));
  const e = code && $('pf' + code); if (e) e.classList.add('blink');
}
function drawTrain() {
  const g = $('gTrain'); const [x, y] = G.pos;
  g.innerHTML = `<g transform="translate(${x},${y - 11}) scale(${G.face},1)">${trainSVG(LINES[G.line].color)}</g>`;
}
let camToken = 0;
function camLoop(tok) {
  if (!G || tok !== camToken) return;
  const svg = $('map'), W = svg.clientWidth || 300, H = svg.clientHeight || 300, asp = W / H;
  let tw, th, cx, cy;
  if (G.fit) { const f = G.fit; tw = Math.max(f.w, f.h * asp); th = tw / asp; cx = f.cx; cy = f.cy; }
  else { const base = 400; tw = asp >= 1 ? base * asp : base; th = tw / asp; [cx, cy] = G.pos; if (G.lookAhead) { cx += G.lookAhead[0] * .5; cy += G.lookAhead[1] * .5; } }
  if (!CAM) CAM = { cx, cy, w: tw };
  CAM.cx += (cx - CAM.cx) * .12; CAM.cy += (cy - CAM.cy) * .12; CAM.w += (tw - CAM.w) * .08;
  const w = CAM.w, h = w / asp;
  svg.setAttribute('viewBox', `${(CAM.cx - w / 2).toFixed(1)} ${(CAM.cy - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  requestAnimationFrame(() => camLoop(tok));
}
function fitNodes(names) {
  const xs = names.map(n => ST[n].xy[0]), ys = names.map(n => ST[n].xy[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: (x1 - x0) + 120, h: (y1 - y0) + 120 };
}
// polyline に そって でんしゃを うごかす
function moveAlong(names, dur, onPass) {
  return new Promise(res => {
    const pts = names.map(n => ST[n].xy), seg = [0];
    for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = seg[seg.length - 1] || 1, t0 = performance.now(); let passed = 0;
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const step = now => {
      if (!G) return res();
      const t = Math.min(1, (now - t0) / dur), d = ease(t) * L;
      let i = 1; while (i < seg.length - 1 && seg[i] < d) i++;
      const a = pts[i - 1], b = pts[i], u = seg[i] - seg[i - 1] ? (d - seg[i - 1]) / (seg[i] - seg[i - 1]) : 1;
      G.pos = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
      if (Math.abs(b[0] - a[0]) > .5) G.face = b[0] >= a[0] ? 1 : -1;
      while (passed < pts.length && seg[passed] <= d + .01) { onPass && onPass(passed); passed++; }
      drawTrain();
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

/* ---- ゲーム ---- */
function start(course) {
  show('play');
  const r = buildRoute(course);
  G = { course, nodes: r.nodes, stops: r.stops, k: 0, mistakes: 0, hints: 0, eaten: 0, food: [], gotPref: new Set(),
    mode: 'normal', phase: 'ask', pos: ST[r.nodes[0].n].xy.slice(), face: 1, line: r.nodes[0].line, fit: null, run: Symbol() };
  CAM = null;
  setupMap(); drawPrefNames(); drawRoute(); drawDots(); drawTrain();
  $('snow').innerHTML = '';
  $('title').textContent = '🍱 ' + (course.title || kana(lineR(course.legs[0][0])));
  const tok = ++camToken; requestAnimationFrame(() => camLoop(tok));
  const first = r.nodes[0].n;
  colorPref(ST[first].p, LINES[G.line].color);
  G.doneNames = [first];
  updateProg();
  if (first === '新青森') {
    G.mode = 'snow'; drawCond(true); makeSnow(true);
    talk(`さむ〜い！ ${stR(first)}は ゆきだよ。しゃしょうさんが ゆきだるまに なっちゃった！`, true);
  } else {
    drawCond();
    talk(`${stR(first)}から しゅっぱつ！ ${stR(courseTo(course))}まで いくよ`, true);
  }
  const run = G.run;
  setTimeout(() => { if (G && G.run === run) nextStep(); }, 2600);
  $('choices').innerHTML = ''; $('tools').innerHTML = '';
}
function makeSnow(on) {
  const s = $('snow'); s.innerHTML = '';
  if (!on) return;
  for (let i = 0; i < 26; i++) {
    const f = document.createElement('i');
    f.style.left = Math.random() * 100 + '%'; f.style.animationDuration = 3 + Math.random() * 4 + 's';
    f.style.animationDelay = -Math.random() * 6 + 's'; const z = 4 + Math.random() * 6; f.style.width = f.style.height = z + 'px';
    s.appendChild(f);
  }
}
function updateProg() {
  const n = G.stops.length - 1, left = n - G.k;
  $('progT').innerHTML = left > 0 ? `あと ${left}えき` : 'ゴール！';
  $('progB').style.width = (G.k / n * 100) + '%';
}
const curNode = () => G.nodes[G.stops[G.k]];
function nextStep() {
  if (!G) return;
  const node = curNode();
  if (G.k >= G.stops.length - 1) return goal();
  const xf = TRANSFER[node.n];
  if (G.course.legs.length > 1 && xf && node.next !== node.line && !G.xferDone) return askTransfer(node.n, xf);
  askStation();
}

// つぎの えきは？
function pickChoices(ans, cur) {
  const a = ST[ans];
  const ok = n => n !== ans && n !== cur && ST[n].p !== a.p && ST[n].y !== a.y;
  const all = Object.keys(ST).filter(ok);
  const kanji = ch => /[一-鿿]/.test(ch);
  const share = (n, f) => [...n].some(ch => kanji(ch) && f(ch) && ans.includes(ch));
  let p1 = all.filter(n => share(n, ch => HL[ch]));
  if (!p1.length) p1 = all.filter(n => share(n, ch => ch !== '新'));
  if (!p1.length) p1 = all.filter(n => share(n, () => true));
  if (!p1.length) p1 = all;
  const c1 = rand(p1);
  const route = G.nodes.map(x => x.n).filter(n => ok(n) && n !== c1 && ST[n].p !== ST[c1].p);
  const p2 = route.length ? route : all.filter(n => n !== c1 && ST[n].p !== ST[c1].p);
  return shuffle([ans, c1, rand(p2)]);
}
function askStation() {
  G.phase = 'ask'; G.xferDone = false;
  const cur = curNode().n, ans = G.nodes[G.stops[G.k + 1]].n, easy = SAVE.lv === 'easy';
  G.ans = ans; G.helped = easy;
  drawDots();
  setBlink(easy ? ST[ans].p : 0);
  G.lookAhead = [ (ST[ans].xy[0] - ST[cur].xy[0]), (ST[ans].xy[1] - ST[cur].xy[1]) ];
  talk(easy ? `つぎの えきは どれかな？<br>${prefR(ST[ans].p)}の えきだよ` : 'つぎの えきは どれかな？', 'つぎの えきは どれかな？');
  const box = $('choices'); box.innerHTML = '';
  for (const n of pickChoices(ans, cur)) {
    const b = document.createElement('button'); b.className = 'ch';
    b.innerHTML = `<span class="nm">${stHTML(n)}</span>${easy ? `<span class="pf">${R(prefR(ST[n].p))}</span>` : ''}`;
    b.onclick = () => answer(n, b);
    box.appendChild(b);
  }
  $('tools').innerHTML = '';
  const h = document.createElement('button'); h.className = 'tbtn'; h.textContent = '💡 ヒント';
  h.onclick = () => {
    sfx.tap(); G.hints++; setBlink(ST[ans].p); G.helped = true;
    talk(`つぎは「${ST[ans].y}」だよ。${prefR(ST[ans].p)}の えき`, `つぎは ${ST[ans].y}`);
  };
  $('tools').appendChild(h);
}
async function answer(n, btn) {
  if (G.phase !== 'ask' || btn.classList.contains('ng')) return;
  const run = G.run;
  if (n !== G.ans) {
    G.mistakes++; sfx.ng(); btn.classList.add('ng', 'shake');
    talk(`ざんねん！ ${stR(n)}は ${prefR(ST[n].p)}の えき。もういちど！`, `ざんねん。もういちど`);
    if (!G.helped) { setBlink(ST[G.ans].p); G.helped = true; }
    return;
  }
  G.phase = 'move'; sfx.ok(); btn.classList.add('ok');
  document.querySelectorAll('#choices .ch').forEach(b => b.disabled = true);
  say(`せいかい！ ${ST[n].y}`);
  talk(`せいかい！ ${stR(n)}！ しゅっぱつ しんこう！`);
  await sleep(700); if (!G || G.run !== run) return;
  setBlink(0); $('choices').innerHTML = ''; $('tools').innerHTML = '';
  const i0 = G.stops[G.k], i1 = G.stops[G.k + 1];
  const names = G.nodes.slice(i0, i1 + 1).map(x => x.n);
  G.line = G.nodes[i1].line; G.lookAhead = null; drawTrain();
  const dur = Math.min(3200, Math.max(1300, names.length * 260 + 700));
  sfx.run(dur / 1000);
  const melt = G.mode === 'snow';
  await moveAlong(names, dur, i => {
    const nd = G.nodes[i0 + i];
    colorPref(ST[nd.n].p, LINES[nd.line].color);
    if (i > 0) { G.doneNames.push(nd.n); G.done.setAttribute('points', G.doneNames.map(x => ST[x].xy.join(',')).join(' ')); }
  });
  if (!G || G.run !== run) return;
  G.k++; updateProg(); drawDots(); sfx.arrive();
  if (melt) { G.mode = 'normal'; makeSnow(false); }
  // えきべん
  const p = ST[n].p, foods = DATA.foods[p];
  const last = G.k >= G.stops.length - 1;
  if (foods && !G.gotPref.has(p)) {
    G.gotPref.add(p);
    const fresh = foods.map((f, i) => i).filter(i => !SAVE.foods[foodKey(p, i)]);
    const fi = fresh.length ? fresh[0] : Math.floor(Math.random() * foods.length);
    const [fn, fe] = foods[fi];
    const isNew = !SAVE.foods[foodKey(p, fi)];
    SAVE.foods[foodKey(p, fi)] = 1; save();
    G.food.push(fe); G.eaten++;
    $('pop').innerHTML = `<div class="t1">${R(stR(n))}の えきべん${isNew ? ' 🆕' : ''}</div><div class="big">${fe}</div><div class="t2">${fn}</div><div class="t1">${R(prefR(p))}の めいぶつ</div>`;
    $('pop').classList.add('on');
    talk(`${stR(n)}に とうちゃく！ ${fn}を ゲット！`, `${ST[n].y}に とうちゃく。${fn}を ゲット`);
    await sleep(1500); if (!G || G.run !== run) return;
    $('pop').classList.remove('on'); sfx.eat(); drawCond(true);
    const fat = ['もぐもぐ… おいしい！', 'もぐもぐ… しゃしょうさん、ちょっと まるく なった？', 'ぱくぱく！ おなかが ぽっこり', 'まだ たべる〜！ ボタンが きつい', 'ころころ しゃしょうさん！'];
    talk(melt ? 'ゆきが とけた！ あったかい えきべんで げんき いっぱい！' : fat[Math.min(G.eaten - 1, fat.length - 1)]);
    await sleep(last ? 900 : 1300);
  } else {
    drawCond();
    talk(`${stR(n)}に とうちゃく！${melt ? ' ゆきが とけたよ' : ''}`, `${ST[n].y}に とうちゃく`);
    await sleep(last ? 800 : 1100);
  }
  if (!G || G.run !== run) return;
  nextStep();
}

// のりかえ
function askTransfer(at, xf, disabled = []) {
  G.phase = 'xfer';
  setBlink(0); drawDots();
  G.lookAhead = null;
  talk(`${stR(at)}で のりかえ！<br>つぎは ${placeR(xf.want)}に いきたいな。どの しんかんせんに のる？`, `${ST[at].y}で のりかえ。つぎは ${PLACE[xf.want]}に いきたいな`);
  const box = $('choices'); box.innerHTML = ''; $('tools').innerHTML = '';
  for (const lid of shuffle(Object.keys(xf.dir))) {
    const b = document.createElement('button'); b.className = 'ch pick';
    b.innerHTML = `<svg class="tr" viewBox="-30 -12 60 24">${trainSVG(LINES[lid].color, 50)}</svg>
      <span class="ln">${R(lineR(lid))}<small>${R(dirR(xf.dir[lid]))} ほうめん</small></span>`;
    if (disabled.includes(lid)) b.classList.add('ng');
    b.onclick = () => transferPick(at, xf, lid, b, disabled);
    box.appendChild(b);
  }
}
async function transferPick(at, xf, lid, btn, disabled) {
  if (G.phase !== 'xfer' || btn.classList.contains('ng')) return;
  const run = G.run;
  document.querySelectorAll('#choices .ch').forEach(b => b.disabled = true);
  if (lid === xf.ok) {
    sfx.ok(); btn.classList.add('ok');
    talk(`せいかい！ ${lineR(lid)}に のりかえ！`, `せいかい。${LINES[lid].yomi}しんかんせんに のりかえ`);
    G.line = lid; drawTrain(); G.xferDone = true;
    await sleep(1300); if (!G || G.run !== run) return;
    return askStation();
  }
  // まちがい → ちがう ほうへ いっちゃう
  G.mistakes++; sfx.tap(); btn.classList.add('ok');
  G.phase = 'detour';
  const to = xf.wrong[lid], s = LINES[lid].stops, a = s.indexOf(at), b = s.indexOf(to);
  const names = a < b ? s.slice(a, b + 1) : s.slice(b, a + 1).reverse();
  G.line = lid; drawTrain();
  talk(`${lineR(lid)}で しゅっぱつ〜！`);
  await sleep(600); if (!G || G.run !== run) return;
  $('choices').innerHTML = '';
  sfx.run(2.2);
  const dn = [];
  await moveAlong(names, 2200, i => { dn.push(names[i]); G.detourLine.setAttribute('points', dn.map(x => ST[x].xy.join(',')).join(' ')); });
  if (!G || G.run !== run) return;
  sfx.oops();
  const back = to === '東京' || to === '新大阪';
  talk(`あれれ？ ${placeR(to)}に ${back ? 'もどっちゃった' : 'きちゃった'}！<br>ここは ${prefR(ST[to].p)}。${lineR(lid)}は ${placeR(xf.dir[lid].split('・').pop())} ほうめん だったね`,
    `あれれ。${ST[to].y}に ${back ? 'もどっちゃった' : 'きちゃった'}`);
  const box = $('choices');
  const bt = document.createElement('button'); bt.className = 'tbtn go'; bt.innerHTML = R(`🔙 ${stR(at)}に もどる`);
  bt.onclick = async () => {
    sfx.tap(); bt.disabled = true; sfx.run(1.4);
    await moveAlong(names.slice().reverse(), 1400);
    if (!G || G.run !== run) return;
    G.detourLine.setAttribute('points', '');
    G.line = curNode().line; drawTrain();
    askTransfer(at, xf, disabled.concat(lid));
  };
  box.appendChild(bt);
}

// ゴール
async function goal() {
  G.phase = 'goal'; const run = G.run;
  const to = curNode().n;
  drawDots(); setBlink(0);
  G.fit = fitNodes(G.nodes.map(x => x.n));
  sfx.fan();
  if (to === '鹿児島中央') { G.mode = 'sweat'; drawCond(true); talk(`ゴール！ ${stR(to)}に ついた！ あつ〜い！ しゃしょうさん あせだく！`, `ゴール。${ST[to].y}に ついた。あつーい`); }
  else if (to === '新函館北斗') { G.mode = 'snow'; drawCond(true); makeSnow(true); talk(`ゴール！ ${stR(to)}に ついた！ さむ〜い！ また ゆきだるま！`, `ゴール。${ST[to].y}に ついた`); }
  else { drawCond(true); talk(`ゴール！ ${stR(to)}に ついた！`, `ゴール。${ST[to].y}に ついた`); }
  $('choices').innerHTML = ''; $('tools').innerHTML = '';
  await sleep(2600); if (!G || G.run !== run) return;
  nakama();
}

// なかま あつめ（おなじ 漢字が つく 駅は？）
function nakama() {
  G.phase = 'nakama';
  const route = [...new Set(G.nodes.map(x => x.n))];
  const cnt = ch => route.filter(n => n.includes(ch)).length;
  let ks = Object.keys(HL).filter(ch => cnt(ch) >= 2);
  let pool = route;
  if (!ks.length) { pool = Object.keys(ST); ks = Object.keys(HL); }
  const K = rand(ks);
  let yes = shuffle(pool.filter(n => n.includes(K)));
  if (yes.length < 2) yes = shuffle(Object.keys(ST).filter(n => n.includes(K)));
  yes = yes.slice(0, 3);
  let no = shuffle(pool.filter(n => !n.includes(K)));
  if (no.length < 3) no = shuffle(Object.keys(ST).filter(n => !n.includes(K)));
  no = no.slice(0, 6 - yes.length);
  const cards = shuffle(yes.concat(no));
  let left = yes.length;
  talk(`さいごに なかま あつめ！<br>「<span class="k" style="color:${HL[K]};font-size:1.3em">${K}</span>」が つく えきを ぜんぶ タッチ！（${yes.length}つ）`,
    `さいごに なかま あつめ。おなじ かんじが つく えきを ぜんぶ タッチ`);
  const box = $('choices'); box.innerHTML = '';
  const grid = document.createElement('div'); grid.className = 'nk'; box.appendChild(grid);
  for (const n of cards) {
    const b = document.createElement('button'); b.className = 'ch';
    b.innerHTML = `<span class="nm" style="font-size:clamp(19px,5.4vw,24px)">${stHTML(n, false)}</span>`;
    b.onclick = () => {
      if (b.classList.contains('ok') || b.classList.contains('ng') || G.phase !== 'nakama') return;
      if (n.includes(K)) {
        sfx.pick(); b.classList.add('ok'); say(ST[n].y);
        b.querySelector('.nm').innerHTML = `<ruby>${[...n].map(ch => ch === K ? `<span class="k" style="color:${HL[K]}">${ch}</span>` : ch).join('')}<rt>${ST[n].y}</rt></ruby>`;
        if (--left === 0) { G.phase = 'done'; setTimeout(finish, 900); }
      } else { sfx.ng(); b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 450); }
    };
    grid.appendChild(b);
  }
}

function finish() {
  if (!G) return;
  const err = G.mistakes + G.hints, st = err <= 1 ? 3 : err <= 4 ? 2 : 1;
  G.unlockNow = G.course.id === 'big' && !SAVE.clears.big;
  SAVE.clears[G.course.id] = Math.max(SAVE.clears[G.course.id] || 0, st); SAVE.plays++; save();
  sfx.fan(); say(['すごい！ にっぽん じゅうだん せいこう！', 'やったね！ ゴール！', 'がんばったね！'][3 - st]);
  const c = G.course, unlock = G.unlockNow;
  $('rbox').innerHTML = `<h2>🎉 ゴール！</h2>
    <div class="stars">${stars(st)}</div>
    <p>${R(stR(courseFrom(c)))} → ${R(stR(courseTo(c)))}</p>
    <div style="width:84px;height:92px">${condSVG(G.mode === 'snow' ? 'snow' : G.mode, G.eaten)}</div>
    ${G.food.length ? `<p>たべた えきべん（${G.food.length}こ）</p><div class="foods">${G.food.join('')}</div>` : ''}
    <p>${G.eaten >= 6 ? 'しゃしょうさん、まんまる！ おなか いっぱい！' : G.eaten ? 'おいしかった〜！' : ''}</p>
    ${c.id === 'big' && unlock ? '<p>🎁 ボーナス しんかんせんで あそべるように なったよ！</p>' : ''}
    <button class="wide" id="rAgain">🔁 もういちど</button>
    <button class="wide" id="rHome">🏠 コースを えらぶ</button>`;
  $('result').classList.add('on');
  $('rAgain').onclick = () => { sfx.tap(); $('result').classList.remove('on'); start(c); };
  $('rHome').onclick = () => { sfx.tap(); drawHome(); show('home'); };
  for (let i = 0; i < 18; i++) {
    const f = document.createElement('div'); f.className = 'confetti';
    f.textContent = rand(['🎉', '⭐', '🍱', '🚄', '✨']); f.style.left = Math.random() * 100 + 'vw';
    f.style.animationDelay = Math.random() * 1.2 + 's'; document.body.appendChild(f); setTimeout(() => f.remove(), 4500);
  }
}

drawSnd(); drawHome();
</script>
