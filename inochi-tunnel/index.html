<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>いのちの タイムトンネル</title>
<style>
  :root { --brick:#3a2f4a; --brick2:#4a3d5e; --ink:#2b2238; --gold:#ffd43b; --accent:#2f9e44; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Noto Sans JP", sans-serif;
    color:#fff; user-select:none; -webkit-user-select:none;
    background:
      repeating-linear-gradient(0deg, transparent 0 34px, rgba(0,0,0,.25) 34px 37px),
      repeating-linear-gradient(90deg, var(--brick) 0 70px, var(--brick2) 70px 73px);
    background-color: var(--brick);
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  .screen.on { display: flex; }
  .big {
    min-height: 64px; padding: 12px 28px; border-radius: 999px; font-size: clamp(20px, 5vmin, 30px); font-weight: 800;
    background: var(--gold); color: #4a3200; box-shadow: 0 6px 0 #c99700; letter-spacing: .04em;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99700; }
  .big.sub { background:#fff; color:#3a2f4a; box-shadow: 0 6px 0 #b9b0c9; }
  .hbtn {
    width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.16); font-size: 26px;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none; flex: none;
  }

  /* ---------- タイトル ---------- */
  #title { align-items: center; justify-content: center; gap: clamp(10px, 3vmin, 22px); text-align: center; }
  #title .top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; }
  .logo { width: min(74vmin, 420px); aspect-ratio: 5/3; position: relative; }
  .logo .ring { position: absolute; left: 50%; top: 50%; border: 8px solid; border-radius: 48% 48% 14px 14px / 60% 60% 14px 14px; transform: translate(-50%,-50%); }
  .logo .ring:nth-child(1){ width:100%; height:100%; border-color:#5d4c78; background:#231b30; }
  .logo .ring:nth-child(2){ width:76%; height:78%; border-color:#7a66a0; background:#2d2440; }
  .logo .ring:nth-child(3){ width:52%; height:56%; border-color:#9c88c4; background:#3a5a8a; }
  .logo .ring:nth-child(4){ width:30%; height:34%; border-color:#c5b6e6; background:#8fd3ff; }
  .logo svg { position: absolute; width: 34%; }
  .logo .a1 { left: 4%; bottom: 2%; animation: bob 2.4s ease-in-out infinite; }
  .logo .a2 { right: 2%; bottom: 0; animation: bob 2.8s ease-in-out infinite .4s; }
  h1 { margin: 0; font-size: clamp(26px, 7.4vmin, 48px); line-height: 1.25; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  h1 small { display: block; font-size: .5em; font-weight: 600; opacity: .9; margin-top: 4px; }
  #title .btns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  #titleNote { font-size: clamp(14px, 3.4vmin, 18px); opacity: .9; margin: 0; }

  /* ---------- ゲーム ---------- */
  .hud { display: flex; align-items: center; gap: 8px; flex: none; }
  .eraBox { flex: 1; min-width: 0; text-align: center; line-height: 1.2; }
  .eraName { font-size: clamp(17px, 4.6vmin, 28px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eraWhen { font-size: clamp(12px, 3vmin, 17px); opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 3px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .dots i.done { background: var(--gold); } .dots i.now { background: #fff; transform: scale(1.3); }
  .view {
    flex: 1; min-height: 0; position: relative; overflow: hidden; margin: 6px 0;
    border: 10px solid #6a5890; border-radius: 42% 42% 20px 20px / 16% 16% 20px 20px;
    box-shadow: 0 0 0 5px #231b30, inset 0 0 40px rgba(0,0,0,.45); background: #123; touch-action: none;
  }
  .sky, .ground { position: absolute; left: 0; right: 0; }
  .sky { top: 0; bottom: 0; }
  .ground { bottom: 0; }
  .decor { position: absolute; pointer-events: none; }
  .decor svg, .cr svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bubble { position: absolute; bottom: -20px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); animation: rise 6s linear infinite; pointer-events: none; }
  .cr {
    position: absolute; width: clamp(92px, 29vmin, 200px); padding: 6px; background: none; border-radius: 30px;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,.3));
  }
  .cr .in { display: block; }
  .cr.swim .in { animation: swim 5s ease-in-out infinite; }
  .cr.bob .in { animation: bob 2.6s ease-in-out infinite; }
  .cr.fly .in { animation: fly 4s ease-in-out infinite; }
  .cr.sway .in { animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
  .cr.hint { animation: glow 1s ease-in-out infinite; }
  .cr.found { pointer-events: none; }
  .cr.found::after {
    content: "✓"; position: absolute; right: 2px; top: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 900; font-size: 22px; line-height: 34px; text-align: center; border: 3px solid #fff;
  }
  .cr.pop { animation: pop .5s ease-out; }
  .say {
    position: absolute; left: 50%; top: 8%; transform: translateX(-50%); max-width: 84%; z-index: 30; pointer-events: none;
    background: rgba(255,255,255,.94); color: var(--ink); border-radius: 18px; padding: 8px 16px; text-align: center;
    font-size: clamp(15px, 3.9vmin, 22px); font-weight: 700; line-height: 1.4; box-shadow: 0 3px 0 rgba(0,0,0,.2);
  }
  .say.shake { animation: shake .4s; }
  .foot { display: flex; align-items: center; gap: 10px; flex: none; }
  .slots { display: flex; gap: 8px; flex: 1; justify-content: center; }
  .slot { width: clamp(54px, 15vmin, 80px); aspect-ratio: 1; border-radius: 18px; border: 3px dashed rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(255,255,255,.5); }
  .slot.in { border: 3px solid var(--gold); background: #fff; }
  .slot svg { width: 86%; }
  #nextBtn { min-height: 60px; padding: 8px 20px; opacity: .45; white-space: nowrap; }
  #nextBtn.ready { opacity: 1; animation: pulse 1s ease-in-out infinite; }

  /* ワープ */
  .warp { position: absolute; inset: 0; z-index: 40; background: #140e1f; display: none; align-items: center; justify-content: center; overflow: hidden; }
  .warp.on { display: flex; }
  .warp .wr { position: absolute; left: 50%; top: 50%; width: 60%; height: 70%; margin: -35% 0 0 -30%; margin-top: 0; transform: translate(0,-50%) scale(.1);
    border: 6px solid #a18cd1; border-radius: 46% 46% 12px 12px / 40% 40% 12px 12px; opacity: 0; animation: ring 1.6s linear infinite; }
  .warp .wr:nth-child(2){ animation-delay: .4s; border-color:#fbc2eb; } .warp .wr:nth-child(3){ animation-delay: .8s; border-color:#8fd3ff; } .warp .wr:nth-child(4){ animation-delay: 1.2s; border-color:#ffe066; }
  .warpTxt { position: relative; text-align: center; padding: 0 8%; text-shadow: 0 2px 6px #000, 0 0 12px #000; }
  #warpYear { font-size: clamp(24px, 7vmin, 46px); font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
  #warpCap { font-size: clamp(15px, 3.9vmin, 23px); font-weight: 700; line-height: 1.6; margin-top: 8px; }

  /* カード */
  .modal { position: fixed; inset: 0; z-index: 100; background: rgba(20,14,31,.72); display: none; align-items: center; justify-content: center; padding: 14px; }
  .modal.on { display: flex; }
  .card {
    width: min(92vw, 460px); max-height: 94vh; overflow: auto; background: #fffdf5; color: var(--ink); border-radius: 26px; border: 6px solid var(--gold);
    padding: 14px 18px 18px; text-align: center; animation: pop .35s ease-out;
  }
  .card .tag { display: inline-block; background: var(--accent); color: #fff; border-radius: 999px; padding: 3px 14px; font-size: 15px; font-weight: 800; }
  .card .pic { width: min(56vmin, 250px); margin: 4px auto 0; }
  .card h2 { margin: 2px 0 0; font-size: clamp(22px, 5.6vmin, 30px); }
  .card .sub { font-size: 15px; color: #6b5f7d; font-weight: 700; }
  .card .fact { font-size: clamp(16px, 4.2vmin, 21px); line-height: 1.6; margin: 8px 0; font-weight: 600; }
  .card .when { font-size: clamp(14px, 3.6vmin, 18px); color: #a8480c; font-weight: 800; margin-bottom: 12px; }
  @media (orientation: landscape) and (max-height: 520px) {
    .card { width: min(94vw, 680px); display: grid; grid-template-columns: 38% 1fr; column-gap: 14px; align-items: center; }
    .card .pic { width: 100%; grid-row: 1 / span 6; }
  }

  /* クイズ */
  #quiz, #len, #result { align-items: center; }
  .qHead { font-size: clamp(18px, 4.8vmin, 28px); font-weight: 800; text-align: center; line-height: 1.4; margin: 4px 60px 0; }
  .qMsg { min-height: 1.6em; font-size: clamp(15px, 3.8vmin, 21px); font-weight: 700; color: var(--gold); text-align: center; }
  .qRow { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center; }
  .qRow .lbl { font-size: clamp(12px, 3vmin, 16px); font-weight: 800; writing-mode: vertical-rl; opacity: .9; }
  .qSlots { display: grid; gap: 6px; flex: 1; max-width: 900px; }
  .qSlot { aspect-ratio: 1; border: 3px dashed rgba(255,255,255,.5); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(18px, 5vmin, 30px); font-weight: 900; color: rgba(255,255,255,.5); padding: 3px; min-width: 0; }
  .qSlot.in { background: #fff; border: 3px solid var(--gold); color: var(--ink); animation: pop .4s ease-out; }
  .qSlot svg { width: 78%; }
  .qSlot span { font-size: clamp(9px, 2.3vmin, 14px); font-weight: 800; line-height: 1.15; text-align: center; }
  .qCards { flex: 1; min-height: 0; width: 100%; max-width: 900px; display: grid; gap: 10px; align-content: center; padding: 6px 0; }
  .qCard { background: #fffdf5; color: var(--ink); border-radius: 20px; border: 4px solid #cfc3e6; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 5px 0 rgba(0,0,0,.3); min-width: 0; }
  .qCard svg { width: min(100%, 22vh, 150px); height: auto; }
  .qCard b { font-size: clamp(13px, 3.4vmin, 19px); line-height: 1.2; text-align: center; }
  .qCard.gone { visibility: hidden; }
  .qCard.shake { animation: shake .4s; border-color: #e03131; }
  .corner { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 10px; }
  .cornerR { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 10px; }

  /* ながさくらべ */
  .lenView { width: 100%; flex: 1; min-height: 120px; max-height: 46vh; position: relative; overflow: hidden; border: 8px solid #6a5890; border-radius: 22px; margin: 8px 0; background: #1c1529; }
  .strip { position: absolute; top: 0; bottom: 0; right: 70px; will-change: transform;
    background: repeating-linear-gradient(90deg, #2d2440 0 28px, #3a2f52 28px 30px); }
  .strip .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: #4b3d66; border-top: 4px solid #8f7cc0; }
  .mk { position: absolute; bottom: 26%; transform: translateX(50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
  .mk .pole { width: 4px; height: 26px; background: #fff; }
  .mk b { background: #fff; color: var(--ink); border-radius: 12px; padding: 4px 10px; font-size: clamp(13px, 3.2vmin, 17px); text-align: center; line-height: 1.3; }
  .mk svg { width: clamp(80px, 22vmin, 130px); }
  .tick { position: absolute; bottom: 4%; transform: translateX(50%); font-size: 12px; opacity: .8; white-space: nowrap; }
  .hum { position: absolute; right: 0; bottom: 26%; height: 16px; background: #ff6b6b; border-radius: 3px; box-shadow: 0 0 10px #ff6b6b; }
  #lenYear { font-size: clamp(22px, 6vmin, 40px); font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
  #lenCap { font-size: clamp(16px, 4.1vmin, 23px); font-weight: 700; line-height: 1.6; text-align: center; max-width: 760px; min-height: 4.8em; margin: 0 4px; }

  @media (max-height: 520px) { #lenCap { min-height: 0; font-size: 15px; line-height: 1.4; } .lenView { min-height: 140px; margin: 4px 0; } .mk svg { width: 64px; } .mk .pole { height: 12px; } #len .big { min-height: 48px; padding: 6px 24px; } }
  /* けっか */
  #result { justify-content: center; gap: clamp(8px, 2.6vmin, 18px); text-align: center; }
  #result h2 { margin: 0; font-size: clamp(26px, 7vmin, 46px); color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .stars { font-size: clamp(40px, 12vmin, 80px); letter-spacing: .1em; animation: pop .6s ease-out; }
  #resTxt { font-size: clamp(17px, 4.4vmin, 24px); font-weight: 700; line-height: 1.6; margin: 0; }
  .conf { position: fixed; top: -30px; width: 14px; height: 20px; z-index: 90; pointer-events: none; animation: fall linear forwards; }

  /* ずかん */
  #zukan { z-index: 60; background: #2b2238; }
  #zukan h2 { margin: 0; text-align: center; font-size: clamp(17px, 4.8vmin, 32px); flex: 1; white-space: nowrap; }
  .zBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 2px 20px; }
  .zEra { font-size: clamp(15px, 3.8vmin, 20px); font-weight: 800; margin: 12px 4px 6px; }
  .zGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 760px; margin: 0 auto; }
  .zCell { background: #fffdf5; color: var(--ink); border-radius: 18px; padding: 6px; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(12px, 3vmin, 16px); line-height: 1.2; text-align: center; }
  .zCell svg { width: min(100%, 130px); }
  .zCell.no { background: rgba(255,255,255,.12); color: rgba(255,255,255,.6); font-size: 34px; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }
  @keyframes swim { 0%,100% { transform: translate(-9%, 0) rotate(-3deg); } 50% { transform: translate(9%, -8%) rotate(3deg); } }
  @keyframes fly { 0%,100% { transform: translate(-12%, 0) rotate(-4deg); } 50% { transform: translate(12%, -14%) rotate(4deg); } }
  @keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  @keyframes glow { 0%,100% { filter: drop-shadow(0 0 0 #fff); } 50% { filter: drop-shadow(0 0 16px #fff) drop-shadow(0 0 8px #ffe066); } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -10px; } 75% { margin-left: 10px; } }
  @keyframes rise { to { transform: translateY(-110vh); opacity: 0; } }
  @keyframes ring { 0% { transform: translate(0,-50%) scale(.1); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(0,-50%) scale(3.2); opacity: 0; } }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .cr .in, .logo svg { animation: none !important; } }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- タイトル -->
<section class="screen on" id="title">
  <div class="top">
    <a class="hbtn" href="../" aria-label="メニューへ">🏠</a>
    <button class="hbtn sndBtn" type="button" aria-label="おと">🔊</button>
  </div>
  <div class="logo" aria-hidden="true">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <svg class="a1" id="logoA" viewBox="0 0 120 90"></svg>
    <svg class="a2" id="logoB" viewBox="0 0 120 90"></svg>
  </div>
  <h1>いのちの タイムトンネル<small>おおむかし から いま まで たんけん しよう</small></h1>
  <div class="btns">
    <button class="big" id="startBtn" type="button">▶ しゅっぱつ</button>
    <button class="big sub" id="zukanBtn" type="button">📖 ずかん</button>
  </div>
  <p id="titleNote"></p>
</section>

<!-- トンネル -->
<section class="screen" id="game">
  <div class="hud">
    <button class="hbtn" id="quitBtn" type="button" aria-label="やめる">🏠</button>
    <div class="eraBox">
      <div class="eraName" id="eraName"></div>
      <div class="eraWhen" id="eraWhen"></div>
      <div class="dots" id="dots"></div>
    </div>
    <button class="hbtn sndBtn" type="button" aria-label="おと">🔊</button>
  </div>
  <div class="view" id="view">
    <div id="scene"></div>
    <div class="say" id="say"></div>
    <div class="warp" id="warp">
      <div class="wr"></div><div class="wr"></div><div class="wr"></div><div class="wr"></div>
      <div class="warpTxt"><div id="warpYear"></div><div id="warpCap"></div></div>
    </div>
  </div>
  <div class="foot">
    <div class="slots" id="slots"></div>
    <button class="big" id="nextBtn" type="button">すすむ ▶</button>
  </div>
</section>

<!-- クイズ -->
<section class="screen" id="quiz">
  <button class="hbtn corner quitAny" type="button" aria-label="やめる">🏠</button>
  <button class="hbtn cornerR sndBtn" type="button" aria-label="おと">🔊</button>
  <div class="qHead">ふるい じゅんに タップ してね</div>
  <div class="qMsg" id="qMsg"></div>
  <div class="qRow"><span class="lbl">むかし</span><div class="qSlots" id="qSlots"></div><span class="lbl">いま</span></div>
  <div class="qCards" id="qCards"></div>
</section>

<!-- ながさくらべ -->
<section class="screen" id="len">
  <button class="hbtn corner quitAny" type="button" aria-label="やめる">🏠</button>
  <button class="hbtn cornerR sndBtn" type="button" aria-label="おと">🔊</button>
  <div class="qHead">トンネルの ながさ くらべ</div>
  <div id="lenYear">いま</div>
  <div class="lenView" id="lenView"><div class="strip" id="strip"></div></div>
  <p id="lenCap"></p>
  <button class="big" id="lenBtn" type="button">もどって みる ▶</button>

function finish() {
  clearTimers(); save.clears++; store(); show("result");
  $("stars").textContent = qMiss === 0 ? "⭐⭐⭐" : qMiss <= 2 ? "⭐⭐" : "⭐";
  var t = (qMiss === 0 ? "クイズは ぜんぶ いっぱつ せいかい！ すごい！" : "さいごまで やりとげたね！ えらい！") + "\n";
  t += newCount ? "あたらしく " + newCount + "つ ずかんに はいったよ（" + save.found.length + " / " + ALL.length + "）" : "ずかんは " + save.found.length + " / " + ALL.length;
  if (save.clears === 1) t += "\nつぎは クイズの カードが 6まいに ふえるよ";
  $("resTxt").innerHTML = t.split("\n").join("<br>");
  S.fanfare(); confetti(40);
}
$("againBtn").addEventListener("click", function () { S.tap(); startRun(); });
$("homeBtn").addEventListener("click", function () { S.tap(); goTitle(); });
$("resZukan").addEventListener("click", function () { S.tap(); openZukan(); });
function confetti(n) {
  var cols = ["#ffd43b", "#ff6b6b", "#4dabf7", "#69db7c", "#da77f2", "#fff"];
  for (var i = 0; i < n; i++) {
    var d = document.createElement("i"); d.className = "conf";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = cols[i % cols.length];
    d.style.animationDuration = (1.6 + Math.random() * 1.8) + "s"; d.style.animationDelay = (Math.random() * .6) + "s";
    document.body.appendChild(d);
    (function (el) { setTimeout(function () { el.remove(); }, 4500); })(d);
  }
}

/* ---------- ずかん ---------- */
function openZukan() {
  var h = "";
  ERAS.forEach(function (e, i) {
    h += '<div class="zEra">' + (i + 1) + "．" + e.name + "（" + e.when + '）</div><div class="zGrid">';
    e.cr.forEach(function (c) {
      h += save.found.indexOf(c.id) >= 0
        ? '<button type="button" class="zCell" data-id="' + c.id + '">' + svg(ART[c.id]) + c.name + '</button>'
        : '<div class="zCell no">？</div>';
    });
    h += "</div>";
  });
  $("zBody").innerHTML = h; $("zCount").textContent = save.found.length + " / " + ALL.length;
  $("zukan").classList.add("on"); $("zBody").scrollTop = 0;
}
$("zClose").addEventListener("click", function () { S.tap(); $("zukan").classList.remove("on"); });
$("zBody").addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("button.zCell") : null;
  if (el) { S.tap(); openCard(byId(el.getAttribute("data-id")), "ずかん"); }
});

syncSnd(); goTitle();
})();
</script>
