<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>つくぼうと おしゃべり ｜ かくれんぼ めいじんの ツクツクボウシ</title>
<meta name="description" content="かくれんぼが とくいな ツクツクボウシの「つくぼう」と、こえで おしゃべり・かくれんぼが できる アプリ。">
<meta name="theme-color" content="#3f8f4f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦗</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="topbar">
  <button id="backBtn" class="icon-btn" type="button" aria-label="おしゃべりに もどる" hidden>◀ もどる</button>
  <h1 id="topTitle">つくぼうと おしゃべり</h1>
  <button id="soundBtn" class="icon-btn" type="button" aria-label="おとの せってい">🔊</button>
</header>

<main class="app">

  <!-- はじめの がめん -->
  <section id="startScreen" class="screen">
    <div class="start-art" id="startArt"></div>
    <h2 class="start-title">かくれんぼ めいじん<br><span class="big">つくぼう</span></h2>
    <p class="start-lead">ツクツクボウシの つくぼうは、<br>かくれんぼが だいの とくい。<br>ちょっぴり いじわるだけど、ともだちだよ。</p>
    <label class="name-row">
      <span>きみの なまえ</span>
      <input id="nameInput" type="text" maxlength="8" autocomplete="off" value="あお">
      <span>くん</span>
    </label>
    <button id="startBtn" class="btn btn-main" type="button">はじめる ▶</button>
  </section>

  <!-- おしゃべり がめん -->
  <section id="talkScreen" class="screen" hidden>
    <div class="stage">
      <div class="chara" id="chara"></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>
    <div class="side">
      <div class="you-said" id="youSaid" hidden></div>
      <div class="chips" id="chips"></div>
      <form class="inputbar" id="inputBar" autocomplete="off">
        <button id="micBtn" class="mic" type="button" aria-label="こえで はなす">🎤<span>はなす</span></button>
        <input id="textInput" type="text" placeholder="もじでも はなせるよ" aria-label="はなしかける ことば">
        <button class="send" type="submit" aria-label="おくる">➤</button>
      </form>
    </div>
  </section>

  <!-- かくれんぼ がめん -->
  <section id="gameScreen" class="screen" hidden>
    <!-- メニュー: ばしょ・あそびかた・むずかしさ -->
    <div id="hideMenu" class="hide-menu">
      <div class="menu-level" id="menuLevel"></div>
      <p class="game-msg" id="menuMsg"></p>
      <h3>ばしょ</h3>
      <div class="pickgrid" id="pickStage"></div>
      <h3>あそびかた</h3>
      <div class="pickgrid" id="pickMode"></div>
      <h3>むずかしさ</h3>
      <div class="pickgrid diff" id="pickDiff"></div>
      <div class="menu-bar">
        <button id="menuStart" class="btn btn-main" type="button">はじめる ▶</button>
        <button id="menuRandom" class="btn btn-sub" type="button">🎲 おまかせ</button>
        <button id="menuBook" class="btn btn-sub" type="button">🏅 ずかん</button>
        <button id="menuBack" class="btn btn-sub" type="button">おしゃべりに もどる</button>
      </div>
    </div>
    <!-- あそんでる ところ -->
    <div id="hidePlay" class="hide-play" hidden>
      <div class="game-head"><span id="gameTitle"></span><span id="gameStatus" class="game-status"></span></div>
      <div class="game-msg" id="gameMsg" aria-live="polite"></div>
      <div class="scene" id="scene"></div>
      <div class="game-bar" id="gameBar"></div>
    </div>
    <!-- バッジ ずかん -->
    <div id="hideBook" class="hide-book" hidden>
      <h3>🏅 かくれんぼ ずかん</h3>
      <p class="book-sum" id="bookSum"></p>
      <div class="badge-grid" id="bookGrid"></div>
      <button id="bookBack" class="btn btn-main" type="button">メニューに もどる</button>
    </div>
  </section>

</main>

<!-- おとの せってい -->
<div id="soundPanel" class="sheet" hidden>
  <div class="sheet-inner">
    <h2>おとの せってい</h2>
    <label class="toggle"><input type="checkbox" id="tgVoice" checked><span>よみあげ（つくぼうの こえ）</span></label>
    <label class="toggle"><input type="checkbox" id="tgSong" checked><span>なきごえ・こうかおん</span></label>
    <button id="nameChange" class="btn btn-sub" type="button">なまえを かえる</button>
    <button id="sheetClose" class="btn btn-main" type="button">とじる</button>
    <p class="note">おうちの方へ: 音が出ます。読み上げ・鳴き声はブラウザで合成しています。
      マイクは「はなす」を押したときだけ使い、音声はブラウザの音声認識に送られます（保存はしません）。</p>
  </div>
</div>
