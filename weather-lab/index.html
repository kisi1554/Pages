<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あしたの てんきやさん</title>
<meta name="description" content="ほんものの てんきよほうを 見ながら、雨や 雲が できる しくみを じっけんで まなべる 子どもむけ 天気アプリ。あしたの 天気を よそうして 答え合わせも できます。">
<meta name="theme-color" content="#2f8fd0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>🌤️ あしたの てんきやさん</h1>
  <div class="topbar-tools">
    <span class="stamps" title="あつめた スタンプ">⭐<b id="stampCount">0</b></span>
    <button class="icon-btn" id="btnSound" aria-pressed="true">🔊 おと</button>
  </div>
</header>

<main id="main">

  <!-- ============ よほう ============ -->
  <section class="view" id="view-yohou">
    <div class="chips" id="cityChips" role="tablist" aria-label="まちを えらぶ"></div>
    <p class="source" id="sourceNote">よみこみちゅう…</p>

    <div class="today-card" id="todayCard">
      <div class="today-main">
        <div class="today-mark" id="todayMark">⛅</div>
        <div class="today-text">
          <div class="today-label" id="todayLabel">よみこみちゅう</div>
          <div class="today-temp">
            <span class="tmax" id="todayMax">--</span><span class="sep">/</span><span class="tmin" id="todayMin">--</span><span class="unit">℃</span>
          </div>
          <div class="today-sub" id="todayNow"></div>
        </div>
      </div>
      <div class="today-facts" id="todayFacts"></div>
    </div>

    <h2 class="sec-title">🔍 なぜ きょうは この てんき？</h2>
    <p class="story" id="story"></p>
    <div class="reasons" id="reasons"></div>

    <h2 class="sec-title">📅 1しゅうかんの よほう</h2>
    <div class="week" id="week"></div>

    <h2 class="sec-title">🕒 きょう〜あしたの ながれ</h2>
    <div class="hours" id="hours"></div>
  </section>

  <!-- ============ よそう ============ -->
  <section class="view hidden" id="view-yosou">
    <div class="guess-head">
      <h2 class="sec-title">✋ あしたの てんきを よそうしよう</h2>
      <p class="lead" id="guessLead">よみこみちゅう…</p>
    </div>

    <div class="guess-grid" id="guessGrid"></div>
    <p class="guess-state" id="guessState"></p>

    <div class="score-box">
      <div class="score-item"><b id="scoreTries">0</b><span>よそうした かず</span></div>
      <div class="score-item"><b id="scoreHits">0</b><span>あたった かず</span></div>
      <div class="score-item"><b id="scoreRate">-</b><span>あたり わりあい</span></div>
    </div>

    <h2 class="sec-title">📒 こたえあわせ</h2>
    <div class="history" id="history"></div>
    <p class="note">よそうは あした 天気が わかると じどうで こたえあわせ するよ。あたると スタンプ ⭐ が もらえる！</p>
  </section>

  <!-- ============ じっけん ============ -->
  <section class="view hidden" id="view-lab">
    <h2 class="sec-title">🧪 雨は どこから やってくるの？</h2>
    <div class="lab-steps" id="labSteps"></div>
    <div class="lab-stage">
      <canvas id="labCanvas"></canvas>
      <div class="lab-meters" id="labMeters"></div>
    </div>
    <div class="lab-controls">
      <label class="slider">
        <span>☀️ たいようの つよさ</span>
        <input type="range" id="sSun" min="0" max="100" value="60">
        <b id="vSun">60</b>
      </label>
      <label class="slider">
        <span>🍃 かぜの つよさ</span>
        <input type="range" id="sWind" min="0" max="100" value="35">
        <b id="vWind">35</b>
      </label>
      <label class="slider">
        <span>🌡️ そらの さむさ</span>
        <input type="range" id="sCold" min="0" max="100" value="35">
        <b id="vCold">35</b>
      </label>
      <div class="lab-buttons">
        <button class="btn primary" id="btnLabPlay">▶ うごかす</button>
        <button class="btn" id="btnLabReset">↺ さいしょから</button>
        <button class="btn" id="btnLabToday">🌤️ きょうの てんきに あわせる</button>
      </div>
    </div>
    <div class="lab-tip" id="labTip">たいようを つよくすると、うみの 水が 水じょうきに なって のぼるよ。</div>
  </section>

  <!-- ============ まなぶ ============ -->
  <section class="view hidden" id="view-manabu">
    <div class="subtabs" role="tablist">
      <button class="subtab is-on" data-sub="read">📖 よみかた</button>
      <button class="subtab" data-sub="season">🍁 きせつ</button>
      <button class="subtab" data-sub="quiz">❓ クイズ</button>
    </div>

    <div class="sub" id="sub-read"></div>

    <div class="sub hidden" id="sub-season"></div>

    <div class="sub hidden" id="sub-quiz">
      <div class="quiz-box" id="quizBox"></div>
    </div>
  </section>

</main>

<nav class="dock" role="tablist" aria-label="メニュー">
  <button class="dock-btn is-on" data-view="yohou"><span class="d-emoji">🌤️</span><span class="d-name">よほう</span></button>
  <button class="dock-btn" data-view="yosou"><span class="d-emoji">✋</span><span class="d-name">よそう</span></button>
  <button class="dock-btn" data-view="lab"><span class="d-emoji">🧪</span><span class="d-name">じっけん</span></button>
  <button class="dock-btn" data-view="manabu"><span class="d-emoji">📖</span><span class="d-name">まなぶ</span></button>
</nav>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="data.js"></script>
<script src="audio.js"></script>
<script src="weather.js"></script>
<script src="lab.js"></script>
<script src="app.js"></script>
</body>
</html>
