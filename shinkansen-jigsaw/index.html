<style>

<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

async function fadeBack(g) {

function anim(ms, f) {

    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / ms); f(k); if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);

}

/* ---------- ぜんぶ はまったら 電車が はしる ---------- */
async function runTrains() {
  const has = id => G.placed.includes(id);
  // みき: 北 → 南
  const trunk = [];
  if (has('hokkaido')) trunk.push(...SHAPE.hokkaido.pts.slice().reverse());
  const toh = SHAPE.tohoku.pts.slice().reverse(); trunk.push(...(trunk.length ? toh.slice(1) : toh));
  for (const id of ['tokaido', 'sanyo', 'kyushu']) if (has(id)) trunk.push(...SHAPE[id].pts.slice(1));
  const SP = 200; // 1びょうに すすむ ながさ
  const runs = [{ id: 'trunk', pts: trunk, t0: 0, color: '#fff' }];
  const timeAt = (run, n) => { // run の 電車が 駅 n に つく じかん
    const p = ST[n].xy; let len = 0;
    for (let i = 0; i < run.pts.length; i++) {
      if (i) len += Math.hypot(run.pts[i][0] - run.pts[i - 1][0], run.pts[i][1] - run.pts[i - 1][1]);
      if (Math.hypot(run.pts[i][0] - p[0], run.pts[i][1] - p[1]) < .5) return run.t0 + len / SP;
    }
    return run.t0;
  };
  const byId = {};
  for (const [id, parent, at] of [['akita', 'trunk', '盛岡'], ['yamagata', 'trunk', '福島'], ['joetsu', 'trunk', '大宮'], ['hokuriku', 'joetsu', '高崎'], ['nishikyushu', 'trunk', '博多']]) {
    if (!has(id)) continue;
    const pr = parent === 'trunk' ? runs[0] : byId[parent];
    const r = { id, pts: SHAPE[id].pts, t0: timeAt(pr, at) + (id === 'nishikyushu' ? .6 : 0) };
    runs.push(r); byId[id] = r;
  }
  for (const r of runs) {
    r.len = []; let s = 0; r.pts.forEach((p, i) => { if (i) s += Math.hypot(p[0] - r.pts[i - 1][0], p[1] - r.pts[i - 1][1]); r.len.push(s); });
    r.total = s;
    const cid = r.id === 'trunk' ? (has('hokkaido') ? 'hokkaido' : 'tohoku') : r.id;
    r.g = el('g', {}, $('gFx')); r.g.innerHTML = mapTrain(LINES[cid].color, 1.3); r.g.style.display = 'none';
  }
  const first = has('hokkaido') ? '新函館北斗' : '新青森', last = has('kyushu') ? '鹿児島中央' : '博多';
  msg(`${stR(first)}から ${stR(last)}まで<br>しゅっぱーつ！`);
  say(`${ST[first].y} から ${ST[last].y} まで、しゅっぱーつ！`);
  SND.run();
  const end = Math.max(...runs.map(r => r.t0 + r.total / SP)) + .4;
  await anim(end * 1000, k => {
    const t = k * end;
    for (const r of runs) {
      const d = (t - r.t0) * SP;
      if (d < 0) continue;
      r.g.style.display = '';
      const dd = Math.min(d, r.total);
      let i = 1; while (i < r.len.length - 1 && r.len[i] < dd) i++;
      const a = r.pts[i - 1], b = r.pts[i], seg = (r.len[i] - r.len[i - 1]) || 1, f = Math.min(1, (dd - r.len[i - 1]) / seg);
      const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      let ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
      const flip = Math.abs(ang) > 90; // さかさまに ならないように
      r.g.setAttribute('transform', `translate(${x},${y}) rotate(${flip ? ang + 180 : ang}) scale(${flip ? -1 : 1},1)`);
    }
  });
  await sleep(500);
  for (const r of runs) r.g.remove();
}
async function finish() {
  G.busy = true;

function pickQuiz(lv) {
  const cur = shuffle(QUIZ.filter(q => q.lv === lv)), low = shuffle(QUIZ.filter(q => q.lv < lv));
  if (lv === 1) return cur.slice(0, 2);
  const out = cur.slice(0, 2); if (low.length) out.push(low[0]);
  // おなじ 線を こたえる もんだいは 1つだけ（秋田と 山形は どちらか）
  return out.filter((q, i) => !(q.ln && out.slice(0, i).some(p => p.q === q.q)));
}

const SPEEDY = Object.keys(LINES).filter(id => LINES[id].kmh);
let SPD = null;
function speedTriple() {
  for (;;) {
    const t = shuffle(SPEEDY).slice(0, 3), mx = Math.max(...t.map(id => LINES[id].kmh));
    if (t.filter(id => LINES[id].kmh === mx).length === 1 && (!SPD || !SPD.prev || t.join() !== SPD.prev)) return t;
  }
}
function speedStart() {

}
function speedRound() {

  $('spCnt').textContent = SPD.n + '/3';

}
async function speedPick(b) {

  if (b.dataset.id !== win) {

  $('spEx').innerHTML = 'せいかい！ よーい どん！';

async function race(t, win) {

  const GOAL = 330;
  let h = '<rect width="400" height="170" fill="#eef7ee"/>';
  t.forEach((id, i) => { h += `<rect x="0" y="${38 + i * 48}" width="400" height="5" fill="#9aa"/>`; });
  h += `<rect x="${GOAL + 50}" y="0" width="6" height="170" fill="#e03131"/><text x="${GOAL + 20}" y="14" font-size="12" font-weight="bold" fill="#e03131">ゴール</text>`;
  svg.innerHTML = h;
  const gs = t.map((id, i) => { const g = el('g', {}, svg); g.innerHTML = `<g transform="scale(.6)">${sideTrain(LINES[id].color, LINES[id].nose)}</g>`; g.dataset.y = 18 + i * 48; return g; });
  SND.run();
  const mx = Math.max(...t.map(id => LINES[id].kmh));
  await anim(3200, k => {
    gs.forEach((g, i) => {
      const w = (92 + LINES[t[i]].nose) * .6;
      g.setAttribute('transform', `translate(${-w + (GOAL + 52) * k * LINES[t[i]].kmh / mx},${g.dataset.y})`);
    });
  });
  const wi = t.indexOf(win); const cr = el('text', { x: GOAL - 10, y: 18 + wi * 48, 'font-size': 18 }, svg); cr.textContent = '👑';
  SND.fan();
}
// はなの ながい しんかんせんが トンネルに はなを ぶつけそうに なる
async function tunnel(id) {
  const svg = $('spSvg'), L = LINES[id];
  svg.innerHTML = `<rect width="400" height="170" fill="#e6f4ff"/><rect y="132" width="400" height="38" fill="#a7d08c"/>
    <rect x="0" y="128" width="400" height="5" fill="#9aa"/>
    <path d="M300,128 L300,96 Q300,70 326,70 Q352,70 352,96 L352,128 Z" fill="#2a2f36"/>
    <g id="tnT"></g>
    <path fill-rule="evenodd" fill="#7c9c5a" d="M290,130 L290,50 Q300,22 345,20 Q400,18 420,40 L420,130 Z M300,128 L300,96 Q300,70 326,70 Q352,70 352,96 L352,128 Z"/>
    <path fill="none" stroke="#8b8f94" stroke-width="6" d="M300,128 L300,96 Q300,70 326,70 Q352,70 352,96 L352,128"/>
    <text id="tnTx" x="140" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#c92a2a"></text>`;
  const tr = $('tnT'), W = 92 + L.nose, tx = $('tnTx');
  tr.innerHTML = sideTrain(L.color, L.nose);
  const stopX = 296 - W, y = 94;
  $('spEx').innerHTML = `${lnR(id)}しんかんせんが トンネルに はいるよ…`;
  await anim(1300, k => tr.setAttribute('transform', `translate(${-W + (stopX + W) * (1 - (1 - k) * (1 - k))},${y})`));
  tx.textContent = 'はなが ぶつかる〜！？'; say('はなが ぶつかる？'); SND.ng();
  await anim(900, k => tr.setAttribute('transform', `translate(${stopX + Math.sin(k * 40) * 1.5},${y})`));
  await anim(1100, k => tr.setAttribute('transform', `translate(${stopX + 200 * k * k},${y})`));
  tx.textContent = 'スーッ… セーフ！'; SND.ok(); say('セーフ！');
  $('spEx').innerHTML = 'セーフ！ トンネルは ちゃんと ひろく できて いるよ。<br>ながい はなは、トンネルに はいる ときの 「ドン！」と いう おとを ちいさく するためなんだ。';
}
