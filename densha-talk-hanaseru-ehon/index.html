<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd166">
<title>でんしゃトーク はなせる えほん</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================ タイトル ============================ -->
<section id="screen-title" class="screen is-on">
  <div class="title-art" id="titleArt"></div>
  <h1 class="title">でんしゃトーク<br><span>はなせる えほん</span></h1>
  <p class="subtitle">はじめての ひとりたび</p>

  <button id="btn-start" class="big-btn">▶ はじめる</button>
  <button id="btn-continue" class="ghost-btn is-hidden">↩ つづきから</button>

  <div class="settings">
    <button class="toggle" id="tg-bgm" aria-pressed="true">🎵 BGM<span>オン</span></button>
    <button class="toggle" id="tg-voice" aria-pressed="true">🔊 こえ<span>オン</span></button>
    <button class="toggle" id="tg-auto" aria-pressed="true">⏭ じどうで つぎへ<span>オン</span></button>
  </div>

  <p class="note">
    こえで こたえる えほんです。マイクを つかいます。<br>
    こえが つかえない ときは、ボタンや もじでも こたえられます。<br>
    はなした ことばは この たんまつの なかだけで つかわれます。
  </p>
</section>

<!-- ============================ えほん ============================ -->
<section id="screen-book" class="screen">
  <header class="bar">
    <button id="btn-prev" class="icon-btn" title="まえの ページ">◀</button>
    <div class="pageno"><span id="pageNo">1</span> / <span id="pageMax">12</span></div>
    <div class="bar-right">
      <button id="btn-bgm" class="icon-btn" title="BGM">🎵</button>
      <button id="btn-voice" class="icon-btn" title="よみあげ">🔊</button>
      <button id="btn-home" class="icon-btn" title="タイトルへ">🏠</button>
    </div>
  </header>

  <div class="stage">
    <div id="art" class="art"></div>
  </div>

  <p id="narr" class="narr"></p>

    <div id="bubble" class="bubble is-hidden">
      <span class="who" id="bubbleWho"></span>
      <p class="say" id="bubbleSay"></p>
    </div>

  <div id="ask" class="ask is-hidden">
    <p id="hint" class="hint"></p>

    <div id="heard" class="heard is-hidden"><span class="heard-label">きこえたよ</span><span id="heardText"></span></div>

    <div class="mic-row">
      <button id="btn-mic" class="mic-btn">🎤<span>はなす</span></button>
      <button id="btn-replay" class="ghost-btn small">🔊 もういちど きく</button>
    </div>

    <div id="choices" class="choices"></div>

    <form id="typed" class="typed" autocomplete="off">
      <input id="input" type="text" placeholder="もじで こたえる" maxlength="20">
      <button type="submit" class="send-btn">いう</button>
    </form>
  </div>

  <div class="next-row">
    <button id="btn-next" class="next-btn is-hidden">つぎへ ➡</button>
  </div>
</section>

<!-- ============================ おわり ============================ -->
<section id="screen-end" class="screen">
  <div class="ticket">
    <div class="ticket-head">きねん きっぷ</div>
    <div class="ticket-body">
      <p class="t-row"><span>なまえ</span><b id="endName">たびびとさん</b></p>
      <p class="t-row"><span>いきさき</span><b id="endDest">うみ</b></p>
      <p class="t-row"><span>ひづけ</span><b id="endDate"></b></p>
      <div class="badges" id="endBadges"></div>
    </div>
    <div class="ticket-foot">でんしゃトーク てつどう</div>
  </div>
  <p class="end-msg" id="endMsg">また いっしょに たびに いこうね!</p>
  <div class="end-btns">
    <button id="btn-again" class="big-btn">🔁 もういちど</button>
    <button id="btn-title" class="ghost-btn">🏠 タイトルへ</button>
  </div>
</section>

<script src="art.js"></script>
<script src="audio.js"></script>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
