<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd166">
<title>でんしゃトーク はなせる えほん</title>
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- ============================ タイトル ============================ -->
<section id="screen-title" class="screen is-on">
  <div class="title-art" id="titleArt"></div>
  <h1 class="title">でんしゃトーク<br><span>はなせる えほん</span></h1>
  <p class="subtitle">はじめての ひとりたび</p>

  <button id="btn-start" class="big-btn">▶ はじめる</button>
  <button id="btn-continue" class="ghost-btn is-hidden">↩ つづきから</button>

  <div class="settings">
    <button class="toggle" id="tg-bgm" aria-pressed="true">🎵 BGM<span>オン</span></button>
    <button class="toggle" id="tg-voice" aria-pressed="true">🔊 こえ<span>オン</span></button>
    <button class="toggle" id="tg-auto" aria-pressed="true">⏭ じどうで つぎへ<span>オン</span></button>
  </div>

  <p class="note">
    こえで こたえる えほんです。マイクを つかいます。<br>
    こえが つかえない ときは、ボタンや もじでも こたえられます。<br>
    はなした ことばは この たんまつの なかだけで つかわれます。
  </p>
</section>

<!-- ============================ えほん ============================ -->
<section id="screen-book" class="screen">
  <header class="bar">
    <button id="btn-prev" class="icon-btn" title="まえの ページ">◀</button>
    <div class="pageno"><span id="pageNo">1</span> / <span id="pageMax">12</span></div>
    <div class="bar-right">
      <button id="btn-bgm" class="icon-btn" title="BGM">🎵</button>
      <button id="btn-voice" class="icon-btn" title="よみあげ">🔊</button>
      <button id="btn-home" class="icon-btn" title="タイトルへ">🏠</button>
    </div>
  </header>

  <div class="stage">
    <div id="art" class="art"></div>
  </div>

  <p id="narr" class="narr"></p>

    <div id="bubble" class="bubble is-hidden">
      <span class="who" id="bubbleWho"></span>
      <p class="say" id="bubbleSay"></p>
    </div>

  <div id="ask" class="ask is-hidden">
    <p id="hint" class="hint"></p>

    <div id="heard" class="heard is-hidden"><span class="heard-label">きこえたよ</span><span id="heardText"></span></div>

    <div class="mic-row">
      <button id="btn-mic" class="mic-btn">🎤<span>はなす</span></button>
      <button id="btn-replay" class="ghost-btn small">🔊 もういちど きく</button>
    </div>

    <div id="choices" class="choices"></div>

    <form id="typed" class="typed" autocomplete="off">
      <input id="input" type="text" placeholder="もじで こたえる" maxlength="20">
      <button type="submit" class="send-btn">いう</button>
    </form>
  </div>

  <div class="next-row">
    <button id="btn-next" class="next-btn is-hidden">つぎへ ➡</button>
  </div>
</section>

<!-- ============================ おわり ============================ -->
<section id="screen-end" class="screen">
  <div class="ticket">
    <div class="ticket-head">きねん きっぷ</div>
    <div class="ticket-body">
      <p class="t-row"><span>なまえ</span><b id="endName">たびびとさん</b></p>
      <p class="t-row"><span>いきさき</span><b id="endDest">うみ</b></p>
      <p class="t-row"><span>ひづけ</span><b id="endDate"></b></p>
      <div class="badges" id="endBadges"></div>
    </div>
    <div class="ticket-foot">でんしゃトーク てつどう</div>
  </div>
  <p class="end-msg" id="endMsg">また いっしょに たびに いこうね!</p>
  <div class="end-btns">
    <button id="btn-again" class="big-btn">🔁 もういちど</button>
    <button id="btn-title" class="ghost-btn">🏠 タイトルへ</button>
  </div>
</section>

<script src="art.js?v=4c5eb3f"></script>
<script src="audio.js?v=4c5eb3f"></script>
<script src="scenes.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
