<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ぷっぴの えきうた</title>
<meta name="description" content="きっぷの こども「ぷっぴ」が、ブルーライン・とうよこせん・でんえんとしせんの えきを じゅんばんに うたうよ。">
<meta name="theme-color" content="#e6a23a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- ===== ホーム ===== -->
<div id="homeView">
  <header class="bar">
    <a class="barbtn" href="../" aria-label="あそびメニューへ">🏠</a>
    <div class="bartitle">ぷっぴの えきうた 🎵</div>
    <button class="barbtn soundBtn" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>
  <main class="home">
    <section class="hero">
      <div class="bubble" id="homeBubble">やっほー！</div>
      <div class="pwrap" id="homePup"></div>
      <div class="love" aria-label="なかよしど"><span id="loveLv">なかよし Lv.1</span><span class="meter"><i id="loveBar"></i></span></div>
    </section>
    <h2 class="h2">どの せんを うたう？</h2>
    <div class="lines" id="lineCards"></div>
    <div class="tools">
      <button class="pill" id="bookBtn" type="button">📒 スタンプちょう</button>
      <button class="pill" id="setBtn" type="button">⚙️ せってい</button>
    </div>
  </main>
</div>

<!-- ===== うたう がめん ===== -->
<div id="singView" hidden>
  <header class="bar">
    <button class="barbtn" id="backBtn" type="button" aria-label="もどる">⬅</button>
    <div class="bartitle" id="singTitle"></div>
    <button class="barbtn soundBtn" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>
  <main class="sing">
    <div class="s-pup">
      <div class="pwrap" id="singPup"></div>
      <div class="bubble" id="singBubble"></div>
    </div>
    <section class="sign" aria-live="polite">
      <div class="sign-top">
        <div class="numbadge" id="numBadge"><span><small>B</small><b>01</b></span></div>
        <div class="sname" id="sName"></div>
      </div>
      <div class="xfer" id="xfer"></div>
      <div class="sign-bottom"><div id="prevName"></div><div class="nx" id="nextName"></div></div>
    </section>
    <div class="kara" id="kara" aria-hidden="true"></div>
    <div class="ctl">
      <button class="round" id="restartBtn" type="button" aria-label="はじめから">⏮</button>
      <button class="big" id="playBtn" type="button" aria-label="うたう">▶</button>
      <div class="seg" id="speedSeg" role="group" aria-label="はやさ">
        <button type="button" data-speed="0" aria-label="ゆっくり">🐢</button>
        <button type="button" data-speed="1" aria-label="ふつう">🚃</button>
        <button type="button" data-speed="2" aria-label="はやい">🐇</button>
      </div>
      <button class="dirbtn" id="dirBtn" type="button"></button>
    </div>
    <nav class="strip" id="strip" aria-label="えきの いちらん"></nav>
  </main>
</div>

<!-- ===== オーバーレイ ===== -->
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script src="data.js?v=4c5eb3f"></script>
<script src="voice.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
