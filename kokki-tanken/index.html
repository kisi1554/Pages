<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>こっきたんけん ｜ せかいの 47か国</title>
<meta name="description" content="47都道府県を おぼえたら、つぎは せかいの 47か国。こっきと たいりくを あそびながら おぼえる アプリ。">
<meta name="theme-color" content="#1b6fa8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚩</text></svg>">
<link rel="stylesheet" href="style.css?v=87ccc23">
</head>
<body>
<div id="app">

  <!-- ======================= タイトル ======================= -->
  <section id="s-title" class="screen scroll">
    <header class="title-head">
      <div class="toggles">
        <button type="button" id="btn-sound" class="pill">🔊 おと</button>
        <button type="button" id="btn-voice" class="pill">🗣️ こえ</button>
      </div>
      <h1><span>🚩</span>こっき たんけん</h1>
      <p class="lead">47<ruby>都道府県<rt>とどうふけん</rt></ruby>の つぎは、せかいの <b>47か<ruby>国<rt>こく</rt></ruby></b>！</p>
    </header>

    <div id="title-map" class="title-map" aria-label="せかいちず"></div>

    <div class="progress">
      <div class="bar"><i id="got-bar"></i></div>
      <span>あつめた こっき <b id="got-num">0</b> / 47</span>
    </div>
    <p id="complete" class="complete" hidden>🎉 47か国 コンプリート！ きみは こっき はかせ！</p>

    <h2 class="sec">🗺️ たいりくを えらんで たんけん</h2>
    <div id="region-list" class="regions"></div>

    <h2 class="sec">🎒 ほかの あそび</h2>
    <div class="extras">
      <button type="button" id="btn-zukan" class="extra" style="--accent:#d9a227;--tint:#fbf0cf"><span>📔</span>こっき ずかん</button>
      <button type="button" id="btn-explore" class="extra" style="--accent:#1b6fa8;--tint:#dcecf8"><span>🔍</span>ちずで さがす</button>
      <button type="button" id="btn-size" class="extra" style="--accent:#2f9e5b;--tint:#d9f2e2"><span>📏</span>どっちが おおきい？</button>
      <button type="button" id="btn-mix" class="extra" style="--accent:#d2464b;--tint:#fbdfe0"><span>🌍</span>ぜんぶ ミックス</button>
    </div>
    <p class="foot">ちずの データ：Natural Earth（パブリックドメイン）</p>
  </section>

  <!-- ======================= おぼえる ======================= -->
  <section id="s-learn" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2 id="learn-title"></h2>
      <span id="learn-count" class="count"></span>
    </header>
    <div id="learn-dots" class="dots"></div>
    <div id="learn-card" class="learn-card"></div>
    <footer class="learn-foot">
      <button type="button" id="learn-prev" class="btn">◀ まえ</button>
      <button type="button" id="learn-next" class="btn">つぎ ▶</button>
      <button type="button" id="learn-quiz" class="btn primary">✏️ クイズ</button>
    </footer>
  </section>

  <!-- ======================= クイズ ======================= -->
  <section id="s-quiz" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="やめる">◀</button>
      <h2 id="quiz-title"></h2>
      <button type="button" id="q-again" class="pill" aria-label="もういちど きく">🔈</button>
    </header>
    <div id="quiz-dots" class="dots"></div>
    <p id="q-text" class="q-text"></p>
    <div class="quiz-main">
      <div id="q-stage" class="q-stage"></div>
      <div id="q-choices" class="q-choices"></div>
    </div>
    <div id="feedback" class="feedback" hidden></div>
  </section>

  <!-- ======================= けっか ======================= -->
  <section id="s-result" class="screen scroll">
    <div id="result-body" class="result"></div>
    <div class="result-btns">
      <button type="button" id="res-again" class="btn primary">🔁 もういちど</button>
      <button type="button" id="res-learn" class="btn">📖 おさらい</button>
      <button type="button" class="btn" data-go="title">🏠 メニュー</button>
    </div>
  </section>

  <!-- ======================= ずかん ======================= -->
  <section id="s-zukan" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2>📔 こっき ずかん</h2>
      <span id="zukan-num" class="count"></span>
    </header>
    <div id="zukan-list" class="zukan scroll-inner"></div>
  </section>

  <!-- ======================= ちずで さがす ======================= -->
  <section id="s-explore" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2>🔍 ちずで さがす</h2>
      <span class="count"></span>
    </header>
    <div id="explore-tabs" class="tabs"></div>
    <div id="explore-map" class="explore-map"></div>
    <div id="explore-info" class="explore-info"></div>
  </section>

  <!-- ======================= どっちが おおきい ======================= -->
  <section id="s-size" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2>📏 どっちが おおきい？</h2>
      <span id="size-round" class="count"></span>
    </header>
    <p class="q-text">くにの ひろさ、おおきいのは どっち？</p>
    <div id="size-choices" class="size-choices"></div>
    <div id="size-reveal" class="size-reveal"></div>
    <div class="size-foot"><button type="button" id="size-next" class="btn primary" hidden>つぎへ ▶</button></div>
  </section>

  <!-- ======================= くにの カード（ポップアップ） ======================= -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button type="button" class="modal-close" aria-label="とじる">✕</button>
      <div class="modal-body"></div>
    </div>
  </div>
</div>

<script src="countries.js?v=87ccc23"></script>
<script src="data.js?v=87ccc23"></script>
<script src="flags.js?v=87ccc23"></script>
<script src="game.js?v=87ccc23"></script>
</body>
</html>
