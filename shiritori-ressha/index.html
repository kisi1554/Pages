<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>しりとり れっしゃ</title>
<meta name="description" content="しりとりで ことばを つないで ながい れっしゃを つくろう">
<meta name="theme-color" content="#2e8b57">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<button id="soundBtn" class="sound-btn" type="button" aria-label="おと">🔊</button>

<!-- タイトル -->
<section id="title" class="screen active">
  <div class="title-wrap">
    <div class="title-train" aria-hidden="true">🚂🚃🚃🚃</div>
    <h1>しりとり れっしゃ</h1>
    <p class="lead">ことばを つないで ながい れっしゃを つくろう</p>
    <p class="best">🏆 さいこう <b id="bestNum">0</b> りょう</p>

    <div class="mode-btns">
      <button class="big-btn solo" type="button" data-mode="solo">🧒 ひとりで</button>
      <button class="big-btn duo" type="button" data-mode="duo">👨‍👧 おうちのひとと こうたい</button>
    </div>

    <div class="sub-btns">
      <button id="nigoriBtn" class="pill-btn" type="button" aria-pressed="false">にごり ゆるす：<b>オフ</b></button>
      <button id="zukanBtn" class="pill-btn" type="button">📖 ことば ずかん</button>
    </div>

    <details class="how">
      <summary>あそびかた</summary>
      <ol>
        <li>きかんしゃの ことばの <b>さいごの もじ</b> で はじまる カードを タップ。</li>
        <li>つながったら しゃりょうが 1りょう ふえるよ。</li>
        <li>「ー」は ひとつ まえの もじ、ちいさい「ゃ」は「や」で つなぐよ。</li>
        <li>「<b>ん</b>」で おわる ことばを えらぶと おしまい。きを つけてね。</li>
        <li>つなげる ことばが ないときは 🎫まほうの きっぷ で のりかえ！</li>
      </ol>
    </details>
  </div>
</section>

<!-- ゲーム -->
<section id="game" class="screen">
  <header class="bar">
    <button id="homeBtn" class="icon-btn" type="button" aria-label="メニューへ">🏠</button>
    <div id="turn" class="turn"></div>
  </header>

  <div id="prompt" class="prompt"></div>

  <div id="trackWrap" class="track-wrap">
    <div id="track" class="track">
      <div id="rails" class="rails"></div>
      <div id="train" class="train"></div>
    </div>
    <div class="depot" aria-hidden="true"><span>🏠</span><small>しゃこ</small></div>
  </div>

  <div class="actions">
    <button id="goBtn" class="go-btn" type="button">🚂 しゅっぱつ！</button>
    <div class="count"><b id="countNum">0</b><small>りょう</small></div>
    <button id="endBtn" class="end-btn" type="button">おわる</button>
  </div>

  <div id="cards" class="cards"></div>
</section>

<!-- ずかん -->
<section id="zukan" class="screen">
  <header class="bar">
    <button id="zukanBack" class="icon-btn" type="button" aria-label="もどる">◀</button>
    <h2>📖 ことば ずかん</h2>
    <span id="zukanCount" class="zukan-count"></span>
  </header>
  <div id="zukanList" class="zukan-list"></div>
</section>

<!-- けっか -->
<div id="result" class="modal" hidden>
  <div class="modal-box">
    <h2 id="resTitle">おしまい！</h2>
    <p id="resMsg" class="res-msg"></p>
    <p class="res-count"><span>れんけつ</span><b id="resNum">0</b><span>りょう</span></p>
    <p id="resRecord" class="res-record" hidden>🎉 しんきろく！</p>
    <div id="resPlayers" class="res-players"></div>
    <div id="resWords" class="res-words"></div>
    <div class="res-btns">
      <button id="againBtn" class="big-btn solo" type="button">もういちど</button>
      <button id="menuBtn" class="big-btn plain" type="button">メニューへ</button>
    </div>
  </div>
</div>

<script src="words.js?v=4c5eb3f"></script>
<script src="shiritori.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
