<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しりとり れっしゃ</title>
<meta name="description" content="しりとりで ことばを つないで ながい れっしゃを つくろう">
<meta name="theme-color" content="#2e8b57">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
<link rel="stylesheet" href="style.css?v=e120d48">
</head>
<body>

<button id="soundBtn" class="sound-btn" type="button" aria-label="おと">🔊</button>

<!-- タイトル -->
<section id="title" class="screen active">
  <div class="title-wrap">
    <div class="title-train" aria-hidden="true">🚂🚃🚃🚃</div>
    <h1>しりとり れっしゃ</h1>
    <p class="lead">ことばを つないで ながい れっしゃを つくろう</p>
    <p class="best">🏆 さいこう <b id="bestNum">0</b> りょう</p>

    <div class="mode-btns">
      <button class="big-btn solo" type="button" data-mode="solo">🧒 ひとりで</button>
      <button class="big-btn duo" type="button" data-mode="duo">👨‍👧 おうちのひとと こうたい</button>
    </div>

    <div class="sub-btns">
      <button id="nigoriBtn" class="pill-btn" type="button" aria-pressed="false">にごり ゆるす：<b>オフ</b></button>
      <button id="zukanBtn" class="pill-btn" type="button">📖 ことば ずかん</button>
    </div>

    <details class="how">
      <summary>あそびかた</summary>
      <ol>
        <li>きかんしゃの ことばの <b>さいごの もじ</b> で はじまる カードを タップ。</li>
        <li>つながったら しゃりょうが 1りょう ふえるよ。</li>
        <li>「ー」は ひとつ まえの もじ、ちいさい「ゃ」は「や」で つなぐよ。</li>
        <li>「<b>ん</b>」で おわる ことばを えらぶと おしまい。きを つけてね。</li>
        <li>つなげる ことばが ないときは 🎫まほうの きっぷ で のりかえ！</li>
      </ol>
    </details>
  </div>
</section>

<!-- ゲーム -->
<section id="game" class="screen">
  <header class="bar">
    <button id="homeBtn" class="icon-btn" type="button" aria-label="メニューへ">🏠</button>
    <div id="turn" class="turn"></div>
  </header>

  <div id="prompt" class="prompt"></div>

  <div id="trackWrap" class="track-wrap">
    <div id="track" class="track">
      <div id="rails" class="rails"></div>
      <div id="train" class="train"></div>
    </div>
    <div class="depot" aria-hidden="true"><span>🏠</span><small>しゃこ</small></div>
  </div>

  <div class="actions">
    <button id="goBtn" class="go-btn" type="button">🚂 しゅっぱつ！</button>
    <div class="count"><b id="countNum">0</b><small>りょう</small></div>
    <button id="endBtn" class="end-btn" type="button">おわる</button>
  </div>

  <div id="cards" class="cards"></div>
</section>

<!-- ずかん -->
<section id="zukan" class="screen">
  <header class="bar">
    <button id="zukanBack" class="icon-btn" type="button" aria-label="もどる">◀</button>
    <h2>📖 ことば ずかん</h2>
    <span id="zukanCount" class="zukan-count"></span>
  </header>
  <div id="zukanList" class="zukan-list"></div>
</section>

<!-- けっか -->
<div id="result" class="modal" hidden>
  <div class="modal-box">
    <h2 id="resTitle">おしまい！</h2>
    <p id="resMsg" class="res-msg"></p>
    <p class="res-count"><span>れんけつ</span><b id="resNum">0</b><span>りょう</span></p>
    <p id="resRecord" class="res-record" hidden>🎉 しんきろく！</p>
    <div id="resPlayers" class="res-players"></div>
    <div id="resWords" class="res-words"></div>
    <div class="res-btns">
      <button id="againBtn" class="big-btn solo" type="button">もういちど</button>
      <button id="menuBtn" class="big-btn plain" type="button">メニューへ</button>
    </div>
  </div>
</div>

<script src="words.js?v=e120d48"></script>
<script src="shiritori.js?v=e120d48"></script>
<script src="app.js?v=e120d48"></script>
</body>
</html>
