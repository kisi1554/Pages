<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>じょうもん むらの くらし</title>
<meta name="description" content="どきを つくって かりや りょうを して、じょうもんの むらで 1ねんを くらす シミュレーション。小6 社会の よしゅう・ふくしゅうに。">
<meta name="theme-color" content="#a0522d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>">
<link rel="stylesheet" href="style.css?v=e6715f4">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<header class="top">
  <h1>🏺 じょうもん むらの くらし</h1>
  <div class="tools">
    <button id="btnZukan" class="tool" aria-label="ずかん">📖<span>ずかん</span></button>
    <button id="btnSe" class="tool" aria-label="こうかおん">🔊<span>おと</span></button>
    <button id="btnBgm" class="tool" aria-label="BGM">🎵<span>BGM</span></button>
    <button id="btnVoice" class="tool" aria-label="キャラの こえ">🗣️<span>こえ</span></button>
    <button id="btnHelp" class="tool" aria-label="あそびかた">❓<span>せつめい</span></button>
  </div>
</header>

<div class="status">
  <div class="when"><span id="yearLabel">1ねんめ</span> <b id="seasonLabel">🌸 はる</b></div>
  <div class="turns" id="turns" aria-label="のこりの しごと"></div>
  <div class="stock">
    <span class="stockLabel">🍖 たくわえ <b id="stockNum">0</b> / <span id="needNum">20</span></span>
    <div class="bar"><div id="stockBar"></div></div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="guide" id="guide">
  <button class="face big" id="guideFace" data-who="dogu" aria-label="あんないやく"></button>
  <div class="bubble main">
    <b id="guideName"></b>
    <span id="guideText"></span>
  </div>
  <div class="castBar" id="guideCast" aria-label="なかまに きく"></div>
</div>

<main class="layout">
  <section class="sceneWrap">
    <svg id="scene" viewBox="0 0 400 260" role="img" aria-label="じょうもんの むら"></svg>
    <p class="hint" id="sceneHint">むらの ばしょを タップすると、そこで できる しごとが ひかるよ</p>
  </section>
  <section class="panel">
    <h2 id="panelTitle">はるの しごと</h2>
    <div class="jobs" id="jobs"></div>
    <button id="btnNext" class="big next">つぎの きせつへ ▶</button>
    <p class="msg" id="msg"></p>
  </section>
</main>

<!-- ミニゲーム -->
<div class="overlay" id="play" hidden>
  <div class="sheet">
    <div class="sheetHead">
      <h2 id="playTitle"></h2>
      <button class="close" id="playClose" aria-label="やめる">✕</button>
    </div>
    <div id="playGuide" hidden></div>
    <p class="howto" id="playHow"></p>
    <div class="stage" id="stage"></div>
    <div class="playFoot" id="playFoot"></div>
  </div>
</div>

<!-- ずかん -->
<div class="overlay" id="zukan" hidden>
  <div class="sheet wide">
    <div class="sheetHead">
      <h2>📖 じょうもん ずかん <small id="zukanCount"></small></h2>
      <button class="close" id="zukanClose" aria-label="とじる">✕</button>
    </div>
    <div class="tabs" id="zukanTabs"></div>
    <div class="cards" id="zukanCards"></div>
  </div>
</div>

<!-- カード / おしらせ -->
<div class="overlay" id="dialog" hidden>
  <div class="sheet small">
    <div id="dialogBody"></div>
    <div class="dialogBtns" id="dialogBtns"></div>
  </div>
</div>

<script src="data.js?v=e6715f4"></script>
<script src="art.js?v=e6715f4"></script>
<script src="sound.js?v=e6715f4"></script>
<script src="characters.js?v=e6715f4"></script>
<script src="game.js?v=e6715f4"></script>
</body>
</html>
