<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ろせんず ほんとの かたち</title>
<style>
  :root { --ink:#1d3557; --sub:#4a6178; --bg:#f3f8ff; --gold:#f2b705; --ok:#2f9e44; --ng:#e8590c; --paper:#f6f1dd; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Rounded Mplus 1c","Meiryo",sans-serif;

  button { font-family:inherit; cursor:pointer; touch-action:manipulation; color:inherit; }
  ruby rt { font-size:.5em; letter-spacing:0; font-weight:normal; }
  .hide { display:none !important; }

  #app { position:fixed; inset:0; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* ===== タイトル ===== */
  #title { position:fixed; inset:0; overflow:auto; z-index:20; background:linear-gradient(#e7f1ff, #fff8ec);
    display:flex; flex-direction:column; align-items:center; padding:16px 14px 30px; box-sizing:border-box; }
  #title h1 { margin:6px 0 2px; font-size:30px; text-align:center; letter-spacing:1px; }
  #title h1 span { display:inline-block; animation:wob 2.4s ease-in-out infinite; }
  @keyframes wob { 0%,100% { transform:skewX(0) } 30% { transform:skewX(-10deg) scaleY(1.06) } 60% { transform:skewX(8deg) } }
  #title .lead { font-size:17px; line-height:2; text-align:center; max-width:560px; margin:4px 0 12px; }
  #courses { width:100%; max-width:720px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .course { border:4px solid var(--c); background:#fff; border-radius:22px; padding:10px 8px 8px; font-size:18px; font-weight:bold;
    line-height:1.8; box-shadow:0 5px 0 var(--c); display:flex; flex-direction:column; align-items:center; gap:2px; min-height:150px; }
  .course:active { transform:translateY(4px); box-shadow:0 1px 0 var(--c); }
  .course svg { width:100%; height:62px; }
  .course .sub { font-size:13px; color:var(--sub); font-weight:normal; line-height:1.5; }
  .course .best { font-size:16px; letter-spacing:2px; min-height:20px; }
  #title .row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .pill { border:none; border-radius:999px; background:#fff; padding:10px 18px; font-size:17px; font-weight:bold; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  #title .note { font-size:12px; color:var(--sub); margin-top:14px; text-align:center; line-height:1.7; max-width:560px; }

  .round { flex:none; width:50px; height:50px; border-radius:50%; border:3px solid #fff; background:var(--ink); color:#fff;
    font-size:22px; padding:0; box-shadow:0 3px 0 rgba(0,0,0,.2); }
  #cname { flex:1; min-width:0; font-weight:bold; font-size:16px; line-height:1.55; overflow:hidden; max-height:3.1em; }
  #pips { display:flex; gap:4px; flex:none; }
  #pips i { width:26px; height:26px; border-radius:50%; background:#e3e8ee; display:flex; align-items:center; justify-content:center;
    font-style:normal; font-size:14px; }
  #pips i.done { background:#ffe8a3; } #pips i.now { background:#fff; outline:3px solid var(--gold); }

  /* ===== ぶたい ===== */
  #body { flex:1; min-height:0; display:flex; flex-direction:column; }
  #stage { flex:1; min-height:0; position:relative; margin:0 8px; border-radius:20px; overflow:hidden; background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.1); touch-action:none; }
  #svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #mode { position:absolute; left:10px; top:8px; background:rgba(255,255,255,.9); border-radius:14px; padding:2px 10px;
    font-weight:bold; font-size:15px; line-height:1.9; pointer-events:none; }
  #bubble { position:absolute; left:0; top:0; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:3px 10px;
    font-weight:bold; font-size:16px; line-height:1.8; white-space:nowrap; pointer-events:none; transform:translate(-50%, -100%);
    box-shadow:0 3px 0 rgba(0,0,0,.15); z-index:3; }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-11px; margin-left:-8px; border:8px solid transparent; border-top-color:var(--ink); border-bottom:0; }
  #toast { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none; z-index:4;
    font-size:30px; font-weight:bold; color:#fff; background:var(--ok); padding:8px 22px; border-radius:24px; white-space:nowrap;
    transition:transform .25s, opacity .25s; box-shadow:0 4px 0 rgba(0,0,0,.2); }
  #toast.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast.ng { background:var(--ng); }

  #msg { background:#fff; border-radius:18px; padding:6px 14px; font-weight:bold; font-size:18px; line-height:2; box-shadow:0 2px 8px rgba(0,0,0,.08); min-height:5.6em; box-sizing:border-box; }
  body.land #msg { min-height:0; }
  #msg small { font-size:14px; color:var(--sub); font-weight:normal; }
  #ctrl { display:flex; flex-direction:column; gap:8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .big { border:none; border-radius:18px; padding:10px 20px; font-size:20px; font-weight:bold; background:var(--gold); color:var(--ink);
    box-shadow:0 4px 0 #b58800; min-height:56px; line-height:1.6; }
  .big:active { transform:translateY(3px); box-shadow:0 1px 0 #b58800; }
  .big.sec { background:#fff; box-shadow:0 4px 0 #c5ced8; }
  .big.go { animation:go .7s infinite alternate; }
  @keyframes go { to { transform:scale(1.06); } }

  /* スライダー */
  .slider { display:flex; align-items:center; gap:10px; }
  .slider .lb { flex:none; font-weight:bold; font-size:15px; line-height:1.5; text-align:center; width:64px; }
  .slider .lb b { display:block; font-size:24px; }
  .track { flex:1; height:56px; position:relative; touch-action:none; }
  .track::before { content:""; position:absolute; left:0; right:0; top:50%; height:14px; margin-top:-7px; border-radius:7px;
    background:linear-gradient(90deg, #cfe2ff, #f1e3b5); box-shadow:inset 0 2px 3px rgba(0,0,0,.15); }
  .knob { position:absolute; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:#fff; border:4px solid var(--ink);
    box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 3px 0 rgba(0,0,0,.2); }

  /* クイズの せんたくし */
  .choices { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .choice { background:#fff; border:4px solid #d5dde6; border-radius:18px; padding:4px; min-height:96px; display:flex; flex-direction:column; align-items:center; }
  .choice svg { width:100%; height:84px; }
  .choice b { font-size:20px; }
  .choice.ok { border-color:var(--ok); background:#ebfbee; }
  .choice.ng { border-color:var(--ng); opacity:.55; }

  #sum { position:absolute; inset:0; z-index:10; overflow:auto; background:rgba(243,248,255,.97); display:flex; flex-direction:column; align-items:center;

  #sum h2 { margin:4px 0; font-size:26px; }
  #sum .stars { font-size:40px; letter-spacing:6px; }
  .cards { width:100%; max-width:640px; display:flex; flex-direction:column; gap:8px; margin:8px 0; }

  .lcard .e { font-size:32px; flex:none; }
  #sum .point { background:#fff4cc; border-radius:16px; padding:8px 14px; font-size:17px; font-weight:bold; line-height:2; max-width:640px; }
  #sum .next { font-size:15px; color:var(--sub); line-height:2; max-width:640px; text-align:center; }

  /* よこもち タブレット: パネルを みぎに */
  body.land #body { flex-direction:row; }
  body.land #stage { margin:0 0 10px 10px; }

<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

function svgPt(ev) { const r = $('stage').getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
let stageDown = null, stageMove = null, stageUp = null;
$('stage').addEventListener('pointerdown', ev => { if (stageDown) { $('stage').setPointerCapture(ev.pointerId); stageDown(svgPt(ev), ev); } });
$('stage').addEventListener('pointermove', ev => { if (stageMove) stageMove(svgPt(ev), ev); });
['pointerup', 'pointercancel'].forEach(t => $('stage').addEventListener(t, ev => { if (stageUp) stageUp(svgPt(ev), ev); }));
function clearHandlers() { stageDown = stageMove = stageUp = null; onFrameHook = null; }

function nextBtn(label, fn) {
  const wrap = document.createElement('div'); wrap.className = 'btns';
  wrap.innerHTML = `<button class="big go">${label || 'つぎへ ▶'}</button>`;
  wrap.firstChild.onclick = () => { SND.tap(); fn(); };
  $('ctrl').appendChild(wrap);
}

/* ===== ステップ 1: へんしん ===== */
function stepHenshin() {
  step = 0; pips(); clearHandlers(); resetView(); V.t = 0; V.tTarget = 0;
  setMode('いまは: ろせんず');
  setMsg(`${C.name}の ろせんずは ${C.neat}。<br>スライダーを みぎへ うごかして、ほんとうの <ruby>地図<rt>ちず</rt></ruby>の 形に へんしん！`);
  setCtrl(`<div class="slider"><div class="lb"><b>📋</b>ろせんず</div><div class="track" id="trk"><div class="knob" id="knob">🫠</div></div><div class="lb"><b>🗺️</b>ちず</div></div>
    <div class="btns"><button class="big sec" id="bAuto">▶ じどうで へんしん</button></div>`);
  let reached = false, lastWob = 0;
  const trk = $('trk'), knob = $('knob');
  const setFromX = x => { const r = trk.getBoundingClientRect(); const v = Math.max(0, Math.min(1, (x - r.left - 26) / (r.width - 52))); V.tTarget = v; V.tSpeed = 6; };
  trk.addEventListener('pointerdown', ev => { trk.setPointerCapture(ev.pointerId); audio(); setFromX(ev.clientX); trk.dragging = true; });
  trk.addEventListener('pointermove', ev => { if (trk.dragging) setFromX(ev.clientX); });
  ['pointerup', 'pointercancel'].forEach(t => trk.addEventListener(t, () => { trk.dragging = false; }));
  $('bAuto').onclick = () => { SND.tap(); V.tSpeed = .45; V.tTarget = V.tTarget > .5 ? 0 : 1; };
  onFrameHook = () => {
    const r = trk.getBoundingClientRect();
    knob.style.left = (26 + V.t * (r.width - 52)) + 'px';
    const mid = V.t > .18 && V.t < .82;
    V.train.dizzy = mid;
    knob.textContent = V.t < .18 ? '📋' : V.t > .82 ? '🗺️' : '🫠';
    if (mid && performance.now() - lastWob > 900) { lastWob = performance.now(); SND.wobble(); say('め、めが まわる〜 😵', 900); }
    setMode(V.t < .5 ? 'いまは: ろせんず 📋' : 'いまは: ほんとうの ちず 🗺️');
    if (!reached && V.t >= .99) {
      reached = true; SND.ok(); toast('へんしん！');
      setTimeout(() => say('ほんとうは こんな 形だったんだ！', 2600), 1150);
      setMsg(`これが ${C.name}の ほんとうの 形！ ろせんずと くらべて みよう。<br><small>なんども うごかして いいよ。</small>`);
      nextBtn('つぎへ ▶', stepQuiz);
    }
  };
}

/* ===== ステップ 2: クイズ ===== */
function miniSvg(kind) {
  // kind: real / neat / flip
  const vb = 120, vh = 84, p = 10;
  const B = C.box, sc = Math.min((vb - p * 2) / B.w, (vh - p * 2) / B.h), w = B.w * sc, h = B.h * sc, ox = (vb - w) / 2, oy = (vh - h) / 2;
  let s = `<svg viewBox="0 0 ${vb} ${vh}" xmlns="${NS}">`;
  C.lines.forEach(L => {
    const pts = (kind === 'neat' ? L.schemUV : L.real).map(uv => [ox + uv[0] * w, oy + (kind === 'flip' ? 1 - uv[1] : uv[1]) * h]);
    s += `<path d="M${pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L')}${L.loop ? 'Z' : ''}" fill="none" stroke="${L.c}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(q => { s += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="1.8" fill="#fff" stroke="${L.c}" stroke-width="1.2"/>`; });
    // めじるし 駅（さいしょの big）
    const bi = L.bigIdx[0], q = pts[bi];
    s += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="#ffd43b" stroke="#1d3557" stroke-width="1.5"/>`;
  });
  return s + '</svg>';
}
function stepQuiz() {
  step = 1; pips(); clearHandlers(); resetView(); V.t = 0; V.tTarget = 0; V.train.on = true;
  setMode('ろせんず 📋');
  const L0 = C.lines[0], mark = L0.st[L0.bigIdx[0]];
  setMsg(`ろせんずを よく 見てね。ほんとうの <ruby>地図<rt>ちず</rt></ruby>の 形は どれ？<br><small>🟡 は ${stName(mark)}。</small>`);
  const kinds = shuffle(['real', 'neat', 'flip']);
  setCtrl(`<div class="choices">${kinds.map((k, i) => `<button class="choice" data-k="${k}"><b>${'あいう'[i]}</b>${miniSvg(k)}</button>`).join('')}</div>`);
  let done = false;
  document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (done || b.classList.contains('ng')) return;
    audio();
    const k = b.dataset.k;
    if (k === 'real') {
      done = true; b.classList.add('ok'); SND.ok(); toast('せいかい！');
      V.tSpeed = .8; V.tTarget = 1; setMode('ほんとうの ちず 🗺️');
      setMsg(`せいかい！ ほんとうの 形は でこぼこ。ろせんずは ${C.neat}に かんたんに して あるんだね。`);
      setTimeout(() => { V.train.dizzy = false; say('ろせんずに だまされた〜！ でこぼこ だよ〜', 3200); SND.boing(); }, 1300);
      nextBtn('つぎへ ▶', stepPuzzle);
    } else {
      mistakes++; b.classList.add('ng', 'shake'); SND.ng(); toast('ざんねん', true);
      setMsg(k === 'neat'
        ? `それは ろせんずと おなじ 形。ほんとうの <ruby>地図<rt>ちず</rt></ruby>は こんなに きれいじゃ ないよ。もういちど！`
        : `おしい！ それは さかさま。🟡 の ${stName(mark)}は どっちに ある？ もういちど！`);
    }
  });
}

/* ===== ステップ 3: パズル（地図 → ろせんず） ===== */
function stepPuzzle() {
  step = 2; pips(); clearHandlers(); resetView();
  V.kind = 'puzzle'; V.pp = 0; V.ppVis = 0; V.stageB = false; V.placed = null; V.train.on = false; V.labels = true;
  setMode('ちず 🗺️ → ろせんず 📋');
  setMsg(`こんどは ぎゃく！ この <ruby>地図<rt>ちず</rt></ruby>を ろせんずに しよう。<br>① <b>がめんを ぐい〜っと なぞって</b>、線を ${C.lines[0].loop ? 'まるく' : 'まっすぐに'} のばそう。`);
  setCtrl('');
  let last = null, scale = Math.min(V.W, V.H) * 1.1, laughed = false;
  stageDown = p => { if (V.spring || V.stageB) return; audio(); last = p; };
  stageMove = p => {
    if (!last || V.spring || V.stageB) return;
    const d = Math.hypot(p[0] - last[0], p[1] - last[1]); last = p;
    V.pp = Math.min(1.55, V.pp + d / scale); V.ppVis = V.pp;
  };
  stageUp = () => {
    if (!last) return; last = null;
    if (V.stageB || V.spring) return;
    if (V.pp > 1.08) {
      laughed = true; SND.boing();
      setMsg('わわっ！ のばしすぎて <ruby>線<rt>せん</rt></ruby>が がめんから はみでちゃった〜！ 😂 …ぼよよん。');
      V.spring = { from: V.pp, to: 1, k: 0, cb: startB };
    } else if (V.pp > .92) { V.spring = { from: V.pp, to: 1, k: 0, cb: startB }; }
    else setMsg(`いいね！ もっと もっと なぞって！ <small>（${Math.round(V.pp * 100)}％）</small>`);
  };
  function startB() {
    V.pp = 1; V.stageB = true; SND.ok(); toast(C.lines[0].loop ? 'まるく なった！' : 'まっすぐ！');
    V.placed = C.lines.map(L => L.st.map(() => 0));
    // もう ほとんど ばしょが あっている 駅は さいしょから OK
    C.lines.forEach((L, li) => L.st.forEach((s, i) => { const a = uvToPx(L.midUV[i]), b = uvToPx(L.schemUV[i]); if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 3) V.placed[li][i] = 1; }));
    if (V.placed.every(a => a.every(v => v > 0))) { checkDone(); return; }
    setTimeout(() => setMsg(`${laughed ? 'ちょうど よく なった！ ' : ''}② こんどは <ruby>駅<rt>えき</rt></ruby>を おなじ あいだに ならべよう。<br><b>○ の 駅を タップ</b>すると、てんてんの ○ へ ぴょん！`), laughed ? 1400 : 0);
    let taps = 0;
    stageDown = p => {
      let best = null, bd = 40;
      C.lines.forEach((L, li) => { const P = positions(L, li); P.forEach((q, i) => { if (V.placed[li][i] > 0) return; const d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < bd) { bd = d; best = [li, i]; } }); });
      if (!best) return;
      V.placed[best[0]][best[1]] = .01; SND.pyon(taps); taps++;
      if (taps === 3) { setCtrl(''); const w = document.createElement('div'); w.className = 'btns'; w.innerHTML = '<button class="big sec">🐇 のこり ぜんぶ ぴょん！</button>'; w.firstChild.onclick = () => { SND.tap(); allJump(); }; $('ctrl').appendChild(w); }
      checkDone();
    };
    stageMove = stageUp = null;
  }
  function allJump() { let k = 0; V.placed.forEach(a => a.forEach((v, i) => { if (v === 0) { setTimeout(() => { a[i] = .01; SND.pyon(k++); }, k * 60); k++; } })); setTimeout(checkDone, k * 60 + 50); }
  function checkDone() {
    if (!V.placed.every(a => a.every(v => v > 0))) return;
    stageDown = null; setCtrl('');
    setTimeout(() => {
      SND.fan(); toast('ろせんず かんせい！');
      setMsg(`ろせんずの できあがり！ <ruby>駅<rt>えき</rt></ruby>の じゅんばんは そのまま、形と ながさを かんたんに したんだね。`);
      V.kind = 'morph'; V.t = 0; V.tTarget = 0; V.stageB = false; V.placed = null; V.train.on = true; V.train.dizzy = false;
      setMode('ろせんず 📋'); say('はしりやすい〜♪', 2000);
      nextBtn('つぎへ ▶', stepNagai);
    }, 700);
  }
}

/* ===== ステップ 4: ほんとうに ながい あいだ ===== */
function stepNagai() {
  step = 3; pips(); clearHandlers(); resetView(); V.t = 1; V.tTarget = 1; V.train.on = false;
  setMode('ほんとうの ちず 🗺️');
  setMsg(`ろせんずでは どこも おなじ ながさ。でも <ruby>地図<rt>ちず</rt></ruby>では？<br><b><ruby>駅<rt>えき</rt></ruby>と <ruby>駅<rt>えき</rt></ruby>の あいだが いちばん ながい ところ</b>を タップ！`);
  setCtrl('');
  const segs = [];
  C.lines.forEach((L, li) => L.gaps.forEach((g, i) => segs.push({ li, i, d: g })));
  const max = Math.max(...segs.map(s => s.d));
  const sorted = segs.slice().sort((a, b) => b.d - a.d);
  const best = sorted[0];
  let wrong = 0, done = false;
  stageDown = p => {
    if (done) return; audio();
    let hit = null, hd = 34;
    C.lines.forEach((L, li) => { const P = positions(L, li); L.gaps.forEach((g, i) => { const a = P[i], b = P[(i + 1) % P.length]; const d = segDist(p, a, b); if (d < hd) { hd = d; hit = segs.find(s => s.li === li && s.i === i); } }); });
    if (!hit) return;
    const L = C.lines[hit.li], A = L.st[hit.i], B = L.st[(hit.i + 1) % L.st.length];
    const kmTxt = `やく ${hit.d < 10 ? hit.d.toFixed(1) : Math.round(hit.d)}キロ`;
    if (hit.d >= max * .9) {
      done = true; V.hl = { li: hit.li, i: hit.i, c: '#ffd43b' }; SND.ok(); toast('みつけた！');
      const walk = Math.round(hit.d * 12.5);
      setMsg(`${stName(A)}〜${stName(B)}！ <ruby>地図<rt>ちず</rt></ruby>の 上で ${kmTxt}。<small>（あるくと ${walk >= 120 ? 'やく ' + Math.round(walk / 60) + 'じかん' : 'やく ' + walk + 'ぷん'}）</small><br>ろせんずに もどすと…？`);
      if (hit !== best) setTimeout(() => setMsg($('msg').innerHTML + `<br><small>（いちばんは ${stName(C.lines[best.li].st[best.i])}〜${stName(C.lines[best.li].st[(best.i + 1) % C.lines[best.li].st.length])}。ほぼ おなじ！）</small>`), 10);
      setTimeout(() => { V.tSpeed = .7; V.tTarget = 0; setMode('ろせんず 📋'); }, 1500);
      setTimeout(() => {
        V.train.on = true; V.train.dizzy = false; say('ろせんずだと ほかと おなじ ながさ！', 3000);
        setMsg(`ろせんずだと ほかの あいだと おなじ ながさ！ ほんとうの ながさは <ruby>地図<rt>ちず</rt></ruby>で 見ようね。`);
        nextBtn('まとめへ ▶', stepSum);
      }, 3000);
    } else {
      mistakes++; wrong++; SND.ng(); V.hl = { li: hit.li, i: hit.i, c: '#adb5bd' };
      const rank = sorted.indexOf(hit);
      toast(rank < 3 ? 'おしい！' : 'みじかい かも', true);
      setMsg(`${stName(A)}〜${stName(B)}は ${kmTxt}。${rank < 3 ? 'おしい！ もうすこし ながい ところが あるよ。' : 'もっと <ruby>駅<rt>えき</rt></ruby>と <ruby>駅<rt>えき</rt></ruby>が はなれている ところは？'}${wrong >= 2 ? '<br><small>ヒント: きいろく ひかっている あたり！</small>' : ''}`);
      if (wrong >= 2) hintPulse(best);
    }
  };
}
function hintPulse(best) {
  hintPulse.last = best;
  const g = G.lines[best.li].dots, L = C.lines[best.li], j = (best.i + 1) % L.st.length;
  [g[best.i], g[j]].forEach(c => { c.setAttribute('fill', '#ffd43b'); c.setAttribute('r', 9); });
}
function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
  let t = l ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}

/* ===== ステップ 5: まとめ ===== */
function stepSum() {
  step = 4; pips(); clearHandlers();
  const stars = mistakes <= 1 ? 3 : mistakes <= 3 ? 2 : 1;
  if ((SV.stars[C.id] || 0) < stars) { SV.stars[C.id] = stars; save(); }
  SND.fan();
  const s = $('sum'); s.classList.remove('hide');
  s.innerHTML = `<h2>🎉 ${C.name} クリア！</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <div class="cards">
      <div class="lcard"><span class="e">📋</span><span>ろせんずは「どの <ruby>駅<rt>えき</rt></ruby>の つぎに どの <ruby>駅<rt>えき</rt></ruby>か」を 見やすく する <ruby>絵<rt>え</rt></ruby>。</span></div>
      <div class="lcard"><span class="e">📏</span><span>ほんとうの <ruby>長<rt>なが</rt></ruby>さや <ruby>向<rt>む</rt></ruby>きは ちがう ことが あるよ。</span></div>
      <div class="lcard"><span class="e">🧳</span><span><ruby>旅<rt>たび</rt></ruby>の けいかくは ろせんず、🚶 <ruby>歩<rt>ある</rt></ruby>く <ruby>道<rt>みち</rt></ruby>は <ruby>地図<rt>ちず</rt></ruby>。</span></div>
    </div>
    <div class="point">💡 ろせんずの <ruby>線<rt>せん</rt></ruby>の じゅんばんを 見ると、つぎの <ruby>駅<rt>えき</rt></ruby>が わかるよ。</div>
    <p class="next">つぎは <a href="../tomaru-tobasu/">「とまる？ とばす？ きゅうこう えらび」</a>で、ろせんずの ◯ を 見て とまる <ruby>駅<rt>えき</rt></ruby>を しらべて みよう。</p>
    <div class="btns"><button class="big" id="bAgain">🔁 もういちど</button><button class="big sec" id="bOther">🗺️ ほかの コース</button></div>`;
  $('bAgain').onclick = () => { SND.tap(); startCourse(C); };
  $('bOther').onclick = () => { SND.tap(); showTitle(); };
  setMsg('よく できました！'); setCtrl('');
}

/* ===== すすめかた ===== */
function resetView() {
  hintPulse.last = null;
  V.kind = 'morph'; V.hl = null; V.placed = null; V.stageB = false; V.spring = null; V.labels = true;
  V.train.on = true; V.train.dizzy = false; V.train.say = ''; V.tSpeed = 1.6;
  $('sum').classList.add('hide');
  if (G.lines) G.lines.forEach((g, li) => g.dots.forEach((c, i) => { c.setAttribute('fill', '#fff'); c.setAttribute('r', C.lines[li].bigIdx.includes(i) ? 7 : 5); }));
}
function startCourse(c) {
  C = c; prepCourse(C); mistakes = 0;
  $('title').classList.add('hide');
  $('cname').innerHTML = `${C.emoji} ${C.name}`;
  layout(); buildSvg(); V.train.s = 0; V.train.dir = 1;
  stepHenshin();
}
function courseIcon(c) {
  prepCourse(c);
  const vb = 160, vh = 62, p = 6, B = c.box, sc = Math.min((vb - p * 2) / B.w, (vh - p * 2) / B.h), w = B.w * sc, h = B.h * sc, ox = (vb - w) / 2, oy = (vh - h) / 2;
  let s = `<svg viewBox="0 0 ${vb} ${vh}">`;
  c.lines.forEach(L => { const pts = L.real.map(uv => [ox + uv[0] * w, oy + uv[1] * h]); s += `<path d="M${pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L')}${L.loop ? 'Z' : ''}" fill="none" stroke="${L.c}" stroke-width="4" stroke-linejoin="round"/>`; });
  return s + '</svg>';
}
function showTitle() {
  $('title').classList.remove('hide'); clearHandlers();
  $('courses').innerHTML = COURSES.map((c, i) => `<button class="course" style="--c:${c.c}" data-i="${i}">
      ${courseIcon(c)}<span>${c.emoji} ${c.name}</span><span class="sub">ろせんずでは ${c.neat}</span>
      <span class="best">${SV.stars[c.id] ? '⭐'.repeat(SV.stars[c.id]) + '☆'.repeat(3 - SV.stars[c.id]) : ''}</span></button>`).join('');
  document.querySelectorAll('.course').forEach(b => b.onclick = () => { audio(); SND.tap(); startCourse(COURSES[+b.dataset.i]); });
}
function layout() { document.body.classList.toggle('land', innerWidth > innerHeight && innerWidth >= 640); }
let rsT = 0;
addEventListener('resize', layout);
// ぶたいの 大きさが かわったら（メッセージの 行数・ボタン・画面の 向き）SVG を つくりなおす
function rebuild() {
  if (!C || !$('title').classList.contains('hide')) return;
  const r = $('stage').getBoundingClientRect();
  if (Math.abs(r.width - V.W) < 1 && Math.abs(r.height - V.H) < 1) return;
  buildSvg();
  if (step === 3 && hintPulse.last) hintPulse(hintPulse.last);
}
if (window.ResizeObserver) new ResizeObserver(rebuild).observe($('stage')); else addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 120); });

function sndBtn() { $('bSnd').textContent = SV.sound ? '🔊' : '🔇'; $('bSnd2').textContent = SV.sound ? '🔊 おと オン' : '🔇 おと オフ'; }
function toggleSnd() { SV.sound = !SV.sound; save(); sndBtn(); if (SV.sound) { audio(); SND.tap(); } }
$('bSnd').onclick = toggleSnd; $('bSnd2').onclick = toggleSnd;
$('bHome').onclick = () => { SND.tap(); showTitle(); };

sndBtn(); layout(); showTitle();
requestAnimationFrame(frame);
</script>
</body>
