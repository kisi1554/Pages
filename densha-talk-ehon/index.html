<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>でんしゃトーク ほしぞらのたんけん</title>
<meta name="description" content="でんしゃトークのなかまたちが、ほしぞらとちきゅうをたんけんする よみきかせ えほん(おんせいつき)。">
<style>
  :root{
    --ink:#fff8ed;
    --accent:#ffd166;
    --bg1:#070b1c;
    --bg2:#141b3d;
    --card:#141a33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100svh;
    background:radial-gradient(ellipse at 50% -10%, #1b2a57 0%, var(--bg1) 55%, #04060f 100%);
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 12px 28px;
  }
  header{ text-align:center; margin-bottom:14px; }
  header h1{
    margin:0; font-size:clamp(20px,3.6vw,30px); letter-spacing:.02em;
    color:var(--accent); text-shadow:0 2px 10px rgba(255,209,102,.25);
  }
  header p{ margin:4px 0 0; font-size:clamp(12px,2vw,14px); color:#cadcfc; opacity:.9; }

  .book{
    width:100%;
    max-width:980px;
    container-type: inline-size;
  }
  .stage{
    position:relative;
    width:100%;
    aspect-ratio:1333/750;
    border-radius:20px;
    overflow:hidden;
    background:#070b1c;
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06) inset;
  }
  .stage svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .stage svg text{ user-select:none; }

  .fade-in{ animation:fadeIn .45s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:scale(.985);} to{opacity:1; transform:scale(1);} }

  .controls{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .navGroup{ display:flex; align-items:center; gap:10px; }
  .audioGroup{ display:flex; align-items:center; gap:8px; }

  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:10px 18px;
    font-size:15px;
    font-weight:700;
    color:#241b4e;
    background:var(--accent);
    box-shadow:0 4px 14px rgba(255,209,102,.25);
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{ transform:scale(.95); }
  button:disabled{ opacity:.35; cursor:default; transform:none; }
  button.ghost{
    background:rgba(255,255,255,.08);
    color:var(--ink);
    box-shadow:none;
    border:1px solid rgba(255,255,255,.18);
  }
  button.ghost.active{
    background:rgba(255,209,102,.18);
    border-color:var(--accent);
    color:var(--accent);
  }
  .pageInfo{
    font-size:15px; font-weight:700; color:var(--ink);
    min-width:64px; text-align:center;
    font-variant-numeric:tabular-nums;
  }

  .dots{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
    margin-top:14px; max-width:100%;
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background:rgba(255,255,255,.22);
    border:none; padding:0; cursor:pointer;
  }
  .dot.current{ background:var(--accent); box-shadow:0 0 0 3px rgba(255,209,102,.25); }

  .hint{
    margin-top:10px; font-size:12px; color:#9fb0d9; text-align:center; max-width:640px;
    line-height:1.7;
  }
  .speakBadge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; color:var(--accent);
    opacity:0; transition:opacity .2s ease;
  }
  .speakBadge.on{ opacity:1; }
  .speakBadge .dotpulse{
    width:8px;height:8px;border-radius:50%;background:var(--accent);
    animation:pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{transform:scale(.6);opacity:.5;} 50%{transform:scale(1);opacity:1;} }

  footer{ margin-top:22px; font-size:11px; color:#9fb0d9; opacity:.7; text-align:center; }
  footer a{ color:#cadcfc; }

  @media (max-width:520px){
    button{ padding:9px 14px; font-size:13px; }
    .dots{ display:none; }
  }
</style>
</head>
<body>

<div class="book">
  <header>
    <h1>でんしゃトーク ほしぞらのたんけん</h1>
    <p>ちきゅうと おほしさまの えほん — おんせいよみあげ つき</p>
  </header>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <div class="navGroup">
      <button id="prevBtn" class="ghost" aria-label="まえのページ">◀ まえ</button>
      <div class="pageInfo"><span id="pageNum">1</span> / <span id="pageTotal">30</span></div>
      <button id="nextBtn">つぎ ▶</button>
    </div>
    <div class="audioGroup">
      <span class="speakBadge" id="speakBadge"><span class="dotpulse"></span>よみあげちゅう…</span>
      <button id="speakBtn" class="ghost" aria-label="このページをよみあげる">🔊 きく</button>
      <button id="autoBtn" class="ghost active" aria-label="じどうよみあげ">🔁 じどう:ON</button>
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <p class="hint">
    ← → キーや がめんのボタンで ページを めくれます。「🔊 きく」で もういちど よみあげます。
    はじめて おんせいを ながすには、いちど がめんを タップしてください(iPhone/iPad)。
  </p>

  <footer>
    でんしゃトークの なかまたちが とうじょうする よみきかせ えほんです。おんせいは たんまつの
    よみあげきのう(Web Speech API)を つかっていて、どこにも つうしんしません。<br>
    <a href="../densha-talk/">🚃 でんしゃトーク(おしゃべりアプリ)へ もどる</a>
  </footer>
</div>

<script>
"use strict";

/* ==================================================================
 * 0. キャラクター設定 (densha-talk/knowledge.js の CHARACTERS に準拠)
 * ================================================================== */
const CH = {
  roman:      { name:"ろまんちゃん",   color:"#0068B7", ink:"#00457A", hat:"👑" },
  yamanoten:  { name:"やまのてん",     color:"#9ACD32", ink:"#4F7A06", hat:"🔁" },
  ginjiro:    { name:"ぎんじろう",     color:"#FF9500", ink:"#A35C00", hat:"🎩" },
  maruko:     { name:"まるこ",         color:"#F62E36", ink:"#A3151B", hat:"🎀" },
  keikyu:     { name:"けいきゅん",     color:"#E5171F", ink:"#9B0D13", hat:"🔥" },
  tokaido:    { name:"とうかいくん",   color:"#F68B1E", ink:"#A15A08", hat:"🏖️" },
  uenotokyo:  { name:"うえとうくん",   color:"#6A5ACD", ink:"#3D2F7A", hat:"🌉" },
};
const CAST = [CH.roman, CH.yamanoten, CH.ginjiro, CH.maruko, CH.keikyu, CH.tokaido, CH.uenotokyo];

const VB_W = 1333, VB_H = 750;

/* ==================================================================
 * 1. 汎用ユーティリティ
 * ================================================================== */
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function seeded(seed){
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

let uid = 0;
function nextId(prefix){ return prefix + (uid++); }

/* 星空 / 夜明けの背景 */
function bgRect(kind){
  const gid = kind === "dawn" ? "dawnGrad" : "nightGrad";
  return `<rect x="0" y="0" width="${VB_W}" height="${VB_H}" fill="url(#${gid})"/>`;
}

function starfield(seed, count, opts){
  opts = opts || {};
  const yMin = opts.yMin !== undefined ? opts.yMin : 0;
  const yMax = opts.yMax !== undefined ? opts.yMax : VB_H;
  const r = seeded(seed);
  let s = "";
  for (let i = 0; i < count; i++){
    const x = r() * VB_W;
    const y = yMin + r() * (yMax - yMin);
    if (r() > 0.9){
      const fs = 14 + r() * 10;
      s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs.toFixed(1)}" fill="#fff6de" text-anchor="middle" opacity="${(0.75+r()*0.25).toFixed(2)}">★</text>`;
    } else {
      const rr = 1.6 + r() * 2.6;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="#fff6de" opacity="${(0.45+r()*0.5).toFixed(2)}"/>`;
    }
  }
  return s;
}

/* 光る惑星・月(グロー付き円) */
function glowDef(defs, color, opacity){
  const id = nextId("glow");
  defs.push(`<radialGradient id="${id}" cx="50%" cy="50%" r="50%">
    <stop offset="55%" stop-color="${color}" stop-opacity="${opacity!==undefined?opacity:0.55}"/>
    <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
  </radialGradient>`);
  return id;
}
function planet(defs, cx, cy, r, color, opts){
  opts = opts || {};
  let s = "";
  if (opts.glow !== false){
    const gid = glowDef(defs, opts.glowColor || color, opts.glowOpacity);
    const gr = r * 1.55;
    s += `<circle cx="${cx}" cy="${cy}" r="${gr}" fill="url(#${gid})"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
  return s;
}

/* 電車キャラクター */
function trainChar(cx, feetY, scale, ch, opts){
  opts = opts || {};
  const bodyW = scale * 115, bodyH = scale * 82;
  const bx = cx - bodyW / 2;
  const by = feetY - bodyH - scale * 22;
  const wheelR = scale * 15;
  let s = "";

  s += `<ellipse cx="${cx}" cy="${(feetY+3).toFixed(1)}" rx="${(bodyW*0.45).toFixed(1)}" ry="${(scale*7).toFixed(1)}" fill="#000" opacity="0.22"/>`;
  s += `<circle cx="${(bx+bodyW*0.16).toFixed(1)}" cy="${(by+bodyH-wheelR*0.4).toFixed(1)}" r="${wheelR.toFixed(1)}" fill="#2b2b2b"/>`;
  s += `<circle cx="${(bx+bodyW*0.84).toFixed(1)}" cy="${(by+bodyH-wheelR*0.4).toFixed(1)}" r="${wheelR.toFixed(1)}" fill="#2b2b2b"/>`;

  s += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bodyH.toFixed(1)}" rx="${(scale*12).toFixed(1)}" fill="${ch.color}" stroke="${ch.ink}" stroke-width="2.2"/>`;

  const plateW = bodyW * 0.72, plateH = bodyH * 0.56;
  const px = cx - plateW / 2, py = by + bodyH * 0.14;
  s += `<rect x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${plateW.toFixed(1)}" height="${plateH.toFixed(1)}" rx="${(scale*9).toFixed(1)}" fill="#fff8ed" stroke="${ch.ink}" stroke-width="1.4"/>`;

  const eyeY = py + plateH * 0.44;
  const eyeGap = plateW * 0.26;
  const eyeR = scale * 8.5;
  if (opts.sleepy){
    [cx-eyeGap, cx+eyeGap].forEach(ex=>{
      s += `<line x1="${(ex-eyeR).toFixed(1)}" y1="${eyeY.toFixed(1)}" x2="${(ex+eyeR).toFixed(1)}" y2="${eyeY.toFixed(1)}" stroke="${ch.ink}" stroke-width="3" stroke-linecap="round"/>`;
    });
  } else if (opts.star){
    [cx-eyeGap, cx+eyeGap].forEach(ex=>{
      s += `<text x="${ex.toFixed(1)}" y="${(eyeY+eyeR*0.75).toFixed(1)}" font-size="${(eyeR*2.3).toFixed(1)}" text-anchor="middle" fill="#ffc94a">★</text>`;
    });
  } else {
    [cx-eyeGap, cx+eyeGap].forEach(ex=>{
      s += `<circle cx="${ex.toFixed(1)}" cy="${eyeY.toFixed(1)}" r="${eyeR.toFixed(1)}" fill="#2b2b2b"/>`;
      s += `<circle cx="${(ex-eyeR*0.35).toFixed(1)}" cy="${(eyeY-eyeR*0.32).toFixed(1)}" r="${(eyeR*0.32).toFixed(1)}" fill="#fff"/>`;
    });
  }
  const cheekR = scale * 5.5;
  [cx-eyeGap*1.6, cx+eyeGap*1.6].forEach(cxk=>{
    s += `<circle cx="${cxk.toFixed(1)}" cy="${(eyeY+scale*6).toFixed(1)}" r="${cheekR.toFixed(1)}" fill="#ffb6a0" opacity="0.55"/>`;
  });

  const mouthY = py + plateH * 0.76;
  s += `<text x="${cx.toFixed(1)}" y="${mouthY.toFixed(1)}" font-size="${(scale*20).toFixed(1)}" text-anchor="middle" fill="${ch.ink}">${opts.mouth || "⌣"}</text>`;

  s += `<text x="${cx.toFixed(1)}" y="${(by-scale*10).toFixed(1)}" font-size="${(scale*28).toFixed(1)}" text-anchor="middle">${ch.hat}</text>`;

  if (opts.label !== false){
    s += `<text x="${cx.toFixed(1)}" y="${(feetY+scale*24).toFixed(1)}" font-size="15" text-anchor="middle" fill="#fff8ed" font-weight="700">${esc(ch.name)}</text>`;
  }
  return s;
}

/* ふきだし */
function bubble(x, y, w, h, text, ink, opts){
  opts = opts || {};
  ink = ink || "#2b2b2b";
  const lines = text.split("\n");
  const fontSize = opts.fontSize || 22;
  let s = "";
  const tailBaseX = x + w * (opts.tailPos !== undefined ? opts.tailPos : 0.18);
  s += `<polygon points="${(tailBaseX-13).toFixed(1)},${(y+h-1).toFixed(1)} ${(tailBaseX+19).toFixed(1)},${(y+h-1).toFixed(1)} ${(tailBaseX-3).toFixed(1)},${(y+h+26).toFixed(1)}" fill="#fff" stroke="${ink}" stroke-width="2"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#fff" stroke="${ink}" stroke-width="2.2"/>`;
  const lh = fontSize * 1.3;
  const startY = y + h/2 - (lines.length-1)*lh/2 + fontSize*0.35;
  s += `<text x="${(x+w/2).toFixed(1)}" y="${startY.toFixed(1)}" font-size="${fontSize}" text-anchor="middle" fill="#2b2b2b" font-weight="600">`;
  lines.forEach((line,i)=>{ s += `<tspan x="${(x+w/2).toFixed(1)}" dy="${i===0?0:lh}">${esc(line)}</tspan>`; });
  s += `</text>`;
  return s;
}

/* キャプション(下部の本文おびボックス) */
function captionBox(text, opts){
  opts = opts || {};
  const y = opts.y !== undefined ? opts.y : 600;
  const h = opts.h || 115;
  const lines = text.split("\n");
  const fontSize = opts.fontSize || 25;
  let s = `<rect x="40" y="${y}" width="${VB_W-80}" height="${h}" rx="16" fill="#0a0f2e" fill-opacity="0.8" stroke="#ffd166" stroke-opacity="0.55" stroke-width="1.6"/>`;
  const lh = fontSize * 1.42;
  const startY = y + h/2 - (lines.length-1)*lh/2 + fontSize*0.36;
  s += `<text x="72" y="${startY.toFixed(1)}" font-size="${fontSize}" fill="#fff8ed">`;
  lines.forEach((line,i)=>{ s += `<tspan x="72" dy="${i===0?0:lh}">${esc(line)}</tspan>`; });
  s += `</text>`;
  return s;
}

/* 月の満ち欠け(円を重ねてかたちをつくる) */
function moonPhase(cx, cy, r, phase){
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1B2A57" stroke="#F1EAD6" stroke-width="2.4"/>`;
  if (phase === 0){
    s += `<circle cx="${cx}" cy="${cy}" r="${r-6}" fill="#F1EAD6"/>`;
  } else if (phase === 1){
    s += `<circle cx="${cx}" cy="${cy}" r="${r-6}" fill="#F1EAD6"/>`;
    s += `<rect x="${cx-r-4}" y="${cy-r-4}" width="${r+4}" height="${r*2+8}" fill="#1B2A57"/>`;
  } else if (phase === 2){
    s += `<circle cx="${cx}" cy="${cy}" r="${r-6}" fill="#F1EAD6"/>`;
    s += `<circle cx="${cx-r*1.15}" cy="${cy}" r="${r}" fill="#1B2A57"/>`;
  }
  return s;
}

/* 昼夜のちきゅう(グラデーションでなめらかに) */
function earthDayNight(defs, cx, cy, r){
  const id = nextId("dn");
  defs.push(`<linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#16234F"/>
    <stop offset="40%" stop-color="#16234F"/>
    <stop offset="60%" stop-color="#FFD166"/>
    <stop offset="100%" stop-color="#FFD166"/>
  </linearGradient>`);
  let s = `<circle cx="${cx}" cy="${cy}" r="${r+16}" fill="#FFD166" opacity="0.12"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`;
  return s;
}

/* 大陸 */
function continents(cx, cy, spots){
  let s = "";
  spots.forEach(([dx,dy,w,h])=>{
    s += `<ellipse cx="${(cx+dx).toFixed(1)}" cy="${(cy+dy).toFixed(1)}" rx="${(w/2).toFixed(1)}" ry="${(h/2).toFixed(1)}" fill="#27AE60"/>`;
  });
  return s;
}

/* 木星(バンドをクリップして描く) */
function jupiterPlanet(defs, cx, cy, r){
  const clipId = nextId("clip");
  defs.push(`<clipPath id="${clipId}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`);
  let s = `<circle cx="${cx}" cy="${cy}" r="${r+16}" fill="#FFDDA8" opacity="0.16"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#E8C39E"/>`;
  const bands = [["#D9A868",-0.62],["#F1DDBB",-0.28],["#C98A4E",0.05],["#F1DDBB",0.38],["#D9A868",0.68]];
  s += `<g clip-path="url(#${clipId})">`;
  bands.forEach(([color,t])=>{
    s += `<ellipse cx="${cx}" cy="${(cy+t*r).toFixed(1)}" rx="${r}" ry="${(r*0.14).toFixed(1)}" fill="${color}" opacity="0.85"/>`;
  });
  s += `</g>`;
  return s;
}

/* 土星 */
function saturnPlanet(cx, cy, r){
  let s = `<ellipse cx="${cx}" cy="${cy}" rx="${(r*1.9).toFixed(1)}" ry="${(r*0.62).toFixed(1)}" fill="none" stroke="#E8C97A" stroke-width="15" opacity="0.9" transform="rotate(-16 ${cx} ${cy})"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r+12}" fill="#FFE8B0" opacity="0.16"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#E8D3A0"/>`;
  return s;
}

/* 太陽(とげとげ光線) */
function sunBurst(defs, cx, cy, r){
  const gid = glowDef(defs, "#FFD166", 0.6);
  let s = `<circle cx="${cx}" cy="${cy}" r="${r*1.7}" fill="url(#${gid})"/>`;
  let pts = "";
  const n = 16;
  for (let i=0;i<n;i++){
    const a = (i/n) * Math.PI * 2;
    const a2 = a + Math.PI/n;
    const ox = cx + Math.cos(a)*(r*1.28), oy = cy + Math.sin(a)*(r*1.28);
    const b1x = cx + Math.cos(a-0.09)*r, b1y = cy + Math.sin(a-0.09)*r;
    const b2x = cx + Math.cos(a+0.09)*r, b2y = cy + Math.sin(a+0.09)*r;
    pts += `<polygon points="${b1x.toFixed(1)},${b1y.toFixed(1)} ${ox.toFixed(1)},${oy.toFixed(1)} ${b2x.toFixed(1)},${b2y.toFixed(1)}" fill="#FFD166" opacity="0.85"/>`;
  }
  s += pts;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFB020"/>`;
  return s;
}

/* 流れ星 */
function shootingStar(cx, cy, len, ang){
  const rad = ang * Math.PI / 180;
  const tx = cx - Math.cos(rad)*len, ty = cy - Math.sin(rad)*len;
  const perp = rad + Math.PI/2;
  const wx = Math.cos(perp)*10, wy = Math.sin(perp)*10;
  let s = `<polygon points="${(tx+wx).toFixed(1)},${(ty+wy).toFixed(1)} ${(tx-wx).toFixed(1)},${(ty-wy).toFixed(1)} ${cx.toFixed(1)},${cy.toFixed(1)}" fill="#FFD166" opacity="0.85"/>`;
  s += `<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" font-size="34" text-anchor="middle" fill="#FFF3C4">★</text>`;
  return s;
}

/* 星座(点をつないだ点線) */
function constellation(pts){
  let s = "";
  for (let i=0;i<pts.length-1;i++){
    s += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i+1][0]}" y2="${pts[i+1][1]}" stroke="#FFD166" stroke-width="2.6" stroke-dasharray="8 7"/>`;
  }
  pts.forEach(([x,y])=>{
    s += `<text x="${x}" y="${y}" font-size="26" text-anchor="middle" fill="#FFD166">★</text>`;
  });
  return s;
}

function rowOf(cast, startX, y, gap, scale, opts){
  let s = "";
  cast.forEach((c,i)=>{ s += trainChar(startX + i*gap, y, scale, c, opts||{}); });
  return s;
}

/* ==================================================================
 * 2. ページの定義 (全30ページ)
 * ================================================================== */
const PAGES = [];

function addPage(def){ PAGES.push(def); }

/* ---- P1 表紙 ---- */
addPage({
  bg: "night",
  narration: "でんしゃトーク、ほしぞらのたんけん。ちきゅうと おほしさまの えほんです。",
  build(defs){
    let s = starfield(101, 70);
    s += planet(defs, 1180, 150, 82, "#F1EAD6", { glowColor:"#FFF3C4" });

/* ==================================================================
 * 3. 背景グラデーション定義
 * ================================================================== */
const STATIC_DEFS = `
  <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#070B24"/>
    <stop offset="100%" stop-color="#1B2A57"/>
  </linearGradient>
  <linearGradient id="dawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#241B4E"/>
    <stop offset="100%" stop-color="#F6A24C"/>
  </linearGradient>
`;
/* night2(たいようのページ)は紺〜紫のグラデーション */
const NIGHT2_GRAD = `
  <linearGradient id="night2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#070B24"/>
    <stop offset="100%" stop-color="#3A2A6B"/>
  </linearGradient>
`;

/* ==================================================================
 * 4. 描画・ナビゲーション
 * ================================================================== */
const stageEl = document.getElementById("stage");
const pageNumEl = document.getElementById("pageNum");
const pageTotalEl = document.getElementById("pageTotal");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const speakBtn = document.getElementById("speakBtn");
const autoBtn = document.getElementById("autoBtn");
const speakBadge = document.getElementById("speakBadge");
const dotsEl = document.getElementById("dots");

pageTotalEl.textContent = PAGES.length;

let current = 0;
let autoRead = true;
try {
  const savedAuto = localStorage.getItem("ehon-autoread");
  if (savedAuto !== null) autoRead = savedAuto === "1";
  const savedPage = parseInt(localStorage.getItem("ehon-page") || "0", 10);
  if (savedPage >= 0 && savedPage < PAGES.length) current = savedPage;
} catch(e){}

function buildDots(){
  dotsEl.innerHTML = "";
  PAGES.forEach((_,i)=>{
    const b = document.createElement("button");
    b.className = "dot" + (i===current ? " current" : "");
    b.setAttribute("aria-label", "ページ " + (i+1));
    b.addEventListener("click", ()=> goTo(i));
    dotsEl.appendChild(b);
  });
}

function render(){
  const page = PAGES[current];
  const defs = [];
  const bgKind = page.bg;
  let bgSvg;
  let defsExtra = "";
  if (bgKind === "night2"){
    defsExtra = NIGHT2_GRAD;
    bgSvg = `<rect x="0" y="0" width="${VB_W}" height="${VB_H}" fill="url(#night2Grad)"/>`;
  } else if (bgKind === "dawn" || bgKind === "dawn2"){
    bgSvg = bgRect("dawn");
  } else {
    bgSvg = bgRect("night");
  }
  const content = page.build(defs);
  const svg = `<svg viewBox="0 0 ${VB_W} ${VB_H}" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Hiragino Sans',sans-serif" class="fade-in">
    <defs>${STATIC_DEFS}${defsExtra}${defs.join("")}</defs>
    ${bgSvg}
    ${content}
  </svg>`;
  stageEl.innerHTML = svg;

  pageNumEl.textContent = current + 1;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PAGES.length - 1;
  nextBtn.textContent = current === PAGES.length - 1 ? "おしまい" : "つぎ ▶";

  [...dotsEl.children].forEach((d,i)=> d.classList.toggle("current", i===current));

  try {
    localStorage.setItem("ehon-page", String(current));
  } catch(e){}

  if (autoRead) speak(page.narration);
}

function goTo(i){
  if (i < 0 || i >= PAGES.length) return;
  current = i;
  render();
}
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

prevBtn.addEventListener("click", prev);
nextBtn.addEventListener("click", next);

window.addEventListener("keydown",(e)=>{
  if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); prev(); }
});

let touchStartX = null;
stageEl.addEventListener("touchstart", (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
stageEl.addEventListener("touchend", (e)=>{
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40){ dx < 0 ? next() : prev(); }
  touchStartX = null;
}, {passive:true});

/* ==================================================================
 * 5. よみあげ (Web Speech API / 端末内で完結・通信なし)
 * ================================================================== */
const hasSpeech = "speechSynthesis" in window;
let jaVoice = null;

function pickVoice(){
  if (!hasSpeech) return;
  const voices = window.speechSynthesis.getVoices();
  jaVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ja")) || null;
}
if (hasSpeech){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text){
  if (!hasSpeech) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if (jaVoice) u.voice = jaVoice;
  u.rate = 0.95;
  u.pitch = 1.05;
  u.onstart = ()=> speakBadge.classList.add("on");
  u.onend = ()=> speakBadge.classList.remove("on");
  u.onerror = ()=> speakBadge.classList.remove("on");
  window.speechSynthesis.speak(u);
}

speakBtn.addEventListener("click", ()=>{
  speak(PAGES[current].narration);
});
if (!hasSpeech){
  speakBtn.disabled = true;
  speakBtn.textContent = "🔇 よみあげ非対応";
  autoBtn.disabled = true;
}

autoBtn.addEventListener("click", ()=>{
  autoRead = !autoRead;
  autoBtn.textContent = "🔁 じどう:" + (autoRead ? "ON" : "OFF");
  autoBtn.classList.toggle("active", autoRead);
  try { localStorage.setItem("ehon-autoread", autoRead ? "1" : "0"); } catch(e){}
  if (autoRead) speak(PAGES[current].narration);
  else window.speechSynthesis && window.speechSynthesis.cancel();
});
autoBtn.textContent = "🔁 じどう:" + (autoRead ? "ON" : "OFF");
autoBtn.classList.toggle("active", autoRead);

/* iOS などは最初のタップで音声を解放しておく */
let unlocked = false;
function unlockAudio(){
  if (unlocked || !hasSpeech) return;
  unlocked = true;
  const u = new SpeechSynthesisUtterance(" ");
  u.volume = 0;
  window.speechSynthesis.speak(u);
}
document.body.addEventListener("touchstart", unlockAudio, {once:true, passive:true});
document.body.addEventListener("click", unlockAudio, {once:true});

/* ==================================================================
 * 6. 初期化
 * ================================================================== */
buildDots();
render();
</script>
</body>
</html>
