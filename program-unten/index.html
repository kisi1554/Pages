<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e6fd9">
<title>プログラミング うんてんし</title>
<link rel="stylesheet" href="style.css?v=c3db83c">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { e.preventDefault(); }
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- ===== ステージを えらぶ ===== -->
<section id="select" class="screen">
  <header class="bar">
    <a class="btn ghost" href="../" aria-label="あそびメニューへ">🏠</a>
    <h1>🕹️ プログラミング うんてんし</h1>
    <button class="btn ghost snd" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>
  <p class="lead">やじるしカードを ならべて でんしゃを えきまで うごかそう</p>
  <div id="groups"></div>
  <p class="foot">★ クリア　★ ヒントなし　★ いちばん すくない まいすう</p>
</section>

<!-- ===== あそぶ ===== -->
<section id="play" class="screen" hidden>
  <header class="bar">
    <button class="btn ghost" id="toSelect" type="button" aria-label="ステージを えらぶ">◀</button>
    <div class="title">
      <div id="stName"></div>
      <div id="stGoal"></div>
    </div>
    <button class="btn ghost" id="hintBtn" type="button" aria-label="ヒント">💡</button>
    <button class="btn ghost snd" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>
  <div class="main" id="main">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map"></canvas>
      <div id="tip" hidden></div>
      <div id="bubble" hidden></div>
    </div>
    <div class="side">
      <div class="progbox">
        <div class="proghead">
          <span>プログラム</span>
          <span id="count"></span>
        </div>
        <div id="prog" aria-live="polite"></div>
      </div>
      <div class="controls">
        <button class="btn ctl" id="resetBtn" type="button" aria-label="スタートに もどる">⏪<small>もどる</small></button>
        <button class="btn ctl go" id="runBtn" type="button" aria-label="うごかす">▶<small>うごかす</small></button>
        <button class="btn ctl" id="speedBtn" type="button" aria-label="はやさ">🐢<small>ゆっくり</small></button>
      </div>
      <div id="palette"></div>
    </div>
  </div>
</section>

<!-- ===== クリア ===== -->
<div id="clear" class="modal" hidden>
  <div class="panel">
    <div class="big">🎉 クリア！</div>
    <div class="stars" id="clStars"></div>
    <ul id="clList"></ul>
    <p id="clMsg"></p>
    <div class="row">
      <button class="btn" id="clAgain" type="button">もういちど</button>
      <button class="btn go" id="clNext" type="button">つぎへ ▶</button>
    </div>
    <button class="btn ghost wide" id="clSelect" type="button">ステージを えらぶ</button>
  </div>
</div>

<script src="engine.js?v=c3db83c"></script>
<script src="stages.js?v=c3db83c"></script>
<script src="app.js?v=c3db83c"></script>
</body>
</html>
