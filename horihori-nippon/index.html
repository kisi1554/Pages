<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ほりほり にっぽん ｜ ちけいと めいさんの ひみつ</title>
<meta name="description" content="どうして そこで とれるの？ 都道府県の めいさんを、ちけいと きこうから ほりさげる アプリ。">
<meta name="theme-color" content="#8a5a2b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<link rel="stylesheet" href="style.css?v=d2533df">
</head>
<body>
<div id="app">

  <!-- ======================= タイトル ======================= -->
  <section id="s-title" class="screen scroll is-active">
    <header class="title-head">
      <div class="toggles">
        <button type="button" id="btn-sound" class="pill">🔊 おと</button>
        <button type="button" id="btn-voice" class="pill">🗣️ こえ</button>
      </div>
      <h1>⛏️ ほりほり にっぽん</h1>
      <p class="lead">めいさんは <b>どうして</b> そこで とれるの？<br><ruby>地形<rt>ちけい</rt></ruby>と <ruby>気候<rt>きこう</rt></ruby>を ほりさげよう！</p>
    </header>

    <div id="title-map" class="title-map" aria-label="にほんちず"></div>
    <p class="hint">⛏️ を タップすると、その ばしょを ほれるよ</p>

    <div class="progress">
      <div class="bar"><i id="dug-bar"></i></div>
      <span>ほった たから <b id="dug-num">0</b> / 23</span>
    </div>
    <p id="complete" class="complete" hidden>🎉 ぜんぶ ほりあてた！ きみは ちけい はかせ！</p>

    <div class="extras">
      <button type="button" id="btn-quiz" class="extra" style="--accent:#d2543f;--tint:#fbe1dc"><span>🧠</span>なぜなに クイズ</button>
      <button type="button" id="btn-box" class="extra" style="--accent:#c58a1e;--tint:#fbefd4"><span>📦</span>たからばこ</button>
      <button type="button" id="btn-zukan" class="extra wide" style="--accent:#6e9655;--tint:#e3f0d8"><span>📚</span>ちけい ずかん（19しゅるい）</button>
    </div>

    <h2 class="sec">⛏️ ほる ばしょを えらぶ</h2>
    <div id="spot-list"></div>
    <p class="foot">ちずの データ：国土数値情報（国土交通省）由来</p>
  </section>

  <!-- ======================= ほる ======================= -->
  <section id="s-dig" class="screen scroll">
    <header class="bar-head sticky">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2 id="dig-title"></h2>
      <span class="count"></span>
    </header>
    <div class="sky-strip">🌤️ 🌳 🏠 🌳 🌾</div>
    <div id="dig-layers" class="dig-layers"></div>
  </section>

  <!-- ======================= クイズ ======================= -->
  <section id="s-quiz" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="やめる">◀</button>
      <h2>🧠 なぜなに クイズ</h2>
      <button type="button" id="q-again" class="pill" aria-label="もういちど きく">🔈</button>
    </header>
    <div id="quiz-dots" class="dots"></div>
    <p id="quiz-note" class="quiz-note" hidden>まだ ほっていない ばしょからも でるよ。わからなかったら ほってみよう！</p>
    <p id="q-text" class="q-text"></p>
    <div class="quiz-main">
      <div id="q-stage" class="q-stage"></div>
      <div id="q-choices" class="q-choices"></div>
    </div>
    <div id="feedback" class="feedback" hidden></div>
  </section>

  <!-- ======================= けっか ======================= -->
  <section id="s-result" class="screen scroll">
    <div id="result-body" class="result"></div>
    <div class="result-btns">
      <button type="button" id="res-again" class="btn primary">🔁 もういちど</button>
      <button type="button" class="btn" data-go="title">🗾 メニュー</button>
    </div>
  </section>

  <!-- ======================= たからばこ ======================= -->
  <section id="s-box" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2>📦 たからばこ</h2>
      <span id="box-num" class="count"></span>
    </header>
    <div id="box-list" class="box-list scroll-inner"></div>
  </section>

  <!-- ======================= ちけい ずかん ======================= -->
  <section id="s-zukan" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2>📚 ちけい ずかん</h2>
      <span class="count"></span>
    </header>
    <div id="zukan-list" class="zukan scroll-inner"></div>
  </section>
</div>

<script src="map-data.js?v=d2533df"></script>
<script src="data.js?v=d2533df"></script>
<script src="diagrams.js?v=d2533df"></script>
<script src="game.js?v=d2533df"></script>
</body>
</html>
