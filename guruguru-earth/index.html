<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ぐるぐるアース</title>
<meta name="description" content="たいようと ちきゅうを 立体で まわして、ひると よるが うまれる しくみを あそびながら まなぶゲーム。">
<meta name="theme-color" content="#060A1C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=M+PLUS+Rounded+1c:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=a9a2412">
</head>
<body>

<div class="stage" id="stage">
  <canvas id="gl"></canvas>

  <div class="hud" id="hud">
    <div class="mission" id="missionCard">
      <div class="mission-head"><span class="mission-no" id="missionNo">1 / 7</span><span id="missionKind">ミッション</span></div>
      <h1 class="mission-title" id="missionTitle">ちきゅうを ぐるぐる まわそう!</h1>
      <p class="mission-hint" id="missionHint">がめんを よこに ドラッグしてね</p>
      <div class="mission-bar"><i id="missionBar"></i></div>
    </div>

    <div class="hud-right">
      <div class="stars">⭐<b id="starCount">0</b></div>
      <div class="tabs" role="tablist">
        <button class="tab" id="tabMission" role="tab" aria-selected="true">ミッション</button>
        <button class="tab" id="tabFree" role="tab" aria-selected="false">じゆう</button>
      </div>
      <button class="real-btn" id="realBtn">🛰️ ほんもの<span class="long">の ちきゅう</span></button>
    </div>
  </div>

  <canvas id="fx"></canvas>

  <div class="sheet" id="sheet">
    <div class="sheet-card" id="sheetCard"></div>
  </div>
</div>

<div class="dock">
  <div class="porthole">
    <canvas id="ground" width="336" height="336" aria-label="えらんだ まちの そらの ようす"></canvas>
    <div class="porthole-tag" id="groundTag">とうきょう</div>
  </div>

  <div class="center-col">
    <div class="clock-row">
      <div class="clock"><span class="t" id="clockTime">6:00</span><span class="p" id="clockPart">あさ</span></div>
      <div class="badge"><span class="long">ひるの ながさ </span><span class="short">ひる </span><b id="dayLen">12.0</b>じかん</div>
      <button class="badge book" id="bookBtn">📗<span class="long"> ずかん</span> <b id="bookCount">0</b>/<span id="bookAll">77</span></button>
      <div class="badge" id="turnBadge"><span class="long">まわった かず </span><span class="short">🔄 </span><b id="turnCount">0</b><span class="long">かいてん</span><span class="short">かい</span></div>
    </div>
    <div class="chips" id="cityChips"></div>
    <div class="say"><span class="face" id="sayFace">🌏</span><p id="sayText">ちきゅうを まわすと、たいようの ひかりが あたる ばしょが かわるよ。</p></div>
  </div>

  <div class="rail">
    <div class="rail-row">
      <span class="rail-label">まわす</span>
      <button class="key" id="spd0" aria-pressed="true">とめる</button>
      <button class="key" id="spd1" aria-pressed="false">ゆっくり</button>
      <button class="key" id="spd2" aria-pressed="false">はやい</button>
    </div>
    <div class="rail-row">
      <span class="rail-label">きせつ</span>
      <button class="key" data-season="0" aria-pressed="true">はる</button>
      <button class="key" data-season="1" aria-pressed="false">なつ</button>
      <button class="key" data-season="2" aria-pressed="false">あき</button>
      <button class="key" data-season="3" aria-pressed="false">ふゆ</button>
    </div>
    <div class="rail-row">
      <span class="rail-label">ひょうじ</span>
      <button class="key" id="btnRays" aria-pressed="true">ひかり</button>
      <button class="key" id="btnAxis" aria-pressed="false">じく</button>
      <button class="key" id="btnSound" aria-pressed="true">おと</button>
    </div>
    <div class="rail-row">
      <span class="rail-label">ながめ</span>
      <button class="key wide" id="btnNear">🔎 アップ</button>
      <button class="key wide" id="btnWide">🌞 ぜんたい</button>
    </div>
  </div>
</div>

<div class="real" id="real" role="dialog" aria-modal="true" aria-labelledby="realTitle" hidden>
  <div class="real-top">
    <h2 class="real-title" id="realTitle">🛰️ ほんものの ちきゅう</h2>
    <button class="real-close" id="realClose" aria-label="とじる">✕</button>
  </div>
  <div class="tabs real-src" role="tablist">
    <button class="tab" id="srcHima" role="tab" aria-selected="true">🇯🇵 ひまわり<span class="long">（いま）</span></button>
    <button class="tab" id="srcEpic" role="tab" aria-selected="false">🌍 NASA<span class="long">（まんまる）</span></button>
  </div>
  <div class="real-view">
    <div class="real-disk">
      <img id="realImg" alt="えいせいが うちゅうから とった ちきゅうの しゃしん">
      <div class="real-hires" id="realHi"></div>
      <div class="real-pin" id="realPin"><i></i><span>にほん</span></div>
      <div class="real-msg" id="realMsg">よみこみちゅう…</div>
    </div>
  </div>
  <p class="real-when" id="realWhen"></p>
  <div class="real-play">
    <button class="key" id="realPlay" aria-pressed="false">▶ うごかす</button>
    <input type="range" id="realSeek" min="0" max="0" value="0" aria-label="しゃしんの じかん">
  </div>
  <p class="real-note" id="realNote"></p>
  <p class="real-credit" id="realCredit"></p>
</div>

<script src="data.js?v=a9a2412"></script>
<script src="countries.js?v=a9a2412"></script>
<script src="world.js?v=a9a2412"></script>
<script src="sky.js?v=a9a2412"></script>
<script src="missions.js?v=a9a2412"></script>
<script src="real.js?v=a9a2412"></script>
</body>
</html>
