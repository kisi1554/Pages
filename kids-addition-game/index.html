<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たしざんとっくん！5たす3 6たす3</title>
<style>
  :root{
    --pink:#ff6f91;
    --orange:#ff9a3d;
    --yellow:#ffd23f;
    --green:#3ddc97;
    --blue:#3ec7ff;
    --purple:#9d6fff;
    --bg1:#fff3d6;
    --bg2:#ffe0ef;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Rounded Mplus 1c","Comic Sans MS",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    position:relative;
    z-index:1;
  }
  .screen{
    display:none;
    width:100%;
    max-width:640px;
    text-align:center;
  }
  .screen.active{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  h1{
    font-size:clamp(1.6rem,6vw,2.6rem);
    color:#7a3b00;
    margin:0 0 4px 0;
    text-shadow:2px 2px 0 #fff;
  }
  .subtitle{
    font-size:clamp(1rem,3.5vw,1.3rem);
    color:#a75d1f;
    margin:0;
    font-weight:bold;
  }
  .mascot{
    font-size:clamp(4rem,18vw,7rem);
    animation:bob 2s ease-in-out infinite;
    line-height:1;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-14px) rotate(3deg);}
  }
  .big-button{
    font-size:clamp(1.3rem,5vw,1.8rem);
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,var(--pink),var(--orange));
    border:none;
    border-radius:50px;
    padding:18px 48px;
    box-shadow:0 6px 0 #c94f6d, 0 10px 18px rgba(0,0,0,.2);
    cursor:pointer;
    transition:transform .08s;
  }
  .big-button:active{
    transform:translateY(6px);
    box-shadow:0 0 0 #c94f6d, 0 4px 8px rgba(0,0,0,.2);
  }
  /* ---- game screen ---- */
  #screen-game{
    background:rgba(255,255,255,.75);
    border-radius:28px;
    padding:18px 16px 26px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    width:100%;
    position:relative;
    overflow:hidden;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    margin-bottom:6px;
    gap:8px;
  }
  #stars-display{
    font-size:1.2rem;
    font-weight:bold;
    color:#c98600;
    background:#fff6dd;
    border-radius:20px;
    padding:6px 14px;
    box-shadow:0 3px 0 #e8c56a;
    white-space:nowrap;
  }
  #mascot-mini{
    font-size:2.1rem;
    line-height:1;
  }
  #mascot-mini.react-happy{
    animation:mascotHappy .7s ease;
  }
  #mascot-mini.react-oops{
    animation:mascotOops .5s ease;
  }
  @keyframes mascotHappy{
    0%{transform:scale(1) rotate(0);}
    30%{transform:scale(1.5) rotate(-15deg) translateY(-10px);}
    60%{transform:scale(1.3) rotate(15deg) translateY(-14px);}
    100%{transform:scale(1) rotate(0);}
  }
  @keyframes mascotOops{
    0%,100%{transform:translateX(0) rotate(0);}
    25%{transform:translateX(-8px) rotate(-8deg);}
    75%{transform:translateX(8px) rotate(8deg);}
  }
  #progress-dots{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#e0d6ff;
    border:2px solid #c6b8f5;
  }
  .dot.done{
    background:var(--purple);
    border-color:#6f3fd9;
  }
  .dot.current{
    background:var(--yellow);
    border-color:#c99500;
    transform:scale(1.3);
  }
  .streak-badge{
    font-size:1rem;
    font-weight:bold;
    color:#e0521f;
    min-height:1.4em;
    margin-top:2px;
  }
  .problem-area{
    margin:10px 0 16px;
  }
  .groups{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    min-height:110px;
  }
  .group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    max-width:220px;
  }
  .fruit{
    font-size:2.1rem;
    display:inline-block;
    transform:scale(0);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .fruit.counted{
    animation:pulseCount .5s ease;
  }
  @keyframes pop{
    to{transform:scale(1);}
  }
  @keyframes pulseCount{
    0%{transform:scale(1);}
    40%{transform:scale(1.5) rotate(-8deg);}
    100%{transform:scale(1);}
  }
  .plus{
    font-size:2.4rem;
    font-weight:bold;
    color:var(--purple);
  }
  .equation{
    font-size:clamp(1.8rem,7vw,2.6rem);
    font-weight:bold;
    color:#7a3b00;
    margin:12px 0 4px;
  }
  .help-button{
    font-size:1rem;
    font-weight:bold;
    color:#5b3b8c;
    background:#efe6ff;
    border:2px solid #cbb3f5;
    border-radius:30px;
    padding:8px 18px;
    cursor:pointer;
  }
  .help-button:active{
    transform:translateY(2px);
  }
  .answers{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    max-width:420px;
    margin:0 auto;
  }
  .answer-btn{
    font-size:clamp(1.6rem,6vw,2.2rem);
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,var(--blue),#2a9fe0);
    border:none;
    border-radius:20px;
    padding:18px 0;
    box-shadow:0 6px 0 #1c6f9c;
    cursor:pointer;
    transition:transform .08s, background .2s;
  }
  .answer-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #1c6f9c;
  }
  .answer-btn.correct{
    background:linear-gradient(135deg,var(--green),#1fae7a);
    box-shadow:0 6px 0 #158058;
    animation:correctPop .5s ease;
  }
  @keyframes correctPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  .answer-btn.wrong{
    background:linear-gradient(135deg,#ff6f6f,#e04343);
    box-shadow:0 6px 0 #a82c2c;
    animation:shake .4s;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-10px);}
    40%{transform:translateX(10px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  .feedback{
    min-height:44px;
    font-size:clamp(1.2rem,5vw,1.6rem);
    font-weight:bold;
    margin-top:10px;
    color:#2a9d5c;
  }
  .feedback.wrongtext{
    color:#d9534f;
  }
  #final-score{
    font-size:1.4rem;
    font-weight:bold;
    color:#7a3b00;
  }
  #confetti-container{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:999;
  }
  .confetti{
    position:absolute;
    top:-20px;
    width:10px;
    height:16px;
    opacity:.9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg); opacity:.2;}
  }
  .firework{
    position:fixed;
    left:50%;
    top:40%;
    font-size:2rem;
    pointer-events:none;
    animation:fireworkFly var(--dur,1s) ease-out forwards;
  }
  @keyframes fireworkFly{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(0); opacity:1;}
    60%{opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.5) rotate(180deg); opacity:0;}
  }
  #flash-overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:998;
    opacity:0;
    background:conic-gradient(from 0deg, #ff6f91, #ff9a3d, #ffd23f, #3ddc97, #3ec7ff, #9d6fff, #ff6f91);
    mix-blend-mode:screen;
    transition:opacity .15s ease-out;
  }
  #flash-overlay.on{
    opacity:.35;
    animation:flashSpin .6s linear;
  }
  @keyframes flashSpin{
    from{filter:hue-rotate(0deg);}
    to{filter:hue-rotate(180deg);}
  }
  .shake-screen{
    animation:screenShake .4s;
  }
  @keyframes screenShake{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-4px,2px);}
    40%{transform:translate(4px,-2px);}
    60%{transform:translate(-3px,1px);}
    80%{transform:translate(3px,-1px);}
  }
  .top-toggles{
    position:fixed;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    z-index:1000;
  }
  .toggle-btn{
    background:#fff;
    border:2px solid #ddd;
    border-radius:50%;
    width:44px;
    height:44px;
    font-size:1.3rem;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="top-toggles">
  <button id="sound-toggle" class="toggle-btn" title="こえ・こうかおん ON/OFF">🔊</button>
  <button id="bgm-toggle" class="toggle-btn" title="おんがく ON/OFF">🎵</button>
</div>
<div id="app">

  <!-- スタート画面 -->
  <div id="screen-start" class="screen active">
    <h1>🍎 たしざん とっくん 🍊</h1>
    <p class="subtitle">５ たす ３ と ６ たす ３ を れんしゅうしよう！</p>
    <div class="mascot">🐻</div>
    <button id="btn-start" class="big-button">▶ はじめる</button>
  </div>

  <!-- ゲーム画面 -->
  <div id="screen-game" class="screen">
    <div class="topbar">
      <div id="stars-display">⭐ x 0</div>
      <div id="mascot-mini">🐻</div>
      <div id="progress-dots"></div>
    </div>
    <div id="streak-badge" class="streak-badge"></div>

    <div class="problem-area">
      <div class="groups">
        <div id="group-a" class="group"></div>
        <div class="plus">＋</div>
        <div id="group-b" class="group"></div>
      </div>
      <div class="equation" id="equation-text">５ ＋ ３ ＝ ？</div>
      <button id="btn-count-help" class="help-button">👉 いっしょに かぞえよう</button>
    </div>

    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback"></div>
  </div>

  <!-- 終了画面 -->
  <div id="screen-end" class="screen">
    <h1>🎉 だいせいこう！ 🎉</h1>
    <div class="mascot">🐻🎉</div>
    <p id="final-score"></p>
    <button id="btn-restart" class="big-button">🔄 もういちど</button>
  </div>

</div>
<div id="flash-overlay"></div>
<div id="confetti-container"></div>

<script>
(function(){
  "use strict";

  // ---------- 設定 ----------
  var FACTS = [
    {a:5, b:3, answer:8},
    {a:6, b:3, answer:9}
  ];
  var ROUNDS_PER_FACT = 5;   // 各もんだいを5回ずつ = ぜんぶで10もん
  var TOTAL_ROUNDS = FACTS.length * ROUNDS_PER_FACT;

  var KANJI_NUM = ["０","１","２","３","４","５","６","７","８","９","１０","１１","１２"];

  // アイコンをたくさん用意して、毎回ちがう組み合わせで出題する
  var ICONS = [
    "🍎","🍊","🍇","🍋","🍓","🍑","🍒","🍉","🍍","🥝","🍌","🍐",
    "🐶","🐱","🐻","🐰","🦁","🐸","🐵","🐧","🐥","🦊","🐼","🐨",
    "🚗","🚀","🚂","⚽","🏀","🎈","⭐","🌟","🍭","🧸","🐳","🦄"
  ];

  // ---------- 状態 ----------
  var rounds = [];
  var currentIndex = 0;
  var stars = 0;
  var streak = 0;
  var soundOn = true;
  var bgmOn = true;
  var busy = false; // 回答中の二重クリック防止
  var currentIcons = {a:"🍎", b:"🍊"};

  // ---------- 要素 ----------
  var screenStart = document.getElementById("screen-start");
  var screenGame = document.getElementById("screen-game");
  var screenEnd = document.getElementById("screen-end");
  var btnStart = document.getElementById("btn-start");
  var btnRestart = document.getElementById("btn-restart");
  var btnCountHelp = document.getElementById("btn-count-help");
  var starsDisplay = document.getElementById("stars-display");
  var progressDots = document.getElementById("progress-dots");
  var streakBadge = document.getElementById("streak-badge");
  var mascotMini = document.getElementById("mascot-mini");
  var groupA = document.getElementById("group-a");
  var groupB = document.getElementById("group-b");
  var equationText = document.getElementById("equation-text");
  var answersEl = document.getElementById("answers");
  var feedbackEl = document.getElementById("feedback");
  var finalScoreEl = document.getElementById("final-score");
  var confettiContainer = document.getElementById("confetti-container");
  var flashOverlay = document.getElementById("flash-overlay");
  var soundToggle = document.getElementById("sound-toggle");
  var bgmToggle = document.getElementById("bgm-toggle");

  // ---------- 音まわり (Web Audio, 追加ファイル不要) ----------
  var audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume();
    }
    return audioCtx;
  }
  function tone(startTime, freq, dur, vol, type){
    var ctx = getCtx();
    if(!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(vol, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
  }
  function beep(freq, dur, delay, type){
    if(!soundOn) return;
    var ctx = getCtx();
    if(!ctx) return;
    tone(ctx.currentTime + (delay || 0), freq, dur, 0.28, type);
  }
  function playCorrectSound(){
    beep(523.25, 0.16, 0, "triangle");
    beep(659.25, 0.16, 0.12, "triangle");
    beep(783.99, 0.22, 0.24, "triangle");
    beep(1046.5, 0.22, 0.34, "triangle");
  }
  function playWrongSound(){
    beep(220, 0.28, 0, "sawtooth");
  }
  function playPopSound(i){
    beep(440 + i * 60, 0.12, 0, "square");
  }
  function playFanfare(){
    var seq = [523.25,523.25,523.25,659.25,783.99,1046.5,1318.5];
    seq.forEach(function(f, i){ beep(f, 0.24, i*0.14, "triangle"); });
  }

  // ---------- BGM (かんたんなループ演奏を自動生成) ----------
  var bgmTimeoutId = null;
  var MELODY = [
    659.25,783.99,987.77,783.99, 659.25,523.25,659.25,783.99,
    880.00,783.99,659.25,523.25, 587.33,659.25,783.99,659.25
  ];
  var BASS = [130.81,130.81,164.81,164.81, 196.00,196.00,164.81,164.81];
  var NOTE_DUR = 0.24;

  function scheduleBgmLoop(){
    if(!bgmOn) return;
    var ctx = getCtx();
    if(!ctx) return;
    var startTime = ctx.currentTime + 0.05;
    MELODY.forEach(function(freq, i){
      tone(startTime + i * NOTE_DUR, freq, NOTE_DUR * 0.9, 0.05, "square");
    });
    var bassNoteDur = NOTE_DUR * 2;
    BASS.forEach(function(freq, i){
      tone(startTime + i * bassNoteDur, freq, bassNoteDur * 0.85, 0.06, "triangle");
    });
    var loopDuration = MELODY.length * NOTE_DUR;
    bgmTimeoutId = setTimeout(scheduleBgmLoop, loopDuration * 1000);
  }
  function startBgm(){
    stopBgm();
    if(bgmOn) scheduleBgmLoop();
  }
  function stopBgm(){
    if(bgmTimeoutId){
      clearTimeout(bgmTimeoutId);
      bgmTimeoutId = null;
    }
  }

  // ---------- 音声読み上げ (できるだけ自然な日本語ボイスを選ぶ) ----------
  var japaneseVoices = [];
  function loadVoices(){
    if(!("speechSynthesis" in window)) return;
    var all = window.speechSynthesis.getVoices() || [];
    japaneseVoices = all.filter(function(v){ return /^ja/i.test(v.lang); });
  }
  if("speechSynthesis" in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickJapaneseVoice(){
    if(!japaneseVoices.length) return null;
    var priorityNames = /Google 日本語|Kyoko|O-Ren|Nanami|Haruka|Sayaka|Otoya/i;
    var preferred = japaneseVoices.find(function(v){ return priorityNames.test(v.name); });
    return preferred || japaneseVoices[0];
  }
  function speak(text){
    if(!soundOn) return;
    if(!("speechSynthesis" in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var voice = pickJapaneseVoice();
      if(voice) u.voice = voice;
      u.lang = "ja-JP";
      u.rate = 0.98;
      u.pitch = 1.02;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    }catch(e){ /* 対応していない環境では無視 */ }
  }

  soundToggle.addEventListener("click", function(){
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? "🔊" : "🔇";
    if(!soundOn && "speechSynthesis" in window){
      window.speechSynthesis.cancel();
    }
  });
  bgmToggle.addEventListener("click", function(){
    bgmOn = !bgmOn;
    bgmToggle.textContent = bgmOn ? "🎵" : "🔕";
    if(bgmOn){
      startBgm();
    }else{
      stopBgm();
    }
  });

  // ---------- 画面切り替え ----------
  function showScreen(el){
    [screenStart, screenGame, screenEnd].forEach(function(s){
      s.classList.remove("active");
    });
    el.classList.add("active");
  }

  // ---------- ゲーム準備 ----------
  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function buildRounds(){
    var list = [];
    FACTS.forEach(function(f){
      for(var i = 0; i < ROUNDS_PER_FACT; i++){
        list.push(f);
      }
    });
    // 同じ問題が3連続にならないようにシャッフル
    var tries = 0;
    do{
      shuffle(list);
      tries++;
    } while(hasTriple(list) && tries < 20);
    return list;
  }
  function hasTriple(list){
    for(var i = 0; i < list.length - 2; i++){
      if(list[i].a === list[i+1].a && list[i+1].a === list[i+2].a) return true;
    }
    return false;
  }

  function pickRoundIcons(){
    var pair = shuffle(ICONS.slice()).slice(0, 2);
    return {a: pair[0], b: pair[1]};
  }

  function buildDots(){
    progressDots.innerHTML = "";
    for(var i = 0; i < TOTAL_ROUNDS; i++){
      var d = document.createElement("div");
      d.className = "dot";
      d.id = "dot-" + i;
      progressDots.appendChild(d);
    }
  }
  function updateDots(){
    for(var i = 0; i < TOTAL_ROUNDS; i++){
      var d = document.getElementById("dot-" + i);
      d.className = "dot" + (i < currentIndex ? " done" : (i === currentIndex ? " current" : ""));
    }
  }

  function updateStars(){
    starsDisplay.textContent = "⭐ x " + stars;
  }
  function updateStreakBadge(){
    streakBadge.textContent = streak >= 3 ? ("🔥 " + streak + " れんぞく せいかい！ 🔥") : "";
  }

  // ---------- 問題描画 ----------
  function renderGroup(el, count, icon){
    el.innerHTML = "";
    for(var i = 0; i < count; i++){
      var span = document.createElement("span");
      span.className = "fruit";
      span.textContent = icon;
      span.style.animationDelay = (i * 0.06) + "s";
      span.dataset.index = i;
      el.appendChild(span);
    }
  }

  function renderAnswers(fact){
    var correct = fact.answer;
    var choices = [correct];
    while(choices.length < 4){
      var offset = [-2,-1,1,2,3][Math.floor(Math.random()*5)];
      var candidate = correct + offset;
      if(candidate > 0 && candidate <= 12 && choices.indexOf(candidate) === -1){
        choices.push(candidate);
      }
    }
    shuffle(choices);

    answersEl.innerHTML = "";
    choices.forEach(function(num){
      var btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = KANJI_NUM[num];
      btn.addEventListener("click", function(){ onAnswer(num, correct, btn); });
      answersEl.appendChild(btn);
    });
  }

  function renderProblem(){
    var fact = rounds[currentIndex];
    busy = false;
    feedbackEl.textContent = "";
    feedbackEl.classList.remove("wrongtext");
    currentIcons = pickRoundIcons();

    renderGroup(groupA, fact.a, currentIcons.a);
    renderGroup(groupB, fact.b, currentIcons.b);
    equationText.textContent = KANJI_NUM[fact.a] + " ＋ " + KANJI_NUM[fact.b] + " ＝ ？";
    renderAnswers(fact);
    updateDots();
    updateStars();
    updateStreakBadge();

    speak(fact.a + " たす " + fact.b + " は、いくつかな？");
  }

  // ---------- いっしょにかぞえよう ----------
  function countTogether(){
    if(busy) return;
    var fact = rounds[currentIndex];
    var fruitsA = groupA.querySelectorAll(".fruit");
    var fruitsB = groupB.querySelectorAll(".fruit");
    var allFruits = [];
    fruitsA.forEach(function(f){ allFruits.push(f); });
    fruitsB.forEach(function(f){ allFruits.push(f); });

    btnCountHelp.disabled = true;
    var i = 0;
    var interval = setInterval(function(){
      if(i >= allFruits.length){
        clearInterval(interval);
        btnCountHelp.disabled = false;
        speak("ぜんぶで " + fact.answer + " こ！");
        feedbackEl.textContent = "ぜんぶで " + KANJI_NUM[fact.answer] + " こ だね！";
        return;
      }
      allFruits[i].classList.remove("counted");
      void allFruits[i].offsetWidth;
      allFruits[i].classList.add("counted");
      playPopSound(i);
      i++;
    }, 420);
  }
  btnCountHelp.addEventListener("click", countTogether);

  // ---------- 演出 ----------
  function flashScreen(){
    flashOverlay.classList.remove("on");
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add("on");
    setTimeout(function(){ flashOverlay.classList.remove("on"); }, 600);
  }
  function shakeScreen(){
    screenGame.classList.remove("shake-screen");
    void screenGame.offsetWidth;
    screenGame.classList.add("shake-screen");
    setTimeout(function(){ screenGame.classList.remove("shake-screen"); }, 400);
  }
  function reactMascot(kind){
    mascotMini.classList.remove("react-happy", "react-oops");
    void mascotMini.offsetWidth;
    mascotMini.classList.add(kind === "happy" ? "react-happy" : "react-oops");
  }

  // ---------- 回答処理 ----------
  function onAnswer(num, correct, btn){
    if(busy) return;
    busy = true;

    if(num === correct){
      btn.classList.add("correct");
      streak++;
      var big = streak >= 3;
      feedbackEl.textContent = big
        ? "🎉 せいかい！ " + streak + "れんぞく すごい！"
        : "🎉 せいかい！ よくできました！";
      feedbackEl.classList.remove("wrongtext");
      stars++;
      updateStars();
      updateStreakBadge();
      playCorrectSound();
      speak(big ? (streak + "れんぞく せいかい！ すごいね！") : "せいかい！ すごいね！");
      launchConfettiBurst();
      launchFireworks(big ? 22 : 14);
      flashScreen();
      reactMascot("happy");

      setTimeout(function(){
        currentIndex++;
        if(currentIndex >= TOTAL_ROUNDS){
          finishGame();
        }else{
          renderProblem();
        }
      }, 1500);
    }else{
      btn.classList.add("wrong");
      streak = 0;
      updateStreakBadge();
      feedbackEl.textContent = "おしい！ もういちど かぞえてみよう";
      feedbackEl.classList.add("wrongtext");
      playWrongSound();
      speak("おしい！ もういちど");
      shakeScreen();
      reactMascot("oops");
      setTimeout(function(){
        btn.classList.remove("wrong");
        busy = false;
      }, 500);
    }
  }

  // ---------- 紙吹雪・花火 ----------
  var confettiColors = ["#ff6f91","#ff9a3d","#ffd23f","#3ddc97","#3ec7ff","#9d6fff"];
  function launchConfettiBurst(){
    for(var i = 0; i < 22; i++){
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (Math.random()*100) + "vw";
      c.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      c.style.animationDuration = (1.2 + Math.random()*1.2) + "s";
      c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      confettiContainer.appendChild(c);
      (function(node){
        setTimeout(function(){ node.remove(); }, 2600);
      })(c);
    }
  }
  var fireworkEmojis = ["🎉","✨","🌟","💥","🎊","⭐","🥳"];
  function launchFireworks(count){
    for(var i = 0; i < count; i++){
      var el = document.createElement("div");
      el.className = "firework";
      el.textContent = fireworkEmojis[Math.floor(Math.random()*fireworkEmojis.length)];
      var angle = Math.random() * 2 * Math.PI;
      var dist = 60 + Math.random() * 180;
      el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      el.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      el.style.setProperty("--dur", (0.7 + Math.random()*0.6) + "s");
      el.style.left = (40 + Math.random()*20) + "%";
      el.style.top = (30 + Math.random()*20) + "%";
      confettiContainer.appendChild(el);
      (function(node){
        setTimeout(function(){ node.remove(); }, 1500);
      })(el);
    }
  }

  // ---------- 終了 ----------
  function finishGame(){
    stopBgm();
    showScreen(screenEnd);
    finalScoreEl.textContent = "⭐ " + stars + " / " + TOTAL_ROUNDS + " こ とれたよ！";
    playFanfare();
    speak("だいせいこう！ よくがんばりました！");
    for(var i = 0; i < 4; i++){
      setTimeout(function(){
        launchConfettiBurst();
        launchFireworks(16);
      }, i * 400);
    }
  }

  // ---------- 開始 / リスタート ----------
  function startGame(){
    rounds = buildRounds();
    currentIndex = 0;
    stars = 0;
    streak = 0;
    buildDots();
    showScreen(screenGame);
    renderProblem();
    startBgm();
  }

  btnStart.addEventListener("click", function(){
    getCtx(); // ユーザー操作内でAudioContextを起動(モバイル対策)
    loadVoices();
    startGame();
  });
  btnRestart.addEventListener("click", startGame);

})();
</script>
</body>
</html>
