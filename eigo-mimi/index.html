<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c7ed6">
<title>えいご みみ たんけん</title>
<link rel="stylesheet" href="style.css?v=04411ff">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div id="app">
  <header class="topbar">
    <button type="button" class="back" id="backBtn" hidden aria-label="もどる">←</button>
    <h1 id="title">🎧 えいご みみ たんけん</h1>
    <button type="button" class="icon" id="soundBtn" aria-label="おと オン/オフ">🔊</button>
    <button type="button" class="icon" id="setBtn" aria-label="せってい">⚙️</button>
  </header>

  <div class="settings" id="settings" hidden>
    <label>こえの おおきさ
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.9">
    </label>
    <label class="check"><input type="checkbox" id="sfx" checked> こうかおん（ピンポン・ブブー）</label>
    <label class="check"><input type="checkbox" id="showJa" checked> えの したに にほんごを だす</label>
  </div>

  <main id="main"></main>
</div>

<template id="tplHome">
  <section class="home">
    <p class="lead">ほんものの えいごの こえを きいて、<br>にている おとを ききわけよう！</p>
    <div class="modes">
      <button type="button" class="mode" data-go="kikiwake" style="--c:#1c7ed6"><span class="em">👂</span><b>ききわけ</b><small>right と light、どっち？</small></button>
      <button type="button" class="mode" data-go="zukan" style="--c:#2f9e44"><span class="em">📗</span><b>おと ずかん</b><small>44の おとと くちの かたち</small></button>
      <button type="button" class="mode" data-go="phonics" style="--c:#e8590c"><span class="em">🔤</span><b>フォニックス よみ</b><small>きいて つづる・おとを かぞえる</small></button>
      <button type="button" class="mode" data-go="cards" style="--c:#ae3ec9"><span class="em">🃏</span><b>えいたんご カード</b><small>きいて えを えらぶ</small></button>
    </div>
    <div class="today" id="todayBox"></div>
    <div class="subnav">
      <button type="button" class="ghost" data-go="parent">👪 ほごしゃ がめん</button>
      <button type="button" class="ghost" data-go="credits">🎙️ おとの クレジット</button>
    </div>
  </section>
</template>

<script src="data.js?v=04411ff"></script>
<script src="audio-index.js?v=04411ff"></script>
<script src="app.js?v=04411ff"></script>
</body>
</html>
