<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>せかい いっしゅう りょこう</title>
<meta name="description" content="ひこうきで せかいの くにへ！ あいさつと じさを しって パスポートに スタンプ。">
<meta name="theme-color" content="#1c7ed6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="stylesheet" href="style.css?v=f13568d">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div id="app">

  <!-- ======================= タイトル ======================= -->
  <section id="s-title" class="screen scroll">
    <header class="title-head">
      <div class="toggles">
        <button type="button" class="pill js-sound">🔊 おと</button>
        <button type="button" class="pill js-voice">🗣️ よみあげ</button>
      </div>
      <h1><span>✈️</span>せかい いっしゅう りょこう</h1>
      <p class="lead">ひこうきで <ruby>世界<rt>せかい</rt></ruby>の <ruby>国<rt>くに</rt></ruby>へ。あいさつ・くらし・<ruby>時差<rt>じさ</rt></ruby>を しらべよう</p>
    </header>

    <div id="title-map" class="title-map" aria-label="せかいちず"></div>

    <div class="progress">
      <div class="bar"><i id="got-bar"></i></div>
      <span>スタンプ <b id="got-num">0</b> / <span id="all-num">40</span></span>
    </div>

    <button type="button" id="btn-go" class="btn primary big">🛫 しゅっぱつ！</button>

    <div class="extras">
      <button type="button" class="extra" data-open="passport" style="--accent:#1c7ed6;--tint:#e7f5ff"><span>📕</span>パスポート</button>
      <button type="button" class="extra" data-open="zukan" style="--accent:#d9a227;--tint:#fbf0cf"><span>🎁</span>おみやげ ずかん</button>
      <button type="button" class="extra" data-open="mission" style="--accent:#2f9e5b;--tint:#d9f2e2"><span>🏅</span>ミッション</button>
      <button type="button" class="extra" data-open="clock" style="--accent:#8a55c9;--tint:#ece2f8"><span>🕰️</span>じさ とけい</button>
    </div>
    <p class="foot">ちずの くらい ところは、いま よるの ところ。<br>ちず：Natural Earth（パブリックドメイン）</p>
  </section>

  <!-- ======================= ちず（どこへ いく？） ======================= -->
  <section id="s-map" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2 id="map-title">どこへ いく？</h2>
      <span class="count"></span>
    </header>
    <div class="airports" id="airports"></div>
    <div id="map-tabs" class="tabs"></div>
    <div class="map-area">
      <div id="big-map" class="big-map"></div>
      <div id="fly-info" class="fly-info" hidden></div>
      <button type="button" id="fly-skip" class="pill skip" hidden>とばす ⏩</button>
    </div>
    <div id="dest" class="dest">
      <p class="hint">ちずで いきたい <ruby>国<rt>くに</rt></ruby>を タップしてね</p>
    </div>
  </section>

  <!-- ======================= まち ======================= -->
  <section id="s-scene" class="screen">
    <header class="bar-head">
      <button type="button" class="back" data-go="title" aria-label="もどる">◀</button>
      <h2 id="scene-title"></h2>
      <span id="scene-count" class="count"></span>
    </header>
    <div class="scene-wrap">
      <div class="scene-left">
        <div id="scene-host" class="scene-host"></div>
        <div id="scene-chips" class="chips"></div>
      </div>
      <div id="scene-info" class="scene-info"></div>
    </div>
    <footer class="scene-foot">
      <button type="button" class="btn" data-open="clock">🕰️ じさ</button>
      <button type="button" class="btn" data-open="passport">📕 スタンプ</button>
      <button type="button" class="btn primary" id="btn-next">🛫 つぎの <ruby>国<rt>くに</rt></ruby>へ</button>
    </footer>
  </section>

  <!-- ======================= じさ とけい ======================= -->
  <section id="s-clock" class="screen">
    <header class="bar-head">
      <button type="button" class="back js-back" aria-label="もどる">◀</button>
      <h2>🕰️ じさ とけい</h2>
      <span class="count"></span>
    </header>
    <div class="scroll-inner clock-body">
      <div id="clock-chips" class="clock-chips"></div>
      <div id="clocks" class="clocks"></div>
      <p id="clock-diff" class="clock-diff"></p>
      <div id="clock-map" class="clock-map"></div>
      <p class="clock-note">くらい ところは いま よる。ちきゅうが まわると、よるの かげが にしへ うごくよ</p>
      <div id="clock-quiz" class="clock-quiz"></div>
    </div>
  </section>

  <!-- ======================= パスポート ======================= -->
  <section id="s-passport" class="screen">
    <header class="bar-head">
      <button type="button" class="back js-back" aria-label="もどる">◀</button>
      <h2>📕 パスポート</h2>
      <span id="pass-num" class="count"></span>
    </header>
    <div id="pass-list" class="pass scroll-inner"></div>
  </section>

  <!-- ======================= おみやげ ずかん ======================= -->
  <section id="s-zukan" class="screen">
    <header class="bar-head">
      <button type="button" class="back js-back" aria-label="もどる">◀</button>
      <h2>🎁 おみやげ ずかん</h2>
      <span id="zukan-num" class="count"></span>
    </header>
    <p class="sub-hint">まちで 5つ ぜんぶ みつけると、おみやげが もらえるよ</p>
    <div id="zukan-list" class="zukan scroll-inner"></div>
  </section>

  <!-- ======================= ミッション ======================= -->
  <section id="s-mission" class="screen">
    <header class="bar-head">
      <button type="button" class="back js-back" aria-label="もどる">◀</button>
      <h2>🏅 ミッション</h2>
      <span id="mis-num" class="count"></span>
    </header>
    <div id="mis-list" class="missions scroll-inner"></div>
  </section>

  <!-- ======================= ポップアップ ======================= -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button type="button" class="modal-close" aria-label="とじる">✕</button>
      <div class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script src="geo.js?v=f13568d"></script>
<script src="flags.js?v=f13568d"></script>
<script src="countries.js?v=f13568d"></script>
<script src="clock.js?v=f13568d"></script>
<script src="map.js?v=f13568d"></script>
<script src="art.js?v=f13568d"></script>
<script src="audio.js?v=f13568d"></script>
<script src="game.js?v=f13568d"></script>
</body>
</html>
