<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>てんびん パズル</title>
<meta name="description" content="てんびんで くらべて わからない おもさを あてよう。かたむきから おもさを すいりする、とうしきの はじめの パズル。">
<meta name="theme-color" content="#8a6d1f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="top">
  <button class="pill back" id="backBtn" hidden aria-label="もどる">‹ <span class="long">もどる</span></button>
  <h1 class="title"><span aria-hidden="true">⚖️</span><span id="titleText">てんびん パズル</span></h1>
  <span class="stars-total" aria-label="あつめた ほし">⭐ <b id="starCount">0</b></span>
  <button class="pill round" id="soundBtn" aria-pressed="true" aria-label="おと オン／オフ">🔊</button>
</header>

<!-- ホーム -->
<main class="view scroll" id="home">
  <div class="wrap">
    <p class="lead">てんびんの <b>かたむき</b> を よく みて、わからない <b>おもさ</b> を あてよう！</p>
    <div class="modes" id="modeList"></div>
    <section class="howto">
      <h2>あそびかた</h2>
      <ul>
        <li>ものや ぶんどうを <b>タップ</b> すると てんびんに のるよ。おさらの うえを タップ すると おろせる。</li>
        <li>おもい ほうが <b>さがる</b>。さが おおきいほど たくさん かたむくよ。</li>
        <li>ぴったり つりあうと「カチッ」と とまって きらきら！</li>
        <li><ruby>左<rt>ひだり</rt></ruby>と <ruby>右<rt>みぎ</rt></ruby>が おなじ おもさ ＝ <b>つりあい</b>。これが さんすうの「＝（イコール）」だよ。</li>
      </ul>
    </section>
  </div>
</main>

<!-- ステージ いちらん -->
<main class="view scroll" id="stages" hidden>
  <div class="wrap">
    <p class="lead" id="stagesLead"></p>
    <div class="grid" id="stageGrid"></div>
  </div>
</main>

<!-- あそぶ がめん -->
<main class="view scroll" id="play" hidden>
  <div class="play-wrap">
    <div class="question" id="question"></div>
    <div class="board">
      <div class="clues" id="clues" hidden></div>
      <div class="scale-box" id="scaleBox"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- けっか -->
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="m-btns" id="mBtns"></div>
  </div>
</div>

<script src="stages.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
