<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>でんき の ゆくえ</title>
<meta name="description" content="まち の でんき を まかされた はつでん だいじん に なろう。はつでんしょ を くみあわせて、まち を まっくら に しないで！">
<meta name="theme-color" content="#f08c00">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="style.css?v=a512376">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<header class="top">
  <a class="icon-btn" id="homeBtn" href="../" aria-label="あそびメニュー へ">🏠</a>
  <button class="icon-btn" id="backBtn" type="button" aria-label="もどる" hidden>◀</button>
  <h1 id="ttl">⚡ でんき の ゆくえ</h1>
  <button class="icon-btn" id="sndBtn" type="button" aria-label="おと">🔊</button>
</header>

<main>
  <!-- タイトル -->
  <section class="view" id="vTitle">
    <div class="hero">
      <div class="hero-art" aria-hidden="true">🏘️⚡🔋</div>
      <p class="lead">きみ は まち の <b>はつでん だいじん</b>。<br>はつでんしょ を たてて、まち を <b>まっくら に しない</b> ように しよう！</p>
    </div>
    <div class="stage-grid" id="stageGrid"></div>
    <div class="home-btns">
      <button class="big-btn" id="zukanBtn" type="button">📖 はつでん ずかん</button>
      <button class="big-btn" id="speedBtn" type="button">🐢 はやさ: ふつう</button>
    </div>
  </section>

  <!-- じゅんび -->
  <section class="view" id="vPrep" hidden>
    <div class="prep-grid">
      <div class="prep-main">
        <p class="intro" id="prepIntro"></p>
        <div class="map-box" id="prepMap"></div>
      </div>
      <div class="prep-side">
        <div class="fc-box">
          <div class="fc-ttl">きょう の よそう</div>
          <div class="fc-strip" id="fcStrip"></div>
          <div class="fc-note" id="fcNote"></div>
        </div>
        <div class="budget-row">
          <span>よさん</span><b id="budget">💰 0</b>
          <span class="cap-info" id="capInfo"></span>
        </div>
        <div class="palette" id="palette"></div>
        <p class="hint" id="prepHint">はつでんしょ を ちず の ○ に ひっぱって おこう。おいた もの を タップ すると とりけせる。</p>
        <button class="go-btn" id="startBtn" type="button">▶ 1にち スタート</button>
      </div>
    </div>
  </section>

  <!-- プレイ -->
  <section class="view" id="vPlay" hidden>
    <div class="play-grid">
      <div class="play-main">
        <div class="hud">
          <span class="clock" id="clock">0:00</span>
          <span class="wx" id="wx">☀️</span>
          <span class="face" id="face" aria-live="polite">😊</span>
          <span class="face-txt" id="faceTxt">たりてる</span>
        </div>
        <div class="map-box" id="playMap"></div>
        <div class="graph-box">
          <canvas id="graph"></canvas>
          <div class="legend"><span class="lg-use">― つかう でんき</span><span class="lg-make">■ つくる でんき</span></div>
        </div>
      </div>
      <div class="play-side">
        <div class="meters">
          <div class="meter"><span>☁️ けむり</span><div class="mbar"><i id="co2Bar"></i><em id="co2Mark"></em></div><b id="co2Val">0</b></div>
          <div class="meter"><span>🗑️ むだ</span><div class="mbar"><i id="wasteBar"></i><em id="wasteMark"></em></div><b id="wasteVal">0</b></div>
        </div>
        <div class="ctl" id="ctlDam">
          <div class="ctl-head"><span>💧 ダム の ゲート</span><b id="damVal">0%</b></div>
          <div class="slider" id="damSlider" data-k="dam" role="slider" aria-label="ダム の ゲート" aria-valuemin="0" aria-valuemax="100" tabindex="0"><div class="track"><div class="fill"></div><div class="thumb"></div></div></div>
          <div class="sub">みず <span class="gauge"><i id="waterBar"></i></span> <small id="damOut"></small></div>
        </div>
        <div class="ctl" id="ctlFire">
          <div class="ctl-head"><span>🔥 かりょく の ひ</span><b id="fireVal">0%</b></div>
          <div class="slider" id="fireSlider" data-k="fire" role="slider" aria-label="かりょく の ひ" aria-valuemin="0" aria-valuemax="100" tabindex="0"><div class="track"><div class="fill"></div><div class="thumb"></div></div></div>
          <div class="sub"><small id="fireOut"></small></div>
        </div>
        <div class="ctl" id="ctlBatt">
          <div class="ctl-head"><span>🔋 でんち</span><b id="battVal">0%</b></div>
          <div class="bmodes">
            <button class="bmode" type="button" data-m="charge">⬆ ためる</button>
            <button class="bmode" type="button" data-m="discharge">⬇ だす</button>
          </div>
          <div class="sub"><span class="gauge batt"><i id="battBar"></i></span></div>
        </div>
        <div class="play-btns">
          <button class="card-btn" id="cardBtn" type="button">💡 せつでん カード <b id="cardN">×1</b></button>
          <button class="pause-btn" id="pauseBtn" type="button" aria-label="とめる">⏸</button>
        </div>
        <p class="nature" id="natureTxt"></p>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="blackout" id="blackout" hidden><div>🌑<br>ぷつん…<br>まっくら に なっちゃった</div></div>
    <div class="pause-cover" id="pauseCover" hidden><button class="go-btn" id="resumeBtn" type="button">▶ つづける</button></div>
  </section>

  <!-- けっか -->
  <section class="view" id="vResult" hidden>
    <div class="res-card">
      <h2 id="resTitle"></h2>
      <div class="res-stars" id="resStars"></div>
      <ul class="res-list" id="resList"></ul>
      <div class="res-graph"><canvas id="resGraph"></canvas></div>
      <p class="tip" id="resTip"></p>
      <div class="res-btns">
        <button class="big-btn" id="retryBtn" type="button">🔁 もういちど</button>
        <button class="big-btn" id="rebuildBtn" type="button">🏗️ たてなおす</button>
        <button class="big-btn go" id="nextBtn" type="button">つぎ の ステージ ▶</button>
        <button class="big-btn" id="menuBtn" type="button">📋 ステージ いちらん</button>
      </div>
    </div>
  </section>

  <!-- ずかん -->
  <section class="view" id="vZukan" hidden>
    <div class="zukan" id="zukanList"></div>
  </section>
</main>

<script src="grid.js?v=a512376"></script>
<script src="stages.js?v=a512376"></script>
<script src="sound.js?v=a512376"></script>
<script src="app.js?v=a512376"></script>
</body>
</html>
