<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>併願プランをつくる — 引っ越しました</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=../tsugaku-route/#plan">
<link rel="canonical" href="../tsugaku-route/#plan">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<style>
  :root {
    --paper:#F5F6F2; --surface:#FFFFFF; --ink:#15191A; --ink-soft:#434B49;
    --ink-mute:#646C69; --rule:#D7DBD3; --accent:#8E1226;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#121514; --surface:#1A1E1D; --ink:#E7EAE5; --ink-soft:#BFC6C2;
      --ink-mute:#98A09C; --rule:#2E3432; --accent:#EE9AA4;
    }
  }
  :root[data-theme="dark"] {
    --paper:#121514; --surface:#1A1E1D; --ink:#E7EAE5; --ink-soft:#BFC6C2;
    --ink-mute:#98A09C; --rule:#2E3432; --accent:#EE9AA4;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", YuGothic, "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.9; display: grid; place-items: center; min-height: 100vh;
    padding: 1.5rem;
  }
  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-top: 3px solid var(--accent); border-radius: 14px;
    padding: 2rem 1.8rem; max-width: 30rem; text-align: center;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .8rem; line-height: 1.5; }
  p { color: var(--ink-soft); font-size: .92rem; margin: 0 0 1.2rem; }
  a.go {
    display: inline-block; text-decoration: none; font-weight: 600;
    background: var(--accent); color: var(--paper);
    border-radius: 999px; padding: .6rem 1.6rem;
  }
  .small { font-size: .8rem; color: var(--ink-mute); margin: 1.2rem 0 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>併願プランは「志望校くらべと併願プラン」に<br>まとまりました</h1>
    <p>通学ルートの比較と同じ1ページになり、★を付けた学校がそのまま日程表に反映されます。
    自動で移動します。切り替わらないときは下を押してください。</p>
    <a class="go" href="../tsugaku-route/#plan">併願プランを開く</a>
    <p class="small">ここで組んだ日程はそのまま残っています（同じブラウザに保存されているため）。</p>
  </div>
</body>
</html>
