<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>カブトムシ そだて ｜ たまごから せいちゅうまで</title>
<meta name="description" content="ほんとうの 日にちで カブトムシを たまごから せいちゅうまで そだてる アプリ。まいにち おせわして、ずかんに とうろくしよう。">
<meta name="theme-color" content="#7a4a1e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪲</text></svg>">
<link rel="stylesheet" href="style.css?v=c3db83c">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { e.preventDefault(); }
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="topbar">
  <h1><span aria-hidden="true">🪲</span> カブトムシ そだて</h1>
  <span id="fastBadge" class="fast-badge" hidden>⏩ はやおくり中</span>
  <button id="soundBtn" class="icon-btn" type="button" aria-label="おと オン・オフ">🔊</button>
  <button id="zukanBtn" class="icon-btn zukan-btn" type="button">📔 ずかん<b id="zukanCount" class="count" hidden></b></button>
</header>

<main class="layout">
  <section class="scene">
    <canvas id="scene" aria-label="しいくケースの なか"></canvas>
    <p id="bubble" class="bubble" hidden></p>
    <p class="tap-hint">👆 カブトムシを タップすると アップで みられるよ</p>
  </section>

  <section class="panel">
    <ol id="stepper" class="stepper" aria-label="そだちかた"></ol>

    <div class="status">
      <p id="stageName" class="stage-name"></p>
      <p id="dayText" class="day-text"></p>
      <p id="nextText" class="next-text"></p>
    </div>

    <div class="care" role="group" aria-label="おせわ">
      <button class="care-btn" id="btnMat" type="button" data-care="mat"><span class="em">🟫</span><span>マット<br>こうかん</span></button>
      <button class="care-btn" id="btnMist" type="button" data-care="mist"><span class="em">💧</span><span>きりふき</span></button>
      <button class="care-btn" id="btnJelly" type="button" data-care="jelly"><span class="em">🍯</span><span>ゼリー</span></button>
    </div>

    <p id="careNote" class="care-note" hidden></p>

    <div class="meters">
      <div class="meter" id="mMoist"><span class="lbl">💧 しめりけ</span><span class="bar"><i></i></span></div>
      <div class="meter" id="mPoop"><span class="lbl">🟤 ふん</span><span class="bar"><i></i></span></div>
      <div class="meter" id="mFood"><span class="lbl">🍯 おなか</span><span class="bar"><i></i></span></div>
    </div>

    <div id="adultBox" class="adult-box" hidden>
      <p id="adultInfo" class="adult-info"></p>
      <button id="nameBtn" class="btn btn-main" type="button">なまえを つけて ずかんに とうろく</button>
      <button id="newEggBtn" class="btn btn-sub" type="button">🥚 つぎの たまごを はじめる</button>
    </div>

    <article class="fact">
      <p class="fact-tag">まめちしき</p>
      <h2 id="factTitle"></h2>
      <p id="factBody"></p>
      <button id="factNext" class="btn btn-small" type="button">つぎの まめちしき ▶</button>
    </article>

    <p class="parents">おうちの方へ: ほんとうの 日にちで そだちます（1日に1回 おせわすると、つぎの日に すこし そだちます）。おせわを わすれても しにません。記録は この端末の ブラウザに 保存されます。</p>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<script src="data.js?v=c3db83c"></script>
<script src="art.js?v=c3db83c"></script>
<script src="app.js?v=c3db83c"></script>
</body>
</html>
