<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f7d32">
<title>むしずかん</title>
<link rel="stylesheet" href="style.css?v=c3db83c">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { e.preventDefault(); }
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<header class="bar">
  <button id="back" class="icon-btn" aria-label="もどる" hidden>◀</button>
  <a href="#/" class="title"><span aria-hidden="true">🔍</span> むしずかん</a>
  <button id="sound" class="icon-btn" aria-label="おと オン・オフ">🔊</button>
</header>
<main id="app" aria-live="polite"></main>

</body>
</html>
