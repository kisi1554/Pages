<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>あかちゃん だあれ？ ｜ いきものの そだちかた</title>
<meta name="description" content="あかちゃんの えを みて、おとなに なったら だれか あてよう。そだつ じゅんばんを ならべて、いきものの へんしんを しる アプリ。">
<meta name="theme-color" content="#4c9a52">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<style>
:root{
  --bg:#f3f9ec; --ink:#2f3a2a; --sub:#6b7a62; --card:#fff; --line:#d9e8cc;
  --green:#4c9a52; --green-d:#357a3b; --orange:#f08c2e; --pink:#f06595; --blue:#3b8fd8;
  --ok:#2fb35a; --ng:#e8590c; --shadow:0 4px 0 rgba(60,90,40,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg) radial-gradient(circle at 15% 10%,#fffbe6 0,transparent 40%) fixed;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Meiryo",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.app{max-width:1100px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{flex:1;margin:0;font-size:clamp(18px,4.6vw,26px);letter-spacing:.04em;color:var(--green-d)}
.ibtn{min-width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:24px;
  display:flex;align-items:center;justify-content:center;padding:0 10px;font-weight:700}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,90,40,.18)}
.ibtn small{font-size:14px;margin-left:4px}
main{flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;gap:12px;animation:fadein .3s}
.screen.on{display:flex}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* メニュー */
.hero{text-align:center;padding:6px 0 0}
.hero .pics{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.hero .pics svg{width:clamp(54px,15vw,90px);height:auto}
.hero .arrow{font-size:22px;color:var(--sub)}
.hero p{margin:10px 0 0;font-size:clamp(16px,4vw,20px);line-height:1.7}
.menu-btns{display:grid;gap:12px;grid-template-columns:1fr;margin-top:8px}
@media (min-width:700px){.menu-btns{grid-template-columns:repeat(3,1fr)}}
.big{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 18px;
  box-shadow:var(--shadow);border:3px solid var(--c,#4c9a52);text-align:left;min-height:84px}
.big:active{transform:translateY(3px)}
.big .em{font-size:40px}
.big b{display:block;font-size:22px;color:var(--c)}
.big span{font-size:15px;color:var(--sub);line-height:1.5}
.note{font-size:14px;color:var(--sub);text-align:center;margin:4px 0 0}

/* すすみぐあい */
.prog{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--sub);min-height:28px}
.prog i{width:16px;height:16px;border-radius:50%;background:#dfe9d4;display:inline-block}
.prog i.done{background:var(--ok)}
.prog i.now{background:var(--orange);transform:scale(1.25)}
.bar{height:12px;border-radius:8px;background:#dfe9d4;overflow:hidden}
.bar>div{height:100%;background:var(--ok);width:0;transition:width .4s}
.ask{text-align:center;font-size:clamp(20px,5vw,28px);font-weight:700;margin:2px 0;line-height:1.5}
.ask small{display:block;font-size:15px;font-weight:400;color:var(--sub)}

/* だれの あかちゃん */
.quiz{display:flex;flex-direction:column;gap:14px;align-items:center;flex:1}
.baby{background:var(--card);border-radius:26px;padding:10px;box-shadow:var(--shadow);text-align:center;
  width:min(62vw,300px)}
.baby svg{width:100%;height:auto}
.baby .lb{font-size:22px;font-weight:700;margin:6px 0 2px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.choice{background:var(--card);border-radius:20px;padding:8px 6px 10px;box-shadow:var(--shadow);border:3px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(15px,4vw,19px);font-weight:700}
.choice svg{width:100%;height:auto;max-width:150px}
.choice:active{transform:translateY(3px)}
.choice.ng{opacity:.4;border-color:#ddd}
.choice.ok{border-color:var(--ok);background:#eafbe9}
@media (orientation:landscape) and (min-width:700px){
  .quiz{flex-direction:row;justify-content:center;align-items:center;gap:28px}
  .baby{width:min(38vw,320px)}
  .choices{grid-template-columns:1fr 1fr 1fr;max-width:520px}
}

/* ならべる */
.slots{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;flex-wrap:nowrap}
.slot{flex:1 1 0;max-width:200px;aspect-ratio:3/4;border-radius:18px;border:3px dashed #b9cfa8;background:#fbfdf8;
  position:relative;display:flex;align-items:center;justify-content:center}
.slot .no{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;
  width:26px;height:26px;border-radius:50%;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.slot.lock{border:3px solid var(--ok);background:#eafbe9}
.sarrow{flex:0 0 auto;color:#9bb487;font-size:18px;font-weight:700}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:120px;width:100%}
.st{width:clamp(80px,22vw,170px);background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:5px 5px 7px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(12px,3.3vw,16px);font-weight:700;line-height:1.25;text-align:center}
.st svg{width:100%;height:auto}
.slot .st{width:100%;height:100%;box-shadow:none;background:transparent;justify-content:center}
.st:active{transform:scale(.96)}
.hint{text-align:center;color:var(--sub);font-size:15px;min-height:22px;margin:0}

/* そだつ アニメ */
.grow{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1}
.gview{width:min(70vw,340px);background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:10px;text-align:center;position:relative}
.gview svg{width:100%;height:auto}
.gview .lb{font-size:24px;font-weight:700;margin:4px 0 2px;min-height:34px}
.pop{animation:popin .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{0%{transform:scale(.4);opacity:0;filter:brightness(1.8)}100%{transform:none;opacity:1;filter:none}}
.thumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.thumbs .t{width:clamp(50px,13vw,96px);border-radius:12px;background:var(--card);padding:3px;opacity:.35;transition:all .3s;border:2px solid transparent}
.thumbs .t.on{opacity:1;border-color:var(--orange);transform:scale(1.08)}
.thumbs .t.seen{opacity:1}
.badge{display:inline-block;background:#fff0f6;color:#c2255c;border:2px solid #f783ac;border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px}
.badge.b2{background:#e7f5ff;color:#1864ab;border-color:#74c0fc}
.fact{background:#fffbe6;border:2px solid #f5d76e;border-radius:18px;padding:12px 16px;font-size:clamp(16px,4.2vw,19px);line-height:1.8;max-width:640px;width:100%}
.fact b{color:var(--green-d)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.btn{min-height:60px;min-width:150px;padding:0 22px;border-radius:20px;font-size:21px;font-weight:700;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.sub{background:#fff;color:var(--green-d);box-shadow:0 5px 0 #c8dbb8;border:2px solid #c8dbb8}
.btn.or{background:var(--orange);box-shadow:0 5px 0 #c26d1c}
.hide{visibility:hidden}
@media (orientation:landscape) and (min-width:700px){
  .grow{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"v t" "v b" "v f" "v r";align-items:center;column-gap:24px;row-gap:10px;justify-items:center}
  .gview{grid-area:v;width:min(36vw,340px)}
  .thumbs{grid-area:t}.grow .bwrap{grid-area:b}.fact{grid-area:f}.grow .row{grid-area:r}
}

/* なかまわけ */
.sortq{display:flex;flex-direction:column;align-items:center;gap:12px;flex:1}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:620px}
.bin{min-height:120px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);border:4px solid var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(17px,4.4vw,22px);font-weight:700;color:var(--c);padding:8px}
.bin .em{font-size:44px}
.bin:active{transform:translateY(3px)}
.bin.ng{opacity:.4}
.bin.ok{background:#eafbe9}
@media (orientation:landscape) and (min-width:700px){
  .sortq{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"a q" "a b" "a f" "a r";column-gap:28px;align-items:center;justify-items:center}
  .sortq .baby{grid-area:a;width:min(34vw,300px)} .sortq .ask{grid-area:q}.bins{grid-area:b}.sortq .fact{grid-area:f}.sortq .row{grid-area:r}
}

/* ずかん */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.zc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:16px;gap:2px}
.zc svg{width:100%;height:auto}
.zc.no svg{filter:brightness(0);opacity:.18}
.zc.no{color:#aaa}

/* けっか */
.result{align-items:center;justify-content:center;text-align:center;gap:14px}
.hana{font-size:clamp(70px,22vw,130px);line-height:1;animation:spin 1.6s ease-out}
@keyframes spin{from{transform:rotate(-200deg) scale(.2)}to{transform:none}}
.result h2{margin:0;font-size:clamp(28px,7vw,40px);color:var(--pink)}
.result p{margin:0;font-size:19px;line-height:1.7}
.stars{font-size:44px;letter-spacing:6px}
.rpics{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rpics svg{width:clamp(70px,20vw,110px);height:auto;border-radius:16px;background:#fff;box-shadow:var(--shadow)}

/* えんしゅつ */
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:50;
  background:#fff;border-radius:28px;padding:14px 28px;font-size:clamp(28px,8vw,46px);font-weight:800;color:var(--pink);box-shadow:0 10px 30px rgba(0,0,0,.15);white-space:nowrap}
.toast.go{animation:toast 1.1s ease-out}
.toast.ngt{color:var(--ng);font-size:clamp(22px,6vw,32px)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.conf{position:fixed;top:-20px;font-size:26px;pointer-events:none;z-index:40;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div class="app">
  <header>
    <button class="ibtn" id="homeBtn" aria-label="メニューへ" hidden>🏠</button>
    <h1 id="title">🐣 あかちゃん だあれ？</h1>
    <button class="ibtn" id="sndBtn" aria-label="おと オン・オフ">🔊<small>オン</small></button>
  </header>
  <main>
    <!-- メニュー -->
    <section class="screen on" id="sMenu">
      <div class="hero">
        <div class="pics" id="heroPics"></div>
        <p>いきものの あかちゃんは、おとなと <b>かたちが ちがう</b> ことも あるよ。<br>だれの あかちゃんか あてて みよう！</p>
      </div>
      <div class="menu-btns">
        <button class="big" style="--c:#4c9a52" id="goPlay"><span class="em">🐣</span><span><b>だれの あかちゃん？</b>あてて、そだつ じゅんばんに ならべよう</span></button>
        <button class="big" style="--c:#e8590c" id="goSort"><span class="em">🥚</span><span><b>なかまわけ</b>たまごで うまれる？ さなぎに なる？</span></button>
        <button class="big" style="--c:#3b8fd8" id="goZukan"><span class="em">📖</span><span><b>ずかん</b><span id="zCount">0 / 12</span></span></button>
      </div>
      <p class="note">1かい 1〜3ぷん。まちがえても なんどでも やりなおせるよ。</p>
    </section>

    <!-- だれの あかちゃん？ -->
    <section class="screen" id="sQuiz">
      <div class="prog" id="qProg"></div>
      <div class="ask">この あかちゃん、<br>おとなに なったら だあれ？</div>
      <div class="quiz">
        <div class="baby" id="qBaby"></div>
        <div class="choices" id="qChoices"></div>
      </div>
    </section>

    <!-- ならべる -->
    <section class="screen" id="sOrder">
      <div class="prog" id="oProg"></div>
      <div class="ask" id="oAsk">そだつ じゅんばんに ならべよう<small>カードを タップすると あいている ところに はいるよ</small></div>
      <div class="slots" id="oSlots"></div>
      <p class="hint" id="oHint"></p>
      <div class="pool" id="oPool"></div>
    </section>

    <!-- そだつ ようす -->
    <section class="screen" id="sGrow">
      <div class="prog" id="gProg"></div>
      <div class="grow">
        <div class="gview" id="gView"></div>
        <div class="thumbs" id="gThumbs"></div>
        <div class="bwrap" id="gBadge"></div>
        <div class="fact hide" id="gFact"></div>
        <div class="row hide" id="gRow">
          <button class="btn sub" id="gAgain">🔁 もういちど みる</button>
          <button class="btn" id="gNext">つぎへ ▶</button>
        </div>
      </div>
    </section>

    <!-- なかまわけ -->
    <section class="screen" id="sSort">
      <div class="bar"><div id="sBar"></div></div>
      <div class="sortq">
        <div class="baby" id="sPic"></div>
        <div class="ask" id="sAsk"></div>
        <div class="bins" id="sBins"></div>
        <div class="fact hide" id="sFact"></div>
        <div class="row hide" id="sRow"><button class="btn" id="sNext">つぎへ ▶</button></div>
      </div>
    </section>

    <!-- ずかん -->
    <section class="screen" id="sZukan">
      <div class="ask">いきもの ずかん<small>タップすると そだつ ようすが みられるよ</small></div>
      <div class="zgrid" id="zGrid"></div>
    </section>

    <!-- けっか -->
    <section class="screen result" id="sResult">
      <div class="hana">💮</div>
      <h2 id="rTitle">はなまる！</h2>
      <div class="stars" id="rStars"></div>
      <p id="rMsg"></p>
      <div class="rpics" id="rPics"></div>
      <div class="row">
        <button class="btn or" id="rAgain">🔁 もういっかい</button>
        <button class="btn sub" id="rMenu">🏠 メニュー</button>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= え（SVG） ================= */
const E = (x, y, r = 3.2) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#222"/><circle cx="${x + r * .35}" cy="${y - r * .35}" r="${r * .38}" fill="#fff"/>`;
const flip = s => `<g transform="translate(100 0) scale(-1 1)">${s}</g>`;
const BG = {
  water: `<rect width="100" height="100" rx="16" fill="#d6effa"/><path d="M6 18q8-5 16 0t16 0 16 0 16 0 16 0 16 0" stroke="#a9d8ef" stroke-width="2.5" fill="none"/>`,
  soil: `<rect width="100" height="100" rx="16" fill="#ecd6b4"/><g fill="#d2b187"><circle cx="16" cy="18" r="2.5"/><circle cx="82" cy="14" r="2"/><circle cx="86" cy="84" r="3"/><circle cx="14" cy="86" r="2"/><circle cx="30" cy="90" r="1.6"/><circle cx="74" cy="22" r="1.4"/></g>`,
  sand: `<rect width="100" height="100" rx="16" fill="#f7e8c4"/><g fill="#e6cf9a"><circle cx="15" cy="80" r="1.6"/><circle cx="85" cy="70" r="1.6"/><circle cx="70" cy="90" r="1.4"/><circle cx="25" cy="60" r="1.2"/></g>`,
  leaf: `<rect width="100" height="100" rx="16" fill="#eef8e6"/><path d="M4 84Q44 26 98 46Q66 104 4 84Z" fill="#9ad877"/><path d="M4 84Q52 64 98 46" stroke="#73b552" stroke-width="2" fill="none"/>`,
  sky: `<rect width="100" height="100" rx="16" fill="#e4f3ff"/><g fill="#fff"><ellipse cx="22" cy="20" rx="12" ry="5"/><ellipse cx="80" cy="84" rx="10" ry="4"/></g>`,
  grass: `<rect width="100" height="100" rx="16" fill="#eef8e4"/><path d="M0 84h100v0a16 16 0 0 1-16 16H16A16 16 0 0 1 0 84z" fill="#bfe3a0"/>`,
  ice: `<rect width="100" height="100" rx="16" fill="#eef6fc"/><path d="M0 86h100a16 16 0 0 1-16 14H16A16 16 0 0 1 0 86z" fill="#fff" stroke="#cfe3f2" stroke-width="1.5"/>`,

/* ================= おと（WebAudio） ================= */
let AC = null;
function ac() {
  if (!S.sound) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f, d = .15, type = "sine", at = 0, vol = .18, f2) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  tap: () => tone(660, .08, "triangle", 0, .12),
  pop: () => tone(420, .12, "sine", 0, .2, 900),
  ok: () => [784, 988, 1319].forEach((f, i) => tone(f, .18, "triangle", i * .09, .16)),
  ng: () => { tone(300, .18, "square", 0, .06, 220); tone(240, .22, "square", .16, .06, 180); },
  grow: () => tone(330, .5, "sine", 0, .14, 880),
  fan: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? .5 : .16, "triangle", i * .13, .16))

function stCard(sp, i) {
  const b = document.createElement("button");

function showOrder() {
  const sp = R.list[R.i], n = sp.st.length;
  $("oProg").innerHTML = progHTML(1);
  $("oHint").textContent = "";
  const slots = $("oSlots"); slots.innerHTML = "";
  for (let i = 0; i < n; i++) {
    if (i) slots.insertAdjacentHTML("beforeend", '<span class="sarrow">▶</span>');
    const s = document.createElement("div"); s.className = "slot"; s.dataset.k = i;
    s.innerHTML = `<span class="no">${i + 1}</span>`; slots.appendChild(s);
  }
  let order; do { order = shuffle([...Array(n).keys()]); } while (order.every((v, i) => v === i));
  const pool = $("oPool"); pool.innerHTML = "";
  const slotEls = () => [...slots.querySelectorAll(".slot")];
  let busy = false;
  order.forEach(i => {
    const c = stCard(sp, i);
    c.onclick = () => {
      if (busy) return;
      const inSlot = c.parentElement.classList.contains("slot");
      if (inSlot) {
        if (c.parentElement.classList.contains("lock")) return;
        SFX.tap(); pool.appendChild(c); return;
      }
      const empty = slotEls().find(s => !s.querySelector(".st"));
      if (!empty) return;
      SFX.pop(); empty.appendChild(c); c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
      if (slotEls().every(s => s.querySelector(".st"))) { busy = true; later(check, 450); }
    };
    pool.appendChild(c);
  });
  function check() {
    let wrong = 0;
    slotEls().forEach(s => {
      const c = s.querySelector(".st");
      if (+c.dataset.i === +s.dataset.k) s.classList.add("lock");
      else { wrong++; shake(c); }
    });
    if (!wrong) {
      SFX.ok(); toast(PRAISE[Math.random() * PRAISE.length | 0]);
      later(() => showGrow(sp, false), 1200);
    } else {
      R.miss++; SFX.ng();
      $("oHint").textContent = `${wrong}まい ちがうよ。みどりの わくは あってるよ！`;
      later(() => {
        slotEls().forEach(s => { if (!s.classList.contains("lock")) { const c = s.querySelector(".st"); if (c) pool.appendChild(c); } });
        busy = false;
      }, 650);
    }
  }
  show("sOrder");
}

  $("gThumbs").innerHTML = sp.st.map((n, i) => (i ? '<span class="sarrow">▶</span>' : "") + `<div class="t" data-i="${i}">${svg(art(sp, i), n)}</div>`).join("");
  const born = sp.birth === "egg" ? "🥚 たまごで うまれる" : "👶 あかちゃんで うまれる";
  const extra = sp.kind === "henshin" ? (sp.pupa ? "🦋 さなぎに なって へんしん！" : sp.pupa === false ? "✨ さなぎに ならずに へんしん！" : "✨ おやと かたちが ちがう！") : "";
  $("gBadge").innerHTML = `<span class="badge b2">${born}</span> ` + (extra ? `<span class="badge">${extra}</span>` : "");
  $("gFact").innerHTML = sp.fact;
  $("gNext").textContent = fromZukan ? "📖 ずかんへ" : (R && R.i + 1 >= R.list.length ? "おわり ▶" : "つぎの いきもの ▶");
  show("sGrow");
  play(sp);
}
function play(sp) {
  clearTimers();
  $("gFact").classList.add("hide"); $("gRow").classList.add("hide");
  const thumbs = [...$("gThumbs").querySelectorAll(".t")];
  thumbs.forEach(t => t.className = "t");
  const step = i => {
    const v = $("gView");
    v.innerHTML = svg(art(sp, i), sp.st[i]) + `<div class="lb">${sp.st[i]}</div>`;
    v.classList.remove("pop"); void v.offsetWidth; v.classList.add("pop");
    thumbs.forEach((t, k) => t.className = "t" + (k === i ? " on" : k < i ? " seen" : ""));
    if (i < sp.st.length - 1) { SFX.grow(); later(() => step(i + 1), 1500); }
    else {
      SFX.fan(); confetti(18);
      later(() => { thumbs.forEach(t => t.className = "t seen"); $("gFact").classList.remove("hide"); $("gRow").classList.remove("hide"); }, 700);
    }
  };
  step(0);
  $("gAgain").onclick = () => { SFX.tap(); play(sp); };
}
$("gNext").onclick = () => {
  SFX.tap();
  if (growFrom === "zukan") { renderZukan(); show("sZukan"); return; }
  R.i++;
  if (R.i < R.list.length) showQuiz();
  else finish("play");
};

/* ================= なかまわけ ================= */
let Q = null;
function startSort() {
  const birth = shuffle(SP.map(s => ({ name: s.name, art: adult(s), type: "birth", ans: s.birth, fact: s.fact.replace(/<\/?b>/g, "") }))
    .concat(EXTRA.filter(e => e.birth).map(e => ({ name: e.name, art: e.art, type: "birth", ans: e.birth, fact: e.fact }))));
  const babies = birth.filter(q => q.ans === "baby"), eggs = birth.filter(q => q.ans === "egg");
  const pupa = shuffle(SP.filter(s => s.pupa !== null).map(s => ({ name: s.name, art: adult(s), type: "pupa", ans: s.pupa ? "yes" : "no", fact: s.fact.replace(/<\/?b>/g, "") }))
    .concat(EXTRA.filter(e => e.pupa !== undefined).map(e => ({ name: e.name, art: e.art, type: "pupa", ans: e.pupa ? "yes" : "no", fact: e.fact }))));
  const pYes = pupa.filter(q => q.ans === "yes"), pNo = pupa.filter(q => q.ans === "no");
  Q = { list: shuffle([...babies.slice(0, 3), ...eggs.slice(0, 2), ...pYes.slice(0, 2), ...pNo.slice(0, 1)]), i: 0, miss: 0 };
  showSortQ();
}
function showSortQ() {
  const q = Q.list[Q.i];
  $("sBar").style.width = (Q.i / Q.list.length * 100) + "%";
  $("sPic").innerHTML = svg(q.art, q.name) + `<div class="lb">${q.name}</div>`;
  const bins = q.type === "birth"
    ? [["egg", "🥚", "たまごで うまれる", "#e8590c"], ["baby", "👶", "あかちゃんで うまれる", "#d6336c"]]
    : [["yes", "⭕", "さなぎに なる", "#7048e8"], ["no", "❌", "さなぎに ならない", "#1c7ed6"]];
  $("sAsk").innerHTML = q.type === "birth" ? `${q.name}は どう うまれる？` : `${q.name}は さなぎに なる？`;
  $("sFact").classList.add("hide"); $("sRow").classList.add("hide");
  $("sBins").innerHTML = "";
  let done = false;
  bins.forEach(([v, em, lb, c]) => {
    const b = document.createElement("button"); b.className = "bin"; b.style.setProperty("--c", c);
    b.innerHTML = `<span class="em">${em}</span>${lb}`;
    b.onclick = () => {
      if (done || b.classList.contains("ng")) return;
      if (v === q.ans) {
        done = true; b.classList.add("ok"); SFX.ok(); toast(PRAISE[Math.random() * PRAISE.length | 0]);
        $("sFact").textContent = q.fact; $("sFact").classList.remove("hide"); $("sRow").classList.remove("hide");
        $("sBar").style.width = ((Q.i + 1) / Q.list.length * 100) + "%";
      } else { Q.miss++; b.classList.add("ng"); shake(b); SFX.ng(); toast("ざんねん！ もういっぽうかな？", true); }
    };
    $("sBins").appendChild(b);
  });
  show("sSort");
}
$("sNext").onclick = () => { SFX.tap(); Q.i++; if (Q.i < Q.list.length) showSortQ(); else finish("sort"); };

/* ================= けっか ================= */
let lastMode = "play";
function finish(mode) {
  lastMode = mode;
  const miss = mode === "play" ? R.miss : Q.miss;
  if (mode === "play") S.plays = (S.plays || 0) + 1; else S.sorts = (S.sorts || 0) + 1;
  save();
  const stars = miss === 0 ? 3 : miss <= 2 ? 2 : 1;
  $("rStars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  $("rTitle").textContent = miss === 0 ? "パーフェクト！" : "はなまる！";
  $("rMsg").innerHTML = mode === "play"
    ? (miss === 0 ? "ぜんぶ いっかいで できたね！<br>いきものはかせだ！" : "さいごまで よく がんばったね！<br>そだつ じゅんばん、おぼえたかな？")
    : (miss === 0 ? "なかまわけ ぜんもん せいかい！<br>すごい！" : "ぜんぶ わけられたね！<br>まちがえた ところも もう ばっちり！");
  $("rPics").innerHTML = mode === "play" ? R.list.map(s => svg(adult(s), s.name)).join("") : "";
  show("sResult"); SFX.fan(); confetti(36);
}
$("rAgain").onclick = () => { SFX.tap(); lastMode === "play" ? startRound() : startSort(); };
$("rMenu").onclick = () => { SFX.tap(); show("sMenu"); };

/* ================= ずかん ================= */
function renderZukan() {
  const g = $("zGrid"); g.innerHTML = "";
  SP.forEach(sp => {
    const on = !!S.seen[sp.id];
    const b = document.createElement("button"); b.className = "zc" + (on ? "" : " no");
    b.innerHTML = svg(adult(sp), on ? sp.name : "？") + `<span>${on ? sp.name : "？？？"}</span>`;
    b.onclick = () => {
      if (!on) { SFX.ng(); shake(b); toast("あそぶと みつかるよ", true); return; }
      SFX.tap(); showGrow(sp, true);
    };
    g.appendChild(b);
  });
}

renderSnd();
renderMenu();
// テスト用
window.__akachan = { SP, state: () => S, now: () => R && R.list[R.i], svgOf: (sp, i) => svg(art(sp, i)) };
</script>
