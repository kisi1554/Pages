<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>セミたんけん ｜ セミの いっしょうと なきごえ</title>
<meta name="description" content="5さいから あそべる セミの せいたい アプリ。いっしょう・ずかん・なきごえクイズ・セミとりの 4つで、セミの ことが わかります。">
<meta name="theme-color" content="#2f7d32">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪳</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="backBtn" class="icon-btn" type="button" aria-label="メニューに もどる" hidden>◀ もどる</button>
  <h1 id="topTitle">セミたんけん</h1>
  <button id="soundBtn" class="icon-btn" type="button" aria-label="おとの せってい">🔊</button>
</header>

<main id="app" class="app"></main>

<!-- あんない役「せみのすけ」 -->
<div id="guide" class="guide" hidden>
  <div class="guide-body" id="guideArt"></div>
  <p class="guide-bubble" id="guideText"></p>
  <button id="guideReplay" class="guide-replay" type="button" aria-label="もういちど よんでもらう">🔁</button>
</div>

<!-- おとの せってい -->
<div id="soundPanel" class="sheet" hidden>
  <div class="sheet-inner">
    <h2>おとの せってい</h2>
    <label class="toggle"><input type="checkbox" id="tgVoice" checked><span>よみあげ（せみのすけの こえ）</span></label>
    <label class="toggle"><input type="checkbox" id="tgSong" checked><span>セミの なきごえ</span></label>
    <label class="toggle"><input type="checkbox" id="tgSe" checked><span>こうかおん・もりの おと</span></label>
    <button id="sheetClose" class="btn btn-main" type="button">とじる</button>
    <p class="note">おうちの方へ: 音が出ます。端末の音量をご確認ください。読み上げと鳴き声はブラウザで合成しています。</p>
  </div>
</div>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
