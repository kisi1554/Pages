<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>のりもの タイムマシン</title>
<style>
  :root {
    --ink: #2b2a33;
    --navy: #1d2b53;
    --gold: #ffc93c;
    --paper: #fff8e7;
    --line: #d8c9a3;
    --ok: #2f9e44;
    --ng: #e8590c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--ink);
    background: var(--navy);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .screen { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
  .screen.on { display: flex; }

  /* ---- 共通ヘッダー ---- */
  .bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--navy); color: #fff;
  }
  .bar h1, .bar h2 { flex: 1; margin: 0; font-size: 20px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn {
    flex: none; min-width: 52px; height: 48px; padding: 0 10px; border-radius: 14px;
    background: #34457e; color: #fff; font-size: 16px; font-weight: bold;
  }
  .ibtn.off { background: #55597a; opacity: .75; }

  /* ---- ホーム ---- */
  #home { background: linear-gradient(#1d2b53, #3a2f6b 60%, #7b4a8a); }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 28px; }
  .hero { text-align: center; color: #fff; margin: 4px 0 12px; }
  .hero .mc { font-size: 54px; line-height: 1; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .hero h1 { margin: 6px 0 4px; font-size: 28px; letter-spacing: .04em; }
  .hero p { margin: 0; font-size: 16px; opacity: .92; word-break: keep-all; overflow-wrap: anywhere; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
  .lv { display: flex; gap: 8px; justify-content: center; margin: 12px auto; max-width: 560px; }
  .lv button {
    flex: 1; min-height: 60px; border-radius: 16px; background: #fff; font-size: 16px; font-weight: bold;
    border: 4px solid transparent; line-height: 1.3;
  }
  .lv button small { display: block; font-size: 13px; font-weight: normal; }
  .lv button.sel { border-color: var(--gold); background: #fff6c9; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 900px; margin: 0 auto; }
  .topic {
    background: var(--paper); border-radius: 20px; padding: 10px 8px 12px; text-align: center;
    border: 4px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.25); min-height: 150px;
  }
  .topic:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .topic svg { width: 100%; max-width: 130px; height: auto; display: block; margin: 0 auto; }
  .topic b { display: block; font-size: 20px; margin-top: 2px; }
  .topic span { display: block; font-size: 14px; color: #6b5d3a; }
  .big {
    display: block; width: 100%; max-width: 420px; margin: 16px auto 0; min-height: 60px; border-radius: 18px;
    background: var(--gold); color: var(--ink); font-size: 20px; font-weight: bold; box-shadow: 0 5px 0 #b98a00;
  }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98a00; }
  .big.sub { background: #fff; box-shadow: 0 5px 0 #b9b2a0; }

  /* ---- ならべる ---- */
  #play { background: #2a3a6e; }
  .pmain { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); }
  .wrap { flex: 1; min-height: 0; display: grid; grid-template: "a" auto "c" 1fr "b" auto / 1fr; gap: 4px; }
  .ax { color: #fff; font-size: 16px; font-weight: bold; text-align: center; }
  .axA { grid-area: a; } .axB { grid-area: b; }
  .cards { grid-area: c; min-height: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  .tcard {
    position: relative; flex: 1 1 0; min-height: 0; max-height: 112px;
    display: flex; align-items: center; gap: 12px; padding: 6px 12px;
    background: var(--paper); border: 4px solid #fff; border-radius: 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,.3); touch-action: none; cursor: grab;
  }
  .tcard svg { flex: none; height: 100%; max-height: 84px; width: auto; aspect-ratio: 4 / 3; pointer-events: none; }
  .tcard .tx { flex: 1; min-width: 0; pointer-events: none; }
  .tcard .nm { font-size: 19px; font-weight: bold; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
  .tcard .hint { display: none; font-size: 15px; color: #7a4a1e; margin-top: 2px; line-height: 1.25; }
  .cards.hints .hint { display: block; }
  .tcard.drag { z-index: 10; box-shadow: 0 14px 18px rgba(0,0,0,.4); border-color: var(--gold); cursor: grabbing; }
  .tcard.sel { border-color: var(--gold); background: #fff6c9; }
  .tcard.ok { border-color: var(--ok); }
  .tcard.ok::after {
    content: "✓"; position: absolute; right: 8px; top: 6px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--ok); color: #fff; font-weight: bold; font-size: 20px; line-height: 30px; text-align: center;
  }
  .machine {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: linear-gradient(#8b93a7, #5d6477); border-radius: 20px; border: 4px solid #c9cfdd;
  }
  .machine.shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  .msg { flex: 1; min-width: 0; background: #10182f; color: #9ff7c1; border-radius: 12px; padding: 8px 10px; font-size: 17px; font-weight: bold; line-height: 1.4; min-height: 64px; display: flex; align-items: center; }
  .msg.ng { color: #ffd0a8; }
  .hbtn { flex: none; width: 64px; min-height: 64px; border-radius: 14px; background: #fff6c9; font-size: 14px; font-weight: bold; line-height: 1.2; }
  .hbtn i { display: block; font-style: normal; font-size: 24px; }
  .leverbox { flex: none; text-align: center; color: #fff; font-size: 14px; font-weight: bold; }
  .lever { position: relative; width: 72px; height: 112px; margin: 0 auto 2px; background: #22283a; border-radius: 18px; border: 3px solid #c9cfdd; touch-action: none; cursor: pointer; }
  .lever::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 10px; margin-left: -5px; border-radius: 5px; background: #0c0f18; }
  .knob {
    position: absolute; left: 50%; top: 4px; width: 56px; height: 56px; margin-left: -28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9a9a, #e03131 60%, #a51111); border: 3px solid #fff;
    box-shadow: 0 3px 5px rgba(0,0,0,.5);
  }
  .knob.back { transition: transform .25s; }
  .lever.glow { animation: glow 1.2s infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(255,201,60,.55); } }

  @media (orientation: landscape) {
    .pmain { flex-direction: row; gap: 12px; }
    .wrap { grid-template: "a b" auto "c c" 1fr / 1fr 1fr; }
    .axA { text-align: left; } .axB { text-align: right; }
    .cards { flex-direction: row; align-items: center; }
    .tcard { flex-direction: column; justify-content: center; text-align: center; height: 100%; max-height: 320px; max-width: 220px; padding: 10px 6px; gap: 6px; }
    .tcard svg { width: 100%; height: auto; max-height: 55%; }
    .tcard .tx { flex: none; width: 100%; }
    .machine { flex-direction: column; width: 176px; justify-content: space-between; }
    .msg { flex: 1; width: 100%; font-size: 16px; align-items: flex-start; }
    .hbtn { width: 100%; min-height: 52px; }
    .hbtn i { display: inline; font-size: 20px; }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    .bar { padding-top: 4px; padding-bottom: 4px; } .ibtn { height: 40px; }
    .tcard .nm { font-size: 16px; } .msg { font-size: 14px; min-height: 0; padding: 6px; }
    .lever { height: 92px; } .knob { width: 48px; height: 48px; margin-left: -24px; }
    .hbtn { min-height: 40px; }
  }
  @media (orientation: portrait) and (max-height: 640px) {
    .tcard .nm { font-size: 17px; } .lever { height: 96px; } .knob { width: 50px; height: 50px; margin-left: -25px; }
  }

  /* ---- タイムトラベル ---- */
  #trip { background: #10182f; color: #fff; }
  .tmain { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 8px 14px; }
  .scene {
    position: relative; flex: 1 1 0; min-height: 120px; border-radius: 26px; overflow: hidden;
    border: 6px solid #c9cfdd; background: #89c2f5; display: flex; align-items: center; justify-content: center;
  }
  .scene .sky, .scene .gnd { position: absolute; left: 0; right: 0; }
  .scene .sky { top: 0; bottom: 26%; } .scene .gnd { bottom: 0; height: 26%; }
  .scene.edo .sky { background: linear-gradient(#f3d9a4, #fbeed0); } .scene.edo .gnd { background: #b9935a; }
  .scene.meiji .sky { background: linear-gradient(#d9c7a0, #f2e6c8); } .scene.meiji .gnd { background: #8f7a55; }
  .scene.showa .sky { background: linear-gradient(#ffb86b, #ffe3b0); } .scene.showa .gnd { background: #8d8a80; }
  .scene.ima .sky { background: linear-gradient(#6ab7ff, #d6eeff); } .scene.ima .gnd { background: #7bbf6a; }
  .scene.mirai .sky { background: linear-gradient(#4b3fa8, #b79cf5); } .scene.mirai .gnd { background: #5ad1c8; }
  .scene svg.art { position: relative; height: 86%; max-width: 92%; width: auto; aspect-ratio: 4 / 3; filter: drop-shadow(0 6px 4px rgba(0,0,0,.25)); }
  .scene.show svg.art { animation: arrive .6s cubic-bezier(.2,1.3,.5,1); }
  @keyframes arrive { from { transform: translateX(60%) scale(.6); opacity: 0; } }
  .warp { position: absolute; inset: 0; display: none; background: repeating-linear-gradient(100deg, #1d2b53 0 26px, #6a5acd 26px 40px, #ffc93c 40px 46px, #1d2b53 46px 80px); background-size: 240px 100%; }
  .scene.warping .warp { display: block; animation: warp .25s linear infinite; }
  .scene.warping svg.art { visibility: hidden; }
  @keyframes warp { to { background-position: -240px 0; } }
  .ybadge {
    position: absolute; left: 10px; top: 10px; background: #10182f; color: var(--gold); border: 3px solid var(--gold);
    border-radius: 12px; padding: 4px 12px; font-size: 20px; font-weight: bold; font-variant-numeric: tabular-nums;
  }
  .info { flex: none; background: var(--paper); color: var(--ink); border-radius: 20px; padding: 10px 14px; }
  .info .era { display: inline-block; background: var(--navy); color: #fff; border-radius: 999px; padding: 3px 14px; font-size: 16px; font-weight: bold; }
  .info .nm { word-break: keep-all; overflow-wrap: anywhere; font-size: 24px; font-weight: bold; margin: 4px 0 2px; line-height: 1.25; }
  .info .tv { font-size: 18px; line-height: 1.55; margin: 0; }
  .info .tv::before { content: "💡 "; }
  .trow { flex: none; display: flex; gap: 10px; }
  .trow .big { margin: 0; flex: 1; max-width: none; }
  .trow .say { flex: none; width: 76px; min-height: 60px; border-radius: 18px; background: #fff; color: var(--ink); font-size: 16px; font-weight: bold; box-shadow: 0 5px 0 #b9b2a0; }
  .tline { flex: none; position: relative; display: flex; align-items: flex-end; height: 62px; padding: 0 8px max(6px, env(safe-area-inset-bottom)); }
  .tline::before { content: ""; position: absolute; left: 8%; right: 8%; bottom: 31px; height: 6px; border-radius: 3px; background: #4a5a94; }
  .tline .st { position: relative; flex: 1; text-align: center; font-size: 13px; color: #b9c2e6; line-height: 1.2; }
  .tline .st i { display: block; width: 18px; height: 18px; margin: 0 auto 4px; border-radius: 50%; background: #4a5a94; border: 3px solid #10182f; }
  .tline .st.done i { background: var(--gold); }
  .tline .st.now { color: #fff; font-weight: bold; }
  .tline .st.now i { width: auto; height: 26px; margin-bottom: 0; background: none; border: 0; font-style: normal; font-size: 22px; line-height: 26px; }
  .tline .st.now i::before { content: "🕰️"; }
  @media (orientation: landscape) {
    .tmain { display: grid; grid-template: "s i" 1fr "s r" auto / 1.1fr 1fr; gap: 10px 14px; }
    .scene { grid-area: s; } .info { grid-area: i; overflow-y: auto; align-self: stretch; } .trow { grid-area: r; }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    .info .nm { font-size: 19px; } .info .tv { font-size: 15px; } .tline { height: 50px; }
    .trow .big, .trow .say { min-height: 46px; }
  }

  /* ---- できた！ ---- */
  .over { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 14px; background: rgba(16,24,47,.82); }
  .over.on { display: flex; }
  .panel { position: relative; width: 100%; max-width: 620px; max-height: 100%; overflow-y: auto; background: var(--paper); border-radius: 26px; border: 6px solid var(--gold); padding: 16px; text-align: center; }
  .panel h2 { margin: 0 0 4px; font-size: 26px; }
  .panel p { margin: 4px 0; font-size: 18px; line-height: 1.5; }
  .stars { font-size: 40px; letter-spacing: 6px; }
  .stars span { display: inline-block; animation: pop .5s backwards; }
  .stars span:nth-child(2) { animation-delay: .2s; } .stars span:nth-child(3) { animation-delay: .4s; }
  @keyframes pop { from { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } }
  .gain { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
  .mini { position: relative; width: 104px; background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 4px 4px 6px; font-size: 13px; font-weight: bold; line-height: 1.25; color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; }
  .mini svg { width: 100%; height: auto; display: block; }
  .mini .new { position: absolute; left: -6px; top: -8px; background: #e03131; color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; transform: rotate(-10deg); }
  .mini small { display: block; font-weight: normal; color: #7a4a1e; font-size: 12px; }
  .mini.lock { background: #e9e2cf; color: #9a8f70; }
  .mini.lock .q { height: 70px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .pbtns { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 10px; }
  .pbtns .big { margin: 0; max-width: none; font-size: 18px; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* ---- ずかん ---- */
  #zukan { background: #efe6cf; }
  .ztotal { text-align: center; font-size: 18px; font-weight: bold; margin: 0 0 10px; }
  .zsec { background: #fff8e7; border-radius: 20px; border: 3px solid var(--line); padding: 10px 10px 12px; margin: 0 auto 12px; max-width: 900px; }
  .zsec h3 { margin: 0 0 8px; font-size: 20px; }
  .zsec h3 small { font-size: 15px; color: #7a4a1e; margin-left: 6px; }
  .zrow { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px 2px 6px; align-items: stretch; }
  .zrow .mini { flex: none; }
  .zrow .arrow { flex: none; align-self: center; color: #b39a5a; font-size: 20px; font-weight: bold; }
  .detail svg { width: 100%; max-width: 300px; height: auto; }
  .detail .era { display: inline-block; background: var(--navy); color: #fff; border-radius: 999px; padding: 3px 14px; font-size: 16px; font-weight: bold; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- ホーム -->
<section class="screen on" id="home">
  <div class="bar">
    <h2>🕰️ タイムマシン</h2>
    <button class="ibtn" id="sndBtn" aria-label="おとの オン オフ">🔊 おと</button>
    <button class="ibtn" id="voiceBtn" aria-label="こえの オン オフ">🗣 こえ</button>
  </div>
  <div class="scroll">
    <div class="hero">
      <span class="mc">🕰️</span>
      <h1>のりもの タイムマシン</h1>
      <p>カードを <b>ふるい じゅん</b>に ならべて、むかしへ しゅっぱつ！</p>
    </div>
    <div class="lv" id="lv"></div>
    <div class="topics" id="topics"></div>
    <button class="big sub" id="toZukan">📖 ねんぴょう ずかん</button>
  </div>
</section>

<!-- ならべる -->
<section class="screen" id="play">
  <div class="bar">
    <button class="ibtn" data-home aria-label="さいしょに もどる">🏠</button>
    <h2 id="playTitle"></h2>
  </div>
  <div class="pmain">
    <div class="wrap">
      <div class="ax axA" id="axA"></div>
      <div class="cards" id="cards"></div>
      <div class="ax axB" id="axB"></div>
    </div>
    <div class="machine" id="machine">
      <div class="msg" id="msg"></div>
      <button class="hbtn" id="hintBtn"><i>💡</i>ヒント</button>
      <div class="leverbox">
        <div class="lever" id="lever" role="button" aria-label="レバーを ひく"><div class="knob" id="knob"></div></div>
        ひく ⬇
      </div>
    </div>
  </div>
</section>

<!-- タイムトラベル -->
<section class="screen" id="trip">
  <div class="bar">
    <button class="ibtn" data-home aria-label="さいしょに もどる">🏠</button>
    <h2>🕰️ タイムトラベル ちゅう</h2>
  </div>
  <div class="tmain">
    <div class="scene" id="scene">
      <div class="sky"></div><div class="gnd"></div>
      <svg class="art" id="sceneArt" viewBox="0 0 120 90"></svg>
      <div class="warp"></div>
      <div class="ybadge" id="ybadge"></div>
    </div>
    <div class="info">
      <span class="era" id="tEra"></span>
      <div class="nm" id="tName"></div>
      <p class="tv" id="tTrivia"></p>
    </div>
    <div class="trow">
      <button class="say" id="sayBtn">🗣<br>よむ</button>
      <button class="big" id="nextBtn"></button>
    </div>
  </div>
  <div class="tline" id="tline"></div>
</section>

<!-- ずかん -->
<section class="screen" id="zukan">
  <div class="bar">
    <button class="ibtn" data-home aria-label="さいしょに もどる">🏠</button>
    <h2>📖 ねんぴょう ずかん</h2>
  </div>
  <div class="scroll">
    <p class="ztotal" id="ztotal"></p>
    <div id="zbody"></div>
  </div>
</section>

<!-- できた！ -->
<div class="over" id="doneOver">
  <div class="panel">
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <h2>タイムトラベル だいせいこう！</h2>
    <p id="doneMsg"></p>
    <div class="gain" id="gain"></div>
    <div class="pbtns">
      <button class="big" id="againBtn">🔁 もういちど</button>
      <button class="big sub" id="otherBtn">🏠 ほかの たび</button>
      <button class="big sub" id="doneZukan">📖 ずかんを みる</button>
    </div>
  </div>
</div>

<!-- ずかんの くわしい カード -->
<div class="over" id="detailOver">

    <svg id="dArt" viewBox="0 0 120 90"></svg>

    <p id="dYear" style="color:#7a4a1e;font-weight:bold"></p>
    <p id="dTrivia" style="text-align:left"></p>
    <div class="pbtns">
      <button class="big sub" id="dSay">🗣 よむ</button>
      <button class="big" id="dClose">とじる</button>
    </div>
  </div>
</div>

    speechSynthesis.speak(u);
  } catch (e) {}
};
const hush = () => { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} };
const sayText = it => `${it.era.replace(/[（）]/g, '、').replace('〜', 'から ')}。${it.say || it.name}。${it.sayTv || it.tv}`;

/* ========== がめんの きりかえ ========== */
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('doneOver').classList.remove('on'); $('detailOver').classList.remove('on');
};
const goHome = () => { hush(); renderHome(); show('home'); };
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));

function renderToggles() {
  $('sndBtn').textContent = S.snd ? '🔊 おと' : '🔇 おと';
  $('sndBtn').classList.toggle('off', !S.snd);
  $('voiceBtn').textContent = '🗣 こえ';
  $('voiceBtn').classList.toggle('off', !S.voice || !S.snd);
}
$('sndBtn').addEventListener('click', () => { S.snd = !S.snd; if (!S.snd) hush(); save(); renderToggles(); if (S.snd) sfx.pick(); });
$('voiceBtn').addEventListener('click', () => {
  S.voice = !S.voice; if (S.voice) S.snd = true; else hush();
  save(); renderToggles(); if (S.voice) speak('こえで よむよ');
});

function renderHome() {
  renderToggles();
  $('lv').innerHTML = [[3, 'やさしい'], [4, 'ふつう'], [5, 'むずかしい']].map(([n, t]) =>
    `<button data-lv="${n}" class="${S.level === n ? 'sel' : ''}">カード ${n}まい<small>${t}</small></button>`).join('');
  $('topics').innerHTML = TOPICS.map(t => {
    const got = t.items.filter(i => S.got[i.id]).length;
    return `<button class="topic" data-topic="${t.id}">${svg(t.cover)}<b>${t.emoji} ${t.name}</b>` +
      `<span>${got === t.items.length ? '👑 ' : ''}カード ${got}／${t.items.length}</span></button>`;
  }).join('');
}
$('lv').addEventListener('click', e => {
  const b = e.target.closest('[data-lv]'); if (!b) return;
  S.level = +b.dataset.lv; save(); sfx.pick(); renderHome();
});
$('topics').addEventListener('click', e => {
  const b = e.target.closest('[data-topic]'); if (!b) return;
  startRound(TOPICS.find(t => t.id === b.dataset.topic));
});

/* ========== ならべる ========== */
let topic = null, round = [], arr = [], misses = 0, locked = false, sel = null, drag = null;
const cardsEl = $('cards');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function startRound(t) {
  topic = t; misses = 0; locked = false; sel = null; drag = null;
  const n = Math.min(S.level, t.items.length);
  // まだ もっていない カードを さきに えらぶ
  const pool = shuffle(t.items.slice()).sort((a, b) => (S.got[a.id] ? 1 : 0) - (S.got[b.id] ? 1 : 0));
  round = pool.slice(0, n).sort((a, b) => a.k - b.k);
  const want = round.map(i => i.id).join();
  do { arr = shuffle(round.map(i => i.id)); } while (arr.join() === want);
  $('playTitle').textContent = `${t.emoji} ${t.name}の たび`;
  cardsEl.classList.remove('hints');
  cardsEl.innerHTML = round.map(it =>
    `<div class="tcard" data-id="${it.id}">${svg(it.id)}<div class="tx"><div class="nm">${it.name}</div><div class="hint">🕰️ ${it.era}</div></div></div>`).join('');
  cardsEl.querySelectorAll('.tcard').forEach(bindCard);
  applyOrder(); setAxis();
  say('ふるい じゅんに ならべて、レバーを ひいてね！');
  $('lever').classList.remove('glow');
  show('play'); sfx.pick();
  speak(`${t.name}の たび。ふるい じゅんに ならべて、レバーを ひいてね`);
}
const landscape = () => window.matchMedia('(orientation: landscape)').matches;
function setAxis() {
  const l = landscape();
  $('axA').textContent = l ? '⬅ むかし（ふるい）' : '⬆ むかし（ふるい）';
  $('axB').textContent = l ? 'いま（あたらしい） ➡' : '⬇ いま（あたらしい）';
}
window.addEventListener('resize', setAxis);
function say(text, ng) { $('msg').textContent = text; $('msg').classList.toggle('ng', !!ng); }
const cardOf = id => cardsEl.querySelector(`[data-id="${id}"]`);
function applyOrder() { arr.forEach((id, i) => { cardOf(id).style.order = i; }); }
function flip(change, skip) {
  const els = [...cardsEl.children].filter(e => e !== skip);
  const before = els.map(e => e.getBoundingClientRect());
  change();
  els.forEach((e, i) => {
    const a = e.getBoundingClientRect(), dx = before[i].left - a.left, dy = before[i].top - a.top;
    if (!dx && !dy) return;
    e.style.transition = 'none'; e.style.transform = `translate(${dx}px,${dy}px)`;
    e.getBoundingClientRect();
    e.style.transition = 'transform .18s'; e.style.transform = '';
  });
}
function clearMarks() { cardsEl.querySelectorAll('.ok').forEach(e => e.classList.remove('ok')); }
function setSel(el) { if (sel) sel.classList.remove('sel'); sel = el; if (sel) sel.classList.add('sel'); }

function bindCard(el) {
  el.addEventListener('pointerdown', e => {
    if (locked || drag) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    const rects = arr.map(id => cardOf(id).getBoundingClientRect());
    const i = arr.indexOf(el.dataset.id);
    drag = { el, pid: e.pointerId, sx: e.clientX, sy: e.clientY, rects, from: i, cur: i, moved: false };
  });
  el.addEventListener('pointermove', e => {
    const d = drag; if (!d || d.el !== el || e.pointerId !== d.pid) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (!d.moved) {
      if (Math.hypot(dx, dy) < 7) return;
      d.moved = true; setSel(null); clearMarks(); el.style.transition = 'none'; el.classList.add('drag'); sfx.pick();
    }
    const r0 = d.rects[d.from], cx = r0.left + r0.width / 2 + dx, cy = r0.top + r0.height / 2 + dy;
    let best = d.cur, bd = Infinity;
    d.rects.forEach((r, i) => { const q = Math.hypot(cx - r.left - r.width / 2, cy - r.top - r.height / 2); if (q < bd) { bd = q; best = i; } });
    if (best !== d.cur) {
      flip(() => { arr.splice(best, 0, arr.splice(d.cur, 1)[0]); applyOrder(); }, el);
      d.cur = best; sfx.tick();
    }
    const rc = d.rects[d.cur];
    el.style.transform = `translate(${r0.left + dx - rc.left}px,${r0.top + dy - rc.top}px) scale(1.04)`;
  });
  const end = e => {
    const d = drag; if (!d || d.el !== el || e.pointerId !== d.pid) return;
    drag = null;
    if (d.moved) {
      el.classList.remove('drag'); el.style.transition = 'transform .15s'; el.style.transform = ''; sfx.drop();
      $('lever').classList.add('glow');
    } else if (e.type === 'pointerup') tapCard(el);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
// タップでも いれかえ できる（1まいめ → 2まいめ）
function tapCard(el) {
  if (locked) return;
  clearMarks();
  if (!sel) { setSel(el); sfx.pick(); say('いれかえたい カードを もう 1まい タッチ！'); return; }
  if (sel === el) { setSel(null); return; }
  const a = arr.indexOf(sel.dataset.id), b = arr.indexOf(el.dataset.id);
  flip(() => { [arr[a], arr[b]] = [arr[b], arr[a]]; applyOrder(); });
  setSel(null); sfx.drop(); $('lever').classList.add('glow');
  say('ならべたら レバーを ひいてね！');
}
$('hintBtn').addEventListener('click', () => {
  cardsEl.classList.add('hints'); sfx.pick();
  say('カードの「いつごろ？」を よんで みよう');
});

/* ---- レバー ---- */
const lever = $('lever'), knob = $('knob');
let lv = null;
const travel = () => lever.clientHeight - knob.offsetHeight - 8;
lever.addEventListener('pointerdown', e => {
  if (locked) return; e.preventDefault();
  try { lever.setPointerCapture(e.pointerId); } catch (err) {}
  knob.classList.remove('back');
  lv = { pid: e.pointerId, sy: e.clientY, y: 0, moved: false };
});
lever.addEventListener('pointermove', e => {
  if (!lv || e.pointerId !== lv.pid) return;
  const y = Math.max(0, Math.min(travel(), e.clientY - lv.sy));
  if (y > 4) lv.moved = true;
  lv.y = y; knob.style.transform = `translateY(${y}px)`;
});
const leverEnd = e => {
  if (!lv || e.pointerId !== lv.pid) return;
  const d = lv; lv = null;
  const fire = e.type === 'pointerup' && (!d.moved || d.y > travel() * 0.55);
  knob.classList.add('back');
  if (fire) { knob.style.transform = `translateY(${travel()}px)`; setTimeout(() => { knob.style.transform = ''; }, 380); pull(); }
  else knob.style.transform = '';
};
lever.addEventListener('pointerup', leverEnd);
lever.addEventListener('pointercancel', leverEnd);

function pull() {
  if (locked) return;
  setSel(null); lever.classList.remove('glow'); sfx.lever();
  const ok = arr.every((id, i) => id === round[i].id);
  if (ok) {
    locked = true;
    cardsEl.querySelectorAll('.tcard').forEach(c => c.classList.add('ok'));
    say('せいかい！ タイムマシン はっしん！');
    setTimeout(sfx.ok, 250);
    setTimeout(startTrip, 1300);
    return;
  }
  misses++;
  let hit = 0;
  arr.forEach((id, i) => { const good = id === round[i].id; cardOf(id).classList.toggle('ok', good); if (good) hit++; });
  const m = $('machine'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
  setTimeout(sfx.ng, 200);
  if (misses >= 2) cardsEl.classList.add('hints');
  const t = (hit ? `おしい！ ✓の カードは あってるよ。` : 'ガタガタ… うごかないよ。') +
    (misses >= 2 ? 'ヒントを よんで もういちど！' : 'もういちど ならべて みよう！');
  say(t, true); speak(hit ? 'おしい！ もういちど ならべて みよう' : 'うごかないよ。もういちど ならべて みよう');
}

/* ========== タイムトラベル ========== */
let stop = -1, warpTimer = 0;
function startTrip() {
  stop = -1;
  $('tline').innerHTML = round.map(it => `<div class="st" data-id="${it.id}"><i></i>${it.y.replace('ねんごろ ひろまる', 'ねんごろ')}</div>`).join('');
  $('scene').className = 'scene warping';
  $('tEra').textContent = 'しゅっぱつ！'; $('tName').textContent = 'むかしへ ワープ！'; $('tTrivia').textContent = 'どんな じだいに つくかな？';
  $('ybadge').textContent = '？？？';
  $('nextBtn').disabled = true; $('nextBtn').textContent = 'ワープちゅう…';
  show('trip');
  nextStop();
}
function nextStop() {
  hush();
  if (stop >= round.length - 1) return finish();
  stop++;
  const it = round[stop], sc = $('scene');
  $('nextBtn').disabled = true; $('nextBtn').textContent = 'ワープちゅう…';
  sc.classList.add('warping'); sc.classList.remove('show');
  sfx.warp();
  clearTimeout(warpTimer);
  warpTimer = setTimeout(() => {
    sc.className = 'scene show ' + eraClass(it.k);
    $('sceneArt').innerHTML = ART[it.id];
    $('ybadge').textContent = it.y;
    $('tEra').textContent = it.era; $('tName').textContent = it.name; $('tTrivia').textContent = it.tv;
    document.querySelectorAll('#tline .st').forEach((e, i) => { e.classList.toggle('done', i <= stop); e.classList.toggle('now', i === stop); });
    $('nextBtn').disabled = false;
    $('nextBtn').textContent = stop === round.length - 1 ? '🏁 ゴール！' : 'つぎの じだいへ ▶';
    sfx.arrive(); speak(sayText(it));
  }, 950);
}
$('nextBtn').addEventListener('click', () => { if (!$('nextBtn').disabled) nextStop(); });
$('sayBtn').addEventListener('click', () => {
  if (stop < 0 || $('nextBtn').disabled) return;
  const keep = [S.snd, S.voice]; S.snd = S.voice = true; speak(sayText(round[stop])); [S.snd, S.voice] = keep;
});

function finish() {
  const fresh = round.filter(it => !S.got[it.id]).map(it => it.id);
  round.forEach(it => { S.got[it.id] = 1; });
  S.clears[topic.id] = (S.clears[topic.id] || 0) + 1;
  save();
  const full = topic.items.every(i => S.got[i.id]);
  $('doneMsg').textContent = full
    ? `${topic.name}の カードが ぜんぶ そろったよ！ すごい！ 👑`
    : fresh.length ? `あたらしい カードを ${fresh.length}まい ゲット！ ずかんに はいったよ。` : 'じゅんばん かんぺき！ はかせ みたい！';
  $('gain').innerHTML = round.map(it =>
    `<div class="mini">${fresh.includes(it.id) ? '<span class="new">NEW</span>' : ''}${svg(it.id)}${it.name}<small>${it.y}</small></div>`).join('');
  $('againBtn').textContent = full ? '🔁 もういちど' : '🔁 つぎの カードで あそぶ';
  $('doneOver').classList.add('on');
  sfx.fanfare(); confetti();
  speak('タイムトラベル だいせいこう！ ' + $('doneMsg').textContent.replace('👑', ''));
}
function confetti() {
  const cols = ['#ffc93c', '#ff6b6b', '#51cf66', '#4dabf7', '#f783ac', '#845ef7'];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    c.style.animationDelay = Math.random() * 0.6 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}
$('againBtn').addEventListener('click', () => { hush(); startRound(topic); });
$('otherBtn').addEventListener('click', goHome);
$('doneZukan').addEventListener('click', openZukan);

/* ========== ねんぴょう ずかん ========== */
function openZukan() {
  hush();
  const n = ALL.filter(i => S.got[i.id]).length;
  $('ztotal').textContent = `あつめた カード ${n}／${ALL.length} まい` + (n === ALL.length ? ' 👑 コンプリート！' : '');
  $('zbody').innerHTML = TOPICS.map(t => {
    const got = t.items.filter(i => S.got[i.id]).length;
    return `<div class="zsec"><h3>${t.emoji} ${t.name}<small>${got}／${t.items.length}</small></h3><div class="zrow">` +
      t.items.map(it => S.got[it.id]
        ? `<button class="mini" data-item="${it.id}">${svg(it.id)}${it.name}<small>${it.y}</small></button>`
        : `<div class="mini lock"><div class="q">？</div>まだ ひみつ</div>`).join('<span class="arrow">▶</span>') +
      `</div></div>`;
  }).join('');
  show('zukan');
}
$('toZukan').addEventListener('click', () => { sfx.pick(); openZukan(); });
let detail = null;
$('zbody').addEventListener('click', e => {
  const b = e.target.closest('[data-item]'); if (!b) return;
  detail = ALL.find(i => i.id === b.dataset.item);
  $('dArt').innerHTML = ART[detail.id];
  $('dEra').textContent = detail.era; $('dName').textContent = detail.name;
  $('dYear').textContent = detail.y; $('dTrivia').textContent = '💡 ' + detail.tv;
  $('detailOver').classList.add('on'); sfx.pick();
});
$('dSay').addEventListener('click', () => {
  if (!detail) return;
  const keep = [S.snd, S.voice]; S.snd = S.voice = true; speak(sayText(detail)); [S.snd, S.voice] = keep;
});
$('dClose').addEventListener('click', () => { hush(); $('detailOver').classList.remove('on'); });

renderHome();
})();
</script>
