<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>となりの けん たんけん</title>
<meta name="description" content="となりの けんへ、となりの けんへ。でんしゃで にっぽんを たびして、けんの つながりを おぼえよう。">
<meta name="theme-color" content="#2f9e6e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚃</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #1d2b3a; --soft: #50657a; --sea: #cfeaf7; --land: #f4f1e4; --line: #9db3a6;
    --main: #2f9e6e; --main-d: #1f7a53; --cur: #2b7fd9; --goal: #e8483f; --nb: #ffe27a;
    --trail: #a9dcc0; --card: #ffffff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    color: var(--ink); background: #eaf6ef;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  rt { font-size: .5em; }

  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--main); color: #fff; }
  header h1 { flex: 1; margin: 0; font-size: clamp(16px, 4.6vw, 22px); letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { flex: none; min-width: 48px; height: 48px; padding: 0 10px; border-radius: 14px;
    background: rgba(255,255,255,.22); color: #fff; font-size: 22px; font-weight: 700; }
  .hbtn:active { background: rgba(255,255,255,.4); }

  .screen { flex: 1; min-height: 0; display: none; }
  .screen.on { display: flex; }

  /* ---- ホーム ---- */
  #home { flex-direction: column; align-items: center; overflow-y: auto; padding: 18px 16px 28px; gap: 14px; }
  .hero { font-size: 64px; line-height: 1; margin-top: 4px; }
  .lead { margin: 0; text-align: center; font-size: clamp(15px, 4.2vw, 19px); line-height: 1.7; color: var(--soft); }
  .big { width: min(100%, 460px); display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 16px 18px; min-height: 86px; border-radius: 22px; background: var(--card);
    border: 3px solid #cfe5d8; box-shadow: 0 5px 0 #cfe5d8; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #cfe5d8; }
  .big .e { font-size: 40px; flex: none; }
  .big b { display: block; font-size: clamp(19px, 5.4vw, 24px); }
  .big small { display: block; margin-top: 3px; font-size: clamp(13px, 3.6vw, 15px); color: var(--soft); line-height: 1.5; }
  .stat { font-size: 16px; font-weight: 700; color: var(--main-d); background: #fff; padding: 8px 16px; border-radius: 99px; }

  /* ---- ステージ えらび ---- */
  #stages { flex-direction: column; overflow-y: auto; padding: 14px 14px 28px; gap: 12px; align-items: center; }
  .seg { display: flex; gap: 8px; width: min(100%, 520px); }
  .seg button { flex: 1; min-height: 56px; border-radius: 16px; background: #fff; border: 3px solid #cfe5d8;
    font-size: 17px; font-weight: 700; line-height: 1.3; }
  .seg button.on { background: var(--main); border-color: var(--main-d); color: #fff; }
  .seg small { display: block; font-size: 12px; font-weight: 400; }
  #stageGrid { width: min(100%, 520px); display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stage { min-height: 84px; padding: 10px 8px; border-radius: 18px; background: #fff; border: 3px solid #cfe5d8;
    box-shadow: 0 4px 0 #cfe5d8; font-weight: 700; font-size: 15px; line-height: 1.45; }
  .stage:active { transform: translateY(3px); box-shadow: 0 1px 0 #cfe5d8; }
  .stage .n { font-size: 12px; color: var(--soft); }
  .stage .st { font-size: 15px; letter-spacing: 2px; }
  .stage.rand { background: #fff7d6; border-color: #f0d874; box-shadow: 0 4px 0 #f0d874; }

  /* ---- あそぶ がめん（ちず＋パネル） ---- */
  #play { flex-direction: column; }
  #mapWrap { flex: 1; min-height: 0; position: relative; background: var(--sea); overflow: hidden; }
  #map { width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { flex: none; max-height: 60%; overflow-y: auto; background: #fff; padding: 10px 12px 12px;
    border-top: 3px solid #cfe5d8; }
  @media (orientation: landscape) and (min-width: 640px) {
    #play { flex-direction: row; }
    #panel { width: min(40%, 380px); max-height: none; border-top: 0; border-left: 3px solid #cfe5d8; }
  }

  .pref { fill: var(--land); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .pref.trail { fill: var(--trail); }
  .pref.nb { fill: var(--nb); }
  .pref.cur { fill: #9cc8f5; stroke: var(--cur); stroke-width: 3; }
  .pref.goal { fill: #ffc2bd; stroke: var(--goal); stroke-width: 3; }
  .pref.hint { animation: hint .5s ease-in-out infinite alternate; }
  .pref.wrong { fill: #c9c9c9; }
  .pref.right { fill: #8fe0a6; stroke: var(--main-d); stroke-width: 3; }
  .pref.umi { fill: #c4b5f5; }
  @keyframes hint { from { fill: var(--nb); } to { fill: #ff9d2e; } }
  #okiFrame { fill: none; stroke: #7fa9bf; stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
  .rail { fill: none; stroke: #3b4a57; stroke-width: 4; stroke-dasharray: 2 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .link { stroke: #d9682b; stroke-width: 3; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
  .lbl { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central;
    fill: var(--ink); stroke: #fff; stroke-width: 3.5px; paint-order: stroke; pointer-events: none; }
  .mk circle { fill: #fff; stroke: #d9682b; stroke-width: 2; }
  .mk text { font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  .mk.to text.t { font-size: 10px; font-weight: 700; fill: #b24d17; stroke: #fff; stroke-width: 3px; paint-order: stroke; }
  #train text, #flag text { font-size: 26px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  #mini { position: absolute; right: 8px; top: 8px; width: 92px; height: 104px; border-radius: 12px;
    background: rgba(255,255,255,.92); border: 2px solid #9db3a6; padding: 0; overflow: hidden; }
  #mini svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  #mini path { fill: #d9d4bf; stroke: none; }
  #mini .lab { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; font-weight: 700;
    background: rgba(47,158,110,.9); color: #fff; text-align: center; padding: 1px 0; }
  #toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: 92%;
    padding: 9px 16px; border-radius: 99px; background: rgba(29,43,58,.9); color: #fff; font-size: 16px; font-weight: 700;
    text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }

  .route { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-weight: 700; }
  .chip { display: inline-block; padding: 5px 12px; border-radius: 99px; font-size: clamp(15px, 4.2vw, 18px); font-weight: 700;
    background: #eef3f0; white-space: nowrap; }
  .chip.c { background: #d6e9fb; color: #145aa5; }
  .chip.g { background: #ffe1de; color: #b3261e; }
  .chip.y { background: #fff1b8; }
  .chip.p { background: #e6defc; }
  .msg { margin: 6px 0; text-align: center; font-size: clamp(15px, 4.2vw, 18px); line-height: 1.6; }
  .msg b { color: var(--main-d); }
  .q { margin: 0 0 8px; text-align: center; font-size: clamp(17px, 4.8vw, 21px); font-weight: 700; line-height: 1.6; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 90px; min-height: 54px; padding: 6px 10px; border-radius: 16px; background: #eef3f0;
    font-size: 16px; font-weight: 700; box-shadow: 0 4px 0 #cdd8d1; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #cdd8d1; }
  .btn.main { background: var(--main); color: #fff; box-shadow: 0 4px 0 var(--main-d); }
  .btn:disabled { opacity: .45; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choices .btn { min-height: 54px; font-size: clamp(17px, 4.8vw, 20px); }
  .choices .btn.ok { background: #8fe0a6; box-shadow: 0 4px 0 #58b874; }
  .choices .btn.ng { background: #f5b5b0; box-shadow: 0 4px 0 #d98780; }
  .stars { text-align: center; font-size: 40px; letter-spacing: 4px; margin: 2px 0; }
  .trail { text-align: center; line-height: 2.2; }
  .pname { text-align: center; font-size: clamp(24px, 7vw, 32px); font-weight: 700; margin: 0 0 4px; }
  .prog { text-align: center; font-size: 13px; color: var(--soft); margin-bottom: 4px; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="btnHome" aria-label="もどる">◀</button>
    <h1 id="title">となりの けん たんけん</h1>
    <button class="hbtn" id="btnSound" aria-label="おと">🔊</button>
  </header>

  <section class="screen on" id="home">
    <div class="hero">🚃🗾</div>
    <p class="lead">けんの なまえは もう ばっちり！<br>つぎは「<b>となりは どこ？</b>」で たびを しよう</p>
    <button class="big" data-go="stages"><span class="e">🚃</span><span><b>となりへ たび</b><small>となりの けんを タッチして ゴールまで すすもう</small></span></button>
    <button class="big" data-go="quiz"><span class="e">❓</span><span><b>となり クイズ</b><small>となりは どれ？ うみが ない けんは？ 10もん</small></span></button>
    <button class="big" data-go="zukan"><span class="e">📖</span><span><b>となり ずかん</b><small>けんを タッチすると となりが ひかるよ</small></span></button>
    <div class="stat" id="homeStat"></div>
  </section>

  <section class="screen" id="stages">
    <div class="seg" id="modeSeg">
      <button data-mode="easy">🌼 やさしい<small>となりが ひかる</small></button>
      <button data-mode="hard">🔥 むずかしい<small>ひからない</small></button>
    </div>
    <div id="stageGrid"></div>
  </section>

  <section class="screen" id="play">
    <div id="mapWrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <g id="gPref"></g><rect id="okiFrame"/><g id="gLink"></g><path id="rail" class="rail"/>
        <g id="gMk"></g><g id="gLbl"></g>
        <g id="flag" class="ov"><text>🚩</text></g>
        <g id="train" class="ov"><text>🚃</text></g>
      </svg>
      <button id="mini" aria-label="ちずの ひろさを かえる"><svg id="miniSvg"></svg><span class="lab" id="miniLab">ぜんたい</span></button>
      <div id="toast"></div>
    </div>
    <div id="panel"></div>
  </section>
</div>
<script src="map-data.js?v=e8f02ca"></script>
<script src="game.js?v=e8f02ca"></script>
</body>
</html>
