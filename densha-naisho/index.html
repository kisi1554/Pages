<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a1c">
<title>でんしゃの ないしょばなし</title>
<link rel="stylesheet" href="style.css?v=aabd249">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div id="defs"></div>

<!-- はじめの がめん -->
<section id="scTitle" class="screen title">
  <div class="title-sky" aria-hidden="true"></div>
  <p class="title-sub">よるの しゃこで、ほんものの でんしゃが</p>
  <h1 class="logo"><span>でんしゃの</span><span class="big">ないしょばなし</span></h1>
  <div id="titleTrain" class="title-train" aria-hidden="true"></div>
  <button id="btnStart" class="go" type="button">▶ しゃこへ いく</button>
  <button id="btnParent" class="link" type="button">⚙ おうちの ひとへ</button>
</section>

<!-- でんしゃを えらぶ -->
<section id="scDepot" class="screen depot" hidden>
  <header class="bar">
    <button id="btnHome" class="ic" type="button" aria-label="さいしょに もどる">🏠</button>
    <h2>だれと おはなし する?</h2>
    <span class="starcount">⭐ <b class="starN">0</b></span>
  </header>
  <div id="cards" class="cards"></div>
  <p class="depot-note">ライトが ついた でんしゃを タップ してね</p>
</section>

<!-- おはなし -->
<section id="scTalk" class="screen talk" hidden>
  <div class="stage" id="stage">
    <div id="sceneBox"></div>
    <div id="proj" hidden></div>
    <div class="hud">
      <button id="btnBack" class="ic" type="button" aria-label="しゃこに もどる">◀ しゃこ</button>
      <span class="starcount">⭐ <b class="starN">0</b></span>
      <button id="btnVoice" class="ic" type="button" aria-pressed="true" aria-label="こえ">🗣️</button>
      <button id="btnSfx" class="ic" type="button" aria-pressed="true" aria-label="おと">🔊</button>
    </div>
    <div id="flystar" aria-hidden="true">⭐</div>
  </div>
  <div class="panel" id="panel">
    <div class="who"><span id="whoName"></span><span id="whoSub"></span><span id="genreTag" hidden></span></div>
    <p id="line" aria-live="polite"></p>
    <div id="choices" class="choices"></div>
    <div class="foot">
      <button id="btnMic" class="mic" type="button" hidden>🎤 こえで こたえる</button>
      <button id="btnNext" class="next" type="button" hidden>つぎへ ▶</button>
    </div>
  </div>
</section>

<!-- おうちの ひとへ -->
<div id="parent" class="modal" hidden>
  <div class="sheet">
    <h3>おうちの ひとへ</h3>
    <label for="inName">こどもの よびかた</label>
    <input id="inName" type="text" maxlength="10" autocomplete="off" placeholder="あおちゃん">
    <p class="small">
      でんしゃが なまえを よんで はなしかけます。ことば・かず・かたち・しぜん・でんしゃの ひみつ の
      みじかい おはなしを して、おわるたびに よぞらに ほしが 1つ ふえます。まちがえても やりなおせて、
      げんてんは ありません。こえは たんまつの よみあげ・ききとり きのうを つかいます（アプリからは どこにも おくりません）。
    </p>
    <div class="row">
      <button id="btnReset" class="link danger" type="button">きろくを けす</button>
      <button id="btnClose" class="go small" type="button">とじる</button>
    </div>
  </div>
</div>

<script src="art.js?v=aabd249"></script>
<script src="audio.js?v=aabd249"></script>
<script src="core.js?v=aabd249"></script>

<script src="genre-himitsu.js?v=aabd249"></script>
<script src="app.js?v=aabd249"></script>
</body>
</html>
