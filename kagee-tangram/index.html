<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かげえ タングラム</title>
<style>
  :root {
    --bg: #fff7e6; --ink: #3a2f2a; --line: #e6d3b3; --main: #ff8a3d; --sub: #fff; --shadow: #2e2a3a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* ---------- えらぶ がめん ---------- */
  #menu { flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 28px max(14px, env(safe-area-inset-left)); }
  .mhead { display: flex; align-items: center; gap: 10px; }
  .mhead h1 { margin: 0; font-size: clamp(24px, 6vw, 36px); flex: 1; line-height: 1.2; }
  .lead { margin: 6px 0 2px; font-size: 17px; }
  .count { font-weight: bold; font-size: 17px; color: #b3541e; }
  .lvname { margin: 18px 0 8px; font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
  .lvname small { font-size: 14px; font-weight: normal; color: #7a6a5a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .pz { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-height: 124px; padding: 8px 4px 8px; border: 3px solid var(--line); border-radius: 18px; background: #fff;
    box-shadow: 0 4px 0 var(--line); }
  .pz:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .pz svg { width: 76px; height: 70px; }
  .pz .nm { font-size: 15px; font-weight: bold; line-height: 1.2; text-align: center; }
  .pz .star { position: absolute; top: 2px; right: 6px; font-size: 20px; }
  .pz.done { border-color: #ffd36b; box-shadow: 0 4px 0 #ffd36b; background: #fffbea; }

  .ibtn { width: 52px; height: 52px; flex: none; border: 3px solid var(--line); border-radius: 16px; background: #fff;
    font-size: 24px; line-height: 1; display: grid; place-items: center; box-shadow: 0 3px 0 var(--line); padding: 0; }
  .ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

  /* ---------- あそぶ がめん ---------- */
  #play { flex-direction: column; }
  .top { display: flex; align-items: center; gap: 8px; flex: none;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left)); }
  .top .ttl { flex: 1; min-width: 0; font-size: clamp(18px, 5vw, 26px); font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .ttl small { font-size: .62em; font-weight: normal; color: #7a6a5a; margin-left: 6px; }
  .wrap { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stage, #stage * { touch-action: none; }
  .bar { display: flex; gap: 8px; justify-content: center; flex: none;
    padding: 6px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  .tbtn { min-height: 54px; flex: 1 1 0; min-width: 0; max-width: 190px; border: 3px solid var(--line); border-radius: 16px; background: #fff;
    font-size: 16px; font-weight: bold; box-shadow: 0 3px 0 var(--line); padding: 4px 4px;
    display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .tbtn .ic { font-size: 22px; }
  .tbtn[hidden] { display: none; }
  #flipBtn { background: #e3f8fb; border-color: #9adbe5; box-shadow: 0 3px 0 #9adbe5; }
  @media (orientation: landscape) and (max-height: 520px) {
    #play.on { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); }
    .top { padding-bottom: 2px; min-width: 0; }
    .top .ttl small { display: none; }
    .bar { grid-column: 2; grid-row: 1; padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 2px 0; }
    .tbtn { flex: none; padding: 4px 10px; }
    .wrap { grid-column: 1 / 3; grid-row: 2; }
    .tbtn { min-height: 48px; font-size: 15px; }
    .ibtn { width: 48px; height: 48px; }
    #praise { padding: 4px; }
    #praise .box { padding: 8px 10px; border-radius: 18px; }
    #praise .big { font-size: 24px; }
    #praise .sm { font-size: 14px; margin: 2px 0 6px; }
    .gbtn { min-height: 46px; min-width: 84px; font-size: 16px; padding: 4px 10px; }
    .gbtn.go { font-size: 18px; min-width: 110px; }
  }
  @media (max-width: 420px) { .tbtn { font-size: 14px; } .tbtn .ic { font-size: 17px; } .bar { gap: 6px; } }
  @media (max-width: 340px) { .tbtn .ic { display: none; } }

  #tip { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); pointer-events: none;
    background: rgba(255,255,255,.92); border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px;
    font-size: 15px; font-weight: bold; white-space: nowrap; transition: opacity .4s; max-width: 96%; overflow: hidden; text-overflow: ellipsis; }
  #tip.off { opacity: 0; }

  .pc { cursor: grab; stroke: #fff; stroke-width: 2.5; stroke-linejoin: round; transition: fill .6s, stroke .6s; }
  .pc.drag { filter: drop-shadow(0 6px 5px rgba(0,0,0,.3)); cursor: grabbing; }
  .pc.wig { animation: wig .5s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
  @keyframes wig { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  #sil polygon { fill: var(--shadow); stroke: var(--shadow); stroke-width: 1.5; stroke-linejoin: round; }
  #lines polygon { fill: none; stroke: rgba(255,255,255,.6); stroke-width: 2; stroke-dasharray: 5 5; stroke-linejoin: round; }
  #sil, #lines { transition: opacity .6s; }
  #hint polygon { fill: rgba(255,224,74,.5); stroke: #ffd400; stroke-width: 4; stroke-linejoin: round; animation: blink .5s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes blink { from { opacity: .35; } to { opacity: 1; } }
  #trayBg { fill: #fff; stroke: var(--line); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; }
  .won #sil, .won #lines, .won #trayBg { opacity: 0; }
  .won .pc { cursor: default; }
  #deco { pointer-events: none; }

  /* できたときの うごき */
  #pcs { transform-box: fill-box; transform-origin: center; }
  #pcs.a-run   { animation: a-run 3.8s ease-in-out .7s infinite; }
  #pcs.a-runl  { animation: a-runl 3.8s ease-in-out .7s infinite; }
  #pcs.a-fly   { animation: a-fly 3.6s ease-in .7s infinite; }
  #pcs.a-bob   { animation: a-bob 2.4s ease-in-out .7s infinite; }
  #pcs.a-swim  { animation: a-swim 3.2s ease-in-out .7s infinite; }
  #pcs.a-hop   { animation: a-hop 1.1s ease-in-out .7s infinite; }
  #pcs.a-boing { animation: a-boing 1.2s ease-in-out .7s infinite; }
  #pcs.a-spin  { animation: a-spin 2.6s ease-in-out .7s infinite; }
  #pcs.a-flap  { animation: a-flap 1s ease-in-out .7s infinite; }
  @keyframes a-run { 0% { transform: translateX(0); } 12% { transform: translateX(calc(var(--W) * -0.03)); }
    50% { transform: translateX(var(--W)); } 50.01% { transform: translateX(calc(var(--W) * -1)); } 100% { transform: translateX(0); } }
  @keyframes a-runl { 0% { transform: translateX(0); } 12% { transform: translateX(calc(var(--W) * 0.03)); }
    50% { transform: translateX(calc(var(--W) * -1)); } 50.01% { transform: translateX(var(--W)); } 100% { transform: translateX(0); } }
  @keyframes a-fly { 0%, 8%, 16% { transform: translate(0, 0); } 4%, 12% { transform: translate(-4px, 0); } 6%, 14% { transform: translate(4px, 0); }
    55% { transform: translate(0, calc(var(--H) * -1)); } 55.01% { transform: translate(0, var(--H)); } 100% { transform: translate(0, 0); } }
  @keyframes a-bob { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(8px) rotate(5deg); } }
  @keyframes a-swim { 0%, 100% { transform: translateX(calc(var(--W) * -0.07)) rotate(-4deg); } 25% { transform: translateX(0) rotate(4deg); }
    50% { transform: translateX(calc(var(--W) * 0.07)) rotate(-4deg); } 75% { transform: translateX(0) rotate(4deg); } }
  @keyframes a-hop { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 45% { transform: translateY(calc(var(--H) * -0.09)) scale(.97, 1.04); } }
  @keyframes a-boing { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.1, .92); } 60% { transform: scale(.94, 1.08); } }
  @keyframes a-spin { 0%, 15% { transform: rotate(0); } 85%, 100% { transform: rotate(360deg); } }
  @keyframes a-flap { 0%, 100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-14px) scaleX(.55); } }

  /* ほめる パネル */
  #praise { position: absolute; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 10px; text-align: center; pointer-events: none; }
  #praise.on { display: flex; }
  #praise .box { pointer-events: auto; background: rgba(255,255,255,.95); border: 4px solid #ffd36b; border-radius: 24px; padding: 14px 16px;
    max-width: 100%; box-shadow: 0 6px 0 #f1c14f; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #praise .big { font-size: clamp(26px, 7vw, 40px); font-weight: bold; color: #e0562a; line-height: 1.2; }
  #praise .sm { font-size: 17px; font-weight: bold; margin: 4px 0 10px; }
  #praise .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .gbtn { min-height: 56px; min-width: 104px; border: 0; border-radius: 16px; padding: 6px 14px; font-size: 18px; font-weight: bold;
    background: #fff; border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); }
  .gbtn.go { background: var(--main); border-color: #e06a1c; box-shadow: 0 3px 0 #c95a12; color: #fff; font-size: 21px; min-width: 150px; }
  .gbtn:active { transform: translateY(2px); box-shadow: none; }
  #fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #fx span { position: absolute; top: -40px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>

<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->

  <div class="mhead">
    <h1>🧩 かげえ タングラム</h1>
    <button class="ibtn" id="sndBtnM" aria-label="おと">🔊</button>
  </div>
  <p class="lead">くろい かげの うえに いたを ならべて、かたちを つくろう！</p>
  <div class="count" id="count"></div>
  <div id="lists"></div>
</div>

<!-- あそぶ -->
<div id="play" class="screen">

  <div class="wrap" id="wrap">

      <rect id="trayBg" rx="22" ry="22"></rect>
      <g id="sil"></g>
      <g id="lines"></g>
      <g id="hint"></g>
      <g id="pcs"></g>
    </svg>
    <div id="tip" class="off"></div>
    <div id="praise">
      <div class="box">
        <div class="big" id="prBig"></div>
        <div class="sm" id="prSm"></div>
        <div class="btns">
          <button class="gbtn go" id="nextBtn">つぎへ ▶</button>
          <button class="gbtn" id="againBtn">もういちど</button>
          <button class="gbtn" id="listBtn">えらぶ</button>

    </div>
    <div id="fx"></div>

</div>

    const k = p.rot + dr; if (k % 2) continue;

    const bx = Math.round(Vt[0][0]), by = Math.round(Vt[0][1]), c = [];
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { const dx = bx + i - Vt[0][0], dy = by + j - Vt[0][1], d = Math.hypot(dx, dy); if (d <= tol) c.push({ dx, dy, d }); }
    c.sort((a, b) => a.d - b.d);
    for (const q of c) {
      const cov = cover(Vt.map(v => [Math.round(v[0] + q.dx), Math.round(v[1] + q.dy)])), key = cov.join(';');
      if (!allowed(p, cov, key)) continue;
      p.x += q.dx; p.y += q.dy; p.rot = k; p.snapped = true; p.cov = cov; p.key = key;
      return true;
    }
  }
  return false;
}
function unsnap(p) { p.snapped = false; p.cov = null; p.key = ''; }
function settle(p, quiet) { // おいた／まわした あと
  unsnap(p);
  const ok = trySnap(p);
  glide(p);
  if (ok) {
    gPcs.insertBefore(p.el, gPcs.firstChild); // はまった板は 下に
    SND.snap(); stopHint();
    if (pieces.every(o => o.snapped)) win();
  } else if (!quiet) SND.drop();
  return ok;
}

/* ゆびの そうさ */
function local(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
stage.addEventListener('pointerdown', e => {
  if (won || drag) return;
  const el = e.target.closest ? e.target.closest('.pc') : null; if (!el) return;
  e.preventDefault();
  const p = pieces[+el.dataset.i], w = local(e);
  drag = { p, id: e.pointerId, sx: w[0], sy: w[1], px: p.x, py: p.y, moved: false, t: performance.now() };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  gPcs.appendChild(p.el); p.el.classList.remove('wig');
  SND.pick();
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  const w = local(e), p = drag.p;
  if (!drag.moved) {
    if (Math.hypot(w[0] - drag.sx, w[1] - drag.sy) < 9) return;
    drag.moved = true; unsnap(p); p.el.classList.add('drag'); $('tip').classList.add('off');
  }
  const c0 = toW(drag.px, drag.py);
  const cx = Math.max(12, Math.min(V.W - 12, c0[0] + w[0] - drag.sx)), cy = Math.max(12, Math.min(V.H - 12, c0[1] + w[1] - drag.sy));
  const g = toG(cx, cy); p.x = g[0]; p.y = g[1]; p.tw = null; p.v.x = p.x; p.v.y = p.y; p.v.a = p.rot * 45; draw(p);
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const p = drag.p, moved = drag.moved; drag = null;
  try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
  p.el.classList.remove('drag');
  if (won) return;
  if (!moved && !cancel) { p.rot += 1; SND.rot(); settle(p, true); } // タップ = 45° まわす
  else settle(p);
}
stage.addEventListener('pointerup', e => endDrag(e, false));
stage.addEventListener('pointercancel', e => endDrag(e, true));
stage.addEventListener('contextmenu', e => e.preventDefault());

$('flipBtn').onclick = () => {
  if (won) return;
  const p = pieces.find(o => o.type === 'P'); if (!p) return;
  p.flip ^= 1; SND.flip(); gPcs.appendChild(p.el); p.v = { x: p.x, y: p.y, a: p.rot * 45 }; draw(p);
  p.el.classList.remove('wig'); void p.el.getBoundingClientRect(); p.el.classList.add('wig');
  settle(p, true);
};
$('resetBtn').onclick = () => {
  if (won) return;
  SND.btn(); stopHint();
  for (const p of pieces) { unsnap(p); p.x = p.home[0]; p.y = p.home[1]; glide(p); }
};
function stopHint() { clearTimeout(hintT); gHint.innerHTML = ''; for (const p of pieces) p.el && p.el.classList.remove('wig'); }
$('hintBtn').onclick = () => {
  if (won) return;
  stopHint();
  const filled = new Set(pieces.filter(p => p.snapped).map(p => p.key));
  const open = slots.filter(s => !filled.has(s.key)); if (!open.length) return;
  // まだ はまっていない板が ある しゅるいを えらぶ
  const s = open.find(s => pieces.some(p => !p.snapped && p.type === s.type)) || open[0];
  const el = mk('polygon', gHint); el.setAttribute('points', pts(s.poly));
  const p = pieces.find(p => !p.snapped && p.type === s.type);
  if (p) { gPcs.appendChild(p.el); void p.el.getBoundingClientRect(); p.el.classList.add('wig'); }
  SND.hint(); showTip('ひかっている ところに、ゆれている いたを おこう', 4000);
  hintT = setTimeout(stopHint, 4000);
};

/* できた！ */
function mix(hex, f) { // f>0 しろく / f<0 くろく
  const n = parseInt(hex.slice(1), 16), t = f > 0 ? 255 : 0, a = Math.abs(f);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (t - v) * a).toString(16).padStart(2, '0')).join('');
}
function drawDeco() {
  const old = $('deco'); if (old) old.remove();
  if (!PZ.d) return;
  const g = mk('g', gPcs); g.id = 'deco';
  for (const [x, y, r, k] of PZ.d) {
    const w = toW(x, y), R = r * V.u;
    const c = mk('circle', g); c.setAttribute('cx', w[0]); c.setAttribute('cy', w[1]); c.setAttribute('r', R);
    const c2 = mk('circle', g); c2.setAttribute('cx', w[0]); c2.setAttribute('cy', w[1]);
    if (k === 'e') { c.setAttribute('fill', '#fff'); c2.setAttribute('r', R * 0.55); c2.setAttribute('fill', '#222'); }
    else if (k === 'w') { c.setAttribute('fill', '#333'); c2.setAttribute('r', R * 0.4); c2.setAttribute('fill', '#bbb'); }
    else { c.setAttribute('fill', '#fff7c2'); c.setAttribute('stroke', 'rgba(0,0,0,.25)'); c.setAttribute('stroke-width', 2); c2.remove(); }
  }
}
const PRAISE = ['できたね！', 'すごい！', 'やったー！', 'ぴったり！', 'じょうず！', 'かんぺき！'];
function win() {
  won = true; stopHint(); $('tip').classList.add('off');
  save.done[PZ.n] = 1; store();
  setTimeout(() => {
    SND.win();
    $('wrap').classList.add('won');
    pieces.forEach((p, i) => { const col = mix(PZ.c, [0, 0.22, -0.12, 0.34, -0.2, 0.12, 0.28][i % 7]); p.el.setAttribute('fill', col); p.el.style.stroke = mix(PZ.c, 0.5); });
    drawDeco();
    gPcs.setAttribute('class', 'a-' + PZ.a);
    $('prBig').textContent = '🎉 ' + PRAISE[Math.floor(Math.random() * PRAISE.length)];
    const last = PI === PUZZLES.length - 1, all = PUZZLES.every(p => save.done[p.n]);
    $('prSm').textContent = all ? '🏆 ぜんぶの かげえが できたよ！' : `「${PZ.n}」が うごきだした！`;
    $('nextBtn').textContent = last ? 'えらぶ ▶' : 'つぎへ ▶'; $('listBtn').hidden = last;
    $('praise').classList.add('on');
    confetti();
  }, 350);
}
function confetti() {
  const fx = $('fx'), em = ['⭐', '🎉', '✨', '🌟', '🎊', '💮'];
  fx.innerHTML = '';
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span'); s.textContent = em[i % em.length];
    s.style.left = Math.random() * 96 + '%'; s.style.fontSize = 18 + Math.random() * 22 + 'px';
    s.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; s.style.animationDelay = Math.random() * 0.8 + 's';
    fx.appendChild(s);
  }
  setTimeout(() => { if (won) fx.innerHTML = ''; }, 4600);
}
$('nextBtn').onclick = () => { SND.btn(); if (PI === PUZZLES.length - 1) goMenu(); else startPuzzle(PI + 1); };
$('againBtn').onclick = () => { SND.btn(); startPuzzle(PI); };
$('listBtn').onclick = () => { SND.btn(); goMenu(); };
$('backBtn').onclick = () => { SND.btn(); goMenu(); };

let rz = 0;
function onResize() { clearTimeout(rz); rz = setTimeout(() => { if ($('play').classList.contains('on')) { drag = null; layout(false); } }, 80); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

sndIcon(); buildMenu();
</script>
