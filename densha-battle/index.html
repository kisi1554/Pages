<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<title>でんしゃバトル 〜勇者と やさい四天王の クイズバトル〜</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚄</text></svg>">
</head>
<body>

<!-- がめんの ゆれる はんい。ここに ぜんぶの がめんが はいる -->
<div class="shaker" id="shaker">

  <!-- ============================ タイトル ============================ -->
  <section class="screen is-active" id="screen-title">
    <div class="title-rail" aria-hidden="true"></div>
    <h1 class="title">
      <span class="title-main">でんしゃバトル</span>
      <span class="title-sub">〜 でんしゃの 勇者たちよ、クイズで やさい四天王を たおせ 〜</span>
    </h1>
    <div class="title-trains" aria-hidden="true">🚃⚔️🔮💥🎃🥬</div>
    <p class="title-lead">
      クイズに せいかいするたび<br>
      とまらずに ズドドドン!と こうげき。<br>
      <b>路線の 勇者</b>を えらんで<br>
      <b>さんすう / かんじ / にほんちず</b> の クイズで<br>
      <b>やさい四天王</b>と<b>大魔王</b>を たおそう!
    </p>
    <button class="big-btn" id="btn-start" type="button">▶ はじめる</button>
    <p class="title-note">おとが なります。ボリュームに ちゅうい してね。</p>
  </section>

  <!-- ========================== ジャンルえらび ========================== -->
  <section class="screen" id="screen-genre">
    <h2 class="head">なにで たたかう?</h2>
    <p class="head-sub">もんだいの しゅるいを えらんでね</p>
    <div class="genre-list" id="genre-list"></div>
    <button class="back-btn" data-back="screen-title" type="button">← もどる</button>
  </section>

  <!-- ========================== レベルえらび ========================== -->
  <section class="screen" id="screen-level">
    <h2 class="head">レベルを えらんでね</h2>
    <p class="head-sub" id="level-sub"></p>
    <div class="level-list" id="level-list"></div>
    <button class="back-btn" data-back="screen-genre" type="button">← もどる</button>
  </section>

  <!-- ========================== キャラえらび ========================== -->
  <section class="screen" id="screen-select">
    <h2 class="head">勇者を えらんでね</h2>
    <p class="head-sub" id="select-sub"></p>
    <div class="char-list" id="char-list"></div>
    <button class="back-btn" data-back="screen-level" type="button">← もどる</button>
  </section>

  <!-- ============================ バトル ============================ -->
  <section class="screen screen-battle" id="screen-battle">

    <header class="hud">
      <span class="wave-chip" id="wave-chip">ウェーブ 1 / 10</span>
      <span class="score-chip"><b id="score-num">0</b>てん</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-bgm" type="button" title="おんがく">🎵</button>
      <button class="icon-btn" id="btn-voice" type="button" title="よみあげ">🔊</button>
      <button class="icon-btn" id="btn-home" type="button" title="やめる">🏠</button>
    </header>

    <div class="arena" id="arena">
      <div class="arena-bg" aria-hidden="true">
        <span class="sun"></span>
        <span class="cloud c1">☁️</span>
        <span class="cloud c2">☁️</span>
        <span class="cloud c3">☁️</span>
        <span class="hills"></span>
        <span class="city"></span>
        <span class="ground"></span>
      </div>

      <!-- ボス戦の ときだけ でる なまえと HPバー -->
      <div class="boss-plate" id="boss-plate" hidden>
        <span class="bp-head">
          <b class="bp-title" id="bp-title"></b>
          <b class="bp-name" id="bp-name"></b>
        </span>
        <span class="bp-bar"><i id="bp-fill"></i></span>
        <span class="bp-phase" id="bp-phase"></span>
      </div>

      <div class="field" id="field">
        <div class="hero-slot" id="player-slot"></div>
        <div class="mon-row" id="mon-row"></div>
      </div>

      <div class="player-hp" id="player-hp">
        <span class="hp-name">
          <small class="hp-line" id="player-line"></small>
          <span class="hp-who"><b id="player-name">ゆうしゃ</b><small id="player-tag"></small></span>
        </span>
        <span class="hp-bar is-mine"><i id="player-hp-fill"></i></span>
        <span class="hp-num" id="player-hp-num">0</span>
      </div>
    </div>

    <div class="panel">
      <div class="gauge-row">
        <span class="gauge-label">ひっさつ</span>
        <div class="gauge"><i id="gauge-fill"></i></div>
        <span class="combo" id="combo-chip">0れんぞく</span>
      </div>

      <div class="timer" title="はやく こたえると クリティカル"><i id="timer-fill"></i></div>

      <div class="question" id="question">よういするよ…</div>
      <div class="hint" id="hint" aria-hidden="true"></div>
      <div class="choices" id="choices"></div>
      <div class="verdict" id="verdict"></div>
    </div>
  </section>

  <!-- ============================ けっか ============================ -->
  <section class="screen" id="screen-result">
    <h2 class="head" id="result-title">けっか</h2>
    <div class="result-hero" id="result-train"></div>
    <p class="result-msg" id="result-msg"></p>
    <div class="result-stats" id="result-stats"></div>
    <button class="big-btn" id="btn-again" type="button">▶ もういちど</button>
    <button class="back-btn" data-back="screen-title" type="button">← タイトルへ</button>
  </section>

</div><!-- /.shaker -->

<!-- えんしゅつ よう(いちばん うえ) -->
<canvas class="fx-canvas" id="fx-canvas" aria-hidden="true"></canvas>
<div class="fx-layer" id="fx-layer" aria-hidden="true"></div>

<script src="data.js"></script>
<script src="data-eki.js"></script>
<script src="data-chizu.js"></script>
<script src="quiz.js"></script>
<script src="audio.js"></script>
<script src="effects.js"></script>
<script src="game.js"></script>
</body>
</html>
