<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>はなしが長いブルくん</title>
<meta name="description" content="ブルーラインの ブルくんが、おはなしの ひきだしから いろんな まめちしきを ながーく はなしてくれる アプリ">
<style>
  :root {
    --blue: #1f5fbf;
    --blue-d: #143f86;
    --blue-l: #e6effc;
    --wood: #c98a4b;
    --wood-d: #8f5a2a;
    --wood-l: #f3dcbc;
    --ink: #22324a;
    --paper: #fffdf7;
    --ok: #2f9e44;
    --ng: #e8590c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(#d9ecff, #f4f9ff 40%, #fff8ec);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; }
  ruby rt { font-size: .45em; }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 8px max(12px, env(safe-area-inset-left)) 8px max(12px, env(safe-area-inset-right));
    background: var(--blue); color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { flex: 1; margin: 0; font-size: clamp(18px, 4.6vw, 26px); letter-spacing: .04em; line-height: 1.3; }
  .hbtn {
    min-width: 48px; height: 48px; border-radius: 14px; padding: 0 10px;
    background: rgba(255,255,255,.18); color: #fff; font-size: 22px; font-weight: bold;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  .hbtn small { font-size: 13px; }
  .hbtn.off { opacity: .55; }
  .hbtn:active { transform: scale(.94); }

  main { max-width: 980px; margin: 0 auto; padding: 12px 14px 40px; }
  .screen { display: none; }
  .screen.on { display: block; }

  /* ===== ブルくん ===== */
  .buru-wrap { display: flex; justify-content: center; }
  .buru { width: min(46vw, 210px); height: auto; overflow: visible; }
  .buru .body { transform-origin: 100px 210px; }
  .buru.talking .body { animation: bounce .32s ease-in-out infinite alternate; }
  .buru .mouth-open { display: none; }
  .buru.talking .mouth-open { display: block; animation: mouth .18s steps(2) infinite; }
  .buru.talking .mouth-smile { display: none; }
  .buru .lids { transform-origin: 100px 78px; transform: scaleY(0); animation: blink 4.5s infinite; }
  .buru.happy .eye-n { display: none; }
  .buru .eye-h { display: none; }
  .buru.happy .eye-h { display: block; }
  @keyframes bounce { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-5px) rotate(1deg); } }
  @keyframes mouth { 0% { transform: scaleY(1); } 100% { transform: scaleY(.45); } }
  .buru .mouth-open { transform-origin: 100px 152px; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 96%, 98% { transform: scaleY(1); } }

  .bubble {
    position: relative; background: #fff; border: 4px solid var(--blue);
    border-radius: 24px; padding: 16px 18px; margin: 14px 0 12px;
    font-size: clamp(20px, 5.2vw, 28px); line-height: 1.7; font-weight: bold;
    min-height: 3.6em; box-shadow: 0 4px 0 var(--blue-d);
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .bubble::before {
    content: ""; position: absolute; top: -18px; left: 50%; margin-left: -14px;
    border: 14px solid transparent; border-bottom-color: var(--blue); border-top: 0;
  }
  .bubble::after {
    content: ""; position: absolute; top: -11px; left: 50%; margin-left: -10px;
    border: 10px solid transparent; border-bottom-color: #fff; border-top: 0;
  }
  .bubble .name { display: block; font-size: .62em; color: var(--blue); margin-bottom: 2px; }
  .bubble .tap { position: absolute; right: 14px; bottom: 6px; font-size: 14px; color: #8aa; }

  /* ===== ホーム ===== */
  .stats {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 12px;
  }
  .pill {
    background: #fff; border: 3px solid var(--blue-l); border-radius: 999px;
    padding: 6px 14px; font-weight: bold; font-size: 16px;
  }
  .pill b { color: var(--blue); font-size: 20px; }
  .meter { height: 14px; background: #fff; border-radius: 999px; overflow: hidden; border: 2px solid var(--blue-l); margin: 0 auto 14px; max-width: 520px; }
  .meter > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4dabf7, var(--blue)); transition: width .6s; }

  .tansu {
    background: var(--wood); border: 6px solid var(--wood-d); border-radius: 18px;
    padding: 12px; box-shadow: 0 8px 0 var(--wood-d), inset 0 0 0 3px rgba(255,255,255,.15);
  }
  .tansu-top {
    text-align: center; color: #fff; font-weight: bold; font-size: 18px; margin: -2px 0 10px;
    text-shadow: 0 2px 0 var(--wood-d);
  }
  .drawers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .drawers { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 880px) { .drawers { grid-template-columns: repeat(4, 1fr); } }
  .drawer {
    position: relative; min-height: 104px; border-radius: 12px;
    background: linear-gradient(#f6e2c4, var(--wood-l));
    border: 3px solid var(--wood-d); box-shadow: 0 5px 0 var(--wood-d);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 6px 14px; text-align: center; transition: transform .1s;
  }
  .drawer:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-d); }
  .drawer .em { font-size: 38px; line-height: 1.1; }
  .drawer .lb { font-weight: bold; font-size: 19px; margin-top: 2px; }
  .drawer .knob {
    position: absolute; bottom: 5px; left: 50%; width: 34px; height: 7px; margin-left: -17px;
    background: var(--wood-d); border-radius: 4px;
  }
  .drawer .stars { position: absolute; top: 4px; right: 7px; font-size: 13px; font-weight: bold; color: var(--wood-d); }
  .drawer.done { background: linear-gradient(#fff4c2, #ffe58a); }
  .drawer.done .stars { color: #b8860b; }
  .drawer.open-anim { animation: pull .35s ease-out; }
  @keyframes pull { 0% { transform: scale(1); } 50% { transform: scale(1.08) translateY(6px); } 100% { transform: scale(1); } }

  .bigrow { display: flex; gap: 10px; margin: 16px 0 0; }
  .bigbtn {
    flex: 1; min-height: 64px; border-radius: 18px; font-size: 21px; font-weight: bold;
    background: var(--blue); color: #fff; box-shadow: 0 5px 0 var(--blue-d);
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px;
  }
  .bigbtn.sub { background: #fff; color: var(--blue); border: 3px solid var(--blue); box-shadow: 0 5px 0 var(--blue-l); }
  .bigbtn.warm { background: #f59f00; box-shadow: 0 5px 0 #b87400; }
  .bigbtn.green { background: var(--ok); box-shadow: 0 5px 0 #237032; }
  .bigbtn:active { transform: translateY(4px); box-shadow: none; }
  .bigbtn[hidden] { display: none; }
  .bigbtn.small { font-size: 17px; min-height: 54px; }

  /* ===== おはなし ===== */
  .story-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .story-head .tag {
    background: var(--wood-l); border: 3px solid var(--wood-d); border-radius: 999px;
    padding: 4px 12px; font-weight: bold; font-size: 16px;
  }
  .story-head .ttl { font-weight: bold; font-size: clamp(17px, 4.4vw, 22px); flex: 1; }
  .dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 6px 0 0; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; background: #cfdcef; display: block; }
  .dots i.on { background: var(--blue); }
  .dots i.q { background: #ffd43b; }
  .dots i.q.on { background: #f59f00; }

  .controls { display: grid; gap: 10px; }
  .controls .row { display: flex; gap: 10px; }
  .controls .bigbtn.next { flex: 2; font-size: 24px; min-height: 76px; }
  .choice {
    min-height: 66px; border-radius: 16px; font-size: 21px; font-weight: bold;
    background: #fff; border: 4px solid var(--blue); box-shadow: 0 5px 0 var(--blue-l);
    padding: 8px 12px;
  }
  .choice:active { transform: translateY(4px); box-shadow: none; }
  .choice.right { background: #d3f9d8; border-color: var(--ok); }
  .choice.wrong { background: #ffe8cc; border-color: var(--ng); opacity: .8; }
  .choice:disabled { cursor: default; }

  .auto { display: flex; justify-content: center; margin-top: 12px; }
  .auto button {
    min-height: 48px; padding: 6px 16px; border-radius: 999px; font-weight: bold; font-size: 17px;
    background: #fff; border: 3px solid #cfdcef;
  }
  .auto button.on { border-color: var(--blue); background: var(--blue-l); color: var(--blue); }

  @media (orientation: landscape) and (min-width: 760px) {
    #story .stage { display: grid; grid-template-columns: 230px 1fr; gap: 18px; align-items: center; }
    #story .buru { width: 220px; }
    #story .bubble { margin: 0; }
    #story .bubble::before { top: 50%; left: -18px; margin: -14px 0 0; border: 14px solid transparent; border-right-color: var(--blue); border-left: 0; }
    #story .bubble::after { top: 50%; left: -11px; margin: -10px 0 0; border: 10px solid transparent; border-right-color: #fff; border-left: 0; }
    #home .hero { display: grid; grid-template-columns: 200px 1fr; gap: 18px; align-items: center; }
    #home .hero .bubble { margin: 0; }
    #home .hero .bubble::before { top: 50%; left: -18px; margin: -14px 0 0; border: 14px solid transparent; border-right-color: var(--blue); border-left: 0; }
    #home .hero .bubble::after { top: 50%; left: -11px; margin: -10px 0 0; border: 10px solid transparent; border-right-color: #fff; border-left: 0; }
  }

  /* ===== カード ===== */
  .getcard {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(20,40,80,.45);
  }
  .getcard.on { display: flex; }
  .card {
    width: min(78vw, 300px); background: var(--paper); border-radius: 20px; border: 6px solid #f59f00;
    padding: 18px 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .card .ce { font-size: 72px; line-height: 1.1; }
  .card .ct { font-size: 22px; font-weight: bold; margin: 6px 0; }
  .card .cs { font-size: 17px; line-height: 1.6; }
  .card .cg { color: #e67700; font-weight: bold; font-size: 20px; margin-bottom: 4px; }
  @keyframes pop { from { transform: scale(.3) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ===== ずかん ===== */
  .zk-group { margin: 14px 0; }
  .zk-group h3 { margin: 0 0 8px; font-size: 19px; display: flex; gap: 6px; align-items: center; }
  .zk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .zk-grid { grid-template-columns: repeat(4, 1fr); } }
  .zk {
    min-height: 96px; border-radius: 14px; background: #fff; border: 3px solid #f59f00;
    padding: 8px 6px; text-align: center; font-weight: bold; font-size: 15px; line-height: 1.4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .zk .e { font-size: 34px; }
  .zk.heard { border-color: #a5c8f0; }
  .zk.lock { background: #edf1f7; border-color: #d0d8e4; color: #8a97a8; }
  .zk:active { transform: scale(.96); }
  .note { font-size: 15px; color: #5a6b80; text-align: center; margin: 8px 0; line-height: 1.6; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>

<script>
"use strict";
/* ============================================================
   おはなしの データ
   d: ひきだし / t: だいめい / e: えもじ / l: おはなし / s: まとめ
   q: [しつもん, [せいかい, はずれ, はずれ]] / n: 「そういえば」で つぎに はなしたくなる おはなし
   ============================================================ */
const DRAWERS = [
  { id: "blue", e: "🚇", t: "ブルーライン" },
  { id: "densha", e: "🚃", t: "でんしゃ" },
  { id: "uchu", e: "🪐", t: "うちゅう" },
  { id: "ikimono", e: "🦒", t: "いきもの" },
  { id: "karada", e: "💪", t: "からだ" },

    tone(880, 0.15, "triangle", 0.1, 0.32);
  },
  ok() { [784, 988, 1319].forEach((f, i) => tone(f, 0.22, "triangle", 0.14, i * 0.11)); },
  ng() { tone(330, 0.18, "sine", 0.12); tone(262, 0.3, "sine", 0.12, 0.16); },
  card() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, "triangle", 0.12, i * 0.08)); },
  hmm() { tone(392, 0.12, "triangle", 0.1); tone(523, 0.18, "triangle", 0.1, 0.12); },
};

let voice = null;
function pickVoice() {
  try {
    const vs = window.speechSynthesis.getVoices() || [];
    const ja = vs.filter(v => /^ja/i.test(v.lang));
    voice = ja.find(v => /kyoko|otoya|google|nanami|keita/i.test(v.name)) || ja[0] || null;
  } catch (e) {}
}
if (window.speechSynthesis) {
  pickVoice();
  try { window.speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
}
function speakText(s) {
  return s.replace(/B(\d)(\d)/g, (m, a, b) => "ビー" + (a === "0" ? "" : a) + b)
          .replace(/[「」]/g, "").replace(/\s+/g, " ");
}

/* ============================================================
   しゃべる（ふきだし・くち・よみあげ）
   ============================================================ */
let typing = null, talkTimer = null, utterGen = 0, onSpoken = null;
function setTalking(svg, on) { svg.classList.toggle("talking", on); }

function say(el, svg, text, done) {
  // ふきだしに 1もじずつ だす ＋ よみあげ。おわったら done
  clearInterval(typing); clearTimeout(talkTimer);
  const gen = ++utterGen;
  onSpoken = null;
  el.textContent = "";
  let i = 0;
  const chars = Array.from(text);
  typing = setInterval(() => {
    i += 2; el.textContent = chars.slice(0, i).join("");
    if (i >= chars.length) { clearInterval(typing); typing = null; el.textContent = text; }
  }, 35);
  setTalking(svg, true);
  let finished = false;
  const finish = () => {
    if (finished || gen !== utterGen) return;
    finished = true; setTalking(svg, false);
    if (done) done();
  };
  const synth = window.speechSynthesis;
  if (save.sound && synth) {
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(speakText(text));
      u.lang = "ja-JP"; if (voice) u.voice = voice;
      u.rate = 1.0; u.pitch = 1.25;
      u.onend = finish; u.onerror = finish;
      synth.speak(u);
      // よみあげが うごかない ブラウザ むけの ほけん
      talkTimer = setTimeout(finish, chars.length * 220 + 3000);
      return;
    } catch (e) {}
  }
  talkTimer = setTimeout(finish, Math.min(6000, chars.length * 70 + 900));
}
function hush() {
  utterGen++;
  clearInterval(typing); clearTimeout(talkTimer);
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
  document.querySelectorAll(".buru").forEach(s => s.classList.remove("talking"));
}

/* ============================================================
   がめん きりかえ
   ============================================================ */
const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function btn(label, cls, fn) {
  const b = document.createElement("button");
  b.className = cls; b.innerHTML = label;
  b.addEventListener("click", () => { sfx.tap(); fn(b); });
  return b;
}

/* ===== ホーム ===== */
const GREET = [
  "ぼく ブルくん！ おはなしの ひきだしが いーっぱい あるんだ。どれから きく？",
  "やあ！ きょうは どの ひきだしを あけようかな〜。ぜんぶ はなすと よるに なっちゃう かも！",
  "ブルくん だよ。ぼく、はなしが ちょっと ながいって いわれるんだ。…ちょっと だけ だよ？",
  "ひきだしを タップしてね。ぼくの とっておきの おはなしを きかせて あげる！",
];
function heardCount() { return STORIES.filter(s => save.heard[s.id]).length; }
function cardCount() { return STORIES.filter(s => save.cards[s.id]).length; }

function renderHome(greet) {
  $("stHeard").textContent = heardCount();
  $("stTotal").textContent = STORIES.length;
  $("stCards").textContent = cardCount();
  $("stLines").textContent = save.lines;
  $("meter").style.width = (cardCount() / STORIES.length * 100) + "%";
  const box = $("drawers"); box.innerHTML = "";
  DRAWERS.forEach(d => {
    const list = STORIES.filter(s => s.d === d.id);
    const got = list.filter(s => save.cards[s.id]).length;
    const b = document.createElement("button");
    b.className = "drawer" + (got === list.length ? " done" : "");
    b.innerHTML = `<span class="stars">${"★".repeat(got)}${"☆".repeat(list.length - got)}</span>
      <span class="em" aria-hidden="true">${d.e}</span><span class="lb">${d.t}</span><span class="knob"></span>`;
    b.setAttribute("aria-label", d.t + " の ひきだし");
    b.addEventListener("click", () => { b.classList.add("open-anim"); sfx.drawer(); setTimeout(() => openDrawer(d.id), 220); });
    box.appendChild(b);
  });
  if (greet !== false) {
    let msg = pick(GREET);
    if (cardCount() === STORIES.length) msg = "すごい！ ぼくの カード、ぜんぶ あつめたね！ もう はかせ だよ。でも まだまだ はなしたい ことが あるんだけどね〜。";
    say($("homeText"), $("buruHome"), msg);
  }
}

/* ===== ひきだしの なか ===== */
let curDrawer = null;
function openDrawer(did) {
  hush();
  curDrawer = did;
  const d = DRAWER_BY_ID[did];
  $("drawerTitle").textContent = d.e + " " + d.t + " の ひきだし";
  const list = $("drawerList"); list.innerHTML = "";
  STORIES.filter(s => s.d === did).forEach(s => {
    const mark = save.cards[s.id] ? " 🃏" : (save.heard[s.id] ? " ✔︎" : "");
    list.appendChild(btn(`<span aria-hidden="true">${s.e}</span> ${s.t}${mark}`, "bigbtn sub", () => startStory(s.id)));
  });
  show("drawer");
  say($("drawerText"), $("buruHome"), pick([
    `${d.t}の ひきだしには、こんな おはなしが はいってるよ。どれに する？`,
    `ガラガラ〜。${d.t}の おはなし、ぜんぶ おもしろいんだ。どれから いく？`,
  ]));
}

/* ===== おはなし ===== */
let cur = null; // { s, idx, phase }
const FILLER = ["それでね、", "えっとね、", "それでそれで、", "でね、"];

function startStory(id, viaSoiieba) {
  hush();
  const s = BY_ID[id];
  cur = { s, idx: -1, phase: "intro" };
  $("stTag").textContent = DRAWER_BY_ID[s.d].e + " " + DRAWER_BY_ID[s.d].t;
  $("stTitle").textContent = s.t;
  show("story");
  renderDots();
  const open = viaSoiieba
    ? `よーし！ じゃあ 「${s.t}」の おはなし、いくよ！`
    : pick([`ひきだし オープン！ きょうは 「${s.t}」の おはなし だよ。`,
            `「${s.t}」だね。これは ながく なるよ〜。じゅんびは いい？`,
            `おっ、「${s.t}」を えらんだね。ぼくの だいすきな おはなしなんだ！`]);
  talk(open, "talk");
}

function renderDots() {
  const box = $("dots"); box.innerHTML = "";
  if (!cur) return;
  for (let i = 0; i < cur.s.l.length; i++) {
    const d = document.createElement("i");
    if (i <= cur.idx || cur.phase !== "talk" && cur.phase !== "intro") d.className = "on";
    box.appendChild(d);
  }
  const q = document.createElement("i");
  q.className = "q" + (["result", "nori"].includes(cur.phase) ? " on" : "");
  box.appendChild(q);
}

function talk(text, phase) {
  cur.phase = phase;
  renderControls();
  renderDots();
  $("tapHint").textContent = "";
  say($("text"), $("buru"), text, () => {
    if (save.auto && cur && cur.phase === phase && (phase === "talk" || phase === "sum")) {
      setTimeout(() => { if (cur && cur.phase === phase && save.auto && $("story").classList.contains("on")) next(); }, 700);
    }
  });
}

function next() {
  if (!cur) return;
  const s = cur.s;
  if (cur.phase === "talk" || cur.phase === "intro") {
    cur.idx++;
    if (cur.idx < s.l.length) {
      let line = s.l[cur.idx];
      if (cur.idx > 0 && Math.random() < 0.3 && !/^(それ|でも|でね|だから|あっ|あ、|ちなみに|じつは)/.test(line)) line = pick(FILLER) + line;
      save.lines++; persist();
      talk(line, "talk");
    } else {
      markHeard();
      talk(pick(["…というわけで、", "つまり、まとめると、", "ふう、いっぱい はなしちゃった。まとめると、"]) + s.s, "sum");
    }
  } else if (cur.phase === "sum") {
    quiz();
  } else if (cur.phase === "result") {
    soiieba();
  }
}

function markHeard() { save.heard[cur.s.id] = true; persist(); }

function shorten() {
  sfx.hmm();
  markHeard();
  cur.idx = cur.s.l.length;
  talk(pick([
    "えーっ！ ここからが いいところ なのに〜。…しょうがないなあ。ひとことで いうとね、",
    "みじかく？ ぼくに それを いう？ …わかったよ、がんばる。つまりね、",
    "うう、はなしたい ことが まだ 100こ くらい あるのに〜。ぎゅっと すると、",
  ]) + cur.s.s, "sum");
}

function again() {
  if (cur.phase === "talk" && cur.idx >= 0) talk(cur.s.l[cur.idx], "talk");
  else if (cur.phase === "sum") talk(cur.s.s, "sum");
}

function quiz() {
  const [q, ans] = cur.s.q;
  cur.choices = shuffle(ans);
  cur.answer = ans[0];
  talk("おぼえてる かな？ " + q, "quiz");
}

function answer(b, c) {
  const right = c === cur.answer;
  $("controls").querySelectorAll(".choice").forEach(x => {
    x.disabled = true;
    if (x.dataset.c === cur.answer) x.classList.add("right");
    else if (x === b) x.classList.add("wrong");
  });
  if (right) {
    sfx.ok();
    $("buru").classList.add("happy");
    const first = !save.cards[cur.s.id];
    save.cards[cur.s.id] = true; persist();
    setTimeout(() => {
      $("buru").classList.remove("happy");
      if (first) showCard(cur.s);
      talk(pick(["せいかい！ ちゃんと きいてて くれたんだね。うれしい！", "ピンポーン！ すごい すごい！", "だいせいかい！ もう ブルくん はかせ だね！"])
        + (first ? ` 「${cur.s.t}」の カードを あげる！` : ""), "result");
    }, 700);
  } else {
    sfx.ng();
    setTimeout(() => talk(`おしい！ こたえは 「${cur.answer}」 だよ。もういちど きけば きっと おぼえられるよ！`, "result"), 700);
  }
}

function soiieba() {
  const nx = BY_ID[cur.s.n];
  cur.next = nx;
  talk(pick([
    `あっ、そういえば！ 「${nx.t}」の はなしも あるんだけど… きく？ きくよね？`,
    `それで おもいだした！ 「${nx.t}」って しってる？ はなしても いい？`,
    `ねえねえ、まだ じかん ある？ 「${nx.t}」の はなしも したいんだけど…`,
  ]), "nori");
}

function renderControls() {
  const box = $("controls"); box.innerHTML = "";
  const p = cur.phase;
  if (p === "intro" || p === "talk") {
    box.appendChild(btn("つぎ ▶", "bigbtn next", next));
    const row = document.createElement("div"); row.className = "row";
    row.appendChild(btn("✂️ みじかく！", "bigbtn sub small", shorten));
    if (p === "talk" && cur.idx >= 0) row.appendChild(btn("🔁 もういちど", "bigbtn sub small", again));
    box.appendChild(row);
  } else if (p === "sum") {
    const row = document.createElement("div"); row.className = "row";
    row.appendChild(btn("🔁 もういちど", "bigbtn sub small", again));
    row.appendChild(btn("クイズ ▶", "bigbtn next warm", next));
    box.appendChild(row);
  } else if (p === "quiz") {
    cur.choices.forEach(c => {
      const b = btn(c, "choice", el => answer(el, c));
      b.dataset.c = c;
      box.appendChild(b);
    });
  } else if (p === "result") {
    box.appendChild(btn("つぎ ▶", "bigbtn next", next));
  } else if (p === "nori") {
    const row = document.createElement("div"); row.className = "row";
    row.appendChild(btn("🗄️ ひきだしに<br>もどる", "bigbtn sub", goBack));
    row.appendChild(btn(`きく！ ${cur.next.e}`, "bigbtn next green", () => startStory(cur.next.id, true)));
    box.appendChild(row);
  }
}

function goBack() {
  hush();
  const did = cur ? cur.s.d : curDrawer;
  cur = null;
  renderHome(false);
  if (did) openDrawer(did); else { show("home"); renderHome(); }
}

/* ===== カード ===== */
function showCard(s) {
  sfx.card();
  $("cardBox").innerHTML = `<div class="cg">🃏 カード ゲット！</div><div class="ce">${s.e}</div>
    <div class="ct">${s.t}</div><div class="cs">${s.s}</div>`;
  $("getcard").classList.add("on");
  setTimeout(() => $("getcard").classList.remove("on"), 2600);
}
$("getcard").addEventListener("click", () => $("getcard").classList.remove("on"));

/* ===== ずかん ===== */
function openZukan() {
  hush();
  const box = $("zukanList"); box.innerHTML = "";
  DRAWERS.forEach(d => {
    const g = document.createElement("div"); g.className = "zk-group";
    g.innerHTML = `<h3><span aria-hidden="true">${d.e}</span>${d.t}</h3>`;
    const grid = document.createElement("div"); grid.className = "zk-grid";
    STORIES.filter(s => s.d === d.id).forEach(s => {
      const got = save.cards[s.id], heard = save.heard[s.id];
      const b = document.createElement("button");
      b.className = "zk" + (got ? "" : heard ? " heard" : " lock");
      b.innerHTML = got ? `<span class="e">${s.e}</span>${s.t}`
        : heard ? `<span class="e">❔</span>${s.t}<small>クイズに せいかいで ゲット</small>`
        : `<span class="e">🔒</span>？？？`;
      b.addEventListener("click", () => { sfx.tap(); startStory(s.id); });
      grid.appendChild(b);
    });
    g.appendChild(grid); box.appendChild(g);
  });
  show("zukan");
}

/* ===== ボタン ===== */
function goHome() { hush(); cur = null; show("home"); renderHome(); }
$("btnHome").addEventListener("click", () => { sfx.tap(); goBack(); });
$("btnBack1").addEventListener("click", () => { sfx.tap(); goHome(); });
$("btnBack2").addEventListener("click", () => { sfx.tap(); goHome(); });
$("btnZukan").addEventListener("click", () => { sfx.tap(); openZukan(); });
$("btnZukan2").addEventListener("click", () => { sfx.tap(); openZukan(); });
$("btnRandom").addEventListener("click", () => {
  sfx.drawer();
  const fresh = STORIES.filter(s => !save.cards[s.id]);
  startStory(pick(fresh.length ? fresh : STORIES).id);
});
$("bubble").addEventListener("click", () => {
  // ふきだしを タップ → もじを ぜんぶ だす
  if (typing) { clearInterval(typing); typing = null; }
});

function renderSound() {
  $("btnSound").textContent = save.sound ? "🔊" : "🔇";
  $("btnSound").classList.toggle("off", !save.sound);
}
$("btnSound").addEventListener("click", () => {
  save.sound = !save.sound; persist(); renderSound();
  if (!save.sound) { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} }
  else sfx.tap();
});
function renderAuto() {
  $("btnAuto").textContent = "▶▶ じどうで すすむ: " + (save.auto ? "オン" : "オフ");
  $("btnAuto").classList.toggle("on", save.auto);
}
$("btnAuto").addEventListener("click", () => {
  sfx.tap(); save.auto = !save.auto; persist(); renderAuto();
  if (save.auto && cur && (cur.phase === "talk" || cur.phase === "intro" || cur.phase === "sum") && !$("buru").classList.contains("talking")) next();
});

document.querySelectorAll("svg.buru").forEach(svg => { svg.innerHTML = $("buruTpl").content.firstElementChild.innerHTML; });
renderSound();
renderAuto();
renderHome();
</script>
