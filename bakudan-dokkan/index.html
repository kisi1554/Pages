<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>バクダン どっかーん！</title>
<meta name="description" content="ばくだんを おして どっかーん！ れんさで いわを ぜんぶ こわす パズルゲーム。">
<meta name="theme-color" content="#2b1d3a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #2b1d3a;
    --paper: #fff8ec;
    --fire: #ff7a1a;
    --fire2: #ffc23d;
    --night: #2b1d3a;
    --night2: #4a2f63;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #5b3a7a 0%, var(--night) 70%);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "游ゴシック体", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen.on { display: flex; }

  /* ── タイトル ── */
  #title { align-items: center; justify-content: center; gap: 18px; text-align: center; color: #fff; }
  #titleCanvas { width: min(64vw, 260px); height: min(64vw, 260px); }
  #title h1 {
    margin: 0; font-size: clamp(34px, 10vw, 64px); line-height: 1.1; letter-spacing: .04em;
    color: var(--fire2);
    text-shadow: 0 4px 0 #c2410c, 0 8px 18px rgba(0,0,0,.45);
  }
  #title h1 small { display: block; font-size: .45em; color: #ffe8c2; text-shadow: 0 3px 0 #7c2d12; }
  .bigbtns { display: flex; flex-direction: column; gap: 14px; width: min(86vw, 380px); }
  .big {
    border: 0; border-radius: 22px; padding: 18px 20px; min-height: 68px;
    font-size: clamp(20px, 5.6vw, 26px); font-weight: bold;
    background: linear-gradient(#ffd25e, #ff9f1a); color: #4a1d00;
    box-shadow: 0 6px 0 #b45309, 0 10px 20px rgba(0,0,0,.35);
  }
  .big.alt { background: linear-gradient(#c9a7ff, #8b5cf6); color: #fff; box-shadow: 0 6px 0 #5b21b6, 0 10px 20px rgba(0,0,0,.35); }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #b45309; }
  .big.alt:active { box-shadow: 0 2px 0 #5b21b6; }
  .soundbtn {
    border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff;
    border-radius: 99px; padding: 10px 18px; font-size: 18px; min-height: 48px;
  }

  /* ── ステージ えらび ── */
  #select { color: #fff; }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: rgba(0,0,0,.25);
  }
  .bar h2 { flex: 1; margin: 0; font-size: clamp(17px, 4.6vw, 22px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn {
    flex: none; min-width: 52px; height: 52px; border-radius: 16px; border: 0;
    background: rgba(255,255,255,.16); color: #fff; font-size: 24px; padding: 0 10px;
  }
  .ibtn:active { background: rgba(255,255,255,.3); }
  .ibtn.glow { animation: glow 1s ease-in-out infinite; }
  @keyframes glow { 50% { background: #ffb020; color: #3a1500; } }
  .levels {
    flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  .lv {
    border: 0; border-radius: 20px; padding: 14px 10px; min-height: 120px;
    background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 5px 0 #c9a77a;
  }
  .lv b { font-size: 30px; line-height: 1; color: #c2410c; }
  .lv span { font-size: 14px; line-height: 1.3; }
  .lv i { font-style: normal; font-size: 18px; letter-spacing: 2px; }
  .lv:disabled { background: #6b5a7d; color: #c9bcd8; box-shadow: 0 5px 0 #3f2f50; }
  .lv:disabled b { color: #c9bcd8; }

  /* ── ゲーム ── */
  #game { color: #fff; }
  .info { display: flex; align-items: center; gap: 6px; font-size: clamp(16px, 4.4vw, 20px); font-weight: bold; }
  #matches { white-space: nowrap; font-size: clamp(22px, 6vw, 28px); gap: 4px; }
  #matches::before { content: "マッチ"; font-size: 15px; margin-right: 6px; opacity: .85; }
  #tip b { color: var(--fire2); }
  #matches .m { display: inline-block; font-size: 1.1em; }
  #matches .m.off { filter: grayscale(1); opacity: .3; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #foot { padding: 6px 10px 10px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #tip {
    margin: 0; text-align: center; font-size: clamp(15px, 4.2vw, 19px); line-height: 1.4;
    background: rgba(255,255,255,.12); padding: 8px 16px; border-radius: 14px; max-width: 640px;
  }
  #palette { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 720px; }
  #game.free #palette { display: flex; }
  #game.free #tip, #game.free #matches, #game.free #hintBtn { display: none; }
  .tool {
    width: 54px; height: 54px; border-radius: 14px; border: 3px solid transparent;
    background: rgba(255,255,255,.14); padding: 0; display: grid; place-items: center; font-size: 26px;
  }
  .tool canvas { width: 42px; height: 42px; display: block; }
  .tool.on { border-color: var(--fire2); background: rgba(255,194,61,.3); }
  .tool.wide { width: auto; padding: 0 12px; font-size: 16px; font-weight: bold; white-space: nowrap; }
  .tool.boom { background: linear-gradient(#ff9b3d, #e8590c); }

  /* ── けっか ── */
  #modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20,10,30,.55); padding: 20px; z-index: 10;
  }
  #modal.on { display: flex; }
  .card {
    background: var(--paper); border-radius: 26px; padding: 24px 22px; width: min(92vw, 400px);
    text-align: center; box-shadow: 0 12px 0 #c9a77a, 0 20px 40px rgba(0,0,0,.4);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .card h3 { margin: 0 0 6px; font-size: clamp(28px, 8vw, 38px); color: #c2410c; }
  .card .stars { font-size: 46px; letter-spacing: 6px; margin: 4px 0; }
  .card .stars .off { filter: grayscale(1); opacity: .25; }
  .card p { margin: 6px 0 16px; font-size: 18px; line-height: 1.5; }
  .card .row { display: flex; flex-direction: column; gap: 10px; }
  .card .big { min-height: 60px; font-size: 21px; padding: 12px; }
  .toast {
    position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: rgba(255,248,236,.96); color: var(--ink); font-size: 19px; font-weight: bold;
    padding: 12px 20px; border-radius: 16px; z-index: 20; pointer-events: none;
    box-shadow: 0 8px 20px rgba(0,0,0,.35); max-width: 86vw; text-align: center; line-height: 1.4;
    transition: opacity .3s; opacity: 0;
  }
  .toast.on { opacity: 1; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<section class="screen on" id="title">
  <canvas id="titleCanvas" width="260" height="260" aria-hidden="true"></canvas>
  <h1>バクダン<br>どっかーん！<small>れんさで いわを こわそう</small></h1>
  <div class="bigbtns">
    <button class="big" id="goStages">▶ ステージで あそぶ</button>
    <button class="big alt" id="goFree">🧨 じゆうに どっかーん</button>
  </div>
  <button class="soundbtn" id="soundTitle">🔊 おと オン</button>
</section>

<section class="screen" id="select">
  <div class="bar">
    <button class="ibtn" id="selBack" aria-label="もどる">←</button>
    <h2>ステージを えらんでね</h2>
    <span class="ibtn" style="visibility:hidden"></span>
  </div>
  <div class="levels" id="levels"></div>
</section>

<section class="screen" id="game">
  <div class="bar">
    <button class="ibtn" id="gameBack" aria-label="もどる">←</button>
    <h2 id="gameTitle">ステージ 1</h2>
    <button class="ibtn" id="hintBtn" aria-label="ヒント">💡</button>
    <button class="ibtn" id="retryBtn" aria-label="やりなおし">🔄</button>
    <button class="ibtn" id="soundBtn" aria-label="おと">🔊</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="foot">
    <div class="info" id="matches" aria-label="のこりの マッチ"></div>
    <p id="tip"></p>
    <div id="palette"></div>
  </div>
</section>

<div id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script src="core.js?v=1d73e47"></script>
<script src="game.js?v=1d73e47"></script>
</body>
</html>
