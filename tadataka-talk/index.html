<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ちりはかせ ただたか</title>
<meta name="description" content="日本地理に くわしい ものしり キャラクター「ただたか」と おしゃべり。47都道府県の ゆうめいな ばしょ・めいさん・ちりを おしえてくれます。">
<meta name="theme-color" content="#2f6b4f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗾</text></svg>">
<link rel="stylesheet" href="style.css?v=c991d53">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="../" aria-label="メニューへ もどる">←</a>
    <h1>ちりはかせ <span>ただたか</span></h1>
    <div class="tools">
      <button id="btnMap" class="tool" type="button" aria-label="ちずを ひらく">🗺️<small id="stampCount">0/47</small></button>
      <button id="btnVoice" class="tool" type="button" aria-pressed="true" aria-label="よみあげ オン/オフ">🗣️<small>こえ</small></button>
      <button id="btnSound" class="tool" type="button" aria-pressed="true" aria-label="こうかおん オン/オフ">🎵<small>おと</small></button>
    </div>
  </header>

  <main class="stage">
    <section class="hero" aria-label="ただたか">
      <div class="chara-wrap">
        <svg id="chara" class="chara" viewBox="0 0 200 220" role="img" aria-label="ただたか">
          <!-- かさ -->
          <g class="hat">
            <path d="M20 78 Q100 6 180 78 Q100 90 20 78 Z" fill="#c99a5b" stroke="#7a5528" stroke-width="4" stroke-linejoin="round"/>
            <path d="M58 58 Q100 30 142 58" fill="none" stroke="#7a5528" stroke-width="3" opacity=".55"/>
            <path d="M40 70 Q100 40 160 70" fill="none" stroke="#7a5528" stroke-width="3" opacity=".4"/>
            <circle cx="100" cy="26" r="7" fill="#7a5528"/>
          </g>
          <!-- からだ(あいの きもの) -->
          <path d="M42 220 Q46 168 100 160 Q154 168 158 220 Z" fill="#2f5d8a" stroke="#1d3c5c" stroke-width="4"/>
          <path d="M100 162 L82 220 M100 162 L118 220" stroke="#f3ead6" stroke-width="7"/>
          <!-- ちずの まきもの -->
          <g class="scroll">
            <rect x="124" y="176" width="52" height="30" rx="5" fill="#fbf3dc" stroke="#7a5528" stroke-width="3"/>
            <path d="M132 196 Q140 182 150 192 T168 186" fill="none" stroke="#3a8a5f" stroke-width="3"/>
            <circle cx="152" cy="190" r="3" fill="#d24b3e"/>
            <rect x="120" y="172" width="8" height="38" rx="4" fill="#a8743a"/>
            <rect x="172" y="172" width="8" height="38" rx="4" fill="#a8743a"/>
          </g>
          <!-- かお -->
          <ellipse cx="100" cy="118" rx="52" ry="50" fill="#ffd9b3" stroke="#8a5a32" stroke-width="4"/>
          <ellipse cx="52" cy="120" rx="8" ry="11" fill="#ffd0a6" stroke="#8a5a32" stroke-width="3"/>
          <ellipse cx="148" cy="120" rx="8" ry="11" fill="#ffd0a6" stroke="#8a5a32" stroke-width="3"/>
          <!-- まゆ -->
          <path class="brow brow-l" d="M66 94 Q78 86 90 94" fill="none" stroke="#efefef" stroke-width="7" stroke-linecap="round"/>
          <path class="brow brow-r" d="M110 94 Q122 86 134 94" fill="none" stroke="#efefef" stroke-width="7" stroke-linecap="round"/>
          <!-- め -->
          <g class="eyes eyes-normal">
            <ellipse cx="78" cy="110" rx="7" ry="9" fill="#2b2118"/>
            <ellipse cx="122" cy="110" rx="7" ry="9" fill="#2b2118"/>
            <circle cx="80" cy="107" r="2.4" fill="#fff"/>
            <circle cx="124" cy="107" r="2.4" fill="#fff"/>
          </g>
          <g class="eyes eyes-happy">
            <path d="M69 112 Q78 100 87 112" fill="none" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/>
            <path d="M113 112 Q122 100 131 112" fill="none" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/>
          </g>
          <g class="eyes eyes-wow">
            <circle cx="78" cy="110" r="11" fill="#fff" stroke="#2b2118" stroke-width="3"/>
            <circle cx="122" cy="110" r="11" fill="#fff" stroke="#2b2118" stroke-width="3"/>
            <circle cx="78" cy="110" r="5" fill="#2b2118"/>
            <circle cx="122" cy="110" r="5" fill="#2b2118"/>
          </g>
          <g class="eyes eyes-think">
            <ellipse cx="80" cy="106" rx="6" ry="8" fill="#2b2118"/>
            <ellipse cx="124" cy="106" rx="6" ry="8" fill="#2b2118"/>
          </g>
          <!-- まるメガネ -->
          <g fill="none" stroke="#5a4632" stroke-width="3">
            <circle cx="78" cy="110" r="16"/>
            <circle cx="122" cy="110" r="16"/>
            <path d="M94 110 Q100 105 106 110"/>
          </g>
          <!-- ほっぺ -->
          <ellipse cx="66" cy="132" rx="9" ry="5" fill="#ff9f8a" opacity=".6"/>
          <ellipse cx="134" cy="132" rx="9" ry="5" fill="#ff9f8a" opacity=".6"/>
          <!-- はな・くち・ひげ -->
          <ellipse cx="100" cy="126" rx="6" ry="5" fill="#f2b98a"/>
          <ellipse class="mouth" cx="100" cy="146" rx="10" ry="4" fill="#9b3b2f"/>
          <path d="M100 134 Q84 128 70 140 Q86 140 100 136 Q114 140 130 140 Q116 128 100 134 Z" fill="#f4f4f4" stroke="#bdbdbd" stroke-width="2"/>
          <path d="M84 156 Q100 172 116 156 Q100 162 84 156 Z" fill="#f4f4f4" stroke="#bdbdbd" stroke-width="2"/>
        </svg>
      </div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </section>

    <section class="chat">
      <div class="log" id="log" aria-label="おしゃべりの きろく"></div>
      <div class="chips" id="chips"></div>
      <form class="input" id="form" autocomplete="off">
        <button id="btnMic" class="mic" type="button" aria-label="こえで はなす">🎤</button>
        <input id="text" type="text" placeholder="たとえば「ほっかいどう」「りんごは どこ？」" enterkeyhint="send">
        <button class="send" type="submit">おくる</button>
      </form>
    </section>
  </main>
</div>

<div class="map-modal" id="mapModal" hidden>
  <div class="map-box">
    <div class="map-head">
      <p><b>ぼうけん ちず</b> ── けんを タップすると ただたかが おはなし するよ</p>
      <button id="btnMapClose" class="tool" type="button" aria-label="とじる">✕</button>
    </div>
    <svg id="mapSvg" class="map" role="img" aria-label="日本地図"></svg>
    <p class="map-note">いろが こい けん = もう きいた けん</p>
  </div>
</div>

<script src="map-data.js?v=c991d53"></script>
<script src="data.js?v=c991d53"></script>
<script src="data-plus-1.js?v=c991d53"></script>
<script src="data-plus-2.js?v=c991d53"></script>
<script src="data-plus-3.js?v=c991d53"></script>
<script src="data-plus-4.js?v=c991d53"></script>
<script src="data-plus-5.js?v=c991d53"></script>
<script src="data-plus-6.js?v=c991d53"></script>
<script src="data-plus-7.js?v=c991d53"></script>
<script src="data-plus-8.js?v=c991d53"></script>
<script src="data-nippon.js?v=c991d53"></script>
<script src="app.js?v=c991d53"></script>
</body>
</html>
