<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みならい しゃしょう ポポ ｜ おしえて おぼえる でんしゃアプリ</title>
<meta name="description" content="じぶんより ちょっとだけ できない ロボット「ポポ」に おしえて おぼえる アプリ。まちがえた もんだいは モヤモヤに なって ずかんに たまり、ちょうどよい 日に また でてきます。">
<meta name="theme-color" content="#2f7ec4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚋</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="backBtn" class="icon-btn" type="button" aria-label="ホームに もどる" hidden>◀ もどる</button>
  <h1 id="topTitle">みならい しゃしょう ポポ</h1>
  <button id="soundBtn" class="icon-btn" type="button" aria-label="おとの せってい">🔊</button>
</header>

<main id="app" class="app"></main>

<!-- おとの せってい -->
<div id="soundPanel" class="sheet" hidden>
  <div class="sheet-inner">
    <h2>おとの せってい</h2>
    <label class="toggle"><input type="checkbox" id="tgVoice" checked><span>よみあげ（ポポの こえ）</span></label>
    <label class="toggle"><input type="checkbox" id="tgSe" checked><span>こうかおん</span></label>
    <button id="sheetClose" class="btn btn-main" type="button">とじる</button>
    <p class="note">おうちの方へ: 音が出ます。端末の音量をご確認ください。読み上げはブラウザの音声合成を使っています。<br>
    せいせきは この ブラウザの なかにだけ ほぞんされます（サーバーには おくりません）。</p>
    <button id="resetBtn" class="btn btn-danger" type="button">さいしょから やりなおす</button>
  </div>
</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
