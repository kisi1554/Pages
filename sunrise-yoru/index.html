<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>サンライズ よるの ふたご でんしゃ</title>
<meta name="description" content="よるの とうきょうえきを でる ねだい とっきゅう。ふたごの でんしゃ いずもくんと せとちゃんに おきゃくさんを のせて、あさの おかやまで きりはなそう。">
<meta name="theme-color" content="#1b2350">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<style>
*,*::before,*::after{ box-sizing:border-box; }
:root{
  --ink:#24213a; --soft:#6d6880; --bg1:#fff1e0; --bg2:#ffe0cc;
  --card:#fff; --line:#f3cfb4; --accent:#f0662c; --accent-dk:#b9431a;
  --seto:#2b9be0; --izumo:#3aa457; --ok:#2f9e44; --ng:#e8590c; --shadow:rgba(150,70,30,.22);
}
html,body{ margin:0; padding:0; height:100%; }
body{
  color:var(--ink);
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%); background-attachment:fixed;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic","游ゴシック体","Meiryo",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  -webkit-user-select:none; user-select:none;
}
body.night{ background:linear-gradient(180deg,#141a3d 0%,#2a2f63 100%); color:#f4f1ff; }
body.night .iconBtn{ background:#2d3470; border-color:#4a529a; color:#fff; }
body.night rt{ color:#c9c4ee; }
rt{ font-size:.5em; font-weight:400; color:var(--soft); letter-spacing:0; }
button{ font:inherit; color:inherit; }
.app{ max-width:1100px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
  padding:4px 12px calc(10px + env(safe-area-inset-bottom)); }
.bar{ display:flex; align-items:center; gap:8px; min-height:58px; }
.bar .sp{ flex:1; }
.bar .ttl{ font-weight:800; font-size:clamp(14px,3.8vw,18px); color:var(--accent-dk); }
body.night .bar .ttl{ color:#ffd59a; }
.iconBtn{
  min-width:52px; min-height:52px; padding:6px 12px; border:3px solid var(--line); border-radius:16px;
  background:var(--card); font-size:clamp(15px,4vw,18px); font-weight:700; cursor:pointer;
  box-shadow:0 4px 0 var(--shadow); text-decoration:none; color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center;
}
.iconBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
.screen{ display:none; flex:1; }
.screen.on{ display:flex; flex-direction:column; animation:fadeIn .3s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
.big{
  display:block; width:100%; min-height:68px; margin:10px 0 0; padding:12px 18px;
  border:none; border-radius:22px; background:var(--accent); color:#fff;
  font-size:clamp(19px,5.4vw,25px); font-weight:800; letter-spacing:.05em; cursor:pointer;
  box-shadow:0 6px 0 var(--accent-dk);
}
.big rt{ color:#ffe3d3; }
.big:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--accent-dk); }
.big.sub{ background:#fff; color:var(--accent-dk); border:3px solid var(--line); box-shadow:0 6px 0 var(--shadow); }
.big.sub rt{ color:var(--soft); }
.big[hidden]{ display:none; }
.row2{ display:flex; gap:10px; }
.row2 > *{ flex:1; }
.panel{ background:var(--card); border:3px solid var(--line); border-radius:22px; box-shadow:0 6px 0 var(--shadow); padding:10px 12px; }
body.night .panel{ background:#232a5c; border-color:#4a529a; box-shadow:0 6px 0 rgba(0,0,0,.35); }
.msg{ font-size:clamp(17px,4.6vw,22px); font-weight:700; line-height:1.9; text-align:center; margin:6px 0; min-height:2em; }
svg text{ font-family:inherit; }

/* タイトル */
.hero{ text-align:center; padding:4px 0 8px; max-width:640px; margin:0 auto; width:100%; }
.hero h1{ margin:2px 0 0; font-size:clamp(28px,8vw,46px); line-height:1.3; letter-spacing:.04em; color:#c4441a; }
.hero h1 small{ display:block; font-size:.42em; color:var(--soft); letter-spacing:.1em; }
.hero p{ margin:10px 0 0; font-size:clamp(16px,4.3vw,19px); line-height:1.95; }
.hero .note{ color:var(--soft); font-size:clamp(12px,3.3vw,14px); line-height:1.7; }
.heroArt{ width:100%; max-width:560px; height:auto; display:block; margin:6px auto 0; border-radius:22px; }
.stat{ text-align:center; margin-top:10px; color:var(--soft); font-size:clamp(14px,3.8vw,16px); }

/* のせる */
.stageSvg{ width:100%; height:auto; display:block; border-radius:20px; }
.who{ display:flex; align-items:center; gap:12px; }
.who .face{ font-size:clamp(54px,15vw,78px); line-height:1; flex:none; animation:bob 1.6s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-6px);} }
.bubble{ position:relative; flex:1; background:#fff; border:3px solid var(--ink); border-radius:20px; padding:8px 12px;
  font-size:clamp(17px,4.7vw,22px); font-weight:800; line-height:1.9; color:var(--ink); }
.bubble::before{ content:""; position:absolute; left:-13px; top:50%; margin-top:-9px; border:9px solid transparent; border-right-color:var(--ink); border-left:0; }
.queue{ display:flex; gap:6px; justify-content:center; font-size:clamp(24px,7vw,32px); min-height:40px; margin-top:4px; }
.queue span{ opacity:.35; }
.queue span.now{ opacity:1; transform:scale(1.2); }
.pick{ min-height:96px; border-radius:22px; border:none; color:#fff; font-weight:800; cursor:pointer;
  font-size:clamp(16px,4.4vw,21px); line-height:1.5; padding:8px 6px; }
.pick small{ display:block; font-size:.78em; font-weight:700; opacity:.95; }
.pick rt{ color:#e6f6ff; }
.pick.seto{ background:var(--seto); box-shadow:0 6px 0 #1a6fa6; }
.pick.izumo{ background:var(--izumo); box-shadow:0 6px 0 #22743a; }
.pick:active{ transform:translateY(4px); box-shadow:none; }
.pick:disabled{ opacity:.45; }
.tools{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
.tools .iconBtn{ font-size:clamp(14px,3.8vw,16px); }

/* よる */
.nightWrap{ display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:760px) and (orientation:landscape){ .nightWrap{ grid-template-columns:1fr 240px; } }
.clockBox{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.clockBox svg{ width:min(46vw,200px); height:auto; }
.clockTxt{ font-size:clamp(18px,5vw,24px); font-weight:800; }
.ticker{ font-size:clamp(15px,4.2vw,19px); font-weight:700; text-align:center; min-height:2.2em; line-height:1.9; }
.rooms{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.room{ border-radius:16px; padding:6px 8px; min-height:84px; background:#2d3470; }
.room h3{ margin:0; font-size:clamp(13px,3.6vw,16px); }
.room.seto h3{ color:#9fd8ff; } .room.izumo h3{ color:#a8f0b8; }
.beds{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:clamp(26px,7vw,34px); margin-top:4px; }
.beds span{ position:relative; }
.beds span::after{ content:"💤"; position:absolute; right:-12px; top:-8px; font-size:.45em; animation:zz 2s ease-in-out infinite; }
.beds span.awake::after{ content:"👀"; animation:none; }
@keyframes zz{ 50%{ transform:translate(4px,-6px); opacity:.5; } }
.saynight{ font-size:clamp(14px,3.9vw,17px); font-weight:700; color:#ffe6a8; min-height:1.6em; margin-top:4px; }

/* きりはなし */
.hint{ text-align:center; font-weight:700; font-size:clamp(15px,4.1vw,18px); color:var(--soft); line-height:1.8; }
.gapHit{ cursor:pointer; }
.shake{ animation:shake .4s; }
@keyframes shake{ 25%{ transform:translateX(-6px);} 75%{ transform:translateX(6px);} }

/* とうちゃく */
.arrive{ display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:700px){ .arrive{ grid-template-columns:1fr 1fr; } }
.town{ border-radius:20px; padding:10px 12px; border:3px solid; }
.town.seto{ background:#e3f4ff; border-color:#8fcdf3; }
.town.izumo{ background:#e6f8e9; border-color:#94d9a3; }
.town h2{ margin:0 0 4px; font-size:clamp(19px,5vw,24px); line-height:1.6; }
.town .t{ font-size:.75em; color:var(--soft); font-weight:700; }
.pas{ display:flex; align-items:center; gap:8px; padding:6px 4px; border-top:2px dashed rgba(0,0,0,.08); opacity:0; transform:scale(.8); transition:all .35s; }
.pas.on{ opacity:1; transform:none; }
.pas .e{ font-size:clamp(32px,9vw,42px); flex:none; }
.pas .s{ font-size:clamp(15px,4.2vw,18px); font-weight:700; line-height:1.8; }
.pas.ng .s{ color:#c2410c; }
.pas .mk{ margin-left:auto; font-size:26px; flex:none; }

/* じかん */
.trow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
.trow svg{ width:min(26vw,120px); height:auto; }
.trow .arr{ font-size:28px; }
.sleepBar{ height:30px; border-radius:15px; position:relative; margin:4px 0 2px; }
.sleepBar i{ position:absolute; left:0; top:0; bottom:0; border-radius:15px; width:0; transition:width 1.6s ease; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; font-style:normal; font-size:18px; }
.lbl{ font-weight:800; font-size:clamp(16px,4.4vw,20px); line-height:1.9; }

/* まなび */
.cards{ display:grid; grid-template-columns:1fr; gap:8px; }
@media (min-width:700px){ .cards{ grid-template-columns:1fr 1fr; } }
.lcard{ background:#fff; border:3px solid var(--line); border-radius:18px; padding:8px 12px; }
.lcard h3{ margin:0; font-size:clamp(17px,4.6vw,20px); line-height:1.8; }
.lcard p{ margin:2px 0 0; font-size:clamp(14px,3.9vw,17px); line-height:1.95; }
.stars{ text-align:center; font-size:clamp(40px,11vw,60px); letter-spacing:.1em; }
.confetti{ position:fixed; top:-30px; font-size:26px; pointer-events:none; animation:fall 2.8s linear forwards; z-index:9; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); } }
.foot{ text-align:center; font-size:12px; color:var(--soft); margin-top:12px; line-height:1.7; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div class="app">
  <div class="bar">
    <a class="iconBtn" id="homeBtn" href="../" aria-label="メニューへ">🏠</a>
    <span class="ttl" id="barTtl">🌅 サンライズ よるの ふたご でんしゃ</span>
    <span class="sp"></span>
    <button class="iconBtn" id="sndBtn" aria-label="おと">🔊</button>
  </div>

  <!-- タイトル -->
  <section class="screen on" id="sTitle">
    <div class="hero">
      <h1><small>ねだい とっきゅう の おはなし</small>サンライズ<br>よるの ふたご でんしゃ</h1>
      <div id="heroArt"></div>
      <p>よるの <span id="tTokyo"></span>を でる ふたごの でんしゃ<br><b style="color:var(--izumo)">いずもくん</b> と <b style="color:var(--seto)">せとちゃん</b>。<br>
      おきゃくさんを ただしい ほうに のせて、<br>あさの <span id="tOkayama"></span>で きりはなそう！</p>
      <button class="big" id="startBtn">🚉 えきへ いく</button>
      <div class="stat" id="stat"></div>
      <p class="note" id="srcNote"></p>
    </div>
  </section>

  <!-- のせる -->
  <section class="screen" id="sBoard">
    <div class="msg" id="boardMsg"></div>
    <div id="boardTrain"></div>
    <div class="queue" id="queue"></div>
    <div class="panel who" id="whoBox" style="margin-top:6px;">
      <div class="face" id="whoFace">🦝</div>
      <div class="bubble" id="whoSay"></div>
    </div>
    <div class="row2" style="margin-top:12px;" id="pickRow">
      <button class="pick seto" id="pickSeto"></button>
      <button class="pick izumo" id="pickIzumo"></button>
    </div>
    <div class="tools"><button class="iconBtn" id="undoBtn">↩ ひとり もどす</button></div>
    <button class="big" id="goBtn" hidden>🌙 しゅっぱつ しんこう！</button>
  </section>

  <!-- よる -->
  <section class="screen" id="sNight">
    <div class="nightWrap">
      <div>
        <div id="nightView"></div>
        <div class="ticker" id="ticker"></div>
      </div>
      <div class="panel clockBox">
        <div id="nightClock"></div>
        <div class="clockTxt" id="nightClockTxt"></div>
      </div>
    </div>
    <div class="rooms" style="margin-top:8px;">
      <div class="room seto"><h3>まえ：せとちゃんの へや</h3><div class="beds" id="bedSeto"></div></div>
      <div class="room izumo"><h3>うしろ：いずもくんの へや</h3><div class="beds" id="bedIzumo"></div></div>
    </div>
    <div class="saynight" id="nightSay"></div>
    <button class="big sub" id="ffBtn">⏩ はやおくり</button>
    <button class="big" id="toSplitBtn" hidden>☀️ あさだ！ おりて みよう</button>
  </section>

  <!-- きりはなし -->
  <section class="screen" id="sSplit">
    <div class="msg" id="splitMsg"></div>
    <div id="miniTrain"></div>
    <div id="splitTrain" style="margin-top:6px;"></div>
    <div class="hint" id="splitHint"></div>
    <button class="big" id="toMapBtn" hidden>🗺️ ちずで みてみよう</button>
  </section>

  <!-- ちず -->
  <section class="screen" id="sMap">
    <div class="msg" id="mapMsg"></div>
    <div id="mapBox"></div>
    <button class="big" id="toArriveBtn" hidden>🛎️ おきゃくさん、おきて〜！</button>
  </section>

  <!-- とうちゃく -->
  <section class="screen" id="sArrive">
    <div class="msg" id="arriveMsg"></div>
    <div class="arrive">
      <div class="town seto" id="townSeto"></div>
      <div class="town izumo" id="townIzumo"></div>
    </div>
    <button class="big" id="toTimeBtn" hidden>⏰ なんじかん ねてた？</button>
  </section>

  <!-- じかん -->
  <section class="screen" id="sTime">
    <div class="msg">よる しゅっぱつ して、あさ つく。<br>どっちが ながく はしった かな？</div>
    <div class="panel" id="timeBox"></div>
    <button class="big" id="toEndBtn" hidden>📚 まなび カード</button>
  </section>

  <!-- おわり -->
  <section class="screen" id="sEnd">
    <div class="stars" id="stars"></div>
    <div class="msg" id="endMsg"></div>
    <div class="cards" id="cards"></div>
    <button class="big" id="retryBtn">↩ おなじ おきゃくさんで もういちど</button>
    <button class="big sub" id="newBtn">🆕 あたらしい おきゃくさん</button>
    <div class="foot" id="endNote"></div>
  </section>
</div>

<script>
/* =====================================================================
   データ（実在の 駅・時こく・両数・路線は ここ 1か所に まとめる）
   出典: JRグループ「寝台特急『サンライズ出雲』『サンライズ瀬戸』時刻表」
         https://jr-group.jp/sunrise-timetable/ （2026年10月現在）
   下りの 編成: 1〜7号車＝サンライズ瀬戸（前＝出雲市・高松がわ）、8〜14号車＝サンライズ出雲。
   各7両、東京〜岡山は 14両で 連結、岡山で 分割。運転日の 変更などは あつかわない。
   ===================================================================== */
const DATA = {
  asOf: '2026ねん 10がつ げんざい',   // 出典の 2026年10月現在
  carsEach: 7,
  cars: { seto:[1,7], izumo:[8,14] },     // 下り。まえ（西・岡山がわ）が 瀬戸
  // 東京〜岡山（いっしょに 走る）。東京＝発、岡山＝着、ほかは 発。
  common: [
    ['東京','とうきょう','21:26'], ['横浜','よこはま','21:52'], ['熱海','あたみ','22:57'],
    ['沼津','ぬまづ','23:16'], ['富士','ふじ','23:32'], ['静岡','しずおか','23:59'],
    ['浜松','はままつ','0:54'], ['姫路','ひめじ','5:26'], ['岡山','おかやま','6:27'],
  ],
  commonLines: [['東海道本線','とうかいどう ほんせん'], ['山陽本線','さんよう ほんせん']],
  seto: {
    dep: '6:31',
    stops: [['児島','こじま','6:53'], ['坂出','さかいで','7:10'], ['高松','たかまつ','7:27']],
    lines: [['宇野線','うのせん'], ['本四備讃線','ほんしびさんせん'], ['予讃線','よさんせん']],
  },
  izumo: {
    dep: '6:34',
    stops: [['倉敷','くらしき','6:47'], ['備中高梁','びっちゅう たかはし','7:14'], ['新見','にいみ','7:44'],
            ['米子','よなご','9:08'], ['安来','やすぎ','9:17'], ['松江','まつえ','9:34'],
            ['宍道','しんじ','9:48'], ['出雲市','いずもし','10:00']],
    lines: [['山陽本線','さんよう ほんせん'], ['伯備線','はくびせん'], ['山陰本線','さんいん ほんせん']],
  },
};

/* ---------- 小さな 道具 ---------- */
const $ = id => document.getElementById(id);
const R = (k, r) => `<ruby>${k}<rt>${r}</rt></ruby>`;
const RS = st => R(st[0], st[1]);                       // 駅データ → ふりがなつき
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const START = toMin(DATA.common[0][2]);
function toMin(s){ const [h, m] = s.split(':').map(Number); let v = h * 60 + m; if (v < 12 * 60) v += 1440; return v; } // よる しゅっぱつ → つぎの日は +24h
function fun(m){ if (m === 0) return ''; const d = m % 10; const p = (d === 0 || d === 1 || d === 3 || d === 4 || d === 6 || d === 8) ? 'ぷん' : 'ふん'; return m + p; }
function kidTime(v){
  const h = Math.floor(v / 60) % 24, m = v % 60;
  const part = (h >= 18 || h < 4) ? 'よる' : (h < 11 ? 'あさ' : 'ひる');
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${part} ${h12}じ${fun(m)}`;
}

let AC = null;
function ac(){
  if (!save.sound) return null;
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { return null; }
  return AC;
}
function tone(f, t0, dur, type, vol, f2){
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); const st = a.currentTime + (t0 || 0);
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, st); if (f2) o.frequency.exponentialRampToValueAtTime(f2, st + dur);
  g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol || 0.2, st + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
  o.connect(g).connect(a.destination); o.start(st); o.stop(st + dur + 0.05);
}
function noise(t0, dur, vol, freq){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 700; f.Q.value = 0.8;
  const g = a.createGain(); g.gain.value = vol || 0.25;
  s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + (t0 || 0));
}

// 1りょう または 1へんせいの からだ。nl/nr は 左右の はなの まるさ
function body(x, y, w, h, nl, nr, kind){
  const p = `M${x + nl},${y} L${x + w - nr},${y} Q${x + w},${y} ${x + w},${y + nr} L${x + w},${y + h - 8} Q${x + w},${y + h} ${x + w - 8},${y + h} L${x + 8},${y + h} Q${x},${y + h} ${x},${y + h - 8} L${x},${y + nl} Q${x},${y} ${x + nl},${y} Z`;
  return `<path d="${p}" fill="url(#sunBody)" stroke="#8a3a17" stroke-width="3"/>` +
         `<rect x="${x + Math.max(nl, 8) * .6}" y="${y + h * 0.7}" width="${w - (Math.max(nl, 8) + Math.max(nr, 8)) * .6}" height="${h * 0.08}" fill="${COL[kind]}"/>`;
}
function face(cx, cy, s, dir, mood){
  // dir: -1 = ひだり むき、1 = みぎ むき
  const ex = cx + dir * s * 0.1;
  const plate = `<ellipse cx="${ex}" cy="${cy + s * .1}" rx="${s * .62}" ry="${s * .5}" fill="#fff6e0" stroke="#8a3a17" stroke-width="2"/>`;
  const eyes = mood === 'sleep'
    ? `<path d="M${ex - s * .32},${cy} q${s * .1},${s * .1} ${s * .2},0 M${ex + s * .12},${cy} q${s * .1},${s * .1} ${s * .2},0" stroke="#24213a" stroke-width="3" fill="none"/>`
    : `<circle cx="${ex - s * .22}" cy="${cy}" r="${s * .13}" fill="#24213a"/><circle cx="${ex + s * .22}" cy="${cy}" r="${s * .13}" fill="#24213a"/>` +
      `<circle cx="${ex - s * .19}" cy="${cy - s * .04}" r="${s * .03}" fill="#fff"/><circle cx="${ex + s * .25}" cy="${cy - s * .04}" r="${s * .03}" fill="#fff"/>`;
  return plate + eyes + `<path d="M${ex - s * .16},${cy + s * .26} q${s * .16},${s * .16} ${s * .32},0" stroke="#24213a" stroke-width="3" fill="none" stroke-linecap="round"/>` +
    `<circle cx="${ex - s * .42}" cy="${cy + s * .22}" r="${s * .08}" fill="#ff7b9c" opacity=".7"/><circle cx="${ex + s * .42}" cy="${cy + s * .22}" r="${s * .08}" fill="#ff7b9c" opacity=".7"/>`;
}
function wheels(x, w, y){
  let s = '';
  for (const wx of [x + 30, x + 60, x + w - 60, x + w - 30]) s += `<circle cx="${wx}" cy="${y}" r="10" fill="#3b3b4f" stroke="#888" stroke-width="3"/>`;
  return s;
}

function along(pts, t){
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let r = t * tot;
  for (let i = 0; i < seg.length; i++) { if (r <= seg[i]) { const f = r / seg[i]; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f]; } r -= seg[i]; }
  return LAST(pts);
}

  $('timeBox').innerHTML = rowH('seto', TAKAMATSU) + '<hr style="border:none;border-top:2px dashed #eee">' + rowH('izumo', IZUMOSHI) +
    `<div class="lbl" id="timeSum" style="text-align:center;opacity:0;transition:opacity .5s"></div>`;
  for (const k of ['seto', 'izumo']) { setClock($('c1' + k), START); setClock($('c2' + k), toMin((k === 'seto' ? TAKAMATSU : IZUMOSHI)[2])); }
  const maxD = Math.max(DUR.seto, DUR.izumo);
  await sleep(300);
  for (const k of ['seto', 'izumo']) { $('bar' + k).style.width = (DUR[k] / maxD * 100) + '%'; SFX.tap(); await sleep(1700); $('hrs' + k).style.opacity = 1; }
  $('timeSum').innerHTML = `いずもくんの ほうが ながく はしるね！<br>ねている あいだに とおくまで いけるのが ねだい とっきゅう`;
  $('timeSum').style.opacity = 1; SFX.ok();
  $('toEndBtn').hidden = false;
}
$('toEndBtn').addEventListener('click', () => { SFX.tap(); startEnd(); });

/* ---------- 7. まなび カード と けっか ---------- */
function startEnd(){
  clearTimers(); show('sEnd');
  const n = round.list.length, ok = lastScore;
  const star = ok === n ? 3 : ok >= n - 2 ? 2 : 1;
  $('stars').textContent = '⭐'.repeat(star) + '☆'.repeat(3 - star);
  save.plays++; if (ok === n) save.perfect++; store();
  if (ok === n) { $('endMsg').innerHTML = 'ぜんいん ただしく のせられたね！ すごい！<br>きみは ねだい とっきゅうの しゃしょうさん だ！'; SFX.fanfare(); confetti(); }
  else $('endMsg').innerHTML = `${ok}にん ただしく のれたよ。よく がんばったね！<br>おなじ おきゃくさんで もういちど のせて みよう`;
  $('retryBtn').hidden = ok === n;
  const L = s => s.map(l => R(l[0], l[1])).join('・');
  $('cards').innerHTML = [
    ['🛏️ ねだい とっきゅう', `ねる ための へやが ある とっきゅう。よる ${RS(TOKYO)}を でて、ねている あいだに とおくまで はしるよ。`],
    ['🔗 れんけつ・きりはなし', `2つの でんしゃが つながるのが れんけつ、はなれるのが きりはなし。${RS(TOKYO)}〜${RS(OKAYAMA)}は ${DATA.carsEach * 2}りょう つながって はしり、${RS(OKAYAMA)}で ${DATA.carsEach}りょう ずつに わかれるよ。`],
    ['🌉 うみを わたって 四国へ', `せとちゃんは ${R('瀬戸大橋', 'せとおおはし')}で うみ（${R('瀬戸内海', 'せとないかい')}）を わたって、${R('四国', 'しこく')}の ${RS(TAKAMATSU)}へ。とおる せん：${L(DATA.seto.lines)}`],
    ['⛰️ やまを こえて 山陰へ', `いずもくんは やまの なかを はしって、${R('日本海', 'にほんかい')}がわの ${R('山陰', 'さんいん')}の ${RS(IZUMOSHI)}へ。とおる せん：${L(DATA.izumo.lines)}`],
  ].map(([h, p]) => `<div class="lcard"><h3>${h}</h3><p>${p}</p></div>`).join('');
  $('endNote').innerHTML = `${RS(TOKYO)}〜${RS(OKAYAMA)}：${L(DATA.commonLines)}。じこくは JR の じこくひょう（${DATA.asOf}）。`;
}
function confetti(){
  const em = ['🌅', '⭐', '🎉', '🚃', '✨'];
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('div'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.8 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4000);
  }
}
$('retryBtn').addEventListener('click', () => { SFX.tap(); startBoard(false); });
$('newBtn').addEventListener('click', () => { SFX.tap(); startBoard(true); });
$('startBtn').addEventListener('click', () => { SFX.whistle(); startBoard(true); });

paintTitle();
</script>
