<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>むしくい しんぶん</title>
<meta name="description" content="むしに たべられて あなが あいた しんぶんや てがみ。まえと うしろの ことばを ヒントに、あなに はいる もじを あてよう。">
<meta name="theme-color" content="#5c940d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐛</text></svg>">
<link rel="stylesheet" href="style.css?v=89d3fa0">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="あそびメニューへ">🏠</a>
  <button type="button" id="backBtn" class="icon-btn" aria-label="もどる" hidden>◀</button>
  <h1 id="ttl">🐛 むしくい しんぶん</h1>
  <button type="button" id="soundBtn" class="icon-btn" aria-label="おと オン/オフ" aria-pressed="true">🔊</button>
</header>

<main>
  <!-- タイトル -->
  <section id="vHome" class="view">
    <div class="hero">
      <div class="hero-paper">
        <p>むしが かみを <span class="hole demo" style="--n:1"><span class="pit"></span><span class="hint">？</span></span>べちゃった！</p>
      </div>
      <p class="lead">あなに はいる もじを あてて、 むしを おいはらおう。</p>
    </div>
    <div id="lvList" class="lv-list"></div>
    <div class="home-btns">
      <button type="button" id="zukanBtn" class="big-btn">📖 むし ずかん</button>
      <button type="button" id="setBtn" class="big-btn">⚙️ せってい</button>
    </div>
  </section>

  <!-- かみ えらび -->
  <section id="vSheets" class="view" hidden>
    <h2 id="sheetsTtl" class="sub-ttl"></h2>
    <p id="sheetsNote" class="note"></p>
    <div id="sheetGrid" class="sheet-grid"></div>
  </section>

  <!-- あそぶ -->
  <section id="vPlay" class="view" hidden>
    <div id="paper" class="paper"></div>
    <div id="done" class="done" hidden>
      <p class="done-msg">🎉 むしが いなく なって、 きれいに なったよ！</p>
      <div class="done-btns">
        <button type="button" id="readBtn" class="mid-btn">🗣️ よむ</button>
        <button type="button" id="nextBtn" class="mid-btn primary">つぎの かみ ▶</button>
      </div>
    </div>
    <div id="panel" class="panel">
      <p id="panelMsg" class="panel-msg">あなを タップしてね</p>
      <div id="choices" class="choices"></div>
      <div id="padWrap" class="pad-wrap" hidden>
        <div id="padBox" class="pad-box"></div>
        <div id="pad" class="pad"></div>
      </div>
      <button type="button" id="modeBtn" class="mode-btn" hidden>⌨️ じぶんで いれる</button>
    </div>
  </section>

  <!-- ずかん -->
  <section id="vZukan" class="view" hidden>
    <h2 class="sub-ttl">📖 むし ずかん</h2>
    <p id="zukanNote" class="note"></p>
    <div id="zukanGrid" class="zukan-grid"></div>
  </section>

  <!-- せってい -->
  <section id="vSet" class="view" hidden>
    <h2 class="sub-ttl">⚙️ せってい</h2>
    <div class="set-list">
      <label class="set-row"><span>🔊 おと</span><input type="checkbox" id="setSound"></label>
      <label class="set-row"><span>🗣️ よみあげ（できた かみを よむ）</span><input type="checkbox" id="setYomi"></label>
      <label class="set-row"><span>🤪 おもしろ モード<small>ちがう ことばを いれると へんな ぶんに なるよ</small></span><input type="checkbox" id="setOmo"></label>
      <label class="set-row"><span>⌨️ じぶんで いれる<small>レベル4・5 は 50おん パッドで こたえる</small></span><input type="checkbox" id="setPad"></label>
      <button type="button" id="resetBtn" class="reset-btn">🗑️ きろくを けす</button>
    </div>
  </section>
</main>

<div id="funny" class="funny" hidden>
  <div class="funny-card">
    <p class="funny-head">🤪 へんな ぶん！</p>
    <div id="funnyPic" class="funny-pic"></div>
    <p id="funnyText" class="funny-text"></p>
    <p id="funnyAns" class="funny-ans" hidden></p>
  </div>
</div>

<script src="mondai.js?v=89d3fa0"></script>
<script src="bugs.js?v=89d3fa0"></script>
<script src="sound.js?v=89d3fa0"></script>
<script src="app.js?v=89d3fa0"></script>
</body>
</html>
