<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>じょうもん クッキング</title>
<style>
  :root { --brown:#7a4521; --clay:#b5713c; --cream:#fff7e8; --accent:#d9480f; --green:#5c940d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { font-family: "Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic UI","Meiryo",sans-serif;
    background:#f3e2c4; color:#4a2c12; user-select:none; -webkit-user-select:none; }
  button { font-family:inherit; color:inherit; cursor:pointer; border:none; }
  #app { height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:1100px; margin:0 auto; }

  header { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--brown); color:#fff; }
  header h1 { font-size:clamp(16px,4.4vw,22px); margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hbtn { min-width:48px; height:44px; border-radius:12px; background:#fff3; color:#fff; font-size:20px; padding:0 10px; }
  .hbtn small { font-size:12px; margin-left:2px; }

  #stage { flex:1; min-height:0; display:flex; flex-direction:column; padding:8px; gap:8px; overflow:hidden; }

  /* じだいの ものさし */
  .ruler { background:#4a2c12; padding:5px 6px 6px; }
  .ruler ol { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; justify-content:center; gap:3px 2px; }
  .ruler li { font-size:10.5px; line-height:1; padding:4px 6px; border-radius:99px; background:#6b4a2e; color:#d9c2a3; white-space:nowrap; }
  .ruler li + li::before { content:"›"; margin:0 3px 0 -5px; color:#a58a6a; }
  .ruler li.now { background:#ffd43b; color:#4a2c12; font-weight:bold; font-size:12.5px;
    box-shadow:0 0 0 2px #fff8, 0 0 12px 3px #ffd43b; animation:glow 1.6s ease-in-out infinite; }
  .ruler li.now::before { color:#4a2c12; }
  @keyframes glow { 50% { box-shadow:0 0 0 2px #fff, 0 0 18px 7px #ffe066; } }
  @media (min-width:700px) { .ruler li { font-size:13px; padding:5px 9px; } .ruler li.now { font-size:15px; } }

  /* ドキさんの おしゃべり */
  .talk { display:flex; align-items:center; gap:8px; flex:none; }
  .host { width:clamp(56px,16vmin,92px); flex:none; }
  .host svg { width:100%; display:block; }
  .bubble { flex:1; background:#fff; border:3px solid var(--brown); border-radius:18px; padding:8px 12px;
    font-size:clamp(16px,4.3vmin,24px); line-height:1.45; font-weight:bold; position:relative; min-height:3em; display:flex; align-items:center; }
  .bubble::before { content:""; position:absolute; left:-12px; top:50%; margin-top:-8px; border:8px solid transparent; border-right-color:var(--brown); border-left:0; }
  .bubble.pop { animation:pop .3s; }
  @keyframes pop { 0% { transform:scale(.92);} 60% { transform:scale(1.04);} 100% { transform:none; } }

  .field { flex:1; min-height:0; position:relative; border-radius:20px; overflow:hidden; border:3px solid #0002;
    display:flex; align-items:center; justify-content:center; }
  .field::before { content:attr(data-deco); position:absolute; left:0; right:0; top:2px; text-align:center; font-size:clamp(26px,7vmin,44px);
    letter-spacing:.5em; opacity:.55; pointer-events:none; white-space:nowrap; }
  .bg-forest { background:linear-gradient(#cfeab5,#8cc474 60%,#6fa85c); }
  .bg-beach  { background:linear-gradient(#8fd3f4 0,#8fd3f4 22%,#f6e3b0 30%,#ecd08e); }
  .bg-river  { background:linear-gradient(#cfeab5 0,#cfeab5 25%,#7cc6ee 32%,#4aa8dc); }
  .bg-fire   { background:radial-gradient(circle at 50% 75%,#ffd8a8,#e8a56b 55%,#a8643a); }
  .bg-snow   { background:linear-gradient(#dbe9f6,#f8fbff 55%,#fff); }
  .bg-home   { background:linear-gradient(#ffe8b8,#f5c98a); }
  .season-snow::after { content:"❄ ❄ ❄ ❄"; position:absolute; top:8%; left:0; right:0; text-align:center; font-size:22px; opacity:.5; letter-spacing:2em; pointer-events:none; }

  .bar { flex:none; display:flex; align-items:center; justify-content:center; gap:10px; min-height:56px; flex-wrap:wrap; }
  .big { font-size:clamp(18px,5vmin,26px); font-weight:bold; padding:12px 22px; border-radius:18px; background:var(--accent); color:#fff;
    box-shadow:0 5px 0 #8f2f08; min-height:56px; }
  .big:active { transform:translateY(4px); box-shadow:0 1px 0 #8f2f08; }
  .big.sub { background:#fff; color:var(--brown); box-shadow:0 5px 0 #c9a77c; border:2px solid #c9a77c; }
  .big.green { background:var(--green); box-shadow:0 5px 0 #37600a; }
  .big[disabled] { opacity:.4; }
  .slots { display:flex; gap:4px; font-size:clamp(22px,6vmin,34px); }
  .slots span { width:1.5em; height:1.5em; border-radius:50%; background:#fff9; border:2px dashed #b08a5e; display:flex; align-items:center; justify-content:center; }
  .slots span.on { border-style:solid; background:#fff; animation:pop .3s; }
  .slots svg { width:70%; }
  .prog { width:min(70%,420px); height:20px; border-radius:99px; background:#fff; border:3px solid var(--brown); overflow:hidden; }
  .prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ffd43b,#fd7e14); transition:width .2s; }
  .steps { display:flex; gap:5px; justify-content:center; flex:none; }
  .steps i { width:14px; height:14px; border-radius:50%; background:#d9c2a3; }
  .steps i.on { background:var(--accent); } .steps i.cur { background:#ffd43b; box-shadow:0 0 0 3px var(--accent); }

  /* あつめる */
  .it { position:absolute; transform:translate(-50%,-50%); width:clamp(60px,17vmin,96px); height:clamp(60px,17vmin,96px); background:none;
    font-size:clamp(38px,11vmin,62px); display:flex; align-items:center; justify-content:center; padding:0; transition:transform .15s; }
  .it svg { width:78%; pointer-events:none; }
  .it:active { transform:translate(-50%,-50%) scale(1.15); }
  .it.got { animation:got .5s forwards; pointer-events:none; }
  @keyframes got { 40% { transform:translate(-50%,-90%) scale(1.3);} 100% { transform:translate(-50%,-160%) scale(.3); opacity:0; } }
  .it.fly { animation:fly .6s forwards; pointer-events:none; }
  @keyframes fly { 100% { left:86%; top:20%; transform:translate(-50%,-50%) rotate(540deg) scale(.4); opacity:.2; } }
  .it.no { animation:wob .4s; }
  @keyframes wob { 25% { transform:translate(-50%,-50%) rotate(-14deg);} 75% { transform:translate(-50%,-50%) rotate(14deg);} }
  .mound { width:80%; height:46%; background:#d9b56c; border-radius:50% 50% 12% 12%; border:3px solid #b08a4a; display:block; }
  .burr { width:74%; height:74%; border-radius:50%; background:#7a9c2e; border:5px dotted #4d6a12; display:block; }
  .corner { position:absolute; right:6px; top:6px; background:#fffd; border-radius:14px; padding:4px 8px; font-size:12px; text-align:center; font-weight:bold; z-index:2; }
  .corner svg, .corner .e { width:44px; font-size:36px; display:block; margin:0 auto; }
  .kaizuka { position:absolute; right:3%; top:8%; width:26%; aspect-ratio:2/1; background:#e9e2d0; border:3px solid #b9ad92; border-radius:50% 50% 8% 8%;
    display:flex; align-items:flex-end; justify-content:center; font-size:12px; font-weight:bold; padding-bottom:2px; }

  /* タップで すすむ・メーター */
  .art { background:none; padding:0; font-size:clamp(70px,24vmin,150px); line-height:1; display:flex; align-items:center; justify-content:center;
    width:min(80%,58vmin,360px); aspect-ratio:1; position:relative; }
  .art svg { width:70%; }
  .art.hit { animation:hit .18s; }
  @keyframes hit { 50% { transform:scale(.9) rotate(-4deg);} }
  .art .ov { position:absolute; font-size:.5em; }
  .hint { position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:15px; font-weight:bold; color:#4a2c12; opacity:.75; pointer-events:none; }
  .meter { width:min(86%,460px); height:34px; border-radius:99px; border:3px solid var(--brown); position:relative; overflow:hidden;
    background:linear-gradient(90deg,#fff3bf 0 40%,#69db7c 40% 72%,#495057 72%); }
  .meter b { position:absolute; top:-3px; bottom:-3px; width:10px; margin-left:-5px; background:#e03131; border:2px solid #fff; border-radius:6px; }
  .steam { position:absolute; top:6%; font-size:.35em; animation:steam 1.4s infinite; opacity:0; }
  @keyframes steam { 0% { transform:translateY(20px); opacity:0;} 40% { opacity:.9;} 100% { transform:translateY(-30px); opacity:0; } }
  .float { position:absolute; left:50%; top:46%; width:44px; height:44px; margin:-22px; border-radius:50%; background:linear-gradient(#e03131 50%,#fff 50%);
    border:3px solid #7a1f1f; animation:bob 1.2s ease-in-out infinite; }
  .float.bite { animation:none; top:58%; transform:scale(.8); }
  .float.bite::after { content:"！"; position:absolute; left:50%; top:-64px; transform:translateX(-50%); font-size:46px; font-weight:bold; color:#e03131; text-shadow:0 0 4px #fff; }
  @keyframes bob { 50% { transform:translateY(8px);} }
  .jump { position:absolute; left:50%; top:46%; font-size:70px; animation:jump .9s forwards; }
  @keyframes jump { 0% { transform:translate(-50%,0) rotate(0);} 50% { transform:translate(-50%,-120px) rotate(-40deg);} 100% { transform:translate(-50%,-40px) rotate(-90deg); opacity:0; } }
  .fishrow { display:flex; gap:4vmin; font-size:clamp(46px,14vmin,90px); align-items:flex-end; }
  .fishrow span { transition:filter .3s, opacity .4s, transform .4s; display:inline-block; transform:rotate(-90deg); }
  .fishrow span.gone { opacity:0; transform:rotate(-90deg) scale(.2); }
  .fireE { position:absolute; bottom:4%; left:50%; margin-left:-48px; width:96px; height:96px; background:none; padding:0; font-size:64px; line-height:96px; transition:transform .2s; transform-origin:50% 90%; z-index:2; }
  .fishrow { margin-bottom:22%; }
  .dog { position:absolute; right:-70px; bottom:38%; font-size:clamp(46px,13vmin,80px); background:none; padding:6px; transition:right 4.5s linear; transform:scaleX(-1); z-index:3; }
  .dog.go { right:4%; }
  .dog.sit { transition:none; transform:none; animation:wag .4s infinite alternate; }
  @keyframes wag { to { transform:rotate(8deg);} }

  /* リアクション */
  .faces { display:flex; gap:3vmin; align-items:flex-end; justify-content:center; width:100%; padding:0 4px; }
  .v { width:min(27%,30vmin,200px); position:relative; opacity:0; }
  .v svg { width:100%; display:block; }
  .v.in { opacity:1; animation:hop .5s 3; }
  .v.in.spin { animation:spin .9s 2; }
  .v.yuck { opacity:1; animation:shiver .12s 14; }
  .v.yuck svg { transform:scaleY(.78); }
  @keyframes hop { 50% { transform:translateY(-22%);} }
  @keyframes spin { 50% { transform:translateY(-22%) rotate(180deg);} 100% { transform:rotate(360deg);} }
  @keyframes shiver { 50% { transform:translateX(5px);} }
  .v:nth-child(2) em { margin-bottom:2.4em; }
  .v em { position:absolute; left:50%; bottom:100%; transform:translateX(-50%); background:#fff; border:3px solid var(--accent); border-radius:14px;
    padding:4px 8px; font-style:normal; font-weight:bold; font-size:clamp(14px,4vmin,22px); white-space:nowrap; margin-bottom:4px; }
  .dish { position:absolute; bottom:4%; font-size:clamp(40px,12vmin,70px); }

  /* メニュー */
  .scroll { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
  .menu { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (orientation:landscape) and (min-width:640px) { .menu { grid-template-columns:repeat(3,1fr); } }
  .mcard { background:#fff; border-radius:18px; border:3px solid #c9a77c; padding:10px 6px 8px; text-align:center; box-shadow:0 5px 0 #c9a77c; position:relative; min-height:118px; }
  .mcard:active { transform:translateY(4px); box-shadow:0 1px 0 #c9a77c; }
  .mcard .e { font-size:clamp(40px,11vmin,56px); line-height:1.1; display:block; }
  .mcard .n { font-size:clamp(15px,4vmin,19px); font-weight:bold; display:block; }
  .mcard .s { position:absolute; left:6px; top:6px; font-size:12px; font-weight:bold; padding:2px 7px; border-radius:99px; color:#fff; }
  .mcard .st { position:absolute; right:6px; top:4px; font-size:16px; }
  .mcard.next { border-color:var(--accent); box-shadow:0 5px 0 #8f2f08; animation:nudge 1.4s infinite; }
  @keyframes nudge { 50% { transform:scale(1.03);} }
  .s-haru { background:#e64980; } .s-natsu { background:#1c7ed6; } .s-aki { background:#e8590c; } .s-fuyu { background:#5c7cfa; }
  .row { display:flex; gap:10px; justify-content:center; margin:10px 0 6px; flex-wrap:wrap; }
  details { background:#fff8; border-radius:12px; padding:6px 10px; font-size:12px; line-height:1.6; margin-top:6px; user-select:text; -webkit-user-select:text; }
  details summary { font-weight:bold; font-size:13px; padding:4px 0; }

  /* まなび カード */
  .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (orientation:landscape) and (min-width:640px) { .cards { grid-template-columns:repeat(3,1fr); } }
  .lc { background:#fff; border:3px solid #e8a33d; border-radius:16px; padding:8px; text-align:center; min-height:110px; font-weight:bold; font-size:16px; }
  .lc .e { font-size:48px; display:block; height:60px; line-height:60px; } .lc svg { height:58px; }
  .lc.lock { background:#e9dcc6; border-color:#c9b79a; color:#9a8566; }
  #modal { position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center; padding:16px; z-index:20; }
  #modal.on { display:flex; }
  .mbox { background:#fffdf5; border:5px solid #e8a33d; border-radius:24px; padding:16px; max-width:460px; width:100%; max-height:92vh; overflow:auto; text-align:center; animation:pop .3s; }
  .mbox h2 { margin:4px 0; font-size:22px; } .mbox .e { font-size:72px; line-height:1.1; } .mbox svg { height:110px; }
  .mbox p { font-size:18px; line-height:1.6; font-weight:bold; text-align:left; margin:8px 0; }
  .mbox small { display:block; text-align:left; font-size:11.5px; line-height:1.5; color:#7a6a55; border-top:1px dashed #c9b79a; padding-top:6px; margin-bottom:10px; }

  /* できあがり */
  .result { flex:1; min-height:0; overflow-y:auto; text-align:center; background:linear-gradient(#fff3bf,#ffe8cc); border-radius:20px; padding:10px; position:relative; }
  .result h2 { font-size:clamp(24px,7vmin,38px); margin:4px 0; color:var(--accent); }
  .result .e { font-size:clamp(70px,22vmin,120px); line-height:1.1; animation:hop 1s infinite; display:inline-block; }
  .result p { font-size:clamp(16px,4.2vmin,20px); font-weight:bold; margin:6px 0; line-height:1.5; }
  .getcard { display:inline-flex; align-items:center; gap:8px; background:#fff; border:3px solid #e8a33d; border-radius:16px; padding:8px 14px; font-size:17px; font-weight:bold; box-shadow:0 4px 0 #e8a33d; }
  .nextera { background:#4a2c12; color:#ffe066; border-radius:14px; padding:8px 12px; display:inline-block; }
  .conf { position:fixed; top:-40px; font-size:26px; pointer-events:none; animation:fall linear forwards; z-index:15; }
  @keyframes fall { to { transform:translateY(110vh) rotate(540deg);} }

  @media (max-height:460px) {
    .bubble { font-size:15px; min-height:2.4em; padding:4px 10px; } .host { width:48px; }
    .bar { min-height:46px; } .big { min-height:46px; padding:8px 18px; font-size:17px; } .ruler li { padding:3px 5px; }
  }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="homeBtn" aria-label="メニューに もどる" hidden>🏠</button>
    <h1>🍪 じょうもん クッキング</h1>
    <button class="hbtn" id="sndBtn" aria-label="おとの オン・オフ">🔊</button>
  </header>
  <main id="stage"></main>
  <footer class="ruler" aria-label="じだいの ものさし">
    <ol>
      <li class="now">じょうもん じだい</li><li>やよい</li><li>こふん</li><li>あすか</li><li>なら</li>
      <li>へいあん</li><li>かまくら</li><li>むろまち</li><li>あづちももやま</li><li>えど</li>
    </ol>
  </footer>
</div>
<div id="modal"></div>

<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var stage = $('#stage'), modal = $('#modal');

/* ---------- ほぞん ---------- */
var KEY = 'jomon-cooking-v1';
var save = { done: {}, cards: [], sound: true };
try { var j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && typeof j === 'object') { save.done = j.done || {}; save.cards = j.cards || []; save.sound = j.sound !== false; } } catch (e) {}
function store() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- おと（WebAudio の ごうせいおん） ---------- */
var ac = null;
function audio() { if (!save.sound) return null; try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; } return ac; }
function tone(f, d, type, v, at, f2) {
  var a = audio(); if (!a) return;
  var t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, v, freq) {
  var a = audio(); if (!a) return;
  var n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var s = a.createBufferSource(), g = a.createGain(), fl = a.createBiquadFilter();
  fl.type = 'bandpass'; fl.frequency.value = freq || 1200; g.gain.value = v || .2;
  s.buffer = buf; s.connect(fl); fl.connect(g); g.connect(a.destination); s.start();
}
var sfx = {
  pop: function () { tone(520, .12, 'triangle', .18, 0, 880); },
  no: function () { tone(260, .18, 'sine', .15, 0, 180); },
  crunch: function () { noise(.14, .3, 700); },

  for (var i = 0; i < s.n; i++) slots += '<span></span>';
  sc.bar.innerHTML = '<div class="slots">' + slots + '</div>';
  var items = [], cols = 4, rows = 3, cells = [];
  for (i = 0; i < s.n; i++) items.push({ good: true, html: s.good });
  (s.decoys || []).forEach(function (d) { items.push(d); });
  for (i = 0; i < cols * rows; i++) cells.push(i);
  shuffle(cells);
  items.forEach(function (it, k) {
    var c = cells[k], b = document.createElement('button');
    b.className = 'it'; b.innerHTML = s.hide || it.html; b.setAttribute('aria-label', it.good ? 'とる' : 'なにかな');
    b.style.left = (14 + (c % cols) * 24 + Math.random() * 6 - 3) + '%';
    b.style.top = (26 + Math.floor(c / cols) * 27 + Math.random() * 6 - 3) + '%';
    b.onclick = function () {
      if (b.used) return;
      if (s.hide) b.innerHTML = it.html;
      if (it.good) {
        b.used = true; got++; (s.fly ? sfx.splash : sfx.pop)(); b.classList.add(s.fly ? 'fly' : 'got');
        var sl = sc.bar.querySelectorAll('.slots span')[got - 1]; sl.innerHTML = s.good; sl.classList.add('on');
        if (got === s.n) { sfx.good(); say(s.ok); done(); }
      } else { if (s.hide) b.used = true; sfx.no(); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); say(it.say); }
    };
    f.appendChild(b);
  });
};

STEP.tap = function (s, done) {
  var sc = scene(s.say, s.bg), k = 0;
  sc.f.innerHTML = '<button class="art" aria-label="タップ">' + s.art(0) + '</button><div class="hint">👆 ' + s.hint + '</div>';
  sc.bar.innerHTML = '<div class="prog"><i></i></div>';
  var a = $('.art', sc.f);
  a.onclick = function () {
    if (k >= s.n) return;
    k++; sfx[s.sfx](); a.innerHTML = s.art(k / s.n); a.classList.remove('hit'); void a.offsetWidth; a.classList.add('hit');
    $('.prog i', sc.bar).style.width = (k / s.n * 100) + '%';
    if (k === s.n) { sfx.good(); say(s.ok); done(); }
  };
};

STEP.meter = function (s, done) {
  var sc = scene(s.say, s.bg), my = tok, t0 = performance.now(), p = 0, stop = false;
  sc.f.innerHTML = '<div class="art">' + s.art('') + '</div>';
  sc.bar.innerHTML = '<div class="meter"><b></b></div><button class="big">' + s.btn + '</button>';
  var ptr = $('.meter b', sc.bar), art = $('.art', sc.f);
  (function loop(now) {
    if (my !== tok) return;
    if (!stop) { var x = ((now - t0) / 2200) % 2; p = x < 1 ? x : 2 - x; ptr.style.left = (p * 100) + '%'; }
    requestAnimationFrame(loop);
  })(t0);
  $('.big', sc.bar).onclick = function () {
    if (stop) return; stop = true;
    var st = p < .4 ? 'early' : p > .72 ? 'late' : 'ok';
    art.innerHTML = s.art(st); say(s[st]);
    if (st === 'ok') { sfx.good(); done(); }
    else { sfx.no(); later(function () { art.innerHTML = s.art(''); say(s.say); t0 = performance.now(); stop = false; }, 1700); }
  };
};

/* どんぐりの あくぬき（ぬかずに だすと にがーい！） */
STEP.soak = function (s, done) {
  var sc = scene('どんぐりは そのままだと にがい。かわの みずに さらして、にがみを ぬこう！', 'river'), k = 0, n = 4, busy = false;
  function art() { return '<span style="font-size:.9em">🧺</span><span class="ov" style="top:18%;display:flex;width:50%;gap:2%">' + acorn() + acorn() + acorn() + '</span>' +
    '<span class="ov" style="bottom:2%;width:90%;height:22%;border-radius:50%;background:' + ['#8a5a2b', '#a8804a', '#bfae7a', '#a5d8ef', '#d0ebff'][k] + ';opacity:.85;z-index:-1"></span>'; }
  sc.f.innerHTML = '<div class="art">' + art() + '</div>';
  sc.bar.innerHTML = '<button class="big">💧 みずに さらす</button><button class="big sub">そのまま つかう</button>';
  var bs = sc.bar.querySelectorAll('button');
  bs[0].onclick = function () {
    if (busy || k >= n) return;
    k++; sfx.splash(); $('.art', sc.f).innerHTML = art();
    if (k < n) say(['', 'ちゃいろい しるが でて きた！ これが にがみ。', 'まだ すこし ちゃいろいね。もう いちど。', 'みずが きれいに なって きた！ あと 1かい。'][k]);
    else { sfx.good(); say('みずが すきとおった！ にがみが ぬけたよ。'); bs[1].hidden = true; done(); }
  };
  bs[1].onclick = function () {
    if (busy || k >= n) return; busy = true;
    say('えっ、そのまま？ じゃあ ちょっと あじみ…');
    later(function () {
      sfx.yuck();
      sc.f.innerHTML = '<div class="faces"><div class="v yuck">' + face({ host: true, ex: 'yuck' }) + '<em>に、にがーーい！！</em></div></div>';
      $('.host', stage).innerHTML = face({ host: true, ex: 'yuck' });
      say('かおが くしゃくしゃ〜！ やっぱり にがみを ぬかなくちゃ。');
      later(function () { $('.host', stage).innerHTML = HOST; sc.f.innerHTML = '<div class="art">' + art() + '</div>'; say('もう いちど。みずに さらして にがみを ぬこう！'); busy = false; }, 2600);
    }, 900);
  };
};

/* どきの もよう（がんばりすぎると おもくて もてない） */
STEP.pattern = function (s, done) {
  var sc = scene('スープを にる どきを つくろう。なわを ころがして もようを つけるよ。', 'home'), k = 0, busy = false;
  sc.f.innerHTML = '<button class="art" aria-label="もようを つける">' + pot(0) + '</button><div class="hint">👆 どきを タップで もよう</div>';
  sc.bar.innerHTML = '<button class="big green" disabled>✨ できた！</button>';
  var a = $('.art', sc.f), ok = $('.big', sc.bar);
  function heavy() {
    busy = true; ok.disabled = true; sfx.heavy(); a.style.transition = 'transform .3s';
    a.style.transform = 'translateY(-6%) rotate(-5deg)'; later(function () { a.style.transform = 'translateY(4%) rotate(4deg)'; }, 350);
    $('.host', stage).innerHTML = face({ host: true, ex: 'yuck' });
    say('うーん… もようを がんばりすぎて、お、おもくて もてない〜！');
    later(function () { $('.host', stage).innerHTML = HOST; a.style.transform = ''; k = 0; a.innerHTML = pot(0); busy = false; say('かっこいいけど、きょうは りょうり ようだから ほどほどに。もう いちど！'); }, 2800);
  }
  a.onclick = function () {
    if (busy) return;
    k++; sfx.crunch(); a.innerHTML = pot(Math.min(k, 6), k >= 6); a.classList.remove('hit'); void a.offsetWidth; a.classList.add('hit');
    ok.disabled = k < 2;
    if (k === 4) say('いい もよう！ そろそろ「できた！」を おしてね。');
    if (k === 6) say('わあ、ほのお みたいな かざりまで ついた！');
    if (k >= 7) heavy();
  };
  ok.onclick = function () {
    if (busy || k < 2) return;
    if (k >= 6) return heavy();
    busy = true; ok.disabled = true; sfx.good(); say('なわの もようが きれい！ これが じょうもん どき。'); done();
  };
};

/* つり（うきが しずんだら いまだ） */
STEP.bite = function (s, done) {
  var sc = scene('ほねや つので つくった つりばりで さかなつり。うきが しずんだら「えいっ！」', 'river'), got = 0, state = 'wait';
  sc.f.innerHTML = '<div class="float"></div>';
  sc.bar.innerHTML = '<div class="slots"><span></span><span></span></div><button class="big">🎣 えいっ！</button>';
  var fl = $('.float', sc.f);
  function arm() { state = 'wait'; fl.classList.remove('bite'); later(function () { state = 'bite'; fl.classList.add('bite'); sfx.bite();
    later(function () { if (state === 'bite') { state = 'x'; fl.classList.remove('bite'); sfx.no(); say('にげられた！ もう いちど まとう。'); later(arm, 900); } }, 1800); }, 1300 + Math.random() * 1700); }
  arm();
  $('.big', sc.bar).onclick = function () {
    if (state === 'wait') { sfx.no(); say('まだ まだ。うきが しずむまで じっと まとう。'); return; }
    if (state !== 'bite') return;
    state = 'x'; reset(); got++; sfx.splash(); fl.classList.remove('bite');
    sc.f.insertAdjacentHTML('beforeend', '<span class="jump">🐟</span>');
    var sl = sc.bar.querySelectorAll('.slots span')[got - 1]; sl.textContent = '🐟'; sl.classList.add('on');
    if (got === s.n) { sfx.good(); say('おおきな さかなが つれた！'); done(); }
    else { say('つれた！ もう 1ぴき つろう。'); later(arm, 1000); }
  };
};

/* やく（いぬの コロが つまみぐい） */
STEP.grill = function (s, done) {
  var sc = scene('くしに さして、ひの そばで やこう。ひを タップして ふーふー！', 'fire'), k = 0, n = 8, dogState = '';
  sc.f.innerHTML = '<div class="fishrow"><span>🐟</span><span>🐟</span><span>🐟</span></div><button class="fireE" aria-label="ひを おこす">🔥</button><button class="dog" aria-label="いぬの コロ">🐕</button>';
  sc.bar.innerHTML = '<div class="prog"><i></i></div>';
  var fish = sc.f.querySelectorAll('.fishrow span'), dog = $('.dog', sc.f), fire = $('.fireE', sc.f);
  dog.onclick = function () {
    if (dogState !== 'go') return;
    dogState = 'sit'; dog.style.right = getComputedStyle(dog).right; dog.classList.add('sit'); sfx.woof();
    say('コロ、おすわり！ やけたら わけて あげるからね。');
  };
  fire.onclick = function () {
    if (k >= n) return;
    k++; sfx.fire(); fire.style.transform = 'scale(' + (1 + k * .08) + ')';
    fish.forEach(function (f) { f.style.filter = 'sepia(' + (k / n) + ') saturate(' + (1 + k / n * 2) + ') brightness(' + (1 - k / n * .25) + ')'; });
    $('.prog i', sc.bar).style.width = (k / n * 100) + '%';
    if (k === 2) { dogState = 'go'; dog.classList.add('go'); say('あれ？ コロが くんくん ちかづいて きた。タップして「おすわり」！');
      later(function () { if (dogState !== 'go') return; dogState = 'ate'; fish[2].classList.add('gone'); sfx.woof(); dog.classList.add('sit');
        say('あっ！ コロが つまみぐい！ …おなかが すいてたんだね。あはは。'); }, 4600); }
    if (k === n) { if (dogState === 'go') { dogState = 'sit'; dog.style.right = getComputedStyle(dog).right; dog.classList.add('sit'); }
      later(function () { sfx.good(); say('こんがり やけた！ いい におい〜'); done(); }, dogState === 'ate' ? 1200 : 100); }
  };
};

/* むらの ひとの リアクション */
STEP.react = function (s, done) {
  var d = cur.d, sc = scene('できた！ むらの みんな、めしあがれ〜！', 'home'), h = '';
  V.forEach(function (v, i) { h += '<div class="v' + (i === 1 ? ' spin' : '') + '">' + face({ skin: v.skin, hair: v.hair, bun: v.bun, ex: i === 1 ? 'wow' : 'smile' }) + '<em>' + d.lines[i] + '</em></div>'; });
  sc.f.innerHTML = '<div class="faces">' + h + '</div><span class="dish">' + d.e + (s.dog ? '🐕' : '') + '</span>';
  var vs = sc.f.querySelectorAll('.v');
  [0, 1, 2].forEach(function (i) { later(function () { vs[i].classList.add('in'); sfx.pop(); tone(500 + i * 150, .3, 'triangle', .15, .1, 900 + i * 200); }, 500 + i * 800); });
  later(function () {
    say(s.dog ? 'コロも しっぽ ふりふり。みんな おおよろこび！' : 'みんな とびあがって おおよろこび！'); confetti(14);
    sc.bar.innerHTML = '<button class="big">▶ つぎへ</button>';
    $('.big', sc.bar).onclick = function () { sfx.pop(); next(); };
  }, 3200);
};

function confetti(n) {
  var t = tok;
  for (var i = 0; i < n; i++) (function (i) {
    var c = document.createElement('span'); c.className = 'conf'; c.textContent = ['✨', '⭐', '🌰', '🐚', '🎉'][i % 5];
    c.style.left = (Math.random() * 96) + 'vw'; c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; c.style.animationDelay = (Math.random() * .8) + 's';
    document.body.appendChild(c); setTimeout(function () { c.remove(); }, 4200);
  })(i);
}

function result() {
  reset(); var d = cur.d, c = CARDS[d.card], isNew = save.cards.indexOf(d.card) < 0;
  save.done[d.id] = (save.done[d.id] || 0) + 1; if (isNew) save.cards.push(d.card); store();
  sfx.fanfare(); confetti(28);
  stage.innerHTML = '<div class="result"><h2>🎉 できあがり！</h2><span class="e">' + d.e + '</span>' +
    '<p>' + d.name + 'が じょうずに できたね！<br>すごい！ じょうもんの りょうりにん だ！</p>' +
    '<button class="getcard">🃏 ' + (isNew ? 'まなび カード ゲット！' : 'まなび カード') + '「' + c.n + '」</button>' +
    '<p><span class="nextera">つぎは どんな じだい？<br>つぎは「やよい じだい」。たんぼで おこめを つくる くらしが ひろまるよ！</span></p>' +
    '<div class="row"><button class="big" id="rMenu">🍽️ ほかの りょうり</button><button class="big sub" id="rAgain">🔁 もういちど</button></div></div>';
  $('.getcard', stage).onclick = function () { showCard(d.card); };
  $('#rMenu').onclick = home; $('#rAgain').onclick = function () { startDish(d); };
}

function showCard(id) {
  var c = CARDS[id]; sfx.pop();
  modal.innerHTML = '<div class="mbox"><div>' + c.art() + '</div><h2>' + c.n + '</h2><p>' + c.t + '</p><small>おうちの かたへ: ' + c.p + '</small><button class="big">とじる</button></div>';
  modal.classList.add('on');
  $('.big', modal).onclick = function () { modal.classList.remove('on'); };
}
modal.onclick = function (e) { if (e.target === modal) modal.classList.remove('on'); };

function cardsScreen() {
  reset(); cur = null; $('#homeBtn').hidden = false;
  var h = '';
  Object.keys(CARDS).forEach(function (id) { var c = CARDS[id], has = save.cards.indexOf(id) >= 0;
    h += '<button class="lc' + (has ? '' : ' lock') + '" data-id="' + id + '">' + (has ? c.art() + '<br>' + c.n : '<span class="e">？</span>りょうりを つくると もらえるよ') + '</button>'; });
  stage.innerHTML = '<div class="talk"><div class="host">' + HOST + '</div><div class="bubble">あつめた まなび カード。タップで よめるよ！</div></div><div class="scroll"><div class="cards">' + h + '</div></div>';
  stage.querySelectorAll('.lc').forEach(function (b) { b.onclick = function () { if (b.classList.contains('lock')) { sfx.no(); return; } showCard(b.dataset.id); }; });
}

function home() {
  reset(); cur = null; $('#homeBtn').hidden = true;
  var h = '', nextId = null;
  DISHES.forEach(function (d) { if (!nextId && !save.done[d.id]) nextId = d.id; });
  DISHES.forEach(function (d) {
    h += '<button class="mcard' + (d.id === nextId ? ' next' : '') + '" data-id="' + d.id + '"><span class="s s-' + d.sc + '">' + d.season + '</span>' +
      (save.done[d.id] ? '<span class="st">⭐</span>' : '') + '<span class="e">' + d.e + '</span><span class="n">' + d.name + '</span></button>';
  });
  var all = DISHES.every(function (d) { return save.done[d.id]; });
  stage.innerHTML = '<div class="talk"><div class="host">' + HOST + '</div><div class="bubble">' +
    (all ? 'ぜんぶ つくれたね！ すごい！ すきな りょうりを また つくろう。' : 'こんにちは！ じょうもん クッキングの じかんです。しかいの ドキです。きょうは なにを つくる？') + '</div></div>' +
    '<div class="scroll"><div class="menu">' + h + '</div>' +
    '<div class="row"><button class="big sub" id="cardBtn">🃏 まなび カード ' + save.cards.length + '/6</button></div>' +
    '<details><summary>おうちの かたへ</summary>' +
    '縄文時代（約1万6000年前〜約2400年前。年代は諸説あります）の人びとは、狩り・漁・木の実などの採集で食べものを集め、土器で煮て食べていました。食べものは季節で変わり、春は貝や山菜、夏は魚、秋は木の実やきのこ、冬は狩りが中心だったと考えられています。<br>' +
    '・どんぐりの多くは渋み（アク）があり、水にさらしたり煮たりして抜きました。<br>' +
    '・「縄文クッキー」は、クッキーのような形の炭化物が遺跡から見つかったことからの呼び名です。木の実のでんぷんが主な材料と考えられていますが、くわしい作り方は分かっていません。このアプリの手順は想像をまじえています。<br>' +
    '・青森県の三内丸山遺跡では、くりの林を人が手入れしていたと考えられています。水田での米づくりが広まるのは次の弥生時代です（「くりごはん ふう」はお米なしの想像メニュー）。<br>' +
    '・「ドキさん」やコロは番組の案内役で、実在の人物ではありません。文字のない時代なので、名前の伝わる人はいません。<br>' +
    '・野生のきのこは、ぜったいに子どもだけで採ったり食べたりしないよう お話しください。</details></div>';
  stage.querySelectorAll('.mcard').forEach(function (b) { b.onclick = function () { sfx.pop(); startDish(DISHES.filter(function (d) { return d.id === b.dataset.id; })[0]); }; });
  $('#cardBtn').onclick = function () { sfx.pop(); cardsScreen(); };
}

var sndBtn = $('#sndBtn');
function sndLabel() { sndBtn.textContent = save.sound ? '🔊' : '🔇'; sndBtn.setAttribute('aria-pressed', save.sound ? 'true' : 'false'); }
sndBtn.onclick = function () { save.sound = !save.sound; store(); sndLabel(); if (save.sound) sfx.pop(); };
$('#homeBtn').onclick = function () { sfx.pop(); home(); };
sndLabel(); home();
})();
