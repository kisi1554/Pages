<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かんじタマゴ</title>
<meta name="description" content="タマゴから かんじのモンスターが 生まれる。小学1年の漢字を、1体ずつ手描きしたモンスターで じゅんばんに 公開中。カードを あつめて、読みかた・つかいかた・つかわれている駅を おぼえよう。">
<meta name="theme-color" content="#f4832a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<div class="wrap">

  <header>
    <h1>かんじタマゴ</h1>
    <span class="count">ずかん <span id="zukanCount">0 / 12</span></span>
    <button class="icon-btn" id="btnSound" type="button" aria-label="音を けす">🔊</button>
  </header>

  <!-- ============ タマゴ ============ -->
  <section class="screen on" data-screen="egg">
    <div class="egg-stage">
      <div class="egg-wobble" id="eggArt"></div>
      <p class="speech" id="homeMsg">なかから なにか きこえる…</p>
    </div>

    <button class="btn" id="btnEgg" type="button">
      タマゴを わる！
      <small>なんども わっていいよ</small>
    </button>

    <button class="btn gold" id="btnFeast" type="button">
      ごちそうタマゴ（<span id="feastN">1</span>こ）
      <small>レアが 出やすい ★ クイズに せいかいすると もらえる</small>
    </button>

    <footer>
      これまでに <span id="seenN">0</span>こ わって、<span id="gotN">0</span>しゅるいと なかよしに なったよ
    </footer>
  </section>

  <!-- ============ ずかん ============ -->
  <section class="screen" data-screen="zukan">
    <div class="ztabs" id="ztabs"></div>
    <div class="zukan" id="zukan"></div>
    <footer>カードを おすと、かんじの よみかた・つかいかた・えきが 見られるよ</footer>
  </section>

  <!-- ============ クイズ ============ -->
  <section class="screen" data-screen="quiz">
    <p class="quiz-q" id="quizQ"></p>
    <div class="choices" id="choices"></div>
    <p class="quiz-res" id="quizRes"></p>
    <button class="btn" id="quizNext" type="button" style="display:none">つぎの もんだい</button>
    <footer>せいかいすると「ごちそうタマゴ」が 1こ もらえる</footer>
  </section>

</div>

<nav>
  <button type="button" data-go="egg" class="on"><span class="ic">🥚</span>タマゴ</button>
  <button type="button" data-go="zukan"><span class="ic">📔</span>ずかん</button>
  <button type="button" data-go="quiz"><span class="ic">❓</span>クイズ</button>
</nav>

<!-- ============ ふ化の えんしゅつ ============ -->
<div class="hatch" id="hatch" aria-live="polite">
  <div class="rays" id="hatchRays"></div>
  <div class="glow"></div>
  <div class="flash"></div>
  <div class="hatch-inner">
    <div class="egg-big" id="hatchEgg"></div>
    <i class="spark" style="--sx:-110px;--sy:-90px;animation-delay:.0s"></i>
    <i class="spark" style="--sx:120px;--sy:-70px;animation-delay:.25s"></i>
    <i class="spark" style="--sx:-140px;--sy:40px;animation-delay:.5s"></i>
    <i class="spark" style="--sx:130px;--sy:70px;animation-delay:.75s"></i>
    <i class="spark" style="--sx:-40px;--sy:-140px;animation-delay:.35s"></i>
    <i class="spark" style="--sx:60px;--sy:150px;animation-delay:.6s"></i>
    <div class="reveal">
      <p class="lead" id="hatchLead"></p>
      <div id="hatchMon"></div>
      <div class="nameplate" id="hatchName"></div>
      <span class="rare" id="hatchRare"></span>
    </div>
    <div id="confetti"></div>
    <button class="tap" id="hatchTap" type="button">カードを 見る</button>
  </div>
</div>

<!-- ============ カード ============ -->
<div class="card-view" id="cardView">
  <div id="cardBox"></div>
  <button class="btn" id="cardClose" type="button">とじる</button>
</div>

<script src="data.js?v=4c5eb3f"></script>
<script src="monsters.js?v=4c5eb3f"></script>
<script src="speech.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
