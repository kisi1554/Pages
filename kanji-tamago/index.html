<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんじタマゴ</title>
<meta name="description" content="タマゴから かんじのモンスターが 生まれる。小学1年の漢字を、1体ずつ手描きしたモンスターで じゅんばんに 公開中。カードを あつめて、読みかた・つかいかた・つかわれている駅を おぼえよう。">
<meta name="theme-color" content="#f4832a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header>
    <h1>かんじタマゴ</h1>
    <span class="count">ずかん <span id="zukanCount">0 / 12</span></span>
    <button class="icon-btn" id="btnSound" type="button" aria-label="音を けす">🔊</button>
  </header>

  <!-- ============ タマゴ ============ -->
  <section class="screen on" data-screen="egg">
    <div class="egg-stage">
      <div class="egg-wobble" id="eggArt"></div>
      <p class="speech" id="homeMsg">なかから なにか きこえる…</p>
    </div>

    <button class="btn" id="btnEgg" type="button">
      タマゴを わる！
      <small>なんども わっていいよ</small>
    </button>

    <button class="btn gold" id="btnFeast" type="button">
      ごちそうタマゴ（<span id="feastN">1</span>こ）
      <small>レアが 出やすい ★ クイズに せいかいすると もらえる</small>
    </button>

    <footer>
      これまでに <span id="seenN">0</span>こ わって、<span id="gotN">0</span>しゅるいと なかよしに なったよ
    </footer>
  </section>

  <!-- ============ ずかん ============ -->
  <section class="screen" data-screen="zukan">
    <div class="ztabs" id="ztabs"></div>
    <div class="zukan" id="zukan"></div>
    <footer>カードを おすと、かんじの よみかた・つかいかた・えきが 見られるよ</footer>
  </section>

  <!-- ============ クイズ ============ -->
  <section class="screen" data-screen="quiz">
    <p class="quiz-q" id="quizQ"></p>
    <div class="choices" id="choices"></div>
    <p class="quiz-res" id="quizRes"></p>
    <button class="btn" id="quizNext" type="button" style="display:none">つぎの もんだい</button>
    <footer>せいかいすると「ごちそうタマゴ」が 1こ もらえる</footer>
  </section>

</div>

<nav>
  <button type="button" data-go="egg" class="on"><span class="ic">🥚</span>タマゴ</button>
  <button type="button" data-go="zukan"><span class="ic">📔</span>ずかん</button>
  <button type="button" data-go="quiz"><span class="ic">❓</span>クイズ</button>
</nav>

<!-- ============ ふ化の えんしゅつ ============ -->
<div class="hatch" id="hatch" aria-live="polite">
  <div class="rays" id="hatchRays"></div>
  <div class="glow"></div>
  <div class="flash"></div>
  <div class="hatch-inner">
    <div class="egg-big" id="hatchEgg"></div>
    <i class="spark" style="--sx:-110px;--sy:-90px;animation-delay:.0s"></i>
    <i class="spark" style="--sx:120px;--sy:-70px;animation-delay:.25s"></i>
    <i class="spark" style="--sx:-140px;--sy:40px;animation-delay:.5s"></i>
    <i class="spark" style="--sx:130px;--sy:70px;animation-delay:.75s"></i>
    <i class="spark" style="--sx:-40px;--sy:-140px;animation-delay:.35s"></i>
    <i class="spark" style="--sx:60px;--sy:150px;animation-delay:.6s"></i>
    <div class="reveal">
      <p class="lead" id="hatchLead"></p>
      <div id="hatchMon"></div>
      <div class="nameplate" id="hatchName"></div>
      <span class="rare" id="hatchRare"></span>
    </div>
    <div id="confetti"></div>
    <button class="tap" id="hatchTap" type="button">カードを 見る</button>
  </div>
</div>

<!-- ============ カード ============ -->
<div class="card-view" id="cardView">
  <div id="cardBox"></div>
  <button class="btn" id="cardClose" type="button">とじる</button>
</div>

<script src="data.js"></script>
<script src="monsters.js"></script>
<script src="speech.js"></script>
<script src="app.js"></script>
</body>
</html>
