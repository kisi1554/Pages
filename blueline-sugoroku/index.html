<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ブルーライン＆でんえんとしせん すごろく：しょうなんだい〜ちゅうおうりんかん</title>
<style>
  :root{
    --line-blue:#0089CF;
    --line-blue-deep:#005D96;
    --paper:#FFFDF6;
    --paper-2:#EEF6FC;
    --paper-3:#FFFFFF;
    --ink:#182430;
    --ink-soft:#5B6B78;
    --amber:#FFB100;
    --amber-deep:#D98600;
    --team-a:#E8483C;
    --team-a-deep:#B93327;
    --team-b:#2E9E5B;
    --team-b-deep:#1F7A44;
    --atk-back:#C1440E;
    --atk-skip:#6C4FC9;
    --line-green:#1F9E7A;
    --line-green-deep:#14735A;
    --on-accent:#2B1600;
    --shadow: 0 6px 16px rgba(14,40,60,0.12);
    --tile-h: 120px;
    color-scheme: light;
  }
  @media (max-width:760px){
    :root{ --tile-h: 106px; }
  }
  @media (max-width:520px){
    :root{ --tile-h: 96px; }
    .tile .chip{ font-size:.5rem; padding:1px 4px; }
  }
  @media (prefers-color-scheme: dark){
    :root{
      --line-blue:#57C2F5;
      --line-blue-deep:#2E8FC4;
      --paper:#101720;
      --paper-2:#182230;
      --paper-3:#1D2836;
      --ink:#EEF4F9;
      --ink-soft:#93A4B2;
      --amber:#FFC53D;
      --amber-deep:#E0A020;
      --team-a:#FF6E5E;
      --team-a-deep:#D9483A;
      --team-b:#4FCB88;
      --team-b-deep:#2F9E63;
      --atk-back:#FF9F5A;
      --atk-skip:#B7A6FF;
      --line-green:#4FD9B0;
      --line-green-deep:#2FAE8C;
      --shadow: 0 6px 20px rgba(0,0,0,0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --line-blue:#57C2F5;
    --line-blue-deep:#2E8FC4;
    --paper:#101720;
    --paper-2:#182230;
    --paper-3:#1D2836;
    --ink:#EEF4F9;
    --ink-soft:#93A4B2;
    --amber:#FFC53D;
    --amber-deep:#E0A020;
    --team-a:#FF6E5E;
    --team-a-deep:#D9483A;
    --team-b:#4FCB88;
    --team-b-deep:#2F9E63;
    --atk-back:#FF9F5A;
    --atk-skip:#B7A6FF;
    --line-green:#4FD9B0;
    --line-green-deep:#2FAE8C;
    --shadow: 0 6px 20px rgba(0,0,0,0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --line-blue:#0089CF;
    --line-blue-deep:#005D96;
    --paper:#FFFDF6;
    --paper-2:#EEF6FC;
    --paper-3:#FFFFFF;
    --ink:#182430;
    --ink-soft:#5B6B78;
    --amber:#FFB100;
    --amber-deep:#D98600;
    --team-a:#E8483C;
    --team-a-deep:#B93327;
    --team-b:#2E9E5B;
    --team-b-deep:#1F7A44;
    --atk-back:#C1440E;
    --atk-skip:#6C4FC9;
    --line-green:#1F9E7A;
    --line-green-deep:#14735A;
    --shadow: 0 6px 16px rgba(14,40,60,0.12);
    color-scheme: light;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:"UD デジタル教科書体 N-B","UDデジタル教科書体N-B","BIZ UDGothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 18px 14px 40px;
  }
  .wrap{ max-width: 1600px; margin: 0 auto; display:flex; flex-direction:column; gap:18px; }
  header, .legend, .status-bar, .panel{ max-width: 900px; width:100%; margin-left:auto; margin-right:auto; }

  header{ text-align:center; }
  h1{
    margin:0 0 4px;
    font-size: clamp(1.5rem, 4.5vw, 2.3rem);
    font-weight:900;
    color: var(--line-blue-deep);
    text-wrap: balance;
    letter-spacing:.02em;
  }
  h1 ruby{ ruby-align:center; }
  h1 rt{ font-size:0.4em; color: var(--ink-soft); font-weight:700; }
  header p{ margin:0; color:var(--ink-soft); font-size:1rem; font-weight:700; }

  .legend{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
  }
  .legend span{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--paper-2); border-radius:999px; padding:6px 14px;
    font-size:.85rem; font-weight:700; color:var(--ink-soft);
    box-shadow: var(--shadow);
  }

  .status-bar{ display:flex; gap:14px; flex-wrap:wrap; }
  .team-card{
    flex:1 1 220px;
    background:var(--paper-3);
    border-radius:20px;
    padding:14px 16px;
    display:flex; align-items:center; gap:12px;
    box-shadow:var(--shadow);
    border:3px solid transparent;
    transition: border-color .25s ease, transform .25s ease;
  }
  .team-card.active{
    border-color: var(--card-color);
    transform: translateY(-2px);
  }
  .team-card .badge{
    width:52px; height:52px; border-radius:50%;
    background: var(--card-color);
    display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; flex:none;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18);
  }
  .team-card .info{ min-width:0; }
  .team-card .name{ font-weight:900; color:var(--card-color-deep); font-size:1.05rem; }
  .team-card .where{ font-size:.85rem; color:var(--ink-soft); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-card .turn-tag{
    margin-left:auto; font-size:.75rem; font-weight:900; color:var(--card-color-deep);
    background: color-mix(in srgb, var(--card-color) 18%, transparent);
    padding:4px 10px; border-radius:999px; white-space:nowrap;
    opacity:0; transform:scale(.8);
  }
  .team-card.active .turn-tag{ opacity:1; transform:scale(1); }
  @media (prefers-reduced-motion: no-preference){
    .team-card.active .turn-tag{ animation: pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }

  .board-scroll{ overflow-x:auto; padding: 4px 4px 10px; }
  .board{ display:flex; flex-direction:column; gap:30px; width:100%; }
  .track-row{ display:grid; gap:8px; position:relative; }
  .track-row.reverse{ direction:rtl; }
  .track-row::before{
    content:""; position:absolute; left:6px; right:6px; top:50%;
    height:10px; margin-top:-5px; border-radius:6px;
    background: var(--line-blue); z-index:0;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .track-row.line-alt::before{ background: var(--line-green); }

  .tile{
    position:relative; z-index:1; direction:ltr;
    min-width:0; min-height:var(--tile-h);
    background:var(--paper-3); border-radius:16px;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:6px 4px;
    border:3px solid var(--paper-2);
    text-align:center;
  }
  .tile.tight .kanji{ font-size: clamp(.56rem, 1.3vw, .76rem); }
  .tile.tight rt{ font-size:.5em; }
  .tile .num{
    position:absolute; top:-9px; left:-9px;
    width:24px; height:24px; border-radius:50%;
    background:var(--line-blue); color:#fff; font-weight:900;
    font-size:.72rem; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .tile .kanji{ font-weight:900; font-size: clamp(.72rem, 1.6vw, .95rem); line-height:1.15; }
  .tile ruby{ ruby-align:center; }
  .tile rt{ font-size:.55em; color:var(--ink-soft); font-weight:700; }
  .tile .chip{
    font-size:.58rem; font-weight:900; border-radius:999px; padding:1px 6px;
    max-width:100%;
  }
  .chip-back{ background: color-mix(in srgb, var(--atk-back) 22%, transparent); color:var(--atk-back); }
  .chip-skip{ background: color-mix(in srgb, var(--atk-skip) 22%, transparent); color:var(--atk-skip); }
  .chip-transfer{ background: color-mix(in srgb, var(--line-green) 22%, transparent); color:var(--line-green-deep); }
  .tile.start{ border-color: var(--team-b); }
  .tile.transfer{ border-color: var(--line-green-deep); }
  .tile.goal{ border-color: var(--amber); background: linear-gradient(180deg, var(--paper-3), color-mix(in srgb, var(--amber) 14%, var(--paper-3))); }
  .tile .tag{ font-size:.62rem; font-weight:900; color:var(--amber-deep); }

  .tokens{ position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:3; }
  .token{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; box-shadow: var(--shadow);
    border:2px solid var(--paper-3);
  }
  .token.a{ background: var(--team-a); }
  .token.b{ background: var(--team-b); }
  @media (prefers-reduced-motion: no-preference){
    .token{ animation: hop .32s ease; }
  }
  @keyframes hop{ 0%{ transform: translateY(0) scale(1);} 40%{ transform: translateY(-14px) scale(1.15);} 100%{ transform: translateY(0) scale(1);} }

  .corner-arrow{
    position:absolute; bottom:-24px; width:26px; height:26px; border-radius:50%;
    background:var(--amber); color:#fff; font-weight:900; font-size:.85rem;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); z-index:2;
  }
  .corner-arrow.right{ right:-10px; }
  .corner-arrow.left{ left:-10px; }

  .panel{
    background:var(--paper-3); border-radius:22px; padding:18px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .dice-row{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; }
  #diceFace{
    width:140px; height:140px; border-radius:32px;
    background: var(--paper-2); color:var(--line-blue-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:5.5rem; box-shadow: inset 0 0 0 5px var(--paper-3), var(--shadow);
  }
  #rollBtn{
    font-family:inherit; font-weight:900; font-size:1.15rem; color:var(--on-accent);
    background: linear-gradient(180deg, var(--amber), var(--amber-deep));
    border:none; border-radius:999px; padding:20px 34px; cursor:pointer;
    box-shadow: 0 6px 0 var(--amber-deep), var(--shadow);
    transition: transform .08s ease;
  }
  #rollBtn:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--amber-deep); }
  #rollBtn:disabled{ opacity:.55; cursor:not-allowed; }
  #rollBtn:focus-visible, .mute-btn:focus-visible{ outline:3px solid var(--line-blue); outline-offset:2px; }

  #message{
    font-size:1.1rem; font-weight:800; text-align:center; color:var(--ink);
    background:var(--paper-2); border-radius:16px; padding:14px 18px; min-height:1.6em;
    max-width:560px;
  }

  #restartBtn{
    font-family:inherit; font-weight:900; font-size:1rem; color:#fff;
    background: linear-gradient(180deg, var(--line-blue), var(--line-blue-deep));
    border:none; border-radius:999px; padding:12px 26px; cursor:pointer;
    box-shadow: 0 5px 0 var(--line-blue-deep);
  }
  #restartBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--line-blue-deep); }
  #restartBtn[hidden]{ display:none; }

  .top-row{ display:flex; justify-content:flex-end; }
  .mute-btn{
    background:var(--paper-2); border:none; border-radius:999px; width:40px; height:40px;
    font-size:1.1rem; cursor:pointer; box-shadow:var(--shadow); color:var(--ink);
  }

  .confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
  .confetti span{
    position:absolute; top:-20px; font-size:1.4rem; opacity:0;
  }
  @media (prefers-reduced-motion: no-preference){
    .confetti span{ animation: fall linear forwards; }
  }
  @keyframes fall{
    0%{ opacity:1; transform: translateY(0) rotate(0deg); }
    100%{ opacity:1; transform: translateY(100vh) rotate(360deg); }
  }

  .quiz-backdrop{
    position:fixed; inset:0; background:rgba(10,20,30,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:70;
  }
  .quiz-backdrop[hidden]{ display:none; }
  .quiz-card{
    background:var(--paper-3); border-radius:24px; padding:26px;
    max-width:420px; width:100%; box-shadow:var(--shadow);
    text-align:center; display:flex; flex-direction:column; gap:14px;
  }
  .quiz-title{ font-weight:900; font-size:1.05rem; color:var(--atk-back); }
  .quiz-question{ font-weight:900; font-size:1.2rem; line-height:1.5; }
  .quiz-kanji{ display:block; font-size:3.6rem; line-height:1.2; color:var(--line-blue-deep); }
  .quiz-choices{ display:flex; flex-direction:column; gap:10px; }
  .quiz-choice{
    font-family:inherit; font-weight:900; font-size:1.05rem;
    padding:14px; border-radius:16px; border:3px solid var(--paper-2);
    background:var(--paper-2); color:var(--ink); cursor:pointer;
  }
  .quiz-choice:disabled{ cursor:default; }
  .quiz-choice.correct{ background: color-mix(in srgb, var(--team-b) 30%, var(--paper-3)); border-color:var(--team-b-deep); }
  .quiz-choice.wrong{ background: color-mix(in srgb, var(--team-a) 25%, var(--paper-3)); border-color:var(--team-a-deep); }
  .quiz-result{ font-weight:900; font-size:1.1rem; min-height:1.5em; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->

<body>

<div class="wrap">
  <div class="top-row"><button class="mute-btn" id="muteBtn" title="おとを けす／だす" aria-label="おとを けす／だす">🔊</button></div>
  <header>
    <h1><ruby>横浜<rt>よこはま</rt></ruby>ブルーライン＆でんえんとしせん すごろく</h1>
    <p><ruby>湘南台<rt>しょうなんだい</rt></ruby>えき から <ruby>あざみ野<rt>あざみの</rt></ruby>えきで のりかえて、<ruby>中央林間<rt>ちゅうおうりんかん</rt></ruby>えき まで すすもう！</p>
  </header>

  <div class="legend">
    <span>🎲 じゅんばんに サイコロを ふってね</span>
    <span>🧠 とまった えきで あいてに かんじクイズ！ まちがえると こうげきが あたる</span>
    <span>🔙💤 こうげきの ないようは マスに かいてあるよ</span>
    <span>🔀 あざみ野で でんえんとしせんに のりかえ</span>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <div class="board-scroll">
    <div class="board" id="board"></div>
  </div>

  <div class="panel">
    <div class="dice-row">
      <div id="diceFace">⚀</div>
      <button id="rollBtn">サイコロを ふる！</button>
    </div>
    <div id="message">🚃 あおちゃんの ばんだよ！ サイコロを ふってね！</div>
    <button id="restartBtn" hidden>もういちど あそぶ</button>
  </div>
</div>

<div class="quiz-backdrop" id="quizBackdrop" hidden>
  <div class="quiz-card">
    <div class="quiz-title" id="quizTitle"></div>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-choices" id="quizChoices"></div>
    <div class="quiz-result" id="quizResult"></div>
  </div>
</div>

<script>
(function(){
  var stations = [
    {k:"湘南台", h:"しょうなんだい"},
    {k:"下飯田", h:"しもいいだ"},
    {k:"立場", h:"たてば"},
    {k:"中田", h:"なかだ"},
    {k:"踊場", h:"おどりば"},
    {k:"戸塚", h:"とつか"},
    {k:"舞岡", h:"まいおか"},
    {k:"下永谷", h:"しもながや"},
    {k:"上永谷", h:"かみながや"},
    {k:"港南中央", h:"こうなんちゅうおう"},
    {k:"上大岡", h:"かみおおおか"},
    {k:"弘明寺", h:"ぐみょうじ"},
    {k:"蒔田", h:"まいた"},
    {k:"吉野町", h:"よしのちょう"},
    {k:"阪東橋", h:"ばんどうばし"},
    {k:"伊勢佐木長者町", h:"いせざきちょうじゃまち"},
    {k:"関内", h:"かんない"},
    {k:"桜木町", h:"さくらぎちょう"},
    {k:"高島町", h:"たかしまちょう"},
    {k:"横浜", h:"よこはま"},
    {k:"三ツ沢下町", h:"みつざわしもちょう"},
    {k:"三ツ沢上町", h:"みつざわかみちょう"},
    {k:"片倉町", h:"かたくらちょう"},
    {k:"岸根公園", h:"きしねこうえん"},
    {k:"新横浜", h:"しんよこはま"},
    {k:"北新横浜", h:"きたしんよこはま"},
    {k:"新羽", h:"にっぱ"},
    {k:"仲町台", h:"なかまちだい"},
    {k:"センター南", h:"せんたーみなみ"},
    {k:"センター北", h:"せんたーきた"},
    {k:"中川", h:"なかがわ"},
    {k:"あざみ野", h:"あざみの", transfer:true},
    {k:"江田", h:"えだ"},
    {k:"市が尾", h:"いちがお"},
    {k:"藤が丘", h:"ふじがおか"},
    {k:"青葉台", h:"あおばだい"},
    {k:"田奈", h:"たな"},
    {k:"長津田", h:"ながつた"},
    {k:"つくし野", h:"つくしの"},
    {k:"すずかけ台", h:"すずかけだい"},
    {k:"南町田グランベリーパーク", h:"みなみまちだグランベリーパーク"},
    {k:"つきみ野", h:"つきみの"},
    {k:"中央林間", h:"ちゅうおうりんかん"}
  ];
  var GOAL = stations.length - 1;
  var COLS = 16;
  var TRANSFER = -1;
  for(var si=0; si<stations.length; si++){ if(stations[si].transfer){ TRANSFER = si; break; } }

  var ATTACKS = [
    {type:"back", n:1, icon:"🔙", label:"1つ もどす"},
    {type:"skip", icon:"💤", label:"1かい やすみ"},
    {type:"back", n:2, icon:"🔙", label:"2つ もどす"},
    {type:"back", n:1, icon:"🔙", label:"1つ もどす"},
    {type:"skip", icon:"💤", label:"1かい やすみ"},
    {type:"back", n:3, icon:"🔙", label:"3つ もどす"}
  ];
  for(var ai=1; ai<stations.length-1; ai++){
    stations[ai].attack = ATTACKS[(ai-1) % ATTACKS.length];
  }

  var DICE_FACES = ["","⚀","⚁","⚂","⚃","⚄","⚅"];

  var players = [
    {key:"a", name:"あおちゃん", emoji:"🚃", color:"var(--team-a)", colorDeep:"var(--team-a-deep)", pos:0, skip:false},
    {key:"b", name:"パパ", emoji:"🚋", color:"var(--team-b)", colorDeep:"var(--team-b-deep)", pos:0, skip:false}
  ];
  var turn = 0;
  var busy = false;
  var over = false;
  var muted = false;
  var audioCtx = null;

  var boardEl = document.getElementById("board");
  var statusEl = document.getElementById("statusBar");
  var messageEl = document.getElementById("message");
  var diceFaceEl = document.getElementById("diceFace");
  var rollBtn = document.getElementById("rollBtn");
  var restartBtn = document.getElementById("restartBtn");
  var muteBtn = document.getElementById("muteBtn");
  var quizBackdrop = document.getElementById("quizBackdrop");
  var quizTitleEl = document.getElementById("quizTitle");
  var quizQuestionEl = document.getElementById("quizQuestion");
  var quizChoicesEl = document.getElementById("quizChoices");
  var quizResultEl = document.getElementById("quizResult");

  function currentPlayer(){ return players[turn]; }

  var cornerMap = {};

  function buildRows(){
    var rows = [];
    var i = 0, rowIndex = 0;
    while(i < stations.length){
      var end = Math.min(i + COLS - 1, stations.length - 1);
      rows.push({list: range(i, end), reverse: (rowIndex % 2 === 1)});
      i = end + 1;
      rowIndex++;
    }
    return rows;
  }

  function buildBoard(){
    boardEl.innerHTML = "";
    cornerMap = {};
    var rows = buildRows();
    rows.forEach(function(row, idx){
      if(idx < rows.length - 1){
        var last = row.list[row.list.length - 1];
        cornerMap[last] = row.reverse ? "left" : "right";
      }
      var isAlt = row.list[0] > TRANSFER;
      var rowEl = document.createElement("div");
      rowEl.className = "track-row" + (row.reverse ? " reverse" : "") + (isAlt ? " line-alt" : "");
      rowEl.style.gridTemplateColumns = "repeat(" + COLS + ", minmax(60px, 1fr))";
      row.list.forEach(function(i){
        rowEl.appendChild(buildTile(i));
      });
      boardEl.appendChild(rowEl);
    });
  }

  function range(a,b){ var out=[]; for(var i=a;i<=b;i++) out.push(i); return out; }

  function makeRuby(st){
    var r = document.createElement("ruby");
    r.appendChild(document.createTextNode(st.k));
    var rt = document.createElement("rt");
    rt.textContent = st.h;
    r.appendChild(rt);
    return r;
  }

  function buildTile(i){
    var st = stations[i];
    var tile = document.createElement("div");
    tile.className = "tile";
    if(i===0) tile.classList.add("start");
    if(i===GOAL) tile.classList.add("goal");
    if(st.transfer) tile.classList.add("transfer");
    if(st.k.length > 6) tile.classList.add("tight");

    var num = document.createElement("div");
    num.className = "num";
    num.textContent = (i+1);
    tile.appendChild(num);

    if(i===0){
      var tag0 = document.createElement("div");
      tag0.className = "tag";
      tag0.textContent = "しゅっぱつ！";
      tile.appendChild(tag0);
    }
    if(i===GOAL){
      var tagG = document.createElement("div");
      tagG.className = "tag";
      tagG.textContent = "🏁 ゴール";
      tile.appendChild(tagG);
    }

    var kanji = document.createElement("div");
    kanji.className = "kanji";
    kanji.appendChild(makeRuby(st));
    tile.appendChild(kanji);

    if(st.transfer){
      var chipT = document.createElement("div");
      chipT.className = "chip chip-transfer";
      chipT.textContent = "🔀 のりかえ";
      tile.appendChild(chipT);
    }
    if(st.attack){
      var chipAtk = document.createElement("div");
      chipAtk.className = "chip " + (st.attack.type === "skip" ? "chip-skip" : "chip-back");
      chipAtk.textContent = st.attack.icon + " " + st.attack.label;
      tile.appendChild(chipAtk);
    }

    var tokens = document.createElement("div");
    tokens.className = "tokens";
    tokens.id = "tok-" + i;
    tile.appendChild(tokens);

    if(cornerMap[i] === "right"){
      var arrR = document.createElement("div");
      arrR.className = "corner-arrow right";
      arrR.textContent = "↴";
      tile.appendChild(arrR);
    }
    if(cornerMap[i] === "left"){
      var arrL = document.createElement("div");
      arrL.className = "corner-arrow left";
      arrL.textContent = "↵";
      tile.appendChild(arrL);
    }

    return tile;
  }

  function buildStatusBar(){
    statusEl.innerHTML = "";
    players.forEach(function(p, idx){
      var card = document.createElement("div");
      card.className = "team-card";
      card.id = "card-" + p.key;
      card.style.setProperty("--card-color", p.color);
      card.style.setProperty("--card-color-deep", p.colorDeep);

      var badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = p.emoji;
      card.appendChild(badge);

      var info = document.createElement("div");
      info.className = "info";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = p.name;
      var where = document.createElement("div");
      where.className = "where";
      where.id = "where-" + p.key;
      info.appendChild(name);
      info.appendChild(where);
      card.appendChild(info);

      var tag = document.createElement("div");
      tag.className = "turn-tag";
      tag.textContent = "◀ いまの ばん";
      card.appendChild(tag);

      statusEl.appendChild(card);
    });
  }

  function renderTokens(){
    for(var i=0;i<stations.length;i++){
      var el = document.getElementById("tok-"+i);
      if(el) el.innerHTML = "";
    }
    players.forEach(function(p){
      var el = document.getElementById("tok-"+p.pos);
      if(!el) return;
      var tok = document.createElement("div");
      tok.className = "token " + p.key;
      tok.textContent = p.emoji;
      el.appendChild(tok);
    });
  }

  function renderStatus(){
    players.forEach(function(p, idx){
      var card = document.getElementById("card-"+p.key);
      var where = document.getElementById("where-"+p.key);
      where.textContent = stations[p.pos].k + "（" + stations[p.pos].h + "）";
      if(idx === turn && !over){
        card.classList.add("active");
      } else {
        card.classList.remove("active");
      }
    });
  }

  function renderAll(){
    renderTokens();
    renderStatus();
  }

  function ensureAudio(){
    if(muted) return null;
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ return null; }
    }
    return audioCtx;
  }

  function playTone(freq, dur, delay, type){
    var ctx = ensureAudio();
    if(!ctx) return;
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.18, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }

  function playNoiseBurst(dur, freq, delay){
    var ctx = ensureAudio();
    if(!ctx) return;
    var size = Math.max(1, Math.floor(ctx.sampleRate * dur));
    var buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<size;i++){ data[i] = (Math.random()*2-1) * (1 - i/size); }
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = freq || 1200;
    var gain = ctx.createGain();
    gain.gain.value = 0.22;
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(ctx.currentTime + (delay||0));
  }

  function playPop(stepNum){
    var f = 480 * Math.pow(2, ((stepNum||0) % 12) / 12);
    playTone(f, 0.14, 0, "triangle");
    playTone(f*2, 0.08, 0.015, "sine");
  }
  function playDiceTick(){
    var f = 260 + Math.random()*520;
    playTone(f, 0.05, 0, "square");
    playNoiseBurst(0.035, 1500 + Math.random()*900, 0);
  }
  function playSkip(){
    var ctx = ensureAudio();
    if(!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(440, t0);
    osc.frequency.exponentialRampToValueAtTime(90, t0+0.45);
    gain.gain.setValueAtTime(0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.48);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+0.5);
  }
  function playChime(){
    [660,880,1100].forEach(function(f,i){ playTone(f, 0.16, i*0.09, "square"); });
  }
  function playAttack(){
    playTone(150, 0.22, 0, "sawtooth");
    playTone(95, 0.24, 0.08, "sawtooth");
    playNoiseBurst(0.16, 260, 0);
  }
  function playCorrect(){
    [784, 988, 1319].forEach(function(f,i){ playTone(f, 0.16, i*0.1, "triangle"); });
  }
  function playWrong(){
    playTone(320, 0.18, 0, "sawtooth");
    playTone(220, 0.22, 0.12, "sawtooth");
    playNoiseBurst(0.12, 200, 0.12);
  }
  function playFanfare(){
    [523,659,784,1047,784,1047,1319].forEach(function(f,i){ playTone(f, 0.24, i*0.13, "triangle"); });
    [1047,1319,1568].forEach(function(f){ playTone(f, 0.9, 7*0.13, "triangle"); });
  }

  var BGM_NOTES = [523,0,659,784,0,659,587,0, 523,0,784,880,0,784,659,0];
  var bgmStep = 0;
  var bgmTimer = null;
  function bgmTick(){
    if(muted) return;
    var note = BGM_NOTES[bgmStep % BGM_NOTES.length];
    if(note){
      playTone(note, 0.2, 0, "triangle");
      playTone(note/2, 0.18, 0, "sine");
    }
    bgmStep++;
  }
  function startBgm(){
    if(bgmTimer) return;
    bgmTimer = setInterval(bgmTick, 260);
  }
  function stopBgm(){
    if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
  }

  function setMessage(text){ messageEl.textContent = text; }

  function rollVisualThenValue(cb){
    var ticks = 0;
    var maxTicks = 50;
    rollBtn.disabled = true;
    var iv = setInterval(function(){
      var v = 1 + Math.floor(Math.random()*6);
      diceFaceEl.textContent = DICE_FACES[v];
      playDiceTick();
      ticks++;
      if(ticks >= maxTicks){
        clearInterval(iv);
        var final = 1 + Math.floor(Math.random()*6);
        diceFaceEl.textContent = DICE_FACES[final];
        cb(final);
      }
    }, 80);
  }

  function moveBy(p, delta, done){
    var total = Math.abs(delta);
    var remaining = total;
    var dir = delta > 0 ? 1 : -1;
    var iv = setInterval(function(){
      var atEdge = dir > 0 ? (p.pos >= GOAL) : (p.pos <= 0);
      if(remaining <= 0 || atEdge){
        clearInterval(iv);
        done();
        return;
      }
      p.pos = Math.min(GOAL, Math.max(0, p.pos + dir));
      var stepNum = total - remaining;
      remaining--;
      renderAll();
      playPop(stepNum);
      atEdge = dir > 0 ? (p.pos >= GOAL) : (p.pos <= 0);
      if(atEdge){
        clearInterval(iv);
        done();
      }
    }, 550);
  }

  var KANJI_QUIZ = [
    {k:"一", h:"いち"}, {k:"二", h:"に"}, {k:"三", h:"さん"}, {k:"四", h:"よん"}, {k:"五", h:"ご"},
    {k:"六", h:"ろく"}, {k:"七", h:"なな"}, {k:"八", h:"はち"}, {k:"九", h:"きゅう"}, {k:"十", h:"じゅう"},
    {k:"人", h:"ひと"}, {k:"口", h:"くち"}, {k:"目", h:"め"}, {k:"耳", h:"みみ"}, {k:"手", h:"て"}, {k:"足", h:"あし"},
    {k:"山", h:"やま"}, {k:"川", h:"かわ"}, {k:"木", h:"き"}, {k:"花", h:"はな"}, {k:"水", h:"みず"},
    {k:"土", h:"つち"}, {k:"石", h:"いし"}, {k:"空", h:"そら"}, {k:"田", h:"た"}, {k:"雨", h:"あめ"},
    {k:"王", h:"おう"}, {k:"円", h:"えん"}, {k:"森", h:"もり"}, {k:"子", h:"こ"}, {k:"女", h:"おんな"}, {k:"男", h:"おとこ"},
    {k:"上", h:"うえ"}, {k:"下", h:"した"}, {k:"中", h:"なか"}, {k:"大", h:"おお"}, {k:"小", h:"ちい"}, {k:"外", h:"そと"},
    {k:"白", h:"しろ"}, {k:"赤", h:"あか"}, {k:"青", h:"あお"}, {k:"音", h:"おと"}, {k:"力", h:"ちから"}
  ];

  function makeQuiz(){
    var qi = Math.floor(Math.random() * KANJI_QUIZ.length);
    var correct = KANJI_QUIZ[qi];
    var wrongIdx;
    do{ wrongIdx = Math.floor(Math.random() * KANJI_QUIZ.length); } while(wrongIdx === qi || KANJI_QUIZ[wrongIdx].h === correct.h);
    var wrong = KANJI_QUIZ[wrongIdx];
    var options = Math.random() < 0.5 ? [correct, wrong] : [wrong, correct];
    return { kanji: correct.k, options: options, correctH: correct.h };
  }

  function showQuiz(other, onResolved){
    var q = makeQuiz();
    quizTitleEl.textContent = "🧠 " + other.name + "への かんじクイズ！";
    quizQuestionEl.innerHTML = "";
    var kanjiSpan = document.createElement("span");
    kanjiSpan.className = "quiz-kanji";
    kanjiSpan.textContent = q.kanji;
    quizQuestionEl.appendChild(kanjiSpan);
    quizQuestionEl.appendChild(document.createTextNode("なんて よむ？"));
    quizResultEl.textContent = "";
    quizChoicesEl.innerHTML = "";
    var answered = false;
    var buttons = [];
    q.options.forEach(function(opt){
      var btn = document.createElement("button");
      btn.className = "quiz-choice";
      btn.textContent = opt.h;
      btn.addEventListener("click", function(){
        if(answered) return;
        answered = true;
        buttons.forEach(function(b){ b.disabled = true; });
        var isCorrect = opt.h === q.correctH;
        btn.classList.add(isCorrect ? "correct" : "wrong");
        if(!isCorrect){
          buttons.forEach(function(b, i){ if(q.options[i].h === q.correctH) b.classList.add("correct"); });
        }
        if(isCorrect){
          quizResultEl.textContent = "🎉 せいかい！ こうげきを ふせいだ！";
          playCorrect();
        } else {
          quizResultEl.textContent = "❌ ざんねん... せいかいは「" + q.correctH + "」！ こうげきが あたっちゃった！";
          playWrong();
        }
        setTimeout(function(){
          quizBackdrop.hidden = true;
          onResolved(isCorrect);
        }, 1500);
      });
      buttons.push(btn);
      quizChoicesEl.appendChild(btn);
    });
    quizBackdrop.hidden = false;
  }

  function handleArrival(p){
    if(p.pos === GOAL){
      endGame(p);
      return;
    }
    var st = stations[p.pos];
    var other = players[1-turn];
    var transferNote = "";
    if(st.transfer){
      transferNote = "🔀 " + st.k + "えきで とうきゅう でんえんとしせんに のりかえたよ！ ";
      playChime();
    }
    var atk = st.attack;
    setMessage(transferNote + p.name + "は " + st.k + "えき（" + st.h + "）に とうちゃく！ つぎは " + other.name + "への クイズだよ！");
    setTimeout(function(){
      showQuiz(other, function(isCorrect){
        if(isCorrect){
          setMessage(other.name + "は クイズに せいかい！ こうげきを うまく ふせいだ！");
          setTimeout(function(){ nextTurn(); }, 700);
        } else if(atk.type === "skip"){
          other.skip = true;
          setMessage(other.name + "は クイズに まちがえて… " + atk.icon + " つぎ1かい やすみに なっちゃった！");
          playSkip();
          setTimeout(function(){ nextTurn(); }, 1100);
        } else {
          setMessage(other.name + "は クイズに まちがえて… " + atk.icon + " " + atk.n + "つ うしろに もどっちゃう！");
          playAttack();
          setTimeout(function(){
            moveBy(other, -atk.n, function(){
              setTimeout(function(){ nextTurn(); }, 500);
            });
          }, 500);
        }
      });
    }, 900);
  }

  function nextTurn(){
    turn = 1 - turn;
    var p = currentPlayer();
    renderStatus();
    if(p.skip){
      p.skip = false;
      setMessage(p.name + "は 💤 おやすみちゅう… ばんを とばすよ！");
      busy = true;
      rollBtn.disabled = true;
      setTimeout(function(){ nextTurn(); }, 1000);
      return;
    }
    busy = false;
    rollBtn.disabled = false;
    setMessage(p.name + "の ばんだよ！ サイコロを ふってね！");
  }

  function endGame(p){
    over = true;
    busy = true;
    rollBtn.disabled = true;
    stopBgm();
    renderAll();
    setMessage("🎉🎉 " + p.name + "の かち！ " + stations[GOAL].k + "えき（" + stations[GOAL].h + "）に とうちゃく したよ！ 🎉🎉");
    playFanfare();
    launchConfetti();
    restartBtn.hidden = false;
  }

  function launchConfetti(){
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce) return;
    var wrap = document.createElement("div");
    wrap.className = "confetti";
    var emojis = ["🎉","🚃","🚋","🎊","⭐"];
    for(var i=0;i<28;i++){
      var s = document.createElement("span");
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (Math.random()*100) + "vw";
      s.style.animationDuration = (2 + Math.random()*1.8) + "s";
      s.style.animationDelay = (Math.random()*0.6) + "s";
      s.style.fontSize = (1 + Math.random()*1.2) + "rem";
      wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
    setTimeout(function(){ wrap.remove(); }, 4200);
  }

  function onRoll(){
    if(busy || over) return;
    var p = currentPlayer();
    busy = true;
    rollBtn.disabled = true;
    var ctx = ensureAudio();
    if(ctx && ctx.state === "suspended"){ ctx.resume(); }
    startBgm();
    rollVisualThenValue(function(value){
      setMessage(p.name + "は " + value + " が でたよ！ すすむよ〜！");
      moveBy(p, value, function(){ handleArrival(p); });
    });
  }

  function restart(){
    players.forEach(function(p){ p.pos = 0; p.skip = false; });
    turn = 0;
    busy = false;
    over = false;
    restartBtn.hidden = true;
    diceFaceEl.textContent = "⚀";
    renderAll();
    setMessage("🚃 " + currentPlayer().name + "の ばんだよ！ サイコロを ふってね！");
    rollBtn.disabled = false;
  }

  muteBtn.addEventListener("click", function(){
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    if(muted){ stopBgm(); } else { startBgm(); }
  });
  rollBtn.addEventListener("click", onRoll);
  restartBtn.addEventListener("click", restart);

  buildBoard();
  buildStatusBar();
  renderAll();
})();
</script>
</body>
</html>
