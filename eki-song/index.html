<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レーナの えきめいソング</title>
<meta name="description" content="うたう おんなのこ「レーナ」が、やまのてせん・とうよこせん・ブルーライン・でんえんとしせんの えきめいを ノリノリで うたうよ。">
<meta name="theme-color" content="#1b1440">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<link rel="stylesheet" href="style.css?v=b058f46">
</head>
<body>

<!-- ===== ホーム ===== -->
<div id="homeView">
  <header class="bar">
    <a class="barbtn" href="../" aria-label="あそびメニューへ">🏠</a>
    <div class="bartitle">レーナの えきめいソング 🎤</div>
    <button class="barbtn soundBtn" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>
  <main class="home">
    <section class="hero">
      <div class="lwrap" id="homeLena"></div>
      <div class="bubble" id="homeBubble">やっほー！ レーナだよ</div>
    </section>

    <h2 class="h2">① きょくを えらんでね</h2>
    <div class="songs" id="songChips"></div>

    <h2 class="h2">② どの せんを うたう？</h2>
    <div class="lines" id="lineCards"></div>

    <h2 class="h2">③ いっきに おぼえうた</h2>
    <div class="lines" id="oboeCards"></div>

    <p class="note">レーナの こえは コンピューターで つくった おとだよ。🔊で おとを けせるよ。</p>
  </main>
</div>

<!-- ===== うたう がめん ===== -->
<div id="singView" hidden>
  <header class="bar dark">
    <button class="barbtn" id="backBtn" type="button" aria-label="もどる">⬅</button>
    <div class="bartitle" id="singTitle"></div>
    <button class="barbtn soundBtn" type="button" aria-label="おと オン/オフ">🔊</button>
  </header>
  <main class="stage" id="stage">
    <div class="beams" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="shead" id="shead"></div>
    <div class="s-lena"><div class="lwrap" id="singLena"></div></div>

    <section class="lyric" id="lyric" aria-live="polite">
      <div class="count" id="count"></div>
      <div class="sign" id="sign">
        <div class="num" id="num"><small></small><b></b></div>
        <div class="names">
          <div class="kanji" id="kanji"></div>
          <div class="yomi" id="yomi"></div>
        </div>
      </div>
      <div class="next" id="next"></div>
    </section>

    <div class="ctl">
      <button class="round" id="restartBtn" type="button" aria-label="はじめから">⏮</button>
      <button class="big" id="playBtn" type="button" aria-label="うたう">▶</button>
      <button class="dirbtn" id="dirBtn" type="button"></button>
      <button class="dirbtn" id="ankiBtn" type="button" aria-pressed="false">📱 あんきモード</button>
      <button class="dirbtn" id="hideBtn" type="button" aria-pressed="false" hidden>🙈 つぎを かくす</button>
    </div>
    <ol class="alist" id="alist" aria-label="えきめい あんき リスト"></ol>

    <nav class="route" id="route" aria-label="えきの いちらん（タッチすると そこから うたう）"></nav>
    <div class="prog"><i id="progBar"></i></div>
  </main>
</div>

<!-- ===== おわったとき ===== -->
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script src="data.js?v=b058f46"></script>
<script src="voice.js?v=b058f46"></script>
<script src="app.js?v=b058f46"></script>
</body>
</html>
