<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ころころ そうち 2</title>
<meta name="description" content="ぶひんを ならべて ボールを ころがし ベルを ならそう">
<meta name="theme-color" content="#5f3dc4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎳</text></svg>">
<link rel="stylesheet" href="style.css?v=f2f7882">
</head>
<body>

<header class="top">
  <button id="backBtn" class="pill round" type="button" aria-label="もどる" hidden>←</button>
  <h1 class="title" id="title">🎳 ころころ そうち 2</h1>
  <button id="soundBtn" class="pill round" type="button" aria-label="おと" aria-pressed="true">🔊</button>
</header>

<!-- ========== ステージ えらび ========== -->
<main id="vMenu" class="view scroll">
  <div class="wrap">
    <p class="lead">ぶひんを おいて ボールを ころがし、さいごに <b>ベル</b>を ならそう！</p>
    <button id="freeBtn" class="free-card" type="button">
      <span class="em">🛠️</span>
      <span><b>じゆうに つくる</b><small>ぶひん つかいほうだい・5つ ほぞん できる</small></span>
    </button>
    <div id="stageList"></div>
  </div>
</main>

<!-- ========== あそぶ ========== -->
<main id="vPlay" class="view play" hidden>
  <div class="bar">
    <div class="bar-text">
      <b id="stageName" class="stage-name"></b>
      <span id="hint" class="hint" aria-live="polite"></span>
    </div>
    <div class="bar-btns">
      <button id="clearBtn" class="act sq" type="button" aria-label="ぜんぶ どける">🧹<small>どける</small></button>
      <button id="slotBtn" class="act sq" type="button" aria-label="ほぞん" hidden>💾<small>ほぞん</small></button>
      <button id="runBtn" class="act run" type="button">▶ スタート</button>
    </div>
  </div>
  <div id="stageWrap" class="stage-wrap">
    <div id="stageBox" class="stage-box">
      <canvas id="cv" aria-label="そうち"></canvas>
      <div id="trash" class="trash" aria-hidden="true">🗑️</div>
      <div id="toast" class="toast" hidden></div>
    </div>
  </div>
  <div id="toolbox" class="toolbox" role="toolbar" aria-label="どうぐばこ"></div>
</main>

<!-- ========== クリア ========== -->
<div id="clearModal" class="modal" hidden>
  <div class="sheet">
    <div class="big">🔔</div>
    <p class="res-title">チーン！ クリア！</p>
    <p id="clearText" class="res-text"></p>
    <div class="sheet-btns">
      <button id="againBtn" class="act sq wide" type="button">🔁 もういちど</button>
      <button id="nextBtn" class="act run wide" type="button">つぎへ ▶</button>
    </div>
  </div>
</div>

<!-- ========== ほぞん スロット ========== -->
<div id="slotModal" class="modal" hidden>
  <div class="sheet">
    <p class="res-title">💾 ほぞん / よみこみ</p>
    <div id="slots" class="slots"></div>
    <div class="sheet-btns">
      <button id="slotClose" class="act sq wide" type="button">とじる</button>
    </div>
  </div>
</div>

<script src="physics.js?v=f2f7882"></script>
<script src="parts.js?v=f2f7882"></script>
<script src="stages.js?v=f2f7882"></script>
<script src="game.js?v=f2f7882"></script>
</body>
</html>
