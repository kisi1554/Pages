<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本一周すごろく</title>
<meta name="description" content="日本地図の上を旅しながら、お金・ひみつのカード100枚・目的地をあつめる学習すごろくゲーム。">
<meta name="theme-color" content="#1a6fb5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗾</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════ タイトル ══════════ -->
<section id="screen-title" class="screen is-active">
  <div class="title-wrap">
    <header class="title-head">
      <p class="title-sub">日本中<ruby>を<rt></rt></ruby>旅して あつめよう</p>
      <h1>🗾 <ruby>日本<rt>にほん</rt></ruby><ruby>一周<rt>いっしゅう</rt></ruby><br>すごろく</h1>
      <div class="rail"></div>
    </header>

    <div class="goal-cards">
      <div class="goal"><span class="g-emoji">💰</span><b>お<ruby>金<rt>かね</rt></ruby></b><span>クイズと お<ruby>使<rt>つか</rt></ruby>いで かせぐ</span></div>
      <div class="goal"><span class="g-emoji">🃏</span><b>ひみつのカード</b><span><ruby>全部<rt>ぜんぶ</rt></ruby>で 100<ruby>枚<rt>まい</rt></ruby></span></div>
      <div class="goal"><span class="g-emoji">📍</span><b><ruby>目的地<rt>もくてきち</rt></ruby></b><span>1<ruby>年<rt>ねん</rt></ruby>ごとに <ruby>変<rt>か</rt></ruby>わる</span></div>
    </div>

    <div class="setup">
      <div class="setup-row">
        <span class="setup-label"><ruby>遊<rt>あそ</rt></ruby>ぶ <ruby>人<rt>ひと</rt></ruby></span>
        <div class="chooser" id="choose-humans"></div>
      </div>
      <div class="setup-row">
        <span class="setup-label">コンピューター</span>
        <div class="chooser" id="choose-cpus"></div>
      </div>
      <div id="token-setup"></div>
    </div>

    <div class="title-actions">
      <button id="btn-start" class="big-btn">▶ はじめる</button>
      <button id="btn-continue" class="big-btn ghost" hidden>💾 <ruby>続<rt>つづ</rt></ruby>きから</button>
    </div>
    <div class="title-links">
      <button class="link-btn" id="btn-title-dex">📕 カードずかん</button>
      <button class="link-btn" id="btn-title-sound">🔊 <ruby>音<rt>おと</rt></ruby>の<ruby>設定<rt>せってい</rt></ruby></button>
      <button class="link-btn" id="btn-title-help">❓ <ruby>遊<rt>あそ</rt></ruby>び<ruby>方<rt>かた</rt></ruby></button>
    </div>
    <p class="dex-progress" id="dex-progress"></p>
  </div>
</section>

<!-- ══════════ ゲーム ══════════ -->
<section id="screen-game" class="screen">
  <header id="hud">
    <div class="hud-cell">
      <span class="hud-key">とし</span>
      <span class="hud-val" id="hud-year"></span>
    </div>
    <div class="hud-cell">
      <span class="hud-key">きせつ</span>
      <span class="hud-val" id="hud-season"></span>
    </div>
    <div class="hud-cell hud-dest">
      <span class="hud-key">もくてきち</span>
      <span class="hud-val" id="hud-dest">－</span>
    </div>
    <div class="hud-cell">
      <span class="hud-key">のこり</span>
      <span class="hud-val" id="hud-turns"></span>
    </div>
  </header>

  <div id="map-wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p id="map-note">
    <ruby>沖縄県<rt>おきなわけん</rt></ruby>は<ruby>左上<rt>ひだりうえ</rt></ruby>の<ruby>枠<rt>わく</rt></ruby>に<ruby>拡大<rt>かくだい</rt></ruby>｜<ruby>地図<rt>ちず</rt></ruby>：<ruby>国土数値情報<rt>こくどすうちじょうほう</rt></ruby>（<ruby>国土交通省<rt>こくどこうつうしょう</rt></ruby>）
  </p>

  <div id="panel">
    <div id="turn-banner"><span id="turn-banner-text"></span></div>
    <div id="players"></div>
    <div id="action-bar">
      <div id="dice-box"><span id="dice-face">🎲</span></div>
      <button id="btn-dice" class="big-btn"></button>
      <p id="step-info"></p>
    </div>
    <div id="sub-bar">
      <button class="sub-btn" id="btn-dex">📕 ずかん</button>
      <button class="sub-btn" id="btn-quests">📮 お<ruby>使<rt>つか</rt></ruby>い</button>
      <button class="sub-btn" id="btn-shops">🏪 お<ruby>店<rt>みせ</rt></ruby></button>
      <button class="sub-btn" id="btn-zoom">🔍</button>
      <button class="sub-btn" id="btn-sound">🔊 <ruby>音<rt>おと</rt></ruby></button>
      <button class="sub-btn" id="btn-help">❓ <ruby>遊<rt>あそ</rt></ruby>び<ruby>方<rt>かた</rt></ruby></button>
      <button class="sub-btn" id="btn-quit">🏠 タイトル</button>
    </div>
  </div>
</section>

<!-- ══════════ 結果 ══════════ -->
<section id="screen-result" class="screen">
  <div class="result-wrap" id="result-body"></div>
</section>

<!-- ══════════ 重ねる まど ══════════ -->
<div id="overlay" hidden>
  <div id="overlay-box" role="dialog" aria-modal="true"></div>
</div>
<div id="toast-area" aria-live="polite"></div>

<script src="map-data.js"></script>
<script src="data-prefs.js"></script>
<script src="data-cards.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
