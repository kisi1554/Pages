<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>にっぽん一周すごろく</title>
<meta name="description" content="日本中を旅しながら、おかね・ひみつのカード100まい・目的地をあつめる学習すごろくゲーム。">
<meta name="theme-color" content="#1a6fb5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗾</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════ タイトル ══════════ -->
<section id="screen-title" class="screen is-active">
  <div class="title-wrap">
    <header class="title-head">
      <p class="title-sub">にほんじゅうを たびして あつめよう</p>
      <h1>🗾 にっぽん<br>いっしゅう すごろく</h1>
      <p class="title-kanji">日本一周すごろく</p>
      <div class="rail"></div>
    </header>

    <div class="goal-cards">
      <div class="goal"><span class="g-emoji">💰</span><b>おかね</b><span>クイズと おつかいで かせぐ</span></div>
      <div class="goal"><span class="g-emoji">🃏</span><b>ひみつのカード</b><span>ぜんぶで 100まい</span></div>
      <div class="goal"><span class="g-emoji">📍</span><b>もくてきち</b><span>1ねんごとに かわる</span></div>
    </div>

    <div class="setup">
      <div class="setup-row">
        <span class="setup-label">あそぶ ひと</span>
        <div class="chooser" id="choose-humans"></div>
      </div>
      <div class="setup-row">
        <span class="setup-label">コンピューター</span>
        <div class="chooser" id="choose-cpus"></div>
      </div>
      <div id="token-setup"></div>
    </div>

    <div class="title-actions">
      <button id="btn-start" class="big-btn">▶ はじめる</button>
      <button id="btn-continue" class="big-btn ghost" hidden>💾 つづきから</button>
    </div>
    <div class="title-links">
      <button class="link-btn" id="btn-title-dex">📕 カードずかん</button>
      <button class="link-btn" id="btn-title-help">❓ あそびかた</button>
    </div>
    <p class="dex-progress" id="dex-progress"></p>
  </div>
</section>

<!-- ══════════ ゲーム ══════════ -->
<section id="screen-game" class="screen">
  <header id="hud">
    <div class="hud-cell">
      <span class="hud-key">とし</span>
      <span class="hud-val" id="hud-year">1ねんめ</span>
    </div>
    <div class="hud-cell">
      <span class="hud-key">きせつ</span>
      <span class="hud-val" id="hud-season">🌸 はる</span>
    </div>
    <div class="hud-cell hud-dest">
      <span class="hud-key">もくてきち</span>
      <span class="hud-val" id="hud-dest">－</span>
    </div>
    <div class="hud-cell">
      <span class="hud-key">のこり</span>
      <span class="hud-val" id="hud-turns">8かい</span>
    </div>
  </header>

  <div id="map-wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p id="map-note">※おきなわけんは きゅうしゅうの ちかくに かいてあります</p>

  <div id="panel">
    <div id="turn-banner"><span id="turn-banner-text"></span></div>
    <div id="players"></div>
    <div id="action-bar">
      <div id="dice-box"><span id="dice-face">🎲</span></div>
      <button id="btn-dice" class="big-btn">サイコロを ふる</button>
      <p id="step-info"></p>
    </div>
    <div id="sub-bar">
      <button class="sub-btn" id="btn-dex">📕 ずかん</button>
      <button class="sub-btn" id="btn-quests">📮 おつかい</button>
      <button class="sub-btn" id="btn-shops">🏪 おみせ</button>
      <button class="sub-btn" id="btn-zoom">🔍 100%</button>
      <button class="sub-btn" id="btn-help">❓ あそびかた</button>
      <button class="sub-btn" id="btn-quit">🏠 タイトル</button>
    </div>
  </div>
</section>

<!-- ══════════ けっか ══════════ -->
<section id="screen-result" class="screen">
  <div class="result-wrap" id="result-body"></div>
</section>

<!-- ══════════ かさねる まど ══════════ -->
<div id="overlay" hidden>
  <div id="overlay-box" role="dialog" aria-modal="true"></div>
</div>
<div id="toast-area" aria-live="polite"></div>

<script src="data-prefs.js"></script>
<script src="data-cards.js"></script>
<script src="game.js"></script>
</body>
</html>
