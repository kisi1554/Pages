<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe9a8">
<title>カスタと あそぼ</title>
<style>
  :root {
    --cream: #fff8e1;
    --yellow: #ffe08a;
    --yellow-d: #f4c552;
    --brown: #7a4a22;
    --brown-l: #b87a3d;
    --pink: #ff9eb0;
    --sky: #cfefff;
    --grass: #bfe6a0;
    --ink: #5a3415;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    height: 100dvh; display: flex; flex-direction: column;
    background: linear-gradient(var(--sky) 0 62%, var(--grass) 62% 100%);
    transition: filter .8s;
  }
  #app.night { filter: brightness(.45) saturate(.7); }
  #app.night .keep-bright { filter: brightness(2.2); }

  /* --- うえの バー --- */
  header {
    display: flex; align-items: center; gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) 12px 6px;
  }
  .meters { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .meter {
    background: rgba(255,255,255,.85); border-radius: 14px; padding: 4px 8px;
    display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold;
    box-shadow: 0 2px 0 rgba(0,0,0,.08);
  }
  .meter .ico { font-size: 20px; }
  .bar { flex: 1; height: 10px; background: #eee; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 50%; border-radius: 6px; transition: width .4s; }
  #mHunger i { background: #ff9f43; }
  #mEnergy i { background: #54a0ff; }
  #mClean i  { background: #48dbfb; }
  .iconbtn {
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.9); font-size: 22px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,.1);
  }
  #love {
    background: rgba(255,255,255,.9); border-radius: 20px; padding: 6px 12px;
    font-weight: bold; font-size: 16px; white-space: nowrap;
    box-shadow: 0 2px 0 rgba(0,0,0,.1);
  }

  /* --- ステージ --- */
  #stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  #bubble {
    position: absolute; left: 50%; top: 4%; transform: translateX(-50%);
    max-width: min(86%, 520px); background: #fff; border-radius: 24px;
    padding: 12px 20px; font-size: clamp(18px, 4.6vw, 26px); font-weight: bold;
    text-align: center; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
    box-shadow: 0 4px 0 rgba(0,0,0,.08); z-index: 3;
    transition: opacity .25s; pointer-events: none;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%);
    border: 10px solid transparent; border-top: 14px solid #fff;
  }
  #bubble.hide { opacity: 0; }
  #pet {
    position: absolute; left: 50%; bottom: 4%;
    width: min(78vw, 46vh, 420px); aspect-ratio: 1; transform: translateX(-50%);
    cursor: pointer; touch-action: none; z-index: 2;
  }
  #pet svg { width: 100%; height: 100%; overflow: visible; }
  #petBody { transform-origin: 100px 190px; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.025, .975); } }
  #pet.jump #petBody { animation: jump .55s ease-out; }
  @keyframes jump {
    0% { transform: scale(1.08,.9); } 35% { transform: translateY(-38px) scale(.96,1.06); }
    70% { transform: translateY(0) scale(1.06,.94); } 100% { transform: none; }
  }
  #pet.wiggle #petBody { animation: wiggle .6s ease-in-out; }
  @keyframes wiggle { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  #pet.eat #petBody { animation: chew .3s ease-in-out 4; }
  @keyframes chew { 50% { transform: scale(1.04, .96); } }
  #eyes { transform-origin: 100px 88px; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  #arm { transform-origin: 146px 128px; animation: wave 1.6s ease-in-out infinite; }
  #pet.happy #arm { animation-duration: .35s; }
  @keyframes wave { 50% { transform: rotate(-24deg); } }
  .sleeping #eyes { animation: none; }

  .fx {
    position: absolute; pointer-events: none; z-index: 4; font-size: 34px;
    animation: floatUp 1.3s ease-out forwards;
  }
  @keyframes floatUp {
    from { transform: translate(-50%, 0) scale(.6); opacity: 1; }
    to   { transform: translate(-50%, -120px) scale(1.2); opacity: 0; }
  }
  .bubbleFx {
    position: absolute; pointer-events: none; z-index: 4; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, rgba(200,240,255,.6) 60%, rgba(150,220,255,.3));
    border: 2px solid rgba(255,255,255,.9);
    animation: pop 1.6s ease-out forwards;
  }
  @keyframes pop {
    from { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    80% { opacity: .9; }
    to { transform: translate(-50%,-50%) translateY(-60px) scale(1.1); opacity: 0; }
  }
  .zzz {
    position: absolute; z-index: 4; font-size: 40px; font-weight: bold; color: #fff;
    pointer-events: none; animation: zzz 2.4s ease-out infinite;
  }
  @keyframes zzz {
    from { transform: translate(0,0) scale(.6); opacity: 0; }
    30% { opacity: 1; }
    to { transform: translate(40px,-110px) scale(1.3); opacity: 0; }
  }
  .food-fly {
    position: absolute; z-index: 5; font-size: 56px; pointer-events: none;
    transition: transform .6s cubic-bezier(.4,1.4,.6,1), opacity .3s .5s;
  }

  /* --- したの ボタン --- */
  nav.actions {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    padding: 8px 10px max(10px, env(safe-area-inset-bottom));
    background: rgba(255,255,255,.75);
  }
  .act {
    border: none; border-radius: 18px; background: #fff; cursor: pointer;
    padding: 8px 2px; min-height: 76px; font-family: inherit; color: var(--ink);
    font-size: clamp(13px, 3.4vw, 17px); font-weight: bold;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 4px 0 var(--yellow-d);
  }
  .act:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--yellow-d); }
  .act .e { font-size: 32px; line-height: 1; }
  .act.on { background: var(--yellow); }

  /* --- パネル --- */
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    background: #fff; border-radius: 26px 26px 0 0; padding: 14px 14px 18px;
    box-shadow: 0 -4px 16px rgba(0,0,0,.12);
    transform: translateY(110%); transition: transform .3s, visibility 0s .3s; visibility: hidden;
  }
  .panel.open { transform: none; visibility: visible; transition: transform .3s; }
  .panel h2 { margin: 0 0 10px; font-size: 20px; text-align: center; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; }
  .choice {
    border: 3px solid #f3e3b5; background: var(--cream); border-radius: 18px;
    padding: 8px 4px; font-family: inherit; font-size: 15px; font-weight: bold; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    min-height: 88px;
  }
  .choice .e { font-size: 40px; line-height: 1; }
  .choice.sel { border-color: var(--brown-l); background: var(--yellow); }
  .choice.lock { opacity: .45; }
  .choice small { font-size: 11px; font-weight: normal; }
  .close { display: block; margin: 12px auto 0; border: none; background: #eee; border-radius: 20px;
    padding: 10px 28px; font-family: inherit; font-size: 16px; font-weight: bold; color: var(--ink); cursor: pointer; }

  /* --- ゲーム --- */
  #game {
    position: absolute; inset: 0; z-index: 8; display: none;
    background: linear-gradient(#fff3c4, #ffe1a6);
    touch-action: none; overflow: hidden;
  }
  #game.show { display: block; }
  #gameHud {
    position: absolute; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 14px; font-size: 22px; font-weight: bold; z-index: 2;
  }
  #gameHud span { background: #fff; border-radius: 18px; padding: 4px 16px; }
  #catcher { position: absolute; bottom: 4%; width: min(30vw, 22vh, 170px); aspect-ratio: 1; transform: translateX(-50%); }
  #catcher svg { width: 100%; height: 100%; }
  .drop { position: absolute; font-size: clamp(38px, 9vw, 60px); transform: translate(-50%, -50%); }
  #gameMsg {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; font-size: clamp(22px, 5.5vw, 32px); font-weight: bold; z-index: 3;
    background: rgba(255,248,225,.85);
  }
  #gameMsg.hide { display: none; }
  .big {
    border: none; border-radius: 30px; background: var(--brown-l); color: #fff;
    font-family: inherit; font-size: 24px; font-weight: bold; padding: 14px 36px; cursor: pointer;
    box-shadow: 0 5px 0 var(--brown);
  }
  .big.sub { background: #ccc; color: var(--ink); box-shadow: 0 5px 0 #999; font-size: 18px; }

  /* --- ミニゲーム（アーケード） --- */
  #arcade {
    position: absolute; inset: 0; z-index: 8; display: none; flex-direction: column;
    background: linear-gradient(#fff3c4, #ffe1a6); touch-action: manipulation;
  }
  #arcade.show { display: flex; }
  .ahead {
    display: flex; align-items: center; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 12px 6px; font-size: 22px; font-weight: bold;
  }
  .ahead .t { flex: 1; text-align: center; }
  .ahead .info { background: #fff; border-radius: 18px; padding: 4px 14px; font-size: 18px; min-width: 64px; text-align: center; }
  .abody {
    flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 10px 12px max(16px, env(safe-area-inset-bottom)); text-align: center;
  }
  .amsg { font-size: clamp(20px, 5vw, 28px); font-weight: bold; line-height: 1.5; min-height: 1.5em; }
  .asub { font-size: clamp(15px, 3.8vw, 19px); line-height: 1.6; }
  .mini { width: 100%; height: 100%; }
  .mini svg { width: 100%; height: 100%; overflow: visible; }
  .gpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .gpick .choice { min-height: 96px; }
  .gpick small { font-size: 12px; }

  /* かくれんぼ */
  .cups { position: relative; width: min(92vw, 520px); height: min(62vw, 340px); }
  .cup, .hid {
    position: absolute; bottom: 0; width: 30%; transition: left .4s ease-in-out, transform .35s ease;
  }
  .hid { height: 46%; }
  .cup {
    height: 52%; z-index: 2; cursor: pointer; border: 4px solid #2f6ca8;
    border-radius: 46% 46% 14% 14% / 60% 60% 14% 14%;
    background: repeating-linear-gradient(90deg, #7cc4ff 0 16px, #a8d8ff 16px 32px);
  }
  .cup::after { content: "★"; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 30px; }
  .cup.up { transform: translateY(-88%); }

  /* おなじの さがし */
  .cards { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); width: min(94vw, 560px); }
  @media (orientation: portrait) { .cards { grid-template-columns: repeat(3, 1fr); width: min(86vw, 52vh, 420px); } }
  .card {
    aspect-ratio: 1; border: none; border-radius: 16px; cursor: pointer; position: relative;
    background: transparent; perspective: 600px; padding: 0;
  }
  .card .in { position: absolute; inset: 0; transition: transform .35s; transform-style: preserve-3d; }
  .card.open .in, .card.done .in { transform: rotateY(180deg); }
  .card .f, .card .b {
    position: absolute; inset: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(30px, 9vw, 52px); backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
  }
  .card .b { background: #b8651f; color: #fff; border: 4px solid #fff3c2; }
  .card .f { background: #fff; transform: rotateY(180deg); }
  .card.done .f { background: #fff3c2; }

  /* ぽこぽこ タッチ */
  .holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(90vw, 52vh, 460px); }
  .hole {
    aspect-ratio: 1; position: relative; overflow: hidden; cursor: pointer; border-radius: 50% 50% 18px 18px;
    background: radial-gradient(ellipse at 50% 88%, #6b3f1d 0 30%, #c99a63 31% 100%);
  }
  .hole .pop {
    position: absolute; left: 10%; width: 80%; height: 80%; bottom: -85%;
    transition: bottom .15s ease-out; display: flex; align-items: center; justify-content: center; font-size: 46px;
  }
  .hole.on .pop { bottom: 4%; }
  .hole.hit .pop { transform: scale(1.15, .7); transform-origin: bottom; }

  /* まねっこ */
  .simon { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(84vw, 46vh, 400px); }
  .sbtn {
    aspect-ratio: 1; border: none; border-radius: 28px; font-size: clamp(40px, 12vw, 64px); cursor: pointer;
    opacity: .55; transition: opacity .12s, transform .12s; box-shadow: 0 6px 0 rgba(0,0,0,.18);
  }
  .sbtn.lit { opacity: 1; transform: scale(1.06); }
  .simon.wait .sbtn { pointer-events: none; }

  /* じゃんけん */
  .jkface { width: min(40vw, 26vh, 200px); aspect-ratio: 1; position: relative; }
  .jkhand { position: absolute; right: -24%; top: 30%; font-size: clamp(44px, 12vw, 70px); }
  .jkrow { display: flex; gap: 14px; }
  .jkbtn {
    width: min(26vw, 120px); aspect-ratio: 1; border: none; border-radius: 26px; background: #fff;
    font-size: clamp(40px, 11vw, 60px); cursor: pointer; box-shadow: 0 5px 0 var(--yellow-d);
    font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .jkbtn small { font-size: 14px; font-weight: bold; color: var(--ink); }
  .jkbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--yellow-d); }
  .stars { font-size: 30px; letter-spacing: 4px; }

  @media (orientation: landscape) and (max-height: 560px) {
    .act { min-height: 58px; } .act .e { font-size: 26px; }
    .meter { font-size: 11px; } #bubble { top: 2%; padding: 8px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="keep-bright">
    <div class="meters">
      <div class="meter" id="mHunger"><span class="ico">🍓</span><span class="bar"><i></i></span></div>
      <div class="meter" id="mEnergy"><span class="ico">⚡</span><span class="bar"><i></i></span></div>
      <div class="meter" id="mClean"><span class="ico">🫧</span><span class="bar"><i></i></span></div>
    </div>
    <div id="love">💛 0</div>
    <button class="iconbtn" id="voiceBtn" aria-label="こえ">🗣️</button>
    <button class="iconbtn" id="soundBtn" aria-label="おと">🔊</button>
  </header>

  <div id="stage">
    <div id="bubble">ぷるんっ！ ぼく カスタ。プリンの こだよ。いっしょに あそぼ！</div>
    <div id="pet" aria-label="カスタ">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="custard" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffe9a0"/><stop offset=".45" stop-color="#fff3c2"/><stop offset="1" stop-color="#f7cf62"/>
          </linearGradient>
        </defs>
        <!-- おさら -->
        <ellipse cx="100" cy="182" rx="86" ry="13" fill="#fff" stroke="#b9c8d6" stroke-width="3"/>
        <ellipse cx="100" cy="180" rx="66" ry="7" fill="#e9f0f6"/>
        <g id="petBody">
          <!-- て -->
          <path d="M56 124 q-20 -6 -24 8 q-1 9 8 7 q6 -9 18 -5 z" fill="url(#custard)" stroke="#8a5a2b" stroke-width="3" stroke-linejoin="round"/>
          <path id="arm" d="M144 124 q20 -6 24 8 q1 9 -8 7 q-6 -9 -18 -5 z" fill="url(#custard)" stroke="#8a5a2b" stroke-width="3" stroke-linejoin="round"/>
          <!-- あし -->
          <ellipse cx="78" cy="178" rx="14" ry="7" fill="#fff3c2" stroke="#8a5a2b" stroke-width="3"/>
          <ellipse cx="122" cy="178" rx="14" ry="7" fill="#fff3c2" stroke="#8a5a2b" stroke-width="3"/>
          <!-- プリンの からだ -->
          <path d="M62 66 Q100 50 138 66 L152 166 Q154 176 142 176 H58 Q46 176 48 166 Z" fill="url(#custard)" stroke="#8a5a2b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M68 104 q-4 28 -7 58" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6"/>
          <!-- カラメル -->
          <path d="M62 66 Q100 50 138 66 L141.6 92 q-7 13 -15 2 q-8 14 -16 2 q-9 16 -19 0 q-8 14 -17 -2 q-8 12 -16.2 -2 Z" fill="#b8651f" stroke="#7a3f12" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="86" cy="68" rx="12" ry="3.5" fill="#fff" opacity=".55"/>
          <!-- ホイップと さくらんぼ -->
          <g id="leaf">
            <path d="M84 62 q-6 -10 4 -14 q2 -10 12 -8 q10 -4 13 6 q10 4 4 16 z" fill="#fff" stroke="#d8c8a8" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M104 34 q2 -10 12 -16" fill="none" stroke="#5b8f2e" stroke-width="3" stroke-linecap="round"/>
            <circle cx="103" cy="40" r="8" fill="#e8384f" stroke="#a51d33" stroke-width="2.5"/>
            <circle cx="100" cy="37" r="2.2" fill="#fff" opacity=".8"/>
          </g>
          <!-- ほっぺ -->
          <ellipse cx="68" cy="126" rx="10" ry="6.5" fill="#ffaabb" opacity=".75"/>
          <ellipse cx="132" cy="126" rx="10" ry="6.5" fill="#ffaabb" opacity=".75"/>
          <g transform="translate(0 24)">
          <!-- め -->
          <g id="eyes">
            <g id="eyesOpen">
              <ellipse cx="80" cy="88" rx="5.5" ry="7" fill="#3b2412"/>
              <ellipse cx="120" cy="88" rx="5.5" ry="7" fill="#3b2412"/>
              <circle cx="82" cy="85" r="2" fill="#fff"/>
              <circle cx="122" cy="85" r="2" fill="#fff"/>
            </g>
            <g id="eyesHappy" style="display:none" fill="none" stroke="#3b2412" stroke-width="3.5" stroke-linecap="round">
              <path d="M72 90 q8 -10 16 0"/><path d="M112 90 q8 -10 16 0"/>
            </g>
            <g id="eyesSleep" style="display:none" fill="none" stroke="#3b2412" stroke-width="3.5" stroke-linecap="round">
              <path d="M72 88 q8 8 16 0"/><path d="M112 88 q8 8 16 0"/>
            </g>
          </g>
          <!-- くち -->
          <path id="mouth" d="M90 104 q5 6 10 0 q5 6 10 0" fill="none" stroke="#5a3415" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- おしゃれ -->
          <g id="hat" transform="translate(15 26) scale(.85)"></g>
        </g>
      </svg>
    </div>

    <div class="panel" id="foodPanel">
      <h2>なにを たべる？</h2>
      <div class="choices" id="foodChoices"></div>
      <button class="close" data-close>とじる</button>
    </div>
    <div class="panel" id="playPanel">
      <h2>なにして あそぶ？</h2>
      <div class="choices gpick" id="playChoices"></div>
      <button class="close" data-close>とじる</button>
    </div>
    <div class="panel" id="hatPanel">
      <h2>おしゃれ しよう</h2>
      <div class="choices" id="hatChoices"></div>
      <button class="close" data-close>とじる</button>
    </div>
  </div>

  <nav class="actions keep-bright">
    <button class="act" id="bFood"><span class="e">🍓</span>ごはん</button>
    <button class="act" id="bBath"><span class="e">🛁</span>おふろ</button>
    <button class="act" id="bPlay"><span class="e">⚽</span>あそぶ</button>
    <button class="act" id="bSleep"><span class="e">🌙</span>ねんね</button>
    <button class="act" id="bHat"><span class="e">🎀</span>おしゃれ</button>
  </nav>

  <div id="game">
    <div id="gameHud"><span id="gScore">🍓 0</span><span id="gTime">⏱ 30</span></div>
    <div id="catcher"></div>
    <div id="gameMsg">
      <div>おやつキャッチ！</div>
      <div style="font-size:.7em">ゆびで カスタを うごかして<br>おちてくる おやつを キャッチしてね</div>
      <button class="big" id="gStart">はじめる</button>
      <button class="big sub" id="gQuit">もどる</button>
    </div>
  </div>

  <div id="arcade">
    <div class="ahead">
      <button class="iconbtn" id="aQuit" aria-label="もどる">✖</button>
      <span class="t" id="aTitle"></span>
      <span class="info" id="aInfo"></span>
    </div>
    <div class="abody" id="aBody"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), stage = $('#stage'), pet = $('#pet'), bubble = $('#bubble');

  // ---------------- ほぞん ----------------
  const KEY = 'custa-asobo-v1';
  const def = { hunger: 70, energy: 80, clean: 80, love: 0, hat: 'none', sound: true, voice: true, t: Date.now() };
  let S = { ...def };

  {

  let ac = null;
  function ctx() {
    if (!S.sound) return null;

    return ac;
  }
  function tone(f1, f2, dur, type = 'sine', vol = .18, delay = 0) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }

  // ---------------- なでる / タップ ----------------

  let gx = 0.5, drops = [], score = 0, left = 30, running = false, raf = 0, lastT = 0, spawnT = 0;
  const GOOD = ['🍓', '🍓', '🍪', '🍎', '🍒', '🍩', '🥞'];
  function openGame() { game.classList.add('show'); gMsg.classList.remove('hide'); gMsg.firstElementChild.textContent = 'おやつキャッチ！'; $('#gStart').textContent = 'はじめる'; placeCatcher(); speak('おやつキャッチ！ ゆびで カスタを うごかして、おちてくる おやつを キャッチしてね'); }
  function placeCatcher() { catcher.style.left = (gx * 100) + '%'; }

  function loop(t) {
    const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
    const W = game.clientWidth, H = game.clientHeight;
    left -= dt; spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = Math.max(.45, .95 - (30 - left) * .015);
      const el = document.createElement('div'); el.className = 'drop'; el.textContent = pick(GOOD);
      game.appendChild(el);
      drops.push({ el, x: .08 + Math.random() * .84, y: -40, v: H * (.28 + Math.random() * .12 + (30 - left) * .006) });
    }

    const cx = cr.left - gr.left + cr.width / 2, cy = cr.top - gr.top + cr.height * .35;

    const get = Math.max(1, Math.round(score / 3));
    gMsg.firstElementChild.innerHTML = `${score}こ キャッチ！<br>💛 ${get} もらったよ`;
    speak(`${score}こ キャッチ！ ハート ${get}こ もらったよ`);
    $('#gStart').textContent = 'もういちど';
    gMsg.classList.remove('hide');
    S.energy = clamp(S.energy - 12); S.hunger = clamp(S.hunger - 6 + Math.min(score, 20)); S.clean = clamp(S.clean - 8);
    addLove(get);
    setTimeout(() => say(score >= 20 ? 'すごーい！ おやつ めいじん だね！' : 'たのしかった〜！ また あそぼ！', 4000), 3800);
    if (S.energy < 15) setTimeout(() => { $('#gQuit').onclick(); say('いっぱい あそんで ねむく なっちゃった… 🌙'); }, 1800);
  }

  // ---------------- ミニゲーム（アーケード） ----------------
  const MINI = catcher.innerHTML;
  const arcade = $('#arcade'), aBody = $('#aBody'), aInfo = $('#aInfo');
  let arcadeOn = false, token = 0, timers = [];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // ゲームを とじたら まえの タイマーは ぜんぶ むこう
  function later(fn, ms) { const t = token; const id = setTimeout(() => { if (t === token) fn(); }, ms); timers.push(id); return id; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function openArcade(g) {
    arcadeOn = true; arcade.classList.add('show');
    $('#aTitle').textContent = g.e + ' ' + g.name;
    intro(g);
  }
  function closeArcade() {
    token++; clearTimers(); arcadeOn = false; arcade.classList.remove('show'); aBody.innerHTML = ''; aInfo.textContent = '';
    if (S.energy < 15) say('いっぱい あそんで ねむく なっちゃった… 🌙');
    else say(pick(['たのしかった〜！', 'また あそぼうね！', 'ぷるんっ！ もっと あそびたい！']));
  }
  $('#aQuit').onclick = closeArcade;
  function intro(g) {
    token++; clearTimers(); aInfo.textContent = '';
    aBody.innerHTML = `<div class="mini" style="width:min(36vw,24vh,170px);height:auto;aspect-ratio:1">${MINI}</div>
      <div class="amsg">${g.name}</div><div class="asub">${g.how}</div>
      <button class="big" id="aGo">はじめる</button>`;
    speak(g.name + '。' + g.how);
    $('#aGo').onclick = () => { token++; clearTimers(); sfx.wan(); g.start(); };
  }
  function result(g, html, get) {
    token++; clearTimers();
    sfx.fanfare();
    aBody.innerHTML = `<div class="mini" style="width:min(32vw,22vh,150px);height:auto;aspect-ratio:1">${MINI}</div>
      <div class="amsg">${html}</div><div class="asub">💛 ${get} もらったよ！</div>
      <button class="big" id="aAgain">もういちど</button><button class="big sub" id="aBack">もどる</button>`;
    speak(html + '。ハート ' + get + 'こ もらったよ！');
    S.energy = clamp(S.energy - 8); S.hunger = clamp(S.hunger - 4); S.clean = clamp(S.clean - 3);
    addLove(get);
    $('#aAgain').onclick = () => { if (S.energy < 15) { closeArcade(); return; } intro(g); };
    $('#aBack').onclick = closeArcade;
  }
  const bigMsg = (t) => { const m = aBody.querySelector('.amsg'); if (m) m.innerHTML = t; speak(t); };

  // 1) かくれんぼ … カップの したに かくれた カスタを さがす
  const gCups = {
    e: '🥤', name: 'かくれんぼ', short: 'どの カップに いるかな？',
    how: 'カスタが カップの したに かくれるよ。<br>よーく みて、どこに いるか あててね！',
    start() {
      let round = 0, hit = 0;
      const ROUNDS = [{ n: 3, ms: 520 }, { n: 5, ms: 420 }, { n: 7, ms: 340 }, { n: 9, ms: 280 }, { n: 11, ms: 230 }];
      aBody.innerHTML = `<div class="amsg"></div><div class="cups"></div><div class="stars"></div>`;
      const box = aBody.querySelector('.cups');
      const slots = [0, 1, 2];
      const X = (s) => (s * 35) + '%';
      const hid = document.createElement('div'); hid.className = 'hid mini'; hid.innerHTML = MINI; box.appendChild(hid);
      const cups = slots.map(s => { const c = document.createElement('div'); c.className = 'cup'; c.dataset.slot = s; c.style.left = X(s); box.appendChild(c); return c; });
      let owner = 1, canPick = false;
      function next() {
        if (round >= ROUNDS.length) return result(gCups, `${ROUNDS.length}かいちゅう ${hit}かい みつけた！`, hit * 2 + 1);
        aInfo.textContent = (round + 1) + ' / ' + ROUNDS.length;
        const R = ROUNDS[round];
        cups.forEach(c => { c.style.transition = ''; });
        owner = Math.floor(Math.random() * 3);
        hid.style.transition = 'none'; hid.style.left = X(+cups[owner].dataset.slot); hid.style.opacity = 1;
        cups.forEach(c => c.classList.remove('up')); cups[owner].classList.add('up');
        bigMsg('ここに いるよ〜！');
        later(() => { cups[owner].classList.remove('up'); bigMsg('まぜまぜ…'); }, 1200);
        let k = 0;
        const swap = () => {
          if (k++ >= R.n) { hid.style.left = X(+cups[owner].dataset.slot); canPick = true; bigMsg('どーこだ？'); return; }
          const [a, b] = shuffle([0, 1, 2]);
          const ca = cups.find(c => +c.dataset.slot === a), cb = cups.find(c => +c.dataset.slot === b);
          ca.style.transition = cb.style.transition = `left ${R.ms}ms ease-in-out, transform .35s ease`;
          ca.dataset.slot = b; cb.dataset.slot = a; ca.style.left = X(b); cb.style.left = X(a);
          hid.style.opacity = 0;
          tone(500 + Math.random() * 200, 700, .05, 'sine', .05);
          later(swap, R.ms + 40);
        };
        later(swap, 1700);
      }
      cups.forEach((c, i) => c.onclick = () => {
        if (!canPick) return; canPick = false;
        hid.style.transition = 'none'; hid.style.left = X(+cups[owner].dataset.slot); hid.style.opacity = 1;
        c.classList.add('up');
        if (i === owner) { hit++; sfx.happy(); bigMsg('あたり！ みつかっちゃった〜'); }
        else { sfx.sad(); later(() => cups[owner].classList.add('up'), 450); bigMsg('ざんねん！ ここ でした〜'); }
        aBody.querySelector('.stars').textContent = '⭐'.repeat(hit);
        round++; later(next, 1800);
      });
      next();
    },
  };

  // 2) おなじの さがし … しんけいすいじゃく
  const gPairs = {
    e: '🃏', name: 'おなじの さがし', short: 'おなじ えを 2まい めくろう',
    how: 'カードを 2まい めくって、<br>おなじ え だったら ゲット！',
    start() {
      const pool = shuffle(['🍓', '🍒', '🍪', '🍎', '🥞', '🍩', '🍌', '🍇', '🍋', '🍑']).slice(0, 6);
      const deck = shuffle(pool.concat(pool));
      let open = [], tries = 0, got = 0, lock = true;
      aBody.innerHTML = `<div class="amsg">さいしょに ちょっと みせるね</div><div class="cards"></div>`;
      const box = aBody.querySelector('.cards');
      const els = deck.map((e, i) => {
        const b = document.createElement('button'); b.className = 'card open';
        b.innerHTML = `<span class="in"><span class="b">🍮</span><span class="f">${e}</span></span>`;
        b.onclick = () => {
          if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
          b.classList.add('open'); sfx.pop(); open.push(i);
          if (open.length < 2) return;
          tries++; aInfo.textContent = tries + 'かい';
          const [x, y] = open; open = [];
          if (deck[x] === deck[y]) {
            got++; sfx.catch();
            later(() => { els[x].classList.add('done'); els[y].classList.add('done'); }, 250);
            bigMsg(pick(['やったー！', 'おなじ！', 'すごい！']) + ' ' + deck[x]);
            if (got === pool.length) later(() => result(gPairs, `${tries}かいで ぜんぶ みつけた！`, tries <= 9 ? 6 : tries <= 14 ? 4 : 3), 900);
          } else {
            lock = true; bigMsg('ちがったね… おぼえてね');
            later(() => { els[x].classList.remove('open'); els[y].classList.remove('open'); lock = false; }, 900);
          }
        };
        box.appendChild(b); return b;
      });
      aInfo.textContent = '0かい';
      later(() => { els.forEach(b => b.classList.remove('open')); lock = false; bigMsg('おなじ えを さがしてね'); }, 2200);
    },
  };

  // 3) ぽこぽこ タッチ … でてきた カスタを タッチ
  const gMole = {
    e: '🔨', name: 'ぽこぽこ タッチ', short: 'でてきた カスタを タッチ！',
    how: 'あなから カスタが ぴょこっと でるよ。<br>すばやく タッチしてね！ ⭐ は 3てん！',
    start() {
      let score = 0, left = 25;
      aBody.innerHTML = `<div class="amsg">🍮 0</div><div class="holes"></div>`;
      const box = aBody.querySelector('.holes');
      const holes = Array.from({ length: 9 }, () => {
        const h = document.createElement('div'); h.className = 'hole';
        h.innerHTML = '<div class="pop"></div>'; box.appendChild(h);
        h.addEventListener('pointerdown', () => {
          if (!h.classList.contains('on')) return;
          score += h.dataset.k === 'star' ? 3 : 1; bigMsg('🍮 ' + score);
          h.classList.add('hit'); h.dataset.k === 'star' ? sfx.happy() : sfx.wan();
          later(() => h.classList.remove('on', 'hit'), 160);
        });
        return h;
      });
      aInfo.textContent = '⏱ ' + left;
      const tick = () => { left--; aInfo.textContent = '⏱ ' + left; if (left <= 0) { holes.forEach(h => h.classList.remove('on')); return later(() => result(gMole, `${score}てん！`, Math.max(1, Math.round(score / 4))), 400); } later(tick, 1000); };
      later(tick, 1000);
      const spawn = () => {
        if (left <= 0) return;
        const free = holes.filter(h => !h.classList.contains('on'));
        if (free.length) {
          const h = pick(free), star = Math.random() < .12;
          h.dataset.k = star ? 'star' : 'pudding';
          h.firstChild.innerHTML = star ? '⭐' : `<div class="mini">${MINI}</div>`;
          h.classList.add('on');
          const stay = Math.max(650, 1300 - (25 - left) * 25);
          later(() => h.classList.remove('on'), stay);
        }
        later(spawn, Math.max(380, 800 - (25 - left) * 16));
      };
      later(spawn, 500);
    },
  };

  // 4) まねっこ … ひかった じゅんばんを おぼえる
  const gSimon = {
    e: '🎵', name: 'まねっこ', short: 'ひかった じゅんばんを まねしよう',
    how: 'カスタが ボタンを ひからせるよ。<br>おなじ じゅんばんで タッチしてね！',
    start() {
      const B = [
        { e: '🍓', c: '#ff6b81', f: 523 }, { e: '🍈', c: '#7bd389', f: 659 },
        { e: '🫐', c: '#6aa8ff', f: 784 }, { e: '🍋', c: '#ffd84d', f: 988 },
      ];
      let seq = [], pos = 0;
      aBody.innerHTML = `<div class="amsg"></div><div class="simon wait"></div>`;
      const box = aBody.querySelector('.simon');
      const btns = B.map((b, i) => {
        const el = document.createElement('button'); el.className = 'sbtn'; el.style.background = b.c; el.textContent = b.e;
        el.onclick = () => press(i); box.appendChild(el); return el;
      });
      const flash = (i, ms = 380) => { btns[i].classList.add('lit'); tone(B[i].f, B[i].f, ms / 1000, 'triangle', .16); later(() => btns[i].classList.remove('lit'), ms); };
      function play() {
        box.classList.add('wait'); pos = 0;
        seq.push(Math.floor(Math.random() * 4));
        aInfo.textContent = 'レベル ' + seq.length;
        bigMsg('みてて〜！');
        const sp = Math.max(320, 650 - seq.length * 30);
        seq.forEach((v, k) => later(() => flash(v, sp * .7), 700 + k * sp));
        later(() => { box.classList.remove('wait'); bigMsg('まねして ね！'); }, 700 + seq.length * sp);
      }
      function press(i) {
        flash(i, 220);
        if (i !== seq[pos]) {
          box.classList.add('wait'); sfx.sad();
          const lv = seq.length - 1;
          return later(() => result(gSimon, lv ? `レベル ${lv} まで できた！` : 'おしい！ つぎは できるよ！', Math.max(1, lv)), 700);
        }
        pos++;
        if (pos === seq.length) {
          box.classList.add('wait');
          if (seq.length >= 10) return later(() => result(gSimon, 'レベル 10 クリア！ てんさい！', 12), 600);
          bigMsg(pick(['できた！', 'すごい！', 'ばっちり！'])); later(play, 900);
        }
      }
      play();
    },
  };

  // 5) じゃんけん
  const gJanken = {
    e: '✊', name: 'じゃんけん', short: 'カスタと 5かい しょうぶ',
    how: 'カスタと じゃんけん 5かい しょうぶ！<br>なにを だすか えらんでね',
    start() {
      const H = [{ e: '✊', n: 'ぐー' }, { e: '✌️', n: 'ちょき' }, { e: '✋', n: 'ぱー' }];
      let n = 0, win = 0, lose = 0, lock = false;
      aBody.innerHTML = `<div class="jkface"><div class="mini">${MINI}</div><div class="jkhand">❔</div></div>
        <div class="amsg">じゃんけん…</div><div class="stars"></div><div class="jkrow"></div>`;
      const hand = aBody.querySelector('.jkhand'), row = aBody.querySelector('.jkrow');
      const show = () => { aInfo.textContent = (Math.min(n + 1, 5)) + ' / 5'; aBody.querySelector('.stars').textContent = '⭐'.repeat(win) + '💧'.repeat(lose); };
      H.forEach((h, i) => {
        const b = document.createElement('button'); b.className = 'jkbtn';
        b.innerHTML = `${h.e}<small>${h.n}</small>`;
        b.onclick = () => {
          if (lock) return; lock = true;
          const c = Math.floor(Math.random() * 3);
          bigMsg('ぽん！'); hand.textContent = H[c].e; tone(700, 900, .08, 'square', .08);
          const r = (i - c + 3) % 3; // 0 あいこ / 1 まけ / 2 かち
          later(() => {
            if (r === 0) { bigMsg('あいこ で…'); sfx.pop(); later(() => { hand.textContent = '❔'; bigMsg('じゃんけん…'); lock = false; }, 900); return; }
            n++;
            if (r === 2) { win++; sfx.happy(); bigMsg(pick(['かった！ つよ〜い！', 'まけちゃった〜 ぷるぷる'])); }
            else { lose++; sfx.wan(); bigMsg(pick(['カスタの かち！ えへへ', 'やったー カスタ かった！'])); }
            show();
            if (n >= 5) return later(() => result(gJanken, `5かいちゅう ${win}かい かった！`, win + 1), 1100);
            later(() => { hand.textContent = '❔'; bigMsg('じゃんけん…'); lock = false; }, 1100);
          }, 500);
        };
        row.appendChild(b);
      });
      show();
    },
  };

  // あそびの えらびかた
  const GAMES = [
    { e: '🍓', name: 'おやつキャッチ', short: 'おちてくる おやつを キャッチ', catch: true },
    gCups, gPairs, gMole, gSimon, gJanken,
  ];
  function buildPlay() {
    const box = $('#playChoices'); box.innerHTML = '';
    GAMES.forEach(g => {
      const b = document.createElement('button'); b.className = 'choice';
      b.innerHTML = `<span class="e">${g.e}</span>${g.name}<small>${g.short}</small>`;
      b.onclick = () => { closePanels(); if (g.catch) openGame(); else openArcade(g); };
      box.appendChild(b);
    });
  }

  // ---------------- じかんで すこしずつ へる ----------------
  setInterval(() => {
    if (sleeping) return;
    S.hunger = clamp(S.hunger - .5); S.energy = clamp(S.energy - .25); S.clean = clamp(S.clean - .2);
    drawMeters(); save();
    const m = moodLine();
    if (m && Math.random() < .3 && !running && !arcadeOn && !bathing) { say(m); mouth('sad'); setTimeout(() => mouth('smile'), 1500); }
  }, 20000);
  // ときどき ひとりごと
  setInterval(() => {
    if (sleeping || running || arcadeOn || bathing || busy || !bubble.classList.contains('hide')) return;
    if (Math.random() < .5) { say(pick(['なでなで して〜', 'きょうは なに して あそぶ？', 'いちご たべたいな〜', 'ふんふん♪', 'カラメル つやつや かな？'])); anim('wiggle'); }
  }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  drawMeters(); drawHat();
  setTimeout(() => { const m = moodLine(); say(m || pick(['ぷるんっ！ ぼく カスタ。プリンの こだよ。いっしょに あそぼ！', 'あっ、きてくれた！ うれしい〜！'])); }, 200);
})();
</script>
</body>
</html>
