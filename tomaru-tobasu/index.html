<!doctype html>

<style>

  .train { position:absolute; left:0; top:0; width:40px; height:24px; margin:-12px 0 0 -20px; border-radius:8px 8px 8px 8px;

  .ch .sw { display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid #fff; vertical-align:-1px; margin:0 2px; }

  .big { display:block; width:100%; min-height:64px; margin:8px 0; border:none; border-radius:20px; font-size:21px; font-weight:bold;
    color:#fff; background:var(--ink); box-shadow:0 5px 0 rgba(0,0,0,.22); line-height:1.4; padding:6px 10px; }
  .big:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.22); }
  .big.sub { background:#eef2f6; color:var(--ink); }
  .lv { display:flex; align-items:center; gap:10px; text-align:left; }
  .lv .t { flex:1; } .lv .t small { display:block; font-size:14px; font-weight:normal; opacity:.95; }
  .lv .s { flex:none; font-size:20px; letter-spacing:-2px; }
  .lv1 { background:var(--local); } .lv2 { background:var(--express); } .lv3 { background:var(--ltd); }
  #lines { display:flex; gap:6px; margin:6px 0 4px; }
  .lnb { flex:1; min-height:64px; border:3px solid #dee2e6; border-radius:18px; background:#fff; font-weight:bold; font-size:15px; line-height:1.45; padding:4px 2px; }
  .lnb .e { display:block; font-size:22px; line-height:1.2; }
  .lnb.on { border-color:var(--ink); background:#fff3bf; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .row { display:flex; gap:8px; } .row .big { flex:1; font-size:18px; }
  .note { font-size:13px; color:var(--sub); line-height:1.8; text-align:left; }

  .cmp { text-align:left; margin:8px 0; }
  .cmp .r { display:flex; align-items:center; gap:6px; margin:6px 0; font-weight:bold; font-size:15px; }
  .cmp .lb { flex:none; width:104px; line-height:1.35; font-size:14px; }
  .cmp .bar { flex:1; height:26px; background:#eef2f6; border-radius:13px; position:relative; overflow:hidden; }

  .card { text-align:left; background:#fff; border-radius:18px; padding:10px 14px; margin:10px 0; border:3px solid #e9ecef; }
  .card h3 { margin:0 0 4px; font-size:19px; line-height:1.7; }
  .card p { font-size:16px; margin:4px 0; }
  .mini { display:inline-grid; grid-template-columns:auto auto auto auto; gap:2px 10px; align-items:center; font-weight:bold; font-size:15px; margin:4px 0; }
  .mini .o { width:14px; height:14px; border-radius:50%; border:4px solid currentColor; box-sizing:border-box; justify-self:center; }
  .mini .p { width:4px; height:22px; background:currentColor; opacity:.45; justify-self:center; }
  .tg { display:inline-block; padding:0 8px; border-radius:10px; color:#fff; font-weight:bold; }
  .tg.local { background:var(--local); } .tg.express { background:var(--express); } .tg.ltd { background:var(--ltd); } .tg.com { background:#9c36b5; } .tg.rapid { background:var(--rapid); } .tg.kaitoku { background:var(--kaitoku); }

  #confetti { position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; }

  @media (max-height:600px) {

<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

<script>
'use strict';
const R = (k, y) => `<ruby>${k}<rt>${y}</rt></ruby>`;
const $ = id => document.getElementById(id);

// =====================================================================
//  データ（ここ 1か所に まとめる）。ダイヤ改正で かわったら stops を なおす。
//  たしかめた 日: 2026-11-27
//  ■ 東急東横線 渋谷〜横浜（21駅）
//    駅順: 東急電鉄 公式「東横線 路線図」 https://www.tokyu.co.jp/railway/ty/
//    停車駅: 公式では 一覧表が とれず、路線図サイト rosen-zu.net の 東横線 停車駅と 照合（2023-03-18 改正以降）
//      急行  : 渋谷・中目黒・学芸大学・自由が丘・田園調布・多摩川・武蔵小杉・日吉・綱島・菊名・横浜
//      通勤特急: 渋谷・中目黒・自由が丘・武蔵小杉・日吉・菊名・横浜（カードで しょうかい だけ）
//      特急  : 渋谷・中目黒・自由が丘・武蔵小杉・菊名・横浜
//  ■ 横浜市営地下鉄 ブルーライン 湘南台〜あざみ野（32駅・B01〜B32）
//    区間: 横浜市交通局「市営地下鉄の乗り方」 https://www.city.yokohama.lg.jp/kotsu/sub/norikata/norikata.html
//    駅順・快速停車駅: rosen-zu.net（湘南台行き・あざみ野行き 両方向で 同じ 18駅）
//      快速: 湘南台・下飯田・立場・中田・踊場・戸塚・上永谷・上大岡・関内・桜木町・横浜・新横浜・新羽・仲町台・センター南・センター北・中川・あざみ野
//      （快速は 日中の 運転。ブルーラインには 追い越し設備が ないので「のりかえ」レベルは つくらない）
//  ■ 京急本線 品川〜横浜（25駅）
//    駅順・駅番号: 京急電鉄 公式「各駅情報」 https://www.keikyu.co.jp/ride/kakueki/
//    停車駅: 公式は 画像のみで よめず、rosen-zu.net の 本線 停車駅と 照合

let AC = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return AC; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  return AC;
}
function tone(freq, t0, dur, type, vol, to) {
  if (!SV.sound || !audio()) return;
  const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .2, t + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(t0, dur, vol, fq, fq2) {
  if (!SV.sound || !audio()) return;
  const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime + t0;
  s.buffer = b; f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(fq || 1500, t);
  if (fq2) f.frequency.exponentialRampToValueAtTime(fq2, t + dur);
  g.gain.value = vol || .2; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}

// ===== しくみ（時間の 計算） =====
// stopsBetween: a と b の あいだ（a,b を のぞく）で その 電車が とまる かず
function stopsBetween(type, a, b) {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return STOPS[type].filter(i => i > lo && i < hi).length;
}
function ride(type, a, b) { return Math.abs(b - a) * RUN + stopsBetween(type, a, b) * DWELL; }
// のりかた（plan）: { type, xfer:駅 or null }
function planFor(type, target, useXfer) {
  if (STOPS[type].includes(target) || !useXfer || type === 'local') return { type, xfer:null };
  const x = Math.max(...STOPS[type].filter(i => i < target));
  return { type, xfer:x };
}
function simulate(plan, t) {
  const { type, xfer } = plan;
  if (xfer != null) {
    const time = ride(type, 0, xfer) + XFER + ride('local', xfer, t);
    return { time, stops: stopsBetween(type, 0, xfer) + 1 + stopsBetween('local', xfer, t), over:null };
  }
  if (STOPS[type].includes(t)) return { time: ride(type, 0, t), stops: stopsBetween(type, 0, t), over:null };
  const s = STOPS[type].find(i => i > t);
  const time = ride(type, 0, s) + BACKWAIT + ride('local', s, t);
  return { time, stops: stopsBetween(type, 0, s) + 1 + stopsBetween('local', s, t), over:s, back: BACKWAIT + ride('local', s, t) };
}

function buildMap() {

      curTypes.map(t => `<div class="mk c-${t}">${STOPS[t].includes(i) ? '<span class="o"></span>' : '<span class="p"></span>'}</div>`).join('') +
      `</div><div class="trk"><span class="node"></span></div><div class="nm">${R(k, y)}</div></div>`;
  });
  map.innerHTML = h;
  if (LAND) map.querySelector('.hd .nm').innerHTML = '';
}
function stEl(i) { return map.querySelector(`.st[data-i="${i}"]`); }
function nodePos(i) {
  const n = stEl(i).querySelector('.node'), r = n.getBoundingClientRect(), m = map.getBoundingClientRect();
  return { x: r.left + r.width / 2 - m.left, y: r.top + r.height / 2 - m.top };
}
function posAt(f) {
  const a = Math.max(0, Math.min(N - 1, Math.floor(f))), b = Math.min(N - 1, a + 1), u = f - a;
  const p = nodePos(a), q = nodePos(b);
  return { x: p.x + (q.x - p.x) * u, y: p.y + (q.y - p.y) * u };
}

    this.el.classList.toggle('v', !LAND);

// ===== うごき =====
const sleep = ms => new Promise(r => setTimeout(r, ms));
let token = 0;              // とちゅうで やめたら ふえる
function tween(tr, from, to, ms, onT) {
  const my = token;
  return new Promise(res => {
    const t0 = performance.now();
    function step(now) {
      if (my !== token) return res(false);
      const u = Math.min(1, (now - t0) / ms), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      tr.f = from + (to - from) * e; tr.place(); follow(tr);
      if (onT) onT(tr.f);
      if (u < 1) requestAnimationFrame(step); else res(true);
    }
    requestAnimationFrame(step);
  });
}
function follow(tr) {
  const p = posAt(tr.f), W = mapWrap.clientWidth, H = mapWrap.clientHeight;
  if (LAND) { if (p.x < mapWrap.scrollLeft + 40 || p.x > mapWrap.scrollLeft + W - 40) mapWrap.scrollLeft = p.x - W / 2; }
  else if (p.y < mapWrap.scrollTop + 40 || p.y > mapWrap.scrollTop + H - 40) mapWrap.scrollTop = p.y - H / 2;
}
let minutes = 0;
function setClock(m) { minutes = m; $('clk').textContent = Math.round(m); }
let sayT = 0;
function say(html, cls, ms) {
  const s = $('say'); s.innerHTML = html; s.className = 'show ' + (cls || '');
  clearTimeout(sayT); if (ms) sayT = setTimeout(() => s.className = '', ms);
}
function hush() { $('say').className = ''; }
function mark(i, cls) { const e = stEl(i); e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); }

// a → b を type で はしる。とまる 駅で とまる・とばす 駅は ぴゅーん
async function run(tr, a, b, opts) {
  opts = opts || {};
  const dir = b > a ? 1 : -1;
  const ok = () => opts.my === token;
  for (let i = a; i !== b; i += dir) {
    const nx = i + dir, stop = STOPS[tr.type].includes(nx) || nx === b;
    const passing = !stop;
    if (passing) SND.whoosh();
    await tween(tr, i, nx, (passing ? 330 : 520) * SPD, null);
    if (!ok()) return false;
    setClock(minutes + RUN);
    if (opts.onPass && passing) { const r = await opts.onPass(nx); if (!ok()) return false; if (r === 'pause') {} }
    if (stop) {
      document.querySelectorAll('.st.here').forEach(e => e.classList.remove('here'));
      stEl(nx).classList.add('here');
      if (nx !== b) { SND.stop(); mark(nx, 'flash'); await sleep(380 * SPD); if (!ok()) return false; setClock(minutes + DWELL); }
    }
  }
  return true;
}

// ===== ゲームの すすみ =====
let LV = 1, round = 0, missions = [], target = 0, results = [], busy = false;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeMissions(lv) {
  const L = LEVELS[lv], out = [L.first];
  L.pools.forEach((p, k) => shuffle(p.filter(x => x !== L.first)).slice(0, L.pick[k]).forEach(x => out.push(x)));
  const rest = shuffle(out.slice(1)).filter((x, i, a) => a.indexOf(x) === i);
  return [L.first].concat(rest).slice(0, ROUNDS);
}
function plansOf() {
  const L = LEVELS[LV];
  return L.types.map(t => planFor(t, target, !!L.xfer)).filter(p => p.type === 'local' || p.xfer !== 0);
}
function planLabel(p, short) {
  const T = TYPES[p.type];
  if (p.xfer == null) return short ? T.short : `${T.short}<b>${p.type === 'local' ? 'ぜんぶの えきに とまる' : 'えきを とばす'}</b>`;
  const [k, y] = STATIONS[p.xfer];
  const LS = TYPES.local.short;
  return short ? `${T.short}→${R(k, y)}→${LS}`
    : `${T.short}<b>→ ${R(k, y)}で ${LS}に のりかえ</b>`;
}

function startLevel(lv) {
  LV = lv; round = 0; results = []; missions = makeMissions(lv);
  curTypes = LEVELS[lv].types;
  hideAll(); buildMap(); startRound();
}
function pips() {
  $('pips').innerHTML = missions.map((_, i) => `<i class="${i < round ? 'done' : i === round ? 'now' : ''}"></i>`).join('');
}
function startRound() {
  token++; busy = false; clearTrains(); hush();
  target = missions[round];
  document.querySelectorAll('.st').forEach(e => e.classList.remove('goal', 'here', 'hint'));
  stEl(target).classList.add('goal'); stEl(0).classList.add('here');
  pips();
  const [k, y] = STATIONS[target];
  $('mText').innerHTML = `🎒 <span class="goal">${R(k, y)}</span> へ <span style="white-space:nowrap">${R('行', 'い')}きたい！</span>`;
  setClock(0);
  trains = [new Train('local', 0)];
  trains[0].el.style.opacity = 0;
  mapWrap.scrollTop = 0; mapWrap.scrollLeft = 0;
  const L = LEVELS[LV];
  $('ask').innerHTML = L.xfer
    ? `${R(STATIONS[0][0], STATIONS[0][1])}から。いちばん はやく つく のりかたは どれ？`
    : `${R(STATIONS[0][0], STATIONS[0][1])}の ホームに きた でんしゃ。<span style="color:#c2255c">⭐の ${R('駅', 'えき')}に ◯</span>が ある でんしゃは どれ？`;
  const ps = plansOf();
  $('choices').innerHTML = ps.map((p, i) => `<button class="ch ${p.type}" data-i="${i}">${planLabel(p)}</button>`).join('');
  $('choices').querySelectorAll('.ch').forEach(b => b.onclick = () => choose(ps[+b.dataset.i]));
  setTimeout(() => { if (!busy) follow({ f: target, place(){} }); }, 50);
}

async function choose(plan) {
  if (busy) return; busy = true; SND.tap();
  const my = ++token;
  $('choices').querySelectorAll('.ch').forEach(b => b.disabled = true);
  const T = TYPES[plan.type];
  $('ask').innerHTML = `<span class="tg ${plan.type}">${T.short}</span> に のったよ！`;
  clearTrains(); setClock(0); mapWrap.scrollTop = 0; mapWrap.scrollLeft = 0;
  const tr = new Train(plan.type, 0); trains.push(tr);
  SND.door(); await sleep(450); if (my !== token) return;
  if (plan.type === 'local') say(`🐢「のんびり いこう〜。ぜんぶの ${R('駅', 'えき')}に とまるよ」`, '', 2200);
  else say(`💨「${T.short}、しゅっぱつ！ ぴゅーん！」`, '', 1800);

  const res = simulate(plan, target);
  if (plan.xfer != null) {
    // とちゅうで のりかえ（まちあわせ）
    const x = plan.xfer;
    if (!await run(tr, 0, x, { my })) return;
    SND.stop(); await sleep(250);
    const loc = new Train('local', x, true); trains.push(loc);
    loc.el.style.marginLeft = LAND ? '-20px' : '6px'; loc.el.style.marginTop = LAND ? '6px' : '-12px';
    say(`まちあわせ！ ${TYPES.local.short}が まってたよ。<br>🐢「おさきに どうぞ」<small>（ぺこり）</small>`, 'good');
    SND.bow(); loc.el.classList.add('bow');
    await sleep(1500); if (my !== token) return;
    setClock(minutes + XFER);
    say(`ホームの むかいがわへ のりかえ！`, '', 1400);
    tr.setType('local'); tr.f = x; tr.place();
    loc.setType(plan.type); loc.el.classList.remove('bow');
    // さきに いく とっきゅう・きゅうこう
    const goAway = tween(loc, x, Math.min(N - 1, x + 2.5), 900).then(() => { loc.el.style.transition = 'opacity .4s'; loc.el.style.opacity = 0; });
    SND.whoosh(); await goAway; await sleep(300); if (my !== token) return;
    loc.remove(); SND.door();
    if (!await run(tr, x, target, { my })) return;
  } else if (res.over == null) {
    if (!await run(tr, 0, target, { my })) return;
  } else {
    // とばして しまう
    let shown = false;
    const onPass = async (i) => {
      if (i !== target || shown) return;
      shown = true; SND.oops();
      face(target, '🦝', 2600);
      say(`あっ！ ${R(STATIONS[target][0], STATIONS[target][1])}を とばしちゃった！<br>🦝「おりたかった〜」<small>（まどに ぺたっ）</small>`, 'oops');
      await sleep(1600);
    };
    if (!await run(tr, 0, res.over, { my, onPass })) return;
    SND.stop(); await sleep(300);
    say(`つぎの ${R('駅', 'えき')}で おりて、${TYPES.local.short}で もどろう…`, 'oops');
    await sleep(1400); if (my !== token) return;
    setClock(minutes + BACKWAIT);
    tr.setType('local'); SND.door(); await sleep(300);
    if (!await run(tr, res.over, target, { my })) return;
  }
  // ついた！
  SND.stop(); hush();
  document.querySelectorAll('.st.here').forEach(e => e.classList.remove('here'));
  stEl(target).classList.add('here');
  setClock(res.time);
  await sleep(700); if (my !== token) return;
  showResult(plan, res);
}

function showResult(plan, res) {
  const ps = plansOf(), all = ps.map(p => ({ p, r: simulate(p, target) }));
  const best = Math.min(...all.filter(a => a.r.over == null).map(a => a.r.time));
  const mine = res.time;
  let stars = res.over != null ? 1 : mine <= best ? 3 : 2;
  results[round] = Math.max(results[round] || 0, stars);
  const [k, y] = STATIONS[target];
  let head, msg;
  if (stars === 3) { head = `🎉 いちばん はやい！`; msg = `${R(k, y)}に やく ${Math.round(mine)}ぷんで ついたよ。`; SND.good(); confetti(30); }
  else if (stars === 2) {
    const b = all.find(a => a.r.time === best && a.r.over == null);
    head = `👍 ちゃんと ついたね！`;
    msg = `でも <span class="tg ${b.p.type}">${planLabel(b.p, true)}</span> なら もっと はやかったよ。`;
    SND.good();
  } else {
    head = `😵 とおりすぎちゃった…`;
    msg = `${R(k, y)}は <span class="tg ${plan.type}">${TYPES[plan.type].short}</span> の とばす ${R('駅', 'えき')}（｜）だったね。もどったぶん おそく なったよ。`;
  }
  const max = Math.max(...all.map(a => a.r.time));
  const rows = all.map(a => {
    const me = a.p.type === plan.type && a.p.xfer === plan.xfer;
    const w = a.r.time / max * 100, bw = a.r.back ? a.r.back / max * 100 : 0;
    const crown = a.r.over != null ? '↩️' : a.r.time === best ? '👑' : '';
    return `<div class="r ${me ? 'me' : ''}"><span class="lb"><span class="tg ${a.p.type}">${TYPES[a.p.type].short}</span>${a.p.xfer != null ? `<br><small>→${R(STATIONS[a.p.xfer][0], STATIONS[a.p.xfer][1])}で のりかえ</small>` : ''}</span>
      <span class="bar"><i style="width:${w - bw}%;background:var(--${a.p.type})"></i>${bw ? `<i class="back" style="left:${w - bw}%;width:${bw}%"></i>` : ''}</span>
      <span class="v">${crown}やく${Math.round(a.r.time)}ぷん<br><small>とまる ${a.r.stops}かい</small></span></div>`;
  }).join('');
  $('resBody').innerHTML = `<h2>${head}</h2><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p>${msg}</p>
    <div class="cmp">${rows}</div>
    <p class="note">とまる かずが すくない ほど はやく つくよ。でも、とばす ${R('駅', 'えき')}には おりられない！（↩️ ＝ とおりすぎて もどった ぶん）</p>
    <div class="row"><button class="big sub" id="bRetry">🔁 もういちど</button><button class="big" id="bNext">${round + 1 < missions.length ? 'つぎの おつかい ▶' : 'おしまい ▶'}</button></div>`;
  show('ovRes');
  $('bRetry').onclick = () => { SND.tap(); hideAll(); startRound(); };
  $('bNext').onclick = () => { SND.tap(); hideAll(); round++; if (round < missions.length) startRound(); else endLevel(); };
}

function endLevel() {
  token++;
  const got = results.reduce((s, x) => s + (x || 0), 0), maxS = missions.length * 3;
  const sk = LINE + '-' + LV, prev = SV.stars[sk] || 0; if (got > prev) { SV.stars[sk] = got; save(); }
  SND.clear(); confetti(70);
  const praise = got >= maxS - 1 ? 'すごい！ しゅべつ はかせ だ！' : got >= maxS - 4 ? 'よく できました！' : 'さいごまで できたね！';
  $('endBody').innerHTML = `<h2>🏁 レベル${LV} クリア！</h2>
    <div class="stars">⭐ ${got} / ${maxS}</div>
    <p style="font-size:20px;font-weight:bold">${praise}</p>
    <div class="card"><p>🗺️ <b>ろせんずの「◯」と「｜」を ${R('見', 'み')}ると、その でんしゃが とまるか とばすか わかるよ！</b></p>
    <p style="font-size:14px;color:var(--sub)">つぎは <a href="../chokutsu-burari/">「ちょくつう ぶらり でんしゃ」</a>で、ほかの ${R('線', 'せん')}へ そのまま はいって いく でんしゃを しらべて みよう。</p></div>
    ${LEVELS[LV + 1] ? `<button class="big lv lv${LV + 1}" id="bNextLv">レベル${LV + 1}へ ▶</button>` : ''}
    <div class="row"><button class="big sub" id="bAgain">🔁 もういちど</button><button class="big sub" id="bMenu">🏠 メニュー</button></div>`;
  show('ovEnd');
  if ($('bNextLv')) $('bNextLv').onclick = () => { SND.tap(); startLevel(LV + 1); };
  $('bAgain').onclick = () => { SND.tap(); startLevel(LV); };
  $('bMenu').onclick = () => { SND.tap(); goTitle(); };
}

// ===== まなび カード =====
function cards() {
  const tbl = (rows) => `<div class="mini">` + rows.map(r => r.map((c, j) => j === 0 ? `<span>${c}</span>` : `<span class="${c === 1 ? 'o' : 'p'}" style="color:var(--${['', 'local', 'express', 'ltd'][j]})"></span>`).join('')).join('') + `</div>`;
  $('cardsBody').innerHTML = `<h2>📖 まなび カード</h2>
  <div class="card"><h3>① しゅべつ（でんしゃの しゅるい）</h3>
    <p><span class="tg local">かくえきていしゃ</span> ぜんぶの ${R('駅', 'えき')}に とまる。ゆっくり だけど、どの ${R('駅', 'えき')}にも おりられる。</p>
    <p><span class="tg express">きゅうこう</span> ${R('大', 'おお')}きな ${R('駅', 'えき')}だけ とまって、ほかは とばす。</p>
    <p><span class="tg ltd">とっきゅう</span> もっと ${R('少', 'すく')}ない ${R('駅', 'えき')}だけ。いちばん はやい。</p>
    <p style="font-size:14px">${R('東横線', 'とうよこせん')}には ほかに <span class="tg com">つうきんとっきゅう</span>（あさ・ゆうがたの とっきゅう。${R('日吉', 'ひよし')}にも とまる）も あるよ。</p></div>
  <div class="card"><h3>② ていしゃえきの ${R('表', 'ひょう')}の よみかた</h3>
    <p>${R('駅', 'えき')}の よこの <b>◯</b> は「とまる」、<b>｜</b>（たての せん）は「とおりすぎる（とばす）」。</p>
    ${tbl([[R('渋谷', 'しぶや'), 1, 1, 1], [R('代官山', 'だいかんやま'), 1, 0, 0], [R('中目黒', 'なかめぐろ'), 1, 1, 1], [R('祐天寺', 'ゆうてんじ'), 1, 0, 0], [R('学芸大学', 'がくげいだいがく'), 1, 1, 0]])}
    <p>${R('学芸大学', 'がくげいだいがく')}に いきたい ときは、◯が ある <span class="tg local">かくてい</span> か <span class="tg express">きゅうこう</span>。<span class="tg ltd">とっきゅう</span> は ｜ だから とまらない！</p></div>
  <div class="card"><h3>③ まちあわせ・おいこし</h3>
    <p>はやい でんしゃが うしろから きた とき、かくていは ${R('駅', 'えき')}で まって「おさきに どうぞ」と さきに いかせるよ。これが <b>おいこし</b>。</p>
    <p>おなじ ${R('駅', 'えき')}で のりかえ できるように まって いるのが <b>まちあわせ</b>。とおくの ちいさな ${R('駅', 'えき')}へは、とっきゅうで ちかくまで いって かくていに のりかえると はやい ことが あるよ。</p></div>
  <div class="card"><h3>④ ほかの ${R('線', 'せん')}の しゅべつ</h3>
    <p>🚇 <b>ブルーライン</b>：<span class="tg local">ふつう</span> と <span class="tg rapid">かいそく</span>。かいそくは ひるまだけ はしるよ。${R('地下鉄', 'ちかてつ')}には おいこす ための せんろが ないので、ふつうを おいこさない。</p>
    <p>🚆 <b>${R('京急', 'けいきゅう')}</b>：<span class="tg local">ふつう</span>・<span class="tg ltd">とっきゅう</span>・<span class="tg kaitoku">かいとく</span>（かいそくとっきゅう）。かいとくは とっきゅうより もっと ${R('駅', 'えき')}を とばすよ。</p>
    <p style="font-size:14px">おなじ「とっきゅう」でも、${R('線', 'せん')}が ちがうと とまる ${R('駅', 'えき')}の きまりも ちがうよ。</p></div>
  <button class="big" id="bCardsClose">とじる</button>`;
  show('ovCards');
  $('bCardsClose').onclick = () => { SND.tap(); hide('ovCards'); };
}

// ===== がめん =====
function show(id) { $(id).classList.add('show'); }
function hide(id) { $(id).classList.remove('show'); }
function hideAll() { ['ovTitle', 'ovRes', 'ovEnd', 'ovCards'].forEach(hide); $('confetti').innerHTML = ''; }
function goTitle() {
  token++; busy = false; clearTrains(); hush(); hideAll();
  titleLines();
  show('ovTitle');
}
function sndBtn() { $('bSnd').textContent = SV.sound ? '🔊' : '🔇'; $('bSnd2').textContent = SV.sound ? '🔊 おと オン' : '🔇 おと オフ'; }
function toggleSnd() { SV.sound = !SV.sound; save(); sndBtn(); if (SV.sound) { audio(); SND.tap(); } }
$('bSnd').onclick = toggleSnd; $('bSnd2').onclick = toggleSnd;
$('bHome').onclick = () => { SND.tap(); goTitle(); };
$('bCards').onclick = () => { SND.tap(); cards(); };
function titleLines() {
  $('lines').innerHTML = LINE_ORDER.map(id => `<button class="lnb ${id === LINE ? 'on' : ''}" data-line="${id}"><span class="e">${LINES[id].emoji}</span>${LINES[id].btn}</button>`).join('');
  $('lines').querySelectorAll('.lnb').forEach(b => b.onclick = () => {
    SND.tap(); setLine(b.dataset.line); SV.line = LINE; save(); curTypes = Object.keys(TYPES); buildMap(); titleLines();
  });
  const st = STATIONS;
  $('lineSub').innerHTML = `${LINES[LINE].name}（${R(st[0][0], st[0][1])}〜${R(st[N - 1][0], st[N - 1][1])}・${N}えき）で おつかい！`;
  $('lvBtns').innerHTML = Object.keys(LEVELS).map(l => {
    const sc = SV.stars[LINE + '-' + l] || 0;
    return `<button class="big lv lv${l}" data-lv="${l}"><span class="t">レベル${l}<small>${LEVELS[l].sub}</small></span><span class="s">${sc ? '⭐' + sc : ''}</span></button>`;
  }).join('');
  $('lvBtns').querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { audio(); SND.tap(); startLevel(+b.dataset.lv); });
}

function confetti(n) {
  const box = $('confetti'), cols = ['#e03131', '#1c6fd6', '#2f9e44', '#f2b705', '#ae3ec9'];
  for (let i = 0; i < n; i++) {
    const e = document.createElement('i'); e.style.left = Math.random() * 100 + 'vw';
    e.style.background = cols[i % cols.length]; e.style.animationDelay = Math.random() * .6 + 's';
    e.style.animationDuration = 1.4 + Math.random() + 's'; box.appendChild(e);
    setTimeout(() => e.remove(), 3200);
  }
}

function layout() {
  const was = LAND;
  LAND = innerWidth > innerHeight * 1.05;
  document.body.classList.toggle('land', LAND);
  if (was !== LAND) {
    const tg = map.querySelector('.st.goal') ? target : null;
    const here = map.querySelector('.st.here');
    const hi = here ? +here.dataset.i : null;
    const saved = trains.map(t => ({ type: t.type, f: t.f, ghost: t.el.classList.contains('ghost'), op: t.el.style.opacity }));
    buildMap(); trains = [];
    saved.forEach(s => { const t = new Train(s.type, s.f, s.ghost); t.el.style.opacity = s.op; trains.push(t); });
    if (tg != null) stEl(tg).classList.add('goal');
    if (hi != null) stEl(hi).classList.add('here');
  }
  trains.forEach(t => t.place());
}
addEventListener('resize', layout);
LAND = innerWidth > innerHeight * 1.05; document.body.classList.toggle('land', LAND);
buildMap(); sndBtn(); goTitle();
</script>
</body>
</html>
