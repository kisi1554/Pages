<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ちずきごう たからさがし</title>
<meta name="description" content="ちずの きごうと ほういで たからを さがそう。地図記号カード・たからさがし15ステージ・ちずづくり。">
<meta name="theme-color" content="#5c7c2a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="stylesheet" href="style.css?v=c3db83c">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { e.preventDefault(); }
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<header class="top">
  <button class="pill back" id="backBtn" hidden aria-label="もどる">‹ <span class="long">もどる</span></button>
  <h1 class="title"><span aria-hidden="true" id="titleEmoji">🗺️</span><span id="titleText">ちずきごう たからさがし</span></h1>
  <button class="pill" id="zukanBtn" aria-label="ずかん">📖 <span class="long">ずかん</span> <b id="learnCount">0</b></button>
  <button class="pill round" id="soundBtn" aria-pressed="true" aria-label="おと オン／オフ">🔊</button>
</header>

<!-- ホーム -->
<main class="view scroll" id="home">
  <div class="wrap">
    <div class="hero">
      <div class="hero-map" id="heroMap" aria-hidden="true"></div>
      <p class="lead">ちずの <b>きごう</b> と <b>ほうい</b> を つかって、うまって いる <b>たから</b> を さがそう！</p>
    </div>
    <div class="modes">
      <button class="mode" id="goCards" style="--c:#2f7fb8; --t:#e3f0fa;">
        <span class="mode-emoji" aria-hidden="true">🃏</span>
        <span class="mode-text"><span class="mode-name">きごう カード</span><span class="mode-level">★</span>
          <span class="mode-desc">きごうを みて なまえを あてよう</span></span>
      </button>
      <button class="mode" id="goStages" style="--c:#b8741a; --t:#fdf0dc;">
        <span class="mode-emoji" aria-hidden="true">💎</span>
        <span class="mode-text"><span class="mode-name">たからさがし</span><span class="mode-level">★★</span>
          <span class="mode-desc">ヒントと ほういじしんで たからを ほりだそう</span></span>
        <span class="mode-badge" id="starTotal"></span>
      </button>
      <button class="mode" id="goMaker" style="--c:#5c7c2a; --t:#eef5e0;">
        <span class="mode-emoji" aria-hidden="true">✏️</span>
        <span class="mode-text"><span class="mode-name">ちず づくり</span><span class="mode-level">じゆう</span>
          <span class="mode-desc">きごうを おいて じぶんの まちを つくろう</span></span>
      </button>
    </div>
    <p class="note">おうちの かたへ: <ruby>小学<rt>しょうがく</rt></ruby>3<ruby>年<rt>ねん</rt></ruby>の しゃかいで ならう <ruby>地図記号<rt>ちずきごう</rt></ruby> と <ruby>八方位<rt>はっぽうい</rt></ruby> の よしゅう・ふくしゅうが できます。きごうの かたちは <ruby>国土地理院<rt>こくどちりいん</rt></ruby>の <ruby>地形図<rt>ちけいず</rt></ruby>に そろえています。</p>
  </div>
</main>

<!-- きごう カード -->
<main class="view scroll" id="cards" hidden>
  <div class="quiz">
    <div class="quiz-top">
      <div class="bar"><i id="qBar"></i></div>
      <span class="qnum" id="qNum"></span>
    </div>
    <p class="again" id="qAgain" hidden>🔁 さっき まちがえた きごう、もういちど！</p>
    <div class="qbox" id="qBox"></div>
    <div class="choices" id="choices"></div>
    <div class="feed" id="qFeed" hidden>
      <p class="feed-head" id="qFeedHead"></p>
      <div class="feed-body">
        <div class="feed-sym" id="qFeedSym"></div>
        <div><p class="feed-name" id="qFeedName"></p><p class="feed-why" id="qFeedWhy"></p></div>
      </div>
      <button class="big" id="qNext">つぎへ ›</button>
    </div>
  </div>
</main>

<!-- ステージ えらび -->
<main class="view scroll" id="stages" hidden>
  <div class="wrap">
    <p class="lead">ステージを えらんでね。1〜7 は <b>4ほうい</b>、8から <b>8ほうい</b>（ななめ）だよ。</p>
    <div class="stage-grid" id="stageGrid"></div>
  </div>
</main>

<!-- たからさがし -->
<main class="view" id="hunt" hidden>
  <div class="hunt">
    <div class="map-col">
      <div class="map-north" aria-hidden="true">▲ きた</div>
      <div class="map-fit"><div class="map-box" id="mapBox"></div></div>
    </div>
    <div class="side">
      <div class="hint-bar" id="hintBar">
        <span class="hb-label">ヒント</span><span class="hb-list" id="hbList"></span>
        <button class="small" id="retryBtn" aria-label="さいしょから">↺ はじめから</button>
      </div>
      <div class="hints" id="hintList" aria-live="polite"></div>
      <div class="controls">
        <div class="pad" id="pad">
          <div class="compass" id="compass" aria-hidden="true"></div>
        </div>
        <div class="acts">
          <div class="steps" id="steps" role="radiogroup" aria-label="すすむ マスの かず"></div>
          <button class="big dig" id="actBtn">ここだ！</button>
          <div class="msg" id="huntMsg" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ちず づくり -->
<main class="view" id="maker" hidden>
  <div class="hunt maker">
    <div class="map-col">
      <div class="map-north" aria-hidden="true">▲ きた</div>
      <div class="map-fit"><div class="map-box" id="makeBox"></div></div>
    </div>
    <div class="side">
      <div class="slots" id="slots" role="tablist" aria-label="ほぞん する ばしょ"></div>
      <p class="make-tip" id="makeTip">きごうを えらんで マスを タップ</p>
      <div class="palette" id="palette"></div>
      <div class="make-acts">
        <button class="small" id="clearMap">🗑️ ぜんぶ けす</button>
        <span class="saved" id="savedMark">💾 じどうで ほぞん</span>
      </div>
    </div>
  </div>
</main>

<!-- ずかん -->
<main class="view scroll" id="zukan" hidden>
  <div class="wrap">
    <p class="lead" id="zukanLead"></p>
    <div class="zdetail" id="zukanDetail" aria-live="polite"></div>
    <div class="zukan-grid" id="zukanGrid"></div>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-art" id="modalArt"></div>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="symbols.js?v=c3db83c"></script>
<script src="rules.js?v=c3db83c"></script>
<script src="stages.js?v=c3db83c"></script>
<script src="app.js?v=c3db83c"></script>
</body>
</html>
