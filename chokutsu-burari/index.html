<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

/* ---------- グラフ ---------- */
const EDGE = {};      // "a|b" -> lineId
function ek(a, b) { return a < b ? a + "|" + b : b + "|" + a; }
for (const lid in LINES) { const s = LINES[lid].stations; for (let i = 0; i + 1 < s.length; i++) EDGE[ek(s[i], s[i + 1])] = lid; }
function lineOf(a, b) { return EDGE[ek(a, b)]; }
function plain(h) { return String(h).replace(/<rt>.*?<\/rt>/g, "").replace(/<[^>]+>/g, ""); }
function yomi(h) { return String(h).replace(/<ruby>(.*?)<rt>(.*?)<\/rt><\/ruby>/g, "$2").replace(/<[^>]+>/g, ""); }

  return ac;
}
function tone(f, d, type = "sine", v = .16, t0 = 0, f2) {

/* ---------- カメラ（でんしゃを おいかける） ---------- */
let cam = null, camMode = { t: "follow" }, tpos = { x: 0, y: 0 };
function boxSize() { const r = svg.getBoundingClientRect(); return [Math.max(r.width, 50), Math.max(r.height, 50)]; }
function camTarget() {
  const [bw, bh] = boxSize();
  let cx, cy, s;
  if (camMode.t === "fit") {
    const [x0, y0, x1, y1] = camMode.b;
    s = Math.min(bw / (x1 - x0), bh / (y1 - y0), 1.3);
    cx = (x0 + x1) / 2; cy = (y0 + y1) / 2;
  } else {
    s = Math.max(.7, Math.min(1.3, Math.min(bw, bh) / 430));
    cx = tpos.x; cy = tpos.y - 20;
  }
  const w = bw / s, h = bh / s;
  const [X0, Y0, X1, Y1] = bounds();
  if (w < X1 - X0) cx = Math.max(X0 + w / 2, Math.min(X1 - w / 2, cx)); else cx = (X0 + X1) / 2;
  if (h < Y1 - Y0) cy = Math.max(Y0 + h / 2, Math.min(Y1 - h / 2, cy)); else cy = (Y0 + Y1) / 2;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}
function fitStations(ids, extra) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const id of ids) add(ST[id].x, ST[id].y);
  for (const p of extra || []) add(p[0], p[1]);

}
let lastT = 0;
function frame(t) {
  const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  if (document.getElementById("play").classList.contains("on")) {
    const tg = camTarget();
    if (!cam) cam = tg;
    const k = Math.min(1, dt * 3.5);
    for (const p of ["x", "y", "w", "h"]) cam[p] += (tg[p] - cam[p]) * k;
    svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${cam.w} ${cam.h}`);
  }
  requestAnimationFrame(frame);
}

function runTo(route, from, to, my) {     // route[from] → route[to] まで
  return new Promise(res => {
    let i = from, d = 0, prev = performance.now(), clack = 0;
    camMode = { t: "follow" };
    function step(now) {
      if (my !== gen) return;
      const dt = Math.min(.05, (now - prev) / 1000); prev = now;
      if (i >= to) { res(); return; }
      const A = ST[route[i]], B = ST[route[i + 1]], len = Math.hypot(B.x - A.x, B.y - A.y);
      d += 230 * dt; clack += dt; if (clack > .45) { clack = 0; SFX.clack(); }
      if (d >= len) { d -= len; i++; if (i >= to) { placeTrain(B.x, B.y); res(); return; } }
      else { const f = d / len; placeTrain(A.x + (B.x - A.x) * f, A.y + (B.y - A.y) * f); }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

    setMsg(q.q); speak(sayText);
    trainG.setAttribute("opacity", ".3");
    const box = $("opts"); box.innerHTML = "";
    if (q.type === "point") { const ok = q.opts.find(o => o.ok); pointArrow(q.at, ok.next); SFX.point();
      fitStations([q.at, ...q.opts.map(o => o.next)]); }
    else if (q.type === "line") fitStations([q.at], q.opts.map(o => o.stub ? STUBS[o.stub].to : [ST[LINES[o.line].stations[LINES[o.line].stations.indexOf(q.at) + 1] || q.at].x, ST[LINES[o.line].stations[LINES[o.line].stations.indexOf(q.at) + 1] || q.at].y]));
    else if (q.type === "final") { const ends = q.opts.filter(o => o.st).map(o => o.st); fitStations([q.at, ...(ends.length ? ends : [c.route[c.route.length - 1]])]); }
    for (const o of q.opts) {
      const b = document.createElement("button"); b.className = "opt"; b.innerHTML = optHTML(o);
      b.onclick = () => {
        if (my !== gen || b.classList.contains("bad") || b.classList.contains("good")) return;
        if (o.ok) {
          SFX.ok(); b.classList.add("good");
          for (const x of box.children) x.disabled = true;
          L_mark.innerHTML = ""; trainG.setAttribute("opacity", "1");
          res();
        } else {
          miss++; SFX.ng(); b.classList.add("bad");
          let why = o.why;
          if (!why && o.stub) { why = `${STUBS[o.stub].h}は せんろが つながって いないよ（てんせん）。のるには のりかえが いるね。`; flashEl(`[data-stub="${o.stub}"]`); }
          if (!why && q.type === "point") why = "ポイントの やじるしを よく みてね。";
          setMsg(`<span class="ng">${why}</span><br>${q.q}`);
        }
      };
      box.appendChild(b);
    }
  });
}
async function crewShow(bd, my) {
  const t = $("toast");
  t.innerHTML = driver(LINES[bd.a].c, true) + '<span class="five">🙌</span>' + driver(LINES[bd.b].c, true) +
    `<div class="tt">パチン！「よろしく〜！」「まかせて〜！」<br><small>${LINES[bd.a].co} → ${LINES[bd.b].co}の うんてんしさんに こうたい</small></div>`;
  t.classList.add("on"); SFX.five(); giveCard("k2");
  await wait(2300, my); t.classList.remove("on");
}
async function startCourse(c) {
  const my = ++gen; cur = c; miss = 0; gotCards = [];
  G = c.mode === "bonus" ? "bonus" : "main";
  show("play"); drawMap(); cam = null;
  const r = c.route; placeTrain(ST[r[0]].x, ST[r[0]].y);
  setSign("？？？", "ゆき"); $("flap").classList.remove("done"); $("opts").innerHTML = "";
  setMsg(`${stH(r[0])}を しゅっぱつ！ <ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>は ？？？。ひつじさんは もう ねむっちゃった…`);
  camMode = { t: "follow" };
  await wait(1400, my);
  let idx = 0;
  const done = new Set();
  const hl = (k) => { const key = r[k] + "|" + r[k + 1]; if (k < 0 || k >= r.length - 1 || done.has(key)) return; done.add(key); hlLine(lineOf(r[k], r[k + 1]), r[k], r[k + 1]); };
  const stops = [...new Set(c.qs.map(q => r.indexOf(q.at)))].sort((a, b) => a - b);
  for (const si of stops) {
    $("opts").innerHTML = "";
    setMsg("ガタン ゴトン…");
    await runTo(r, idx, si, my);
    for (let k = idx; k < si; k++) hl(k);
    idx = si;
    const at = r[si], qs = c.qs.filter(q => q.at === at);
    const lp = lineOf(r[si - 1], at), ln = lineOf(at, r[si + 1]);
    if (!qs.some(q => q.type !== "final") && lp && ln && LINES[lp].co !== LINES[ln].co) {
      // しつもん なしで とおる さかいめ（和光市 など）
      setMsg(`${stH(at)}から ${LINES[ln].h}へ ちょくつう！ せんろの いろが かわっても、おなじ でんしゃの まま。`);
      speak(sayText); giveCard("k1");
      const bd = BORDERS.find(b => b.at === at);
      if (bd && bd.crew) await crewShow(bd, my); else await wait(1800, my);
    }
    for (const q of qs) {
      await ask(q, c, my);
      if (q.type === "final") { await flapTo(c.dest, my); setMsg(`<span class="okc">せいかい！</span> <ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby><ruby>表示<rt>ひょうじ</rt></ruby>が かわったよ！`); speak(sayText); await wait(1200, my); continue; }
      const lineNext = lineOf(at, r[si + 1]);
      if (lineNext && lp && LINES[lineNext].co !== LINES[lp].co) {
        setMsg(`<span class="okc">せいかい！</span> ${LINES[lp].h} から ${LINES[lineNext].h} へ。せんろの いろが かわっても、おなじ でんしゃの まま！ これが ちょくつう。`);
        speak(sayText); giveCard("k1");
        const bd = BORDERS.find(b => b.at === at);
        if (bd && bd.crew) await crewShow(bd, my);
        else if (bd && bd.note) { setMsg($("msg").innerHTML + "<br><small>" + bd.note + "</small>"); speak(sayText); await wait(3800, my); }
        else await wait(2200, my);
      } else { setMsg(`<span class="okc">せいかい！</span> ${LINES[lineNext].h}に すすむよ。`); speak(sayText); await wait(1500, my); }
    }
  }
  // のこり（とちゅうの さかいめでは こうたい えんしゅつ）
  $("opts").innerHTML = "";
  while (idx < r.length - 1) {
    let nx = idx + 1;
    while (nx < r.length - 1 && !BORDERS.some(b => b.at === r[nx] && b.crew && LINES[lineOf(r[nx - 1], r[nx])].co !== LINES[lineOf(r[nx], r[nx + 1])].co)) nx++;
    setMsg(`${c.dest.k}${c.dest.ho ? " ほうめん" : " ゆき"}、はしる はしる…`);
    await runTo(r, idx, nx, my);
    for (let k = idx; k < nx; k++) hl(k);
    idx = nx;
    if (idx < r.length - 1) { const bd = BORDERS.find(b => b.at === r[idx]); if (bd) await crewShow(bd, my); }
  }
  for (let k = 0; k < r.length - 1; k++) hl(k);
  SFX.arrive(); giveCard("k3");
  setMsg(`🎉 ${c.dest.ho ? c.dest.k + "の ほうに" : stH(r[r.length - 1]) + "に"} ついたよ！ のりかえ なしで ここまで きた！`);
  camMode = { t: "fit", b: bounds() };
  await wait(1700, my);
  finish(c, c.funny, c.after);
}

/* ---------- ぎゃく モード ---------- */
let revState = null;
function segsOf(route) {      // 線ごとの ひとまとまり
  const out = [];
  for (let i = 0; i + 1 < route.length; i++) {
    const l = lineOf(route[i], route[i + 1]);
    if (out.length && out[out.length - 1].line === l) out[out.length - 1].to = i + 1;
    else out.push({ line: l, from: i, to: i + 1 });
  }
  return out;
}
function startRev(rv) {
  const my = ++gen; cur = rv; miss = 0; gotCards = [];
  G = rv.g; show("play"); drawMap(); cam = null;
  const r = rv.route; placeTrain(ST[r[0]].x, ST[r[0]].y);
  setSign(rv.dest.k + (rv.dest.ho ? " ほうめん" : " 行"), rv.dest.r + (rv.dest.ho ? "" : " ゆき")); $("flap").classList.add("done");
  const segs = segsOf(r);
  revState = { rv, segs, k: 0, my, busy: false };
  setMsg(`<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby><ruby>表示<rt>ひょうじ</rt></ruby>は「${rv.dest.r ? `<ruby>${rv.dest.k}<rt>${rv.dest.r}</rt></ruby>` : rv.dest.k}${rv.dest.ho ? " ほうめん" : " ゆき"}」。${stH(r[0])}から、どの せんを とおる？ じゅんばんに タッチ！（ろせんずの せんも タッチ できるよ）`);
  speak(sayText);
  camMode = { t: "fit", b: bounds() };
  const ids = [...new Set(segs.map(s => s.line))].map(l => ({ line: l })).concat(rv.decoys.map(d => LINES[d] ? { line: d } : { stub: d }));
  for (let i = ids.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const box = $("opts"); box.innerHTML = '<div class="chips" id="chips"></div>';
  for (const o of ids) {
    const b = document.createElement("button"); b.className = "chip";
    const c = o.line ? LINES[o.line].c : STUBS[o.stub].c;
    b.innerHTML = `<span class="sw" style="background:${c}"></span><span>${o.line ? LINES[o.line].h : STUBS[o.stub].h}</span>`;
    b.dataset.id = o.line || o.stub;
    b.onclick = () => onPick(o.line || o.stub, b);
    $("chips").appendChild(b);
  }
}
function onLineTap(lid) { if (revState && revState.my === gen && document.getElementById("play").classList.contains("on")) onPick(lid, document.querySelector(`.chip[data-id="${lid}"]`)); }
async function onPick(id, btn) {
  const S = revState; if (!S || S.my !== gen || S.busy || S.k >= S.segs.length) return;
  if (btn && btn.classList.contains("used")) return;
  const seg = S.segs[S.k], r = S.rv.route;
  if (id !== seg.line) {
    miss++; SFX.ng(); if (btn) { btn.classList.remove("bad"); void btn.offsetWidth; btn.classList.add("bad"); }
    const nm = LINES[id] ? LINES[id].h : STUBS[id].h;
    setMsg(`<span class="ng">${nm}は ${S.k === 0 ? "ここからは のれないよ" : "いまの せんろと つながって いないよ"}。</span> ${stH(r[seg.from])}から つづく せんを さがしてね。`);
    if (STUBS[id]) flashEl(`[data-stub="${id}"]`);
    return;
  }
  S.busy = true; SFX.ok();
  if (btn) { btn.classList.add("used"); btn.insertAdjacentHTML("afterbegin", `<span class="no">${S.k + 1}</span>`); }
  hlLine(seg.line, r[seg.from], r[seg.to]);
  setMsg(`<span class="okc">${S.k + 1}. ${LINES[seg.line].h}</span>、はしる はしる…`);
  await runTo(r, seg.from, seg.to, S.my);
  S.k++; S.busy = false;
  if (S.k >= S.segs.length) {
    SFX.arrive(); giveCard("k1"); giveCard("k3");
    setMsg(`🎉 ${S.rv.dest.k}${S.rv.dest.ho ? "の ほう" : ""}に ついた！ ${S.segs.length}つの せんを のりかえ なしで とおったよ。`);
    camMode = { t: "fit", b: bounds() };
    await wait(1600, S.my);
    finish(S.rv, ["sheep"]);
  } else {
    const at = r[seg.to], bd = BORDERS.find(b => b.at === at);
    const nx = LINES[S.segs[S.k].line];
    if (LINES[seg.line].co !== nx.co) {
      setMsg(`${stH(at)}は <ruby>会社<rt>かいしゃ</rt></ruby>の さかいめ。つぎは どの せん？`);
      if (bd && bd.crew) { S.busy = true; await crewShow(bd, S.my); S.busy = false; }
    } else setMsg(`${stH(at)}で せんの なまえが かわるよ。つぎは どの せん？`);
    camMode = { t: "follow" };
  }
}

/* ---------- けっか ---------- */
function finish(c, funny, after) {
  const stars = miss === 0 ? 3 : miss <= 2 ? 2 : 1;
  if ((save.stars[c.id] || 0) < stars) save.stars[c.id] = stars;
  store();
  const dest = c.dest, isRev = !!REVERSE.find(x => x === c);
  const fun = funny[(Math.random() * funny.length) | 0];
  const om = fun === "sheep"
    ? `<div class="omake"><svg viewBox="0 0 104 100" class="wake">${sheep("wake")}</svg><div class="ot">ひつじさんが めを さました。<br>「ふぁ〜… ここ どこ〜？ ${dest.k}！？ ねてる あいだに こんなに とおくまで！」</div></div>`
    : `<div class="omake"><svg viewBox="0 0 150 76" class="sag">${trainSVG("hungry")}</svg><div class="ot">でんしゃ「とおくまで はしりすぎて… おなか ぺこぺこ〜」<br>ぐぅ〜〜。 しゃこで ひとやすみ してね。</div></div>`;
  const cards = gotCards.map(k => `<div class="lcard new"><h3>${CARDS[k].t}</h3><p>${CARDS[k].p}</p></div>`).join("");
  const list = isRev ? REVERSE : COURSES.filter(x => x.mode === c.mode);
  const nextC = list[list.indexOf(c) + 1];
  $("res").innerHTML =
    `<div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? "" : "off"}" style="animation-delay:${i * .15}s">⭐</span>`).join("")}</div>` +
    `<div class="rmsg">${stars === 3 ? "すごい！ ちょくつう はかせ！" : stars === 2 ? "よく できました！" : "さいごまで いけたね！"}</div>` +
    `<div class="rsub">${isRev ? "<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby><ruby>表示<rt>ひょうじ</rt></ruby>から とおる せんを たどれたね。" : `<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>は「${dest.r ? `<ruby>${dest.k}<rt>${dest.r}</rt></ruby>` : dest.k}${dest.ho ? " ほうめん" : " ゆき"}」でした（たとえば の <ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>だよ。じかんで かわるよ）。`}${after ? "<br>" + after : ""}</div>` +
    om + cards +
    `<div class="wrap">💡 ろせんずで、いろの ちがう せんが とぎれずに つながって いたら、ちょくつうで のりかえ なしで いけるよ。<br>🚉 つぎは「のぼり・くだり」で、でんしゃの むきと ホームを しらべよう！</div>` +
    `<div class="rbtns"><button class="big" id="rRetry">🔁 もういちど</button>${nextC ? '<button class="big go" id="rNext">つぎへ ▶</button>' : ""}<button class="big" id="rMenu">🏠 メニュー</button></div>`;
  $("ov").classList.add("on");
  if (fun === "sheep") SFX.yawn(); else SFX.growl();
  $("rRetry").onclick = () => { SFX.tap(); $("ov").classList.remove("on"); isRev ? startRev(c) : startCourse(c); };
  if (nextC) $("rNext").onclick = () => { SFX.tap(); $("ov").classList.remove("on"); isRev ? startRev(nextC) : startCourse(nextC); };
  $("rMenu").onclick = () => { SFX.tap(); $("ov").classList.remove("on"); gen++; renderTitle(); show("title"); };
}

refreshSnd();
renderTitle();
</script>
