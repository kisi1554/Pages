<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>がったい どうぶつ ラボ</title>
<meta name="description" content="あたま・からだ・あし・しっぽを べつべつの どうぶつから えらんで、へんてこ どうぶつを つくろう。やま・うみ・そら・さばく・こおりの コースを はしらせて、どうぶつの からだの しくみを まなぶ。">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<link rel="stylesheet" href="style.css?v=75089c5">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="あそびメニューへ">🏠</a>
  <h1>🦁 がったい どうぶつ ラボ</h1>
  <button type="button" id="soundBtn" class="icon-btn" aria-label="おと オン/オフ" aria-pressed="true">🔊</button>
</header>

<nav class="tabs" role="tablist">
  <button type="button" class="tab on" data-view="lab" role="tab">🧪 ラボ</button>
  <button type="button" class="tab" data-view="odai" role="tab">🎯 おだい</button>
  <button type="button" class="tab" data-view="zukan" role="tab">📖 ずかん</button>
</nav>

<main>
  <!-- ラボ -->
  <section id="vLab" class="view">
    <div id="odaiBanner" class="odai-banner" hidden>
      <span class="ob-text"></span>
      <button type="button" id="odaiQuit" class="mini-btn">やめる</button>
    </div>
    <div class="lab-grid">
      <div class="preview card-box">
        <div id="previewArt" class="preview-art"></div>
        <div class="name-row"><span id="cName" class="cname"></span></div>
        <div id="statBox" class="stats"></div>
        <div id="traitBox" class="traits"></div>
      </div>
      <div class="controls">
        <div id="reels" class="reels"></div>
        <div class="course-row">
          <span class="lbl">コース</span>
          <div id="courseBox" class="course"></div>
          <button type="button" id="courseBtn" class="mini-btn" aria-label="コースを かえる">🔀</button>
        </div>
        <div class="btn-row">
          <button type="button" id="spinBtn" class="big-btn spin">🎰 ぐるぐる</button>
          <button type="button" id="raceBtn" class="big-btn go">🏁 はしらせる</button>
        </div>
      </div>
    </div>
  </section>

  <!-- レース -->
  <section id="vRace" class="view" hidden>
    <div class="race-top">
      <div id="raceBar" class="race-bar"></div>
      <div class="timer"><span id="raceTime">0.0</span> びょう</div>
    </div>
    <div id="stage" class="stage">
      <div id="scroller" class="scroller"></div>
      <div id="racer" class="racer"></div>
      <div id="raceLabel" class="race-label"></div>
    </div>
    <div class="btn-row"><button type="button" id="skipBtn" class="mini-btn">⏩ とばす</button></div>
    <div id="result" class="result card-box" hidden>
      <div id="resHead" class="res-head"></div>
      <table id="resTable" class="res-table"></table>
      <div id="resTip" class="tip"></div>
      <div class="btn-row">
        <button type="button" id="saveBtn" class="big-btn save">📖 ずかんに のこす</button>
        <button type="button" id="againBtn" class="big-btn">🔁 もういちど</button>
        <button type="button" id="backBtn" class="big-btn go">🧪 ラボへ</button>
      </div>
    </div>
  </section>

  <!-- おだい -->
  <section id="vOdai" class="view" hidden>
    <p class="lead">おだいに あう どうぶつを つくって、ゴールタイムより はやく ゴールしよう！</p>
    <div id="odaiList" class="odai-list"></div>
  </section>

  <!-- ずかん -->
  <section id="vZukan" class="view" hidden>
    <div class="subtabs">
      <button type="button" class="subtab on" data-z="real">ほんものの どうぶつ</button>
      <button type="button" class="subtab" data-z="mine">つくった どうぶつ <span id="mineCount"></span></button>
    </div>
    <div id="zukanReal" class="zukan-grid"></div>
    <div id="zukanMine" class="zukan-grid" hidden></div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="parts.js?v=75089c5"></script>
<script src="lab.js?v=75089c5"></script>
<script src="audio.js?v=75089c5"></script>
<script src="app.js?v=75089c5"></script>
</body>
</html>
