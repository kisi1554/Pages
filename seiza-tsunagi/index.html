<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>せいざ つなぎ</title>
<meta name="description" content="よぞらの ほしを ゆびで つないで せいざを かんせいさせよう。せいざ ずかんと こんやの そらの おすすめつき。">
<meta name="theme-color" content="#060A1C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="stylesheet" href="style.css?v=4c5eb3f">
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<canvas id="sky" aria-label="よぞら"></canvas>
<svg id="art" aria-hidden="true"></svg>

<header class="top" id="top">
  <button class="pill back" id="backBtn" hidden aria-label="もどる">‹ <span class="long">もどる</span></button>
  <h1 class="title" id="title"><span class="t-emoji" id="titleEmoji">⭐</span><span id="titleText">せいざ つなぎ</span></h1>
  <div class="top-right">
    <button class="pill round" id="soundBtn" aria-pressed="true" aria-label="おと オン／オフ">🔊</button>
    <button class="pill" id="zukanBtn" aria-label="ずかん">📖<span class="long"> ずかん</span> <b id="zukanCount">0</b><small>/<span id="zukanAll">19</span></small></button>
  </div>
</header>

<!-- ホーム -->
<main class="view scroll" id="home">
  <div class="wrap">
    <section class="mode-box">
      <span class="label">レベル</span>
      <div class="seg" role="group" aria-label="レベル">
        <button id="modeEasy" aria-pressed="true">🌟 かんたん<small>ばんごう つき</small></button>
        <button id="modeHard" aria-pressed="false">🌌 むずかしい<small>ばんごう なし</small></button>
      </div>
    </section>

    <section class="tonight">
      <h2>🌙 こんやの そら</h2>
      <p class="sub" id="tonightSub"></p>
      <div class="tonight-list" id="tonightList"></div>
    </section>

    <section>
      <h2>✨ せいざを えらぶ</h2>
      <div class="grid" id="grid"></div>
    </section>
    <p class="foot">ほしの いちは ほんものの ほしぞらと おなじ ならびだよ（ひがしが ひだり）。</p>
  </div>
</main>

<!-- あそぶ -->
<div class="view" id="play" hidden>
  <div class="hud" id="hud">
    <div class="progress"><span id="progText">0 / 0</span><i><b id="progBar"></b></i></div>
    <div class="hud-btns">
      <button class="pill" id="hintBtn">💡 ヒント</button>
      <button class="pill" id="retryBtn">↺ <span class="long">やりなおし</span></button>
    </div>
  </div>
  <div class="say" id="say"><span class="face">🌙</span><p id="sayText"></p></div>
</div>

<!-- ずかん -->
<main class="view scroll" id="zukan" hidden>
  <div class="wrap">
    <section>
      <h2>📖 せいざ ずかん</h2>
      <p class="sub" id="zukanSub"></p>
      <div class="grid zgrid" id="zgrid"></div>
    </section>
  </div>
</main>

<!-- かんせい／しょうさい -->
<aside class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <p class="hooray" id="hooray">かんせい！</p>
    <div class="sheet-head">
      <span class="big-emoji" id="sEmoji"></span>
      <div>
        <h2 id="sName"></h2>
        <p class="season" id="sSeason"></p>
      </div>
    </div>
    <p class="story" id="sStory"></p>
    <p class="names" id="sNames"></p>
    <p class="unlock" id="sUnlock" hidden></p>
    <div class="actions" id="sActions"></div>
  </div>
</aside>

<script src="data.js?v=4c5eb3f"></script>
<script src="app.js?v=4c5eb3f"></script>
</body>
</html>
