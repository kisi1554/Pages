<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>

function setZoom(z,px,py){
  const svg=$("svg");if(px==null){px=wrap.clientWidth/2;py=wrap.clientHeight/2;}
  const cx=(wrap.scrollLeft+px)/Z,cy=(wrap.scrollTop+py)/Z;
  Z=Math.max(.45,Math.min(2.4,z));svg.setAttribute("width",VB[2]*Z);svg.setAttribute("height",VB[3]*Z);
  wrap.scrollLeft=cx*Z-px;wrap.scrollTop=cy*Z-py;
}

const PT=new Map();let drag=null,pinch=null,moved=false;
const pdist=()=>{const[a,b]=[...PT.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1;};
wrap.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  PT.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PT.size===1){drag={x:e.clientX,y:e.clientY,l:wrap.scrollLeft,t:wrap.scrollTop};moved=false;}
  else if(PT.size===2){pinch={d:pdist(),z:Z};drag=null;moved=true;}
});
window.addEventListener("pointermove",e=>{
  const p=PT.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(pinch&&PT.size>=2){const r=wrap.getBoundingClientRect(),[a,b]=[...PT.values()];
    setZoom(pinch.z*pdist()/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);}
  else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)moved=true;
    if(moved){wrap.scrollLeft=drag.l-dx;wrap.scrollTop=drag.t-dy;}}
});
function pEnd(e){if(!PT.delete(e.pointerId))return;pinch=null;
  if(PT.size===1){const p=[...PT.values()][0];drag={x:p.x,y:p.y,l:wrap.scrollLeft,t:wrap.scrollTop};}else drag=null;}
window.addEventListener("pointerup",pEnd);window.addEventListener("pointercancel",pEnd);
wrap.addEventListener("click",e=>{if(moved){moved=false;return;}const g=e.target.closest(".st");if(g)onStation(ST[g.dataset.k]);});

    g.gain.setValueAtTime(.18,t+i*.11);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.2);o.connect(g).connect(AC.destination);o.start(t+i*.11);o.stop(t+i*.11+.22);});}catch(e){}}

const stChoice=s=>({label:s.name,yomi:s.yomi});
const GEN={
 yomi(){const L=rnd(scopeLines()),s=rnd(L.st),set=new Set([s.yomi]);
   while(set.size<3)set.add(rnd(L.st).yomi);
   return{html:`<span class="big">${s.name}</span><br>この えきの よみかたは？`,hl:[s.k],dim:[L.id],focus:[s.x,s.y],
     choices:shuffle([...set].map(y=>({label:y,ok:y===s.yomi}))),after:`「${s.yomi}」`};},
 find(){const L=rnd(scopeLines()),n=L.st.length,i=ri(0,n-1),s=L.st[i],d=rnd([-4,-3,-2,2,3,4]);
   const f=L.loop?L.st[(i+d+n)%n]:L.st[Math.max(0,Math.min(n-1,i+d))];
   return{html:`<span class="big" style="color:#d84a00">${s.yomi}</span><br>${L.name}の えきだよ。ろせんずで タップ！`,tap:s.k,dim:[L.id],hl:[],show:[s.k],
     focus:[f.x,f.y],say:s.yomi,after:`${s.name}（${s.yomi}）`};},

   const pv=at(i-d),cur=at(i),nx=at(i+d),bad=new Set([pv.k,cur.k,nx.k]),pool=[];
   for(let j=i-6;j<=i+6;j++){const s=at(j);if(s&&!bad.has(s.k)){bad.add(s.k);pool.push(s);}}
   const ch=shuffle([nx,...shuffle(pool).slice(0,2)]).map(s=>({...stChoice(s),ok:s===nx}));
   return{html:`${L.name}<br>${K(pv)} → ${K(cur)} → <span class="big">？</span><br>つぎの えきは どれ？`,hl:[cur.k],show:[nx.k],dim:[L.id],focus:[cur.x,cur.y],choices:ch,after:`${nx.name}（${nx.yomi}）`};},
 count(){const L=rnd(scopeLines()),n=L.st.length,c=ri(1,5),i=L.loop?ri(0,n-1):ri(0,n-1-c),j=(i+c)%n;
   let a=L.st[i],b=L.st[j];if(Math.random()<.5)[a,b]=[b,a];
   const opts=new Set([c]);while(opts.size<3)opts.add(Math.max(1,c+ri(-2,2)));
   const na=a.on.find(o=>o.L===L).num,nb=b.on.find(o=>o.L===L).num;
   return{html:`${L.name}<br>${K(a)} から ${K(b)} まで<br>えきを いくつ すすむ？`,hl:[a.k,b.k],dim:[L.id],focus:[(a.x+b.x)/2,(a.y+b.y)/2],
     choices:[...opts].sort((x,y)=>x-y).map(v=>({label:String(v),ok:v===c})),after:`${c}こ すすむよ（${na} → ${nb}）`};},
 norikae(){

     const A=rnd(as),B=rnd(bs),dist=(L,p,q)=>{const d=Math.abs(L.st.indexOf(p)-L.st.indexOf(q));return L.loop?Math.min(d,L.st.length-d):d;};

     let best=null,bd=1e9,tie=false;for(const c of sh){const d=dist(X,A,c)+dist(Y,c,B);if(d<bd){bd=d;best=c;tie=false;}else if(d===bd)tie=true;}
     if(tie)continue;
     // おなじ なまえの えきが 両方の ろせんに ある（弘明寺）ものは、まぎらわしいので えらぶものに いれない
     const both=s=>X.st.some(t=>t.name===s.name)&&Y.st.some(t=>t.name===s.name);
     const seen=new Set([A.name,B.name,best.name]),pool=shuffle([...as,...bs]).filter(s=>!both(s)&&!seen.has(s.name)&&seen.add(s.name)).slice(0,2);
     return{html:`${K(A)} から ${K(B)} へ いくよ。<br><span style="color:${X.color}">${X.name}</span> → <span style="color:${Y.color}">${Y.name}</span><br>どこで のりかえる？`,
       hl:[A.k,B.k],show:[A.k,B.k,best.k],dim:[X.id,Y.id],focus:[A.x,A.y],
       choices:shuffle([best,...pool]).map(s=>({...stChoice(s),ok:s===best})),after:`${best.name}（${best.yomi}）で のりかえ！`};}},
 line(){const s=rnd(STL.filter(s=>s.on.length===1)),L=s.on[0].L;
   // おなじ なまえの えきが ある ろせん（弘明寺の ブルーライン／京急線）は えらぶものに いれない
   const others=LINES.filter(x=>x!==L&&!x.st.some(t=>t.name===s.name));
   const ch=shuffle([L,...shuffle(others).slice(0,2)]).map(x=>({label:x.name,yomi:x.yomi,ok:x===L}));
   return{html:`${K(s)} は<br>なにせんの えき かな？`,hl:[s.k],focus:[s.x,s.y],choices:ch,after:`${L.name}（${s.on[0].num}）`};}
};
