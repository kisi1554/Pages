<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ふじさん とざん ｜ ごうめを のぼって ちょうじょうへ</title>
<meta name="description" content="もんだいに こたえて ふじさんを 5ごうめから ちょうじょうまで のぼろう。たかさ・ごうめの じゅんばん・のぼると さむくなることを しる アプリ。">
<meta name="theme-color" content="#3d7fd0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗻</text></svg>">
<style>
:root{
  --bg:#eaf4ff; --ink:#26324a; --sub:#5f6b84; --card:#fff; --line:#cfe0f5;
  --blue:#3d7fd0; --blue-d:#245ea8; --orange:#f08c2e; --red:#e04f3a;
  --ok:#2fb35a; --ng:#e8590c; --shadow:0 4px 0 rgba(40,70,120,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg) linear-gradient(180deg,#d8ecff 0,#f4f9ff 60%) fixed;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Meiryo",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
[hidden]{display:none!important}
rt{font-size:.5em;font-weight:400}
.app{max-width:1150px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{flex:1;margin:0;font-size:clamp(19px,4.8vw,26px);letter-spacing:.05em;color:var(--blue-d)}
.ibtn{min-width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:24px;
  display:flex;align-items:center;justify-content:center;padding:0 10px;font-weight:700}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,70,120,.18)}
.ibtn small{font-size:14px;margin-left:4px}
main{flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;gap:12px;animation:fadein .3s}
.screen.on{display:flex}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* タイトル */
.hero{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:#9fd2ff}
.hero svg{width:100%;height:auto;max-height:38vh}
.lead{text-align:center;margin:4px 0 0;font-size:clamp(16px,4vw,20px);line-height:1.7}
.lv-title{text-align:center;font-weight:700;margin:4px 0 0;font-size:17px;color:var(--sub)}
.levels{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.levels{grid-template-columns:repeat(3,1fr)}}
.big{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:12px 18px;
  box-shadow:var(--shadow);border:3px solid var(--c,#3d7fd0);text-align:left;min-height:80px}
.big:active{transform:translateY(3px)}
.big .em{font-size:38px}
.big b{display:block;font-size:21px;color:var(--c)}
.big span{font-size:15px;color:var(--sub);line-height:1.5}
.big .stars{font-size:15px;letter-spacing:1px}
.book{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px;text-align:center}
.book h2{margin:0 0 6px;font-size:17px;color:var(--blue-d)}
.stamps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:44px;align-items:center}
.stamps .st{width:44px;height:44px}
.stamps .none{color:var(--sub);font-size:15px}

/* もちもの */
.ask{text-align:center;font-size:clamp(20px,5vw,28px);font-weight:700;margin:4px 0;line-height:1.5}
.ask small{display:block;font-size:15px;font-weight:400;color:var(--sub)}
.bag-row{display:flex;justify-content:center;align-items:center;gap:10px;font-size:15px;color:var(--sub)}
.bag-row .slot{width:46px;height:46px;border-radius:14px;border:3px dashed #b8cbe6;display:grid;place-items:center;font-size:28px;background:#fff}
.bag-row .slot.fill{border-style:solid;border-color:var(--ok);animation:pop .35s}
.items{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@media (min-width:700px){.items{grid-template-columns:repeat(5,1fr)}}
.item{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:3px solid transparent;min-height:104px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.item .e{font-size:44px;line-height:1}
.item .n{font-size:16px;font-weight:700}
.item.got{border-color:var(--ok);background:#ecfbef;opacity:.75}
.item.bad{border-color:var(--ng);background:#fff1e8}
.msg{min-height:56px;text-align:center;font-size:clamp(16px,4vw,19px);line-height:1.6;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:var(--shadow)}
.msg.ok{color:#1f7a3c}
.msg.ng{color:#b8470c}

/* のぼる */
.climb{display:grid;gap:12px;grid-template-columns:1fr;flex:1;align-content:start}
@media (min-width:760px) and (min-aspect-ratio:5/4){
  .climb{grid-template-columns:1.15fr 1fr;align-items:start}
}
.scene-box{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#9fd2ff}
.scene-box svg.scene{width:100%;height:auto;aspect-ratio:400/260}
.chip{position:absolute;background:rgba(255,255,255,.92);border-radius:14px;padding:4px 10px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.alt{left:8px;top:8px;font-size:clamp(15px,3.6vw,19px)}
.alt small{font-size:.7em;font-weight:400}
.thermo{right:8px;top:8px;display:flex;align-items:center;gap:6px;font-size:clamp(15px,3.6vw,19px)}
.thermo .tube{width:14px;height:52px;border-radius:8px;background:#e9eef5;border:2px solid #9aa9be;position:relative;overflow:hidden}
.thermo .liq{position:absolute;left:0;right:0;bottom:0;background:#e04f3a;transition:height .8s}
.stage-name{left:50%;bottom:8px;transform:translateX(-50%);font-size:clamp(17px,4.4vw,22px);color:var(--blue-d);white-space:nowrap}
.steps{display:flex;justify-content:space-between;gap:4px;margin-top:8px}
.steps .s{flex:1;text-align:center;border-radius:12px;padding:6px 0;background:#dbe6f4;color:#7a8aa3;font-weight:700;font-size:clamp(13px,3.4vw,16px)}
.steps .s.done{background:#c9eed3;color:#1f7a3c}
.steps .s.now{background:var(--orange);color:#fff;transform:scale(1.06)}
.qbox{display:flex;flex-direction:column;gap:10px}
.qcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px}
.visual{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:6px;min-height:20px;font-size:clamp(30px,8vw,42px);line-height:1.1}
.visual .tag{font-size:16px;background:#eef3fa;border-radius:10px;padding:4px 8px;font-weight:700}
.visual svg{max-width:100%;height:auto}
.choices{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.choices.two{grid-template-columns:repeat(2,1fr)}
.cbtn{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:3px solid #b9cde8;min-height:76px;
  font-size:clamp(19px,5vw,25px);font-weight:700;padding:6px;line-height:1.3}
.cbtn:active{transform:translateY(3px)}
.cbtn.ok{border-color:var(--ok);background:#e6f9eb;color:#1f7a3c}
.cbtn.ng{border-color:var(--ng);background:#fff1e8;color:#b8470c;opacity:.7}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.hint{min-height:26px;text-align:center;font-size:16px;color:#b8470c}
.fact{background:#fffbe8;border:3px solid #f3d57a;border-radius:20px;padding:12px 14px;font-size:clamp(16px,4.2vw,19px);line-height:1.7;text-align:center;animation:pop .4s}
.fact b{display:block;font-size:clamp(20px,5.4vw,26px);color:var(--orange);margin-bottom:2px}
.next{background:var(--orange);color:#fff;border-radius:20px;min-height:66px;font-size:22px;font-weight:700;box-shadow:0 5px 0 #c46a16}
.next:active{transform:translateY(4px);box-shadow:0 1px 0 #c46a16}
.climber{transition:transform .9s ease-in-out}
.walking .climber>g{animation:bob .3s infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}

/* やまごや */
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.on{display:flex}
.panel{background:#fff;border-radius:26px;padding:18px;max-width:440px;width:100%;text-align:center;animation:pop .35s;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.panel h2{margin:4px 0 8px;font-size:clamp(21px,5.4vw,26px);color:#8a4b1a}
.panel p{margin:8px 0;font-size:17px;line-height:1.7}
.stamp-big{width:150px;height:150px;margin:0 auto}
.stamp-in{animation:stampin .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes stampin{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}

/* ちょうじょう */
.goal-sky{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.goal-sky svg{width:100%;height:auto;aspect-ratio:400/240}
.sun{transition:transform 3.2s cubic-bezier(.2,.7,.3,1)}
.dawn{transition:opacity 3.2s}
.result{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px;text-align:center;animation:pop .4s}
.result .big-s{font-size:44px;letter-spacing:4px}
.result h2{margin:2px 0;font-size:clamp(22px,6vw,30px);color:var(--orange)}
.result p{margin:6px 0;font-size:17px;line-height:1.7}
.facts{text-align:left;margin:8px auto 0;padding:0;list-style:none;max-width:560px}
.facts li{background:#f2f7ff;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:16px;line-height:1.6}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:10px}
.sub-btn{background:#fff;border:3px solid var(--blue);color:var(--blue-d);border-radius:20px;min-height:62px;font-size:19px;font-weight:700;box-shadow:var(--shadow)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:#fff;color:var(--ok);font-size:clamp(28px,8vw,44px);font-weight:700;
  padding:10px 26px;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.15);z-index:25;pointer-events:none;animation:toast 1s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.foot{font-size:13px;color:var(--sub);text-align:center;margin-top:6px;line-height:1.6}
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>
<div class="app">
  <header>
    <button class="ibtn" id="homeBtn" aria-label="メニューへ" hidden>🏠</button>
    <h1>🗻 ふじさん とざん</h1>
    <button class="ibtn" id="sndBtn" aria-label="おと">🔊<small>オン</small></button>
  </header>
  <main>
    <!-- タイトル -->
    <section class="screen on" id="sTitle">
      <div class="hero" id="hero"></div>
      <p class="lead">もんだいに こたえて <b>5ごうめ</b>から<br><b>ちょうじょう</b>（3776メートル）まで のぼろう！</p>
      <p class="lv-title">どの もんだいで のぼる？</p>
      <div class="levels">
        <button class="big" data-lv="1" style="--c:#2f9e44"><span class="em">🔢</span><span><b>かぞえる</b><span>いくつ あるかな？ あと いくつ？</span><span class="stars" data-best="1"></span></span></button>
        <button class="big" data-lv="2" style="--c:#3d7fd0"><span class="em">🪜</span><span><b>じゅんばん・たしざん</b><span>7ごうめの つぎは？ あと なんごう？</span><span class="stars" data-best="2"></span></span></button>
        <button class="big" data-lv="3" style="--c:#c2410c"><span class="em">📏</span><span><b>くらべる・ちしき</b><span>スカイツリーと どっちが たかい？</span><span class="stars" data-best="3"></span></span></button>
      </div>
      <div class="book">
        <h2>📕 スタンプちょう</h2>
        <div class="stamps" id="stampBook"></div>
      </div>
      <p class="foot">たかさ・おんどは よしだルートの おおよその めやすです。<br>ほんとうの とざんは おとなと いっしょに、なつの きまった じきだけ。</p>
    </section>

    <!-- もちもの -->
    <section class="screen" id="sPack">
      <p class="ask">やまに もっていく ものを えらぼう<small>やまで いる ものを 5つ タップしてね</small></p>
      <div class="bag-row" id="bag"></div>
      <div class="items" id="items"></div>
      <div class="msg" id="packMsg">🎒 なにが いるかな？</div>
    </section>

    <!-- のぼる -->
    <section class="screen" id="sClimb">
      <div class="climb">
        <div>
          <div class="scene-box" id="sceneBox">
            <div id="sceneSvg"></div>
            <div class="chip alt" id="altChip"></div>
            <div class="chip thermo" id="thermoChip"><span class="tube"><span class="liq" id="liq"></span></span><span id="tempTxt"></span></div>
            <div class="chip stage-name" id="stageChip"></div>
          </div>
          <div class="steps" id="steps"></div>
        </div>
        <div class="qbox" id="qbox"></div>
      </div>
    </section>

    <!-- ちょうじょう -->
    <section class="screen" id="sGoal">
      <div class="goal-sky" id="goalSky"></div>
      <div id="goalResult"></div>
    </section>
  </main>
</div>

<div class="overlay" id="hutOv">
  <div class="panel">
    <h2>🛖 やまごやで ひとやすみ</h2>
    <div class="stamp-big" id="hutStamp"></div>
    <p>スタンプを もらったよ！<br>おみずを のんで、ゆっくり いきを しよう。<br><small>やまごやでは つえに「やきいん」を おして もらえるよ</small></p>
    <button class="next" id="hutBtn" style="width:100%">げんきに なった！ しゅっぱつ</button>
  </div>
</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[rand(a.length)];

/* ---------- ほぞん ---------- */
const KEY = "fujisan-tozan:v1";
let S = { sound: true, summits: 0, best: {} };
try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && typeof d === "object") S = Object.assign(S, d); } catch (e) { }
if (!S.best || typeof S.best !== "object") S.best = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };

/* ---------- おと（WebAudio の ごうせいおん） ---------- */
let AC = null;
function ac() {
  if (!S.sound) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f, d = .15, type = "sine", v = .18, t0 = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const SND = {
  tap() { tone(660, .08, "triangle", .12); },
  ok() { [784, 988, 1319].forEach((f, i) => tone(f, .22, "triangle", .16, i * .09)); },
  ng() { tone(220, .25, "square", .06); tone(196, .3, "square", .05, .12); },
  step() { for (let i = 0; i < 6; i++) tone(i % 2 ? 180 : 150, .07, "triangle", .1, i * .16); },
  stamp() { tone(120, .25, "sine", .35); tone(90, .3, "triangle", .2, .02); },
  fan() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i === 6 ? .6 : .2, "triangle", .15, i * .13)); },
  sun() { [392, 494, 587, 784].forEach((f, i) => tone(f, 1.2, "sine", .07, i * .35)); }
};
function drawSnd() { $("#sndBtn").innerHTML = S.sound ? "🔊<small>オン</small>" : "🔇<small>オフ</small>"; }
$("#sndBtn").onclick = () => { S.sound = !S.sound; save(); drawSnd(); SND.tap(); };
drawSnd();

/* ---------- ふじさんの データ（よしだルートの めやす） ---------- */
// たかさ: 5ごうめ 2305m / 6ごうめ 約2390m / 7ごうめ 約2700m / 8ごうめ 約3100m / 9ごうめ 約3600m / けんがみね 3776m
// おんど: なつの ひるまの めやす（100m のぼると 約0.6ど さがる。ちょうじょうの 8がつの へいきんは 約6ど）
const ST = [
  { name: "5ごうめ", short: "5", h: 2300, t: 15, land: "もり",

    prev(i) {
      const x = 6 + rand(4), ans = `${x - 1}ごうめ`;
      return { q: `${x}ごうめの まえは？`, sub: "ひとつ したの ばしょ", visual: chips(["5", "6", "7", "8", "9"]), ans, choices: numChoices(x - 1, 5, 9).map(v => `${v}ごうめ`), hint: "かずが 1 へるよ" };
    }
  },
  3: {
    tree() {
      return { q: "ふじさんと スカイツリー、たかいのは？", sub: "たかさを くらべよう", visual: heightBars([{ label: "スカイツリー", h: 634, kind: "tree" }, { label: "ふじさん", h: 3776, kind: "fuji" }]), ans: "ふじさん", choices: shuffle(["ふじさん", "スカイツリー"]), hint: "えの ぼうの ながさを くらべてみよう" };
    },
    tower() {
      return { q: "いちばん ひくいのは どれ？", sub: "3つを くらべよう", visual: heightBars([{ label: "ふじさん", h: 3776, kind: "fuji", showH: 1 }, { label: "スカイツリー", h: 634, kind: "tree", showH: 1 }, { label: "とうきょうタワー", h: 333, kind: "tower", showH: 1 }]), ans: "とうきょうタワー", choices: shuffle(["ふじさん", "スカイツリー", "とうきょうタワー"]), hint: "いちばん みじかい ものを さがそう" };
    },
    height() {
      return { q: "ふじさんの たかさは？", sub: "メートルで こたえよう", visual: fujiIcon(), ans: "3776", choices: shuffle(["3776", "634", "333"]), hint: "634は スカイツリー、333は とうきょうタワーだよ" };
    },
    times() {
      return { q: "スカイツリーを なんこ つむと ふじさんぐらい？", sub: "3776 ÷ 634 は だいたい …", visual: fujiIcon(90, 60) + `<span style="font-size:20px">≒</span>` + `<span style="display:flex;gap:2px">${skytree().repeat(6)}</span>`, ans: "6こ", choices: shuffle(["2こ", "6こ", "20こ"]), hint: "えの スカイツリーを かぞえてみよう" };
    },
    cold(i) {
      return { q: "うえに のぼると、おんどは どうなる？", sub: `5ごうめ ${ST[0].t}ど → 9ごうめ ${ST[4].t}ど`, visual: "🌡️⬇️", ans: "さむくなる", choices: shuffle(["さむくなる", "あつくなる", "かわらない"]), hint: "おんどけいを みてみよう。かずが へってるね" };
    },
    trees() {
      return { q: "うえに いくと、<ruby>木<rt>き</rt></ruby>は どうなる？", sub: "5ごうめ 🌲🌲🌲 → 9ごうめ 🪨", visual: "🌲🌲🌲➡️🌿➡️🪨", ans: "なくなる", choices: shuffle(["なくなる", "ふえる", "おおきくなる"]), hint: "さむくて かぜが つよいと、<ruby>木<rt>き</rt></ruby>は そだたないよ" };
    },
    season() {
      return { q: "ふじさんに のぼれるのは いつ？", sub: "とざんが できる きせつ", visual: "🌸 🌻 🍁 ⛄", ans: "なつ", choices: shuffle(["なつ", "ふゆ", "いつでも"]), hint: "ゆきが ない あつい きせつだよ（7がつ〜9がつ はじめ）" };
    },
    peak() {
      return { q: "ちょうじょうで いちばん たかい ばしょの なまえは？", sub: "3776メートルの ところ", visual: "🏔️🚩", ans: "けんがみね", choices: shuffle(["けんがみね", "やまごや", "5ごうめ"]), hint: "「けん」が つくよ" };
    },
    which() {
      const a = rand(5), b = (a + 1 + rand(4)) % 5, hi = Math.max(a, b);
      return { q: `${sn(a)} と ${sn(b)}、たかいのは？`, sub: "ちょうじょうに ちかいのは どっち？", visual: chips(["5", "6", "7", "8", "9"]), ans: sn(hi), choices: shuffle([sn(a), sn(b)]), hint: "かずが おおきいほど たかいよ" };
    }
  }
};

/* ---------- のぼる ---------- */
let G = null;
function startClimb() {
  G = { lv: S.lv || 1, i: 0, miss: 0, used: new Set() };
  drawStage(0);
  show("sClimb");
  showFact(0, true);
}
function drawStage(i) {
  $("#sceneSvg").innerHTML = sceneSVG(i);
  $("#altChip").innerHTML = `⛰️ ${ST[i].h}<small>メートル</small>`;
  $("#tempTxt").textContent = `${ST[i].t}ど`;
  $("#liq").style.height = `${Math.round(ST[i].t / 30 * 100)}%`;
  $("#stageChip").textContent = ST[i].name;
  $("#steps").innerHTML = ST.map((s, k) => `<span class="s ${k < i ? "done" : k === i ? "now" : ""}">${s.short}</span>`).join("");
}
function showFact(i, first) {
  const qb = $("#qbox");
  qb.innerHTML = `<div class="fact"><b>${first ? "しゅっぱつ！ " : ""}${ST[i].name}${first ? "" : "に ついた！"}</b>${ST[i].fact}</div>
    <button class="next" id="goQ">${first ? "もんだいに こたえて のぼろう ▶" : "つぎの もんだい ▶"}</button>`;
  $("#goQ").onclick = () => { SND.tap(); askQ(); };
}
function askQ() {
  const pool = QS[G.lv], keys = Object.keys(pool).filter(k => !G.used.has(k));
  if (!keys.length) G.used.clear();
  const k = pick(keys.length ? keys : Object.keys(pool)); G.used.add(k);
  const q = pool[k](G.i); G.q = q; G.tries = 0;
  const two = q.choices.length === 2;
  $("#qbox").innerHTML = `<div class="qcard"><p class="ask">${q.q}<small>${q.sub}</small></p><div class="visual">${q.visual}</div></div>
    <div class="choices ${two ? "two" : ""}">${q.choices.map(c => `<button class="cbtn" data-v="${c}">${c}</button>`).join("")}</div>
    <div class="hint" id="hint"></div>`;
  $$("#qbox .cbtn").forEach(b => b.onclick = () => answer(b));
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1100); }
function answer(b) {
  if (b.disabled) return;
  const q = G.q;
  if (String(b.dataset.v) === String(q.ans)) {
    $$("#qbox .cbtn").forEach(x => x.disabled = true);
    b.classList.add("ok"); SND.ok();
    toast(pick(["せいかい！", "すごい！", "やったね！", "ばっちり！"]));
    later(climbUp, 900);
  } else {
    G.miss++; G.tries++; SND.ng();
    b.classList.add("ng", "shake"); b.disabled = true;
    $("#hint").innerHTML = `💡 ${q.hint}`;
  }
}
function climbUp() {
  const box = $("#sceneBox"), cl = $(".climber", box);
  box.classList.add("walking"); SND.step();
  cl.style.transform = `translate(330px,${slopeY(330) + 18}px)`;
  later(() => {
    box.classList.remove("walking");
    G.i++;
    if (G.i >= 5) { drawStage(5); later(goal, 700); return; }
    drawStage(G.i);
    if (G.i === HUT_AT) openHut(); else showFact(G.i);
  }, 1000);
}
function openHut() {
  showFact(G.i);
  $("#hutStamp").innerHTML = "";
  $("#hutOv").classList.add("on");
  later(() => { $("#hutStamp").innerHTML = stampSVG("hut", "stamp-in"); SND.stamp(); }, 500);
}
$("#hutBtn").onclick = () => { SND.tap(); $("#hutOv").classList.remove("on"); };

/* ---------- ちょうじょう・ごらいこう ---------- */
function goal() {
  show("sGoal");
  $("#goalResult").innerHTML = "";
  $("#goalSky").innerHTML = `<svg viewBox="0 0 400 240" role="img" aria-label="ごらいこう">
    <defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b3e"/><stop offset="1" stop-color="#2c3f78"/></linearGradient>
    <linearGradient id="morning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7fd4"/><stop offset=".55" stop-color="#ffb46b"/><stop offset="1" stop-color="#ffe1a8"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".9"/><stop offset="1" stop-color="#ffb46b" stop-opacity="0"/></radialGradient></defs>
    <rect width="400" height="240" fill="url(#night)"/>
    <rect class="dawn" id="dawn" width="400" height="240" fill="url(#morning)" opacity="0"/>
    <g class="sun" id="sun" style="transform:translateY(70px)"><circle cx="250" cy="150" r="60" fill="url(#glow)"/><circle cx="250" cy="150" r="24" fill="#ff8c2e"/></g>
    <rect x="0" y="160" width="400" height="80" fill="#e9eef8"/>
    ${[0, 1, 2, 3, 4, 5, 6].map(k => cloud(k * 64 + 8, 166 + (k % 2) * 6, 1.3)).join("")}
    <path d="M0,240 L0,200 Q60,186 120,196 Q170,204 210,194 Q270,184 320,204 Q360,216 400,200 L400,240z" fill="#4f403c"/>
    ${torii(70, 200)}${climber(150, 208)}
    <text x="200" y="40" font-size="22" text-anchor="middle" font-weight="700" fill="#fff" id="gtxt">まだ くらいね…</text>
  </svg>`;
  SND.sun();
  later(() => { $("#dawn").style.opacity = 1; $("#sun").style.transform = "translateY(-60px)"; $("#gtxt").textContent = "ごらいこう！ ひのでだよ"; }, 400);
  later(showResult, 3400);
}
function confetti() {
  const c = document.createElement("div"); c.className = "confetti";
  const cols = ["#f08c2e", "#3d7fd0", "#2fb35a", "#e04f3a", "#f2c94c", "#a855f7"];
  for (let k = 0; k < 60; k++) {
    const i = document.createElement("i");
    i.style.left = Math.random() * 100 + "%"; i.style.background = pick(cols);
    i.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; i.style.animationDelay = Math.random() * .6 + "s";
    c.appendChild(i);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 4500);
}
function showResult() {
  const stars = G.miss === 0 ? 3 : G.miss <= 2 ? 2 : 1;
  S.summits = (S.summits | 0) + 1;
  S.best[G.lv] = Math.max(S.best[G.lv] || 0, stars); save();
  SND.fan(); confetti();
  const praise = stars === 3 ? "ぜんもん せいかい！ やまの めいじん！" : stars === 2 ? "よく がんばったね！" : "さいごまで のぼれたね！ えらい！";
  $("#goalResult").innerHTML = `<div class="result">
    <div class="big-s">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <h2>ちょうじょう とうちゃく！</h2>
    <p>${praise}<br><b>3776メートル</b>の ふじさんに のぼったよ。</p>
    <div style="width:90px;margin:0 auto">${stampSVG("top", "stamp-in")}</div>
    <ul class="facts">
      <li>🗻 ふじさんの たかさは <b>3776メートル</b>。にっぽんで いちばん たかい やま。</li>
      <li>🧊 なつでも ちょうじょうは <b>5どくらい</b>。ひのでの ころは もっと さむい。<br>（100メートル のぼると 0.6どぐらい さがるよ）</li>
      <li>🌻 のぼれるのは <b>なつだけ</b>（7がつ〜9がつ はじめ）。</li>
      <li>🚩 いちばん たかい ところは <b>けんがみね</b>。</li>
      <li>📏 スカイツリー（634メートル）の やく <b>6こ ぶん</b>。</li>
    </ul>
    <div class="row"><button class="next" id="again">もういちど 🥾</button><button class="sub-btn" id="toMenu">🏠 メニュー</button></div>
  </div>`;
  $("#again").onclick = () => { SND.tap(); startPack(); };
  $("#toMenu").onclick = () => { SND.tap(); drawTitle(); show("sTitle"); };
}

$$("[data-lv]").forEach(b => b.onclick = () => { SND.tap(); S.lv = +b.dataset.lv; save(); startPack(); });
drawTitle();
</script>
</body>
</html>
