<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算数講座 ｜ 中学受験</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="backBtn" class="back-btn" hidden aria-label="分野一覧へ戻る">&larr; 分野一覧</button>
  <div class="topbar-title">
    <h1>中学受験 算数講座</h1>
    <p class="topbar-sub">分野を選んで、典型解法と演習を確認する</p>
  </div>
</header>

<main id="app">

  <section id="fieldMenu" class="field-menu" aria-label="分野一覧">
    <!-- app.js が描画 -->
  </section>

  <section id="fieldDetail" class="field-detail" hidden>

    <div class="field-detail-head">
      <span class="field-badge" id="fdBadge"></span>
      <h2 id="fdName"></h2>
      <p class="field-core" id="fdCore"></p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn is-active" id="tabExplainBtn" role="tab" aria-selected="true" aria-controls="explainPane">
        典型解法
      </button>
      <button class="tab-btn" id="tabExerciseBtn" role="tab" aria-selected="false" aria-controls="exercisePane">
        演習
      </button>
    </div>

    <div id="explainPane" class="pane" role="tabpanel"></div>
    <div id="exercisePane" class="pane" role="tabpanel" hidden></div>

  </section>

</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
