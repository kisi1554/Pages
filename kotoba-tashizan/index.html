<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ことばの たしざん</title>
<style>
  :root {
    --bg: #f3f7ff;
    --ink: #2b2d42;
    --sub: #6b7090;
    --accent: #7048e8;
    --a: #ff922b;   /* ひだりの カード */
    --b: #339af0;   /* みぎの カード */
    --ok: #2f9e44;
    --ng: #e03131;
    --hl: #e64980;  /* かわった おと */
    --card: #ffffff;
    --shadow: 0 4px 0 rgba(43,45,66,.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, #e5dbff 0 70px, transparent 71px),
      radial-gradient(circle at 92% 90%, #d0ebff 0 90px, transparent 91px);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  ruby rt { font-size: .55em; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); overflow-y: auto; }
  .screen.on { display: flex; }

  .bar { width: 100%; max-width: 980px; display: flex; align-items: center; gap: 10px; min-height: 58px; flex: none; }
  .bar .grow { flex: 1; text-align: center; font-weight: 800; font-size: clamp(18px, 4.6vw, 26px); }
  .round-btn { width: 56px; height: 56px; border-radius: 50%; background: #fff; box-shadow: var(--shadow);
    font-size: 28px; display: grid; place-items: center; text-decoration: none; color: inherit; flex: none; }
  .round-btn:active, .big-btn:active, .mode:active, .choice:active, .chip:active { transform: translateY(3px); box-shadow: none; }

  /* ---- タイトル ---- */
  .logo { margin: 4px 0 0; font-size: clamp(34px, 9vw, 60px); font-weight: 900; color: var(--accent);
    text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(0,0,0,.12); text-align: center; letter-spacing: .03em; }
  .logo-demo { font-size: clamp(30px, 8vw, 46px); margin: 6px 0; text-align: center; }
  .logo-sub { color: var(--sub); font-weight: 700; font-size: clamp(15px, 3.8vw, 19px); margin-bottom: 12px; text-align: center; }
  .modes { width: 100%; max-width: 820px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 12px; }
  @media (min-width: 720px) { .modes { grid-template-columns: 1fr 1fr 1fr; } }
  .mode { background: var(--card); border-radius: 22px; padding: 12px 10px; box-shadow: var(--shadow); min-height: 128px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; border: 4px solid var(--c, #ddd); }
  .mode .m-emo { font-size: 34px; line-height: 1.15; }
  .mode .m-name { font-weight: 900; font-size: clamp(16px, 4.3vw, 20px); color: var(--c); }
  .mode .m-desc { font-size: 14px; color: var(--sub); text-align: center; line-height: 1.35; }
  @media (min-width: 720px) and (min-height: 600px) { .mode { min-height: 160px; } .mode .m-emo { font-size: 46px; } .mode .m-name { font-size: 24px; } .mode .m-desc { font-size: 17px; } .mode .m-star { font-size: 18px; } .logo-sub { font-size: 21px; } }
  .mode .m-star { font-size: 15px; letter-spacing: 1px; min-height: 18px; }

  /* ---- カード ---- */
  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); border: 4px solid var(--c, #ccc);
    width: var(--w, clamp(92px, min(26vw, 30vh), 230px)); aspect-ratio: 4 / 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; position: relative; flex: none; transition: transform .35s ease, opacity .3s; }
  .card .pic { font-size: clamp(40px, min(12vw, 14vh), 110px); line-height: 1; display: flex; align-items: center; justify-content: center; height: 58%; }
  .card .pic.two { font-size: clamp(30px, min(8.6vw, 10vh), 78px); letter-spacing: -.08em; }
  .card .pic svg { height: 100%; width: auto; max-width: 92%; }
  .card .wd { font-weight: 900; font-size: clamp(17px, min(4.8vw, 4.6vh), 34px); letter-spacing: .02em; white-space: nowrap; }
  .card.ca { --c: var(--a); } .card.cb { --c: var(--b); }
  .card.q { --c: #adb5bd; border-style: dashed; }
  .card.q .pic { font-size: clamp(44px, 13vw, 90px); color: #adb5bd; font-weight: 900; }
  .card.big { --w: clamp(150px, min(50vw, 36vh), 300px); --c: var(--accent); }
  .card.big .pic { font-size: clamp(66px, min(22vw, 16vh), 140px); }
  .card.big .pic.two { font-size: clamp(50px, min(15vw, 11vh), 100px); }
  .card.big .wd { font-size: clamp(24px, min(7.4vw, 5.4vh), 44px); }
  #h-big { --w: clamp(130px, min(40vw, 27vh), 260px); }
  .card.slot { --c: #adb5bd; border-style: dashed; }
  .card.slot.fill-a { --c: var(--a); border-style: solid; } .card.slot.fill-b { --c: var(--b); border-style: solid; }

  .eq { display: flex; align-items: center; justify-content: center; gap: clamp(4px, 1.6vw, 14px); margin: 8px 0; flex-wrap: nowrap; }
  .op { font-size: clamp(28px, 8vw, 50px); font-weight: 900; color: var(--sub); flex: none; }
  .wd em { font-style: normal; color: var(--hl); text-decoration: underline wavy var(--hl) 2px; text-underline-offset: 5px; }
  .wd .pa { color: #d9480f; } .wd .pb { color: #1864ab; }

  .prompt { font-weight: 800; font-size: clamp(17px, 4.6vw, 24px); text-align: center; margin: 4px 0 2px; min-height: 1.4em; }
  .choices { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 560px; margin-top: 6px; }
  @media (orientation: landscape) and (min-width: 700px) { .choices { flex-direction: row; max-width: 900px; } .choices .choice { flex: 1; } }
  .choice { background: #fff; border-radius: 18px; box-shadow: var(--shadow); min-height: clamp(64px, 10vh, 90px); font-size: clamp(24px, min(6.6vw, 5vh), 40px);
    font-weight: 900; letter-spacing: .06em; border: 4px solid #dee2e6; }
  .choice.wrong { border-color: var(--ng); color: #c9c9c9; background: #fff5f5; animation: shake .4s; pointer-events: none; }
  .choice.hint { border-color: var(--ok); animation: glow 1s infinite alternate; }
  .choice.right { border-color: var(--ok); background: #ebfbee; color: var(--ok); }

  .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 760px; margin-top: 10px; }
  .chip { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 6px 10px; min-width: 96px; min-height: 76px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #dee2e6; }
  .chip .ce { font-size: 34px; line-height: 1.1; height: 38px; display: flex; align-items: center; }
  .chip .ce svg { height: 36px; width: auto; }
  .chip .ct { font-weight: 900; font-size: 20px; }
  @media (min-width: 720px) and (min-height: 600px) { .chip { min-width: 128px; min-height: 104px; } .chip .ce { font-size: 50px; height: 56px; } .chip .ce svg { height: 52px; } .chip .ct { font-size: 26px; } }
  .chip.wrong { border-color: var(--ng); animation: shake .4s; }
  .chip.used { opacity: .25; pointer-events: none; }
  .chip.sel { border-color: var(--accent); background: #f3f0ff; }
  .chip.hint { border-color: var(--ok); animation: glow 1s infinite alternate; }

  .explain { background: #fff; border-radius: 18px; padding: 10px 16px; box-shadow: var(--shadow); max-width: 620px; width: 100%;
    font-size: clamp(16px, 4.2vw, 21px); line-height: 1.7; text-align: center; margin-top: 8px; }
  .explain .kj { font-size: 1.15em; font-weight: 800; }
  .big-btn { background: var(--accent); color: #fff; font-weight: 900; font-size: clamp(20px, 5.4vw, 26px); border-radius: 999px;
    padding: 14px 34px; box-shadow: 0 5px 0 #4c2fb0; margin-top: 12px; min-height: 60px; }
  .big-btn.sub { background: #fff; color: var(--accent); box-shadow: var(--shadow); border: 3px solid var(--accent); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: #dee2e6; }
  .dots span.done { background: #fcc419; } .dots span.miss { background: #a5d8ff; } .dots span.now { outline: 3px solid var(--accent); }

  .praise { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.4); font-size: clamp(40px, 11vw, 80px);
    font-weight: 900; color: #f76707; text-shadow: 0 4px 0 #fff, 0 6px 10px rgba(0,0,0,.2); opacity: 0; pointer-events: none; z-index: 30; white-space: nowrap; }
  .praise.on { animation: praise 1.1s ease-out forwards; }
  .spark { position: fixed; font-size: 28px; pointer-events: none; z-index: 29; animation: spark 1s ease-out forwards; }
  .pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  .wiggle { animation: wiggle .5s ease-in-out 2; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-9px); } 75% { transform: translateX(9px); } }
  @keyframes glow { from { box-shadow: 0 0 0 0 rgba(47,158,68,.5); } to { box-shadow: 0 0 0 8px rgba(47,158,68,.15); } }
  @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  @keyframes praise { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    70% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-80%) scale(1); } }
  @keyframes spark { 0% { opacity: 1; transform: translate(0,0) scale(.5); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); } }

  /* ---- けっか ---- */
  .result-stars { font-size: clamp(44px, 12vw, 70px); letter-spacing: 6px; margin: 10px 0; }
  .result-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 760px; }
  .mini { background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 6px 10px; text-align: center; min-width: 96px; }
  .mini .me { font-size: 34px; line-height: 1.2; } .mini .me svg { height: 36px; width: auto; }
  .mini .mt { font-weight: 900; font-size: 17px; } .mini .mf { font-size: 13px; color: var(--sub); }
  .mini.new::after { content: "あたらしい！"; display: block; font-size: 12px; color: #f76707; font-weight: 900; }
  .mini.locked { opacity: .45; }

  /* ---- じゆう ---- */
  .free-top { display: flex; align-items: center; gap: clamp(4px, 1.6vw, 14px); justify-content: center; }
  .free-top .card.slot { --w: clamp(76px, 22vw, 160px); }
  .free-top .op { font-size: clamp(22px, 6vw, 44px); }
  .made .wd, .gcard .wd { white-space: normal; word-break: break-all; text-align: center; line-height: 1.15; font-size: clamp(14px, 3.8vw, 26px); }
  #choices.hiki { flex-direction: column !important; align-items: center; max-width: 900px; }
  .made { --w: clamp(100px, 29vw, 210px); --c: var(--accent); }
  .combo { position: relative; width: 100%; height: 58%; }
  .combo span { position: absolute; line-height: 1; }
  .combo .c1 { font-size: clamp(38px, 11vw, 82px); left: 6%; top: 8%; }
  .combo .c2 { font-size: clamp(28px, 8vw, 62px); right: 4%; bottom: 0; transform: rotate(-12deg); }
  .combo svg { width: 1em; height: 1em; }
  .free-tabs { display: flex; gap: 8px; margin-top: 8px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; width: 100%; max-width: 900px; }
  .gcard { background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 8px; text-align: center; position: relative; aspect-ratio: 4/5;
    display: flex; flex-direction: column; justify-content: center; border: 3px solid #e5dbff; }
  .gcard .wd { font-weight: 900; font-size: 18px; word-break: break-all; }
  .gcard .del { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; font-size: 20px; }
  .empty { color: var(--sub); font-size: 18px; margin-top: 30px; text-align: center; }
  .tip { color: var(--sub); font-size: 15px; text-align: center; margin: 4px 0; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- ===== タイトル ===== -->
<section class="screen on" id="title">
  <div class="bar">
    <a class="round-btn" href="../" aria-label="メニューへ">🏠</a>
    <div class="grow"></div>
    <button class="round-btn snd" aria-label="おと オン/オフ">🔊</button>
  </div>
  <div class="logo">ことばの たしざん</div>
  <div class="logo-demo">🌧️ ＋ 🌂 ＝ ☔</div>
  <div class="logo-sub">あめ ＋ かさ ＝ <b style="color:var(--hl)">あまがさ</b>！ ことばと ことばを くっつけよう</div>
  <div class="modes" id="modes"></div>
</section>

<!-- ===== たしざん ===== -->
<section class="screen" id="play">
  <div class="bar">
    <button class="round-btn" data-go="title" aria-label="もどる">⬅️</button>
    <div class="grow"><div class="dots" id="dots" style="justify-content:center"></div></div>
    <button class="round-btn snd" aria-label="おと オン/オフ">🔊</button>
  </div>
  <div class="prompt" id="prompt"></div>
  <div class="eq" id="eq"></div>
  <div class="choices" id="choices"></div>
  <div id="after" style="display:flex;flex-direction:column;align-items:center;width:100%"></div>
</section>

<!-- ===== けっか ===== -->
<section class="screen" id="result">
  <div class="bar">
    <a class="round-btn" href="../" aria-label="メニューへ">🏠</a>
    <div class="grow">おしまい！</div>
    <button class="round-btn snd" aria-label="おと オン/オフ">🔊</button>
  </div>
  <div class="result-stars" id="r-stars"></div>
  <div class="prompt" id="r-msg"></div>
  <div class="result-list" id="r-list"></div>
  <div class="row">
    <button class="big-btn" id="r-again">🔁 もういちど</button>
    <button class="big-btn sub" data-go="title">🏁 えらびなおす</button>
  </div>
</section>

<!-- ===== ずかん ===== -->
<section class="screen" id="zukan">
  <div class="bar">
    <button class="round-btn" data-go="title" aria-label="もどる">⬅️</button>
    <div class="grow">📖 ことば ずかん <span id="z-count" style="font-size:.75em;color:var(--sub)"></span></div>
    <button class="round-btn snd" aria-label="おと オン/オフ">🔊</button>
  </div>
  <div class="tip">ただしく くっつけた ことばが ここに ならぶよ。タップすると もういちど みられる。</div>
  <div class="result-list" id="z-list" style="padding-bottom:16px"></div>
</section>

<!-- ===== じゆう ===== -->
<section class="screen" id="free">
  <div class="bar">
    <button class="round-btn" data-go="title" aria-label="もどる">⬅️</button>
    <div class="grow">🎨 じゆうに くっつけよう</div>
    <button class="round-btn snd" aria-label="おと オン/オフ">🔊</button>
  </div>
  <div class="free-tabs">
    <button class="big-btn sub" id="f-tab-make" style="margin:0;padding:8px 20px;min-height:50px">✂️ つくる</button>
    <button class="big-btn sub" id="f-tab-gal" style="margin:0;padding:8px 20px;min-height:50px">🖼️ さくひん</button>
  </div>
  <div id="f-make" style="display:flex;flex-direction:column;align-items:center;width:100%">
    <div class="free-top" style="margin-top:10px">
      <button class="card slot" id="f-a"><div class="pic">？</div><div class="wd">&nbsp;</div></button>
      <div class="op">＋</div>
      <button class="card slot" id="f-b"><div class="pic">？</div><div class="wd">&nbsp;</div></button>
      <div class="op">＝</div>
      <div class="card made" id="f-out"><div class="pic" style="color:#adb5bd;font-weight:900">？</div><div class="wd">&nbsp;</div></div>
    </div>
    <div class="row">
      <button class="big-btn sub" id="f-rand" style="padding:10px 20px">🎲 おまかせ</button>
      <button class="big-btn" id="f-save" style="padding:10px 20px">💾 ほぞん</button>
    </div>
    <div class="tip">したの カードを 2まい タップ。ない ことばを つくっても いいよ！</div>
    <div class="parts" id="f-parts" style="padding-bottom:16px"></div>
  </div>
  <div id="f-gal" style="display:none;width:100%;flex-direction:column;align-items:center;padding:10px 0 16px">
    <div class="gallery" id="f-gallery"></div>
  </div>
</section>

<div class="praise" id="praise"></div>

<script>
'use strict';

let ac = null;
function audio() {
  if (!save.sound) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { return null; }
  return ac;
}
function tone(freq, t0, dur, type = 'sine', vol = .2, slideTo) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + t0;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(t0, dur, vol = .25, freq = 1200) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + t0;
  const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}

function mark(orig, surf) {
  let out = '';
  for (let i = 0; i < surf.length; i++) out += (orig[i] === surf[i]) ? surf[i] : `<em>${surf[i]}</em>`;
  return out;
}
function wordHTML(q) { return `<span class="pa">${mark(q.a, q.sa)}</span><span class="pb">${mark(q.b, q.sb)}</span>`; }
function kanjiHTML(k) { return k.replace(/([一-鿿]+)\((.+?)\)/g, '<ruby>$1<rt>$2</rt></ruby>'); }
const isVoiced = (orig, surf) => surf.length === orig.length && surf.slice(1) === orig.slice(1) && surf[0].normalize('NFD')[0] === orig[0] && surf[0] !== orig[0];
function explainHTML(q) {
  const lines = [];
  if (q.sa === q.a && q.sb === q.b) lines.push('おとは そのまま！ ならべて くっつけるだけ。');
  if (q.sa !== q.a) lines.push(q.a.startsWith(q.sa) ? `<b>${q.a}</b> の「<em style="font-style:normal;color:var(--hl)">${q.a.slice(q.sa.length)}</em>」が なくなって <b>${q.sa}</b>` : `<b>${q.a}</b> → <b>${mark(q.a, q.sa)}</b> に かわったよ`);
  if (q.sb !== q.b) lines.push(isVoiced(q.b, q.sb)
    ? `<b>${q.b}</b> に てんてん（゛）で <b>${mark(q.b, q.sb)}</b>！`
    : `<b>${q.b}</b> → <b>${mark(q.b, q.sb)}</b> に かわったよ`);
  if (q.k) lines.push(`<span class="kj">${kanjiHTML(q.k)}</span>`);
  return lines.join('<br>');
}

    const b = document.createElement('button'); b.className = 'mode'; b.style.setProperty('--c', m.c);
    let star = '';
    if (save.best[m.id] != null) star = '⭐'.repeat(save.best[m.id]) + '☆'.repeat(3 - save.best[m.id]);
    if (m.id === 'zukan') star = `${Object.keys(save.got).filter(w => W.some(q => q.w === w)).length} / ${W.length}`;
    if (m.id === 'free') star = save.works.length ? `さくひん ${save.works.length}` : '';
    b.innerHTML = `<span class="m-emo">${m.emo}</span><span class="m-name">${m.name}</span><span class="m-desc">${m.desc}</span><span class="m-star">${star}</span>`;
    b.addEventListener('click', () => {
      SND.tap(); audio();
      if (m.id === 'zukan') openZukan();
      else if (m.id === 'free') openFree();
      else startRound(m.id);
    });
    box.appendChild(b);
  }
}

// ------------------------------------------------------------
// 1かい ＝ 5もん
// ------------------------------------------------------------
const N = 5;
let R = null;
function pickQs(pool) {
  const fresh = shuffle(pool.filter(q => !save.got[q.w]));
  const old = shuffle(pool.filter(q => save.got[q.w]));
  // あたらしい ことばを ゆうせん。おなじ ことばは 1かいに 1ど
  return fresh.concat(old).slice(0, N);
}
function startRound(mode) {
  const pool = mode === 'hiki' ? W : W.filter(q => 'lv' + q.lv === mode);
  R = { mode, qs: pickQs(pool), i: 0, res: [], newOnes: [] };
  show('play'); nextQ();
}
function renderDots() {
  $('dots').innerHTML = R.qs.map((_, i) => `<span class="${i < R.i ? (R.res[i] ? 'done' : 'miss') : i === R.i ? 'now' : ''}"></span>`).join('');
}
function nextQ() {
  if (R.i >= R.qs.length) return finish();
  renderDots(); $('after').innerHTML = ''; $('praise').classList.remove('on'); document.querySelectorAll('.spark').forEach(x => x.remove());
  R.miss = 0; R.busy = false;
  if (R.mode === 'hiki') hikiQ(); else tashiQ();
}
function markGot(q) {
  if (!save.got[q.w]) { save.got[q.w] = 1; R.newOnes.push(q.w); persist(); }
}
function afterQ(q) {
  const box = $('after');
  box.innerHTML = `<div class="explain">${explainHTML(q)}</div>`;
  const b = document.createElement('button'); b.className = 'big-btn';
  b.textContent = R.i + 1 >= R.qs.length ? 'おしまい ▶' : 'つぎへ ▶';
  b.addEventListener('click', () => { SND.tap(); R.i++; nextQ(); });
  box.appendChild(b);
}

// ---- たしざん ----
function tashiQ() {
  const q = R.qs[R.i];
  $('choices').classList.remove('hiki');
  $('prompt').textContent = 'くっつけると なんに なる？';
  $('eq').innerHTML = cardHTML(q.ae, q.a, 'ca') + '<div class="op">＋</div>' + cardHTML(q.be, q.b, 'cb') +
    '<div class="op">＝</div>' + '<div class="card q"><div class="pic">？</div><div class="wd">&nbsp;</div></div>';
  const box = $('choices'); box.innerHTML = '';
  for (const opt of shuffle([q.w, ...q.x])) {
    const b = document.createElement('button'); b.className = 'choice'; b.textContent = opt; b.dataset.v = opt;
    b.addEventListener('click', () => chooseTashi(b, opt, q));
    box.appendChild(b);
  }
}
async function chooseTashi(btn, opt, q) {
  if (R.busy) return;
  if (opt !== q.w) {
    SND.ng(); btn.classList.add('wrong'); R.miss++;
    $('prompt').textContent = R.miss >= 2 ? 'ひかって いる のが こたえだよ' : 'おしい！ もういちど えらんでね';
    if (R.miss >= 2) [...$('choices').children].forEach(c => { if (c.dataset.v === q.w) c.classList.add('hint'); });
    return;
  }
  R.busy = true; btn.classList.remove('hint'); btn.classList.add('right');
  R.res[R.i] = R.miss === 0; markGot(q);
  // がっちゃん！（2まいが まんなかに よって 1まいに なる）
  const [ca, , cb] = $('eq').children;
  const ra = ca.getBoundingClientRect(), rb = cb.getBoundingClientRect();
  const mid = (ra.left + rb.right) / 2;
  SND.slide();
  ca.style.transform = `translateX(${mid - (ra.left + ra.width / 2)}px)`;
  cb.style.transform = `translateX(${mid - (rb.left + rb.width / 2)}px)`;
  $('eq').children[1].style.opacity = 0; $('eq').children[3].style.opacity = 0; $('eq').children[4].style.opacity = 0;
  await sleep(380);
  SND.gatchan();
  $('eq').innerHTML = `<div class="card big pop"><div class="pic${pic(q.we).two ? ' two' : ''}">${pic(q.we).html}</div><div class="wd">${wordHTML(q)}</div></div>`;
  $('choices').innerHTML = '';
  $('prompt').textContent = `${q.a} ＋ ${q.b} ＝ ${q.w}`;
  SND.ok(); sparkle($('eq').firstChild); praise(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
  afterQ(q);
}

// ---- ひきざん ----
function hikiQ() {
  const q = R.qs[R.i];
  R.need = { a: false, b: false };
  $('choices').classList.add('hiki');
  $('prompt').textContent = 'どの 2つが くっついた？';
  $('eq').innerHTML = `<div class="card big" id="h-big"><div class="pic${pic(q.we).two ? ' two' : ''}">${pic(q.we).html}</div><div class="wd">${q.w}</div></div>`;
  $('choices').innerHTML = `<div class="eq" style="margin:0">
      <div class="card slot" id="h-a" style="--w:clamp(92px,24vw,140px)"><div class="pic">？</div><div class="wd">&nbsp;</div></div>
      <div class="op">＋</div>
      <div class="card slot" id="h-b" style="--w:clamp(92px,24vw,140px)"><div class="pic">？</div><div class="wd">&nbsp;</div></div></div>
    <div class="parts" id="h-parts"></div>`;
  // こたえ 2まい ＋ まちがい（くっついた あとの おと → ほかの ことばの かけら）
  const opts = [{ t: q.a, e: q.ae }, { t: q.b, e: q.be }];
  const has = t => opts.some(o => o.t === t);
  // くっついた あとの おと（あま・がさ）は、もとの えと おなじ え で まぎらわしく
  if (q.sa !== q.a) opts.push({ t: q.sa, e: q.ae });
  if (q.sb !== q.b) opts.push({ t: q.sb, e: q.be });
  for (const o of shuffle(W.flatMap(z => [{ t: z.a, e: z.ae }, { t: z.b, e: z.be }]))) {
    if (opts.length >= 6) break;
    if (!has(o.t)) opts.push(o);
  }
  const box = $('h-parts');
  for (const o of shuffle(opts)) {
    const b = document.createElement('button'); b.className = 'chip'; b.dataset.t = o.t;
    b.innerHTML = `<span class="ce">${pic(o.e).html}</span><span class="ct">${o.t}</span>`;
    b.addEventListener('click', () => chooseHiki(b, o, q));
    box.appendChild(b);
  }
}
async function chooseHiki(btn, o, q) {
  if (R.busy) return;
  const side = (o.t === q.a && !R.need.a) ? 'a' : (o.t === q.b && !R.need.b) ? 'b' : null;
  if (!side) {
    SND.ng(); btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong'); R.miss++;
    $('prompt').textContent = (o.t === q.sa || o.t === q.sb) ? 'くっつく まえの もとの ことばは？' : 'おしい！ ほかの カードかな？';
    if (R.miss >= 2) [...$('h-parts').children].forEach(c => { if ((c.dataset.t === q.a && !R.need.a) || (c.dataset.t === q.b && !R.need.b)) c.classList.add('hint'); });
    return;
  }
  SND.tap(); R.need[side] = true; btn.classList.add('used'); btn.classList.remove('hint');
  const slot = $('h-' + side);
  slot.classList.add('fill-' + side, 'pop');
  const e = side === 'a' ? q.ae : q.be;
  slot.innerHTML = `<div class="pic${pic(e).two ? ' two' : ''}">${pic(e).html}</div><div class="wd">${side === 'a' ? q.a : q.b}</div>`;
  if (!(R.need.a && R.need.b)) { $('prompt').textContent = 'あと 1つ！'; return; }
  R.busy = true; R.res[R.i] = R.miss === 0; markGot(q);
  $('h-big').classList.add('wiggle');
  await sleep(500);
  SND.pakan(); $('h-parts').remove();
  $('h-big').querySelector('.wd').innerHTML = wordHTML(q);
  $('prompt').textContent = `${q.w} ＝ ${q.a} ＋ ${q.b}`;
  SND.ok(); sparkle($('h-big')); praise(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
  afterQ(q);
}

// ---- おしまい ----
function finish() {
  const good = R.res.filter(Boolean).length;
  const stars = good >= 5 ? 3 : good >= 3 ? 2 : 1;
  save.best[R.mode] = Math.max(save.best[R.mode] || 0, stars); persist();
  $('r-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  $('r-msg').textContent = stars === 3 ? 'ぜんぶ 1かいで できたね！ ことばの はかせ！' : stars === 2 ? 'よく できました！ その ちょうし！' : 'さいごまで がんばったね！ もういちど やってみよう';
  $('r-list').innerHTML = R.qs.map(q => miniHTML(q, R.newOnes.includes(q.w))).join('');
  show('result'); SND.fanfare();
}
$('r-again').addEventListener('click', () => { SND.tap(); startRound(R.mode); });
function miniHTML(q, isNew) {
  return `<div class="mini${isNew ? ' new' : ''}"><div class="me">${pic(q.we).html}</div><div class="mt">${q.w}</div><div class="mf">${q.a}＋${q.b}</div></div>`;
}

// ------------------------------------------------------------
// ずかん
// ------------------------------------------------------------
function openZukan() {
  const n = W.filter(q => save.got[q.w]).length;
  $('z-count').textContent = `${n} / ${W.length}`;
  const box = $('z-list'); box.innerHTML = '';
  W.forEach(q => {
    const got = !!save.got[q.w];
    const d = document.createElement(got ? 'button' : 'div');
    d.className = 'mini' + (got ? '' : ' locked');
    d.innerHTML = got ? `<div class="me">${pic(q.we).html}</div><div class="mt">${q.w}</div><div class="mf">${q.a}＋${q.b}</div>`
      : `<div class="me">❔</div><div class="mt">？？？</div><div class="mf">レベル ${q.lv}</div>`;
    if (got) d.addEventListener('click', () => {
      SND.gatchan();
      box.querySelectorAll('.explain').forEach(e => e.remove());
      const ex = document.createElement('div'); ex.className = 'explain pop'; ex.style.flexBasis = '100%';
      ex.innerHTML = `<div style="font-size:48px;line-height:1.2">${pic(q.ae).html} ＋ ${pic(q.be).html} ＝ ${pic(q.we).html}</div>
        <div class="wd" style="font-weight:900;font-size:1.4em">${wordHTML(q)}</div>${explainHTML(q)}`;
      ex.querySelectorAll('svg').forEach(s => { s.style.height = '44px'; s.style.width = '44px'; });
      d.after(ex);
    });
    box.appendChild(d);
  });
  show('zukan');
}

// ------------------------------------------------------------
// じゆう（ない ことばも つくって ほぞん）
// ------------------------------------------------------------
let F = { a: null, b: null };
function comboHTML(a, b) {
  return `<div class="combo"><span class="c1">${pic(a[1]).html}</span><span class="c2">${pic(b[1]).html}</span></div>`;
}
function renderFree() {
  const set = (id, v, cls) => {
    const el = $(id);
    el.className = 'card slot' + (v ? ' ' + cls : '');
    el.innerHTML = v ? `<div class="pic">${pic(v[1]).html}</div><div class="wd">${v[0]}</div>` : '<div class="pic" style="color:#adb5bd;font-weight:900">？</div><div class="wd">&nbsp;</div>';
  };
  set('f-a', F.a, 'fill-a'); set('f-b', F.b, 'fill-b');
  const out = $('f-out');
  if (F.a && F.b) {
    out.innerHTML = comboHTML(F.a, F.b) + `<div class="wd"><span class="pa">${F.a[0]}</span><span class="pb">${F.b[0]}</span></div>`;
    out.classList.remove('pop'); void out.offsetWidth; out.classList.add('pop');
  } else out.innerHTML = '<div class="pic" style="color:#adb5bd;font-weight:900">？</div><div class="wd">&nbsp;</div>';
  $('f-save').disabled = !(F.a && F.b); $('f-save').style.opacity = (F.a && F.b) ? 1 : .4;
  document.querySelectorAll('#f-parts .chip').forEach(c => c.classList.toggle('sel', (F.a && F.a[0] === c.dataset.t) || (F.b && F.b[0] === c.dataset.t)));
}
function openFree() {
  const box = $('f-parts'); box.innerHTML = '';
  FREE.forEach(p => {
    const b = document.createElement('button'); b.className = 'chip'; b.dataset.t = p[0];
    b.innerHTML = `<span class="ce">${pic(p[1]).html}</span><span class="ct">${p[0]}</span>`;
    b.addEventListener('click', () => {
      if (!F.a) F.a = p; else if (!F.b) F.b = p; else { F.a = F.b; F.b = p; }
      if (F.a && F.b) SND.gatchan(); else SND.tap();
      renderFree();
    });
    box.appendChild(b);
  });
  freeTab('make'); renderFree(); show('free');
}
$('f-a').addEventListener('click', () => { if (F.a) { F.a = F.b; F.b = null; SND.tap(); renderFree(); } });
$('f-b').addEventListener('click', () => { if (F.b) { F.b = null; SND.tap(); renderFree(); } });
$('f-rand').addEventListener('click', () => {
  const [x, y] = shuffle(FREE.slice()); F.a = x; F.b = y; SND.gatchan(); renderFree();
});
$('f-save').addEventListener('click', () => {
  if (!(F.a && F.b)) return;
  save.works.unshift({ a: F.a, b: F.b, t: Date.now() });
  save.works = save.works.slice(0, 60); persist();
  SND.ok(); sparkle($('f-out')); praise('ほぞん したよ！');
  F = { a: null, b: null }; renderFree();
});
function freeTab(which) {
  $('f-make').style.display = which === 'make' ? 'flex' : 'none';
  $('f-gal').style.display = which === 'gal' ? 'flex' : 'none';
  $('f-tab-make').style.background = which === 'make' ? '#f3f0ff' : '#fff';
  $('f-tab-gal').style.background = which === 'gal' ? '#f3f0ff' : '#fff';
  if (which === 'gal') renderGallery();
}
$('f-tab-make').addEventListener('click', () => { SND.tap(); freeTab('make'); });
$('f-tab-gal').addEventListener('click', () => { SND.tap(); freeTab('gal'); });
function renderGallery() {
  const g = $('f-gallery'); g.innerHTML = '';
  if (!save.works.length) { g.innerHTML = '<div class="empty" style="grid-column:1/-1">まだ さくひんが ないよ。<br>「つくる」で 2まい くっつけて 💾 ほぞん しよう！</div>'; return; }
  save.works.forEach((w, i) => {
    const d = document.createElement('div'); d.className = 'gcard';
    d.innerHTML = comboHTML(w.a, w.b) + `<div class="wd"><span class="pa">${w.a[0]}</span><span class="pb">${w.b[0]}</span></div><button class="del" aria-label="けす">🗑️</button>`;
    d.querySelector('.del').addEventListener('click', () => {
      if (!confirm(`「${w.a[0]}${w.b[0]}」を けしても いい？`)) return;
      save.works.splice(i, 1); persist(); SND.tap(); renderGallery();
    });
    g.appendChild(d);
  });
}

renderTitle();
</script>
