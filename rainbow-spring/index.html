<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>レインボースプリング</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif;
    color: #3b2a55; background: #fff7e6;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; }

  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* ---- タイトル ---- */
  #title {
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 16px; overflow-y: auto;
    background: linear-gradient(180deg, #bfe9ff 0%, #fff3d6 70%, #ffe1ef 100%);
  }
  #title h1 {
    margin: 0; font-size: clamp(30px, 8vw, 54px); letter-spacing: 2px; text-align: center;
    background: linear-gradient(90deg, #ff4d6d, #ff9f1c, #f9c80e, #2dc653, #1c9bf0, #7b5cff, #e64980);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #fff);
  }
  #logo { width: min(70vw, 300px); height: min(34vw, 150px); }
  #title p { margin: 0; font-size: 17px; text-align: center; }
  .menu { display: flex; flex-direction: column; gap: 12px; width: min(92vw, 440px); }
  .big {
    display: flex; align-items: center; gap: 14px; text-align: left;
    min-height: 78px; padding: 12px 18px; border-radius: 22px;
    background: #fff; border: 4px solid var(--c); box-shadow: 0 6px 0 var(--c);
    font-size: 22px; font-weight: 700;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c); }
  .big .em { font-size: 38px; }
  .big small { display: block; font-size: 14px; font-weight: 400; margin-top: 2px; }
  .big .best { margin-left: auto; font-size: 15px; white-space: nowrap; }
  .sub { font-size: 16px; font-weight: 700; margin-top: 6px; }

  /* ---- ゲーム ---- */
  #game { flex-direction: column; background: #cfefff; }
  #bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    padding-top: max(8px, env(safe-area-inset-top));
    background: #ffffffd9; border-bottom: 3px solid #ffd6e7; z-index: 2;
  }
  .pill {
    min-width: 56px; min-height: 52px; padding: 6px 14px; border-radius: 16px;
    background: #fff; border: 3px solid #c9b6ff; font-size: 18px; font-weight: 700;
  }
  .pill:active { background: #f1ecff; }
  #info { flex: 1; text-align: center; font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  #wrap { position: relative; flex: 1; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #msg {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    max-width: 92%; padding: 10px 18px; border-radius: 18px;
    background: #fff; border: 3px solid #ffb3d1; font-size: 20px; font-weight: 700;
    text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #msg.on { opacity: 1; }
  #tools {
    position: absolute; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: none; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 10px; pointer-events: none;
  }
  #tools.on { display: flex; }
  #tools .pill { pointer-events: auto; min-height: 58px; font-size: 19px; box-shadow: 0 4px 0 #c9b6ff; }
  #tools .pill.act { background: #ffe9a8; border-color: #f5a700; box-shadow: 0 4px 0 #f5a700; }

  /* ---- けっか ---- */
  #result {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #3b2a5566; z-index: 3; padding: 16px;
  }
  #result.on { display: flex; }
  #result .box {
    width: min(92vw, 400px); padding: 22px 18px; border-radius: 26px; background: #fff;
    border: 5px solid #ffb3d1; text-align: center;
  }
  #result h2 { margin: 0 0 6px; font-size: 32px; }
  #rStars { font-size: 40px; margin: 6px 0; }
  #rText { font-size: 19px; margin: 6px 0 16px; }
  #result .row { display: flex; gap: 10px; }
  #result .row .pill { flex: 1; min-height: 62px; font-size: 20px; }
</style>
<!-- NO-ZOOM:start（tools/no-zoom.py が かきかえる。てで なおさない） -->
<style>
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { touch-action: manipulation; }
  a, button, input, select, textarea, label, summary { touch-action: manipulation; }
</style>
<script>
(function () {
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  // ピンチ（iOS は user-scalable=no を むしするので JS でも とめる）
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, stop, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if ((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) stop(e);
  }, { passive: false });
  window.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  // ダブルタップ: 2かいめの タップを とめて、かわりに click を おこす（れんだを とりこぼさない）
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var quick = now - lastT < 400 && Math.abs(t.clientX - lastX) < 50 && Math.abs(t.clientY - lastY) < 50;
    lastT = now; lastX = t.clientX; lastY = t.clientY;
    if (!quick || !e.cancelable || e.defaultPrevented || (e.touches && e.touches.length)) return;
    var el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    // ボタン・リンク・入力欄は touch-action で ズームしないので、ほんものの タップの まま とおす
    if (!el || !el.closest || el.closest("a, button, label, summary, input, textarea, select, [contenteditable], [role=button]")) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window,
      clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
  // それでも ズームして しまったら、もとの おおきさに もどす
  var vp = document.querySelector('meta[name="viewport"]');
  var vv = window.visualViewport;
  if (vp && vv) {
    var base = vp.content, fixing = false;
    var reset = function () {
      if (fixing || vv.scale <= 1.01) return;
      fixing = true;
      vp.content = base + ", minimum-scale=1";
      setTimeout(function () { vp.content = base; fixing = false; }, 300);
    };
    vv.addEventListener("resize", reset);
    vv.addEventListener("scroll", reset);
  }
})();
</script>
<!-- NO-ZOOM:end -->
</head>
<body>

<!-- タイトル -->
<div id="title" class="screen on">
  <canvas id="logo"></canvas>
  <h1>レインボースプリング</h1>
  <p>にじいろの バネで あそぼう！</p>
  <div class="menu">
    <button class="big" style="--c:#7b5cff" data-go="free">
      <span class="em">🤲</span>
      <span>じゆうに あそぶ<small>びよーん と のばして ほしを あつめよう</small></span>
    </button>
    <div class="sub">🪜 かいだん おり</div>
    <button class="big" style="--c:#2dc653" data-go="stairs" data-lv="0">
      <span class="em">🐣</span>
      <span>やさしい<small>8だん</small></span>
      <span class="best" id="best0"></span>
    </button>
    <button class="big" style="--c:#ff9f1c" data-go="stairs" data-lv="1">
      <span class="em">🐥</span>
      <span>ふつう<small>12だん・みずたまり あり</small></span>
      <span class="best" id="best1"></span>
    </button>
    <button class="big" style="--c:#ff4d6d" data-go="stairs" data-lv="2">
      <span class="em">🦅</span>
      <span>むずかしい<small>16だん・はやい</small></span>
      <span class="best" id="best2"></span>
    </button>
  </div>
</div>

<!-- ゲーム -->
<div id="game" class="screen">
  <div id="bar">
    <button class="pill" id="back" aria-label="もどる">← もどる</button>
    <div id="info"></div>
    <button class="pill" id="color" aria-label="いろを かえる">🎨</button>
    <button class="pill" id="snd" aria-label="おと">🔊</button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="msg"></div>
    <div id="tools">
      <button class="pill" id="bPin">✋ かたほう はなす</button>
      <button class="pill" id="bBoing">🌀 びよーん</button>
    </div>
    <div id="result">
      <div class="box">
        <h2>ゴール！ 🎉</h2>
        <div id="rStars"></div>
        <div id="rText"></div>
        <div class="row">
          <button class="pill" id="rAgain">もういちど</button>
          <button class="pill" id="rMenu">メニュー</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* ================= ほぞん ================= */
  var KEY = 'rainbow-spring-v1';
  var save = { sound: true, theme: 0, best: [-1, -1, -1], freeStars: 0 };
  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (raw && typeof raw === 'object') {
      if (typeof raw.sound === 'boolean') save.sound = raw.sound;
      if (typeof raw.theme === 'number') save.theme = raw.theme | 0;
      if (Array.isArray(raw.best)) for (var bi = 0; bi < 3; bi++) if (typeof raw.best[bi] === 'number') save.best[bi] = raw.best[bi];
      if (typeof raw.freeStars === 'number') save.freeStars = raw.freeStars | 0;
    }
  } catch (e) {}
  function store() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  /* ================= おと（WebAudio の ごうせいおん） ================= */
  var ac = null, noiseBuf = null;
  function AC() {
    if (!save.sound) return null;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(f, d, type, v, f2, when) {
    var a = AC(); if (!a) return;
    var t = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + 0.03);
  }
  function shaka(v) {   // バネの「シャラッ」
    var a = AC(); if (!a) return;
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate * 0.2, a.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var t = a.currentTime;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf;
    f.type = 'bandpass'; f.frequency.value = rnd(3200, 6500); f.Q.value = 2.5;
    g.gain.setValueAtTime(clamp(v, 0.01, 0.2), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t, Math.random() * 0.1, 0.06);
  }
  function sBoing() { tone(180, 0.5, 'triangle', 0.2, 520); tone(360, 0.5, 'sine', 0.08, 1040); }
  function sStar() { tone(1047, 0.12, 'triangle', 0.16); tone(1568, 0.22, 'triangle', 0.16, 0, 0.09); }
  function sLand() { tone(300, 0.1, 'triangle', 0.14, 180); shaka(0.15); }
  function sMiss() { tone(330, 0.22, 'sawtooth', 0.09, 150); }
  function sShort() { tone(260, 0.12, 'sine', 0.1, 220); }
  function sFanfare() {
    [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.22, 'triangle', 0.16, 0, i * 0.12); });
  }

  /* ================= いろ ================= */
  var THEMES = [
    { name: 'にじ', fn: function (t, back) { return 'hsl(' + (t * 300) + ',92%,' + (back ? 38 : 56) + '%)'; } },
    { name: 'パステル', fn: function (t, back) { return 'hsl(' + (t * 320) + ',85%,' + (back ? 62 : 78) + '%)'; } },
    { name: 'ゆうやけ', fn: function (t, back) { return 'hsl(' + ((300 + t * 120) % 360) + ',95%,' + (back ? 40 : 58) + '%)'; } },
    { name: 'うみ', fn: function (t, back) { return 'hsl(' + (150 + t * 110) + ',85%,' + (back ? 34 : 52) + '%)'; } },
    { name: 'きんぴか', fn: function (t, back) { return 'hsl(' + (38 + Math.sin(t * 18) * 8) + ',95%,' + ((back ? 32 : 50) + Math.sin(t * 40) * 10) + '%)'; } }
  ];
  function coilColor(t, back) { return THEMES[save.theme % THEMES.length].fn(t, back); }

  /* コイルを かく: cs = [{x,y,a(すすむ むき),t(0..1 いろ)}] */
  function drawCoils(c, cs, R, lw) {
    c.lineWidth = lw; c.lineCap = 'round';
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < cs.length; i++) {
        var k = cs[i];
        c.strokeStyle = coilColor(k.t, pass === 0);
        c.beginPath();
        c.ellipse(k.x, k.y, R, R * 0.3, k.a + Math.PI / 2, pass ? 0 : Math.PI, pass ? Math.PI : TAU);
        c.stroke();
      }
    }
  }

  /* ================= がめん ================= */
  var cv = $('cv'), ctx = cv.getContext('2d');
  var W = 300, H = 300, mode = 'title', level = 0, tNow = 0;
  var parts = [];   // かみふぶき・きらきら

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = $('wrap').getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    var oW = W, oH = H;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mode === 'free') freeResize(oW, oH);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  var msgTimer = 0;
  function say(text, ms) {
    var m = $('msg'); m.textContent = text; m.classList.add('on');
    clearTimeout(msgTimer);
    if (ms !== 0) msgTimer = setTimeout(function () { m.classList.remove('on'); }, ms || 2200);
  }
  function hush() { clearTimeout(msgTimer); $('msg').classList.remove('on'); }

  function burst(x, y, n, emoji) {
    for (var i = 0; i < n; i++) {
      var a = rnd(0, TAU), sp = rnd(80, 320);
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: rnd(0.6, 1.3), t: 0,
        hue: rnd(0, 360), emoji: emoji && Math.random() < 0.3 ? emoji : null, s: rnd(5, 10) });
    }
  }
  function drawParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt; if (p.t > p.life) { parts.splice(i, 1); continue; }
      p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = 1 - p.t / p.life;
      if (p.emoji) { ctx.font = (p.s * 2.4) + 'px sans-serif'; ctx.fillText(p.emoji, p.x, p.y); }
      else { ctx.fillStyle = 'hsl(' + p.hue + ',90%,60%)'; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
    }
    ctx.globalAlpha = 1;
  }

  function show(id) {
    $('title').classList.toggle('on', id === 'title');
    $('game').classList.toggle('on', id === 'game');
  }
  function updBest() {
    for (var i = 0; i < 3; i++) $('best' + i).textContent = save.best[i] >= 0 ? '⭐' + save.best[i] : '';
  }
  function updSnd() { $('snd').textContent = save.sound ? '🔊' : '🔇'; }

  function goTitle() {
    mode = 'title'; hush(); $('result').classList.remove('on'); $('tools').classList.remove('on');
    updBest(); show('title');
  }
  function start(m, lv) {
    AC();
    show('game'); mode = m; parts = []; hush(); $('result').classList.remove('on');
    $('tools').classList.toggle('on', m === 'free');
    resize();
    if (m === 'free') freeInit(); else { level = lv; stInit(); }
  }

  /* ================= じゆうに あそぶ（バネの ぶつり） ================= */
  var N = 26;
  var fx = new Float32Array(N), fy = new Float32Array(N), fvx = new Float32Array(N), fvy = new Float32Array(N);
  var fax = new Float32Array(N), fay = new Float32Array(N);
  var F = { S: 1, R: 30, pinB: true, grab: [null, null], stars: [], count: 0, acc: 0, hint: true };

  function freeScale() { F.S = clamp(Math.min(W, H) / 420, 0.75, 1.9); F.R = 30 * F.S; }
  function freeInit() {
    freeScale();
    F.pinB = true; F.grab = [null, null]; F.count = 0; F.acc = 0; F.stars = []; F.hint = true;
    var ax = W * 0.28, bx = W * 0.72, y = H * 0.22;
    for (var i = 0; i < N; i++) { fx[i] = lerp(ax, bx, i / (N - 1)); fy[i] = y; fvx[i] = 0; fvy[i] = 0; }
    for (var s = 0; s < 3; s++) spawnStar();
    updPin(); freeInfo();
    say('りょうはしの まるを うごかしてね', 3500);
  }
  function freeResize(oW, oH) {
    freeScale();
    for (var i = 0; i < N; i++) { fx[i] *= W / oW; fy[i] *= H / oH; }
    F.stars.forEach(function (s) { s.x *= W / oW; s.y *= H / oH; });
  }
  function freeInfo() { $('info').textContent = '⭐ ' + F.count; }
  function updPin() {
    $('bPin').textContent = F.pinB ? '✋ かたほう はなす' : '🤝 もういちど もつ';
    $('bPin').classList.toggle('act', !F.pinB);
  }
  function spawnStar() {
    var m = 50 * F.S, x = 0, y = 0;
    for (var tr = 0; tr < 30; tr++) {
      x = rnd(m, W - m); y = rnd(m + 20, H - m - 70);
      var ok = true;
      for (var i = 0; i < N; i += 2) { if (Math.hypot(fx[i] - x, fy[i] - y) < F.R * 3) { ok = false; break; } }
      if (ok) break;
    }
    F.stars.push({ x: x, y: y, ph: rnd(0, TAU), born: tNow });
  }
  function fixedNode(i) {
    if (i === 0) return true;
    if (i === N - 1) return F.pinB || F.grab[1] !== null;
    return false;
  }
  function freeStep(dt) {
    var S = F.S, G = 2000 * S, ext = Math.min(H * 0.5, 330 * S);
    var K = G * N * N / (2 * ext), C = 7, L0 = 2.5 * S, drag = 0.9;
    var sub = 8, h = dt / sub, floor = H - F.R * 0.45, i;
    for (var s = 0; s < sub; s++) {
      for (i = 0; i < N; i++) { fax[i] = 0; fay[i] = G; }
      for (i = 0; i < N - 1; i++) {
        var dx = fx[i + 1] - fx[i], dy = fy[i + 1] - fy[i];
        var len = Math.hypot(dx, dy) || 0.0001;
        var f = K * (len - L0) / len;
        var px = f * dx + C * (fvx[i + 1] - fvx[i]), py = f * dy + C * (fvy[i + 1] - fvy[i]);
        fax[i] += px; fay[i] += py; fax[i + 1] -= px; fay[i + 1] -= py;
      }
      for (i = 0; i < N; i++) {
        if (fixedNode(i)) { fvx[i] = 0; fvy[i] = 0; continue; }
        fvx[i] = (fvx[i] + fax[i] * h) * (1 - drag * h);
        fvy[i] = (fvy[i] + fay[i] * h) * (1 - drag * h);
        fx[i] += fvx[i] * h; fy[i] += fvy[i] * h;
        if (fy[i] > floor) { fy[i] = floor; if (fvy[i] > 0) fvy[i] *= -0.35; fvx[i] *= 0.96; }
        if (fx[i] < F.R * 0.6) { fx[i] = F.R * 0.6; fvx[i] = Math.abs(fvx[i]) * 0.4; }
        if (fx[i] > W - F.R * 0.6) { fx[i] = W - F.R * 0.6; fvx[i] = -Math.abs(fvx[i]) * 0.4; }
      }
    }
    // うごきに あわせて シャラシャラ
    var sp = 0;
    for (i = 0; i < N; i++) sp += Math.hypot(fvx[i], fvy[i]);

    var r = logo.getBoundingClientRect(); if (r.width < 10) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (logo.width !== Math.round(r.width * dpr)) { logo.width = Math.round(r.width * dpr); logo.height = Math.round(r.height * dpr); }
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.clearRect(0, 0, r.width, r.height);
    var w = r.width, h = r.height, n = 34, cs = [], R = h * 0.2;
    var wob = Math.sin(tNow * 2) * w * 0.03;
    for (var i = 0; i < n; i++) {
      var u = i / (n - 1), a = Math.PI * (1 - u);
      var rx = w * 0.34 + wob, ry = h * 0.62 + Math.sin(tNow * 2.6) * h * 0.04;
      cs.push({ x: w / 2 + Math.cos(a) * rx, y: h * 0.86 - Math.sin(a) * ry, a: Math.atan2(-Math.cos(a) * ry, Math.sin(a) * rx), t: u });
    }
    drawCoils(lctx, cs, R, 3);
  }

  /* ================= ループ ================= */
  var prev = 0;
  function frame(ms) {
    var dt = Math.min(0.033, (ms - prev) / 1000 || 0.016); prev = ms; tNow = ms / 1000;
    if (mode === 'title') drawLogo();
    else if (mode === 'free') { freeStep(dt); freeDraw(); drawParts(dt); }
    else if (mode === 'stairs' && st) { stUpdate(dt); stDraw(); drawParts(dt); }
    requestAnimationFrame(frame);
  }
  updBest(); updSnd();
  requestAnimationFrame(frame);
})();
</script>
